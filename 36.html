<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>36</title></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/36/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:35.125%;top:3.822916666666667%;width:29.25%;height:.6979166666666661%" data-text="AND AINAR LEFT THE PARTY." onclick="showTextTooltip(event,this)" data-translation="E AINAR DEIXOU O GRUPO." data-tips="💡 'Left the party' é uma expressão comum em jogos e aventuras, significando que alguém saiu do grupo ou equipe. Similar a 'deixou o grupo'."></div><div class="text-hotspot" style="left:11.875%;top:9.546875%;width:38.125%;height:.6927083333333334%" data-text="IT WASN'T ACTUALLY BECAUSE OF..." onclick="showTextTooltip(event,this)" data-translation="NÃO FOI REALMENTE POR CAUSA DE..." data-tips="💡 'Actually' é um falso cognato, pois não significa 'atualmente', mas sim 'na verdade'."></div><div class="text-hotspot" style="left:31.374999999999996%;top:10.619791666666668%;width:30%;height:.6927083333333334%" data-text="HER NEW OUTWARD APPEARANCE." onclick="showTextTooltip(event,this)" data-translation="SUA NOVA APARÊNCIA EXTERIOR."></div><div class="text-hotspot" style="left:12.125%;top:15.541666666666668%;width:56.875%;height:.9479166666666667%" data-text="ONE OF THE ELDERS IN OUR SACRED GROUNDS, THE ONE HIGHLY RESPECTED AS A GREAT SWORDSMAN," onclick="showTextTooltip(event,this)" data-translation="UM DOS ANCIÃOS EM NOSSAS TERRAS SAGRADAS, ALTAMENTE RESPEITADO COMO UM GRANDE ESPADACHIM," data-tips="💡 'Highly respected' é uma estrutura comum para indicar que alguém é muito respeitado, semelhante a 'altamente respeitado' em português."></div><div class="text-hotspot" style="left:42.125%;top:17.036458333333336%;width:45.875%;height:.96875%" data-text="APPARENTLY SAW POTENTIAL IN AINAR AND OFFERED TO TAKE HER IN AS A PUPIL." onclick="showTextTooltip(event,this)" data-translation="APARENTEMENTE VIU POTENCIAL EM AINAR E OFERECEU-SE PARA ACEITÁ-LA COMO ALUNA." data-tips="💡 'Take her in as a pupil' usa o phrasal verb 'take in', que aqui significa aceitar ou acolher alguém. Exemplo: 'They took in the stray cat.'"></div><div class="text-hotspot" style="left:38%;top:21.75%;width:6%;height:.375%" data-text="HER 29ER" onclick="showTextTooltip(event,this)" data-translation="HER 29ER"></div><div class="text-hotspot" style="left:21%;top:21.885416666666664%;width:5.875%;height:.296875%" data-text="Yn for Lo Haley Lat" onclick="showTextTooltip(event,this)" data-translation="Yn for Lo Haley Lat"></div><div class="text-hotspot" style="left:21.875%;top:22.90625%;width:6.5%;height:.24479166666666669%" data-text="Out La Bok" onclick="showTextTooltip(event,this)" data-translation="Out La Bok"></div><div class="text-hotspot" style="left:15.375%;top:29.776041666666668%;width:69%;height:1.4635416666666667%" data-text="AINAR THOUGHT IT WAS A GOOD OPPORTUNITY TO UP HER GAME AND DECIDED TO TRAIN UNDER THE ELDER STARTING TODAY" onclick="showTextTooltip(event,this)" data-translation="AINAR ACHOU QUE ERA UMA BOA OPORTUNIDADE PARA MELHORAR E DECIDIU TREINAR COM O ANCIÃO A PARTIR DE HOJE." data-tips="💡 'Up her game' é uma expressão idiomática que significa melhorar suas habilidades ou desempenho. Equivalente a 'melhorar seu jogo'."></div><div class="text-hotspot" style="left:12%;top:35.625%;width:46.5%;height:1.2083333333333333%" data-text="WHY CAN'T YOU TAKE A DAY OFF AND GO INTO THE LABYRINTH WITH ME?" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ NÃO PODE TIRAR UM DIA DE FOLGA E IR AO LABIRINTO COMIGO?" data-tips="💡 'Take a day off' é uma expressão usada para dizer que alguém vai tirar um dia de folga do trabalho ou de uma atividade."></div><div class="text-hotspot" style="left:57.49999999999999%;top:41.484375%;width:23.5%;height:.4322916666666667%" data-text="I WOULD LOVE TO," onclick="showTextTooltip(event,this)" data-translation="EU ADORARIA,"></div><div class="text-hotspot" style="left:19.875%;top:42.635416666666664%;width:61.875%;height:1.46875%" data-text="BUT THERE IS A SPECIAL TRAINING COURSE THAT FORBIDS ME FROM LEAVING THE SACRED GROUNDS FOR SIX MONTHS." onclick="showTextTooltip(event,this)" data-translation="MAS HÁ UM CURSO DE TREINAMENTO ESPECIAL QUE ME PROÍBE DE SAIR DAS TERRAS SAGRADAS POR SEIS MESES." data-tips="💡 'Forbids me from leaving' usa a estrutura 'forbid someone from doing something', que é usada para proibir alguém de fazer algo."></div><div class="text-hotspot" style="left:18.75%;top:51.28125%;width:14.000000000000002%;height:.828125%" data-text="00" onclick="showTextTooltip(event,this)" data-translation="00"></div><div class="text-hotspot" style="left:24.125%;top:52.40625%;width:32.25%;height:.9479166666666667%" data-text="WAIT. IS SHE TALKING ABOUT THAT TRAINING COURSE?" onclick="showTextTooltip(event,this)" data-translation="ESPERA. ELA ESTÁ FALANDO SOBRE AQUELE CURSO DE TREINAMENTO?"></div><div class="text-hotspot" style="left:19.375%;top:58.005208333333336%;width:33%;height:.6875%" data-text="THAT MAKES A LOT OF SENSE, THEN." onclick="showTextTooltip(event,this)" data-translation="ENTÃO ISSO FAZ MUITO SENTIDO." data-tips="💡 'That makes a lot of sense' é uma expressão usada para concordar que algo é lógico ou razoável. Equivalente a 'isso faz muito sentido'."></div><div class="text-hotspot" style="left:54.125%;top:59.28125%;width:28.625%;height:.6927083333333334%" data-text="IT REALLY IS AN AMAZING OPPORTUNITY." onclick="showTextTooltip(event,this)" data-translation="REALMENTE É UMA OPORTUNIDADE INCRÍVEL."></div><div class="text-hotspot" style="left:16.125%;top:64.609375%;width:34.75%;height:.6927083333333334%" data-text="I WON'T ASK YOU TO WAIT FOR ME..." onclick="showTextTooltip(event,this)" data-translation="NÃO VOU PEDIR PARA VOCÊ ME ESPERAR..."></div><div class="text-hotspot" style="left:32.375%;top:65.58333333333334%;width:47.125%;height:1.2083333333333144%" data-text="OR TO ACCEPT ME BACK INTO YOUR PARTY NO MATTER WHAT LATER ON." onclick="showTextTooltip(event,this)" data-translation="OU ME ACEITAR DE VOLTA NO SEU GRUPO NÃO IMPORTA O QUE ACONTEÇA MAIS TARDE." data-tips="💡 'No matter what' é uma expressão que significa 'não importa o que aconteça'. Usada para indicar determinação ou inevitabilidade."></div><div class="text-hotspot" style="left:34%;top:71.40104166666667%;width:31.75%;height:.48958333333333337%" data-text="I WILL DO MY BEST..." onclick="showTextTooltip(event,this)" data-translation="FAREI O MEU MELHOR..."></div><div class="text-hotspot" style="left:17.5%;top:77.47916666666667%;width:66.25%;height:1.6302083333333286%" data-text="...AND BECOME AN EXCELLENT WARRIOR BEFORE I RETURN, SO AS TO AVOID HOLDING YOU BACK IN BATTLES." onclick="showTextTooltip(event,this)" data-translation="...E ME TORNAREI UMA EXCELENTE GUERREIRA ANTES DE VOLTAR, PARA NÃO ATRAPALHÁ-LOS NAS BATALHAS." data-tips="💡 'So as to avoid' é uma estrutura formal usada para indicar propósito, semelhante a 'para não'."></div><div class="text-hotspot" style="left:60.25%;top:82.69270833333333%;width:31.5%;height:.8072916666666667%" data-text="GULD" onclick="showTextTooltip(event,this)" data-translation="GULD"></div><div class="text-hotspot" style="left:16.375%;top:84.74479166666666%;width:31.125000000000004%;height:.7760416666666666%" data-text="GULP" onclick="showTextTooltip(event,this)" data-translation="GULP"></div><div class="text-hotspot" style="left:61.25000000000001%;top:86.40104166666667%;width:30%;height:.609375%" data-text="GULP" onclick="showTextTooltip(event,this)" data-translation="GULP"></div><div class="text-hotspot" style="left:3.125%;top:97.78645833333334%;width:34.875%;height:1.0833333333333335%" data-text="PHEW" onclick="showTextTooltip(event,this)" data-translation="UFA"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/36/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:31.25%;top:3.494791666666667%;width:36.5%;height:.7083333333333333%" data-text="I COULDN'T STOP AINAR FROM LEAVING." onclick="showTextTooltip(event,this)" data-translation="NÃO CONSEGUI IMPEDIR AINAR DE PARTIR." data-tips="💡 'Couldn't stop' é uma estrutura que indica que alguém não conseguiu impedir algo de acontecer, semelhante a 'não consegui impedir'."></div><div class="text-hotspot" style="left:21.25%;top:9.401041666666666%;width:50.875%;height:.9635416666666667%" data-text="DURING THE SECOND TRIP INTO THE LABYRINTH, AINAR WAS INCAPACITATED BY THE PLUNDERER..." onclick="showTextTooltip(event,this)" data-translation="DURANTE A SEGUNDA VIAGEM AO LABIRINTO, AINAR FOI INCAPACITADA PELO SAQUEADOR..." data-tips="💡 'Incapacitated' é uma palavra útil que significa que alguém foi impossibilitado de agir ou continuar."></div><div class="text-hotspot" style="left:57.25%;top:13.375%;width:3.125%;height:.3125%" data-text="口" onclick="showTextTooltip(event,this)" data-translation="口"></div><div class="text-hotspot" style="left:26.375%;top:15.010416666666668%;width:9.375%;height:.4583333333333333%" data-text="XXXXXXXX" onclick="showTextTooltip(event,this)" data-translation="XXXXXXXX"></div><div class="text-hotspot" style="left:53.5%;top:24.354166666666664%;width:12%;height:.16666666666666669%" data-text="...AND" onclick="showTextTooltip(event,this)" data-translation="...E"></div><div class="text-hotspot" style="left:52%;top:24.354166666666664%;width:31.125%;height:.9375000000000036%" data-text="HAD TO SWEAR AN OATH AGAINST HER WILL." onclick="showTextTooltip(event,this)" data-translation="TEVE QUE JURAR UM VOTO CONTRA SUA VONTADE." data-tips="💡 'Against her will' significa fazer algo contra a própria vontade de alguém."></div><div class="text-hotspot" style="left:22.125%;top:30.348958333333332%;width:55.25%;height:1.4635416666666679%" data-text="SHE ALSO MOSTLY WATCHED FROM THE SIDELINE AGAINST THE BOSS IN THE RIFT WHILE OTHERS DID THEIR BEST TO WIN THE FIGHT." onclick="showTextTooltip(event,this)" data-translation="ELA TAMBÉM FICOU PRINCIPALMENTE ASSISTINDO DE FORA CONTRA O CHEFE NA FENDA, ENQUANTO OS OUTROS FAZIAM O MELHOR PARA VENCER A LUTA." data-tips="💡 'From the sideline' é uma expressão que significa observar algo sem participar ativamente, semelhante a 'assistir de fora'."></div><div class="text-hotspot" style="left:18%;top:43.27083333333333%;width:32.375%;height:.703125%" data-text="THAT PROBABLY IS THE BIGGEST REASON..." onclick="showTextTooltip(event,this)" data-translation="PROVAVELMENTE ESSA É A MAIOR RAZÃO..."></div><div class="text-hotspot" style="left:13%;top:45.65625%;width:26.625%;height:.71875%" data-text="BITE" onclick="showTextTooltip(event,this)" data-translation="MORDIDA"></div><div class="text-hotspot" style="left:56.99999999999999%;top:47.239583333333336%;width:29.375%;height:.421875%" data-text="...SHE MADE THIS DECISION." onclick="showTextTooltip(event,this)" data-translation="...ELA TOMOU ESSA DECISÃO."></div><div class="text-hotspot" style="left:33.875%;top:54.40625%;width:32.25%;height:.9374999999999929%" data-text="I NEED TO LOOK FOR NEW COMPANIONS NOW." onclick="showTextTooltip(event,this)" data-translation="PRECISO PROCURAR NOVOS COMPANHEIROS AGORA."></div><div class="text-hotspot" style="left:15.5%;top:58.65104166666667%;width:49.875%;height:1.5572916666666667%" data-text="TAP" onclick="showTextTooltip(event,this)" data-translation="TAP"></div><div class="text-hotspot" style="left:30.125%;top:64.67708333333333%;width:39.625%;height:.9583333333333333%" data-text="OF COURSE, THERE IS AN OPTION TO EXPLORE AREAS BY MYSELF." onclick="showTextTooltip(event,this)" data-translation="CLARO, HÁ A OPÇÃO DE EXPLORAR AS ÁREAS SOZINHO." data-tips="💡 'By myself' significa fazer algo sozinho, sem ajuda de outros."></div><div class="text-hotspot" style="left:26.75%;top:71.90104166666667%;width:45.875%;height:1.1510416666666667%" data-text="I AM FAR MORE SKILLED THAN HOW I WAS JUST TWO MONTHS AGO." onclick="showTextTooltip(event,this)" data-translation="ESTOU MUITO MAIS HABILIDOSO DO QUE ERA HÁ APENAS DOIS MESES." data-tips="💡 'Far more skilled' significa 'muito mais habilidoso', indicando uma grande melhoria em habilidade."></div><div class="text-hotspot" style="left:13.750000000000002%;top:82.4375%;width:54.75%;height:.953125%" data-text="I CONSUMED ESSENCES OF THE UNDEAD GOLEM AND A VAMPIRE, ONE OF WHICH WAS A GUARDIAN." onclick="showTextTooltip(event,this)" data-translation="CONSUMI ESSÊNCIAS DO GOLEM MORTO-VIVO E DE UM VAMPIRO, UM DOS QUAIS ERA UM GUARDIÃO."></div><div class="text-hotspot" style="left:17.5%;top:90.35416666666667%;width:47.625%;height:1.234375%" data-text="MY BASE STATS ROSE DRASTICALLY, NOT TO MENTION NEW ABILITIES AND SKILLS I ACQUIRED IN THE PROCESS." onclick="showTextTooltip(event,this)" data-translation="MEUS ATRIBUTOS BÁSICOS AUMENTARAM DRASTICAMENTE, SEM CONTAR AS NOVAS HABILIDADES E COMPETÊNCIAS QUE ADQUIRI NO PROCESSO." data-tips="💡 'Not to mention' é um conector usado para adicionar informações extras, semelhante a 'sem contar'."></div><div class="text-hotspot" style="left:38%;top:91.921875%;width:43%;height:1.2083333333333428%" data-text="NO MONSTER WILL BE ABLE TO GIVE ME TROUBLE ON THE FIRST OR SECOND FLOOR NOW." onclick="showTextTooltip(event,this)" data-translation="NENHUM MONSTRO SERÁ CAPAZ DE ME DAR PROBLEMAS NO PRIMEIRO OU SEGUNDO ANDAR AGORA."></div><div class="text-hotspot" style="left:18.75%;top:98.078125%;width:48.5%;height:1.0572916666666714%" data-text="HOWEVER, THAT IS NOT THE CASE ON THE THIRD FLOOR AND ABOVE." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, ESSE NÃO É O CASO NO TERCEIRO ANDAR E ACIMA." data-tips="💡 'That is not the case' é uma expressão usada para indicar que algo não se aplica ou não é verdade em uma situação específica."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/36/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:0;top:6.260416666666667%;width:99.25%;height:4.406250000000001%" data-text="8 DUNGEON AND STONE PRETTY MUCH FORCES THE PLAYER TO FORM A MULTI-MEMBER PARTY. DUE TO THE STRUCTURE OF THE GAME, IT IS IMPOSSIBLE TO SOLO-CLEAR THIS GAME REGARDLESS OF HOW POWERFUL THE CHARACTER IS." onclick="showTextTooltip(event,this)" data-translation="8 DUNGEON AND STONE PRATICAMENTE FORÇA O JOGADOR A FORMAR UM GRUPO COM VÁRIOS MEMBROS. DEVIDO À ESTRUTURA DO JOGO, É IMPOSSÍVEL COMPLETAR O JOGO SOZINHO, NÃO IMPORTA QUÃO PODEROSO O PERSONAGEM SEJA."></div><div class="text-hotspot" style="left:7.875%;top:15.552083333333332%;width:37.25%;height:1.1875%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:64.375%;top:17.963541666666664%;width:29.5%;height:.8541666666666666%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:12.625%;top:22.802083333333336%;width:45.5%;height:.9479166666666667%" data-text="LACK OF CERTAIN CLASSES IS FATAL AS THE PARTY ASCENDS TO HIGHER FLOORS." onclick="showTextTooltip(event,this)" data-translation="A FALTA DE CERTAS CLASSES É FATAL À MEDIDA QUE O GRUPO SOBE PARA ANDARES MAIS ALTOS." data-tips="💡 'As the party ascends' usa 'ascend', que significa subir ou avançar para níveis mais altos."></div><div class="text-hotspot" style="left:46.5%;top:24.416666666666668%;width:42.625%;height:.9635416666666667%" data-text="IT IS VITAL TO RECRUIT MEMBERS THAT ARE TALENTED IN DIFFERENT AREAS." onclick="showTextTooltip(event,this)" data-translation="É VITAL RECRUTAR MEMBROS QUE SEJAM TALENTOSOS EM DIFERENTES ÁREAS." data-tips="💡 'It is vital' é uma maneira formal de dizer que algo é extremamente importante ou essencial."></div><div class="text-hotspot" style="left:12.625%;top:30.671875%;width:38.625%;height:.6822916666666666%" data-text="THAT IS WHY I MUST FIND COMPANIONS THAT ARE RELIABLE," onclick="showTextTooltip(event,this)" data-translation="É POR ISSO QUE PRECISO ENCONTRAR COMPANHEIROS QUE SEJAM CONFIÁVEIS," data-tips="💡 'That is why' é um conector usado para explicar a razão ou motivo por trás de algo."></div><div class="text-hotspot" style="left:42.125%;top:32.380208333333336%;width:45.125%;height:.9322916666666643%" data-text="IN ORDER TO HUNT DOWN TOUGHER MONSTERS AND MOVE UP." onclick="showTextTooltip(event,this)" data-translation="PARA CAÇAR MONSTROS MAIS DIFÍCEIS E SUBIR."></div><div class="text-hotspot" style="left:73.625%;top:34.770833333333336%;width:26.125%;height:.6927083333333334%" data-text="CREAK" onclick="showTextTooltip(event,this)" data-translation="CREAK"></div><div class="text-hotspot" style="left:30.375000000000004%;top:35.96875%;width:7.625%;height:.328125%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:59.12500000000001%;top:43.723958333333336%;width:19.249999999999993%;height:.7031249999999929%" data-text="OH, YOU'RE HERE." onclick="showTextTooltip(event,this)" data-translation="OH, VOCÊ ESTÁ AQUI."></div><div class="text-hotspot" style="left:28.625%;top:50.463541666666664%;width:46%;height:1.0520833333333286%" data-text="IF I CAN RECRUIT ARUA RAVEN, TIER-6 MAGE FROM THE TOWER..." onclick="showTextTooltip(event,this)" data-translation="SE EU CONSEGUI
