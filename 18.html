5%" data-text="THEY'RE ALL HUMONGOUS AND PROBABLY REQUIRE NOTHING BUT STRENGTH TO WIELD THEM. PERFECT FOR MY KIND." onclick="showTextTooltip(event,this)" data-translation="SÃO TODAS ENORMES E PROVAVELMENTE EXIGEM APENAS FORÇA PARA MANUSEÁ-LAS. PERFEITAS PARA O MEU TIPO."></div><div class="text-hotspot" style="left:3.25%;top:63.307291666666664%;width:37.25%;height:.7604166666666667%" data-text="BULKY" onclick="showTextTooltip(event,this)" data-translation="VOLUMOSO"></div><div class="text-hotspot" style="left:63.125%;top:65.58333333333334%;width:34.25%;height:.6770833333333334%" data-text="BULKY" onclick="showTextTooltip(event,this)" data-translation="VOLUMOSO"></div><div class="text-hotspot" style="left:37.625%;top:67.109375%;width:47.5%;height:.9583333333333333%" data-text="... I WANT SOMETHING MORE ORDINARY AND SMALLER." onclick="showTextTooltip(event,this)" data-translation="...QUERO ALGO MAIS COMUM E MENOR."></div><div class="text-hotspot" style="left:10.5%;top:69.078125%;width:42.5%;height:1.2083333333333428%" data-text="THESE WEAPONS WOULD DEFINITELY INCREASE THE DAMAGE OUTPUT BY A LOT," onclick="showTextTooltip(event,this)" data-translation="ESSAS ARMAS DEFINITIVAMENTE AUMENTARIAM MUITO O DANO,"></div><div class="text-hotspot" style="left:28.125%;top:71.125%;width:61.12499999999999%;height:1.203125%" data-text="BUT THE SIZE OF THESE MAY GET IN THE WAY SINCE I CAN KILL MOST MONSTERS ON THE FIRST FLOOR EVEN WITHOUT SUCH POWER ANYWAYS." onclick="showTextTooltip(event,this)" data-translation="MAS O TAMANHO DELAS PODE ATRAPALHAR, JÁ QUE POSSO MATAR A MAIORIA DOS MONSTROS NO PRIMEIRO ANDAR MESMO SEM TAL PODER."></div><div class="text-hotspot" style="left:25.374999999999996%;top:78.921875%;width:32%;height:.6822916666666666%" data-text="HOW ABOUT THIS ONE THEN?" onclick="showTextTooltip(event,this)" data-translation="QUE TAL ESTA ENTÃO?"></div><div class="text-hotspot" style="left:65.625%;top:85.44270833333333%;width:18.5%;height:.4114583333333333%" data-text="THIS IS NICE!" onclick="showTextTooltip(event,this)" data-translation="ISSO É BOM!"></div><div class="text-hotspot" style="left:29.375%;top:87.11979166666667%;width:40.625%;height:.9479166666666714%" data-text="A FAIRLY HUMONGOUS MACE, WORTH 220K STONES." onclick="showTextTooltip(event,this)" data-translation="UMA MANGUAL BASTANTE ENORME, VALENDO 220K PEDRAS."></div><div class="text-hotspot" style="left:15.625%;top:90.359375%;width:62.5%;height:.8854166666666666%" data-text="YOU HAVE EQUIPPED SLIGHTLY LARGER MACE. YOUR OVERALL ITEM LEVEL INCREASED BY 85." onclick="showTextTooltip(event,this)" data-translation="VOCÊ EQUIPOU UMA MANGUAL LIGEIRAMENTE MAIOR. SEU NÍVEL GERAL DE ITEM AUMENTOU EM 85."></div><div class="text-hotspot" style="left:10.375%;top:95.203125%;width:49.75%;height:1.2291666666666714%" data-text="NEXT IS A CUSTOM-MADE HELMET, SINCE THE ARMORER HAD NONE THAT FIT MY HEAD, FOR 170K STONES." onclick="showTextTooltip(event,this)" data-translation="EM SEGUIDA, UM CAPACETE FEITO SOB MEDIDA, JÁ QUE O ARMEIRO NÃO TINHA NENHUM QUE CABESSE NA MINHA CABEÇA, POR 170K PEDRAS."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/18/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:46.25%;top:.8020833333333333%;width:42.5%;height:1.2239583333333333%" data-text="AND THEN A HALF-PLATE CHEST ARMOR THAT FIT LIKE A CHARM, FOR 360K STONES." onclick="showTextTooltip(event,this)" data-translation="E ENTÃO UMA ARMADURA DE PEITO MEIO-PLACA QUE SERVIU COMO UMA LUVA, POR 360K PEDRAS."></div><div class="text-hotspot" style="left:7.75%;top:5.239583333333334%;width:74%;height:.6875%" data-text="YOU HAVE EQUIPPED CRUDE HELMET. YOUR OVERALL ITEM LEVEL INCREASED BY 47." onclick="showTextTooltip(event,this)" data-translation="VOCÊ EQUIPOU UM CAPACETE RÚSTICO. SEU NÍVEL GERAL DE ITEM AUMENTOU EM 47."></div><div class="text-hotspot" style="left:15.875%;top:7.40625%;width:71.625%;height:.8906249999999999%" data-text="YOU HAVE EQUIPPED SLIGHTLY STURDY HALF-BREASTPLATE. YOUR OVERALL ITEM LEVEL INCREASED BY 57." onclick="showTextTooltip(event,this)" data-translation="VOCÊ EQUIPOU UMA MEIA-PEITO LIGEIRAMENTE RESISTENTE. SEU NÍVEL GERAL DE ITEM AUMENTOU EM 57."></div><div class="text-hotspot" style="left:10.375%;top:12.770833333333334%;width:79.5%;height:.6822916666666666%" data-text="I STILL HAD ABOUT 50,000 STONES LEFT EVEN AFTER PURCHASING ALL ITEMS I WANTED." onclick="showTextTooltip(event,this)" data-translation="AINDA TINHA CERCA DE 50.000 PEDRAS SOBRANDO MESMO DEPOIS DE COMPRAR TODOS OS ITENS QUE QUERIA."></div><div class="text-hotspot" style="left:10.5%;top:20.036458333333336%;width:49.875%;height:.9531249999999964%" data-text="SOME TIME AFTER LEAVING THE LABYRINTH FOR THE FIRST TIME..." onclick="showTextTooltip(event,this)" data-translation="ALGUM TEMPO DEPOIS DE SAIR DO LABIRINTO PELA PRIMEIRA VEZ..."></div><div class="text-hotspot" style="left:42%;top:22.375%;width:15.875%;height:.35416666666666663%" data-text="GOOD OLD SIR!" onclick="showTextTooltip(event,this)" data-translation="BOM VELHO SENHOR!"></div><div class="text-hotspot" style="left:41%;top:26.114583333333336%;width:48.75%;height:.6770833333333334%" data-text="...MY DAILY ROUTINE WAS NATURALLY ESTABLISHED." onclick="showTextTooltip(event,this)" data-translation="...MINHA ROTINA DIÁRIA FOI NATURALMENTE ESTABELECIDA."></div><div class="text-hotspot" style="left:25.25%;top:31.036458333333332%;width:48.875%;height:.953125%" data-text="I WOULD WAKE UP AT 7 AM IN THE MORNING AND HAVE BREAKFAST WITH ERWEN." onclick="showTextTooltip(event,this)" data-translation="EU ACORDAVA ÀS 7 DA MANHÃ E TOMAVA CAFÉ DA MANHÃ COM ERWEN."></div><div class="text-hotspot" style="left:46.875%;top:32.557291666666664%;width:42.375%;height:.39583333333333337%" data-text="ISN'T IT FAR FROM YOUR PLACE HERE?" onclick="showTextTooltip(event,this)" data-translation="NÃO É LONGE DA SUA CASA AQUI?"></div><div class="text-hotspot" style="left:3.25%;top:33.036458333333336%;width:39.125%;height:.6614583333333334%" data-text="B-BUT IT'S CHEAP HERE, AND THE FOOD IS GOOD!" onclick="showTextTooltip(event,this)" data-translation="M-MAS É BARATO AQUI, E A COMIDA É BOA!"></div><div class="text-hotspot" style="left:29.875%;top:39.94270833333333%;width:40.25%;height:.6822916666666666%" data-text="THEN I HEAD TO THE LIBRARY AND READ BOOKS UNTIL 4 PM." onclick="showTextTooltip(event,this)" data-translation="ENTÃO VOU PARA A BIBLIOTECA E LEIO LIVROS ATÉ AS 16H."></div><div class="text-hotspot" style="left:63.375%;top:41.479166666666664%;width:12.5%;height:.43750000000000006%" data-text="ZZ ZZ" onclick="showTextTooltip(event,this)" data-translation="ZZ ZZ"></div><div class="text-hotspot" style="left:10.25%;top:42.213541666666664%;width:18.5%;height:.4322916666666667%" data-text="SLEEPING AGAIN?" onclick="showTextTooltip(event,this)" data-translation="DORMINDO DE NOVO?"></div><div class="text-hotspot" style="left:5.625%;top:50.328125%;width:58.25%;height:1.2239583333333286%" data-text="AFTER THAT, I TRY TO VISIT A PUB OR RESTAURANT THAT I'VE NEVER BEEN TO BEFORE TO TAKE CARE OF DINNER," onclick="showTextTooltip(event,this)" data-translation="DEPOIS DISSO, TENTO VISITAR UM PUB OU RESTAURANTE QUE NUNCA FUI ANTES PARA CUIDAR DO JANTAR,"></div><div class="text-hotspot" style="left:42.625%;top:52.07291666666667%;width:45.375%;height:.953125%" data-text="AND GATHER INFORMATION THAT I COULDN'T FROM JUST READING BOOKS." onclick="showTextTooltip(event,this)" data-translation="E RECOLHER INFORMAÇÕES QUE NÃO PODIA APENAS LENDO LIVROS."></div><div class="text-hotspot" style="left:.25%;top:53.083333333333336%;width:34.25%;height:.7395833333333334%" data-text="BUSTLE" onclick="showTextTooltip(event,this)" data-translation="BUSTLE"></div><div class="text-hotspot" style="left:24.75%;top:53.979166666666664%;width:38.5%;height:.6458333333333334%" data-text="SO THE MONSTER OVER THERE..." onclick="showTextTooltip(event,this)" data-translation="ENTÃO O MONSTRO ALI..."></div><div class="text-hotspot" style="left:36.25%;top:54.984375%;width:26.375%;height:.6927083333333334%" data-text="די" onclick="showTextTooltip(event,this)" data-translation="די"></div><div class="text-hotspot" style="left:10.875%;top:55.057291666666664%;width:14.124999999999998%;height:.5833333333333334%" data-text="EL" onclick="showTextTooltip(event,this)" data-translation="EL"></div><div class="text-hotspot" style="left:57.75%;top:56.703125%;width:40.5%;height:1.9479166666666665%" data-text="THAT MUST'VE BEEN A TIGHT SQUEEZE! BUSTLE" onclick="showTextTooltip(event,this)" data-translation="DEVE TER SIDO UM APERTO! BUSTLE"></div><div class="text-hotspot" style="left:58.75%;top:61.546875%;width:36.625%;height:1.390625%" data-text="OM NOM" onclick="showTextTooltip(event,this)" data-translation="OM NOM"></div><div class="text-hotspot" style="left:54.25%;top:63.72916666666667%;width:32.875%;height:.703125%" data-text="THIS PLACE HAS TERRIBLE FOOD FOR THE PRICE." onclick="showTextTooltip(event,this)" data-translation="ESSE LUGAR TEM UMA COMIDA TERRÍVEL PELO PREÇO."></div><div class="text-hotspot" style="left:28.875%;top:69.16666666666667%;width:54.75%;height:1.2135416666666572%" data-text="AROUND 5 PM, I VISIT ANGRY RHINO INN, WHERE THE BARBARIANS ARE STAYING, FOR SPARRING MATCHES." onclick="showTextTooltip(event,this)" data-translation="POR VOLTA DAS 17H, VISITO A POUSADA RHINO FURIOSO, ONDE OS BÁRBAROS ESTÃO HOSPEDADOS, PARA LUTAS DE TREINO."></div><div class="text-hotspot" style="left:27.375%;top:71.29166666666666%;width:32.25%;height:.8541666666666666%" data-text="HI-YAH" onclick="showTextTooltip(event,this)" data-translation="HI-YAH"></div><div class="text-hotspot" style="left:59.75%;top:74.546875%;width:36.875%;height:1.0625%" data-text="WHOA" onclick="showTextTooltip(event,this)" data-translation="UOU"></div><div class="text-hotspot" style="left:3.5000000000000004%;top:79.58854166666667%;width:63.87500000000001%;height:2.71875%" data-text="BA" onclick="showTextTooltip(event,this)" data-translation="BA"></div><div class="text-hotspot" style="left:24.875%;top:94.36458333333333%;width:50.000000000000014%;height:.9635416666666714%" data-text="I BEGAN SPARRING WITH BARBARIANS OTHER THAN AINAR A WEEK INTO TRAINING." onclick="showTextTooltip(event,this)" data-translation="COMECEI A TREINAR COM BÁRBAROS ALÉM DE AINAR UMA SEMANA APÓS O TREINAMENTO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/18/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:52.625%;top:0;width:26.375%;height:.234375%" data-text="NEXT!!" onclick="showTextTooltip(event,this)" data-translation="PRÓXIMO!!"></div><div class="text-hotspot" style="left:2.125%;top:3.3229166666666665%;width:24.5%;height:.625%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:65%;top:3.7760416666666665%;width:4.75%;height:.19791666666666669%" data-text="b" onclick="showTextTooltip(event,this)" data-translation="b"></div><div class="text-hotspot" style="left:73.125%;top:3.9739583333333335%;width:25.874999999999996%;height:.765625%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:10%;top:9.088541666666666%;width:40.125%;height:.984375%" data-text="THEY DIDN'T REALLY HAVE MARTIAL ARTS TECHNIQUES LIKE I HAD IMAGINED," onclick="showTextTooltip(event,this)" data-translation="ELES REALMENTE NÃO TINHAM TÉCNICAS DE ARTES MARCIAIS COMO EU IMAGINAVA,"></div><div class="text-hotspot" style="left:37.125%;top:10.130208333333334%;width:53.625%;height:1.2083333333333321%" data-text="BUT THEIR INSTINCTIVE REFLEXES AND RATHER BARBARIC WAY OF COMBAT HELPED ME OUT A LOT." onclick="showTextTooltip(event,this)" data-translation="MAS SEUS REFLEXOS INSTINTIVOS E MANEIRA BASTANTE BÁRBARA DE COMBATE ME AJUDARAM MUITO."></div><div class="text-hotspot" style="left:17.125%;top:14.234375%;width:64.125%;height:.7343749999999982%" data-text="YOUR REFLEX WAS SLIGHTLY INCREASED DUE TO REPETITIVE TRAINING." onclick="showTextTooltip(event,this)" data-translation="SEU REFLEXO FOI LIGEIRAMENTE AUMENTADO DEVIDO AO TREINAMENTO REPETITIVO."></div><div class="text-hotspot" style="left:4.375%;top:16.807291666666664%;width:58.62500000000001%;height:.7239583333333333%" data-text="YOUR FLEXIBILITY WAS SLIGHTLY INCREASED DUE TO REPETITIVE TRAINING." onclick="showTextTooltip(event,this)" data-translation="SUA FLEXIBILIDADE FOI LIGEIRAMENTE AUMENTADA DEVIDO AO TREINAMENTO REPETITIVO."></div><div class="text-hotspot" style="left:20.875%;top:18.598958333333336%;width:70.375%;height:.7239583333333333%" data-text="YOUR DYNAMIC VISUAL ACUITY WAS SLIGHTLY INCREASED DUE TO REPETITIVE TRAINING." onclick="showTextTooltip(event,this)" data-translation="SUA ACUIDADE VISUAL DINÂMICA FOI LIGEIRAMENTE AUMENTADA DEVIDO AO TREINAMENTO REPETITIVO."></div><div class="text-hotspot" style="left:58.5%;top:20.770833333333332%;width:28.000000000000004%;height:.8489583333333334%" data-text="DING" onclick="showTextTooltip(event,this)" data-translation="DING"></div><div class="text-hotspot" style="left:1.625%;top:22.442708333333332%;width:67.75%;height:.17708333333333331%" data-text="PHYSIQUE STAT INCREASED BY 1." onclick="showTextTooltip(event,this)" data-translation="STATUS DE FÍSICO AUMENTADO EM 1."></div><div class="text-hotspot" style="left:13.625000000000002%;top:30.015625%;width:37%;height:.4635416666666667%" data-text="DUE TO THE SERIES OF TRAININGS," onclick="showTextTooltip(event,this)" data-translation="DEVIDO À SÉRIE DE TREINAMENTOS,"></div><div class="text-hotspot" style="left:36.875%;top:30.880208333333332%;width:45.625%;height:.9583333333333333%" data-text="I ACTUALLY MANAGED TO SNAG A FEW WINS EVEN AGAINST AINAR." onclick="showTextTooltip(event,this)" data-translation="EU REALMENTE CONSEGUI GANHAR ALGUMAS VEZE
