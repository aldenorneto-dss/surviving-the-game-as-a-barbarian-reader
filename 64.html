💡 Em inglês, o uso de &quot;ON&quot; para andares é comum, enquanto em português usamos &quot;NO&quot;. Aqui, &quot;ON THE 2ND FLOOR&quot; se refere a algo que acontece no segundo andar de um edifício ou estrutura. - **Exemplo**: The meeting is **on** the 3rd floor. - **Exemplo**: The restaurant is **on** the top floor."></div><div class="text-hotspot" style="left:13.25%;top:82.13020833333333%;width:23.125%;height:.33333333333333337%" data-text="BLEED" onclick="showTextTooltip(event,this)" data-translation="SANGRAR"></div><div class="text-hotspot" style="left:63%;top:84.82291666666667%;width:32%;height:.8645833333333334%" data-text="BLEEP" onclick="showTextTooltip(event,this)" data-translation="BLEEP"></div><div class="text-hotspot" style="left:31.374999999999996%;top:89.09895833333333%;width:37.125%;height:.765625%" data-text="THIS IS ABSOLUTELY RIDICULOUS." onclick="showTextTooltip(event,this)" data-translation="ISSO É ABSURDO."></div><div class="text-hotspot" style="left:15.5%;top:93.69791666666667%;width:41.875%;height:1.4687499999999858%" data-text="... HOW MANY PLAYERS HAVE REACHED THE SECOND FLOOR ON THEIR FIRST TRY?" onclick="showTextTooltip(event,this)" data-translation="... QUANTOS JOGADORES CHEGARAM AO SEGUNDO ANDAR NA PRIMEIRA TENTATIVA?" data-tips="💡 A expressão &quot;ON THEIR FIRST TRY&quot; significa &quot;na primeira tentativa&quot;. O uso de &quot;ON&quot; aqui é uma preposição que indica a ocasião ou circunstância. - **Exemplo**: She passed the exam **on** her first try. - **Exemplo**: He won the race **on** his first attempt."></div><div class="text-hotspot" style="left:58.375%;top:96.34375%;width:32%;height:.6875%" data-text="117, IF I REMEMBER CORRECTLY." onclick="showTextTooltip(event,this)" data-translation="117, SE ME LEMBRO CORRETAMENTE."></div><div class="text-hotspot" style="left:28.375%;top:99.69791666666666%;width:10.5%;height:.16145833333333334%" data-text="AND HOW MANY OF THOSE PLAYERS HAD SUCH BAD LUCK?" onclick="showTextTooltip(event,this)" data-translation="E QUANTOS DESSES JOGADORES TIVERAM TANTA MÁ SORTE?" data-tips="💡 A expressão &quot;SUCH BAD LUCK&quot; é usada para enfatizar a intensidade da má sorte. &quot;Such&quot; é usado para dar ênfase a um adjetivo. - **Exemplo**: I've never seen **such** a beautiful sunset. - **Exemplo**: It was **such** a difficult exam."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/64/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:12.125%;top:0;width:43%;height:.9010416666666667%" data-text="AND HOW MANY OF THOSE PLAYERS HAD SUCH BAD LUCK?" onclick="showTextTooltip(event,this)" data-translation="E QUANTOS DESSES JOGADORES TIVERAM TANTA MÁ SORTE?"></div><div class="text-hotspot" style="left:67.375%;top:2.265625%;width:15.25%;height:.171875%" data-text="NONE." onclick="showTextTooltip(event,this)" data-translation="NENHUM."></div><div class="text-hotspot" style="left:27.250000000000004%;top:7.40625%;width:47.25%;height:.9479166666666661%" data-text="NOT EVEN PLAYERS WITH YEARS OF EXPERIENCE HAVE THESE STATS." onclick="showTextTooltip(event,this)" data-translation="NEM MESMO JOGADORES COM ANOS DE EXPERIÊNCIA TÊM ESSAS ESTATÍSTICAS." data-tips="💡 &quot;NOT EVEN&quot; é uma expressão usada para enfatizar que algo é verdade, mesmo em casos que seriam esperados o contrário. É uma forma de intensificar a negação. - **Exemplo**: **Not even** the best players could solve the puzzle. - **Exemplo**: **Not even** my brother, who is very strong, could lift it."></div><div class="text-hotspot" style="left:0;top:8.583333333333334%;width:95.75%;height:3.630208333333332%" data-text="BLEEP [BJORN YANDEL] LEVEL: 3 (NEW+1) PHYSIQUE: 199.1 (NEW+87.7) SPIRIT: 105.3 (NEW+10) SPECIAL ABILITY: 152.4 (NEW+129.4) ITEM LEVEL: 114 (NEW-104) GENERAL COMBAT POWER: 485.3(NEW+201.1) ESSENCE ACQUIRED: UNDEAD GOLEM-TIER 7 VAMPIRE-GUARDIAN-TIER 5 (NEW)" onclick="showTextTooltip(event,this)" data-translation="BLEEP [BJORN YANDEL] NÍVEL: 3 (NOVO+1) FÍSICO: 199.1 (NOVO+87.7) ESPÍRITO: 105.3 (NOVO+10) HABILIDADE ESPECIAL: 152.4 (NOVO+129.4) NÍVEL DO ITEM: 114 (NOVO-104) PODER DE COMBATE GERAL: 485.3(NOVO+201.1) ESSÊNCIA ADQUIRIDA: GOLEM UNDEAD-TIER 7 VAMPIRE-GUARDIAN-TIER 5 (NOVO)"></div><div class="text-hotspot" style="left:26.625%;top:14.249999999999998%;width:46.875%;height:.9427083333333334%" data-text="HOW COULD HE HAVE ACCOMPLISHED THIS MUCH IN JUST TWO MONTHS?" onclick="showTextTooltip(event,this)" data-translation="COMO ELE CONSEGUIU TANTO EM APENAS DOIS MESES?" data-tips="💡 O uso do tempo verbal &quot;COULD HAVE ACCOMPLISHED&quot; refere-se a algo que era possível de ter sido feito no passado, mas não necessariamente foi. É uma estrutura do passado do &quot;can&quot; em uma forma condicional. - **Exemplo**: She **could have won** the race if she had tried harder. - **Exemplo**: We **could have visited** the museum, but it was closed."></div><div class="text-hotspot" style="left:15.75%;top:19.635416666666668%;width:55.00000000000001%;height:1.484375%" data-text="EVEN IF HE'S HAD BAD LUCK, HE'S ALSO HAD GOOD LUCK. I DON'T THINK IT'S ENTIRELY IMPOSSIBLE--" onclick="showTextTooltip(event,this)" data-translation="MESMO QUE ELE TENHA TIDO MÁ SORTE, TAMBÉM TEVE BOA SORTE. NÃO ACHO QUE SEJA TOTALMENTE IMPOSSÍVEL--" data-tips="💡 &quot;EVEN IF&quot; é uma conjunção que introduz uma condição hipotética e improvável. - **Exemplo**: **Even if** it rains, we will go to the park. - **Exemplo**: **Even if** you apologize, he might not forgive you."></div><div class="text-hotspot" style="left:7.124999999999999%;top:27.046874999999996%;width:66.625%;height:1.4947916666666714%" data-text="IF THIS WAS SOMETHING ACHIEVABLE THROUGH SHEER LUCK, THERE HAS TO HAVE BEEN SIMILAR CASES AS HE." onclick="showTextTooltip(event,this)" data-translation="SE ISSO FOSSE ALGO ALCANÇÁVEL APENAS COM SORTE, TEM QUE TER HAVIDO CASOS SIMILARES COMO ELE."></div><div class="text-hotspot" style="left:71.5%;top:29.65625%;width:9.5%;height:.17708333333333331%" data-text="OH." onclick="showTextTooltip(event,this)" data-translation="OH."></div><div class="text-hotspot" style="left:12.625%;top:33.34375%;width:57.75%;height:1.2135416666666714%" data-text="BUT THIS IS ABSOLUTELY UNPRECEDENTED, AND THUS IMPOSSIBLE TO EVEN FATHOM." onclick="showTextTooltip(event,this)" data-translation="MAS ISSO É ABSOLUTAMENTE SEM PRECEDENTES, E ASSIM IMPOSSÍVEL DE SE IMAGINAR." data-tips="💡 A palavra &quot;THUS&quot; é um conector formal que significa &quot;portanto&quot; ou &quot;assim&quot;, usado para indicar resultado ou consequência. - **Exemplo**: He didn't study for the exam, **thus**, he failed. - **Exemplo**: The company lost a lot of money, **thus**, they had to lay off workers."></div><div class="text-hotspot" style="left:35.375%;top:35.06770833333333%;width:53.5%;height:1.328125%" data-text="THIS IS AN IRREGULARITY BEYOND WHAT STATISTICS COULD EXPLAIN." onclick="showTextTooltip(event,this)" data-translation="ISSO É UMA IRREGULARIDADE ALÉM DO QUE AS ESTATÍSTICAS PODERIAM EXPLICAR." data-tips="💡 A expressão &quot;BEYOND WHAT&quot; é usada para indicar algo que está fora do alcance ou capacidade de algo. - **Exemplo**: Her beauty is **beyond what** words can describe. - **Exemplo**: The problem was **beyond what** we could solve."></div><div class="text-hotspot" style="left:17.5%;top:42.34375%;width:54.37499999999999%;height:.96875%" data-text="IN STATISTICS, THE VARIABLE OF LUCK BECOMES LESS RELEVANT AS SAMPLE SIZE INCREASES." onclick="showTextTooltip(event,this)" data-translation="EM ESTATÍSTICAS, A VARIÁVEL DA SORTE SE TORNA MENOS RELEVANTE À MEDIDA QUE O TAMANHO DA AMOSTRA AUMENTA." data-tips="💡 A expressão &quot;AS SAMPLE SIZE INCREASES&quot; usa &quot;AS&quot; para indicar que uma coisa acontece simultaneamente com outra. Aqui, à medida que o tamanho da amostra aumenta, a relevância da sorte diminui. - **Exemplo**: **As** time goes by, we learn more. - **Exemplo**: **As** the sun sets, the temperature drops."></div><div class="text-hotspot" style="left:23%;top:46.578125%;width:53.5%;height:.8489583333333334%" data-text="HOWEVER, THERE ARE CASES LIKE THIS ALBEIT EXTREMELY RARE." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, HÁ CASOS COMO ESTE, EMBORA EXTREMAMENTE RAROS." data-tips="💡 &quot;ALBEIT&quot; é uma conjunção formal que significa &quot;embora&quot; ou &quot;apesar de&quot;. É usada para introduzir uma ideia que contrasta com a anterior. - **Exemplo**: The journey was beautiful, **albeit** tiring. - **Exemplo**: He managed to finish the task, **albeit** with some help."></div><div class="text-hotspot" style="left:32.125%;top:49.255208333333336%;width:54.25%;height:.9375000000000071%" data-text="HOW FAR IS THE PLACE YOU MET THE BARBARIAN FROM HERE?" onclick="showTextTooltip(event,this)" data-translation="QUÃO LONGE FICA O LUGAR ONDE VOCÊ ENCONTROU O BÁRBARO DAQUI?" data-tips="💡 A pergunta &quot;HOW FAR IS...FROM...?&quot; é uma estrutura comum para perguntar a distância entre dois lugares. - **Exemplo**: **How far is** the school **from** your house? - **Exemplo**: **How far is** the park **from** here?"></div><div class="text-hotspot" style="left:43.875%;top:54.885416666666664%;width:49.625%;height:1.2135416666666665%" data-text="...I WOULD SAY APPROXIMATELY 9 MILES, IF THERE IS NO SHORTCUT I'M UNAWARE OF." onclick="showTextTooltip(event,this)" data-translation="...EU DIRIA APROXIMADAMENTE 9 MILHAS, SE NÃO HOUVER UM ATALHO QUE EU NÃO CONHEÇA." data-tips="💡 &quot;IF THERE IS NO SHORTCUT I'M UNAWARE OF&quot; usa &quot;IF&quot; para introduzir uma condição, e &quot;UNAWARE OF&quot; significa &quot;não estar ciente de&quot;. - **Exemplo**: **If** there is no traffic, we will arrive on time. - **Exemplo**: She was **unaware of** the changes in the schedule."></div><div class="text-hotspot" style="left:10.125%;top:58.42708333333333%;width:46.5%;height:1.2239583333333333%" data-text="TO THINK HE CRAWLED ot; ou &quot;Luggage left unattended will be removed.&quot;."></div><div class="text-hotspot" style="left:58.25%;top:25.088541666666668%;width:34.625%;height:.9322916666666667%" data-text="DADDY, CAN YOU BUY ME A BARBARIAN TOO?" onclick="showTextTooltip(event,this)" data-translation="PAPAI, VOCÊ PODE ME COMPRAR UM BÁRBARO TAMBÉM?" data-tips="💡 'CAN YOU BUY ME' é uma estrutura usada para pedir algo que alguém compre para você."></div><div class="text-hotspot" style="left:0;top:25.890625%;width:36.125%;height:.8229166666666666%" data-text="CLAMOR" onclick="showTextTooltip(event,this)" data-translation="CLAMOR"></div><div class="text-hotspot" style="left:55.875%;top:29.114583333333332%;width:37.5%;height:.6614583333333334%" data-text="CLAMOR" onclick="showTextTooltip(event,this)" data-translation="CLAMOR"></div><div class="text-hotspot" style="left:11.75%;top:31.5625%;width:29.5%;height:.9583333333333286%" data-text="LOOK AT THOSE HORNS. SO SCARY." onclick="showTextTooltip(event,this)" data-translation="OLHE PARA AQUELES CHIFRES. TÃO ASSUSTADOR."></div><div class="text-hotspot" style="left:4.25%;top:33.08333333333333%;width:36.5%;height:.515625%" data-text="CLAMOR" onclick="showTextTooltip(event,this)" data-translation="CLAMOR"></div><div class="text-hotspot" style="left:48.125%;top:33.4375%;width:41.25%;height:.9583333333333333%" data-text="HE'S LIKE THE ANCIENT DEMON PARSEIRA." onclick="showTextTooltip(event,this)" data-translation="ELE É COMO O ANTIGO DEMÔNIO PARSEIRA."></div><div class="text-hotspot" style="left:9.125%;top:37.416666666666664%;width:22.5%;height:.48958333333333337%" data-text="WHAT AM I AN ANIMAL AT THE ZOO?" onclick="showTextTooltip(event,this)" data-translation="O QUE EU SOU, UM ANIMAL NO ZOOLÓGICO?"></div><div class="text-hotspot" style="left:23.625%;top:38.338541666666664%;width:29.375%;height:.6875%" data-text="I'M ABOUT TO SUFFER FROM PTSD..." onclick="showTextTooltip(event,this)" data-translation="ESTOU PRESTES A SOFRER DE PTSD..." data-tips= : &quot;That's the best idea I've heard all day!&quot; ou &quot;That's the best news I've heard all day!&quot;."></div><div class="text-hotspot" style="left:28.625%;top:69.68229166666666%;width:36.625%;height:.953125%" data-text="IS IT ALRIGHT FOR YOU NOT TO HANG OUT WITH THEM?" onclick="showTextTooltip(event,this)" data-translation="ESTÁ TUDO BEM PARA VOCÊ NÃO FICAR COM ELES?" data-tips="💡 'HANG OUT' é uma expressão informal que significa 'passar tempo junto'."></div><div class="text-hotspot" style="left:70.5%;top:72.19270833333333%;width:18.625%;height:.4270833333333333%" data-text="SIGH" onclick="showTextTooltip(event,this)" data-translation="SUSPIRO"></div><div class="text-hotspot" style="left:33.75%;top:77.03645833333333%;width:53.875%;height:1.4739583333333428%" data-text="THEY WOULDN'T WANT ME TO, ANYWAYS, BECAUSE I USED TO BE AN ADVENTURER LIKE YOU." onclick="showTextTooltip(event,this)" data-translation="ELES NÃO IRIAM QUERER QUE EU FICASSE, DE QUALQUER FORMA, PORQUE EU COSTUMAVA SER UM AVENTUREIRO COMO VOCÊ." data-tips="💡 A expressão **&quot;used to be&quot;** é usada para falar sobre algo que era verdade no passado, mas não é mais. É útil para descrever hábitos ou estados passados. Exemplos: &quot;I used to be a teacher.&quot; ou &quot;He used to live in New York.&quot;."></div><div class="text-hotspot" style="left:26.25%;top:83.21875%;width:27.500000000000004%;height:.9322916666666667%" data-text="NO WONDER HE APPEARED SO HUMBLE." onclick="showTextTooltip(event,this)" data-translation="NÃO É À TOA QUE ELE PARECEU TÃO HUMILDE." data-tips="💡 'NO WONDER' é uma expressão que significa 'não é de se admirar'."></div><div class="text-hotspot" style="left:46%;top:84.90104166666667%;width:41.625%;height:.9583333333333286%" data-text="I AM BJORN, SON OF YANDEL. WHAT IS YOUR NAME?" onclick="showTextTooltip(event,this)" data-translation="EU SOU BJORN, FILHO DE YANDEL. QUAL É O SEU NOME?"></div><div class="text-hotspot" style="left:55.00000000000001%;top:92.171875%;w
