th:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/89/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:36.25%;top:3.0729166666666665%;width:25.874999999999996%;height:.9479166666666667%" data-text="...MAYBE IT'S NOT TOO LATE YET." onclick="showTextTooltip(event,this)" data-translation="...TALVEZ AINDA NÃO SEJA TARDE DEMAIS." data-tips="💡 A expressão &quot;it's not too late&quot; é frequentemente usada para indicar que ainda há tempo para fazer algo. É similar a &quot;ainda dá tempo&quot; em português.

- **Judging by** his expression, he didn't like the news."></div><div class="text-hotspot" style="left:.5%;top:14.286458333333332%;width:26.375%;height:.7395833333333334%" data-text="RISE" onclick="showTextTooltip(event,this)" data-translation="LEVANTAR"></div><div class="text-hotspot" style="left:26.875%;top:19.458333333333332%;width:63.875%;height:1.46875%" data-text="WE ARE PROBABLY ONLY ABOUT THIRTY MINUTES BEHIND THE FIRST PARTY THAT PASSED THROUGH THE PORTAL." onclick="showTextTooltip(event,this)" data-translation="PROVAVELMENTE ESTAMOS APENAS UNS TRINTA MINUTOS ATRÁS DO PRIMEIRO GRUPO QUE PASSOU PELO PORTAL." data-tips="💡 &quot;Only about&quot; é uma expressão que suaviza a quantidade, indicando que é uma estimativa aproximada. Similar a &quot;mais ou menos&quot; em português.

- The book is **only about** 200 pages long."></div><div class="text-hotspot" style="left:38.25%;top:24.614583333333336%;width:52.125%;height:1.2239583333333333%" data-text="IF WE HURRY, WE MIGHT BE ABLE TO GET PAST THEM ON THE SECOND FLOOR." onclick="showTextTooltip(event,this)" data-translation="SE NOS APRESSARMOS, PODEMOS CONSEGUIR PASSÁ-LOS NO SEGUNDO ANDAR." data-tips="💡 &quot;If we hurry&quot; é uma estrutura condicional que sugere uma ação necessária para alcançar um resultado. Equivale a &quot;se nos apressarmos&quot;.

75%;top:52.44270833333333%;width:47.5%;height:.6927083333333334%" data-text="THESE FOUR POP UP RANDOMLY AFTER EACH STAGE IS CLEARED." data-translation="ESSES QUATRO APARECEM ALEATORIAMENTE APÓS CADA ESTÁGIO SER CONCLUÍDO." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Pop up&quot; é um phrasal verb que significa surgir ou aparecer de repente. Em português, seria &quot;aparecer&quot; ou &quot;surgir&quot;.
- New problems **pop up** every day.
- Opportunities can **pop up** when you least expect them."></div><div class="text-hotspot" style="left:49.875%;top:53.85416666666667%;width:41.625%;height:.4531249999999929%" data-text="EXCEPT THE FIRST STAGE, WHERE ALL FOUR BECOME AVAILABLE." data-translation="EXCETO NO PRIMEIRO ESTÁGIO, ONDE TODOS OS QUATRO FICAM DISPONÍVEIS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12%;top:57.348958333333336%;width:47.375%;height:1.21875%" data-text="COURAGE LETS ADVENTURERS ADVANCE TO THE NEXT STAGE WITHOUT A PARTICULAR PROBLEM..." data-translation="CORAGEM PERMITE QUE OS AVENTUREIROS AVANCEM PARA O PRÓXIMO ESTÁGIO SEM UM PROBLEMA PARTICULAR..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:68.625%;top:59.744791666666664%;width:11.125%;height:.48958333333333337%" data-text="&amp;" data-translation="&amp;" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.375%;top:63.5625%;width:52.87500000000001%;height:.96875%" data-text="...BUT ONLY AFTER A FOUR-HOUR COOLDOWN IS OVER AFTER KILLING ALL THE MONSTERS." data-translation="...MAS SOMENTE APÓS UM TEMPO DE ESPERA DE QUATRO HORAS APÓS MATAR TODOS OS MONSTROS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.375%;top:68.55208333333334%;width:64.875%;height:.9791666666666667%" data-text="WISDOM FORCES ADVENTURERS TO PASS THROUGH A COMPLICATED PATH FULL OF MONSTERS OR TRAPS..." data-translation="SABEDORIA OBRIGA OS AVENTUREIROS A PASSAREM POR UM CAMINHO COMPLICADO CHEIO DE MONSTROS OU ARMADILHAS..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:45.125%;top:71.18229166666666%;width:7.625%;height:.265625%" data-text="0" data-translation="0" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.875%;top:72.33854166666667%;width:16.125%;height:.4270833333333333%" data-text="AAAAA" data-translation="AAAAA" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:33.625%;top:72.375%;width:19.625%;height:2.557291666666667%" data-text="poodbo" data-translation="poodbo" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:51.24999999999999%;top:75.09375%;width:15%;height:.984375%" data-text="фо" data-translation="фо" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.625%;top:77.6875%;width:60.12499999999999%;height:.9635416666666667%" data-text="...BUT LETS THEM ADVANCE FIVE STORIES AT ONCE WITHOUT COOLDOWN, SO IS PREFERRED BY EXPERTS." data-translation="...MAS PERMITE QUE ELES AVANCEM CINCO ANDARES DE UMA VEZ SEM TEMPO DE ESPERA, POR ISSO É PREFERIDO POR ESPECIALISTAS." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;On the other hand&quot; é um conector usado para introduzir uma ideia contrastante. Similar a &quot;por outro lado&quot; em português.
- I love summer. **On the other hand**, winter has its charm.
- She's very talented. **On the other hand**, she can be quite lazy."></div><div class="text-hotspot" style="left:9.625%;top:83.09375%;width:45.75%;height:.703125%" data-text="ON THE OTHER HAND, ENDURANCE IS HATED BY EVERYONE." data-translation="POR OUTRO LADO, RESISTÊNCIA É ODIADA POR TODOS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.375%;top:85.54166666666667%;width:5%;height:.052083333333333336%" data-text="84" data-translation="84" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.75%;top:85.94270833333333%;width:37.5%;height:.4791666666666856%" data-text="I'LL BE REALLY ALL ALONE IF YOU ABANDON ME TOOOO!" data-translation="Eu vou ficar realmente sozinho se vocês me abandonarem também!" onclick="showTextTooltip(event,this)" data-tips="💡 &quot;All alone&quot; pode ser traduzido de forma mais coloquial como &quot;completamente sozinho&quot;. **All alone** é uma expressão que enfatiza a solidão completa, sem ninguém ao redor. Exemplo: *She felt all alone in the big city.*"></div><div class="text-hotspot" style="left:6%;top:88.734375%;width:27.250000000000004%;height:.671875%" data-text="WEAPONS I FORGE ARE NO BETTER THAN SCRAP METAL..." data-translation="As armas que eu forjo não são melhores do que sucata..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.125%;top:89.70833333333333%;width:51.125%;height:.9583333333333333%" data-text="ADVENTURERS MUST OVERCOME THE TRIAL IN WHICH THEY'RE REMINDED OF THEIR FAILURES." data-translation="Os aventureiros devem superar a prova em que são lembrados de seus fracassos." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Must&quot; indica obrigação ou necessidade. **Must** é usado para expressar algo que é necessário ou obrigatório. Exemplo: *You must wear a helmet when riding a bike.*"></div><div class="text-hotspot" style="left:28.000000000000004%;top:91.25520833333334%;width:21%;height:.10416666666666667%" data-text="SO ANNOYING." data-translation="Tão irritante." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.750000000000004%;top:95.01041666666666%;width:35.875%;height:.6927083333333428%" data-text="BUT THIS TRIAL DROPS A CHEST IN THE END." data-translation="Mas essa prova deixa um baú no final." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40%;top:96.44270833333334%;width:47.375%;height:.9479166666666572%" data-text="IF LUCKY, A NUMBERED ITEM OR A TIER-6 ESSENCE CAN BE FOUND IN IT." data-translation="Se tiver sorte, um item numerado ou uma essência de nível 6 pode ser encontrado nele." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;If lucky&quot; é uma forma condensada de dizer &quot;se alguém tiver sorte&quot;. Em inglês, é comum omitir o sujeito quando ele é óbvio pelo contexto. Exemplo: *If lucky, you might win the prize.*"></div><div class="text-hotspot" style="left:46.875%;top:99.50520833333333%;width:21.875%;height:.4635416666666667%" data-text="TSK" data-translation="Tsc" onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/89/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:46.375%;top:.7135416666666666%;width:19.125%;height:.43750000000000006%" data-text="JUST MANA STONES?" data-translation="Apenas pedras de mana?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24.75%;top:2.8854166666666665%;width:20.375%;height:.484375%" data-text="IF LUCKY, THAT IS." data-translation="Se tiver sorte, é claro." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:44.125%;top:3.947916666666667%;width:21.125%;height:.11979166666666666%" data-text="SO ANNOYING." data-translation="Tão irritante." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40%;top:8.4375%;width:19.375%;height:.421875%" data-text="LASTLY, DESTINY." data-translation="Por último, Destino." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.125%;top:11.552083333333334%;width:55.50000000000001%;height:.7708333333333334%" data-text="...I'M PLANNING TO LEAVE THE TEAM AFTER THIS TRIP." data-translation="...Estou planejando deixar o time depois desta viagem." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Planning to&quot; é usado para indicar intenções futuras. **Planning to** expressa o que alguém pretende fazer. Exemplo: *I'm planning to start a new project next month.*"></div><div class="text-hotspot" style="left:22.5%;top:16.703125%;width:3.75%;height:.15625%" data-text="?" data-translation="?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:72.625%;top:19.223958333333332%;width:25.5%;height:.9062499999999999%" data-text="-ZZZ" data-translation="-ZZZ" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13.25%;top:21.838541666666668%;width:34.125%;height:.703125%" data-text="EARLY MORNING ON THE 19TH DAY OF THE TRIP" data-translation="Madrugada do 19º dia da viagem" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:46.75%;top:25.708333333333332%;width:32.875%;height:.6822916666666666%" data-text="...IS THAT BECAUSE OF ME?" data-translation="...É por minha causa?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.5%;top:32.90104166666667%;width:45.375%;height:.9583333333333333%" data-text="IT WAS SURPRISING, BUT I KINDA EXPECTED HIM TO SAY THIS EVENTUALLY." data-translation="Foi surpreendente, mas meio que esperava que ele dissesse isso eventualmente." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Kinda&quot; é uma forma coloquial de &quot;kind of&quot;, que significa &quot;meio que&quot;. É uma expressão informal usada para suavizar a afirmação. Exemplo: *I'm kinda tired today.*"></div><div class="text-hotspot" style="left:45.875%;top:34.63541666666667%;width:36.125%;height:.9479166666666667%" data-text="IT'S ONE OF MANY SCENARIOS I HAD TAKEN INTO ACCOUNT." data-translation="É um dos muitos cenários que eu tinha levado em conta." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Take into account&quot; significa considerar ou levar em conta. **Take into account** é um phrasal verb que indica considerar algo ao fazer uma decisão. Exemplo: *We need to take the weather into account when planning the event.*"></div><div class="text-hotspot" style="left:24.375%;top:39.401041666666664%;width:51.75%;height:1.015625%" data-text="NO. IT'S BECAUSE OF ME." data-translation="Não. É por minha causa." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.25%;top:49.541666666666664%;width:27%;height:.625%" data-text="HUH?" data-translation="Hã?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.75%;top:50.473958333333336%;width:30.375000000000004%;height:.421875%" data-text="WHAT DO YOU MEAN?" data-translation="O que você quer dizer?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:43.125%;top:55.13541666666667%;width:40.5%;height:.703125%" data-text="LET ME GET A PIECE OF DRIED MEAT." data-translation="Deixe-me pegar um pedaço de carne seca." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:5.25%;top:56.213541666666664%;width:34.875%;height:.9322916666666667%" data-text="SWISH" data-translation="SWISH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.625%;top:65.08854166666667%;width:12.875%;height:.10416666666666667%" data-text="THANKS." data-translation="Obrigado." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.250000000000004%;top:65.58854166666667%;width:49.375%;height:1.2083333333333333%" data-text="I CAN'T SAY THE DISTRICT CHIEF REALLY HAD NOTHING TO DO WITH MY DECISION." data-translation="Não posso dizer que o chefe do distrito realmente não teve nada a ver com minha decisão." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Really had nothing to do with&quot; é uma forma de enfatizar que algo não está relacionado. **Had nothing to do with** é usado para negar relação ou responsabilidade. Exemplo: *The accident had nothing to do with the weather.*"></div><div class="text-hotspot" style="left:13.875000000000002%;top:67.10416666666667%;width:32.875%;height:1.203125%" data-text="WHO WOULDN'T BE TEMPTED BY SUCH AN OFFER?" data-translation="Quem não ficaria tentado por uma oferta dessas?" onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Who wouldn't be tempted&quot; é uma pergunta retórica. Usada para afirmar que qualquer pessoa ficaria tentada. Exemplo: *Who wouldn't be excited about winning the lottery?*"></div><div class="text-hotspot" style="left:14.625%;top:70.109375%;width:26.5%;height:.53125%" data-text="CHEW" data-translation="MASTIGAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:33.625%;top:74.36458333333333%;width:39.625%;height:1.2291666666666714%" data-text="WORKING AS A NAVIGATOR AT A HUGE CLAN? NOW, THAT IS BIG." data-translation="Trabalhar como navegador em um grande clã? Isso é grande." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.5%;top:79.64583333333334%;width:53.375%;height:1.2187499999999858%" data-text="I KNEW IT WAS AN EMPTY PROMISE, BUT MY HEART WAS BEATING REALLY FAST." data-translation="Eu sabia que era uma promessa vazia, mas meu coração estava batendo muito rápido." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.875%;top:81.55729166666667%;width:48.375%;height:1.2135416666666665%" data-text="THAT'S WHEN I REALIZED THAT IT WAS TIME FOR ME TO LEAVE THE TEAM." data-translation="Foi quando percebi que era hora de deixar o time." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;That's when&quot; é usado para introduzir o momento em que algo foi percebido. **That's when** ajuda a destacar um ponto específico no tempo. Exemplo: *That's when I realized I had lost my keys.*"></div><div class="text-hotspot" style="left:37.125%;top:91.046875%;width:54.25%;height:.6822916666666666%" data-text="BUT PLEASE DON'T FEEL BAD ABOUT ME OR ANYTHING." data-translation="Mas, por favor, não se sinta mal por mim ou algo assim." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.25%;top:92.55208333333333%;width:40.375%;height:.6875%" data-text="I'M QUITE USED TO IT." data-translation="Estou bastante acostumado com isso." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.625%;top:97.34375%;width:64.375%;height:1.2083333333333428%" data-text="NON-HUMANS... NO. THOSE WITH SPECIAL TALENTS RISE THROUGH THE RANKS FAIRLY EASILY." data-translation="Não-humanos... Não. Aqueles com talentos especiais sobem de posição com bastante facilidade." onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/89/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:16.25%;top:14.249999999999998%;width:67.125%;height:1.9947916666666665%" data-text="I HAD BEEN IN MANY DIFFERENT PARTIES FOR THE PAST EIGHT YEARS, AND WAS LEFT BEHIND MANY TIMES BECAUSE I COULDN'T KEEP UP WITH OTHERS." data-translation="Estive em muitas equipes diferentes nos últimos oito anos e fui deixado para trás muitas vezes porque não conseguia acompanhar os outros." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Keep up with&quot; significa acompanhar ou manter o ritmo. **Keep up with** é um phrasal verb que indica a capacidade de não ficar para trás. Exemplo: *She walks so fast that I can barely keep up with her.*"></div><div class="text-hotspot" style="left:14.499999999999998%;top:19.375%;width:70.75%;height:1.4635416666666667%" data-text="I SOMETIMES GOT KICKED OUT, AND WALKED OUT ON MY OWN IN OTHER SITUATIONS BEFORE THINGS GOT OUT OF CONTROL." data-translation="Às vezes fui expulso, e em outras situações saí por conta própria antes que as coisas saíssem do controle." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Walked out on my own&quot; significa sair por conta própria. **Walk out** é um phrasal verb que pode significar sair de uma situação, especialmente de forma abrupta ou decidida. Exemplo: *He walked out of the meeting when he got angry.*"></div><div class="text-hotspot" style="left:25.374999999999996%;top:27.442708333333332%;width:48.875%;height:.6979166666666666%" data-text="THAT WAS HOW I SURVIVED AS AN ADVENTURER." data-translation="Foi assim que sobrevivi como aventureiro." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;That was how&quot; é usado para explicar o método ou a forma como algo foi feito. **That was how** introduz a explicação de um processo ou resultado. Exemplo: *That was how we solved the problem.*"></div><div class="text-hotspot" style="left:41.875%;top:32.78125%;width:36%;height:.9479166666666667%" data-text="BUT IT WAS DIFFICULT TO DO THE SAME THIS TIME." data-translation="Mas foi difícil fazer o mesmo desta vez." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:70.875%;top:34.802083333333336%;width:26.75%;height:.6510416666666667%" data-text="LEAN" data-translation="INCLINAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24.125%;top:39.567708333333336%;width:18.875%;height:.4427083333333333%" data-text="WHY IS THAT?" data-translation="Por que isso?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32.625%;top:44.65625%;width:38.25%;height:1.0572916666666665%" data-text="BECAUSE I REALLY CARE ABOUT YOU ALL." data-translation="Porque eu realmente me importo com todos vocês." onclick="
