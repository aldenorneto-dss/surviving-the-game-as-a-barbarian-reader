dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/136/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:23%;top:4.958333333333333%;width:23.75%;height:.18229166666666666%" data-text="ALRIGHT," onclick="showTextTooltip(event,this)" data-translation="Certo,"></div><div class="text-hotspot" style="left:41.75%;top:6%;width:32.375%;height:.9479166666666667%" data-text="WHAT DO YOU SAY TO TEAMING UP WITH US?" onclick="showTextTooltip(event,this)" data-translation="O que acha de se juntar a nós?"></div><div class="text-hotspot" style="left:20.5%;top:24.385416666666668%;width:61.75000000000001%;height:1.1666666666666667%" data-text="HMM... CAN YOU GIVE US A MOMENT TO THINK ABOUT IT?" onclick="showTextTooltip(event,this)" data-translation="Hmm... Pode nos dar um momento para pensar sobre isso?"></div><div class="text-hotspot" style="left:28.625%;top:30.708333333333332%;width:42.5%;height:.421875%" data-text="TOGGLING VOICE CONTROL MAGIC ON" onclick="showTextTooltip(event,this)" data-translation="Ativando controle de voz mágico"></div><div class="text-hotspot" style="left:18.5%;top:36.552083333333336%;width:44.75%;height:.7239583333333333%" data-text="...I'M NOT SURE. I'LL DO AS YOU SAYYYY." onclick="showTextTooltip(event,this)" data-translation="...Não tenho certeza. Vou fazer o que você disser."></div><div class="text-hotspot" style="left:21.625%;top:43.84375%;width:25.124999999999996%;height:.171875%" data-text="LIKEWISE." onclick="showTextTooltip(event,this)" data-translation="Igualmente."></div><div class="text-hotspot" style="left:59.75%;top:48.17708333333333%;width:24.375%;height:.7083333333333333%" data-text="I FIND STRANGE HOW..." onclick="showTextTooltip(event,this)" data-translation="Acho estranho como..."></div><div class="text-hotspot" style="left:30.25%;top:49.484375%;width:47.25%;height:1.4791666666666667%" data-text="WE HAVEN'T HEARD ANYTHING ABOUT THEM, EVEN THOUGH THEY SEEM QUITE CAPABLE." onclick="showTextTooltip(event,this)" data-translation="Não ouvimos nada sobre eles, mesmo parecendo bastante capazes."></div><div class="text-hotspot" style="left:26%;top:57.06250000000001%;width:43.75%;height:1.2031249999999858%" data-text="WE CAN'T RULE OUT THE POSSIBILITY THAT THEY ARE PLUNDERERS." onclick="showTextTooltip(event,this)" data-translation="Não podemos descartar a possibilidade de serem saqueadores."></div><div class="text-hotspot" style="left:26.875%;top:63.71875%;width:46.5%;height:.8489583333333334%" data-text="WHAT DO YOU THINK, RAVEN?" onclick="showTextTooltip(event,this)" data-translation="O que você acha, Raven?"></div><div class="text-hotspot" style="left:22.75%;top:67.95833333333333%;width:46.125%;height:.6875%" data-text="I-I THINK IT'S OKAY TO JOIN UP WITH THEM..." onclick="showTextTooltip(event,this)" data-translation="E-eu acho que está tudo bem nos juntarmos a eles..."></div><div class="text-hotspot" style="left:45%;top:69.421875%;width:37.75%;height:.9479166666666667%" data-text="THEY HAVE THEIR IDENTIFICATION MARKS." onclick="showTextTooltip(event,this)" data-translation="Eles têm suas marcas de identificação."></div><div class="text-hotspot" style="left:16%;top:75.34895833333334%;width:25.374999999999996%;height:.19270833333333334%" data-text="HMM, REALLY?" onclick="showTextTooltip(event,this)" data-translation="Hmm, sério?"></div><div class="text-hotspot" style="left:28.499999999999996%;top:76.171875%;width:55.375%;height:1.234375%" data-text="I'VE BEEN RELYING ON RAVEN THE MOST TO MAKE CORRECT DECISIONS, BUT I MUST CHANGE MY MIND FOR THIS ONE." onclick="showTextTooltip(event,this)" data-translation="Tenho confiado na Raven para tomar as decisões corretas, mas preciso mudar de ideia desta vez."></div><div class="text-hotspot" style="left:27.750000000000004%;top:81.63020833333333%;width:45%;height:1.1458333333333333%" data-text="DON'T LOOK AT THE MARK. LOOK AT THE PEOPLE." onclick="showTextTooltip(event,this)" data-translation="Não olhe para a marca. Olhe para as pessoas."></div><div class="text-hotspot" style="left:73.25%;top:86.90625%;width:12%;height:.11979166666666666%" data-text="I SEE..." onclick="showTextTooltip(event,this)" data-translation="Entendi..."></div><div class="text-hotspot" style="left:28.375%;top:90.9375%;width:29.25%;height:.43750000000000006%" data-text="WHAT DO YOU MEAN?" onclick="showTextTooltip(event,this)" data-translation="O que você quer dizer?"></div><div class="text-hotspot" style="left:55.125%;top:92.28645833333333%;width:17.5%;height:.20833333333333334%" data-text="...AH!" onclick="showTextTooltip(event,this)" data-translation="...Ah!"></div><div class="text-hotspot" style="left:18%;top:96.65625%;width:39.125%;height:.953125%" data-text="IF THEY'RE REALLY PLUNDERERS, THERE ARE TWO POSSIBLE SCENARIOS." onclick="showTextTooltip(event,this)" data-translation="Se eles são realmente saqueadores, há dois cenários possíveis."></div><div class="text-hotspot" style="left:36.25%;top:98.15104166666667%;width:42.5%;height:.953125%" data-text="THEY COULDN'T REPLICATE THE MARK, BUT COMMITTED THE CRIME ANYWAY." onclick="showTextTooltip(event,this)" data-translation="Eles não conseguiram replicar a marca, mas cometeram o crime mesmo assim."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/136/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:21.75%;top:13.750000000000002%;width:6.375%;height:.27083333333333337%" data-text="(D)" onclick="showTextTooltip(event,this)" data-translation="(D)"></div><div class="text-hotspot" style="left:37%;top:14.578125%;width:47.375%;height:.953125%" data-text="OR THEY SUCCESSFULLY FORGED THE ID AND ACTED WITH CONFIDENCE." onclick="showTextTooltip(event,this)" data-translation="Ou eles falsificaram a identificação com sucesso e agiram com confiança."></div><div class="text-hotspot" style="left:31.374999999999996%;top:22.0625%;width:28.375%;height:.421875%" data-text="I-I AM NOT SURE." onclick="showTextTooltip(event,this)" data-translation="N-não tenho certeza."></div><div class="text-hotspot" style="left:41.625%;top:23.692708333333336%;width:47.875%;height:.6927083333333334%" data-text="C-CAN YOU MAKE THE DECISION FOR US, MR. YANDEL?" onclick="showTextTooltip(event,this)" data-translation="P-pode tomar a decisão por nós, Sr. Yandel?"></div><div class="text-hotspot" style="left:31.874999999999996%;top:30.15625%;width:28.375%;height:.6875%" data-text="WHY IS SHE PANICKING SO MUCH...?" onclick="showTextTooltip(event,this)" data-translation="Por que ela está tão nervosa...?"></div><div class="text-hotspot" style="left:50.24999999999999%;top:34.270833333333336%;width:28.000000000000004%;height:.6927083333333334%" data-text="SNAP OUT OF IT, RAVEN." onclick="showTextTooltip(event,this)" data-translation="Acorde, Raven."></div><div class="text-hotspot" style="left:20%;top:35.80729166666667%;width:44.125%;height:1.4739583333333335%" data-text="YOU WERE ABLE TO REMAIN CALM EVEN WITH AN ASSASSIN NEXT TO YOU LAST TIME." onclick="showTextTooltip(event,this)" data-translation="Você conseguiu manter a calma mesmo com um assassino ao seu lado da última vez."></div><div class="text-hotspot" style="left:70.25%;top:41.291666666666664%;width:29.125%;height:1%" data-text="TAP 0" onclick="showTextTooltip(event,this)" data-translation="TAP 0"></div><div class="text-hotspot" style="left:8.5%;top:44.5%;width:6.5%;height:.2864583333333333%" data-text="བདེ་" onclick="showTextTooltip(event,this)" data-translation="བདེ་"></div><div class="text-hotspot" style="left:3%;top:46.848958333333336%;width:6%;height:.5%" data-text=".." onclick="showTextTooltip(event,this)" data-translation=".."></div><div class="text-hotspot" style="left:43%;top:47.25520833333333%;width:44.125%;height:.765625%" data-text="TH-THINGS ARE DIFFERENT THIS TIME." onclick="showTextTooltip(event,this)" data-translation="A-as coisas são diferentes desta vez."></div><div class="text-hotspot" s E CONTROL MAGIC OFF" onclick="showTextTooltip(event,this)" data-translation="Desativando controle de voz mágico"></div><div class="text-hotspot" style="left:24.25%;top:83.32291666666667%;width:14.875%;height:.171875%" data-text="YEAH." onclick="showTextTooltip(event,this)" data-translation="Sim."></div><div class="text-hotspot" style="left:23.375%;top:87.93229166666666%;width:52.37500000000001%;height:1.46875%" data-text="SORRY TO MAKE YOU WAIT. WE WILL HAVE TO DECLINE THE OFFER." onclick="showTextTooltip(event,this)" data-translation="Desculpe por fazê-los esperar. Teremos que recusar a oferta."></div><div class="text-hotspot" style="left:65.5%;top:92.4375%;width:3.5000000000000004%;height:.11979166666666666%" data-text="D" onclick="showTextTooltip(event,this)" data-translation="D"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/136/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:24.125%;top:2.21875%;width:52.87500000000001%;height:.6979166666666666%" data-text="I SEE. THAT'S DISAPPOINTING, BUT WE UNDERSTAND." onclick="showTextTooltip(event,this)" data-translation="Entendo. Isso é decepcionante, mas compreendemos."></div><div class="text-hotspot" style="left:58.375%;top:9.03125%;width:27%;height:.4270833333333333%" data-text="LET'S GET MOVING!" onclick="showTextTooltip(event,this)" data-translation="Vamos nos mover!"></div><div class="text-hotspot" style="left:11.25%;top:10.416666666666668%;width:29.5%;height:.6510416666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:20.875%;top:11.848958333333332%;width:48.25%;height:.953125%" data-text="THOSE WHO EXERCISE CAUTION TEND TO SURVIVE LONGER." onclick="showTextTooltip(event,this)" data-translation="Aqueles que exercem cautela tendem a sobreviver por mais tempo."></div><div class="text-hotspot" style="left:73.625%;top:12.260416666666666% assassino é extremamente habilidoso."></div><div class="text-hotspot" style="left:19.25%;top:39.895833333333336%;width:37.75%;height:.9479166666666667%" data-text="I DON'T SEE ANY SIGNS OF STRUGGLE IN THE VICINITY." onclick="showTextTooltip(event,this)" data-translation="Não vejo nenhum sinal de luta nas proximidades."></div><div class="text-hotspot" style="left:46.5%;top:42.703125%;width:42%;height:1.7343750000000002%" data-text="I AGREE. BASED ON THE WOUNDS, ONE PERSON KILLED THEM ALL, WITH ONE STRIKE EACH." onclick="showTextTooltip(event,this)" data-translation="Concordo. Com base nos ferimentos, uma pessoa matou todos eles, com um golpe cada."></div><div class="text-hotspot" style="left:4.125%;top:43.72916666666667%;width:26.875%;height:.46875%" data-text="GLANCE" onclick="showTextTooltip(event,this)" data-translation="OLHAR"></div><div class="text-hotspot" style="left:43.875%;top:45.34375%;width:23.75%;height:.43750000000000006%" data-text="GLANCE" onclick="showTextTooltip(event,this)" data-translation="OLHAR"></div><div class="text-hotspot" style="left:72%;top:48.53645833333333%;width:17.125%;height:.359375%" data-text="RISE" onclick="showTextTooltip(event,this)" data-translation="LEVANTAR"></div><div class="text-hotspot" style="left:11.375%;top:49.833333333333336%;width:36.25%;height:.4270833333333333%" data-text="WHEN WERE THEY KILLED?" onclick="showTextTooltip(event,this)" data-translation="Quando eles foram mortos?"></div><div class="text-hotspot" style="left:57.375%;top:51.45833333333333%;width:31.75%;height:.6822916666666714%" data-text="ABOUT 20 MINUTES AGO." onclick="showTextTooltip(event,this)" data-translation="Cerca de 20 minutos atrás."></div><div class="text-hotspot" style="left:27.125%;top:55.619791666666664%;width:18.5%;height:.2760416666666667%" data-text="THAT'S SOMETHING." onclick="showTextTooltip(event,this)" data-translation="Isso é algo."></div><div class="text-hotspot" style="left:36.875%;top:56.442708333333336%;width:45%;height:.96354166 ="Você não precisa explicar."></div><div class="text-hotspot" style="left:37.75%;top:98.72395833333333%;width:37.75%;height:1.2135416666666714%" data-text="IT'S OBVIOUS THAT THE KILLER WENT TOWARDS THE PORTAL." onclick="showTextTooltip(event,this)" data-translation="É óbvio que o assassino foi em direção ao portal."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/136/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:45.875%;top:.026041666666666668%;width:21.125%;height:.171875%" data-text="IT'S OBVIOUS THAT THE KILLER WENT TOWARDS THE PORTAL." onclick="showTextTooltip(event,this)" data-translation="É óbvio que o assassino foi em direção ao portal."></div><div class="text-hotspot" style="left:42%;top:4.484375%;width:43.625%;height:.9635416666666667%" data-text="THE PORTAL TO THE SECOND FLOOR IS SUPPOSED TO GET US OUT OF THIS." onclick="showTextTooltip(event,this)" data-translation="O portal para o segundo andar deveria nos tirar disso."></div><div class="text-hotspot" style="left:17%;top:6.072916666666667%;width:44.875%;height:.9479166666666661%" data-text="BUT IT TURNS OUT, THE MONSTER IS LURKING OVER THERE." onclick="showTextTooltip(event,this)" data-translation="Mas acontece que o monstro está à espreita lá."></div><div class="text-hotspot" style="left:27.375%;top:24.78125%;width:45.125%;height:.8489583333333334%" data-text="IF WE GO BACK THE WAY WE CAME, HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="Se voltarmos pelo caminho que viemos, no entanto..."></div><div class="text-hotspot" style="left:10.625%;top:30.609375%;width:78.25%;height:.7552083333333334%" data-text="...WE'LL GET SWEPT AWAY BY THE WAR THAT WILL EVENTUALLY EXPAND TO THE ENTIRE FLOOR." onclick="showTextTooltip(event,this)" data-translation="...seremos arrastados pela guerra que eventualmente se expandirá para todo o andar."></div><div class="text-hotspot" style="left:15.375%;top:  style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/136/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:23.125%;top:2.40625%;width:53.5%;height:.8854166666666666%" data-text="COME ON, YOU CAN'T JUST GO BACK!" onclick="showTextTooltip(event,this)" data-translation="Vamos lá, você não pode simplesmente voltar!"></div><div class="text-hotspot" style="left:26.125%;top:11.994791666666666%;width:47.75%;height:1.0052083333333333%" data-text="FLINC" onclick="showTextTooltip(event,this)" data-translation="FLINC"></div><div class="text-hotspot" style="left:28.875%;top:20.244791666666668%;width:65%;height:1.8229166666666667%" data-text="TURN" onclick="showTextTooltip(event,this)" data-translation="VIRAR"></div><div class="text-hotspot" style="left:27.750000000000004%;top:26.53125%;width:44.125%;height:.7135416666666666%" data-text="SQUARTU (GUST)" onclick="showTextTooltip(event,this)" data-translation="SQUARTU (RAJADA)"></div><div class="text-hotspot" style="left:18.625%;top:32.90104166666667%;width:63.375%;height:.8541666666666666%" data-text="WHAT KIND OF BARBARIAN IS THAT CAREFUL, HUH?" onclick="showTextTooltip(event,this)" data-translation="Que tipo de bárbaro é tão cauteloso, hein?"></div><div class="text-hotspot" style="left:31.75%;top:52.07291666666667%;width:33%;height:.8750000000000001%" data-text="GIGGLE" onclick="showTextTooltip(event,this)" data-translation="RISADINHA"></div><div class="text-hotspot" style="left:1.5%;top:60.05729166666667%;width:2%;height:.06770833333333334%" data-text="2" onclick="showTextTooltip(event,this)" data-translation="2"></div><div class="text-hotspot" style="left:54.37499999999999%;top:67.22395833333333%;width:15.375%;height:.4166666666666667%" data-text="WAIT A MINUTE." onclick="showTextTooltip(event,this)" data-translation="Espere um minuto."></div><div class="text-hotspot" style="left:32.125%;top:75.91145833333334%;width:49.25%;height:.9687499999999858%" t-hotspot" style="left:40.625%;top:14.09375%;width:19.25%;height:.5208333333333333%" data-text="WE'RE F***ED." onclick="showTextTooltip(event,this)" data-translation="Estamos ferrados."></div><div class="text-hotspot" style="left:20.625%;top:21.145833333333332%;width:44.875%;height:.953125%" data-text="I WONDERED IF HE WOULD LET US GO IF I TOLD HIM I WAS THE LION..." onclick="showTextTooltip(event,this)" data-translation="Me perguntei se ele nos deixaria ir se eu dissesse que era o Leão..."></div><div class="text-hotspot" style="left:53.37499999999999%;top:23.083333333333332%;width:24%;height:.4322916666666667%" data-text="FOR A BRIEF MOMENT." onclick="showTextTooltip(event,this)" data-translation="Por um breve momento."></div><div class="text-hotspot" style="left:19.375%;top:41.432291666666664%;width:61.12499999999999%;height:1.15625%" data-text="BUT THE JESTER RESPECTS AND ADMIRES THE LION MASK, NOT THIS NOVICE BARBARIAN." onclick="showTextTooltip(event,this)" data-translation="Mas o Bobo respeita e admira a Máscara do Leão, não este Bárbaro novato."></div><div class="text-hotspot" style="left:9.625%;top:48.97916666666667%;width:10.875%;height:.47916666666666663%" data-text="%" onclick="showTextTooltip(event,this)" data-translation="%"></div><div class="text-hotspot" style="left:26.625%;top:54.015625%;width:46.375%;height:.6979166666666666%" data-text="HE WAS MOST LIKELY TO GET DISAPPOINTED, AND EVEN INFURIATED." onclick="showTextTooltip(event,this)" data-translation="Ele provavelmente ficaria desapontado, e até mesmo furioso."></div><div class="text-hotspot" style="left:17.875%;top:62.18749999999999%;width:33.75%;height:.7083333333333333%" data-text="EVERYONE, GET READY FOR BATTLE." onclick="showTextTooltip(event,this)" data-translation="Todos, preparem-se para a batalha."></div><div class="text-hotspot" style="left:53.37499999999999%;top:63.48437500000001%;width:35.625%;height:.71875%" data-text="WOW" onclick="showTextTooltip(event,this)" data-translation="Uau">
