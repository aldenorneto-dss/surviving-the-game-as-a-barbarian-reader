on="THU"></div><div class="text-hotspot" style="left:39%;top:.9947916666666667%;width:58.875%;height:1.2864583333333335%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="THUMP"></div><div class="text-hotspot" style="left:37.125%;top:3.6249999999999996%;width:25.124999999999996%;height:.6979166666666666%" data-text="BAM" onclick="showTextTooltip(event,this)" data-translation="BAM"></div><div class="text-hotspot" style="left:10.375%;top:15.286458333333334%;width:79.5%;height:.38020833333333337%" data-text="YOU HAVE DEFEATED DEATH FIEND. YOU HAVE GAINED 2 EXP POINTS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DERROTOU O DEMÔNIO DA MORTE. VOCÊ GANHOU 2 PONTOS DE EXP."></div><div class="text-hotspot" style="left:5.125%;top:24.322916666666668%;width:90%;height:2.703125%" data-text="SURVIVING THE GAME AS A BARBARIAN" onclick="showTextTooltip(event,this)" data-translation="SOBREVIVENDO AO JOGO COMO UM BÁRBARO"></div><div class="text-hotspot" style="left:29.875%;top:27.265625%;width:40.5%;height:.45312499999999994%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | Han tae-su ORIGINAL STORY | Jung Yoon-kang" onclick="showTextTooltip(event,this)" data-translation="ARTE | MIDNIGHT STUDIO ADAPTAÇÃO | Han tae-su HISTÓRIA ORIGINAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:45.25%;top:28.322916666666664%;width:8.25%;height:.1875%" data-text="20" onclick="showTextTooltip(event,this)" data-translation="20"></div><div class="text-hotspot" style="left:17.75%;top:35.291666666666664%;width:30.25%;height:.8333333333333334%" data-text="CHECK THIS OUT, BJORN!" onclick="showTextTooltip(event,this)" data-translation="OLHA ISSO, BJORN!"></div><div class="text-hotspot" style="left:38.375%;top:40.88541666666667%;width:43.375%;height:.8541666666666666%" data-text="IT DROPPED A REALLY BIG MANA STONE!" onclick="showTextTooltip(event,this)" data-translation="ELE DEIXOU CAIR UMA PEDRA DE MANA REALMENTE GRANDE!" data-tips="💡 'Dropped' pode ser usado em jogos para indicar que um item foi deixado cair ou encontrado após derrotar um inimigo."></div><div class="text-hotspot" style="left:15.375%;top:46.21875%;width:34.625%;height:.9635416666666643%" data-text="IT'S ONLY WORTH 100 STONES, THOUGH." onclick="showTextTooltip(event,this)" data-translation="MAS VALE APENAS 100 PEDRAS." data-tips="💡 'Though' é usado aqui como um conector para indicar contraste, similar a 'no entanto'."></div><div class="text-hotspot" style="left:65.375%;top:47.984375%;width:24.25%;height:.21875000000000003%" data-text="WHAT?!" onclick="showTextTooltip(event,this)" data-translation="O QUÊ?!"></div><div class="text-hotspot" style="left:36.625%;top:50.911458333333336%;width:1.625%;height:.07291666666666667%" data-text="11" onclick="showTextTooltip(event,this)" data-translation="11"></div><div class="text-hotspot" style="left:33.75%;top:54.30208333333333%;width:50.875%;height:1.328125%" data-text="ARE YOU TELLING ME ONE DEATH FIEND IS ONLY WORTH 100 STONES?!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ ME DIZENDO QUE UM DEMÔNIO DA MORTE VALE APENAS 100 PEDRAS?!" data-tips="💡 'Are you telling me' é uma estrutura usada para expressar surpresa ou pedir confirmação."></div><div class="text-hotspot" style="left:10.625%;top:59.59895833333333%;width:53.625%;height:1.4791666666666643%" data-text="WITH THE LOOT FROM THE GHOULS, WE GOT ABOUT 300 STONES OUT OF THIS FIGHT." onclick="showTextTooltip(event,this)" data-translation="COM O SAQUE DOS GHOULS, CONSEGUIMOS CERCA DE 300 PEDRAS NESTA LUTA."></div><div class="text-hotspot" style="left:35.375%;top:66.79166666666667%;width:49.375%;height:.9583333333333286%" data-text="ALTHOUGH THAT'S STILL EXTREMELY LOW CONSIDERING OUR LIVES WERE ON THE LINE." onclick="showTextTooltip(event,this)" data-translation="EMBORA AINDA SEJA EXTREMAMENTE BAIXO CONSIDERANDO QUE NOSSAS VIDAS ESTAVAM EM JOGO." data-tips="💡 'Considering' é usado para introduzir uma condição ou circunstância que afeta a situação."></div><div class="text-hotspot" style="left:55.50000000000001%;top:68.91145833333333%;width:38.25%;height:.171875%" data-text="WE ALMOST DIED..." onclick="showTextTooltip(event,this)" data-translation="QUASE MORREMOS..."></div><div class="text-hotspot" style="left:13.750000000000002%;top:73.1875%;width:26.25%;height:.17708333333333331%" data-text="... BJORN." onclick="showTextTooltip(event,this)" data-translation="... BJORN."></div><div class="text-hotspot" style="left:11.75%;top:73.1875%;width:45%;height:1.2083333333333286%" data-text="HOW MUCH WAS THE FANCY BREAD WE HAD BACK AT THE INN?" onclick="showTextTooltip(event,this)" data-translation="QUANTO CUSTAVA O PÃO REFINADO QUE TIVEMOS NA ESTALAGEM?"></div><div class="text-hotspot" style="left:.5%;top:77.078125%;width:32.375%;height:.6770833333333334%" data-text="SWISH" onclick="showTextTooltip(event,this)" data-translation="SWISH"></div><div class="text-hotspot" style="left:26.875%;top:78.328125%;width:25%;height:.9583333333333333%" data-text="THE ONE WITH THE CREAM FILLING?" onclick="showTextTooltip(event,this)" data-translation="AQUELE COM RECHEIO DE CREME?"></div><div class="text-hotspot" style="left:41.25%;top:79.53125%;width:42.125%;height:1.203125%" data-text="I THINK IT WAS ABOUT 300 STONES, IF I REMEMBER CORRECTLY." onclick="showTextTooltip(event,this)" data-translation="ACHO QUE CUSTAVA CERCA DE 300 PEDRAS, SE NÃO ME ENGANO." data-tips="💡 'If I remember correctly' é uma frase usada para expressar incerteza sobre uma lembrança."></div><div class="text-hotspot" style="left:21.875%;top:84.58854166666666%;width:57.75%;height:1.625%" data-text="AHA! THAT MEANS I CAN HAVE ONE OF THOSE WITH EACH DEATH FIEND I SLAY, THEN!!" onclick="showTextTooltip(event,this)" data-translation="AHA! ISSO SIGNIFICA QUE POSSO TER UM DAQUELES COM CADA DEMÔNIO DA MORTE QUE EU MATAR, ENTÃO!!" data-tips="💡 'That means' é uma estrutura usada para explicar a implicação ou consequência de algo."></div><div class="text-hotspot" style="left:59.25%;top:89.3125%;width:38.5%;height:.984375%" data-text="BEAM" onclick="showTextTooltip(event,this)" data-translation="BEAM"></div><div class="text-hotspot" style="left:26.375%;top:91.30729166666667%;width:48.625%;height:.9479166666666667%" data-text="SO YOU'RE GOING TO USE THE BREAD WITH THE CREAM FILLING AS A NEW UNIT OF CURRENCY?" onclick="showTextTooltip(event,this)" data-translation="ENTÃO VOCÊ VAI USAR O PÃO COM RECHEIO DE CREME COMO UMA NOVA UNIDADE DE MOEDA?" data-tips="💡 'Unit of currency' refere-se a uma medida ou padrão de valor monetário."></div><div class="text-hotspot" style="left:13.375%;top:97.51041666666667%;width:41.75%;height:.6822916666666572%" data-text="WE GOT NO TIME TO WASTE, THEN!!" onclick="showTextTooltip(event,this)" data-translation="NÃO TEMOS TEMPO A PERDER, ENTÃO!!" data-tips="💡 'No time to waste' é uma expressão que indica urgência, significando que não se deve perder tempo. É frequentemente usada para motivar ação rápida."></div><div class="text-hotspot" style="left:36.25%;top:98.84895833333334%;width:31.374999999999996%;height:.6927083333333334%" data-text="LET'S GO HUNT MORE MONSTERS!" onclick="showTextTooltip(event,this)" data-translation="VAMOS CAÇAR MAIS MONSTROS!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/20/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:42.375%;top:2.1041666666666665%;width:43.5%;height:.7135416666666666%" data-text="BUT WE'RE SPLITTING THE LOOT EIGHT TO TWO. YOU NEED TO HUNT FIVE OF THEM." onclick="showTextTooltip(event,this)" data-translation="MAS ESTAMOS DIVIDINDO O SAQUE EM OITO PARA DOIS. VOCÊ PRECISA CAÇAR CINCO DELES." data-tips="💡 'Splitting the loot' é uma expressão comum em jogos que significa dividir os espólios ou recompensas."></div><div class="text-hotspot" style="left:16.75%;top:14.036458333333332%;width:26.375%;height:.45312499999999994%" data-text="OKAY. LET'S GO." onclick="showTextTooltip(event,this)" data-translation="OKAY. VAMOS LÁ."></div><div class="text-hotspot" style="left:4%;top:16.40625%;width:39.75%;height:.8593750000000001%" data-text="SANCKLE" onclick="showTextTooltip(event,this)" data-translation="SANCKLE"></div><div class="text-hotspot" style="left:12%;top:20.598958333333332%;width:43.5%;height:.9479166666666667%" data-text="I SUPPOSE IT'S NOT TOO BAD TO TRAVEL WITH A BARBARIAN COMPANION." onclick="showTextTooltip(event,this)" data-translation="SUPONHO QUE NÃO É TÃO RUIM VIAJAR COM UM COMPANHEIRO BÁRBARO." data-tips="💡 'I suppose' é uma forma de introduzir uma opinião ou suposição de maneira menos assertiva."></div><div class="text-hotspot" style="left:48.375%;top:22.28125%;width:40.5%;height:.9635416666666667%" data-text="I DON'T HAVE TO FIRE HER UP EACH BATTLE LIKE I DID WITH ERWEN." onclick="showTextTooltip(event,this)" data-translation="NÃO PRECISO INCENTIVÁ-LA A CADA BATALHA COMO FAZIA COM ERWEN." data-tips="💡 'Fire her up' é uma expressão que significa motivar ou animar alguém."></div><div class="text-hotspot" style="left:20.25%;top:26.286458333333336%;width:34.375%;height:1.09375%" data-text="I KINDA FEEL OFFENDED ALL OF A SUDDEN, FOR SOME REASON." onclick="showTextTooltip(event,this)" data-translation="DE REPENTE, ME SINTO OFENDIDO, POR ALGUM MOTIVO." data-tips="💡 'All of a sudden' é uma expressão que significa 'de repente'."></div><div class="text-hotspot" style="left:27.250000000000004%;top:35.13541666666667%;width:45%;height:.6927083333333334%" data-text="WE MOVED AROUND IN THE VICINITY TO KILL MORE DEATH FIENDS." onclick="showTextTooltip(event,this)" data-translation="NOS MOVEMOS PELA VIZINHANÇA PARA MATAR MAIS DEMÔNIOS DA MORTE."></div><div class="text-hotspot" style="left:3.25%;top:37.22916666666667%;width:76.125%;height:2.0625%" data-text="WHOOSH" onclick="showTextTooltip(event,this)" data-translation="WHOOSH"></div><div class="text-hotspot" style="left:23.625%;top:47.463541666666664%;width:52.75%;height:.9739583333333357%" data-text="WE WENT STRAIGHT FOR THEIR LEGS TO TOSS THEM TO THE GROUND AS SOON AS THE BATTLES BEGAN..." onclick="showTextTooltip(event,this)" data-translation="FOMOS DIRETO PARA AS PERNAS DELES PARA JOGÁ-LOS NO CHÃO ASSIM QUE AS BATALHAS COMEÇAVAM..." data-tips="💡 'Toss them to the ground' é uma expressão que significa jogar algo ou alguém no chão."></div><div class="text-hotspot" style="left:12.5%;top:52.35416666666667%;width:44.5%;height:.703125%" data-text="...AND BEAT THE CRAP OUT OF THEIR SKULLS LIKE KNEADING BREAD." onclick="showTextTooltip(event,this)" data-translation="...E BATEMOS NAS CABEÇAS DELES COMO SE ESTIVÉSSEMOS AMASSANDO PÃO." data-tips="💡 'Beat the crap out of' é uma expressão idiomática que significa bater ou derrotar alguém severamente. Uma alternativa mais formal seria 'defeat severely'."></div><div class="text-hotspot" style="left:42.125%;top:53.453125%;width:46.625%;height:.9479166666666667%" data-text="AFTER WE DISCOVERED HOW TO EFFECTIVELY HUNT THEM DOWN, IT WAS A PIECE OF CAKE." onclick="showTextTooltip(event,this)" data-translation="DEPOIS QUE DESCOBRIMOS COMO CAÇÁ-LOS EFICAZMENTE, FOI MOLEZA." data-tips="💡 'A piece of cake' é uma expressão idiomática que significa algo muito fácil de fazer. O equivalente em português seria 'mamão com açúcar'."></div><div class="text-hotspot" style="left:5.875%;top:54.69270833333333%;width:21.125%;height:.4322916666666667%" data-text="-BAM-" onclick="showTextTooltip(event,this)" data-translation="-BAM-"></div><div class="text-hotspot" style="left:14.124999999999998%;top:55.35416666666667%;width:6.75%;height:.2864583333333333%" data-text="&quot;" onclick="showTextTooltip(event,this)" data-translation="&quot;"></div><div class="text-hotspot" style="left:48.5%;top:55.375%;width:23.25%;height:.609375%" data-text="BAM" onclick="showTextTooltip(event,this)" data-translation="BAM"></div><div class="text-hotspot" style="left:25%;top:59.81770833333333%;width:50%;height:.9427083333333357%" data-text="WE KILLED ABOUT 70 DEATH FIENDS THROUGHOUT THE DAY, JUST LIKE THAT." onclick="showTextTooltip(event,this)" data-translation="MATAMOS CERCA DE 70 DEMÔNIOS DA MORTE DURANTE O DIA, ASSIM MESMO."></div><div class="text-hotspot" style="left:10.5%;top:64.84895833333333%;width:47.625%;height:.9635416666666667%" data-text="BECAUSE THE DROP RATE OF ESSENCES IS SO LOW IN THE BEGINNING OF THE GAME," onclick="showTextTooltip(event,this)" data-translation="PORQUE A TAXA DE DROP DE ESSÊNCIAS É TÃO BAIXA NO INÍCIO DO JOGO," data-tips="💡 'Drop rate' é um termo de jogos que se refere à frequência com que itens são obtidos. É um conceito importante em muitos jogos de RPG."></div><div class="text-hotspot" style="left:37.5%;top:66.34895833333333%;width:52.75%;height:.9427083333333334%" data-text="PLAYERS ARE FORCED TO DECIDE ON THE BUILD DEPENDING ON WHAT THEY GET FROM LOOT." onclick="showTextTooltip(event,this)" data-translation="OS JOGADORES SÃO FORÇADOS A DECIDIR SOBRE A CONSTRUÇÃO DEPENDENDO DO QUE ELES OBTÊM DO SAQUE." data-tips="💡 'Depending on' é uma expressão que usa a preposição 'on', diferente do português que usa 'de'. Significa que algo é condicionado ou influenciado por outra coisa."></div><div class="text-hotspot" style="left:42.625%;top:69.98958333333334%;width:36.75%;height:.6874999999999858%" data-text="WE SHOULD CALL IT A DAY NOW." onclick="showTextTooltip(event,this)" data-translation="DEVEMOS ENCERRAR O DIA AGORA." data-tips="💡 'Call it a day' é uma expressão idiomática que significa encerrar as atividades de trabalho ou qualquer tarefa para aquele dia."></div><div class="text-hotspot" style="left:9%;top:76.109375%;width:45.875%;height:.9583333333333286%" data-text="THAT'S WHY I WAS AIMING FOR THE ESSENCE OF THE DEATH FIEND," onclick="showTextTooltip(event,this)" data-translation="É POR ISSO QUE EU ESTAVA MIRANDO NA ESSÊNCIA DO DEMÔNIO DA MORTE,"></div><div class="text-hotspot" style="left:38.125%;top:77.63541666666667%;width:51.625%;height:.9427083333333286%"
