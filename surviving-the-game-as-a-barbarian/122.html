dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/122/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22.75%;top:3.6249999999999996%;width:54.87499999999999%;height:.49479166666666663%" data-text="THE MANTICORE ESSENCE IS QUITE UNORDINARY." data-translation="A ESSÊNCIA DA MANTÍCORA É BEM INCOMUM." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.25%;top:8.192708333333334%;width:49.125%;height:.921875%" data-text="DISCERNMENT +40 APPETITE +30 JUMP +30" data-translation="DISCERNIMENTO +40 APETITE +30 SALTO +30" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.875%;top:12.177083333333332%;width:41.875%;height:.703125%" data-text="THE ONLY PRACTICAL STAT BOOST IS PLUS 30 TO JUMP." data-translation="O ÚNICO AUMENTO PRÁTICO DE STATUS É MAIS 30 EM SALTO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40%;top:13.666666666666666%;width:38.5%;height:.9583333333333333%" data-text="IT'S WORSE THAN TIER-9 ESSENCES WHEN IT COMES TO STAT INCREASES." data-translation="É PIOR QUE ESSÊNCIAS DE NÍVEL 9 QUANDO SE TRATA DE AUMENTO DE STATUS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.375%;top:19.276041666666664%;width:59%;height:.7656250000000036%" data-text="IF YOU IGNORE ITS PASSIVE ABILITY, THAT IS." data-translation="SE VOCÊ IGNORAR SUA HABILIDADE PASSIVA, ISSO É." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:73.125%;top:24.244791666666668%;width:3.6249999999999996%;height:.171875%" data-text="P" data-translation="P" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41%;top:24.822916666666668%;width:17.875%;height:.14583333333333334%" data-text="HEREDITY" data-translation="HEREDITARIEDADE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.125%;top:25.479166666666668%;width:43.375%;height:.5729166666666666%" data-text="CONSUMING MANA STONES GIVES PERMANENT BOOST TO STATS." data-translation="CONSUMIR PEDRAS DE MANA DÁ UM IMPULSO PERMANENTE NOS STATUS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24%;top:28.192708333333332%;width:51.74999999999999%;height:.5520833333333334%" data-text="EATING MANA STONES WILL INCREASE STATS." data-translation="COMER PEDRAS DE MANA VAI AUMENTAR OS STATUS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:29.625%;top:33.8125%;width:44%;height:.9427083333333334%" data-text="EXCEPT THE TOTAL STAT INCREASE THROUGH THIS ABILITY IS CAPPED AT 200." data-translation="EXCETO QUE O AUMENTO TOTAL DE STATUS ATRAVÉS DESSA HABILIDADE É LIMITADO A 200." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:61.5%;top:38.36979166666667%;width:32.625%;height:.9895833333333333%" data-text="GULP" data-translation="GLUP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53%;top:41.682291666666664%;width:32.875%;height:.9583333333333333%" data-text="I HAD INITIALLY THOUGHT IT WAS ABSOLUTELY WORTHLESS," data-translation="EU INICIALMENTE PENSEI QUE ERA TOTALMENTE INÚTIL," onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.375%;top:43.333333333333336%;width:53.125%;height:.6927083333333334%" data-text="SINCE THERE ARE TIER-5 ESSENCES THAT ADD MORE THAN 300 IN TOTAL." data-translation="JÁ QUE HÁ ESSÊNCIAS DE NÍVEL 5 QUE ADICIONAM MAIS DE 300 NO TOTAL." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:59%;top:44.859375%;width:26.125%;height:.2916666666666667%" data-text="AND WHY WASTE MANA STONES?" data-translation="E POR QUE DESPERDIÇAR PEDRAS DE MANA?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:33.375%;top:48.213541666666664%;width:33.5%;height:.25%" data-text="HOWEVER..." data-translation="ENTRETANTO. Tooltip(event,this)"></div><div class="text-hotspot" style="left:20.625%;top:93.35416666666667%;width:67.25%;height:.8958333333333286%" data-text="YOU RETAIN A PART OF THE STAT BOOST GAINED THROUGH THE PASSIVE SKILL [HEREDITY]." data-translation="VOCÊ RETÉM UMA PARTE DO IMPULSO DE STATUS GANHO ATRAVÉS DA HABILIDADE PASSIVA [HEREDITARIEDADE]." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.125%;top:95.66145833333334%;width:36.5%;height:.4427083333333333%" data-text="20 PERCENT OF IT, TO BE PRECISE." data-translation="20 POR CENTO DISSO, PARA SER PRECISO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:30.875000000000004%;top:97.125%;width:50.125%;height:.9635416666666572%" data-text="THAT'S EXTRA 40 STAT POINTS, WITHOUT REALLY TAKING UP AN ESSENCE SLOT!" data-translation="SÃO 40 PONTOS DE STATUS EXTRA, SEM REALMENTE OCUPAR UM SLOT DE ESSÊNCIA!" onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/122/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22%;top:2.3958333333333335%;width:40.75%;height:.953125%" data-text="ANY OF YOU WILLING TO GIVE UP ON THIS ESSENCE?" data-translation="ALGUM DE VOCÊS ESTÁ DISPOSTO A DESISTIR DESSA ESSÊNCIA?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:60%;top:5.192708333333333%;width:28.999999999999996%;height:1.2916666666666667%" data-text="FWOOMP" data-translation="FWOOMP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:80.375%;top:6.734374999999999%;width:12.75%;height:.46875%" data-text="貨" data-translation="貨" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.375%;top:9.427083333333334%;width:32.5%;height:.9479166666666643%" data-text="W-WE WOULD LIKE TO TRY OUR LUCK." data-translation="N-NÓS GOSTARÍAMOS DE TENTAR A SORTE." on
