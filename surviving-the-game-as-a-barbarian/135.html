dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/135/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:19.125%;top:3.135416666666667%;width:61.5%;height:.96875%" data-text="THE SECOND CORD BROKE. I WAS CAUGHT BY SURPRISE, AS NOTHING HAPPENED FOR A WHILE..." onclick="showTextTooltip(event,this)" data-translation="O segundo cordão quebrou. Fiquei surpreso, já que nada aconteceu por um tempo..."></div><div class="text-hotspot" style="left:16.125%;top:12.854166666666666%;width:76%;height:.6875%" data-text="Φανταγιερ" onclick="showTextTooltip(event,this)" data-translation="Φανταγιερ"></div><div class="text-hotspot" style="left:35.5%;top:20.427083333333336%;width:28.375%;height:1.21875%" data-text="JUST WHAT IN THE WORLD IS THAT BASTARD DOING RIGHT NOW?" onclick="showTextTooltip(event,this)" data-translation="O que diabos aquele desgraçado está fazendo agora?"></div><div class="text-hotspot" style="left:48.125%;top:26.223958333333336%;width:40%;height:.7760416666666666%" data-text="CLENCH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.125%;top:30.901041666666668%;width:38.375%;height:.6979166666666643%" data-text="I'M NOT READY TO FACE HIM JUST YET." onclick="showTextTooltip(event,this)" data-translation="Ainda não estou pronto para enfrentá-lo."></div><div class="text-hotspot" style="left:48.375%;top:32.776041666666664%;width:22.75%;height:.4166666666666667%" data-text="IT'S GIVING ME ANXIETY." onclick="showTextTooltip(event,this)" data-translation="Isso está me deixando ansioso."></div><div class="text-hotspot" style="left:29.625%;top:37.65104166666667%;width:41.25%;height:.9635416666666667%" data-text="ANOTHER REASON TO GET TO THE SIXTH FLOOR AS SOON AS POSSIBLE." onclick="showTextTooltip(event,this)" data-translation="Mais um motivo para chegar ao sexto andar o mais rápido possível."></div><div class="text-hotspot" style="left:70.625%;top:40.067708333333336%;width:26.5%;height:.75%" data-text="GULP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:8.125%;top:44.567708333333336%;width:28.749999999999996%;height:.7552083333333334%" data-text="GULP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24%;top:47.671875%;width:37.875%;height:.9479166666666643%" data-text="IF WE ACQUIRE THAT, WE SHOULD BE ABLE TO--" onclick="showTextTooltip(event,this)" data-translation="Se adquirirmos isso, devemos ser capazes de--"></div><div class="text-hotspot" style="left:49.125%;top:49.5625%;width:27.625%;height:.49479166666666663%" data-text="GOOD OLD SIR!" onclick="showTextTooltip(event,this)" data-translation="Bom e velho senhor!"></div><div class="text-hotspot" style="left:20.125%;top:54.71875000000001%;width:36.375%;height:.6927083333333334%" data-text="WHAT ARE YOU THINKING ABOUT?" onclick="showTextTooltip(event,this)" data-translation="No que você está pensando?"></div><div class="text-hotspot" style="left:26.625%;top:56.848958333333336%;width:28.249999999999996%;height:.703125%" data-text="SULKY" onclick="showTextTooltip(event,this)" data-translation="Amuado"></div><div class="text-hotspot" style="left:71.125%;top:57.380208333333336%;width:1.625%;height:.09375%" data-text="G" onclick="showTextTooltip(event,this)" data-translation="G"></div><div class="text-hotspot" style="left:40.625%;top:62.802083333333336%;width:19.75%;height:.45312499999999994%" data-text="OH, I'M SORRY." onclick="showTextTooltip(event,this)" data-translation="Oh, desculpe."></div><div class="text-hotspot" style="left:54.37499999999999%;top:63.89583333333333%;width:30.000000000000007%;height:.9427083333333428%" data-text="YOU HAD SOMETHING TO SAY TO ME." onclick="showTextTooltip(event,this)" data-translation="Você tinha algo para me dizer."></div><div class="text-hotspot" style="left:37%;top:69.46875%;width:34%;height:.4479166666666667%" data-text="DO YOU REMEMBER..." onclick="showTextTooltip(event,this)" data-translation="Você se lembra..."></div><div class="text-hotspot" style="left:20.625%;top:70.75%;width:42.375%;height:1.1979166666666667%" data-text="THAT I SAID I STILL HAD SO MUCH TO LEARN FROM MY SISTER?" onclick="showTextTooltip(event,this)" data-translation="Que eu disse que ainda tinha muito a aprender com minha irmã?"></div><div class="text-hotspot" style="left:59.25%;top:73.72916666666667%;width:15%;height:.16145833333333334%" data-text="YEAH." onclick="showTextTooltip(event,this)" data-translation="Sim."></div><div class="text-hotspot" style="left:16.375%;top:79.85416666666667%;width:55.25%;height:1.2083333333333333%" data-text="I ACTUALLY HAD TRIED TO RECRUIT ERWEN AS WELL WHEN MAKING A NEW TEAM, ALTHOUGH I DIDN'T TELL MISSHA ABOUT IT." onclick="showTextTooltip(event,this)" data-translation="Na verdade, eu tentei recrutar Erwen também quando estava formando um novo time, embora eu não tenha contado para Missha sobre isso."></div><div class="text-hotspot" style="left:56.99999999999999%;top:81.86458333333333%;width:24.625%;height:.4270833333333333%" data-text="ERWEN DECLINED IT." onclick="showTextTooltip(event,this)" data-translation="Erwen recusou."></div><div class="text-hotspot" style="left:17.625%;top:86.75%;width:33.875%;height:.6354166666666666%" data-text="CAN YOU GIVE ME JUST SIX MONTHS?" onclick="showTextTooltip(event,this)" data-translation="Você pode me dar só seis meses?"></div><div class="text-hotspot" style="left:29.375%;top:88.22916666666667%;width:52%;height:1.0885416666666572%" data-text="I'LL LEARN EVERYTHING I CAN FROM MY SISTER AND JOIN YOUR TEAM, THEN." onclick="showTextTooltip(event,this)" data-translation="Vou aprender tudo que puder com minha irmã e então entrar para o seu time."></div><div class="text-hotspot" style="left:26.25%;top:99.3125%;width:47.5%;height:.6822916666666666%" data-text="IT FELT AS IF I WAS SENDING A CORPORATE SPY TO MY COMPETITOR AT FIRST..." onclick="showTextTooltip(event,this)" data-translation="Parecia que eu estava enviando um espião corporativo para meu concorrente no começo..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/135/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:33.625%;top:.06770833333333334%;width:32.875%;height:.46875%" data-text="IT FELT AS IF I WAS SENDING A CORPORATE SPY TO MY COMPETITOR AT FIRST..." onclick="showTextTooltip(event,this)" data-translation="Parecia que eu estava enviando um espião corporativo para meu concorrente no começo..."></div><div class="text-hotspot" style="left:18.25%;top:4.760416666666667%;width:21.625%;height:.515625%" data-text="STARE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.875%;top:5.734375%;width:56.375%;height:1.2291666666666665%" data-text="I THOUGHT YOU HAD CHANGED YOUR MIND BECAUSE YOU DIDN'T SAY ANYTHING ABOUT IT." onclick="showTextTooltip(event,this)" data-translation="Achei que você tinha mudado de ideia porque não disse nada sobre isso."></div><div class="text-hotspot" style="left:20%;top:12.15625%;width:37.75%;height:1.020833333333334%" data-text="WH-WHAT ARE YOU TALKING ABOUT?! し" onclick="showTextTooltip(event,this)" data-translation="O-O que você está falando?! し"></div><div class="text-hotspot" style="left:16.5%;top:17.369791666666668%;width:66.5%;height:1.3802083333333333%" data-text="I WOULD NEVER BETRAY YOUR TRUST! WE ARE EACH OTHER'S FIRST NIGHT COMPANION!" onclick="showTextTooltip(event,this)" data-translation="Eu nunca trairia sua confiança! Somos o primeiro companheiro de noite um do outro!"></div><div class="text-hotspot" style="left:18.375%;top:27.020833333333332%;width:34.625%;height:.9895833333333333%" data-text="TO BE EXACT, MY FIRST NIGHT COMPANION WAS HANSA" onclick="showTextTooltip(event,this)" data-translation="Para ser exato, meu primeiro companheiro de noite foi Hansa"></div><div class="text-hotspot" style="left:44%;top:28.380208333333336%;width:31%;height:.9895833333333333%" data-text="ALRIGHT, WHERE ARE YOU GOING WITH THIS?" onclick="showTextTooltip(event,this)" data-translation="Certo, aonde você quer chegar com isso?"></div><div class="text-hotspot" style="left:16.875%;top:33.765625%;width:39.5%;height:.9479166666666667%" data-text="UHM... I THINK I'M GOING TO NEED A LITTLE MORE TIME." onclick="showTextTooltip(event,this)" data-translation="Uhm... Acho que vou precisar de um pouco mais de tempo."></div><div class="text-hotspot" style="left:34.875%;top:36.84375%;width:29.5%;height:.43750000000000006%" data-text="WHAT DO YOU MEAN?" onclick="showTextTooltip(event,this)" data-translation="O que você quer dizer?"></div><div class="text-hotspot" style="left:24.5%;top:46.359375%;width:30.625000000000004%;height:.953125%" data-text="B-BECAUSE ALL OF YOU ARE TIER-5 RIGHT NOW." onclick="showTextTooltip(event,this)" data-translation="P-Porque todos vocês são nível 5 agora."></div><div class="text-hotspot" style="left:40.5%;top:47.75%;width:40.875%;height:1.2135416666666714%" data-text="I DON'T THINK I CAN MAKE MYSELF USEFUL AMONG THEM YET..." onclick="showTextTooltip(event,this)" data-translation="Não acho que posso ser útil entre eles ainda..."></div><div class="text-hotspot" style="left:21.375%;top:52.70312499999999%;width:37.75%;height:1.203125%" data-text="TO TELL YOU THE TRUTH, I MAY HAVE NO CHANCE AT THIS POINT." onclick="showTextTooltip(event,this)" data-translation="Para ser sincero, talvez eu não tenha chance neste ponto."></div><div class="text-hotspot" style="left:39.875%;top:54.369791666666664%;width:36.375%;height:.9635416666666667%" data-text="I MEAN, YOU ALL LIVE IN THE SAME HOUSE NOW..." onclick="showTextTooltip(event,this)" data-translation="Quer dizer, vocês todos moram na mesma casa agora..."></div><div class="text-hotspot" style="left:13.875000000000002%;top:55.41666666666667%;width:14.75%;height:.671875%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:1.375%;top:56.057291666666664%;width:17.375%;height:.6145833333333333%" data-text="Ma" onclick="showTextTooltip(event,this)" data-translation="Ma"></div><div class="text-hotspot" style="left:55.75%;top:56.1875%;width:31.25%;height:1.1666666666666714%" data-text="GRUMBLE ww W" onclick="showTextTooltip(event,this)" data-translation="GRUNHIDO ww W"></div><div class="text-hotspot" style="left:59.12500000000001%;top:57.635416666666664%;width:23.874999999999993%;height:.7083333333333286%" data-text="W T-TOGETHER!" onclick="showTextTooltip(event,this)" data-translation="J-Juntos!"></div><div class="text-hotspot" style="left:3.375%;top:58.30729166666667%;width:26.25%;height:.4583333333333333%" data-text="GRUMBLE" onclick="showTextTooltip(event,this)" data-translation="GRUNHIDO"></div><div class="text-hotspot" style="left:13.375%;top:61.65625%;width:29.25%;height:.6354166666666666%" data-text="POKE" onclick="showTextTooltip(event,this)" data-translation="CUTUCAR"></div><div class="text-hotspot" style="left:67.25%;top:62.411458333333336%;width:3.5000000000000004%;height:.14583333333333334%" data-text="?" onclick="showTextTooltip(event,this)" data-translation="?"></div><div class="text-hotspot" style="left:28.875%;top:66.16666666666666%;width:39.25%;height:1.2135416666666714%" data-text="I REGRET... NOT HAVING ACCEPTED THE OFFER RIGHT AWAY." onclick="showTextTooltip(event,this)" data-translation="Eu me arrependo... de não ter aceitado a oferta imediatamente."></div><div class="text-hotspot" style="left:64.25%;top:69.23958333333333%;width:13.5%;height:.18229166666666666%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="Hmm."></div><div class="text-hotspot" style="left:21.5%;top:74.77083333333333%;width:40.125%;height:.9635416666666667%" data-text="I THOUGHT I COULD CATCH UP RATHER QUICKLY..." onclick="showTextTooltip(event,this)" data-translation="Achei que poderia alcançar rapidamente..."></div><div class="text-hotspot" style="left:53%;top:76.21875%;width:23.25%;height:.4583333333333333%" data-text="BUT IT'S GETTING MORE DIFFICULT." onclick="showTextTooltip(event,this)" data-translation="Mas está ficando mais difícil."></div><div class="text-hotspot" style="left:25.874999999999996%;top:80.01041666666666%;width:47.875%;height:.9635416666666667%" data-text="SHE SOUNDED VERY FRUSTRATED AND WASN'T REALLY GETTING TO THE POINT." onclick="showTextTooltip(event,this)" data-translation="Ela parecia muito frustrada e não estava realmente indo direto ao ponto."></div><div class="text-hotspot" style="left:63.87500000000001%;top:84.671875%;width:31.624999999999996%;height:1.234375%" data-text="NOM NOM" onclick="showTextTooltip(event,this)" data-translation="NHAM NHAM"></div><div class="text-hotspot" style="left:34.5%;top:85.93229166666667%;width:30.875000000000004%;height:.6979166666666666%" data-text="BUT I THINK I GET WHAT SHE'S TRYING TO SAY." onclick="showTextTooltip(event,this)" data-translation="Mas acho que entendi o que ela está tentando dizer."></div><div class="text-hotspot" style="left:26%;top:92.55208333333333%;width:28.375%;height:.9895833333333333%" data-text="ANYWAY, WHAT I'M TRYING TO SAY IS--" onclick="showTextTooltip(event,this)" data-translation="De qualquer forma, o que estou tentando dizer é--"></div><div class="text-hotspot" style="left:59%;top:94.171875%;width:27.875%;height:.22395833333333334%" data-text="ENOUGH." onclick="showTextTooltip(event,this)" data-translation="Chega."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/135/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20.25%;top:1.6145833333333335%;width:56.625%;height:1.4635416666666665%" data-text="I HAVE NO INTENTION OF LETTING YOU INTO MY CURRENT TEAM." onclick="showTextTooltip(event,this)" data-translation="Não tenho intenção de te deixar entrar na minha equipe atual."></div><div class="text-hotspot" style="left:23.625%;top:6.786458333333334%;width:28.125%;height:.22916666666666666%" data-text="...WHAT?" onclick="showTextTooltip(event,this)" data-translation="...O quê?"></div><div class="text-hotspot" style="left:3.375%;top:9.880208333333334%;width:4%;height:.25%" data-text="し" onclick="showTextTooltip(event,this)" data-translation="し"></div><div class="text-hotspot" style="left:53.625%;top:13.302083333333334%;width:3.125%;height:.30729166666666663%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:44.5%;top:14.364583333333334%;width:35%;height:.4166666666666667%" data-text="WH-WHAT DO YOU MEAN?" onclick="showTextTooltip(event,this)" data-translation="O-o que você quer dizer?"></div><div class="text-hotspot" style="left:29.875%;top:15.645833333333334%;width:26.5%;height:.9479166666666667%" data-text="YOU CLEARLY ASKED ME BEFORE--" onclick="showTextTooltip(event,this)" data-translation="Você claramente me pediu antes--"></div><div class="text-hotspot" style="left:73.125%;top:17.942708333333332%;width:26.125%;height:.8020833333333333%" data-text="LEAN" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.125%;top:26.28125%;width:55.25%;height:1.265625%" data-text="I'M PLANNING TO CREATE A CLAN, ERWEN." onclick="showTextTooltip(event,this)" data-translation="Estou planejando criar um clã, Erwen."></div><div class="text-hotspot" style="left:24%;top:32.255208333333336%;width:53.125%;height:.4114583333333333%" data-text="WHAAAAT?!" onclick="showTextTooltip(event,this)" data-translation="O QUÊ?!"></div><div class="text-hotspot" style="left:8.875%;top:41.59375%;width:53.37499999999999%;height:1.9270833333333335%" data-text="LAM" onclick="showTextTooltip(event,this)" data-translation="LAM"></div><div class="text-hotspot" style="left:29.875%;top:46.135416666666664%;width:42.5%;height:.4166666666666667%" data-text="A CLAN?!" onclick="showTextTooltip(event,this)" data-translation="Um clã?! 24.125%;top:51.881096144914075%;width:45.75%;height:1.4862981885740827%" data-text="I DON'T THINK WE CAN SAFELY EXPLORE THE LABYRINTH AT THIS POINT." onclick="showTextTooltip(event,this)" data-translation="NÃO ACHO QUE PODEMOS EXPLORAR O LABIRINTO COM SEGURANÇA NESTE MOMENTO."></div><div class="text-hotspot" style="left:21.375%;top:63.47538318625175%;width:57.875%;height:1.0276358569437993%" data-text="WHAT DO YOU SAY TO TEAMING UP WITH US?" onclick="showTextTooltip(event,this)" data-translation="O QUE ACHA DE SE JUNTAR A NÓS?"></div><div class="text-hotspot" style="left:22%;top:69.07222480260103%;width:55.25%;height:1.6430562006502498%" data-text="JOINING FORCES WITH OTHER PARTIES IS CLEARLY THE BEST WAY TO SURVIVE IN THIS CASE." onclick="showTextTooltip(event,this)" data-translation="UNIR FORÇAS COM OUTROS GRUPOS É CLARAMENTE A MELHOR MANEIRA DE SOBREVIVER NESTE CASO."></div><div class="text-hotspot" style="left:53.25%;top:73.03181607059916%;width:15.875%;height:.23803994426381792%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:55.875%;top:84.50418021365536%;width:19.5%;height:.48188574082676894%" data-text="THE THING IS..." onclick="showTextTooltip(event,this)" data-translation="A QUESTÃO É..."></div><div class="text-hotspot" style="left:25.124999999999996%;top:89.71783557826289%;width:49.875%;height:.7663725034835114%" data-text="...CAN I REALLY TRUST THEM?" onclick="showTextTooltip(event,this)" data-translation="...POSSO REALMENTE CONFIAR NELES?"></div><div class="text-hotspot" style="left:64.75%;top:96.94612169066419%;width:33.75%;height:.15675801207617276%" data-text="To Be Continued" onclick="showTextTooltip(event,this)" data-translation="Continua..."></div><div class="text-hotspot" style="left:83.5%;top:97.40478402229448%;width:14.875%;height:.33093358104969806%" data-text="Sc revolution" onclick="showTextTooltip(event,this)" data-translation="Revolução Sc"></div><div class="text-h
