o, mas 'still' adiciona ênfase."></div><div class="text-hotspot" style="left:25.624999999999996%;top:42.25%;width:44%;height:.9739583333333333%" data-text="YOU SEEM TO BE DOING PERFECTLY FINE, MS. RAVEN." onclick="showTextTooltip(event,this)" data-translation="VOCÊ PARECE ESTAR INDO MUITO BEM, SRTA. RAVEN."></div><div class="text-hotspot" style="left:21.25%;top:43.583333333333336%;width:23.125%;height:.71875%" data-text="YOU'RE A TOUGH COOKIE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ É DURA NA QUEDA."></div><div class="text-hotspot" style="left:10.625%;top:53.489583333333336%;width:65%;height:1.2135416666666665%" data-text="PERHAPS YEARS OF MY RESEARCH IN ANATOMY HARDENED ME UP AGAINST DISTURBING SIGHTS LIKE THIS." onclick="showTextTooltip(event,this)" data-translation="TALVEZ ANOS DE MINHA PESQUISA EM ANATOMIA ME TENHAM ENDURECIDO CONTRA VISÕES PERTURBADORAS COMO ESTA." data-tips="💡 'Hardened me up against' usa 'harden up' como phrasal verb que significa 'tornar-se resistente a'."></div><div class="text-hotspot" style="left:25.874999999999996%;top:60.57812500000001%;width:26.875%;height:.4479166666666667%" data-text="AH, WE'RE HERE." onclick="showTextTooltip(event,this)" data-translation="AH, CHEGAMOS."></div><div class="text-hotspot" style="left:14.249999999999998%;top:64.984375%;width:76.375%;height:3.390625%" data-text="THERE'S A SECRET DOOR BEHIND THIS WALL ACCORDING TO THE MAP I MEMORIZED BEFORE VENTURING IN HERE. AND AN UNDEAD GOLEM IS SUPPOSEDLY LYING IN WAIT. WE'LL RUN INTO IT IMMEDIATELY." onclick="showTextTooltip(event,this)" data-translation="HÁ UMA PORTA SECRETA ATRÁS DESTA PAREDE, SEGUNDO O MAPA QUE MEMORIZEI ANTES DE ENTRAR AQUI. E UM GOLEM UNDEAD ESTÁ SUPOSTAMENTE À ESPREITA. VAMOS ENCONTRÁ-LO IMEDIATAMENTE." data-tips="💡 'Supposedly lying in wait' usa 'supposedly' para indicar algo esperado ou presumido, mas não confirmado."></div><div class="text-hotspot" style="left:15.5%;top:72.96354166666667%;width:70%;height:1.4739583333333286%" data-text="I WOULD HAVE ACQUIRED THE MAP OF THE CITADEL AT THE JAILER'S ROOM IN MY PLAYTHROUGH. SHE'S STUDIOUS TO HAVE MADE THOROUGH PREPARATIONS." onclick="showTextTooltip(event,this)" data-translation="EU TERIA ADQUIRIDO O MAPA DA CIDADELA NA SALA DO CARCEREIRO NA MINHA JOGADA. ELA É ESTUDIOSA POR TER FEITO PREPARAÇÕES MINUCIOSAS." data-tips="💡 'Would have acquired' é uma estrutura usada para falar sobre ações que teriam acontecido sob certas condições no passado, mas não aconteceram. É um exemplo de third conditional."></div><div class="text-hotspot" style="left:11%;top:81.22395833333333%;width:60%;height:.7135416666666666%" data-text="WE SHOULD LEAVE OUR BACKPACKS HERE AND HEAD INSIDE." onclick="showTextTooltip(event,this)" data-translation="DEVEMOS DEIXAR NOSSAS MOCHILAS AQUI E ENTRAR." data-tips="💡 'Head inside' é uma expressão que significa 'entrar'. 'Head' pode ser usado como verbo informal para 'ir em direção a' algum lugar."></div><div class="text-hotspot" style="left:27.750000000000004%;top:90.8125%;width:47.125%;height:.9583333333333333%" data-text="AND PLEASE LIGHT THE TORCH ON YOUR HELMET, MR. BJORN." onclick="showTextTooltip(event,this)" data-translation="E POR FAVOR, ACENDA A TOCHA NO SEU CAPACETE, SR. BJORN."></div><div class="text-hotspot" style="left:65%;top:93.72395833333333%;width:34.875%;height:.9583333333333333%" data-text="BLAZE" onclick="showTextTooltip(event,this)" data-translation="CHAMA"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/25/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:28.125%;top:1.5885416666666665%;width:43.625%;height:.9375000000000004%" data-text="BE READY. I'M OPENING IT." onclick="showTextTooltip(event,this)" data-translation="FIQUE PRONTO. VOU ABRIR."></div><div class="text-hotspot" style="left:27.750000000000004%;top:3.7239583333333335%;width:72.125%;height:2.328125%" data-text="CREAK" onclick="showTextTooltip
