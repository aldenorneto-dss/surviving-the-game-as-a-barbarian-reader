<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>57</title></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/57/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:9%;top:4.125%;width:33.75%;height:.7447916666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:35.625%;top:7.895833333333334%;width:35.625%;height:.8541666666666666%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:12.25%;top:12.947916666666668%;width:55.125%;height:.953125%" data-text="STOP STARING AT ME AND SPEAK UP IF THERE'S SOMETHING YOU WANT TO SAY." onclick="showTextTooltip(event,this)" data-translation="PARE DE ME ENCARAM E FALE LOGO SE TEM ALGO QUE QUER DIZER." data-tips="💡 &quot;FALE LOGO&quot; em inglês é **&quot;speak up&quot;**, que significa expressar-se ou falar mais alto. É um **phrasal verb** usado para encorajar alguém a se manifestar. - **Speak up** if you have any questions during the presentation. - Please **speak up**; I can't hear you."></div><div class="text-hotspot" style="left:40.125%;top:17.604166666666668%;width:17.25%;height:.40104166666666663%" data-text="TAP" onclick="showTextTooltip(event,this)" data-translation="TAP"></div><div class="text-hotspot" style="left:44.125%;top:19.677083333333336%;width:40.375%;height:1.2083333333333333%" data-text="...HOW DID YOU KNOW I HAD SOMETHING I WANTED TO SAY?" onclick="showTextTooltip(event,this)" data-translation="...COMO VOCÊ SABIA QUE EU TINHA ALGO QUE QUERIA DIZER?"></div><div class="text-hotspot" style="left:26.5%;top:25.244791666666664%;width:47.875%;height:.921875%" data-text="YOUR GLANCE GAVE IT AWAY." onclick="showTextTooltip(event,this)" data-translation="SEU OLHAR ENTREGOU." data-tips="💡 &quot;Gave it away&quot; é uma expressão que significa revelar algo sem querer. Não é literal, pois não envolve dar algo fisicamente. - Her smile **gave it away** that she was happy. - The look on his face **gave it away**."></div><div class="text-hotspot" style="left:0;top:30.307291666666668%;width:7.625%;height:.09375%" data-text="wwwwww" onclick="showTextTooltip(event,this)" data-translation="wwwwww"></div><div class="text-hotspot" style="left:26.5%;top:43.427083333333336%;width:49.25%;height:.7083333333333333%" data-text="NEXT DAY AT NOON, AT THE CAFÉ THE PROMISE OF FLOWING WATER" onclick="showTextTooltip(event,this)" data-translation="NO DIA SEGUINTE AO MEIO-DIA, NO CAFÉ A PROMESSA DA ÁGUA CORRENTE"></div><div class="text-hotspot" style="left:20.75%;top:45.15104166666667%;width:26.5%;height:.625%" data-text="RING" onclick="showTextTooltip(event,this)" data-translation="RING"></div><div class="text-hotspot" style="left:75.125%;top:47.36458333333333%;width:23.125%;height:.35416666666666663%" data-text="OH MY" onclick="showTextTooltip(event,this)" data-translation="OH MEU"></div><div class="text-hotspot" style="left:19.5%;top:47.546875%;width:20.375%;height:.4114583333333333%" data-text="HAHA" onclick="showTextTooltip(event,this)" data-translation="HAHA"></div><div class="text-hotspot" style="left:20%;top:53.578125%;width:51.625%;height:1.203125%" data-text="UGH, I WAS WONDERING WHAT KIND OF ESTABLISHMENT IT WAS AFTER HEARING THE NAME." onclick="showTextTooltip(event,this)" data-translation="UGH, EU ESTAVA ME PERGUNTANDO QUE TIPO DE ESTABELECIMENTO ERA DEPOIS DE OUVIR O NOME." data-tips="💡 &quot;I was wondering&quot; é uma forma educada de introduzir uma pergunta ou dúvida. É comum em inglês para suavizar uma solicitação ou curiosidade. - **I was wondering** if you could help me with this task. - **I was wondering** what time the meeting starts."></div><div class="text-hotspot" style="left:55.375%;top:55.3125%;width:36.25%;height:.8541666666666666%" data-text="SLAM" onclick="showTextTooltip(event,this)" data-translation="SLAM"></div><div class="text-hotspot" style="left:4.25%;top:57.52083333333333%;width:31.374999999999996%;height:.6666666666666667%" data-text="CREAK" onclick="showTextTooltip(event,this)" data-translation="CREAK"></div><div class="text-hotspot" style="left:42.75%;top:57.567708333333336%;width:4%;height:.13541666666666669%" data-text="D" onclick="showTextTooltip(event,this)" data-translation="D"></div><div class="text-hotspot" style="left:11.25%;top:59.95312499999999%;width:31.25%;height:.3489583333333357%" data-text="A BARBARIAN...?" onclick="showTextTooltip(event,this)" data-translation="UM BÁRBARO...?"></div><div class="text-hotspot" style="left:69.75%;top:60.26041666666667%;width:28.249999999999996%;height:.4322916666666667%" data-text="MURMUR" onclick="showTextTooltip(event,this)" data-translation="MURMÚRIO"></div><div class="text-hotspot" style="left:6.75%;top:60.614583333333336%;width:29.25%;height:.5%" data-text="MURMUR" onclick="showTextTooltip(event,this)" data-translation="MURMÚRIO"></div><div class="text-hotspot" style="left:56.875%;top:60.93229166666667%;width:31.624999999999996%;height:.765625%" data-text="DOES THE OWNER OWE HIM MONEY OR SOMETHING...?" onclick="showTextTooltip(event,this)" data-translation="O DONO DEVE DINHEIRO PARA ELE OU ALGO ASSIM...?" data-tips="💡 &quot;Owe&quot; significa dever, geralmente em um contexto financeiro. É uma palavra útil para expressar obrigações. - I **owe** you an apology for my mistake. - She **owes** him $50."></div><div class="text-hotspot" style="left:31.75%;top:63.35937499999999%;width:35.5%;height:.546875%" data-text="IT WAS A DESSERT CAFÉ." onclick="showTextTooltip(event,this)" data-translation="ERA UM CAFÉ DE SOBREMESAS."></div><div class="text-hotspot" style="left:70.375%;top:64.51041666666667%;width:15.125%;height:.125%" data-text="DAMN IT..." onclick="showTextTooltip(event,this)" data-translation="MALDIÇÃO..."></div><div class="text-hotspot" style="left:47.25%;top:69.08333333333333%;width:36.75%;height:.48958333333333337%" data-text="MR. BJORN? OVER HERE!" onclick="showTextTooltip(event,this)" data-translation="SR. BJORN? AQUI!"></div><div class="text-hotspot" style="left:58.375%;top:73.32291666666667%;width:37.625%;height:.8593750000000001%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:44.625%;top:75.47395833333333%;width:38.75%;height:.9635416666666714%" data-text="YOU'RE THE ONE THAT WANTED TO SEE ME?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ É QUEM QUERIA ME VER?" data-tips="💡 &quot;You're the one that...&quot; é uma estrutura usada para identificar ou destacar alguém responsável por uma ação. - **You're the one that** left the door open. - **You're the one that** wanted to change the plan."></div><div class="text-hotspot" style="left:24.875%;top:80.140625%;width:51.125%;height:.9375%" data-text="THAT'S RIGHT. YOU MAY CALL ME SHAVIN." onclick="showTextTooltip(event,this)" data-translation="EXATO. PODE ME CHAMAR DE SHAVIN."></div><div class="text-hotspot" style="left:12.125%;top:88.99479166666666%;width:75.625%;height:.9947916666666667%" data-text="SHAVIN EMOOR TIER-7 ADMINISTRATOR AT RABIGHION OFFICE OF ADMINISTRATIONS FRIEND (?) OF THE LIBRARIAN" onclick="showTextTooltip(event,this)" data-translation="SHAVIN EMOOR ADMINISTRADOR NÍVEL 7 NO ESCRITÓRIO DE ADMINISTRAÇÕES DE RABIGHION AMIGO (?) DO BIBLIOTECÁRIO"></div><div class="text-hotspot" style="left:36.25%;top:91.671875%;width:45.375%;height:1.2239583333333333%" data-text="SHE SEEMS TO BE IN HER EARLY 30S. I WAS EXPECTING THE LIBRARIAN'S FRIEND TO BE YOUNGER..." onclick="showTextTooltip(event,this)" data-translation="ELA PARECE TER UNS 30 E POUCOS ANOS. EU ESPERAVA QUE A AMIGA DO BIBLIOTECÁRIO FOSSE MAIS JOVEM..." data-tips="💡 'Early 30s' é uma expressão usada para indicar que alguém está na faixa dos 30 a 34 anos."></div><div class="text-hotspot" style="left:8.625%;top:97.86458333333333%;width:55.875%;height:1.4739583333333428%" data-text="I DIDN'T ORDER ANYTHING BECAUSE I DIDN'T KNOW WHAT YOU WOULD WANT. ANYTHING YOU GOT IN MIND?" onclick="showTextTooltip(event,this)" data-translation="NÃO PEDI NADA PORQUE NÃO SABIA O QUE VOCÊ QUERIA. TEM ALGO EM MENTE?" data-tips="💡 &quot;Got in mind&quot; é uma expressão informal que significa ter algo em mente ou estar pensando em algo específico. - Do you **have anything in mind** for dinner? - I **got in mind** a few places we could visit."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/57/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:52.25%;top:.5833333333333334%;width:35.25%;height:.5208333333333333%" data-text="STEAK AND BEER." onclick="showTextTooltip(event,this)" data-translation="BIFE E CERVEJA."></div><div class="text-hotspot" style="left:51.625%;top:1.59375%;width:37.75%;height:1.2552083333333333%" data-text="108800 PLOP" onclick="showTextTooltip(event,this)" data-translation="108800 PLOP"></div><div class="text-hotspot" style="left:46.875%;top:4.536458333333333%;width:21%;height:.421875%" data-text="...I'M SORRY?" onclick="showTextTooltip(event,this)" data-translation="...DESCULPE?"></div><div class="text-hotspot" style="left:21.625%;top:6.322916666666667%;width:37.75%;height:1.2239583333333333%" data-text="NOTHING, IF THEY DON'T HAVE IT HERE. I DON'T LIKE SWEETS." onclick="showTextTooltip(event,this)" data-translation="NADA, SE NÃO TIVEREM AQUI. NÃO GOSTO DE DOCES."></div><div class="text-hotspot" style="left:31.125000000000004%;top:8.020833333333334%;width:53.125%;height:2.036458333333334%" data-text="HMPH I SUPPOSE THIS SHOULD SUFFICE FOR TELLING A BARBARIAN TO COME TO A PLACE LIKE THIS." onclick="showTextTooltip(event,this)" data-translation="HMPH SUPOSTO QUE ISSO DEVE SER SUFICIENTE PARA DIZER A UM BÁRBARO PARA VIR A UM LUGAR COMO ESTE." data-tips="💡 &quot;Suppose&quot; é usado para expressar uma suposição ou expectativa. É uma forma mais formal de &quot;think&quot; ou &quot;guess&quot;. - I **suppose** we should leave now if we want to avoid traffic. - Do you **suppose** he'll be late again?"></div><div class="text-hotspot" style="left:33.625%;top:14.963541666666666%;width:28.625%;height:.6927083333333334%" data-text="WHAT IS IT THAT YOU WANTED?" onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ QUERIA?"></div><div class="text-hotspot" style="left:30.5%;top:18.041666666666668%;width:35.875%;height:.71875%" data-text="SWEE" onclick="showTextTooltip(event,this)" data-translation="SWEE"></div><div class="text-hotspot" style="left:51.37500000000001%;top:20.552083333333336%;width:38.75%;height:.4427083333333333%" data-text="RAGNA HASN'T TOLD YOU?" onclick="showTextTooltip(event,this)" data-translation="RAGNA NÃO TE CONTOU?"></div><div class="text-hotspot" style="left:30.25%;top:24.057291666666668%;width:33.875%;height:.4322916666666667%" data-text="RAGNA? THE LIBRARIAN?" onclick="showTextTooltip(event,this)" data-translation="RAGNA? A BIBLIOTECÁRIA?"></div><div class="text-hotspot" style="left:.375%;top:26.427083333333336%;width:1.7500000000000002%;height:.036458333333333336%" data-text="3" onclick="showTextTooltip(event,this)" data-translation="3"></div><div class="text-hotspot" style="left:9.625%;top:29.895833333333332%;width:31.5%;height:.96875%" data-text="OH, SO YOU DON'T EVEN KNOW HER NAME." onclick="showTextTooltip(event,this)" data-translation="OH, ENTÃO VOCÊ NEM SABE O NOME DELA."></div><div class="text-hotspot" style="left:25.874999999999996%;top:32.854166666666664%;width:38.375%;height:.9479166666666667%" data-text="I GUESS THAT MAKES SENSE. SHE IS LIKE THAT." onclick="showTextTooltip(event,this)" data-translation="IMAGINO QUE FAZ SENTIDO. ELA É ASSIM." data-tips="💡 &quot;Makes sense&quot; é uma expressão comum usada para indicar que algo é lógico ou compreensível. - It **makes sense** to save money for emergencies. - Her explanation **makes sense** now."></div><div class="text-hotspot" style="left:43.875%;top:34.265625%;width:41.375%;height:.9375%" data-text="HER FULL NAME IS RAGNA LITANIEL PEPROK." onclick="showTextTooltip(event,this)" data-translation="O NOME COMPLETO DELA É RAGNA LITANIEL PEPROK."></div><div class="text-hotspot" style="left:11.375%;top:36.994791666666664%;width:39.25%;height:.43750000000000006%" data-text="...IS SHE A NOBLEWOMAN?" onclick="showTextTooltip(event,this)" data-translation="...ELA É UMA NOBRE?"></div><div class="text-hotspot" style="left:53%;top:39.020833333333336%;width:32.625%;height:.4479166666666667%" data-text="NO, SHE ISN'T, BUT..." onclick="showTextTooltip(event,this)" data-translation="NÃO, ELA NÃO É, MAS..."></div><div class="text-hotspot" style="left:23.75%;top:43.38020833333333%;width:38.625%;height:.6927083333333357%" data-text="HMM. THERE MUST BE A STORY BEHIND IT." onclick="showTextTooltip(event,this)" data-translation="HMM. DEVE HAVER UMA HISTÓRIA POR TRÁS DISSO." data-tips="💡 &quot;There must be&quot; é usado para expressar uma conclusão lógica ou suposição. - **There must be** a reason why she left early. - **There must be** something we can do to help."></div><div class="text-hotspot" style="left:46.25%;top:48.822916666666664%;width:16.375%;height:.140625%" data-text="FORGET-IT" onclick="showTextTooltip(event,this)" data-translation="ESQUEÇA"></div><div class="text-hotspot" style="left:46.375%;top:49.328125%;width:29.375%;height:.6927083333333334%" data-text="TELL ME WHAT IT IS YOU WANT." onclick="showTextTooltip(event,this)" data-translation="ME DIGA O QUE VOCÊ QUER."></div><div class="text-hotspot" style="left:18%;top:51.96354166666667%;width:42.25%;height:.6822916666666666%" data-text="IT'S A REQUEST TO INVESTIGATE THE SEWERS." onclick="showTextTooltip(event,this)" data-translation="É UM PEDIDO PARA INVESTIGAR OS ESGOTOS." data-tips="💡 &quot;Request&quot; é um substantivo que significa um pedido formal ou gentil. É usado em contextos mais formais. - I have a **request** for additional resources. - She made a **request** for a day off."></div><div class="text-hotspot" style="left:19%;top:57.09375%;width:39.875%;height:1.2395833333333357%" data-text="WE HAVE SENT PATROLS THERE ON A REGULAR BASIS," onclick="showTextTooltip(event,this)" data-translation="TEMOS ENVIADO PATRULHAS LÁ REGULARMENTE,"></div><div class="text-hotspot" style="left:37.25%;top:58.69791666666667%;width:47.25%;height:.9583333333333286%" data-text="BECAUSE CRIMINALS WOULD SOMETIMES HIDE THERE, BUT..." onclick="showTextTooltip(event,this)" data-translation="PORQUE CRIMINOSOS ÀS VEZES SE ESCONDEM LÁ, MAS..." data-tips="💡 'Would sometimes hide' usa 'would' para descrever uma ação habitual no passado."></div><div class="text-hotspot" style="left:18.625%;top:61.4375%;width:19.25%;height:.16666666666666669%" data-text="...BUT?" onclick="showTextTooltip(event,this)" data-translation="...MAS?"></div><div class="text-hotspot" style="left:33%;top:62.635416666666664%;width:37.875%;height:1.2083333333333428%" data-text="NOT SURE IF SHE'S DELIBERATELY NOT FINISHING HER SENTENCES." onclick="showTextTooltip(event,this)" data-translation="NÃO TENHO CERTEZA SE ELA ESTÁ DELIBERADAMENTE NÃO TERMINANDO AS FRASES."></div><div class="text-hotspot" style="left:16.625%;top:67.40625%;width:65.375%;height:1.640625%" data-text="... UNFORTUNATELY, THE TEAM THAT HAD BEEN DOING THIS WAS INVOLVED IN THE THIRD FLOOR INCIDENT RECENTLY." onclick="showTextTooltip(event,this)" data-translation="...INFELIZMENTE, A EQUIPE QUE FAZIA ISSO FOI ENVOLVIDA NO INCIDENTE DO TERCEIRO ANDAR RECENTEMENTE."></div><div class="text-hotspot" style="left:7.5%;top:76.31770833333333%;width:15.625%;height:.40104166666666663%" data-text="OH" onclick="showTextTooltip(event,this)" data-translation="OH"></div><div class="text-hotspot" style="left:9%;top:76.90625%;width:44.5%;height:1.203125%" data-text="SO YOU NEED PEOPLE TO PERFORM THIS TASK IN THEIR STEAD." onclick="showTextTooltip(event,this)" data-translation="ENTÃO VOCÊ PRECISA DE PESSOAS PARA REALIZAR ESSA TAREFA NO LUGAR DELES." data-tips="💡 &quot;In their stead&quot; significa no lugar deles. &quot;Stead&quot; é uma palavra mais formal e menos comum, mas útil para contextos formais. - She will lead the meeting **in his stead**. - They sent a representative **in their stead**."></div><div class="text-hotspot" style="left:42.875%;top:80.13541666666667%;width:43%;height:1.2083333333333286%" data-text="YEAH. THAT'S WHEN RAGNA TOLD ME ABOUT YOU, MR. BJORN." onclick="showTextTooltip(event,this)" data-translation="SIM. FOI QUANDO RAGNA ME FALOU SOBRE VOCÊ, SR. BJORN."></div><div class="text-hotspot" style="left:26%;top:85.19791666666666%;width:10.625%;height:.10937500000000001%" data-text="I SEE." onclick="showTextTooltip(event,this)" data-translation="ENTENDO."></div><div class="text-hotspot" style="left:32.625%;top:85.71875%;width:27.750000000000004%;height:.4427083333333333%" data-text="I GET THE PICTURE." onclick="showTextTooltip(event,this)" data-translation="ENTENDI A SITUAÇÃO."></div><div class="text-hotspot" style="left:41.75%;top:86.90104166666667%;width:43.875%;height:.9479166666666667%" data-text="BUT WHY ME? I'M SURE THERE ARE BETTER CANDIDATES." onclick="showTextTooltip(event,this)" data-translation="MAS POR QUE EU? TENHO CERTEZA DE QUE HÁ CANDIDATOS MELHORES." data-tips="💡 &quot;I'm sure&quot; é uma expressão usada para expressar confiança em uma afirmação. - **I'm sure** you'll do great on the test. - **I'm sure** he has a good reason for being late."></div><div class="text-hotspot" style="left:20%;top:90.98958333333333%;width:33.875%;height:.953125%" data-text="DON'T TELL ME SHE WAS SENT BY THE EVIL SPIRIT HUNTERS--" onclick="showTextTooltip(event,this)" data-translation="NÃO ME DIGA QUE ELA FOI ENVIADA PELOS CAÇADORES DE ESPÍRITOS MALIGNOS--"></div><div class="text-hotspot" style="left:59.75%;top:93.453125%;width:28.625%;height:.16666666666666669%" data-text="BECAUSE..." onclick="showTextTooltip(event,this)" data-translation="PORQUE..."></div><div class="text-hotspot" style="left:1.7500000000000002%;top:97.41666666666666%;width:20.625%;height:.8958333333333334%" data-text="XX" onclick="showTextTooltip(event,this)" data-translation="XX"></div><div class="text-hotspot" style="left:21.375%;top:98.33854166666667%;width:56.75%;height:1.390625%" data-text="...YOU'RE THE MOST FAMOUS ADVENTURER THESE DAYS!" onclick="showTextTooltip(event,this)" data-translation="...VOCÊ É O AVENTUREIRO MAIS FAMOSO DOS ÚLTIMOS TEMPOS!" data-tips="💡 &quot;These days&quot; é uma expressão que significa atualmente ou nos tempos atuais. - People use smartphones a lot **these days**. - **These days**, it's common to work from home."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/57/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:8.875%;top:.8750000000000001%;width:31.125%;height:.7499999999999999%" data-text="LITTLE VALCAN = CELEBRITY" onclick="showTextTooltip(event,this)" data-translation="PEQUENO VALCAN = CELEBRIDADE"></div><div class="text-hotspot" style="left:68.375%;top:4.223958333333333%;width:22.5%;height:.203125%" data-text="WHAT?!" onclick="showTextTooltip(event,this)" data-translation="O QUÊ?!"></div><div class="text-hotspot" style="left:23.25%;top:8.333333333333332%;width:53.125%;height:.9479166666666667%" data-text="I WAS ACTUALLY CURIOUS. I WANTED TO MEET YOU IN PERSON!" onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA REALMENTE CURIOSO. QUERIA TE CONHECER PESSOALMENTE!" data-tips="💡 'In person' é uma expressão que significa 'pessoalmente', enfatizando a presença física."></div><div class="text-hotspot" style="left:10.875%;top:13.53125%;width:50%;height:1.46875%" data-text="OH, I'M PLANNING TO TAKE SOME COOKIES TO GO FROM HERE." onclick="showTextTooltip(event,this)" data-translation="OH, ESTOU PLANEJANDO LEVAR ALGUNS BISCOITOS DAQUI."></div><div class="text-hotspot" style="left:29.625%;top:15.40625%;width:62.625%;height:1.140625%" data-text="CAN I TELL MY COLLEAGUES I GOT THEM FROM YOU, MR. BJORN?" onclick="showTextTooltip(event,this)" data-translation="POSSO DIZER AOS MEUS COLEGAS QUE OS CONSEGUI DE VOCÊ, SR. BJORN?"></div><div class="text-hotspot" style="left:16%;top:23.916666666666668%;width:30.25%;height:.47395833333333337%" data-text="D-DO AS YOU WISH." onclick="showTextTooltip(event,this)" data-translation="F-FIQUE À VONTADE."></div><div class="text-hotspot" style="left:69.125%;top:25.239583333333332%;width:13.5%;height:.1875%" data-text="YAY!" onclick="showTextTooltip(event,this)" data-translation="YAY!"></div><div class="text-hotspot" style="left:54.125%;top:25.713541666666668%;width:1%;height:.04166666666666667%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:14.000000000000002%;top:29.541666666666664%;width:23.875%;height:.4583333333333333%" data-text="AHEM." onclick="showTextTooltip(event,this)" data-translation="AHEM."></div><div class="text-hotspot" style="left:23.125%;top:30.239583333333332%;width:59.375%;height:1.5%" data-text="SO, WHAT DO YOU SAY? THE REWARD IS ONLY 150,000 STONES, BUT IT WON'T BE A BAD JOB TO TAKE ON." onclick="showTextTooltip(event,this)" data-translation="ENTÃO, O QUE ME DIZ? A RECOMPENSA É APENAS 150.000 PEDRAS, MAS NÃO SER
