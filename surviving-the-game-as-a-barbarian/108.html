dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/108/0.jpg" style="width:100%;display:block"></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/108/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:12.875%;top:1.609375%;width:74.625%;height:2.0885416666666665%" data-text="SILENT" data-translation="SILÊNCIO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.875%;top:17.244791666666668%;width:32.75%;height:.4270833333333333%" data-text="GOSH, SAY SOMETHING." data-translation="Poxa, diga alguma coisa." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:45.75%;top:18.729166666666668%;width:23.125%;height:.11979166666666666%" data-text="SO AWKWARD..." data-translation="Que constrangedor..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24.375%;top:22.505208333333336%;width:47.625%;height:.6822916666666643%" data-text="WHY... DID YOU JUST SHOUT OUT?" data-translation="Por que... você acabou de gritar?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:54.125%;top:28.109374999999996%;width:25.624999999999996%;height:.703125%" data-text="I JUST FELT LIKE DOING IT." data-translation="Eu só senti vontade de fazer isso." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:34.125%;top:29.604166666666664%;width:29.875%;height:.4322916666666667%" data-text="IS THERE A PROBLEM?" data-translation="Há algum problema?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:29.75%;top:34.317708333333336%;width:40.25%;height:.8385416666666666%" data-text="...NO. THERE IS NO PROBLEM." data-translation="...Não. Não há problema." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:36.25%;top:43.307291666666664%;width:36.875%;height:.8750000000000001%" data-text="SWISH" data-translation="SWISH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.375%;top:48.13541666666667%;width:49.25%;height:2.5260416666666665%" data-text="BUT I SUPPOSE I OWE YOU AN APOLOGY. SNAP" data-translation="Mas acho que devo te pedir desculpas. SNAP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.875%;top:58.729166666666664%;width:40.75%;height:1.21875%" data-text="TO TELL YOU THE TRUTH, I WAS AGAINST THIS IMMATURE IDEA..." data-translation="Para dizer a verdade, eu era contra essa ideia imatura..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:33.625%;top:60.328125%;width:49.5%;height:1.46875%" data-text="...OF INTIMIDATING THE OTHER PARTY IN ORDER TO TAKE ADVANTAGE IN THE NEGOTIATION PROCESS." data-translation="...de intimidar a outra parte para tirar vantagem no processo de negociação." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.875%;top:65.69270833333334%;width:18.75%;height:.13020833333333331%" data-text="ILLUSION..." data-translation="ILUSÃO..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:38.875%;top:66.671875%;width:31.5%;height:.16666666666666669%" data-text="VERY WELL." data-translation="Muito bem." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:52.87500000000001%;top:72.26041666666667%;width:32.74999999999999%;height:.7083333333333286%" data-text="I AM BJORN, SON OF YANDEL." data-translation="Eu sou Bjorn, filho de Yandel." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:33.125%;top:73.59895833333333%;width:36.125%;height:.6979166666666666%" data-text="ARE YOU THE CHIEFTAIN OF DRAGONIANS?" data-translation="Você é o chefe dos Dragonianos?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.125000000000004%;top:77.18229166666667%;width:17.375%;height:.10416666666666667%" data-text="CHIEFTAIN..." data-translation="Chefe..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:34.375%;top:77.84375%;width:42.375%;height:.9739583333333333%" data-text="I GUESS YOU COULD SAY THAT, IN YOUR TERMINOLOGY." data-translation="Acho que você poderia dizer isso, na sua terminologia." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.625%;top:81.1875%;width:19.125%;height:.35416666666666663%" data-text="RISE" data-translation="LEVANTAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22%;top:84.140625%;width:57.875%;height:.6822916666666666%" data-text="BUT YOU CAN SIMPLY CALL ME PIRSEARAIDORMUS." data-translation="Mas você pode simplesmente me chamar de Pirsearaidormus." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.25%;top:89.16666666666667%;width:39.625%;height:1.1406249999999858%" data-text="THERE'S NOTHING SIMPLE ABOUT THAT NAME." data-translation="Não há nada de simples nesse nome." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:72.875%;top:93.25%;width:8.875%;height:.17708333333333331%" data-text="P..." data-translation="P..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:5.5%;top:96.92708333333333%;width:33.125%;height:.48958333333333337%" data-text="CHUCKLE" data-translation="RISADA" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:26.125%;top:97.92708333333333%;width:20.375%;height:.171875%" data-text="I JEST." data-translation="Estou brincando." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32%;top:99.07291666666667%;width:37.875%;height:.6927083333333286%" data-text="YOU CAN JUST CALL ME LAPIR." data-translation="Você pode me chamar de Lapir." onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/108/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:82.375%;top:1.7916666666666667%;width:7.75%;height:.27083333333333337%" data-text="#" data-translation="#" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:51.74999999999999%;top:3.078125%;width:9.375%;height:.3697916666666667%" data-text="A" data-translation="A" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:60.25%;top:5.010416666666666%;width:3.875%;height:.171875%" data-text="Dobb" data-translation="Dobb" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.625%;top:6.114583333333334%;width:16.125%;height:.4427083333333333%" data-text="OKAY, LAPIR." data-translation="Certo, Lapir." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19%;top:7.473958333333333%;width:53.25%;height:.9583333333333333%" data-text="YOU CAN ALSO CALL ME BJORN OR YANDEL, WHICHEVER YOU LIKE BETTER." data-translation="Você também pode me chamar de Bjorn ou Yandel, como preferir." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:26.5%;top:12.973958333333332%;width:21.125%;height:.4270833333333333%" data-text="SURE, YANDEL." data-translation="Claro, Yandel." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.25%;top:17.411458333333332%;width:44.125%;height:.6875%" data-text="CAN YOU SHOW ME THE DRAGON SLAYER SWORD?" data-translation="Você pode me mostrar a Espada Matadora de Dragões?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:44%;top:18.71875%;width:41%;height:.9427083333333334%" data-text="I'M STILL HAVING A HARD TIME BELIEVING IT." data-translation="Ainda estou tendo dificuldade em acreditar." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:8.25%;top:23.151041666666668%;width:50.24999999999999%;height:2.171875%" data-text="RUSTLE HE JUST SAID HE DOESN'T TRUST ME TO MY FACE." data-translation="RUSTLE Ele acabou de dizer que não confia em mim na minha cara." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:56.99999999999999%;top:27.338541666666664%;width:41.625%;height:1.1510416666666667%" data-text="PIERCE" data-translation="PERFURAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:43.125%;top:31.041666666666668%;width:37.75%;height:.96875%" data-text="BUT THERE'S NO NEED TO TALK, WHEN I CAN JUST SHOW HIM." data-translation="Mas não há necessidade de falar, quando posso simplesmente mostrar a ele." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.375%;top:35.932291666666664%;width:29.25%;height:.4218750000000071%" data-text="SO IT WAS TRUE." data-translation="Então era verdade." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:73.75%;top:37.34375%;width:21.5%;height:.3854166666666667%" data-text="SWOOSH" data-translation="SWOOSH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.125%;top:37.41145833333333%;width:4%;height:.2916666666666667%" data-text="ли" data-translation="ли" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.5%;top:40.291666666666664%;width:27.375%;height:.6614583333333334%" data-text="FLINCH" data-translation="RECUO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.875%;top:41.5%;width:19.625%;height:.4166666666666667%" data-text="WH-WHEN DID HE...?" data-translation="Qu-quando ele...?!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.625%;top:47.463541666666664%;width:41.875%;height:1.3489583333333333%" data-text="ZING" data-translation="ZING" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.5%;top:56.73958333333333%;width:4.75%;height:.036458333333333336%" data-text="..." data-translation="..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.375%;top:60.66666666666667%;width:23.875%;height:.4427083333333333%" data-text="...HOW WAS HE?" data-translation="...COMO ELE ESTAVA?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.625%;top:61.864583333333336%;width:32.125%;height:.7135416666666666%" data-text="I WOULD LIKE TO HEAR MORE." data-translation="GOSTARIA DE OUVIR MAIS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.75%;top:72.75%;width:41.125%;height:.71875%" data-text="I TOLD HIM A SUMMARY OF WHAT HAPPENED THAT DAY," data-translation="Eu contei a ele um resumo do que aconteceu naquele dia," onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.624999999999996%;top:74.10416666666667%;width:36.875%;height:.9531249999999858%" data-text="OMITTING DETAILS THAT CAN COME BACK TO BITE ME LATER." data-translation="omitindo detalhes que podem me prejudicar depois." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:30%;top:79.35416666666667%;width:37.625%;height:.703125%" data-text="I SEE... SO HE'S GONE THAT FAR..." data-translation="Entendo... Então ele foi tão longe assim..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.25%;top:86.61458333333333%;width:47.25%;height:1.7395833333333286%" data-text="I WILL KEEP THE RETURN OF THE DRAGON SLAYER SWORD A SECRET AS PER YOUR REQUEST." data-translation="Vou manter o retorno da Espada Matadora de Dragões em segredo, conforme seu pedido." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.875%;top:89.97916666666667%;width:31.5%;height:.6875%" data-text="WERE YOU CLOSE WITH HIM?" data-translation="Você era próximo dele?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:29.125%;top:95.53125%;width:42.125%;height:.84375%" data-text="HE IS... MY YOUNGER BROTHER." data-translation="Ele é... meu irmão mais novo." onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/108/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:15.875%;top:5.010416666666666%;width:20.25%;height:.18229166666666666%" data-text="WHAT?" data-translation="O quê?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:47.125%;top:7.166666666666667%;width:34.5%;height:.6927083333333334%" data-text="THAT IS WHY I COULDN'T STOP HIM." data-translation="É por isso que eu não consegui detê-lo." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:56.99999999999999%;top:12.677083333333334%;width:31%;height:.4270833333333333%" data-text="HOW IN THE WORLD...?!" data-translation="Como assim...?!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12%;top:15.161458333333332%;width:33.375%;height:.4270833333333333%" data-text="THE ANCIENT DRAGON!" data-translation="O Dragão Ancião!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:63.87500000000001%;top:17.8125%;width:3.375%;height:.06770833333333334%" data-text="000" data-translation="000" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.124999999999998%;top:17.838541666666664%;width:3.6249999999999996%;height:.057291666666666664%" data-text="000" data-translation="000" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53.25%;top:21.916666666666668%;width:33.75%;height:1.2291666666666665%" data-text="THE ANCIENT DRAGON HAS PASSED AWAY!" data-translation="O Dragão Ancião faleceu!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:38.5%;top:24.911458333333332%;width:28.375%;height:1.3333333333333335%" data-text="THE DRAGON SLAYER SWORD IS GONE!" data-translation="A Espada Matadora de Dragões sumiu!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.875%;top:32.072916666666664%;width:28.625%;height:.7135416666666666%" data-text="WHERE ARE MY MANNERS?" data-translation="Onde estão meus modos?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:58.62500000000001%;top:34.901041666666664%;width:36.375%;height:.8958333333333334%" data-text="BULL" data-translation="BULL" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.625%;top:37.33854166666667%;width:27.875%;height:.9583333333333286%" data-text="I DON'T THINK I'VE SAID THIS YET." data-translation="Acho que ainda não disse isso." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.25%;top:42.5625%;width:59.25%;height:1.0572916666666665%" data-text="BJORN, SON OF YANDEL. THANK YOU FOR RETURNING THIS SWORD." data-translation="Bjorn, filho de Yandel. Obrigado por devolver esta espada." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:64.25%;top:45.921875%;width:28.999999999999996%;height:.765625%" data-text="BOW" data-translation="REVERÊNCIA" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.875%;top:50.0625%;width:11.875%;height:.7552083333333357%" data-text="000000 00000000000" data-translation="000000 00000000000" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:54.75%;top:50.265625%;width:8.625%;height:.5%" data-text="P00000000" data-translation="P00000000" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:8.75%;top:55.505208333333336%;width:14.374999999999998%;height:.421875%" data-text="6666" data-translation="6666" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.875%;top:56.640625%;width:44%;height:1.3541666666666667%" data-text="EVEN AFTER PROPERLY COMPENSATING YOU FOR THE EFFORT," data-translation="Mesmo depois de compensá-lo adequadamente pelo esforço," onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:38.5%;top:58.338541666666664%;width:49.125%;height:1.046875%" data-text="WE WILL NOT FORGET THAT YOU HAVE DONE US A BIG FAVOR." data-translation="não esqueceremos que você nos fez um grande favor." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.875%;top:63.104166666666664%;width:28.375%;height:.453125%" data-text="I DON'T THINK HE'S JUST SAYING THAT." data-translation="Não acho que ele está dizendo isso só por dizer." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:30.125%;top:64%;width:45.375%;height:1.2239583333333286%" data-text="HONESTLY, I WAS ONLY AFTER THE REWARDS ASSOCIATED WITH IT SO IT'S A BIT AWKWARD." data-translation="Honestamente, eu estava apenas atrás das recompensas associadas a isso, então é um pouco constrangedor." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.25%;top:70.50520833333334%;width:55.625%;height:.9374999999999858%" data-text="BUT IF THEY'RE OFFERING SPECIAL TREATMENT THERE'S NO REASON TO TURN IT DOWN." data-translation="Mas se estão oferecendo tratamento especial, não há razão para recusar." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:45.75%;top:75.79166666666667%;width:39.5%;height:.7083333333333286%" data-text="WHAT REWARD DO YOU WANT, YANDEL?" data-translation="Que recompensa você quer, Yandel?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.374999999999996%;top:81.40625%;width:27.250000000000004%;height:.6822916666666714%" data-text="WHAT CAN YOU GIVE ME?" data-translation="O que você pode me dar?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35%;top:86.86458333333333%;width:31%;height:.5572916666666667%" data-text="FIRST IS MONEY." data-translation="A primeira é dinheiro." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:48.125%;top:92.18229166666667%;width:.8750000000000001%;height:.03125%" data-text="°" data-translation="°" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22%;top:94.09895833333334%;width:32.5%;height:.6927083333333334%" data-text="MONETARY COMPENSATION FOR THIS..." data-translation="Compensação monetária por isso..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.25%;top:95.44270833333334%;width:39.25%;height:1.463541666666643%" data-text="MUST BE BIG ENOUGH FOR ME TO WEAR HIGH-TIER EQUIPMENTS FROM HEAD TO TOE. BUT..." data-translation="deve ser grande o suficiente para eu usar equipamentos de alto nível da cabeça aos pés. Mas..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:52.625%;top:98.05208333333333%;width:36%;height:.4270833333333333%" data-text="I DON'T NEED MONEY." data-translation="Eu não preciso de dinheiro." onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/108/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:25.374999999999996%;top:3.5312499999999996%;width:47.875%;height:.5729166666666666%" data-text="SECOND IS A COMPANION." data-translation="A segunda é um companheiro." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:44.25%;top:13.859374999999998%;width:42.625%;height:.953125%" data-text="I HEARD YOU'RE TRYING TO FORM A NEW TEAM." data-translation="Ouvi dizer que você está tentando formar um novo time." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18%;top:15.333333333333332%;width:53.25%;height:1.21875%" data-text="I WILL SEND A DRAGONIAN TO ASSIST YOU IN YOUR TR
