th:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/91/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:26.75%;top:5.796875%;width:46.75%;height:1.1406250000000009%" data-text="OTHER ADVENTURERS HAVE ENTERED THIS DUNGEON." onclick="showTextTooltip(event,this)" data-translation="OUTROS AVENTUREIROS ENTRARAM NESTE CALABOUÇO." data-tips="💡 Em inglês, &quot;dungeon&quot; é um termo frequentemente usado em jogos e histórias de fantasia para se referir a um local perigoso e cheio de desafios, como um calabouço ou masmorra. É um vocabulário útil para quem gosta de jogos de RPG."></div><div class="text-hotspot" style="left:18.375%;top:11.984375%;width:63.74999999999999%;height:.9479166666666667%" data-text="AND THEY ARE MUCH MORE POWERFUL THAN US." onclick="showTextTooltip(event,this)" data-translation="E ELES SÃO MUITO MAIS PODEROSOS DO QUE NÓS." data-tips="💡 A expressão &quot;much more powerful than&quot; é usada para comparações em que uma diferença significativa de poder ou habilidade é destacada. Você pode usar este padrão para outras comparações: &quot;much more interesting than&quot;, &quot;much more difficult than&quot;."></div><div class="text-hotspot" style="left:32.625%;top:20.572916666666664%;width:35.125%;height:.6770833333333334%" data-text="IT FEELS LIKE MY ABILITIES HAVE DOUBLED." onclick="showTextTooltip(event,this)" data-translation="PARECE QUE MINHAS HABILIDADES DOBRARAM." data-tips="💡 A expressão &quot;it feels like&quot; é usada para expressar uma impressão ou sensação subjetiva. Pode ser usada em várias situações: &quot;It feels like we're going in circles.&quot;, &quot;It feels like a dream.&quot;."></div><div class="text-hotspot" style="left:20.625%;top:29.1875%;width:39.625%;height:.7135416666666666%" data-text="THEY'RE ACTIVE ON FLOORS SIX OR HIGHER," onclick="showTextTooltip(event,this)" data-translation="ELES ESTÃO ATIVOS NOS ANDARES SEIS OU SUPERIORES,"></div><div class="text-hotspot" style="left:41%;top:30.734375000000004%;width:38.75%;height:.7083333333333333%" data-text="AND IT'S PROBABLY A TEAM, NOT A CLAN." onclick="showTextTooltip(event,this)" data-translation="E PROVAVELMENTE É UMA EQUIPE, NÃO UM CLÃ." data-tips="💡 A palavra &quot;clan&quot; em inglês pode se referir a um grupo de pessoas unidas por um interesse comum, especialmente em jogos online. É um vocabulário útil para quem participa de comunidades de jogos."></div><div class="text-hotspot" style="left:19.125%;top:39.630208333333336%;width:60.62499999999999%;height:.9375%" data-text="WHAT CAN WE DO NOW?" onclick="showTextTooltip(event,this)" data-translation="O QUE PODEMOS FAZER AGORA?"></div><div class="text-hotspot" style="left:28.749999999999996%;top:49.994791666666664%;width:43%;height:.8177083333333357%" data-text="J-JOIN FORCES WITH THEMMMM...?" onclick="showTextTooltip(event,this)" data-translation="U-UNIR FORÇAS COM ELES...?"></div><div class="text-hotspot" style="left:72.25%;top:56.75520833333333%;width:16%;height:.22395833333333334%" data-text="WE NEED" onclick="showTextTooltip(event,this)" data-translation="PRECISAMOS"></div><div class="text-hotspot" style="left:71.25%;top:56.848958333333336%;width:22.75%;height:.5364583333333357%" data-text="TO GET OUT OF HERRRRE" onclick="showTextTooltip(event,this)" data-translation="SAIR DAQUI"></div><div class="text-hotspot" style="left:43.125%;top:62.317708333333336%;width:44.25%;height:1.21875%" data-text="YOU SPEAK AS IF THEY'RE PLUNDERERS OR SOMETHING, BJORN." onclick="showTextTooltip(event,this)" data-translation="VOCÊ FALA COMO SE ELES FOSSEM SAQUEADORES OU ALGO ASSIM, BJORN." data-tips="💡 A expressão &quot;as if&quot; é usada para fazer comparações ou suposições. Pode ser usada em várias situações: &quot;He talks as if he knows everything.&quot;, &quot;She looks as if she's seen a ghost.&quot;."></div><div class="text-hotspot" style="left:67.625%;top:64.21875%;width:30.75%;height:.18229166666666666%" data-text="COMPLACENT" onclick="showTextTooltip(event,this)" data-translation="COMPLACENTE"></div><div class="text-hotspot" style="left:5.375%;top:69.6875%;width:74.625%;height:2.1197916666666714%" data-text="CHUCKLE EVEN IF THEY CATCH UP TO US, OUR ABILITIES ARE EQUAL IN THIS REALM. WE SHOULD BE ABLE TO DEAL WITH THEM." onclick="showTextTooltip(event,this)" data-translation="RISADA MESMO QUE ELES NOS ALCANCEM, NOSSAS HABILIDADES SÃO IGUAIS NESTE REINO. DEVEMOS SER CAPAZES DE LIDAR COM ELES." data-warning="1"></div><div class="text-hotspot" style="left:42.75%;top:72.57291666666667%;width:28.249999999999996%;height:.5208333333333333%" data-text="OVERLY CONFIDENT" onclick="showTextTooltip(event,this)" data-translation="EXCESSIVAMENTE CONFIANTE"></div><div class="text-hotspot" style="left:46.125%;top:75.1875%;width:20.625%;height:.1875%" data-text="NEUTRAL" onclick="showTextTooltip(event,this)" data-translation="NEUTRO"></div><div class="text-hotspot" style="left:15.5%;top:78.91145833333333%;width:23.875%;height:.5052083333333333%" data-text="HMM" onclick="showTextTooltip(event,this)" data-translation="HMM"></div><div class="text-hotspot" style="left:26.375%;top:79.65625%;width:53.25%;height:1.4895833333333335%" data-text="YOU NEVER KNOW WHAT WILL HAPPEN, SO MY SUGGESTION IS TO LOOK FOR A WAY OUT WHILE AVOIDING THEM." onclick="showTextTooltip(event,this)" data-translation="VOCÊ NUNCA SABE O QUE VAI ACONTECER, ENTÃO MINHA SUGESTÃO É PROCURAR UMA SAÍDA ENQUANTO EVITAMOS ELES." data-tips="💡 A expressão &quot;you never know&quot; é uma maneira de dizer que algo é incerto ou imprevisível. É uma frase comum em conversas: &quot;You never know when it might rain.&quot;, &quot;You never know who you'll meet.&quot;."></div><div class="text-hotspot" style="left:21.125%;top:82.90625%;width:57.5%;height:.8385416666666714%" data-text="I NEVER TRUSTED IN COLLECTIVE INTELLIGENCE." onclick="showTextTooltip(event,this)" data-translation="NUNCA CONFIEI NA INTELIGÊNCIA COLETIVA."></div><div class="text-hotspot" style="left:18.75%;top:86.06770833333334%;width:29.625%;height:.6979166666666666%" data-text="WHAT DO YOU THINK, BJORN?" onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ ACHA, BJORN?"></div><div class="text-hotspot" style="left:69.25%;top:88.41145833333334%;width:8.375%;height:.171875%" data-text="I..." onclick="showTextTooltip(event,this)" data-translation="EU..."></div><div class="text-hotspot" style="left:30%;top:92.32291666666667%;width:41.5%;height:1.1458333333333286%" data-text="NOW'S THE TIME TO ACT, NOT CONVINCE THEM." onclick="showTextTooltip(event,this)" data-translation="AGORA É A HORA DE AGIR, NÃO DE CONVENCÊ-LOS." data-tips="💡 A frase &quot;now's the time to&quot; é usada para enfatizar que é o momento certo para fazer algo. Pode ser usada em várias situações: &quot;Now's the time to make a decision.&quot;, &quot;Now's the time to start saving money.&quot;."></div><div class="text-hotspot" style="left:37.25%;top:95.30208333333333%;width:62.625%;height:1.7031250000000002%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:17.625%;top:98.16145833333333%;width:64.375%;height:.8125%" data-text="FIEND OF THE LABYRINTH BAPHOMET DETECTED BLOOD." onclick="showTextTooltip(event,this)" data-translation="DEMÔNIO DO LABIRINTO BAPHOMET DETECTOU SANGUE."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/91/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:28.125%;top:1.65625%;width:53.75%;height:2.229166666666667%" data-text="זר" onclick="showTextTooltip(event,this)" data-translation="זר"></div><div class="text-hotspot" style="left:4.375%;top:6.453125%;width:35.875%;height:1.5677083333333335%" data-text="500" onclick="showTextTooltip(event,this)" data-translation="500"></div><div class="text-hotspot" style="left:24.25%;top:12.479166666666666%;width:48.875%;height:1.0572916666666665%" data-text="WHAT? A MONSTER SHOWED UP OUT OF NOWHERE!!" onclick="showTextTooltip(event,this)" data-translation="O QUÊ? UM MONSTRO APARECEU DO NADA!!" data-tips="💡 A expressão &quot;out of nowhere&quot; é usada para descrever algo que acontece de forma inesperada. Pode ser usada em várias situações: &quot;The storm came out of nowhere.&quot;, &quot;He appeared out of nowhere.&quot;."></div><div class="text-hotspot" style="left:53.87499999999999%;top:14.822916666666666%;width:34.375%;height:.8385416666666666%" data-text="B-BJORN? ARE YOU SURE YOU DIDN'T STEP ON SOMETHINGGGG?" onclick="showTextTooltip(event,this)" data-translation="B-BJORN? TEM CERTEZA DE QUE NÃO PISOU EM ALGUMA COISAAAA?"></div><div class="text-hotspot" style="left:17.875%;top:16.963541666666668%;width:37.25%;height:.9427083333333334%" data-text="BAPHOMET, THE MID-BOSS OF THIS LABYRINTH DUNGEON." onclick="showTextTooltip(event,this)" data-translation="BAPHOMET, O SUB-CHEFE DESTE CALABOUÇO LABIRINTO."></div><div class="text-hotspot" style="left:32.5%;top:18.604166666666664%;width:53.75%;height:.953125%" data-text="WE WOULD HAVE HAD TO PATIENTLY EXPLOIT ITS WEAKNESS UNDER NORMAL CIRCUMSTANCES." onclick="showTextTooltip(event,this)" data-translation="TERÍAMOS QUE EXPLORAR PACIENTEMENTE SUA FRAQUEZA EM CIRCUNSTÂNCIAS NORMAIS." data-tips="💡 A expressão &quot;under normal circumstances&quot; é usada para descrever o que normalmente aconteceria. Pode ser usada em várias situações: &quot;Under normal circumstances, we would have finished by now.&quot;, &quot;Under normal circumstances, she would be here.&quot;."></div><div class="text-hotspot" style="left:1.375%;top:22.390625%;width:97.5%;height:4.859375%" data-text="STAB BUT THANKS TO OUR ENHANCED ABILITIES, WE OVERPOWERED THE BEAST IN LESS THAN A MINUTE. STAB" onclick="showTextTooltip(event,this)" data-translation="ESTOCADA MAS GRAÇAS ÀS NOSSAS HABILIDADES APRIMORADAS, DOMINAMOS A BESTA EM MENOS DE UM MINUTO. ESTOCADA" data-warning="1" data-tips="💡 O termo &quot;thanks to&quot; é usado para indicar a causa positiva de algo. Pode ser usado em várias situações: &quot;Thanks to your help, we finished early.&quot;, &quot;Thanks to technology, we can work from anywhere.&quot;."></div><div class="text-hotspot" style="left:11.125%;top:31.447916666666664%;width:72.625%;height:.6197916666666714%" data-text="YOU HAVE DEFEATED BAPHOMET. YOU HAVE GAINED 5 EXP POINTS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DERROTOU BAPHOMET. VOCÊ GANHOU 5 PONTOS DE EXP."></div><div class="text-hotspot" style="left:24.625%;top:32.671875%;width:67.125%;height:.8645833333333357%" data-text="YOU GET A BONUS FOR SLAYING A UNIQUE CREATURE. YOU HAVE GAINED 1 EXP POINTS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ RECEBE UM BÔNUS POR DERROTAR UMA CRIATURA ÚNICA. VOCÊ GANHOU 1 PONTO DE EXP."></div><div class="text-hotspot" style="left:30.25%;top:34.375%;width:36.875%;height:.8854166666666666%" data-text="DROP" onclick="showTextTooltip(event,this)" data-translation="SOLTAR"></div><div class="text-hotspot" style="left:19.5%;top:39.59375%;width:60.62499999999999%;height:.4270833333333333%" data-text="YOU HAVE ACQUIRED MAP [LABYRINTH OF LARCAZ]." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ADQUIRIU O MAPA [LABIRINTO DE LARCAZ]."></div><div class="text-hotspot" style="left:0;top:43.828125%;width:96.625%;height:3.46875%" data-text="WHOA 8 I CAN'T BELIEVE HOW EASY IT WAS. THAT MEANS THE NEW ADVENTURERS ARE EXTREMELY POWERFUL." onclick="showTextTooltip(event,this)" data-translation="UOU 8 NÃO CONSIGO ACREDITAR COMO FOI FÁCIL. ISSO SIGNIFICA QUE OS NOVOS AVENTUREIROS SÃO EXTREMAMENTE PODEROSOS." data-tips="💡 A expressão &quot;I can't believe&quot; é usada para expressar surpresa ou descrença. Pode ser usada em várias situações: &quot;I can't believe it's already December.&quot;, &quot;I can't believe you did that.&quot;."></div><div class="text-hotspot" style="left:75%;top:52.22916666666667%;width:3.5%;height:.328125%" data-text="? @ 30" onclick="showTextTooltip(event,this)" data-translation="? @ 30"></div><div class="text-hotspot" style="left:28.249999999999996%;top:56.427083333333336%;width:43.5%;height:1.0416666666666572%" data-text="THIS LOOKS LIKE A MAP OF THIS PLACE." onclick="showTextTooltip(event,this)" data-translation="ISTO PARECE UM MAPA DESTE LUGAR."></div><div class="text-hotspot" style="left:62.625%;top:58.010416666666664%;width:16.5%;height:.5052083333333286%" data-text="VERY DETAILED, TOO." onclick="showTextTooltip(event,this)" data-translation="MUITO DETALHADO, TAMBÉM."></div><div class="text-hotspot" style="left:25%;top:61.119791666666664%;width:49.25%;height:.546875%" data-text="WE MUST MOVE AS QUICKLY AS WE CAN." onclick="showTextTooltip(event,this)" data-translation="DEVEMOS NOS MOVER O MAIS RÁPIDO POSSÍVEL." data-tips="💡 A estrutura &quot;as quickly as we can&quot; é usada para enfatizar urgência ou rapidez. Pode ser adaptada para outras situações: &quot;as quietly as we can&quot;, &quot;as efficiently as we can&quot;."></div><div class="text-hotspot" style="left:17.375%;top:65.234375%;width:48.75%;height:1.2291666666666665%" data-text="WE NEED TO GET OUT BEFORE WE ENCOUNTER THEM, HIKUROD." onclick="showTextTooltip(event,this)" data-translation="PRECISAMOS SAIR ANTES DE ENCONTRÁ-LOS, HIKUROD."></div><div class="text-hotspot" style="left:57.62500000000001%;top:70.41666666666667%;width:7.124999999999999%;height:.30729166666666663%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:78.75%;top:70.65104166666667%;width:3.5000000000000004%;height:.21875000000000003%" data-text="00" onclick="showTextTooltip(event,this)" data-translation="00"></div><div class="text-hotspot" style="left:84.75%;top:70.71354166666667%;width:6.75%;height:.39583333333333337%" data-text="?" onclick="showTextTooltip(event,this)" data-translation="?"></div><div class="text-hotspot" style="left:39.625%;top:74.34375%;width:40.75%;height:1.2083333333333286%" data-text="HUH? I SUPPOSE IT DOESN'T HURT TO TAKE PRECAUTIONS..." onclick="showTextTooltip(event,this)" data-translation="HÃ? SUPONHO QUE NÃO CUSTA NADA TOMAR PRECAUÇÕES..." data-tips="💡 A expressão &quot;it doesn't hurt to&quot; é usada para sugerir que fazer algo não trará malefícios, mesmo que não seja necessário. Pode ser usada em várias situações: &quot;It doesn't hurt to ask.&quot;, &quot;It doesn't hurt to try.&quot;."></div><div class="text-hotspot" style="left:19.125%;top:79.65625%;width:61.25%;height:1.6041666666666714%" data-text="...BUT IS IT REALLY NECESSARY? SOMETHING SEEMS TO BE BOTHERING YOU. し" onclick="showTextTooltip(event,this)" data-translation="...MAS SERÁ QUE É REALMENTE NECESSÁRIO? ALGO PARECE ESTAR TE INCOMODANDO. し"></div><div class="text-hotspot" style="left:17.625%;top:85.09375%;width:37.875%;height:.953125%" data-text="MY COMPANIONS MAY FIND MY BEHAVIOR STRANGE..." onclick="showTextTooltip(event,this)" data-translation="MEUS COMPANHEIROS PODEM ACHAR MEU COMPORTAMENTO ESTRANHO..."></div><div class="text-hotspot" style="left:22.375%;top:86.41145833333333%;width:77.5%;height:2.828125000000014%" data-text="CLENCH BUT WE HAVE TO TAKE THE WORST CASE SCENARIO INTO ACCOUNT." onclick="showTextTooltip(event,this)" data-translation="CERRO OS DENTES MAS TEMOS QUE CONSIDERAR O PIOR CENÁRIO POSSÍVEL." data-warning="1" data-tips="💡 A expressão &quot;take into account&quot; significa considerar algo ao tomar uma decisão. Pode ser usada em várias situações: &quot;We need to take into account the weather.&quot;, &quot;Take into account his experience.&quot;."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/91/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20.125%;top:1.7291666666666667%;width:46.5%;height:1.2031249999999998%" data-text="LOOK AT THE BATTLE NOW FOR EXAMPLE. WE'VE BECOME TOO STRONG." data-translation="OLHE PARA A BATALHA AGORA, POR EXEMPLO. NOS TORNAMOS FORTES DEMAIS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39%;top:3.3802083333333335%;width:45.5%;height:1.1979166666666665%" data-text="THIS MEANS THAT THEY ARE WAY MORE POWERFUL THAN US." data-translation="ISSO SIGNIFICA QUE ELES SÃO MUITO MAIS PODEROSOS QUE NÓS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.125%;top:8.380208333333334%;width:22.125%;height:.9583333333333333%" data-text="EQUAL POWER? I THINK NOT." data-translation="PODER IGUAL? EU ACHO QUE NÃO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:9.75%;top:15.453125%;width:61.625%;height:1.203125%" data-text="THE TIER AND NUMBER OF ESSENCES, AND SPECIAL POWERS ARE STILL THE SAME." data-translation="O NÍVEL E NÚMERO DE ESSÊNCIAS, E PODERES ESPECIAIS AINDA SÃO OS MESMOS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:36.75%;top:17.333333333333336%;width:44.375%;height:.6927083333333334%" data-text="NOT TO MENTION THE QUALITY OF GEAR." data-translation="SEM FALAR NA QUALIDADE DO EQUIPAMENTO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.124999999999998%;top:21%;width:72%;height:1.1041666666666667%" data-text="IF WE ARE TO ENGAGE THEM IN BATTLE, WE'LL SURELY LOSE." data-translation="SE FORMOS ENFRENTÁ-LOS EM BATALHA, CERTAMENTE PERDEREMOS." onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura &quot;if we are to&quot; é usada para expressar uma condição ou plano futuro. Pode ser usada em várias situações: &quot;If we are to succeed, we need a plan.&quot;, &quot;If we are to leave early, we should pack tonight.&quot;."></div><div class="text-hotspot" style="left:19.875%;top:25.776041666666664%;width:39%;height:.4322916666666667%" data-text="THIS IS WHAT MAKES ME INSECURE" data-translation="É ISSO QUE ME DEIXA INSEGURO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.875%;top:27.182291666666668%;width:41.375%;height:.6979166666666666%" data-text="THAT ONE OR MORE OF US COULD GET HURT." data-translation="QUE UM OU MAIS DE NÓS POSSA SE MACHUCAR." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.625%;top:36.765625%;width:41.625%;height:.953125%" data-text="A LION DOESN'T HAVE TO THINK MUCH IN FRONT OF A RABBIT," data-translation="UM LEÃO NÃO PRECISA PENSAR MUITO DIANTE DE UM COELHO," onclick="showTextTooltip(event,this)" data-tips="💡 A expressão &quot;doesn't have to think much&quot; sugere que uma ação é óbvia ou fácil para alguém. Pode ser usada em várias situações: &quot;He doesn't have to think much before making a decision.&quot;, &quot;She doesn't have to think much to solve the problem.&quot;."></div><div class="text-hotspot" style="left:39.5%;top:38.598958333333336%;width:36.375%;height:.4166666666666667%" data-text="BUT AS FOR THE RABBIT..." data-translation="MAS QUANTO AO COELHO..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.125%;top:43.947916666666664%;width:61.75000000000001%;height:.9583333333333333%" data-text="...IT MUST RUN FOR ITS LIFE!" data-translation="...ELE PRECISA CORRER PELA VIDA!" onclick="showTextTooltip(event,this)" data-tips="💡 Em português, poderíamos dizer 'Ele tem que correr por sua vida!'.
