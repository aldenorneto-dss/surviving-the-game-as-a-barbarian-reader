RATE OF MONSTER ESSENCE DRASTICALLY INCREASES." onclick="showTextTooltip(event,this)" data-translation="...É O FATO DE QUE A TAXA DE QUEDA DA ESSÊNCIA DO MONSTRO AUMENTA DRASTICAMENTE." data-tips="💡 'Drop rate' refere-se à frequência com que um item é obtido em jogos, algo que pode ser traduzido como 'taxa de queda'."></div><div class="text-hotspot" style="left:22.125%;top:51.494791666666664%;width:55.75%;height:1.203125%" data-text="AS A MATTER OF FACT, IT IS STRANGE THAT WE ONLY GAINED OUR FIRST ESSENCE SO DEEP INTO THE EXPLORATION." onclick="showTextTooltip(event,this)" data-translation="NA VERDADE, É ESTRANHO QUE SÓ TENHAMOS GANHADO NOSSA PRIMEIRA ESSÊNCIA TÃO PROFUNDAMENTE NA EXPLORAÇÃO." data-tips="💡 'As a matter of fact' é um conector usado para introduzir uma afirmação que reforça ou esclarece algo dito anteriormente, similar a 'na verdade'."></div><div class="text-hotspot" style="left:53.87499999999999%;top:59.09895833333333%;width:15.25%;height:.4479166666666667%" data-text="WHAT NOW?" onclick="showTextTooltip(event,this)" data-translation="E AGORA?"></div><div class="text-hotspot" style="left:11.875%;top:64.0625%;width:54.625%;height:.703125%" data-text="...WE CLEARLY HAVE THE RIGHT TO THIS ESSENCE." onclick="showTextTooltip(event,this)" data-translation="...CLARAMENTE TEMOS DIREITO A ESSA ESSÊNCIA."></div><div class="text-hotspot" style="left:10.75%;top:68.921875%;width:56.99999999999999%;height:.7083333333333333%" data-text="WE PRETTY MUCH KILLED THE MONSTER BY OURSELVES," onclick="showTextTooltip(event,this)" data-translation="PRATICAMENTE MATAMOS O MONSTRO SOZINHOS,"></div><div class="text-hotspot" style="left:43%;top:70.203125%;width:40.75%;height:.9583333333333286%" data-text="AND WE HAD MADE AN AGREEMENT IN ADVANCE." onclick="showTextTooltip(event,this)" data-translation="E TÍNHAMOS FEITO UM ACORDO ANTES."></div><div class="text-hotspot" style="left:31.374999999999996%;top:81.56770833333333%;width:37%;height:.9427083333333428%" data-text="BUT I ACTUALLY HAD TWO SPECIFIC ESSENCES I HAD IN MY MIND." onclick="showTextTooltip(event,this)" data-translation="MAS EU REALMENTE TINHA DUAS ESSÊNCIAS ESPECÍFICAS EM MENTE." data-tips="💡 'In my mind' é uma expressão que significa 'em meus pensamentos' ou 'em minha opinião'."></div><div class="text-hotspot" style="left:9.125%;top:84.09895833333333%;width:41.125%;height:1.0416666666666714%" data-text="THAT OF DEATH FIEND, FOR REGENERATIVE POWER..." onclick="showTextTooltip(event,this)" data-translation="A DO DEMÔNIO DA MORTE, PARA PODER REGENERATIVO..."></div><div class="text-hotspot" style="left:44.75%;top:88.91666666666667%;width:45%;height:.7708333333333334%" data-text="...AND OF CHIMERA WOLF, FOR IMMENSE STRENGTH." onclick="showTextTooltip(event,this)" data-translation="...E DO LOBO QUIMERA, PARA FORÇA IMENSA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/26/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:24.75%;top:1.046875%;width:50.5%;height:.9583333333333333%" data-text="TO BE HONEST, I NEVER EXPECTED TO FIND THE ESSENCE OF THE UNDEAD GOLEM..." onclick="showTextTooltip(event,this)" data-translation="PARA SER HONESTO, NUNCA ESPEREI ENCONTRAR A ESSÊNCIA DO GOLEM ZUMBI..." data-tips="💡 'To be honest' é uma expressão usada para introduzir uma opinião sincera ou uma admissão, similar a 'para ser honesto' em português."></div><div class="text-hotspot" style="left:22.5%;top:12.828125000000002%;width:55.00000000000001%;height:.9427083333333334%" data-text="ESPECIALLY WHEN THIS TIER-7 MID-BOSS JUST APPEARS ONCE ONLY IN THE BLOODY CITADEL." onclick="showTextTooltip(event,this)" data-translation="ESPECIALMENTE QUANDO ESTE CHEFE INTERMEDIÁRIO DE NÍVEL 7 SÓ APARECE UMA VEZ NA CIDADELA SANGRENTA."></div><div class="text-hotspot" style="left:11.875%;top:19.354166666666668%;width:48.25%;height:.953125%" data-text="AND THE STAT BONUSES FOR CONSUMING THIS IS QUITE SUITABLE FOR A TANK." onclick="showTextTooltip(event,this)" data-translation="E OS BÔNUS DE STATUS POR CONSUMIR ISSO SÃO BEM ADEQUADOS PARA UM TANK."></div><div class="text-hotspot" style="left:13.375%;top:29.062500000000004%;width:73.25%;height:.18229166666666666%" data-text="[ESSENCE OF UNDEAD GOLEM]" onclick="showTextTooltip(event,this)" data-translation="[ESSÊNCIA DO GOLEM ZUMBI]"></div><div class="text-hotspot" style="left:56.125%;top:29.572916666666664%;width:26.875%;height:.640625%" data-text="BONE STR. +55 STRENGTH +15 APPETITE +9" onclick="showTextTooltip(event,this)" data-translation="FORÇA ÓSSEA +55 FORÇA +15 APETITE +9"></div><div class="text-hotspot" style="left:14.75%;top:29.588541666666668%;width:33%;height:.90625%" data-text="PAIN RES. +70 POISON RES. + 12 AWARENESS -5 WEIGHT +21" onclick="showTextTooltip(event,this)" data-translation="RES. À DOR +70 RES. A VENENO +12 PERCEPÇÃO -5 PESO +21"></div><div class="text-hotspot" style="left:10.25%;top:34.90625%;width:55.125%;height:.703125%" data-text="ALTHOUGH I WOULD SLOW DOWN A LITTLE DUE TO THE LOSS OF AWARENESS STAT," onclick="showTextTooltip(event,this)" data-translation="EMBORA EU FIQUE UM POUCO MAIS LENTO DEVIDO À PERDA DE STATUS DE PERCEPÇÃO," data-tips="💡 'Due to' é uma expressão que indica causa, similar a 'devido a' em português."></div><div class="text-hotspot" style="left:31.75%;top:36.19791666666667%;width:54.625%;height:.6875%" data-text="OTHER STATS WILL INCREASE BY MUCH HIGHER MARGINS TO OUTWEIGH THAT." onclick="showTextTooltip(event,this)" data-translation="OUTROS STATUS AUMENTARÃO EM MARGENS MUITO MAIORES PARA COMPENSAR ISSO." data-tips="💡 'Outweigh' significa que algo tem mais importância ou efeito do que outra coisa, similar a 'superar'."></div><div class="text-hotspot" style="left:13.125%;top:42.776041666666664%;width:54.125%;height:.9895833333333333%" data-text="BONE STRENGTH, WHICH DIRECTLY AFFECTS PHYSICAL DEFENSE, WOULD INCREASE BY 55," onclick="showTextTooltip(event,this)" data-translation="FORÇA ÓSSEA, QUE AFETA DIRETAMENTE A DEFESA FÍSICA, AUMENTARIA EM 55,"></div><div class="text-hotspot" style="left:27.875%;top:44.30208333333333%;width:59.62499999999999%;height:1.21875%" data-text="AND WEIGHT, ASSOCIATED WITH RESISTANCE AGAINST KNOCKBACKS AND BLUDGEONING DAMAGE, BY 21." onclick="showTextTooltip(event,this)" data-translation="E PESO, ASSOCIADO À RESISTÊNCIA CONTRA RECUOS E DANO POR IMPACTO, EM 21."></div><div class="text-hotspot" style="left:28.749999999999996%;top:49.244791666666664%;width:42.375%;height:.9531250000000071%" data-text="PAIN RESISTANCE SHOULD ALSO COME IN HANDY IN REAL LIFE..." onclick="showTextTooltip(event,this)" data-translation="RESISTÊNCIA À DOR TAMBÉM DEVE SER ÚTIL NA VIDA REAL..." data-tips="💡 'Come in handy' é uma expressão idiomática que significa 'ser útil'."></div><div class="text-hotspot" style="left:26.5%;top:56.942708333333336%;width:47%;height:.9375%" data-text="...NOT TO MENTION STRENGTH AND POISON RESISTANCE, WHICH ARE OBVIOUSLY BENEFICIAL." onclick="showTextTooltip(event,this)" data-translation="...SEM MENCIONAR FORÇA E RESISTÊNCIA A VENENO, QUE SÃO OBVIAMENTE BENÉFICAS."></div><div class="text-hotspot" style="left:20.625%;top:62.44791666666667%;width:59.12500000000001%;height:.5208333333333333%" data-text="BUT THE PROBLEM IS THE SKILLS IT GRANTS ME." onclick="showTextTooltip(event,this)" data-translation="MAS O PROBLEMA SÃO AS HABILIDADES QUE ISSO ME CONCEDE." data-tips="💡 'Grants me' aqui significa 'me concede', usado para indicar que algo é dado ou permitido."></div><div class="text-hotspot" style="left:12.375%;top:64.52083333333334%;width:74.5%;height:.984375%" data-text="[ SKILL] ACTIVATED [ A] FLESH BURST DETONATES USER'S OWN BODY PART TO - INFLICT MASSIVE DAMAGE." onclick="showTextTooltip(event,this)" data-translation="[HABILIDADE] ATIVADA [A] EXPLOSÃO DE CARNE DETONA PARTE DO PRÓPRIO CORPO DO USUÁRIO PARA - CAUSAR DANO MASSIVO."></div><div class="text-hotspot" style="left:3.25%;top:65.984375%;width:34.875%;height:1.0520833333333333%" data-text="BAM" onclick="showTextTooltip(event,this)" data-translation="BAM"></div><div class="text-hotspot" style="left:71.875%;top:68.52083333333333%;width:28.000000000000004%;height:.84375%" data-text="BAM" onclick="showTextTooltip(event,this)" data-translation="BAM"></div><div class="text-hotspot" style="left:8.375%;top:69.34895833333333%;width:43.5%;height:.9635416666666667%" data-text="WHILE IT DEALS A SUBSTANTIAL AMOUNT OF DAMAGE TO THE TARGET," onclick="showTextTooltip(event,this)" data-translation="ENQUANTO CAUSA UMA QUANTIDADE SUBSTANCIAL DE DANO AO ALVO," data-tips="💡 'At the expense of' é uma expressão que indica que algo é obtido sacrificando outra coisa, similar a 'às custas de'."></div><div class="text-hotspot" style="left:29.875%;top:70.61458333333334%;width:58.375%;height:.9479166666666667%" data-text="IT DOES SO AT THE EXPENSE OF MY OWN VITALITY INSTEAD OF STAMINA OR MANA, WHICH IS NOT EFFICIENT AT ALL!" onclick="showTextTooltip(event,this)" data-translation="FAZ ISSO ÀS CUSTAS DA MINHA PRÓPRIA VITALIDADE EM VEZ DE ESTAMINA OU MANA, O QUE NÃO É NADA EFICIENTE!"></div><div class="text-hotspot" style="left:18.375%;top:76.36979166666666%;width:65.875%;height:1.0000000000000142%" data-text="[SKILL] PASSIVE [P] ACID FLUID CHARACTER'S BODILY FLUID WILL NOW CONSIST OF ACID." onclick="showTextTooltip(event,this)" data-translation="[HABILIDADE] PASSIVA [P] FLUIDO ÁCIDO O FLUIDO CORPORAL DO PERSONAGEM AGORA CONSISTIRÁ DE ÁCIDO."></div><div class="text-hotspot" style="left:30.75%;top:79.0625%;width:38%;height:.84375%" data-text="PZZT" onclick="showTextTooltip(event,this)" data-translation="PZZT"></div><div class="text-hotspot" style="left:13.125%;top:80.91666666666667%;width:24%;height:.5208333333333333%" data-text="PZZT" onclick="showTextTooltip(event,this)" data-translation="PZZT"></div><div class="text-hotspot" style="left:13.5%;top:82.625%;width:34.5%;height:.703125%" data-text="AND THE PASSIVE SKILL ACID FLUID..." onclick="showTextTooltip(event,this)" data-translation="E A HABILIDADE PASSIVA FLUIDO ÁCIDO..."></div><div class="text-hotspot" style="left:34%;top:83.89583333333334%;width:58.375%;height:1.4687499999999858%" data-text="CAUSES ACIDIC SUBSTANCES TO SPLATTER OVER EQUIPMENTS EACH TIME I WOULD SUSTAIN INJURIES, DAMAGING THE ITEMS IN THE PROCESS." onclick="showTextTooltip(event,this)" data-translation="FAZ COM QUE SUBSTÂNCIAS ÁCIDAS ESPIRREM SOBRE OS EQUIPAMENTOS CADA VEZ QUE EU SOFRER FERIMENTOS, DANIFICANDO OS ITENS NO PROCESSO." data-tips="💡 'Each time' é usado para indicar repetição, similar a 'toda vez que'."></div><div class="text-hotspot" style="left:16.75%;top:90.10416666666666%;width:41.75%;height:.9583333333333333%" data-text="IN OTHER WORDS, AS POWERFUL AS THE ESSENCE OF UNDEAD GOLEM IS," onclick="showTextTooltip(event,this)" data-translation="EM OUTRAS PALAVRAS, POR MAIS PODEROSA QUE A ESSÊNCIA DO GOLEM ZUMBI SEJA," data-tips="💡 'In other words' é uma expressão usada para explicar algo de maneira diferente, similar a 'em outras palavras'."></div><div class="text-hotspot" style="left:37.25%;top:91.74479166666667%;width:50.375%;height:1.2083333333333144%" data-text="IT FORCES THE PLAYER TO SPEND A LOT OF MONEY ON HEALTH POTIONS AND EQUIPMENTS." onclick="showTextTooltip(event,this)" data-translation="FORÇA O JOGADOR A GASTAR MUITO DINHEIRO EM POÇÕES DE CURA E EQUIPAMENTOS." data-tips="💡 'Forces the player to' implica que o jogador é obrigado a fazer algo, transmitindo uma obrigação ou necessidade."></div><div class="text-hotspot" style="left:50.125%;top:98.72395833333333%;width:16%;height:.48958333333333337%" data-text="SIGH" onclick="showTextTooltip(event,this)" data-translation="SUSPIRO"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/26/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:17.375%;top:2.3541666666666665%;width:48.25%;height:1.46875%" data-text="...BUT LET'S DECIDE WHAT TO DO WITH IT A LITTLE LATER AND HEAL THE DWARF FIRST." onclick="showTextTooltip(event,this)" data-translation="...MAS VAMOS DECIDIR O QUE FAZER COM ISSO UM POUCO MAIS TARDE E CURAR O ANÃO PRIMEIRO."></div><div class="text-hotspot" style="left:45.375%;top:4.317708333333333%;width:43.25%;height:1.21875%" data-text="THE ESSENCE WILL REMAIN AS LOOT FOR THIRTY MINUTES ANYWAYS." onclick="showTextTooltip(event,this)" data-translation="A ESSÊNCIA VAI PERMANECER COMO SAQUE POR TRINTA MINUTOS DE QUALQUER FORMA." data-tips="💡 'Anyways' é uma forma coloquial de 'anyway', que significa 'de qualquer forma'. É mais comum na fala do que na escrita formal."></div><div class="text-hotspot" style="left:49.25%;top:14.734375%;width:39%;height:.6770833333333334%" data-text="...I DON'T KNOW HOW TO THANK YOU." onclick="showTextTooltip(event,this)" data-translation="...NÃO SEI COMO AGRADECER VOCÊS."></div><div class="text-hotspot" style="left:21.875%;top:17.947916666666668%;width:56.875%;height:1.203125%" data-text="I REALLY WOULD HAVE MET MY DEMISE HERE HAD IT NOT BEEN FOR YOU TWO." onclick="showTextTooltip(event,this)" data-translation="EU REALMENTE TERIA ENCONTRADO MEU FIM AQUI SE NÃO FOSSE POR VOCÊS DOIS." data-tips="💡 'Had it not been for' é uma estrutura condicional que significa 'se não fosse por'. É útil para expressar gratidão ou evitar um evento negativo."></div><div class="text-hotspot" style="left:19%;top:30.213541666666664%;width:35.75%;height:.4270833333333333%" data-text="GOOD TO BE APPRECIATED." onclick="showTextTooltip(event,this)" data-translation="BOM SER APRECIADO."></div><div class="text-hotspot" style="left:33.875%;top:31.239583333333332%;width:56.00000000000001%;height:.96875%" data-text="YOU WOULD HAVE DIED IF AINAR HADN'T INTERVENED DURING THE FIGHT." onclick="showTextTooltip(event,this)" data-translation="VOCÊ TERIA MORRIDO SE AINAR NÃO TIVESSE INTERVIDO DURANTE A LUTA." data-tips="💡 'Hadn't intervened' é um exemplo de terceira condicional, usada para situações hipotéticas no passado que não aconteceram."></div><div class="text-hotspot" style="left:56.875%;top:41.53125%;width:3.6249999999999996%;height:.11979166666666666%" data-text="00" onclick="showTextTooltip(event,this)" data-translation="00"></div><div class="text-hotspot" style="left:67.75%;top:42.31770833333333%;width:19.125%;height:.4322916666666714%" data-text="I AM AWARE." onclick="showTextTooltip(event,this)" data-translation="EU ESTOU CIENTE."></div><div class="text-hotspot" style="left:24.125%;top:43.13020833333333%;width:56.49999999999999%;height:1.4791666666666667%" data-text="I'M ASHAMED TO ADMIT IT, BUT I WAS LITERALLY FROZEN IN FEAR THE MOMENT I ENCOUNTERED THE BEAST." onclick="showTextTooltip(event,this)" data-translation="TENHO VERGONHA DE ADMITIR, MAS FIQUEI LITERALMENTE PARALISADA DE MEDO NO MOMENTO EM QUE ENCONTREI A BESTA." data-tips="💡 'Literally' é frequentemente usada para enfatizar algo que é realmente verdade, embora muitas vezes seja usada incorretamente para exagero."></div><div class="text-hotspot" style="left:7.249999999999999%;top:48.072916666666664%;width:14.000000000000002%;height:.14583333333333334%" data-text="НАНА..." onclick="showTextTooltip(event,this)" data-translation="НАНА..."></div><div class="text-hotspot" style="left:14.875%;top:48.442708333333336%;width:58.875%;height:1.4739583333333286%" data-text="AND I THOUGHT I'VE HAD PLENTY OF EXPERIENCES WITH BIZARRE CREATURES AS A THREE-YEAR VETERAN." onclick="showTextTooltip(event,this)" data-translation="E EU PENSEI QUE TINHA MUITA EXPERIÊNCIA COM CRIATURAS BIZARRAS COMO UMA VETERANA DE TRÊS ANOS." data-tips="💡 'Veteran' refere-se a alguém com experiência em uma área específica. É útil em contextos profissionais e militares."></div><div class="text-hotspot" style="left:42%;top:56.296875%;width:47.25%;height:1.1979166666666667%" data-text="I WOULD HAVE MADE SHORT WORK OF THE UNDEAD GOLEM WITH A PARTY LIKE THIS IN THE GAME." onclick="showTextTooltip(event,this)" data-translation="EU TERIA DERROTADO O GOLEM ZUMBI RAPIDAMENTE COM UM GRUPO COMO ESTE NO JOGO." data-tips="💡 'Made short work of' é uma expressão que significa 'lidar rapidamente com algo'. É usada para indicar eficiência ou rapidez."></div><div class="text-hotspot" style="left:12.125%;top:58.223958333333336%;width:49.75%;height:1.234375%" data-text="TO THINK WE WERE NEARLY ELIMINATED DESPITE THE ADVANTAGE SIMPLY BECAUSE OF MENTAL ISSUES..." onclick="showTextTooltip(event,this)" data-translation="PENSAR QUE QUASE FOMOS ELIMINADOS APESAR DA VANTAGEM SIMPLESMENTE POR CAUSA DE QUESTÕES MENTAIS..." data-tips="💡 'Despite' é uma preposição que significa 'apesar de'. É usada para contrastar situações."></div><div class="text-hotspot" style="left:21.125%;top:65.40104166666667%;width:59.25%;height:1.1354166666666667%" data-text="I AM CONSTANTLY REMINDED OF THE FACT THAT THIS IS REALITY AND NOT A GAME." onclick="showTextTooltip(event,this)" data-translation="SOU CONSTANTEMENTE LEMBRADA DE QUE ISSO É REALIDADE E NÃO UM JOGO." data-tips="💡 'Constantly reminded' usa a voz passiva para enfatizar a ação contínua de ser lembrado."></div><div class="text-hotspot" style="left:40.875%;top:68.171875%;width:41.375%;height:.96875%" data-text="...MY APOLOGIES FOR THIS... INCONVENIENCE." onclick="showTextTooltip(event,this)" data-translation="...MINHAS DESCULPAS POR ESTE... INCONVENIENTE."></div><div class="text-hotspot" style="left:62.125%;top:69.84375%;width:37.375%;height:1.109375%" data-text="DROOP" onclick="showTextTooltip(event,this)" data-translation="CAIR"></div><div class="text-hotspot" style="left:29.875%;top:76.16666666666667%;width:40.375%;height:.7083333333333333%" data-text="SHE SEEMS TO HAVE FINALLY SHAKEN OFF THE TRAUMA." onclick="showTextTooltip(event,this)" data-translation="ELA PARECE FINALMENTE TER SUPERADO O TRAUMA." data-tips="💡 'Shake off' é um phrasal verb que significa 'livrar-se de algo', como um sentimento ou estado emocional."></div><div class="text-hotspot" style="left:31.1250000000
