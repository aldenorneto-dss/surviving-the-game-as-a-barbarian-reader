ot;"></div><div class="text-hotspot" style="left:15.25%;top:51.802083333333336%;width:41.125%;height:.9375%" data-text="WHILE THEIR INDIVIDUAL POTENTIAL IS GOOD ENOUGH..." data-translation="ENQUANTO SEU POTENCIAL INDIVIDUAL É BOM O BASTANTE..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:54%;top:55.395833333333336%;width:32.875%;height:.7395833333333334%" data-text="FLEX" data-translation="FLEXIONAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:8.125%;top:58.635416666666664%;width:33.25%;height:.6875%" data-text="FLEX" data-translation="FLEXIONAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:86.125%;top:59.833333333333336%;width:5.375%;height:.11458333333333333%" data-text="LUAD" data-translation="LUAD" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.625%;top:60.875%;width:50.5%;height:1.1979166666666572%" data-text="...THEY LACK RESOURCES AND PROPER TRAINING AGAINST OTHER ADVENTURERS THAT TARGET THEM." data-translation="...FALTAM RECURSOS E TREINAMENTO ADEQUADO CONTRA OUTROS AVENTUREIROS QUE OS ALVEJAM." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.75%;top:65.34375%;width:58.375%;height:.6822916666666666%" data-text="FOR THIS REASON, SO MANY OF THEM DIE EARLY IN THEIR ADVENTURE." data-translation="POR ESSA RAZÃO, MUITOS DELES MORREM CEDO EM SUA AVENTURA." onclick="showTextTooltip(event,this)" data-tips="💡 **For this reason** é um conector que explica a causa de algo. É usado para introduzir uma consequência. Exemplo: &quot;For this reason, we decided to postpone the event.&quot; - &quot;Por essa razão, decidimos adiar o evento.&quot;"></div><div class="text-hotspot" style="left:67.625%;top:70.25%;width:5.75%;height:.3229166666666667%" data-text="www" data-translation="www" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:10.5%;top:75.6822916666666
