dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/144/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:21.125%;top:2.71875%;width:57.875%;height:.59375%" data-text="I'VE BEEN A SACRIFICE FOR SOMEBODY..." onclick="showTextTooltip(event,this)" data-translation="EU JÁ FUI UM SACRIFÍCIO PARA ALGUÉM..."></div><div class="text-hotspot" style="left:13.625000000000002%;top:5.90625%;width:72.625%;height:.5729166666666666%" data-text="...AND I'VE USED SOMEONE ELSE AS A SACRIFICE." onclick="showTextTooltip(event,this)" data-translation="...E JÁ USEI ALGUÉM COMO SACRIFÍCIO."></div><div class="text-hotspot" style="left:15.125%;top:11.005208333333332%;width:41.625%;height:.4427083333333333%" data-text="THAT WAS NATURAL. THAT WAS THE NORM." onclick="showTextTooltip(event,this)" data-translation="ERA NATURAL. ERA A NORMA."></div><div class="text-hotspot" style="left:35%;top:16.833333333333332%;width:52.5%;height:1.1979166666666667%" data-text="I WASN'T UPSET ABOUT IT, NOR DID I THINK IT WAS UNFAIR, BECAUSE THAT WAS JUST HOW THINGS WERE DONE." onclick="showTextTooltip(event,this)" data-translation="EU NÃO FICAVA CHATEADO COM ISSO, NEM ACHAVA INJUSTO, PORQUE ERA ASSIM QUE AS COISAS ERAM FEITAS."></div><div class="text-hotspot" style="left:14.124999999999998%;top:21.598958333333336%;width:29.75%;height:.7135416666666666%" data-text="BADUM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:34.875%;top:22.552083333333332%;width:30.375000000000004%;height:.234375%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="ENTRETANTO..."></div><div class="text-hotspot" style="left:17.125%;top:25.369791666666668%;width:82.75%;height:2.588541666666667%" data-text="BADUM ...I FEEL STRANGE FOR SOME REASON." onclick="showTextTooltip(event,this)" data-translation="BADUM ...ME SINTO ESTRANHO POR ALGUM MOTIVO."></div><div class="text-hotspot" style="left:33.625%;top:33.005208333333336%;width:37.5%;height:.96875%" data-text="BADUM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:44.375%;top:34.49479166666667%;width:33.625%;height:.43750000000000006%" data-text="MY HEART IS BEATING SO FAST." onclick="showTextTooltip(event,this)" data-translation="MEU CORAÇÃO ESTÁ BATENDO TÃO RÁPIDO."></div><div class="text-hotspot" style="left:12.125%;top:37.973958333333336%;width:26.875%;height:.4322916666666667%" data-text="I CAN'T CALM DOWN." onclick="showTextTooltip(event,this)" data-translation="NÃO CONSIGO ME ACALMAR."></div><div class="text-hotspot" style="left:53%;top:43.885416666666664%;width:41.5%;height:1.1510416666666667%" data-text="BADUM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.625%;top:46.10416666666667%;width:40.375%;height:.4322916666666667%" data-text="THE WARMTH OF THE DRIPPING BLOOD." onclick="showTextTooltip(event,this)" data-translation="O CALOR DO SANGUE ESCORRENDO."></div><div class="text-hotspot" style="left:.25%;top:48.53645833333333%;width:32.625%;height:.8854166666666666%" data-text="BADU" onclick="showTextTooltip(event,this)" data-translation="BADU"></div><div class="text-hotspot" style="left:51.87500000000001%;top:48.671875%;width:24.125%;height:.43750000000000006%" data-text="IT'S ALMOST LIKE SWEAT." onclick="showTextTooltip(event,this)" data-translation="É QUASE COMO SUOR."></div><div class="text-hotspot" style="left:16.875%;top:56.58854166666667%;width:47.25%;height:1.40625%" data-text="BADUM ALRIGHT." onclick="showTextTooltip(event,this)" data-translation="BADUM TÁ CERTO."></div><div class="text-hotspot" style="left:17.875%;top:61.265625%;width:64.875%;height:.7135416666666666%" data-text="I'LL STOP LOOKING FOR A REASON." onclick="showTextTooltip(event,this)" data-translation="VOU PARAR DE PROCURAR UM MOTIVO."></div><div class="text-hotspot" style="left:29.125%;top:65.59375%;width:39.75%;height:.3177083333333333%" data-text="HRAAAH!!" onclick="showTextTooltip(event,this)" data-translation="HRAAAH!!"></div><div class="text-hotspot" style="left:1.25%;top:67.47395833333333%;width:30.875000000000004%;height:.9791666666666667%" data-text="POW" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.625%;top:71.453125%;width:34%;height:.96875%" data-text="POW" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.375%;top:73.86458333333333%;width:44.375%;height:1.078125%" data-text="BADUM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13.875000000000002%;top:76.953125%;width:71.875%;height:1.1510416666666667%" data-text="I'VE NEVER FELT MORE AMBITIOUS IN MY LIFE BEFORE." onclick="showTextTooltip(event,this)" data-translation="NUNCA ME SENTI TÃO AMBICIOSO NA VIDA."></div><div class="text-hotspot" style="left:61.625%;top:79.29166666666667%;width:35.125%;height:.8489583333333334%" data-text="ADUM" onclick="showTextTooltip(event,this)" data-translation="ADUM"></div><div class="text-hotspot" style="left:47.25%;top:83.20833333333333%;width:35.875%;height:.4427083333333333%" data-text="I'M BURNING WITH THE DESIRE..." onclick="showTextTooltip(event,this)" data-translation="ESTOU ARDENDO DE DESEJO..."></div><div class="text-hotspot" style="left:1.875%;top:83.45833333333333%;width:55.875%;height:1.46875%" data-text="SWING" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.25%;top:89.52083333333334%;width:38.375%;height:.4322916666666667%" data-text="...TO SAVE MYSELF, MY COMPANIONS..." onclick="showTextTooltip(event,this)" data-translation="...DE SALVAR A MIM MESMO, MEUS COMPANHEIROS..."></div><div class="text-hotspot" style="left:7.5%;top:93.90625%;width:84.875%;height:1.265625%" data-text="...AND COUNTLESS PEOPLE FOLLOWING ME FROM BEHIND." onclick="showTextTooltip(event,this)" data-translation="...E INCONTÁVEIS PESSOAS QUE ME SEGUEM."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/144/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:8.25%;top:11.75%;width:83.5%;height:1.3489583333333333%" data-text="I WANT TO GO BACK TO THE CITY WITH ALL OF THEM...!" onclick="showTextTooltip(event,this)" data-translation="QUERO VOLTAR PARA A CIDADE COM TODOS ELES...!"></div><div class="text-hotspot" style="left:27%;top:22.859375%;width:45.75%;height:.39583333333333337%" data-text="YOUR VITALITY HAS FALLEN BELOW 20%." onclick="showTextTooltip(event,this)" data-translation="SUA VITALIDADE CAIU PARA ABAIXO DE 20%."></div><div class="text-hotspot" style="left:9.5%;top:26.026041666666664%;width:80.375%;height:1.265625%" data-text="ALL DEFENSIVE AND RESISTANCE STATS HAVE BEEN MAXIMIZED DUE TO THE EFFECT OF PASSIVE SKILL [HEROIC PATH]." onclick="showTextTooltip(event,this)" data-translation="TODAS AS ESTATÍSTICAS DE DEFESA E RESISTÊNCIA FORAM MAXIMIZADAS DEVIDO AO EFEITO DA HABILIDADE PASSIVA [CAMINHO HERÓICO]."></div><div class="text-hotspot" style="left:13.5%;top:40.822916666666664%;width:73%;height:1.3645833333333333%" data-text="EVEN IF I GET INCINERATED IN THE PROCESS." onclick="showTextTooltip(event,this)" data-translation="MESMO QUE EU SEJA INCINERADO NO PROCESSO."></div><div class="text-hotspot" style="left:4.875%;top:47.80729166666667%;width:87%;height:2.6302083333333335%" data-text="SURVIVING THE GAME AS A BARBARIAN" onclick="showTextTooltip(event,this)" data-translation="SOBREVIVENDO AO JOGO COMO UM BÁRBARO"></div><div class="text-hotspot" style="left:29.875%;top:50.744791666666664%;width:40.625%;height:.4479166666666667%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | TEAM THE JICK ORIGINAL STORY | Jung Yoon-kang" onclick="showTextTooltip(event,this)" data-translation="ARTE | MIDNIGHT STUDIO ADAPTAÇÃO | EQUIPE THE JICK HISTÓRIA ORIGINAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:14.374999999999998%;top:51.78125%;width:71.375%;height:.78125%" data-text="744 TAKING THE FIRST STEP" onclick="showTextTooltip(event,this)" data-translation="744 DANDO O PRIMEIRO PASSO"></div><div class="text-hotspot" style="left:43%;top:58.59895833333333%;width:28.625%;height:.734375%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:43.375%;top:61.901041666666664%;width:42.75%;height:.953125%" data-text="IT'S BEEN ABOUT NINE HOURS SINCE WE MOVED AWAY FROM THE CENTRAL AREA." onclick="showTextTooltip(event,this)" data-translation="FAZEM CERCA DE NOVE HORAS DESDE QUE NOS AFASTAMOS DA ÁREA CENTRAL."></div><div class="text-hotspot" style="left:6.875000000000001%;top:67.171875%;width:24.875%;height:.7083333333333333%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:60.62499999999999%;top:69.11458333333333%;width:30.125%;height:.8593750000000001%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17%;top:70.28645833333333%;width:38.375%;height:.6979166666666666%" data-text="WE SPENT THE FIRST TWO HOURS OF THAT SPRINTING..." onclick="showTextTooltip(event,this)" data-translation="PASSAMOS AS DUAS PRIMEIRAS HORAS CORRENDO..."></div><div class="text-hotspot" style="left:32%;top:71.58854166666667%;width:50.625%;height:1.2083333333333333%" data-text="...AND THE REMAINING SEVEN HOURS VICIOUSLY FIGHTING OUR WAY THROUGH THE MIST OF THE ABYSS." onclick="showTextTooltip(event,this)" data-translation="...E AS SETE HORAS RESTANTES LUTANDO FEROZMENTE ATRAVÉS DA NÉVOA DO ABISMO."></div><div class="text-hotspot" style="left:4.75%;top:76.453125%;width:38.625%;height:.921875%" data-text="GLANCE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53.37499999999999%;top:76.81770833333333%;width:12.375%;height:.18229166666666666%" data-text="AH..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.875%;top:80.36458333333333%;width:31.624999999999996%;height:.6927083333333334%" data-text="ALRIGHT, IS THE PORTAL AVAILABLE?" onclick="showTextTooltip(event,this)" data-translation="CERTO, O PORTAL ESTÁ DISPONÍVEL?"></div><div class="text-hotspot" style="left:28.499999999999996%;top:85.25520833333333%;width:43.125%;height:.5833333333333334%" data-text="...NO. IT'S DESTROYED." onclick="showTextTooltip(event,this)" data-translation="...NÃO. ESTÁ DESTRUÍDO."></div><div class="text-hotspot" style="left:25.25%;top:92.4375%;width:16.875%;height:.1875%" data-text="I SEE." onclick="showTextTooltip(event,this)" data-translation="ENTENDO."></div><div class="text-hotspot" style="left:37.5%;top:93.5%;width:39.125%;height:.78125%" data-text="AFTER WE FOUGHT OUR WAY THERE..." onclick="showTextTooltip(event,this)" data-translation="DEPOIS DE LUTARMOS ATÉ LÁ..."></div><div class="text-hotspot" style="left:78.125%;top:97.63020833333333%;width:9.5%;height:.421875%" data-text="wwwwwww" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.75%;top:98.39583333333334%;width:34.5%;height:.6770833333333334%" data-text="DID SO MANY OF THEM REALLY DIE FOR NOTHING...?" onclick="showTextTooltip(event,this)" data-translation="TANTOS DELES REALMENTE MORRERAM POR NADA...?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/144/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:70.25%;top:.6666666666666667%;width:5.875%;height:.265625%" data-text="~" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24.875%;top:1.8854166666666667%;width:1.625%;height:.078125%" data-text="0" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:36.375%;top:2.6979166666666665%;width:2.375%;height:.07291666666666667%" data-text="0" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.375%;top:5.447916666666667%;width:23.375%;height:.4322916666666667%" data-text="STAY STRONG." onclick="showTextTooltip(event,this)" data-translation="MANTENHA-SE FORTE."></div><div class="text-hotspot" style="left:71.125%;top:7.609375%;width:9.875%;height:.203125%" data-text="...!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.375%;top:11.833333333333334%;width:37.5%;height:.703125%" data-text="THERE ARE TWO PORTALS REMAINING." onclick="showTextTooltip(event,this)" data-translation="RESTAM DOIS PORTAIS."></div><div class="text-hotspot" style="left:37.875%;top:13.234375000000002%;width:39.875%;height:.953125%" data-text="YOU MUST CHOOSE WHICH PATH TO TAKE NEXT." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DEVE ESCOLHER QUAL CAMINHO SEGUIR AGORA."></div><div class="text-hotspot" style="left:20.5%;top:21.4375%;width:23.875%;height:.4427083333333333%" data-text="... YOU'RE RIGHT." onclick="showTextTooltip(event,this)" data-translation="... VOCÊ ESTÁ CERTO."></div><div class="text-hotspot" style="left:24.875%;top:23.71875%;width:50%;height:1.2239583333333333%" data-text="I HAVE NO TIME TO SIT DOWN AND THINK ABOUT IT. BATTLES ARE BEING FOUGHT EVEN RIGHT NOW." onclick="showTextTooltip(event,this)" data-translation="NÃO TENHO TEMPO PARA SENTAR E PENSAR SOBRE ISSO. AS BATALHAS ESTÃO SENDO TRAVADAS AGORA MESMO."></div><div class="text-hotspot" style="left:17.75%;top:29.588541666666668%;width:49%;height:1.5052083333333335%" data-text="BAHAHA, A WARRIOR MUST FOLLOW THEIR INSTINCT INSTEAD OF USING LOGIC!" onclick="showTextTooltip(event,this)" data-translation="BAHAHA, UM GUERREIRO DEVE SEGUIR SEU INSTINTO EM VEZ DE USAR A LÓGICA!"></div><div class="text-hotspot" style="left:16.375%;top:35.859375%;width:42.5%;height:1.2239583333333333%" data-text="BESIDES, IT'S PURE LUCK. NOBODY KNOWS WHICH ONE IS OPEN." onclick="showTextTooltip(event,this)" data-translation="ALÉM DISSO, É PURA SORTE. NINGUÉM SABE QUAL ESTÁ ABERTO."></div><div class="text-hotspot" style="left:64.5%;top:38.109375%;width:18.25%;height:.4270833333333333%" data-text="THAT'S RIGHT." onclick="showTextTooltip(event,this)" data-translation="EXATO."></div><div class="text-hotspot" style="left:15.125%;top:41.96875%;width:45.125%;height:.6875%" data-text="WE WILL FOLLOW REGARDLESS OF YOUR DECISION." onclick="showTextTooltip(event,this)" data-translation="VAMOS SEGUIR INDEPENDENTEMENTE DA SUA DECISÃO."></div><div class="text-hotspot" style="left:36%;top:48.932291666666664%;width:49.25%;height:.9479166666666667%" data-text="IF SOMEBODY COMPLAINS, THEIR SKULL WILL GET A TASTE OF MY AXE." onclick="showTextTooltip(event,this)" data-translation="SE ALGUÉM RECLAMAR, VAI SENTIR O GOSTO DO MEU MACHADO."></div><div class="text-hotspot" style="left:47.75%;top:55.494791666666664%;width:45.875%;height:1.0364583333333333%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:44.75%;top:58.79687500000001%;width:35%;height:.7083333333333333%" data-text="I WAS ABLE TO CALM DOWN THANKS TO THEM." onclick="showTextTooltip(event,this)" data-translation="CONSEGUI ME ACALMAR GRAÇAS A ELES."></div><div class="text-hotspot" style="left:31.624999999999996%;top:63.234375%;width:36.75%;height:1.46875%" data-text="LET'S SEE. WHICH PORTAL WOULD I HAVE CHOSEN, IF I WERE THEM?" onclick="showTextTooltip(event,this)" data-translation="VAMOS VER. QUAL PORTAL EU TERIA ESCOLHIDO, SE FOSSE ELES?"></div><div class="text-hotspot" style="left:16.625%;top:67.6875%;width:1.7500000000000002%;height:.08854166666666666%" data-text="*" onclick="showTextTooltip(event,this)" data-translation="*"></div><div class="text-hotspot" style="left:33%;top:67.83854166666666%;width:1.5%;height:.08333333333333334%" data-text="*" onclick="showTextTooltip(event,this)" data-translation="*"></div><div class="text-hotspot" style="left:21.5%;top:76.68229166666667%;width:57%;height:1.1666666666666714%" data-text="WHICH AREA PROVIDES THE BIGGEST ADVANTAGE TO NOARK BASTARDS?" onclick="showTextTooltip(event,this)" data-translation=
