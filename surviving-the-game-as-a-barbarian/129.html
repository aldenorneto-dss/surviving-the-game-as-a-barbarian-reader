</div><div class="text-hotspot" style="left:74%;top:38.604166666666664%;width:13.625000000000002%;height:.16666666666666669%" data-text="HUH?" onclick="showTextTooltip(event,this)" data-translation="HÃ?"></div><div class="text-hotspot" style="left:20.625%;top:45.927083333333336%;width:36.625%;height:.96875%" data-text="I WENT TO SEE BAEKHO AS SOON AS I LOGGED ON, AS USUAL." onclick="showTextTooltip(event,this)" data-translation="FUI VER O BAEKHO ASSIM QUE LOGUEI, COMO SEMPRE."></div><div class="text-hotspot" style="left:41.625%;top:47.802083333333336%;width:39.375%;height:.4322916666666667%" data-text="BUT A SURPRISE WAS WAITING FOR ME." onclick="showTextTooltip(event,this)" data-translation="MAS UMA SURPRESA ME ESPERAVA."></div><div class="text-hotspot" style="left:42%;top:55.07291666666667%;width:48.625%;height:.953125%" data-text="AH, YOU MUST BE BAEKHO'S FELLOW COUNTRYMAN HE TOLD ME ABOUT." onclick="showTextTooltip(event,this)" data-translation="AH, VOCÊ DEVE SER O COMPATRIOTA DO BAEKHO DE QUEM ELE ME FALOU."></div><div class="text-hotspot" style="left:35.375%;top:63.880208333333336%;width:25.75%;height:.6875%" data-text="WAIT. I KNOW THIS PERSON!" onclick="showTextTooltip(event,this)" data-translation="ESPERA. EU CONHEÇO ESSA PESSOA!"></div><div class="text-hotspot" style="left:18%;top:69.30208333333333%;width:51.75%;height:1.2395833333333428%" data-text="ELFNUNALOVE, WHO SOLD ME THE INFORMATION ABOUT THE POTENTIAL DIMENSIONAL COLLAPSE." onclick="showTextTooltip(event,this)" data-translation="ELFNUNALOVE, QUE ME VENDEU A INFORMAÇÃO SOBRE O POTENCIAL COLAPSO DIMENSIONAL."></div><div class="text-hotspot" style="left:39.5%;top:71.35416666666666%;width:42.75%;height:.43750000000000006%" data-text="HE WAS IN THE ROOM, INSTEAD OF BAEKHO." onclick="showTextTooltip(event,this)" data-translation="ELE ESTAVA NA SALA, EM VEZ DO BAEKHO."></div><div class="text-hotspot" style="left:26.375%;top:81.140625%;width:29.875%;height:.4114583333333333%" data-text="WHERE DID BAEKHO G  class="text-hotspot" style="left:28.499999999999996%;top:43.177083333333336%;width:43.25%;height:.96875%" data-text="I DON'T GET IT. WHAT DO YOU MEAN YOU TOOK HIM AWAY?" onclick="showTextTooltip(event,this)" data-translation="NÃO ENTENDO. O QUE VOCÊ QUER DIZER COM TIRÁ-LO DE MIM?"></div><div class="text-hotspot" style="left:28.875%;top:51.07291666666667%;width:57.875%;height:1.687499999999993%" data-text="LITERALLY. YOU WILL NEVER GET TO SEE BAEKHO AGAIN IN THIS ROOM." onclick="showTextTooltip(event,this)" data-translation="LITERALMENTE. VOCÊ NUNCA MAIS VERÁ O BAEKHO NESTA SALA."></div><div class="text-hotspot" style="left:19.875%;top:54.17708333333333%;width:25.874999999999996%;height:.4270833333333333%" data-text="WHAT KIND OF--" onclick="showTextTooltip(event,this)" data-translation="QUE TIPO DE--"></div><div class="text-hotspot" style="left:23.75%;top:60.44791666666667%;width:53%;height:.953125%" data-text="WE HAD LEFT HIM ALONE BECAUSE WE THOUGHT HE COULD BE THE KEY..." onclick="showTextTooltip(event,this)" data-translation="NÓS O DEIXAMOS SOZINHO PORQUE ACHÁVAMOS QUE ELE PODERIA SER A CHAVE..."></div><div class="text-hotspot" style="left:58.75%;top:66.02083333333333%;width:26.125%;height:.6614583333333334%" data-text="SWISH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.375%;top:67.66666666666666%;width:55.875%;height:.6927083333333334%" data-text="...BUT BAEKHO COMMITTED A GRAVE SIN, UNFORTUNATELY." onclick="showTextTooltip(event,this)" data-translation="...MAS BAEKHO COMETEU UM PECADO GRAVE, INFELIZMENTE."></div><div class="text-hotspot" style="left:65.875%;top:69.88020833333334%;width:8.5%;height:.16666666666666669%" data-text="...?" onclick="showTextTooltip(event,this)" data-translation="...?"></div><div class="text-hotspot" style="left:17%;top:74.53645833333333%;width:66%;height:1.3489583333333428%" data-text="I'M TELLING YOU THIS BECAUSE I DON'T WANT YOU TO WASTE YOUR TIME WAITING FOR HIM HERE." onclick="showTextTo 4.52083333333333%;width:1.625%;height:.0625%" data-text="O" onclick="showTextTooltip(event,this)" data-translation="O"></div><div class="text-hotspot" style="left:30.75%;top:96.21354166666667%;width:20.625%;height:.10937500000000001%" data-text="WHO IS HE...?" onclick="showTextTooltip(event,this)" data-translation="Quem é ele...?"></div><div class="text-hotspot" style="left:40.25%;top:96.63020833333333%;width:3.6249999999999996%;height:.16666666666666669%" data-text="IT" onclick="showTextTooltip(event,this)" data-translation="Parece"></div><div class="text-hotspot" style="left:26.875%;top:96.63020833333333%;width:46.5%;height:.9635416666666856%" data-text="LOOKS LIKE I'M NOT THE ONLY ONE SURPRISED BY THIS... INTRUSION." onclick="showTextTooltip(event,this)" data-translation="Parece que não sou o único surpreso com essa... invasão."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/129/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:5.75%;top:2.7604166666666665%;width:41.5%;height:1.09375%" data-text="RISE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:42%;top:9.109375%;width:35.875%;height:.22395833333333334%" data-text="MASTER?!" onclick="showTextTooltip(event,this)" data-translation="Mestre?!"></div><div class="text-hotspot" style="left:26.375%;top:10.947916666666666%;width:18.875%;height:.421875%" data-text="WHAT? MASTER?!" onclick="showTextTooltip(event,this)" data-translation="O quê? Mestre?!"></div><div class="text-hotspot" style="left:24.875%;top:15.968750000000002%;width:50.375%;height:.765625%" data-text="THERE'S A MASK I'VE NEVER SEEN BEFORE." onclick="showTextTooltip(event,this)" data-translation="Há uma máscara que eu nunca vi antes."></div><div class="text-hotspot" style="left:37.5%;top:25.947916666666664%;width:28.749999999999996%;height:.5052083333333333%" data-text="WHO ARE YOU?" onclick="showTextTooltip(event,this)" data-translation="Quem é você?"></div><div class="text-hotspot" style="left:32.25%;top:29.062500000000004%;width:38.125%;height:.46875%" data-text="THE CREATOR OF THIS GROUP...?" onclick="showTextTooltip(event,this)" data-translation="O criador deste grupo...?"></div><div class="text-hotspot" style="left:72.5%;top:30.890625%;width:19.75%;height:.11458333333333333%" data-text="GOD DAMMIT." onclick="showTextTooltip(event,this)" data-translation="Droga."></div><div class="text-hotspot" style="left:70.25%;top:34.6875%;width:21.625%;height:.8541666666666666%" data-text="мы" onclick="showTextTooltip(event,this)" data-translation="мы"></div><div class="text-hotspot" style="left:35.25%;top:35.729166666666664%;width:43.125%;height:.9739583333333333%" data-text="WHAT? I THOUGHT HE WAS INVITED BY YOU, MASTER!" onclick="showTextTooltip(event,this)" data-translation="O quê? Achei que ele tinha sido convidado por você, Mestre!"></div><div class="text-hotspot" style="left:16.5%;top:37.447916666666664%;width:43.875%;height:.9375%" data-text="I'M SURE THAT WAS WHAT MR. LION SAID, WASN'T IT?!" onclick="showTextTooltip(event,this)" data-translation="Tenho certeza de que foi isso que o Sr. Leão disse, não foi?!"></div><div class="text-hotspot" style="left:56.25%;top:38.885416666666664%;width:31.5%;height:.6875%" data-text="GLANCE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:38.125%;top:40.552083333333336%;width:6.625%;height:.39583333333333337%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:27.875%;top:45.83333333333333%;width:10%;height:.17708333333333331%" data-text="S***" onclick="showTextTooltip(event,this)" data-translation="Droga"></div><div class="text-hotspot" style="left:33.25%;top:46.57291666666667%;width:50.625%;height:.9583333333333333%" data-text="I NEVER SAID THAT. I ONLY AVOIDED GIVING A STRAIGHT ANSWER TO MAKE THEM BELIEVE THAT." onclick="showTextTooltip(event,this)" data-translation="Eu nunca disse isso. Apenas evitei dar uma resposta direta para fazê-los acreditar nisso."></div><div class="text-hotspot" style="left:39.5%;top:53.43750000000001%;width:20.875%;height:.43750000000000006%" data-text="INVITED, BY ME?" onclick="showTextTooltip(event,this)" data-translation="Convidado, por mim?"></div><div class="text-hotspot" style="left:31.374999999999996%;top:63.67708333333333%;width:47.5%;height:1.2135416666666665%" data-text="IF HE WASN'T INVITED BY YOU, HOW DID MR. LION FIND HIS WAY TO THIS GROUP?" onclick="showTextTooltip(event,this)" data-translation="Se ele não foi convidado por você, como o Sr. Leão encontrou o caminho para este grupo?"></div><div class="text-hotspot" style="left:19%;top:72.875%;width:54.375%;height:.9583333333333428%" data-text="M-MAYBE HE USED AN INVITATION CODE THAT HE RECEIVED A LONG TIME AGO." onclick="showTextTooltip(event,this)" data-translation="T-Talvez ele usou um código de convite que recebeu há muito tempo."></div><div class="text-hotspot" style="left:57.375%;top:74.484375%;width:31.5%;height:.453125%" data-text="SO LONG AGO THAT EVEN MASTER FORGOT." onclick="showTextTooltip(event,this)" data-translation="Há tanto tempo que até o Mestre esqueceu."></div><div class="text-hotspot" style="left:18.125%;top:78.92708333333334%;width:54.50000000000001%;height:.9583333333333333%" data-text="DON'T BE FOOLISH. THE INVITATION CODE EXPIRES AFTER A MONTH." onclick="showTextTooltip(event,this)" data-translation="Não seja tolo. O código de convite expira após um mês."></div><div class="text-hotspot" style="left:21.125%;top:85.359375%;width:31.25%;height:.6875%" data-text="WHAT" onclick="showTextTooltip(event,this)" data-translation="O quê"></div><div class="text-hotspot" style="left:34%;top:88.3125%;width:35.875%;height:.16666666666666669%" data-text="THEN HOW...?" onclick="showTextTooltip(event,this)" data-translation="Então como...?"></div><div class="text-hotspot" style="left:33.125%;top:88.80208333333334%;width:3.875%;height:.328125%" data-text="し" onclick="showTextTooltip(event,this)" data-translation="し"></div><div class="text-hotspot" style="left:65.875%;top:89.32291666666666%;width:14.000000000000002%;height:.28125%" data-text="IS HE A HACKER?" onclick="showTextTooltip(event,this)" data-translation="Ele é um hacker?"></div><div class="text-hotspot" style="left:12.5%;top:92.9375%;width:22.125%;height:.14583333333333334%" data-text="N-NO WAY!" onclick="showTextTooltip(event,this)" data-translation="N-Não pode ser!"></div><div class="text-hotspot" style="left:19.625%;top:93.31770833333334%;width:60.75%;height:1.328125%" data-text="THEN WHY DID YOU DECEIVE ME? I THOUGHT YOU AND MASTER KNEW EACH OTHER!" onclick="showTextTooltip(event,this)" data-translation="ENTÃO POR QUE VOCÊ ME ENGANOU? EU PENSEI QUE VOCÊ E O MESTRE SE CONHECIAM!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/129/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:21.125%;top:4.479166666666667%;width:43.375%;height:.953125%" data-text="I'D BE LYING IF I SAID I WASN'T FLUSTERED BY THIS UNEXPECTED TURN OF EVENTS." onclick="showTextTooltip(event,this)" data-translation="EU ESTARIA MENTINDO SE DISSESSE QUE NÃO FIQUEI DESCONCERTADO COM ESSA VIRADA INESPERADA DOS ACONTECIMENTOS."></div><div class="text-hotspot" style="left:55.00000000000001%;top:6.375%;width:23%;height:.171875%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO..."></div><div class="text-hotspot" style="left:38%;top:12.078125%;width:45.5%;height:.515625%" data-text="I NEVER DECEIVED YOU." onclick="showTextTooltip(event,this)" data-translation="EU NUNCA TE ENGANEI."></div><div class="text-hotspot" style="left:20.75%;top:19.505208333333332%;width:67.5%;height:.4479166666666667%" data-text="...I SHOULD BE SHAMELESS. THAT'S MR. LION'S CHARACTER." onclick="showTextTooltip(event,this)" data-translation="...EU DEVERIA SER DESAVERGONHADO. ESSE É O JEITO DO SR. LEÃO."></div><div class="text-hotspot" style="left:36.125%;top:24.630208333333332%;width:4.875%;height:.2760416666666667%" data-text="02." onclick="showTextTooltip(event,this)" data-translation="02."></div><div class="text-hotspot" style="left:25.25%;top:25.583333333333336%;width:26.375%;height:.9375%" data-text="WHAT DO YOU MEAN YOU DIDN'T?!" onclick="showTextTooltip(event,this)" data-translation="COMO ASSIM VOCÊ NÃO ENGANOU?!"></div><div class="text-hotspot" style="left:33.5%;top:27.208333333333336%;width:36.625%;height:.6354166666666666%" data-text="SHAMELESS" onclick="showTextTooltip(event,this)" data-translation="DESAVERGONHADO"></div><div class="text-hotspot" style="left:46.625%;top:28.34375%;width:34.25%;height:.9583333333333333%" data-text="YOU HEARD ME. I DID NOT DECEIVE YOU." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ME OUVIU. EU NÃO TE ENGANEI."></div><div class="text-hotspot" style="left:63.375%;top:32.307291666666664%;width:29.5%;height:.8593750000000001%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:46.125%;top:37.223958333333336%;width:14.499999999999998%;height:.65625%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:18.125%;top:38.1875%;width:34.75%;height:.45312499999999994%" data-text="WHAT? WHAT KIND OF..." onclick="showTextTooltip(event,this)" data-translation="O QUÊ? QUE TIPO DE..."></div><div class="text-hotspot" style="left:25.374999999999996%;top:41.380208333333336%;width:56.499999999999986%;height:1.2083333333333357%" data-text="WE'RE JUST CURIOUS, MR. LION. PERHAPS YOU SHOULD EXPLAIN TO US--" onclick="showTextTooltip(event,this)" data-translation="ESTAMOS APENAS CURIOSOS, SR. LEÃO. TALVEZ VOCÊ DEVERIA NOS EXPLICAR--"></div><div class="text-hotspot" style="left:41%;top:45.71354166666667%;width:44.875%;height:.9114583333333334%" data-text="RAISE" onclick="showTextTooltip(event,this)" data-translation="LEVANTAR"></div><div class="text-hotspot" style="left:29.625%;top:52.39583333333333%;width:52%;height:.5416666666666667%" data-text="THAT'S ENOUGH, EVERYONE." onclick="showTextTooltip(event,this)" data-translation="JÁ CHEGA, PESSOAL."></div><div class="text-hotspot" style="left:17.75%;top:58.765625%;width:38.25%;height:1.0364583333333286%" data-text="I THINK I KNOW WHO YOU ARE NOW." onclick="showTextTooltip(event,this)" data-translation="EU ACHO QUE AGORA SEI QUEM VOCÊ É."></div><div class="text-hotspot" style="left:54.625%;top:61.572916666666664%;width:16.625%;height:.4270833333333333%" data-text="...WHAT? REALLY?" onclick="showTextTooltip(event,this)" data-translation="...O QUÊ? SÉRIO?"></div><div class="text-hotspot" style="left:12.5%;top:71.81770833333333%;width:43.625%;height:.6666666666666667%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.375%;top:72.77604166666667%;width:47.5%;height:.6875%" data-text="I THOUGHT YOU WERE EITHER THE TIGER..." onclick="showTextTooltip(event,this)" data-translation="EU PENSEI QUE VOCÊ FOSSE OU O TIGRE..."></div><div class="text-hotspot" style="left:32.375%;top:77.71354166666666%;width:36.875%;height:.625%" data-text="...OR THE SOLDIER." onclick="showTextTooltip(event,this)" data-translation="...OU O SOLDADO."></div><div class="text-hotspot" style="left:17.75%;top:83.81770833333333%;width:18.125%;height:.484375%" data-text="OH." onclick="showTextTooltip(event,this)" data-translation="OH."></div><div class="text-hotspot" style="left:20.75%;top:84.90104166666667%;width:57.99999999999999%;height:.9427083333333334%" data-text="THAT REMINDED ME OF SOMETHING I HAD FORGOTTEN." onclick="showTextTooltip(event,this)" data-translation="ISSO ME LEMBROU DE ALGO QUE EU TINHA ESQUECIDO."></div><div class="text-hotspot" style="left:20.625%;top:90.08333333333334%;width:58.25%;height:.359375%" data-text="SERGEANT LEE..." onclick="showTextTooltip(event,this)" data-translation="SARGENTO LEE..."></div><div class="text-hotspot" style="left:9.875%;top:94.01041666666666%;width:39.125%;height:.59375%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.625%;top:95.05208333333334%;width:33.75%;height:.6927083333333286%" data-text="You DON'T HAVE TO PRETEND." onclick="showTextTooltip(event,this)" data-translation="Você NÃO PRECISA FINGIR."></div><div class="text-hotspot" style="left:36%;top:96.50520833333334%;width:47.5%;height:1.4895833333333335%" data-text="YOU'RE THE ONLY PERSON WHO RECEIVED AN INVITATION CODE THAT DOESN'T EXPIRE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ É A ÚNICA PESSOA QUE RECEBEU UM CÓDIGO DE CONVITE QUE NÃO EXPIRA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/129/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:32.125%;top:6.817708333333333%;width:35.25%;height:.7552083333333334%" data-text="...I'M NOT SURE IF THIS IS GOOD OR BAD." onclick="showTextTooltip(event,this)" data-translation="...NÃO TENHO CERTEZA SE ISSO É BOM OU RUIM."></div><div class="text-hotspot" style="left:25.874999999999996%;top:14.520833333333332%;width:49.875%;height:.953125%" data-text="TO BE FAIR, IT'S NATURAL FOR THE MASTER OF THIS GROUP TO THINK THAT WAY." onclick="showTextTooltip(event,this)" data-translation="PARA SER JUSTO, É NATURAL QUE O MESTRE DESTE GRUPO PENSE ASSIM."></div><div class="text-hotspot" style="left:12%;top:20.65625%;width:44.625%;height:.6979166666666666%" data-text="AFTER ALL, I GOT THAT INVITATION CODE FROM BAEKHO LEE." onclick="showTextTooltip(event,this)" data-translation="AFINAL, EU RECEBI ESSE CÓDIGO DE CONVITE DO BAEKHO LEE."></div><div class="text-hotspot" style="left:44.875%;top:26.296874999999996%;width:39.375%;height:.4479166666666667%" data-text="AND I'M WEARING A MASK RIGHT NOW..." onclick="showTextTooltip(event,this)" data-translation="E EU ESTOU USANDO UMA MÁSCARA AGORA..."></div><div class="text-hotspot" style="left:22%;top:29.65625%;width:39.25%;height:.953125%" data-text="...SO HE WOULD NEVER IMAGINE THAT I'M ACTUALLY NOT ВАЕКНО." onclick="showTextTooltip(event,this)" data-translation="...ENTÃO ELE NUNCA IMAGINARIA QUE EU NÃO SOU REALMENTE ВАЕКНО."></div><div class="text-hotspot" style="left:50.125%;top:34.848958333333336%;width:33.875%;height:.43750000000000006%" data-text="SURPRISING, I MUST SAY." onclick="showTextTooltip(event,this)" data-translation="SURPREENDENTE, EU DEVO DIZER."></div><div class="text-hotspot" style="left:12.5%;top:37.98958333333333%;width:60.25%;height:1.21875%" data-text="I KNOW I WAS THE ONE WHO INVITED YOU HERE, BUT YOU WOULD GET NOTHING OUT OF THIS MEETING." onclick="showTextTooltip(event,this)" data-translation="EU SEI QUE FUI EU QUEM TE CONVIDOU AQUI, MAS VOCÊ NÃO VAI GANHAR NADA COM ESTA REUNIÃO."></div><div class="text-hotspot" style="left:20.625%;top:46.671875%;width:33.625%;height:.6875%" data-text="NOTHING OUT OF THIS MEETING?" onclick="showTextTooltip(event,this)" data-translation="NADA COM ESTA REUNIÃO?"></div><div class="text-hotspot" style="left:38.75%;top:52.953125%;width:50.125%;height:1.218750000000007%" data-text="THAT'S UNFAIR. YOU CAN'T KEEP TREATING US LIKE LITTLE KIDS, MASTER." onclick="showTextTooltip(event,this)" data-translation="ISSO É INJUSTO. VOCÊ NÃO PODE CONTINUAR NOS TRATANDO COMO CRIANÇAS, MESTRE."></div><div class="text-hotspot" style="left:20.125%;top:58.78124999999999%;width:35.75%;height:.9687500000000071%" data-text="OH, MY APOLOGIES IF I OFFENDED YOU." onclick="showTextTooltip(event,this)" data-translation="OH, MINHAS DESCULPAS SE TE OFENDI."></div><div class="text-hotspot" style="left:47.375%;top:60.51562499999999%;width:28.749999999999996%;height:.6822916666666666%" data-text="BUT HE'S THAT SKILLED." onclick="showTextTooltip(event,this)" data-translation="MAS ELE É TÃO HABILIDOSO."></div><div class="text-hotspot" style="left:47.875%;top:66.16145833333333%;width:31.624999999999996%;height:.5364583333333334%" data-text="CLENCH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.125%;top:68.99479166666667%;width:12.5%;height:.17708333333333331%" data-text="OH..." onclick="showTextTooltip(event,this)" data-translation="OH..."></div><div class="text-hotspot" style="left:43.875%;top:71.03125%;width:39.125%;height:.4322916666666667%" data-text="HMM. I SEE. INTERESTING..." onclick="showTextTooltip(event,this)" data-translation="HMM. ENTENDO. INTERESSANTE..."></div><div class="text-hotspot" style="left:15.25%;top:76.43229166666666%;width:36.25%;height:.953125%" data-text="I REALLY HAD NO IDEA HE'D BE THAT AMAZING..." onclick="showTextTooltip(event,this)" data-translation="EU REALMENTE NÃO TINHA IDEIA DE QUE ELE SERIA TÃO INCRÍVEL..."></div><div class="text-hotspot" style="left:64.875%;top:77.83854166666667%;width:18.75%;height:.18229166666666666%" data-text="HOLY..." onclick="showTextTooltip(event,this)" data-translation="SANTO..."></div><div class="text-hotspot" style="left:38.375%;top:86.83333333333333%;width:23.375%;height:.43750000000000006%" data-text="THOSE REACTIONS." onclick="showTextTooltip(event,this)" data-translation="AQUELAS REAÇÕES."></div><div class="text-hotspot" style="left:31.75%;top:94.921875%;width:36%;height:.9166666666666666%" data-text="THIS CAN'T BE BAD FOR ME." onclick="showTextTooltip(event,this)" data-translation="ISSO NÃO PODE SER RUIM PARA MIM."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/129/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:21.625%;top:.9270833333333334%;width:56.375%;height:.6979166666666666%" data-text="EVEN IF MY COVER IS BLOWN LATER, I CAN JUST TELL HIM THAT WE'RE FRIENDS." onclick="showTextTooltip(event,this)" data-translation="MESMO SE MEU DISFAR
