<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-hotspot[data-warning]{border:1px dashed rgba(255,100,0,.85);background:rgba(255,100,0,.1)}.text-hotspot[data-warning]:hover{background:rgba(255,100,0,.22)}.text-hotspot[data-tips]{border:1px solid rgba(100,200,255,.4)}.text-hotspot[data-tips]:hover{border:1px solid rgba(100,200,255,.7);background:rgba(100,200,255,.08)}.text-tooltip{position:absolute;z-index:1000;max-width:min(92vw,460px);max-height:70vh;overflow-y:auto;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}.text-tooltip .main-text{white-space:pre-line}.tip-section{margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.2);font-size:12px;line-height:1.45;color:#a8d8ff}.tip-section p{margin:0 0 6px 0}.tip-section p:last-child{margin-bottom:0}.tip-section strong{color:#d7ecff}.tip-section code{background:rgba(255,255,255,.12);border-radius:3px;padding:1px 4px;font-size:11px}.tip-section ol,.tip-section ul{margin:0 0 6px 0;padding-left:18px}.tip-section li{margin-bottom:2px}.tip-section h4,.tip-section h5{margin:6px 0 3px 0;color:#d7ecff;font-size:12px}.tip-section table{border-collapse:collapse;margin:4px 0 6px 0;width:100%}.tip-section td,.tip-section th{border:1px solid rgba(255,255,255,.2);padding:3px 6px;text-align:left;font-size:11px}</style><title>143</title><link rel="icon" href="cover.jpg"><link rel="apple-touch-icon" href="cover.jpg"><link rel="manifest" href="manifest.json"></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/143/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:33.5%;top:3.4895833333333335%;width:34.5%;height:.6302083333333333%" data-text="COME WITH ME." onclick="showTextTooltip(event,this)" data-translation="VENHA COMIGO."></div><div class="text-hotspot" style="left:36.375%;top:15.109375%;width:26.5%;height:.26041666666666663%" data-text="HURRY." onclick="showTextTooltip(event,this)" data-translation="RÁPIDO."></div><div class="text-hotspot" style="left:29.75%;top:18.786458333333332%;width:39.5%;height:1.03125%" data-text="IF YOU WANT TO LIVE." onclick="showTextTooltip(event,this)" data-translation="SE VOCÊ QUER VIVER."></div><div class="text-hotspot" style="left:94.125%;top:26.463541666666668%;width:4.5%;height:.19791666666666669%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:20.25%;top:28.703125%;width:35.375%;height:1.0468750000000036%" data-text="DO I LOOK LIKE I WANT TO LIVE?" onclick="showTextTooltip(event,this)" data-translation="EU PAREÇO ALGUÉM QUE QUER VIVER?"></div><div class="text-hotspot" style="left:47%;top:30.723958333333336%;width:30.125%;height:.7604166666666667%" data-text="MY WIFE... LENA WAS KILLED." onclick="showTextTooltip(event,this)" data-translation="MINHA ESPOSA... LENA FOI MORTA."></div><div class="text-hotspot" style="left:25.5%;top:35.84895833333333%;width:48.75%;height:.8229166666666666%" data-text="SO WHY DO I HAVE TO LIVE ON?" onclick="showTextTooltip(event,this)" data-translation="ENTÃO POR QUE EU TENHO QUE CONTINUAR VIVENDO?"></div><div class="text-hotspot" style="left:43.5%;top:43.807291666666664%;width:39.125%;height:.953125%" data-text="I REALLY DON'T THINK TAKELAN WAS BEING HONEST JUST NOW." onclick="showTextTooltip(event,this)" data-translation="EU REALMENTE NÃO ACHO QUE TAKELAN ESTAVA SENDO HONESTO AGORA HÁ POUCO."></div><div class="text-hotspot" style="left:13%;top:49.776041666666664%;width:50.625%;height:.7239583333333333%" data-text="WHAT I'VE REALIZED THUS FAR ABOUT HUMANS IS THAT..." onclick="showTextTooltip(event,this)" data-translation="O QUE PERCEBI ATÉ AGORA SOBRE OS HUMANOS É QUE..."></div><div class="text-hotspot" style="left:21.125%;top:61.484375%;width:57.875%;height:.6875%" data-text="...WE NEVER GIVE UP ON OUR WILL TO SURVIVE DESPITE THE SITUATION." onclick="showTextTooltip(event,this)" data-translation="...NUNCA DESISTIMOS DA NOSSA VONTADE DE SOBREVIVER, INDEPENDENTEMENTE DA SITUAÇÃO."></div><div class="text-hotspot" style="left:22.75%;top:65.59375%;width:54.625%;height:.6145833333333333%" data-text="IT'S HUMAN NATURE TO CRAVE LIFE." onclick="showTextTooltip(event,this)" data-translation="É DA NATUREZA HUMANA DESEJAR A VIDA."></div><div class="text-hotspot" style="left:28.625%;top:75.796875%;width:43.125%;height:.24479166666666669%" data-text="WE CRAVE LIFE." onclick="showTextTooltip(event,this)" data-translation="DESEJAMOS A VIDA."></div><div class="text-hotspot" style="left:19.875%;top:79%;width:59.875%;height:.6145833333333286%" data-text="I MEAN, WE MUST CRAVE LIFE." onclick="showTextTooltip(event,this)" data-translation="QUERO DIZER, DEVEMOS DESEJAR A VIDA."></div><div class="text-hotspot" style="left:23%;top:83.82291666666667%;width:56.25%;height:1.2291666666666665%" data-text="AS A MATTER OF FACT, TAKELAN FOLLOWED MY GROUP TO THE END DESPITE HAVING LOST ALL OF HIS COMPANIONS." onclick="showTextTooltip(event,this)" data-translation="NA VERDADE, TAKELAN SEGUIU MEU GRUPO ATÉ O FIM, MESMO TENDO PERDIDO TODOS OS SEUS COMPANHEIROS."></div><div class="text-hotspot" style="left:17.75%;top:91.50520833333333%;width:64.875%;height:1.390625%" data-text="I DOUBT HE QUESTIONED WHY, AS HE DID THAT BACK THEN." onclick="showTextTooltip(event,this)" data-translation="DUVIDO QUE ELE TENHA QUESTIONADO O PORQUÊ, COMO FEZ NAQUELA ÉPOCA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/143/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:35.375%;top:2.4166666666666665%;width:28.875%;height:.6822916666666666%" data-text="THERE WAS PROBABLY NO REASON." onclick="showTextTooltip(event,this)" data-translation="PROVAVELMENTE NÃO HAVIA MOTIVO."></div><div class="text-hotspot" style="left:23.375%;top:7.901041666666667%;width:53.625%;height:.7604166666666667%" data-text="HOWEVER, A GOOD REASON MAKES IT EASIER TO GET BACK UP." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, UM BOM MOTIVO TORNA MAIS FÁCIL SE REERGUER."></div><div class="text-hotspot" style="left:37.125%;top:12.609375%;width:42.625%;height:.96875%" data-text="BECAUSE... SOMEBODY HAS TO DELIVER THE MESSAGE." onclick="showTextTooltip(event,this)" data-translation="PORQUE... ALGUÉM TEM QUE ENTREGAR A MENSAGEM."></div><div class="text-hotspot" style="left:22%;top:22.572916666666668%;width:4.625%;height:.04166666666666667%" data-text="..." onclick="showTextTooltip(event,this)" data-translation="..."></div><div class="text-hotspot" style="left:53%;top:26.468750000000004%;width:26.375%;height:.4322916666666643%" data-text="HA. HAHAHA..." onclick="showTextTooltip(event,this)" data-translation="HA. HAHAHA..."></div><div class="text-hotspot" style="left:27.625%;top:28.729166666666668%;width:4.625%;height:.036458333333333336%" data-text="..." onclick="showTextTooltip(event,this)" data-translation="..."></div><div class="text-hotspot" style="left:22.875%;top:31.03125%;width:4.125%;height:.171875%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:13.625000000000002%;top:31.166666666666664%;width:7.000000000000001%;height:.28125%" data-text="3" onclick="showTextTooltip(event,this)" data-translation="3"></div><div class="text-hotspot" style="left:11.75%;top:31.552083333333332%;width:1.625%;height:.07291666666666667%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:46.875%;top:33.83333333333333%;width:39.5%;height:.9687500000000071%" data-text="RIGHT. THAT IS A GOOD REASON, I SUPPOSE." onclick="showTextTooltip(event,this)" data-translation="CERTO. ESSE É UM BOM MOTIVO, EU SUPONHO."></div><div class="text-hotspot" style="left:19%;top:38.395833333333336%;width:37.5%;height:.9479166666666714%" data-text="BUT WHY WOULD YOU SHOW ME KINDNESS?" onclick="showTextTooltip(event,this)" data-translation="MAS POR QUE VOCÊ ME MOSTRARIA BONDADE?"></div><div class="text-hotspot" style="left:42.125%;top:40.28125%;width:35.25%;height:.6979166666666666%" data-text="IT'S NOT LIKE YOU NEED ME RIGHT NOW." onclick="showTextTooltip(event,this)" data-translation="NÃO É COMO SE VOCÊ PRECISASSE DE MIM AGORA."></div><div class="text-hotspot" style="left:0;top:44.604166666666664%;width:34.375%;height:.8854166666666666%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.75%;top:53.53125%;width:59.375%;height:.8541666666666666%" data-text="I'LL BE A BIT MORE AT EASE IF YOU MAKE IT." onclick="showTextTooltip(event,this)" data-translation="EU FICAREI UM POUCO MAIS TRANQUILO SE VOCÊ CONSEGUIR."></div><div class="text-hotspot" style="left:17%;top:58.354166666666664%;width:46.75%;height:.43750000000000006%" data-text="USING SOMEBODY ELSE TO FEEL LESS GUILTY..." onclick="showTextTooltip(event,this)" data-translation="USAR ALGUÉM PARA SE SENTIR MENOS CULPADO..."></div><div class="text-hotspot" style="left:39.625%;top:59.64583333333333%;width:43.5%;height:.9479166666666714%" data-text="IS PRETTY MUCH WHAT THAT KNIGHT-COMMANDER DID." onclick="showTextTooltip(event,this)" data-translation="É PRATICAMENTE O QUE AQUELE COMANDANTE FEZ."></div><div class="text-hotspot" style="left:15.625%;top:67.36458333333334%;width:68.875%;height:1.1874999999999858%" data-text="THE ONLY DIFFERENCE BETWEEN US IS THAT I KNOW HOW MUCH OF A COWARD I AM." onclick="showTextTooltip(event,this)" data-translation="A ÚNICA DIFERENÇA ENTRE NÓS É QUE EU SEI O QUANTO SOU COVARDE."></div><div class="text-hotspot" style="left:72.625%;top:73.18229166666667%;width:17.25%;height:.6614583333333334%" data-text="HA" onclick="showTextTooltip(event,this)" data-translation="HA"></div><div class="text-hotspot" style="left:14.000000000000002%;top:77.875%;width:58.62500000000001%;height:2.2083333333333335%" data-text="I DON'T KNOW WHAT HE WAS THINKING AS HE HEARD ME... STEP" onclick="showTextTooltip(event,this)" data-translation="NÃO SEI O QUE ELE ESTAVA PENSANDO AO ME OUVIR... PASSO"></div><div class="text-hotspot" style="left:29.625%;top:81.625%;width:2.75%;height:.15104166666666666%" data-text="A" onclick="showTextTooltip(event,this)" data-translation="A"></div><div class="text-hotspot" style="left:58.12500000000001%;top:84.93229166666667%;width:34.375%;height:.8125%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.125%;top:90.79166666666667%;width:59.875%;height:.828125%" data-text="...BUT TAKELAN WALKED PAST ME AND JOINED MY GROUP." onclick="showTextTooltip(event,this)" data-translation="...MAS TAKELAN PASSOU POR MIM E SE JUNTOU AO MEU GRUPO."></div><div class="text-hotspot" style="left:4.75%;top:97.59895833333333%;width:88.625%;height:2.3958333333333335%" data-text="SURVIVING THE GAME AS A BARBARIAN" onclick="showTextTooltip(event,this)" data-translation="SOBREVIVENDO AO JOGO COMO UM BÁRBARO"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/143/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:29.875%;top:.5885416666666666%;width:40.5%;height:.45833333333333337%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | TEAM THE JICK ORIGINAL STORY | Jung Yoon-kang" onclick="showTextTooltip(event,this)" data-translation="ARTE | MIDNIGHT STUDIO ADAPTAÇÃO | EQUIPE THE JICK HISTÓRIA ORIGINAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:44.5%;top:1.640625%;width:10.625%;height:.203125%" data-text="143" onclick="showTextTooltip(event,this)" data-translation="143"></div><div class="text-hotspot" style="left:37.75%;top:2.1041666666666665%;width:24.125%;height:.18229166666666666%" data-text="PROMISE" onclick="showTextTooltip(event,this)" data-translation="PROMESSA"></div><div class="text-hotspot" style="left:21.625%;top:7.838541666666667%;width:32.625%;height:.23958333333333331%" data-text="BJORN!!" onclick="showTextTooltip(event,this)" data-translation="BJORN!!"></div><div class="text-hotspot" style="left:0;top:9.354166666666666%;width:99.875%;height:5.4375%" data-text="7 SADADADA" onclick="showTextTooltip(event,this)" data-translation="7 SADADADA"></div><div class="text-hotspot" style="left:54.87499999999999%;top:15.375%;width:10.875%;height:.21875000000000003%" data-text="OH." onclick="showTextTooltip(event,this)" data-translation="OH."></div><div class="text-hotspot" style="left:9.625%;top:18.505208333333336%;width:14.249999999999998%;height:.296875%" data-text="LET ME BREATHE" onclick="showTextTooltip(event,this)" data-translation="DEIXE-ME RESPIRAR"></div><div class="text-hotspot" style="left:21.125%;top:18.994791666666664%;width:25.5%;height:.9479166666666667%" data-text="DID ANYTHING HAPPEN, RAVEN?" onclick="showTextTooltip(event,this)" data-translation="ACONTECEU ALGUMA COISA, RAVEN?"></div><div class="text-hotspot" style="left:72.25%;top:20.473958333333332%;width:12.5%;height:.17708333333333331%" data-text="NO..." onclick="showTextTooltip(event,this)" data-translation="NÃO..."></div><div class="text-hotspot" style="left:5.5%;top:21.463541666666668%;width:21%;height:.45312499999999994%" data-text="TELL ME THE DETAILS, BJORN!" onclick="showTextTooltip(event,this)" data-translation="CONTE-ME OS DETALHES, BJORN!"></div><div class="text-hotspot" style="left:69.625%;top:26.140625%;width:21.5%;height:.5885416666666666%" data-text="HESITATE" onclick="showTextTooltip(event,this)" data-translation="HESITAR"></div><div class="text-hotspot" style="left:39.875%;top:26.302083333333332%;width:19.25%;height:.484375%" data-text="HESITATE" onclick="showTextTooltip(event,this)" data-translation="HESITAR"></div><div class="text-hotspot" style="left:17.375%;top:27.78125%;width:36.875%;height:.9427083333333334%" data-text="THAT'S GOOD. DID YOU HEAR EVERYTHING, THOUGH?" onclick="showTextTooltip(event,this)" data-translation="ISSO É BOM. MAS VOCÊ OUVIU TUDO?"></div><div class="text-hotspot" style="left:34.25%;top:30.494791666666664%;width:56.25%;height:.6927083333333334%" data-text="YEAH. I HEARD IT THROUGH MAGIC AND TOLD EVERYONE." onclick="showTextTooltip(event,this)" data-translation="SIM. EU OUVI ATRAVÉS DA MAGIA E CONTEI A TODOS."></div><div class="text-hotspot" style="left:41.25%;top:35.552083333333336%;width:46.125%;height:.9635416666666667%" data-text="WHY ARE YOU AVOIDING MAKING EYE CONTACT, THEN?" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ ESTÁ EVITANDO FAZER CONTATO VISUAL, ENTÃO?"></div><div class="text-hotspot" style="left:10.125%;top:37.40625%;width:47.25%;height:1.8229166666666667%" data-text="FLINCH WHAT? I WASN'T! LOOK!" onclick="showTextTooltip(event,this)" data-translation="RECUAR O QUÊ? EU NÃO ESTAVA! OLHE!"></div><div class="text-hotspot" style="left:67.125%;top:43.114583333333336%;width:1.5%;height:.0625%" data-text="P" onclick="showTextTooltip(event,this)" data-translation="P"></div><div class="text-hotspot" style="left:62%;top:44.921875%;width:22.625%;height:.421875%" data-text="HMM, REALLY?" onclick="showTextTooltip(event,this)" data-translation="HMM, SÉRIO?"></div><div class="text-hotspot" style="left:27.500000000000004%;top:46.515625%;width:38.375%;height:.6822916666666714%" data-text="WHY DOES SHE SEEM... UNCOMFORTABLE?" onclick="showTextTooltip(event,this)" data-translation="POR QUE ELA PARECE... DESCONFORTÁVEL?"></div><div class="text-hotspot" style="left:32%;top:51.59375000000001%;width:38.875%;height:1.2291666666666665%" data-text="MAYBE IT'S BECAUSE OF THE MAJESTIC SPEECH I DELIVERED, LIKE A TRUE WARLORD." onclick="showTextTooltip(event,this)" data-translation="TALVEZ SEJA POR CAUSA DO DISCURSO MAJESTOSO QUE FIZ, COMO UM VERDADEIRO SENHOR DA GUERRA."></div><div class="text-hotspot" style="left:51%;top:54.82812500000001%;width:7.5%;height:.30729166666666663%" data-text="10" onclick="showTextTooltip(event,this)" data-translation="10"></div><div class="text-hotspot" style="left:30.625000000000004%;top:61.546875%;width:40.25%;height:1.203124999999993%" data-text="PEOPLE FOLLOWING ME EVERYWHERE I GO DOES MAKE ME FEEL DISTINGUISHED." onclick="showTextTooltip(event,this)" data-translation="AS PESSOAS ME SEGUINDO EM TODO LUGAR ME FAZ SENTIR DISTINTO."></div><div class="text-hotspot" style="left:48.375%;top:66.64583333333334%;width:30.875000000000004%;height:.9427083333333334%" data-text="ANYHOW, THE GROUP IS LARGE ENOUGH." onclick="showTextTooltip(event,this)" data-translation="DE QUALQUER FORMA, O GRUPO É GRANDE O SUFICIENTE."></div><div class="text-hotspot" style="left:25.5%;top:68.04166666666667%;width:33.5%;height:1.2135416666666572%" data-text="WE SHOULD BE ABLE TO MOVE RIGHT AFTER THE HEAD COUNT." onclick="showTextTooltip(event,this)" data-translation="DEVEMOS CONSEGUIR NOS MOVER LOGO APÓS A CONTAGEM."></div><div class="text-hotspot" style="left:62.25000000000001%;top:73.77604166666667%;width:36.99999999999999%;height:1.0104166666666572%" data-text="M M GRUMBLE GRUMBLE" onclick="showTextTooltip(event,this)" data-translation="M M RESMUNGAR RESMUNGAR"></div><div class="text-hotspot" style="left:20.375%;top:83.296875%;width:61.25000000000001%;height:.9583333333333333%" data-text="WHICH IS A RELIEF, SINCE WE WERE REALLY RUNNING OUT OF TIME." onclick="showTextTooltip(event,this)" data-translation="O QUE É UM ALÍVIO, JÁ QUE ESTÁVAMOS REALMENTE FICANDO SEM TEMPO."></div><div class="text-hotspot" style="left:10%;top:87.97916666666666%;width:77.875%;height:6.223958333333343%" data-text="THERE'S SOMETHING I MUST DO BEFORE THAT. P &quot;\" onclick="showTextTooltip(event,this)" data-translation="HÁ ALGO QUE PRECISO FAZER ANTES DISSO. P &quot;\"></div><div class="text-hotspot" style="left:34.25%;top:94.94270833333334%;width:15%;height:.4270833333333286%" data-text="WHAT IS IT?" onclick="showTextTooltip(event,this)" data-translation="O QUE É?"></div><div class="text-hotspot" style="left:20.75%;top:98.890625%;width:57.99999999999999%;height:.8593750000000001%" data-text="THAT MAY BE THE MOST CRUCIAL PART TO OVERCOME THIS CRISIS." onclick="showTextTooltip(event,this)" data-translation="ESSA PODE SER A PARTE MAIS CRUCIAL PARA SUPERAR ESTA CRISE."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/143/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:19.125%;top:7.796875%;width:33.5%;height:.4583333333333333%" data-text="... WHAT IS YOUR NAME?" onclick="showTextTooltip(event,this)" data-translation="... QUAL É O SEU NOME?"></div><div class="text-hotspot" style="left:60.25%;top:10.364583333333334%;width:23.375%;height:.43750000000000006%" data-text="IT'S SAVASIN." onclick="showTextTooltip(event,this)" data-translation="É SAVASIN."></div><div class="text-hotspot" style="left:27.125%;top:12.057291666666666%;width:48.5%;height:1.0625%" data-text="SHAKE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27%;top:14.072916666666666%;width:6.75%;height:.26041666666666663%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:24.25%;top:17.640625%;width:52.25%;height:1.1718749999999964%" data-text="NICE TO MEET YOU. I AM BJORN, SON OF YANDEL." onclick="showTextTooltip(event,this)" data-translation="PRAZER EM CONHECÊ-LO. SOU BJORN, FILHO DE YANDEL."></div><div class="text-hotspot" style="left:41.75%;top:21.822916666666668%;width:43.375%;height:2.1562499999999964%" data-text="HAHA... I WAS WONDERING WHAT HE WAS PLANNING TO DO..." onclick="showTextTooltip(event,this)" data-translation="HAHA... EU ESTAVA ME PERGUNTANDO O QUE ELE ESTAVA PLANEJANDO FAZER..."></div><div class="text-hotspot" style="left:13.750000000000002%;top:25.151041666666668%;width:33.375%;height:.421875%" data-text="WHAT IS YOUR NAME?" onclick="showTextTooltip(event,this)" data-translation="QUAL É O SEU NOME?"></div><div class="text-hotspot" style="left:65.125%;top:26.651041666666668%;width:7.124999999999999%;height:.3020833333333333%" data-text="H" onclick="showTextTooltip(event,this)" data-translation="H"></div><div class="text-hotspot" style="left:56.99999999999999%;top:27.859374999999996%;width:34.625%;height:.4427083333333333%" data-text="WHAT ABOUT YOU?" onclick="showTextTooltip(event,this)" data-translation="E VOCÊ?"></div><div class="text-hotspot" style="left:15.625%;top:31.291666666666668%;width:35.75%;height:.9635416666666607%" data-text="NICE TO MEET YOU. WHAT'S YOUR NAME?" onclick="showTextTooltip(event,this)" data-translation="PRAZER EM CONHECÊ-LO. QUAL É O SEU NOME?"></div><div class="text-hotspot" style="left:13.25%;top:33.85416666666667%;width:51.5%;height:1.2135416666666643%" data-text="HE SAID NOT TO INTERFERE BECAUSE IT'S VERY IMPORTANT." onclick="showTextTooltip(event,this)" data-translation="ELE DISSE PARA NÃO INTERFERIR PORQUE É MUITO IMPORTANTE."></div><div class="text-hotspot" style="left:40.625%;top:35.682291666666664%;width:40.5%;height:.953125%" data-text="MAYBE IT'S SOME SORT OF A BARBARIAN RITUAL..." onclick="showTextTooltip(event,this)" data-translation="TALVEZ SEJA ALGUM TIPO DE RITUAL BÁRBARO..."></div><div class="text-hotspot" style="left:58.75%;top:39.890625%;width:4.625%;height:.036458333333333336%" data-text="..." onclick="showTextTooltip(event,this)" data-translation="..."></div><div class="text-hotspot" style="left:29.5%;top:42.03125%;width:11%;height:.48958333333333337%" data-text="000" -text="I ALREADY ASKED YOUR NAME, DAVERS." onclick="showTextTooltip(event,this)" data-translation="EU JÁ PERGUNTEI SEU NOME, DAVERS."></div><div class="text-hotspot" style="left:24.75%;top:31.109375%;width:32.125%;height:.6927083333333334%" data-text="WOW, YOU ACTUALLY REMEMBER?" onclick="showTextTooltip(event,this)" data-translation="UOU, VOCÊ REALMENTE LEMBRA?"></div><div class="text-hotspot" style="left:9.375%;top:36.432291666666664%;width:53.37499999999999%;height:.703125%" data-text="OF COURSE. WE'RE COMRADES-IN-ARMS NOW." onclick="showTextTooltip(event,this)" data-translation="CLARO. SOMOS COMPANHEIROS DE ARMAS AGORA."></div><div class="text-hotspot" style="left:13.375%;top:40.739583333333336%;width:46.75%;height:1.1979166666666667%" data-text="I AM HUMBER ALBERTINE. LET'S HAVE A DRINK AFTER WE GET OUT." onclick="showTextTooltip(event,this)" data-translation="EU SOU HUMBER ALBERTINE. VAMOS TOMAR UMA BEBIDA DEPOIS QUE SAIRMOS."></div><div class="text-hotspot" style="left:36.375%;top:42.3125%;width:28.249999999999996%;height:.71875%" data-text="SHAKE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:62.25000000000001%;top:46.833333333333336%;width:28.749999999999993%;height:.6979166666666643%" data-text="I'LL REMEMBER THAT." onclick="showTextTooltip(event,this)" data-translation="VOU LEMBRAR DISSO."></div><div class="text-hotspot" style="left:30.875000000000004%;top:48.973958333333336%;width:18.875%;height:.47916666666666663%" data-text="HEY, I'M IN!" onclick="showTextTooltip(event,this)" data-translation="EI, EU ESTOU DENTRO!"></div><div class="text-hotspot" style="left:51%;top:50.77604166666667%;width:39.75%;height:.6875%" data-text="I KNOW HOW TO DRINK, TOO." onclick="showTextTooltip(event,this)" data-translation="EU TAMBÉM SEI COMO BEBER."></div><div class="text-hotspot" style="left:13.375%;top:52.71875%;width:42.25%;height:.9583333333333333%" data-text="LEAVE HIM OUT. HIS WIFE FORBADE HIM FROM DRINKING." onclick="showTextToo
