<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-hotspot[data-warning]{border:1px dashed rgba(255,100,0,.85);background:rgba(255,100,0,.1)}.text-hotspot[data-warning]:hover{background:rgba(255,100,0,.22)}.text-hotspot[data-tips]{border:1px solid rgba(100,200,255,.4)}.text-hotspot[data-tips]:hover{border:1px solid rgba(100,200,255,.7);background:rgba(100,200,255,.08)}.text-tooltip{position:absolute;z-index:1000;max-width:min(92vw,460px);max-height:70vh;overflow-y:auto;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}.text-tooltip .main-text{white-space:pre-line}.tip-section{margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.2);font-size:12px;line-height:1.45;color:#a8d8ff}.tip-section p{margin:0 0 6px 0}.tip-section p:last-child{margin-bottom:0}.tip-section strong{color:#d7ecff}.tip-section code{background:rgba(255,255,255,.12);border-radius:3px;padding:1px 4px;font-size:11px}.tip-section ol,.tip-section ul{margin:0 0 6px 0;padding-left:18px}.tip-section li{margin-bottom:2px}.tip-section h4,.tip-section h5{margin:6px 0 3px 0;color:#d7ecff;font-size:12px}.tip-section table{border-collapse:collapse;margin:4px 0 6px 0;width:100%}.tip-section td,.tip-section th{border:1px solid rgba(255,255,255,.2);padding:3px 6px;text-align:left;font-size:11px}</style><title>99</title><link rel="icon" href="cover.jpg"><link rel="apple-touch-icon" href="cover.jpg"><link rel="manifest" href="manifest.json"></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/99/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:27.375%;top:3.21875%;width:46.125%;height:.8125%" data-text="THE GODDESS HAS JUST SPOKEN." data-translation="A DEUSA ACABOU DE FALAR." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **'has just spoken'** indica uma ação muito recente. Em português, usamos 'acabou de' para transmitir essa ideia. Essa estrutura é formada pelo **present perfect** ('has spoken') com 'just' para enfatizar a recência da ação. - 'He has just left the room.' (Ele acabou de sair da sala.)"></div><div class="text-hotspot" style="left:22.25%;top:14.765624999999998%;width:57.49999999999999%;height:1.7968749999999998%" data-text="THAT RING WILL PREVENT YOUR ENCOUNTER WITH THAT PARTICULAR ENEMY UP TO THREE TIMES." data-translation="ESSE ANEL VAI IMPEDIR SEU ENCONTRO COM AQUELE INIMIGO ESPECÍFICO ATÉ TRÊS VEZES." onclick="showTextTooltip(event,this)" data-tips="💡 O verbo **'prevent'** significa 'impedir' ou 'evitar'. É seguido por um objeto direto e a preposição 'with' quando se refere a encontros ou interações. - 'The medicine will prevent infection.' (O remédio vai prevenir infecção.)"></div><div class="text-hotspot" style="left:22.875%;top:29.442708333333336%;width:55.375%;height:1.21875%" data-text="BY THAT PARTICULAR ENEMY, DO YOU MEAN REGAL VAGOS THE DRAGON SLAYER?" data-translation="POR AQUELE INIMIGO ESPECÍFICO, VOCÊ QUER DIZER REGAL VAGOS, O MATADOR DE DRAGÕES?" onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura **'do you mean'** é usada para pedir esclarecimento ou confirmação sobre algo. Em português, dizemos 'você quer dizer'. - 'By 'home', do you mean your apartment?' (Por 'casa', você quer dizer seu apartamento?)"></div><div class="text-hotspot" style="left:28.749999999999996%;top:40.692708333333336%;width:42.875%;height:1.203124999999993%" data-text="YES. SHE SAID ONLY THE ENCOUNTER WITH HIM WILL BE PREVENTED." data-translation="SIM. ELA DISSE QUE APENAS O ENCONTRO COM ELE SERÁ IMPEDIDO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.25%;top:45.838541666666664%;width:48.5%;height:1.6354166666666643%" data-text="THAT IS WHY YOU MUST MAKE PREPARATIONS TO OVERCOME THE TRAGIC FATE," data-translation="É POR ISSO QUE VOCÊ DEVE SE PREPARAR PARA SUPERAR O DESTINO TRÁGICO," onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **'That is why'** é usada para explicar a razão de algo. Em português, usamos 'é por isso que'. - 'She was late, and that is why she missed the bus.' (Ela estava atrasada, e é por isso que perdeu o ônibus.)"></div><div class="text-hotspot" style="left:37.75%;top:47.84375%;width:55.50000000000001%;height:1.328125%" data-text="THAT IS BOUND TO SWOOP DOWN ON YOU AFTER ALL THREE STRANDS ARE BROKEN." data-translation="QUE ESTÁ DESTINADO A CAIR SOBRE VOCÊ DEPOIS QUE TODOS OS TRÊS FIOS SE ROMPEREM." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.250000000000004%;top:57.21874999999999%;width:45.125%;height:1.1458333333333428%" data-text="DIVINE PROPHECY? I'M ABSOLUTELY DUMBFOUNDED BY THIS." data-translation="PROFECIA DIVINA? ESTOU COMPLETAMENTE PERPLEXO COM ISSO." onclick="showTextTooltip(event,this)" data-tips="💡 A palavra **'dumbfounded'** significa 'perplexo' ou 'atônito'. É um adjetivo que descreve alguém que está extremamente surpreso ou sem palavras. - 'He was dumbfounded by the news.' (Ele ficou perplexo com a notícia.)"></div><div class="text-hotspot" style="left:15.125%;top:65.30729166666667%;width:69.25%;height:1.15625%" data-text="I'M NOT A HERO OF AN EPIC TALE ON HIS WAY TO DEFEAT THE DEMON KING OR SOMETHING." data-translation="NÃO SOU UM HERÓI DE UM CONTO ÉPICO A CAMINHO DE DERROTAR O REI DEMÔNIO OU ALGO ASSIM." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **'on his way to'** indica que alguém está a caminho de fazer algo. Em português, usamos 'a caminho de'. - 'She is on her way to becoming a doctor.' (Ela está a caminho de se tornar médica.)"></div><div class="text-hotspot" style="left:30.5%;top:71.50520833333334%;width:39.25%;height:.953125%" data-text="WHY WOULD THE GODDESS EVEN PROTECT AN EVIL SPIRIT?" data-translation="POR QUE A DEUSA PROTEGERIA UM ESPÍRITO MALIGNO?" onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura **'Why would'** é usada para expressar dúvida ou incredulidade sobre a razão de algo. Em português, usamos 'por que' com um tom de questionamento. - 'Why would he do that?' (Por que ele faria isso?)"></div><div class="text-hotspot" style="left:26.75%;top:73.36458333333333%;width:31.374999999999996%;height:.3385416666666667%" data-text="WOULDN'T THE GODDESS KNOW...?" data-translation="A DEUSA NÃO SABERIA...?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.375%;top:76.55729166666667%;width:39.25%;height:1.0364583333333333%" data-text="WH-WHO ARE YOU RRRRREALLY, BJORN?!" data-translation="Q-QUEM É VOCÊ RRRREALMENTE, BJORN?!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.125%;top:83.578125%;width:33.125%;height:1.0572916666666665%" data-text="COULD YOU HAVE BEEN CHOSEN BY FATE...?" data-translation="PODERIA VOCÊ TER SIDO ESCOLHIDO PELO DESTINO...?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.5%;top:85.78645833333334%;width:50%;height:.7552083333333286%" data-text="THIS IS ABSOLUTELY UNPRECEDENTED!" data-translation="ISSO É ABSOLUTAMENTE SEM PRECEDENTES!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24.375%;top:87.3125%;width:47%;height:1.0572916666666665%" data-text="A BARBARIAN, CHOSEN BY THE GODDESS OF HUMANS!" data-translation="UM BÁRBARO, ESCOLHIDO PELA DEUSA DOS HUMANOS!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:9.75%;top:89.61458333333333%;width:23.875%;height:.15104166666666666%" data-text="MOVE ASIDE!" data-translation="SAIAM DA FRENTE!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24.125%;top:90.32291666666666%;width:30%;height:.6875%" data-text="I HAVE A LOT OF QUESTIONS TO ASK, TOO!" data-translation="EU TAMBÉM TENHO MUITAS PERGUNTAS PARA FAZER!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:6.125%;top:94.46354166666666%;width:46.5%;height:1.6197916666666665%" data-text="FWOOSH" data-translation="FWOOSH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53.5%;top:98.11979166666667%;width:23%;height:.546875%" data-text="PLOP" data-translation="PLOFT" onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/99/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:67.25%;top:2.5677083333333335%;width:8.625%;height:.16666666666666669%" data-text="...?" data-translation="...?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:9.375%;top:7.958333333333334%;width:44.625%;height:.9427083333333334%" data-text="BUT PERHAPS THE DIVINE PROPHECY WAS TOO DEMANDING ON HIS BODY." data-translation="MAS TALVEZ A PROFECIA DIVINA TENHA SIDO EXIGENTE DEMAIS PARA O CORPO DELE." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **'too demanding'** indica que algo é exigente ou difícil demais. Em português, usamos 'exigente demais'. - 'The job was too demanding for her.' (O trabalho era exigente demais para ela.)"></div><div class="text-hotspot" style="left:39.5%;top:14.546875%;width:50%;height:.6822916666666666%" data-text="THE SAINT FAINTED, AND OUR MEETING CAME TO AN END." data-translation="O SANTO DESMAIOU, E NOSSA REUNIÃO CHEGOU AO FIM." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **'came to an end'** significa que algo terminou. Em português, usamos 'chegou ao fim'. - 'The meeting finally came to an end.' (A reunião finalmente chegou ao fim.)"></div><div class="text-hotspot" style="left:11.875%;top:23.09375%;width:35.75%;height:.6979166666666666%" data-text="A MOMENT LATER, AT THE DRAWING ROOM" data-translation="UM MOMENTO DEPOIS, NA SALA DE ESTAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:59.25%;top:26.947916666666664%;width:29.375%;height:.16666666666666669%" data-text="...KROVITZ." data-translation="...KROVITZ." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.125%;top:28.046875%;width:36.25%;height:.9583333333333333%" data-text="I HONESTLY HAVE NO IDEA WHAT JUST HAPPENED." data-translation="HONESTAMENTE, NÃO TENHO IDEIA DO QUE ACABOU DE ACONTECER." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **'I have no idea'** é usada para indicar que alguém não sabe de algo. Em português, dizemos 'não tenho ideia'. - 'I have no idea where she went.' (Não tenho ideia de onde ela foi.)"></div><div class="text-hotspot" style="left:34.875%;top:32.463541666666664%;width:28.625%;height:.9791666666666667%" data-text="...TO TELL YOU THE TRUTH, ME NEITHER." data-translation="...PARA FALAR A VERDADE, EU TAMBÉM NÃO." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **'to tell you the truth'** é usada para introduzir uma afirmação honesta ou sincera. Em português, dizemos 'para falar a verdade'. - 'To tell you the truth, I don't like it.' (Para falar a verdade, eu não gosto disso.)"></div><div class="text-hotspot" style="left:35.25%;top:34.25%;width:54.125%;height:.6979166666666643%" data-text="A DIVINE PROPHECY GIVEN TO A NON-HUMAN...?" data-translation="UMA PROFECIA DIVINA DADA A UM NÃO-HUMANO?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:85%;top:36.421875%;width:6%;height:.4427083333333333%" data-text="M" data-translation="M" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:78%;top:38.921875%;width:13%;height:.10416666666666667%" data-text="------------" data-translation="------------" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.125%;top:40.661458333333336%;width:44.375%;height:.9479166666666667%" data-text="IS IT THE FIRST TIME SOMETHING LIKE THIS TOOK PLACE?" data-translation="É A PRIMEIRA VEZ QUE ALGO ASSIM ACONTECE?" onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura **'Is it the first time'** é usada para perguntar se algo está acontecendo pela primeira vez. Em português, dizemos 'É a primeira vez que'. - 'Is it the first time you visit this city?' (É a primeira vez que você visita esta cidade?)"></div><div class="text-hotspot" style="left:42.125%;top:43.05729166666667%;width:44.625%;height:.9531249999999929%" data-text="...AS FAR AS I'M AWARE, THIS IS THE THIRD TIME EVER." data-translation="...PELO QUE EU SEI, ESTA É A TERCEIRA VEZ." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.875%;top:47.682291666666664%;width:38.125%;height:.9375%" data-text="WHAT HAPPENED TO THE PREVIOUS TWO?" data-translation="O QUE ACONTECEU COM OS DOIS ANTERIORES?" onclick="showTextTooltip(event,this)" data-tips="💡 A palavra **'previous'** significa 'anterior'. Em português, usamos 'anteriores' para se referir a coisas que vieram antes. - 'What happened in the previous chapter?' (O que aconteceu no capítulo anterior?)"></div><div class="text-hotspot" style="left:35.375%;top:55.09375%;width:38.5%;height:.71875%" data-text="WELL, ACCORDING TO RECORDS..." data-translation="BEM, DE ACORDO COM OS REGISTROS..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.25%;top:60.16666666666667%;width:63.375%;height:1.3489583333333286%" data-text="...THEY WERE DENOUNCED AND KICKED OUT BY THEIR OWN PEOPLE FOR HERESY." data-translation="...ELES FORAM DENUNCIADOS E EXPULSOS PELO PRÓPRIO POVO POR HERESIA." onclick="showTextTooltip(event,this)" data-tips="💡 O verbo **'denounced'** significa 'denunciar'. É usado para indicar que alguém foi acusado publicamente de algo. - 'The journalist denounced the corruption.' (O jornalista denunciou a corrupção.)"></div><div class="text-hotspot" style="left:59.5%;top:66.671875%;width:6.625%;height:.16145833333333334%" data-text="wwww" data-translation="wwww" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:59.25%;top:68.99479166666667%;width:3.375%;height:.18229166666666666%" data-text="し" data-translation="し" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13%;top:69.02604166666667%;width:59.25%;height:1.3229166666666572%" data-text="NO WONDER THE HOLY ARCHBISHOP MADE SURE WE KEPT THIS TO OURSELVES..." data-translation="NÃO É À TOA QUE O ARCEBISPO SANTO FEZ QUESTÃO DE MANTERMOS ISSO EM SEGREDO..." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **'No wonder'** é usada para indicar que algo não é surpreendente. Em português, dizemos 'não é à toa'. - 'No wonder he is tired; he worked all night.' (Não é à toa que ele está cansado; ele trabalhou a noite toda.)"></div><div class="text-hotspot" style="left:48.875%;top:70.71354166666667%;width:16.375%;height:.35416666666666663%" data-text="SIGH" data-translation="SUSPIRO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:44.625%;top:74.65625%;width:42%;height:.6822916666666666%" data-text="IMMORTALITY IMPRINT IS KEY IN ANY BARBARIAN BUILD." data-translation="A IMPRESSÃO DE IMORTALIDADE É FUNDAMENTAL EM QUALQUER CONSTRUÇÃO DE BÁRBARO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.75%;top:76.171875%;width:34.625%;height:.4479166666666667%" data-text="IF I GET EXILED FROM MY TRIBE..." data-translation="SE EU FOR EXILADO DA MINHA TRIBO..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.875%;top:82.859375%;width:8.375%;height:.10416666666666667%" data-text="wwwwww" data-translation="wwwwww" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:38.5%;top:82.921875%;width:12.875%;height:.125%" data-text="wwwwwwwwww" data-translation="wwwwwwwwww" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24%;top:85.765625%;width:52.125%;height:.8645833333333286%" data-text="...MY BUILD WILL BE COMPLETELY RUINED." data-translation="...meu build vai ficar completamente arruinado." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.5%;top:91.58333333333334%;width:42.125%;height:.421875%" data-text="BUT YOU MAY REST ASSURED." data-translation="Mas você pode ficar tranquilo." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **'rest assured'** é usada para tranquilizar alguém, significando 'fique tranquilo'. - 'You can rest assured that everything is fine.' (Você pode ficar tranquilo que tudo está bem.)"></div><div class="text-hotspot" style="left:39.875%;top:92.45833333333333%;width:29.75%;height:.6302083333333333%" data-text="GLANCE" data-translation="OLHAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:49.375%;top:94.80208333333333%;width:36.875%;height:.953125%" data-text="IF THIS GETS LEAKED, IT DEFINITELY WON'T BE US." data-translation="Se isso vazar, definitivamente não seremos nós." onclick="showTextTooltip(event,this)" data-tips="💡 O verbo **'leaked'** significa 'vazar', no sentido de informação. É usado quando algo que deveria ser secreto se torna público. - 'The document was leaked to the press.' (O documento vazou para a imprensa.)"></div><div class="text-hotspot" style="left:11.125%;top:98.48958333333333%;width:19.875%;height:.515625%" data-text="OH!" data-translation="OH!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13.5%;top:99.27083333333333%;width:47.125%;height:.703125%" data-text="I-I WILL REMAIN TIGHT-LIPPPPPED. YOU CAN T
