earn with a tutor. - **The new method is much easier** than the old one."></div><div class="text-hotspot" style="left:51.24999999999999%;top:21.713541666666668%;width:23.75%;height:.421875%" data-text="WE SHOULD GO BACK." onclick="showTextTooltip(event,this)" data-translation="DEVEMOS VOLTAR."></div><div class="text-hotspot" style="left:24.125%;top:26.651041666666668%;width:51.37500000000001%;height:.6354166666666666%" data-text="YOU HAVE ENTERED CRYSTAL CAVE ON 1ST FLOOR." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ENTROU NA CAVERNA DE CRISTAL NO 1º ANDAR."></div><div class="text-hotspot" style="left:28.625%;top:32.96354166666667%;width:38.5%;height:.9687499999999929%" data-text="WE WILL GO EAST FOR THE NEXT TWO DAYS." onclick="showTextTooltip(event,this)" data-translation="VAMOS PARA O LESTE NOS PRÓXIMOS DOIS DIAS." data-tips="💡 **For the next two days** indica um período de tempo futuro em que algo acontecerá. É uma construção comum para falar sobre planos ou ações futuras. - **We'll be traveling** for the next two days. - **They'll stay here** for the next two days."></div><div class="text-hotspot" style="left:34.625%;top:39.859375%;width:30.75%;height:.18229166666666666%" data-text="3 HOURS LATER" onclick="showTextTooltip(event,this)" data-translation="3 HORAS DEPOIS"></div><div class="text-hotspot" style="left:12.75%;top:44.057291666666664%;width:45.125%;height:1.0572916666666665%" data-text="BAM" onclick="showTextTooltip(event,this)" data-translation="BAM"></div><div class="text-hotspot" style="left:6.625%;top:52.50520833333333%;width:61.5%;height:1.515625%" data-text="POW" onclick="showTextTooltip(event,this)" data-translation="POW"></div><div class="text-hotspot" style="left:38.375%;top:55.04687499999999%;width:22%;height:.21875000000000003%" data-text="[GNOME]" onclick="showTextTooltip(event,this)" data-translation="[GNOMO]"></div><div class="text-hotspot" style="left:8.25%;top:55.59375%;width:83.375%;height:1.0989583333333335%" data-text
