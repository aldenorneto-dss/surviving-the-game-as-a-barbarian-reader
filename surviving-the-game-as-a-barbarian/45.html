- Exemplos: 'I haven't finished my work just yet.' ou 'We can't leave just yet.'"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/45/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:24.625%;top:2.671875%;width:44.75%;height:.9427083333333334%" data-text="AND THAT EVIL PRIESTESS ELISA ISN'T CHASING AFTER US LIKE I WORRIED." onclick="showTextTooltip(event,this)" data-translation="E QUE AQUELA SACERDOTISA MALIGNA ELISA NÃO ESTÁ NOS PERSEGUINDO COMO EU TEMIA." data-tips="💡 'Chasing after' é um phrasal verb que significa 'perseguindo'. Pode ser usado em outros contextos, como 'The dog is chasing after the ball.'"></div><div class="text-hotspot" style="left:57.75%;top:4.546875%;width:23%;height:.16666666666666669%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO..."></div><div class="text-hotspot" style="left:25.374999999999996%;top:10.619791666666668%;width:49.25%;height:.6875%" data-text="...I LOST THE RING OF THE FROST SPIRIT TO TAP MISSHA'S POTENTIAL." onclick="showTextTooltip(event,this)" data-translation="...PERDI O ANEL DO ESPÍRITO DO GELO PARA DESPERTAR O POTENCIAL DE MISSHA."></div><div class="text-hotspot" style="left:20.375%;top:21.78125%;width:59.25%;height:1.4583333333333333%" data-text="BECAUSE THE RING IS NO MORE, THE PASSIVE SKILL OF THE UNDEAD GOLEM, WHICH HAD BEEN SUPPRESSED BY THE RING'S EFFECT, IS NOW ACTIVE AGAIN." onclick="showTextTooltip(event,this)" data-translation="PORQUE O ANEL NÃO EXISTE MAIS, A HABILIDADE PASSIVA DO GOLEM UNDEAD, QUE HAVIA SIDO SUPRIMIDA PELO EFEITO DO ANEL, ESTÁ ATIVA NOVAMENTE." data-tips="💡 'No more' significa 'não mais' ou 'não existe mais'.

- **Expressão:** Usada para indicar que algo deixou de existir ou funcionar.
- Exemplos: 'There is no more milk in the fridge.' ou 'The old bridge is no more.'"></div><div class="text-hotspot" style="left:31.624999999999996%;top:27.442708333333332%;width:66.5%;height:1.7968749999999998%" data-text="EWOOSH" onclick="showTextTooltip(event,this)" data-translation="EWOOSH"></div><div class="text-hotspot" style="left:30.875000000000004%;top:33.546875%;width:40.5%;height:.6979166666666666%" data-text="MY EQUIPMENTS ARE CORRODING FROM THE ACIDIC BLOOD." onclick="showTextTooltip(event,this)" data-translation="MEUS EQUIPAMENTOS ESTÃO CORROENDO PELO SANGUE ÁCIDO." data-tips="💡 'Corroding' significa que algo está sendo desgastado ou destruído, geralmente por uma substância química.

- **Vocabulário útil:** 'Corrode' é um verbo que descreve a deterioração de materiais.
- Exemplos: 'The metal is corroding due to the saltwater.' ou 'Acid can corrode many types of materials.'"></div><div class="text-hotspot" style="left:20.375%;top:40.65625%;width:59.5%;height:.9375%" data-text="EVEN MY BREASTPLATE AND SHIELD MADE FROM LITHINUM, A TIER-2 INGREDIENT, HAVE BEEN DAMAGED." onclick="showTextTooltip(event,this)" data-translation="ATÉ MESMO MINHA PEITORA E ESCUDO FEITOS DE LITHINUM, UM INGREDIENTE DE NÍVEL 2, FORAM DANIFICADOS."></div><div class="text-hotspot" style="left:4.75%;top:42.203125%;width:40.875%;height:.5989583333333286%" data-text="IT'LL COST ME A LOT OF MONEY TO REPAIR THEM..." onclick="showTextTooltip(event,this)" data-translation="VAI ME CUSTAR MUITO DINHEIRO PARA REPARÁ-LOS..." data-tips="💡 'It'll cost me a lot of money' é uma forma de expressar que algo será caro.

- **Futuro simples:** Usado para indicar uma previsão ou algo que vai acontecer.
- Exemplos: 'It'll take a long time to finish.' ou 'This project will cost a lot of resources.'"></div><div class="text-hotspot" style="left:63.87500000000001%;top:46.067708333333336%;width:35%;height:.9322916666666667%" data-text="FWOOSH" onclick="showTextTooltip(event,this)" data-translation="FWOOSH"></div><div class="text-hotspot" style="left:33.5%;top:55.19791666666667%;width:21.5%;height:.6979166666666572%" data-text="ANOTHER THING THAT SUCKS..." onclick="showTextTooltip(event,this)" data-translation="OUTRA COISA QUE É RUIM..."></div><div class="text-hotspot" style="left:64.25%;top:58.96875%;width:22.375%;height:.5260416666666666%" data-text="TURN" onclick="showTextTooltip(event,this)" data-translation="VIRAR"></div><div class="text-hotspot" style="left:37.25%;top:61.177083333333336%;width:18.75%;height:.46875%" data-text="TURN" onclick="showTextTooltip(event,this)" data-translation="VIRAR"></div><div class="text-hotspot" style="left:24%;top:61.83854166666667%;width:2.75%;height:.10416666666666667%" data-text="L" onclick="showTextTooltip(event,this)" data-translation="L"></div><div class="text-hotspot" style="left:20.625%;top:62.0625%;width:1.125%;height:.06770833333333334%" data-text="H" onclick="showTextTooltip(event,this)" data-translation="H"></div><div class="text-hotspot" style="left:28.999999999999996%;top:64.80208333333334%;width:45.875%;height:.6927083333333144%" data-text="...IS THAT WE HAVEN'T FOUND ANY ELEMENTAL ESSENCE." onclick="showTextTooltip(event,this)" data-translation="...É QUE NÃO ENCONTRAMOS NENHUMA ESSÊNCIA ELEMENTAL."></div><div class="text-hotspot" style="left:25.124999999999996%;top:71.65104166666667%;width:49.625%;height:.6770833333333286%" data-text="MISSHA IS VISIBLY GETTING MORE FATIGUED OVER TIME." onclick="showTextTooltip(event,this)" data-translation="MISSHA ESTÁ VISIVELMENTE FICANDO MAIS CANSADA COM O TEMPO." data-tips="💡 'Visibly getting more fatigued' indica que alguém está ficando visivelmente mais cansado.

- **Presente contínuo:** Usado para ações em progresso ou mudanças de estado.
- Exemplos: 'She is getting stronger every day.' ou 'The weather is getting colder.'"></div><div class="text-hotspot" style="left:7.625%;top:74.921875%;width:24.875%;height:.7552083333333334%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:67.5%;top:76.52083333333334%;width:23.625%;height:.6770833333333334%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:74.25%;top:81.140625%;width:23.125%;height:.5833333333333334%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:28.875%;top:82.38541666666667%;width:42%;height:.9479166666666572%" data-text="I WOULD SAY MY CHANCES OF MAKING IT BACK TO THE CITY SAFELY..." onclick="showTextTooltip(event,this)" data-translation="EU DIRIA QUE MINHAS CHANCES DE VOLTAR PARA A CIDADE EM SEGURANÇA..." data-tips="💡 'I would say' é uma forma de introduzir uma opinião ou estimativa, similar a 'Eu diria' em português."></div><div class="text-hotspot" style="left:5.5%;top:84.18229166666666%;width:35.125%;height:.8645833333333334%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:65.5%;top:89.02083333333334%;width:33.375%;height:.8906249999999999%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:37.5%;top:90.21354166666666%;width:29.125%;height:.6979166666666666%" data-text="...IS ROUGHLY AROUND 30% AT THIS RATE." onclick="showTextTooltip(event,this)" data-translation="...ESTÃO EM CERCA DE 30% NESTE RITMO."></div><div class="text-hotspot" style="left:10.375%;top:95.3125%;width:64.25%;height:.6770833333333334%" data-text="IT HAS BEEN 12 HOURS SINCE YOU HAVE ENTERED THE WITCH'S FOREST." onclick="showTextTooltip(event,this)" data-translation="JÁ SE PASSARAM 12 HORAS DESDE QUE VOCÊ ENTROU NA FLORESTA DA BRUXA." data-tips="💡 'Since you have entered' usa o present perfect para indicar uma ação que começou no passado e ainda é relevante.

- **Present perfect:** Indica ações passadas com relevância no presente.
- Exemplos: 'It has been a week since we last met.' ou 'Since you have arrived, things have changed.'"></div><div class="text-hotspot" style="left:19.75%;top:97.10416666666667%;width:69.875%;height:.4166666666666667%" data-text="FIELD EFFECT OF WITCH'S FOREST IS NOW AMPLIFIED." onclick="showTextTooltip(event,this)" data-translation="O EFEITO DE CAMPO DA FLORESTA DA BRUXA AGORA ESTÁ AMPLIFICADO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/45/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:50.125%;top:3.122631499166288%;width:28.249999999999996%;height:.9777171441564347%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:15.875%;top:6.245262998332576%;width:28.249999999999996%;height:.8109746854630893%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:19.375%;top:15.325147794452024%;width:50.74999999999999%;height:1.0383507654994695%" data-text="AND IT'S BEEN 12 HOURS SINCE WE FIRST SET FOOT IN THE WITCH'S FOREST." onclick="showTextTooltip(event,this)" data-translation="E JÁ SE PASSARAM 12 HORAS DESDE QUE PISAMOS PELA PRIMEIRA VEZ NA FLORESTA DA BRUXA."></div><div class="text-hotspot" style="left:31.624999999999996%;top:18.296195240260722%;width:49%;height:1.3718356828861604%" data-text="AN ADDITIONAL STATUS EFFECT FROM THE FIELD DEBUFF WILL HOLD US BACK NOW." onclick="showTextTooltip(event,this)" data-translation="UM EFEITO DE STATUS ADICIONAL DO DEBUFF DE CAMPO NOS ATRAPALHARÁ AGORA." data-tips="💡 'Hold us back' é uma expressão que significa atrasar ou impedir o progresso.

- **Phrasal verb:** Usado para descrever algo que impede o avanço.
- Exemplos: 'Fear can hold you back from achieving your dreams.' ou 'The traffic held us back for hours.'"></div><div class="text-hotspot" style="left:28.625%;top:26.565105350917083%;width:35.25%;height:1.4097316962255562%" data-text="TIE THIS AROUND YOUR WAIST, MISSHA." onclick="showTextTooltip(event,this)" data-translation="AMARRE ISSO NA CINTURA, MISSHA."></div><div class="text-hotspot" style="left:38.25%;top:28.823707745945125%;width:50.625%;height:1.7583750189480065%" data-text="WE SHOULD BE ABLE TO FIND EACH OTHER BY PULLING IT, EVEN IF WE ARE TO SEPARATE." onclick="showTextTooltip(event,this)" data-translation="DEVEMOS SER CAPAZES DE NOS ENCONTRAR PUXANDO, MESMO QUE NOS SEPAREMOS." data-tips="💡 'Even if we are to separate' significa 'mesmo que venhamos a nos separar'.

- **Estrutura condicional:** Usada para situações hipotéticas ou futuras.
- Exemplos: 'Even if it rains, we'll go.' ou 'Even if he fails, he will try again.'"></div><div class="text-hotspot" style="left:21.375%;top:45.99060178869183%;width:70.375%;height:2.1373351523419686%" data-text="YOU KNOW ABOUT THE STATUS EFFECT ON ADVENTURERS THAT HAVE SPENT ENOUGH TIME WITHIN THESE WOODS, RIGHT?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ SABE SOBRE O EFEITO DE STATUS NOS AVENTUREIROS QUE PASSARAM TEMPO SUFICIENTE NESTAS MATAS, CERTO?"></div><div class="text-hotspot" style="left:43.125%;top:51.2505684402001%;width:14.875%;height:.8867667121418827%" data-text="AAAAA" onclick="showTextTooltip(event,this)" data-translation="AAAAA"></div><div class="text-hotspot" style="left:24.375%;top:58.09458844929514%;width:30.375000000000004%;height:.6745490374412612%" data-text="YEAH, I AM AWARRRE." onclick="showTextTooltip(event,this)" data-translation="SIM, ESTOU CIENTE."></div><div class="text-hotspot" style="left:16.625%;top:65.12808852508715%;width:67%;height:1.205093224192815%" data-text="YOU ARE NOW AFFECTED BY STATUS EFFECT [WITCH'S EYE]." onclick="showTextTooltip(event,this)" data-translation="VOCÊ AGORA ESTÁ AFETADO PELO EFEITO DE STATUS [OLHO DA BRUXA]."></div><div class="text-hotspot" style="left:12%;top:68.68273457632257%;width:30.5%;height:.6214946187661058%" data-text="LET'S KEEP MOVING." onclick="showTextTooltip(event,this)" data-translation="VAMOS CONTINUAR."></div><div class="text-hotspot" style="left:21.25%;top:86.09216310444141%;width:58.875%;height:2.0236471123237862%" data-text="WE CANNOT AFFORD TO TAKE A SINGLE BREAK FROM HERE ON!" onclick="showTextTooltip(event,this)" data-translation="NÃO PODEMOS NOS DAR AO LUXO DE FAZER UMA ÚNICA PAUSA DAQUI EM DIANTE!" data-tips="💡 'Cannot afford to take a single break' significa que não se pode dar ao luxo de fazer uma pausa, enfatizando urgência.

- Exemplos: 'We cannot afford to lose this opportunity.' ou 'I can't afford to miss this class.'"></div><div class="text-hotspot" style="left:64.875%;top:96.30892830074276%;width:33.5%;height:.24253448537213887%" data-text="To Be Continued" onclick="showTextTooltip(event,this)" data-translation="Continua..."></div><div class="text-hotspot" style="left:21.5%;top:96.89252690616948%;width:77.125%;height:3.0165226618159693%" data-text="СПС revolution PRODUCED BY: MIDNIGHT STUDIO DIRECTED BY SEOK HYO ART BY NEP ART ASSISTANCE BY JORIM, PURO BACKGROUND BY PASTRY COLORING BY TOAST, SAEMINA PARK COLORING ASSISTANCE BY HA NYANG, JODOEK BACKGROUND ASSISTANCE BY PHIL" onclick="showTextTooltip(event,this)" data-translation="СПС revolution PRODUZIDO POR: MIDNIGHT STUDIO DIRIGIDO POR SEOK HYO ARTE POR NEP ASSISTÊNCIA DE ARTE POR JORIM, PURO FUNDO POR PASTRY COLORIZAÇÃO POR TOAST, SAEMINA PARK ASSISTÊNCIA DE COLORIZAÇÃO POR HA NYANG, JODOEK ASSISTÊNCIA DE FUNDO POR PHIL"></div></div><div id="pipeline-stage-header" style="position:fixed;top:0;left:0;width:100%;height:20px;background:rgba(0,0,0,.45);color:#fff;font:11px/20px sans-serif;text-align:center;z-index:9999;pointer-events:none">Ep. 45 — traduzido</div><div id="global-text-tooltip" class="text-tooltip" translate="no"></div><script>function markdownToHtml(t){function e(t){return function(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}(t.trim()).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(?:^|[^*])\*([^*]+)\*(?!\*)/g,function(t,e){return t.replace("*"+e+"*","<em>"+e+"</em>")}).replace(/_([^_]+)_/g,"<em>$1</em>")}const n=t.split(/\r?\n/);let o="",l=null,i=[],r=!1;function c(){l&&(o+="</"+l+">",l=null)}function a(){r&&(i.length>0&&(o+="<table><tr>"+i[0].map(function(t){return"<th>"+e(t)+"</th>"}).join("")+"</tr>",i.slice(2).forEach(function(t){o+="<tr>"+t.map(function(t){return"<td>"+e(t)+"</td>"}).join("")+"</tr>"}),o+="</table>"),i=[],r=!1)}re
