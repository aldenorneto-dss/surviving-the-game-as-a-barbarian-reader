dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/127/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:29.5%;top:4.020833333333333%;width:41.375%;height:1.333333333333334%" data-text="I FEEL LIKE A VETERAN GAMER FOOLING AROUND IN A BEGINNER ZONE." onclick="showTextTooltip(event,this)" data-translation="ME SINTO COMO UM JOGADOR VETERANO BRINCANDO EM UMA ZONA DE INICIANTES."></div><div class="text-hotspot" style="left:61%;top:5.609375%;width:17.375%;height:.640625%" data-text="HA" onclick="showTextTooltip(event,this)" data-translation="HA"></div><div class="text-hotspot" style="left:6.25%;top:12.713541666666666%;width:36.125%;height:.5677083333333334%" data-text="I HOPE I FIND A PROMISING NEWBIE HERE" onclick="showTextTooltip(event,this)" data-translation="ESPERO ENCONTRAR UM NOVATO PROMISSOR AQUI"></div><div class="text-hotspot" style="left:10%;top:18.869791666666664%;width:47.375%;height:1.2552083333333333%" data-text="SHOUT SHOUT" onclick="showTextTooltip(event,this)" data-translation="GRITAR GRITAR"></div><div class="text-hotspot" style="left:19.25%;top:20.932291666666668%;width:60.875%;height:.7239583333333333%" data-text="IT'S OKAY, I DON'T BITE!!" onclick="showTextTooltip(event,this)" data-translation="TÁ TUDO BEM, EU NÃO MORDO!!"></div><div class="text-hotspot" style="left:55.375%;top:25.885416666666668%;width:41.375%;height:.9583333333333321%" data-text="BAHAHAHA חד" onclick="showTextTooltip(event,this)" data-translation="BAHAHAHA חד"></div><div class="text-hotspot" style="left:14.249999999999998%;top:29.21875%;width:29.25%;height:.9479166666666667%" data-text="WHY IS HE SHOUTING ALL OF A SUDDEN...?" onclick="showTextTooltip(event,this)" data-translation="POR QUE ELE ESTÁ GRITANDO DE REPENTE...?"></div><div class="text-hotspot" style="left:31.874999999999996%;top:30.307291666666668%;width:34.125%;height:.43750000000000006%" data-text="WHISPER" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.125%;top:32.072916666666664%;width:66.375%;height:1.5%" data-text="I DON'T KNOW, BUT NOBODY SANE EVER COMES HERE. WHISPER" onclick="showTextTooltip(event,this)" data-translation="NÃO SEI, MAS NINGUÉM SÃO VEM AQUI. SUSSURRO"></div><div class="text-hotspot" style="left:29.875%;top:35.38541666666667%;width:40%;height:.6927083333333334%" data-text="GOOD POINT. LET'S NOT GET INVOLVED." onclick="showTextTooltip(event,this)" data-translation="BOA OBSERVAÇÃO. VAMOS NÃO NOS ENVOLVER."></div><div class="text-hotspot" style="left:56.875%;top:36.578125%;width:34.75%;height:.4322916666666667%" data-text="WHISPER" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.125%;top:40.1875%;width:42.25%;height:.7447916666666667%" data-text="JUST THE REACTION I WANTED TO SEE FROM PEOPLE." onclick="showTextTooltip(event,this)" data-translation="EXATAMENTE A REAÇÃO QUE EU QUERIA VER DAS PESSOAS."></div><div class="text-hotspot" style="left:54%;top:42.401041666666664%;width:26.75%;height:.65625%" data-text="GRIN" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.875%;top:47.541666666666664%;width:46.875%;height:.7708333333333357%" data-text="IT'D BE ANNOYING TO RUN INTO UNWANTED TROUBLE." onclick="showTextTooltip(event,this)" data-translation="SERIA IRRITANTE ENCONTRAR PROBLEMAS INDESEJADOS."></div><div class="text-hotspot" style="left:11.875%;top:52.817708333333336%;width:54.25%;height:.9479166666666643%" data-text="IT'S LITERALLY A LAWLESS ZONE THERE. BE CAREFUL, OKAYYY?" onclick="showTextTooltip(event,this)" data-translation="É LITERALMENTE UMA ZONA SEM LEI LÁ. CUIDADO, TÁAA?"></div><div class="text-hotspot" style="left:19.25%;top:62.40104166666667%;width:61.375%;height:1.3489583333333333%" data-text="SEEING THE WORRIED LOOK ON MISSHA'S FACE AS SHE ESCORTED ME TO THE ENTRANCE CONVINCED ME TO TAKE THIS APPROACH." onclick="showTextTooltip(event,this)" data-translation="VER O OLHAR PREOCUPADO NO ROSTO DA MISSHA ENQUANTO ELA ME ESCOLTAVA ATÉ A ENTRADA ME CONVENCEU A TOMAR ESSA ABORDAGEM."></div><div class="text-hotspot" style="left:5.375%;top:67.44791666666666%;width:35.5%;height:.7552083333333334%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:61.75000000000001%;top:70.05208333333334%;width:35.125%;height:.7760416666666666%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:8.625%;top:72.22916666666667%;width:82.25%;height:.8385416666666666%" data-text="WHO HAS POWER AND AUTHORITY IN THE LAWLESS ZONE? THOSE WHO ARE STRONG." onclick="showTextTooltip(event,this)" data-translation="QUEM TEM PODER E AUTORIDADE NA ZONA SEM LEI? AQUELES QUE SÃO FORTES."></div><div class="text-hotspot" style="left:33.125%;top:77.64583333333334%;width:33.75%;height:.21354166666666666%" data-text="I REALIZED..." onclick="showTextTooltip(event,this)" data-translation="PERCEBI..."></div><div class="text-hotspot" style="left:15.75%;top:86.26041666666666%;width:24.375%;height:.4687500000000142%" data-text="LET'S GO. DEFINITELY NOT WORTH IT." onclick="showTextTooltip(event,this)" data-translation="VAMOS. DEFINITIVAMENTE NÃO VALE A PENA."></div><div class="text-hotspot" style="left:21.5%;top:91.14583333333334%;width:56.875%;height:.9739583333333333%" data-text="...I WON'T GET INTO MUCH TROUBLE WHILE I'M HERE." onclick="showTextTooltip(event,this)" data-translation="...NÃO VOU ME ENVOLVER EM MUITOS PROBLEMAS ENQUANTO ESTIVER AQUI."></div><div class="text-hotspot" style="left:64.375%;top:92.97916666666667%;width:24.75%;height:.46875%" data-text="I'LL THINK OF IT AS A MUCH NEEDED BREAK." onclick="showTextTooltip(event,this)" data-translation="VOU PENSAR NISSO COMO UMA PAUSA MUITO NECESSÁRIA."></div><div class="text-hotspot" style="left:28.875%;top:98.15625%;width:5.125%;height:.06770833333333334%" data-text="..." onclick="showTextTooltip(event,this)" data-translation="..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/127/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:57.875%;top:6.197916666666667%;width:31%;height:.8802083333333334%" data-text="GRIM" onclick="showTextTooltip(event,this)" data-translation="GRIM"></div><div class="text-hotspot" style="left:5.125%;top:14.911458333333332%;width:87.875%;height:2.671875%" data-text="SURVIVING THE GAME AS A BARBARIAN" onclick="showTextTooltip(event,this)" data-translation="SOBREVIVENDO NO JOGO COMO UM BÁRBARO"></div><div class="text-hotspot" style="left:29.75%;top:17.84375%;width:40.625%;height:.45312499999999994%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | TEAM THE JICK ORIGINAL STORY | Jung Yoon-kang" onclick="showTextTooltip(event,this)" data-translation="ARTE | ADAPTAÇÃO MIDNIGHT STUDIO | EQUIPE THE JICK HISTÓRIA ORIGINAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:45%;top:18.890625%;width:10%;height:.203125%" data-text="127" onclick="showTextTooltip(event,this)" data-translation="127"></div><div class="text-hotspot" style="left:36.75%;top:19.34375%;width:25.75%;height:.19791666666666669%" data-text="FOR ONCE" onclick="showTextTooltip(event,this)" data-translation="PELA PRIMEIRA VEZ"></div><div class="text-hotspot" style="left:58.62500000000001%;top:26.265624999999996%;width:21.5%;height:.4322916666666667%" data-text="TWO DAYS LATER" onclick="showTextTooltip(event,this)" data-translation="DOIS DIAS DEPOIS"></div><div class="text-hotspot" style="left:29.375%;top:34.734375%;width:42.25%;height:.6927083333333334%" data-text="ALRIGHT, WE'RE ALL HERE AS PROMISED..." onclick="showTextTooltip(event,this)" data-translation="CERTO, ESTAMOS TODOS AQUI COMO PROMETIDO..."></div><div class="text-hotspot" style="left:17%;top:38.619791666666664%;width:42.625%;height:1.2239583333333333%" data-text="...BUT IT LOOKS LIKE WE WON'T GET THE LOOT DISTRIBUTION DONE." onclick="showTextTooltip(event,this)" data-translation="...MAS PARECE QUE NÃO VAMOS CONSEGUIR FAZER A DISTRIBUIÇÃO DO SAQUE."></div><div class="text-hotspot" style="left:39.125%;top:40.32291666666667%;width:22.75%;height:.46875%" data-text="WITHOUT THE TEAM LEADER, THAT IS" onclick="showTextTooltip(event,this)" data-translation="SEM O LÍDER DA EQUIPE, ISSO É"></div><div class="text-hotspot" style="left:46.125%;top:46.536458333333336%;width:34.625%;height:.9635416666666667%" data-text="HOW MUCH DID WE MAKE THIS TIME ANYWAY?" onclick="showTextTooltip(event,this)" data-translation="QUANTO NÓS GANHAMOS DESSA VEZ, AFINAL?"></div><div class="text-hotspot" style="left:21.5%;top:49.416666666666664%;width:22%;height:.6927083333333334%" data-text="152.4 MILLION STONES." onclick="showTextTooltip(event,this)" data-translation="152,4 MILHÕES DE PEDRAS."></div><div class="text-hotspot" style="left:40.375%;top:50.67708333333333%;width:31.624999999999996%;height:.28125%" data-text="IT'S ALL INJMY MAGICAL INVENTORY." onclick="showTextTooltip(event,this)" data-translation="ESTÁ TUDO NO MEU INVENTÁRIO MÁGICO."></div><div class="text-hotspot" style="left:17.25%;top:54.23958333333333%;width:45.625%;height:1.046875000000007%" data-text="WH-WHAT?! I HAVE NEVER EVEN HEARD OF THAT NUMBER!" onclick="showTextTooltip(event,this)" data-translation="O-O QUÊ?! EU NUNCA NEM OUVI FALAR DESSE NÚMERO!"></div><div class="text-hotspot" style="left:56.25%;top:56.859375%;width:2.625%;height:.25%" data-text="00" onclick="showTextTooltip(event,this)" data-translation="00"></div><div class="text-hotspot" style="left:60.25%;top:56.859375%;width:2.625%;height:.3229166666666667%" data-text="σου" onclick="showTextTooltip(event,this)" data-translation="σου"></div><div class="text-hotspot" style="left:36.125%;top:60.229166666666664%;width:33.25%;height:.4375%" data-text="ARE YOU SERIOUSSS?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ FALANDO SÉRIOOO?"></div><div class="text-hotspot" style="left:46.75%;top:61.421875%;width:43.5%;height:.96875%" data-text="IS THAT EXCLUDING THE STUFF WE WERE GIVENNNN?" onclick="showTextTooltip(event,this)" data-translation="ISSO É EXCLUINDO AS COISAS QUE RECEBEMOSSS?"></div><div class="text-hotspot" style="left:9.625%;top:66.18229166666667%;width:55.00000000000001%;height:1.2135416666666665%" data-text="THAT'S FROM THE EQUIPMENT OF SEVEN INTERMEDIATE ADVENTURERS." onclick="showTextTooltip(event,this)" data-translation="ISSO É DO EQUIPAMENTO DE SETE AVENTUREIROS INTERMEDIÁRIOS."></div><div class="text-hotspot" style="left:16.375%;top:73.078125%;width:52.625%;height:1.734375%" data-text="WANNA KNOW WHAT'S EVEN COOLER? WE STILL HAVEN'T SOLD ONE OF THE NUMBERED ITEMS FOXFIRE KNOT." onclick="showTextTooltip(event,this)" data-translation="QUER SABER O QUE É AINDA MAIS LEGAL? AINDA NÃO VENDERMOS UM DOS ITENS NUMERADOS, O NÓ DE FOGO DE RAPOSA."></div><div class="text-hotspot" style="left:41.5%;top:75.60416666666666%;width:43.875%;height:.9687500000000142%" data-text="IT'S BEEN LISTED ON SALE, BUT NO BUYERS YET." onclick="showTextTooltip(event,this)" data-translation="ESTÁ LISTADO À VENDA, MAS AINDA NÃO TEMOS COMPRADORES."></div><div class="text-hotspot" style="left:25.75%;top:79.28645833333333%;width:55.125%;height:2.1458333333333286%" data-text="し ...I THOUGHT I WAS READY TO HEAR THE NUMBERS, BUT APPARENTLY NOT. U し" onclick="showTextTooltip(event,this)" data-translation="し ...ACHEI QUE ESTAVA PRONTO PARA OUVIR OS NÚMEROS, MAS APARENTEMENTE NÃO. U し"></div><div class="text-hotspot" style="left:27.875%;top:91.0625%;width:39.625%;height:.4479166666666667%" data-text="THE REACTIONS ARE JUST AS EXPECTED..." onclick="showTextTooltip(event,this)" data-translation="As reações são exatamente como esperado..."></div><div class="text-hotspot" style="left:7.249999999999999%;top:92.28645833333333%;width:26.25%;height:.828125%" data-text="LIFT" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:49.625%;top:97.85416666666666%;width:27.125%;height:.6927083333333334%" data-text="...BUT IT STILL FEELS A BIT EMPTY." onclick="showTextTooltip(event,this)" data-translation="...mas ainda assim parece um pouco vazio."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/127/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:28.125%;top:3.4375000000000004%;width:44.125%;height:.7604166666666667%" data-text="I DIDN'T KNOW IT'D BE A LITTLE BORING WITHOUT HIM." onclick="showTextTooltip(event,this)" data-translation="Eu não sabia que seria um pouco entediante sem ele."></div><div class="text-hotspot" style="left:13.5%;top:8.739583333333334%;width:28.875%;height:.48958333333333337%" data-text="GLANCE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:67%;top:11.265625%;width:1.625%;height:.057291666666666664%" data-text="о" onclick="showTextTooltip(event,this)" data-translation="о"></div><div class="text-hotspot" style="left:30.125%;top:14.531250000000002%;width:40.625%;height:.5%" data-text="BJORN, SON OF YANDEL." onclick="showTextTooltip(event,this)" data-translation="Bjorn, filho de Yandel."></div><div class="text-hotspot" style="left:21.75%;top:19.348958333333332%;width:57.375%;height:.765625%" data-text="BARBARIAN WARRIOR, SERVING AS APPLE NARAK'S LEADER AND PROTECTOR." onclick="showTextTooltip(event,this)" data-translation="Guerreiro bárbaro, servindo como líder e protetor de Apple Narak."></div><div class="text-hotspot" style="left:24%;top:29.697916666666668%;width:52.5%;height:1.0572916666666665%" data-text="WE WOULD BE ARGUING ABOUT THE RATIO OF LOOT DISTRIBUTION BY NOW IF HE WAS HERE." onclick="showTextTooltip(event,this)" data-translation="Estaríamos discutindo sobre a proporção da distribuição do saque agora se ele estivesse aqui."></div><div class="text-hotspot" style="left:22.25%;top:35.31770833333333%;width:57.49999999999999%;height:.9427083333333334%" data-text="40 PERCENT? WHY DOES THE MANTICORE ESSENCE COUNT AS SPECIAL LOOT?" onclick="showTextTooltip(event,this)" data-translation="40 por cento? Por que a essência de manticora conta como saque especial?"></div><div class="text-hotspot" style="left:45.125%;top:42.56770833333333%;width:47.625%;height:.9635416666666667%" data-text="IT'S NOT LIKE WE GOT IT THROUGH A DICE ROLL THAT DAY." onclick="showTextTooltip(event,this)" data-translation="Não é como se tivéssemos conseguido isso com um lance de dados naquele dia."></div><div class="text-hotspot" style="left:25%;top:44.145833333333336%;width:50.5%;height:1.234375%" data-text="WE SHOULD ALLOCATE IT USING THE COMMON RULE SINCE WE GOT IT FROM THE DWARF." onclick="showTextTooltip(event,this)" data-translation="Deveríamos alocar isso usando a regra comum, já que conseguimos do anão."></div><div class="text-hotspot" style="left:23%;top:49.265625%;width:54.25%;height:1.265625%" data-text="WHAT ABOUT THE 20 MILLION STONES WE RECEIVED?" onclick="showTextTooltip(event,this)" data-translation="E os 20 milhões de pedras que recebemos?"></div><div class="text-hotspot" style="left:16.75%;top:57.333333333333336%;width:67.25%;height:1.2708333333333333%" data-text="YOU'LL GET FULLY COMPENSATED FOR THE CONTAINER YOU USED." onclick="showTextTooltip(event,this)" data-translation="Você será totalmente compensado pelo contêiner que usou."></div><div class="text-hotspot" style="left:8.25%;top:62.317708333333336%;width:52.75%;height:.7031249999999929%" data-text="BUT A 40 PERCENT SHARE IS UNACCEPTABLE." onclick="showTextTooltip(event,this)" data-translation="Mas uma parte de 40 por cento é inaceitável."></div><div class="text-hotspot" style="left:26.75%;top:64.21875%;width:52%;height:.6927083333333334%" data-text="WE NEVER AGREED TO SOMETHING LIKE THIS IN ADVANCE." onclick="showTextTooltip(event,this)" data-translation="Nunca concordamos com algo assim de antemão."></div><div class="text-hotspot" style="left:22%;top:71.22395833333334%;width:39.875%;height:.7031249999999858%" data-text="THE CONVERSATION WOULD HAVE GONE THIS WAY," onclick="showTextTooltip(event,this)" data-translation="A conversa teria seguido por esse caminho,"></div><div class="text-hotspot" style="left:37.875%;top:72.63020833333333%;width:49.375%;height:1.1979166666666714%" data-text="AND I WOULD HAVE SMILINGLY OFFERED A NEW PROPOSITION TO MEET SOMEWHERE IN THE MIDDLE." onclick="showTextTooltip(event,this)" data-translation="e eu teria oferecido sorrindo uma nova proposta para chegar a um meio-termo."></div><div class="text-hotspot" style="left:5%;top:78.1875%;width:90.25%;height:1.1510416666666667%" data-text="I THOUGHT WE HAD ARGUED LIKE THIS BECAUSE WE BOTH WANTED TO MAKE THE MOST OUT OF OUR ADVENTURE..." onclick="showTextTooltip(event,this)" data-translation="Achei que discutíamos assim porque ambos queríamos aproveitar ao máximo nossa aventura..."></div><div class="text-hotspot" style="left:50%;top:81.6875%;width:34.625%;height:.953125%" data-text="...BUT PERHAPS THAT WASN'T THE ONLY REASON--" onclick="showTextTooltip(event,this)" data-translation="...mas talvez esse não fosse o único motivo--"></div><div class="text-hotspot" style="left:23.5%;top:83.53125%;width:44%;height:.7604166666666667%" data-text="ARE YOU DAY DREAMING, ARRRRR?" onclick="showTextTooltip(event,this)" data-translation="Você está sonhando acordado, arrrrr?"></div><div class="text-hotspot" style="left:79.5%;top:90.98958333333333%;width:3.25%;height:.22395833333333334%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:52.37500000000001%;top:91.35416666666667%;width:23.75%;height:.53125%" data-text="N-NOT AT ALL." onclick="showTextTooltip(event,this)" data-translation="N-Não, de jeito nenhum."></div><div class="text-hotspot" style="left:10.375%;top:95.65625%;width:16.625%;height:.390625%" data-text="WAVE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.875%;top:98.27083333333333%;width:52%;height:1.46875%" data-text="IF IT'S ALRIGHT WITH YOU ALL, I'LL HOLD ONTO THIS MONEY UNTIL MR. YANDEL COMES BACK. IT'S DIFFICULT TO SPLIT IT NOW ANYWAY." onclick="showTextTooltip(event,this)" data-translation="Se estiver tudo bem para vocês, eu guardarei esse dinheiro até o Sr. Yandel voltar. Está difícil dividir agora de qualquer forma."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/127/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:59.25%;top:.203125%;width:34.875%;height:.296875%" data-text="IF IT'S ALRIGHT WITH YOU ALL, I'LL HOLD ONTO THIS MONEY UNTIL MR. YANDEL COMES BACK. IT'S DIFFICULT TO SPLIT IT NOW ANYWAY." onclick="showTextTooltip(event,this)" data-translation="Se estiver tudo bem para vocês, eu guardarei esse dinheiro até o Sr. Yandel voltar. Está difícil dividir agora de qualquer forma."></div><div class="text-hotspot" style="left:22.125%;top:3.8906250000000004%;width:37.25%;height:1.203125%" data-text="OKAY. I CAN LEND AINAR SOME MONEY IN THE MEANTTTTIME." onclick="showTextTooltip(event,this)" data-translation="Ok. Posso emprestar algum dinheiro para Ainar enquanto isso."></div><div class="text-hotspot" style="left:76.25%;top:6.734374999999999%;width:12.875%;height:.3177083333333333%" data-text="NOD" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.5%;top:10.661458333333334%;width:48.25%;height:1.0416666666666665%" data-text="AGAIN?! WHY DO I HAVE TO KEEP BORROWING MONEY?" onclick="showTextTooltip(event,this)" data-translation="De novo?! Por que eu tenho que continuar pegando dinheiro emprestado?"></div><div class="text-hotspot" style="left:44.875%;top:15.932291666666668%;width:47%;height:.2916666666666667%" data-text="YOU ALREADY OWE ME A LOT. WHAT'S THE DIFFERENCE?" onclick="showTextTooltip(event,this)" data-translation="Você já me deve muito. Qual a diferença?"></div><div class="text-hotspot" style="left:37%;top:16.78125%;width:12%;height:.28125%" data-text="P-POINT TAKEN." onclick="showTextTooltip(event,this)" data-translation="P-Ponto aceito."></div><div class="text-hotspot" style="left:10.875%;top:20.015625%;width:7.5%;height:.11979166666666666%" data-text="GOGS" onclick="showTextTooltip(event,this)" data-translation="GOGS"></div><div class="text-hotspot" style="left:66.75%;top:20.671875%;width:4.875%;height:.04166666666666667%" data-text="..." onclick="showTextTooltip(event,this)" data-translation="..."></div><div class="text-hotspot" style="left:23.625%;top:22.635416666666668%;width:55.25%;height:1.2239583333333357%" data-text="WHAT THE... HOW COME NOBODY IS GIVING ME A DIRTY LOOK, WHEN IT'S OVER A HUNDRED MILLION STONES?" onclick="showTextTooltip(event,this)" data-translation="O que... Como é que ninguém está me olhando torto, quando são mais de cem milhões de pedras?"></div><div class="text-hotspot" style="left:14.000000000000002%;top:28.781250000000004%;width:46.875%;height:.9583333333333286%" data-text="AREN'T YOU WORRIED? I MEAN, THAT'S A LOT OF MONEY." onclick="showTextTooltip(event,this)" data-translation="Vocês não estão preocupados? Quero dizer, é muito dinheiro."></div><div class="text-hotspot" style="left:21.625%;top:38.619791666666664%;width:21.375%;height:.4270833333333333%" data-text="HUH? WHYYY?" onclick="showTextTooltip(event,this)" data-translation="Hã? Por quê?"></div><div class="text-hotspot" style="left:42.375%;top:46.041666666666664%;width:37.625%;height:.6875%" data-text="WHY WOULD WE BE WORRIED?" onclick="showTextTooltip(event,this)" data-translation="Por que estaríamos preocupados?"></div><div class="text-hotspot" style="left:32.125%;top:49.786458333333336%;width:35.75%;height:1.0364583333333333%" data-text="THEY'RE FINDING MY QUESTION STRANGE FOR SOME REASON." onclick="showTextTooltip(event,this)" data-translation="Eles estão achando minha pergunta estranha por algum motivo."></div><div class="text-hotspot" style="left:26.375%;top:54.734375%;width:47.125%;height:.84375%" data-text="IT'S AS IF I'M THE WEIRD ONE HERE." onclick="showTextTooltip(event,this)" data-translation="É como se eu fosse o esquisito aqui."></div><div class="text-hotspot" style="left:28.499999999999996%;top:57.13541666666667%;width:34.25%;height:.8697916666666666%" data-text="GLANCE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:78.375%;top:61.854166666666664%;width:2%;height:.07291666666666667%" data-text="O" onclick="showTextTooltip(event,this)" data-translation="O"></div><div class="text-hotspot" style="left:21.5%;top:63.20312500000001%;width:32.375%;height:.6927083333333334%" data-text="NOT THAT I AM OFFENDED OR ANYTHING," onclick="showTextTooltip(event,this)" data-translation="Não que eu esteja ofendido ou algo assim,"></div><div class="text-hotspot" style="left:46.125%;top:64.546875%;width:35.375%;height:.9479166666666667%" data-text="BUT IT SURELY FEELS... PECULIAR, FOR THE LACK OF A BETTER TERM." onclick="showTextTooltip(event,this)" data-translation="mas certamente parece... peculiar, por falta de um termo melhor."></div><div class="text-hotspot" style="left:9.5%;top:72.05729166666667%;width:80.375%;height:.59375%" data-text="PERHAPS THIS IS WHY THAT MAN DECIDED TO USE THAT MAGIC." onclick="showTextTooltip(event,this)" data-translation="Talvez seja por isso que aquele homem decidiu usar aquela magia."></div><div class="text-hotspot" style="left:19.625%;top:78.921875%;width:52.625%;height:.6875%" data-text="A MAGE OF THE TOWER WOULD NEVER DO SOMETHING HE DID." onclick="showTextTooltip(event,this)" data-translation="Um mago da torre nunca faria algo que ele fez."></div><div class="text-hotspot" style="left:53.625%;top:82.67708333333333%;width:22.125%;height:.4635416666666667%" data-text="SIGH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:47.875%;top:87.42708333333333%;width:35.25%;height:.953125%" data-text="BUT MAYBE... JUST MAYBE... I'M STARTING TO UNDERSTAND HIM." onclick="showTextTooltip(event,this)" data-translation="MAS TALVEZ... SÓ TALVEZ... EU ESTEJA COMEÇANDO A ENTENDÊ-LO."></div><div class="text-hotspot" style="left:14.374999999999998%;top:92.109375%;width:71.25%;height:.5625%" data-text="NOT ENTIRELY, OF COURSE. JUST BY LIKE ONE PERCENT." onclick="showTextTooltip(event,this)" data-translation="NÃO TOTALMENTE, CLARO. SÓ UM POUQUINHO, COMO UM POR CENTO."></div><div class="text-hotspot" style="left:33.375%;top:97.38020833333333%;width:35.625%;height:1.46875%" data-text="I SUPPOSE THAT TAKES CARE OF THE PURPOSE OF OUR MEETING TODAY." onclick="showTextTooltip(event,this)" data-translation="EU SUPONHO QUE ISSO CUIDA DO PROPÓSITO DA NOSSA REUNIÃO HOJE."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/127/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:27.750000000000004%;top:6.328125%;width:43.5%;height:1.229166666666666%" data-text="ARR, DO YOU KNOW ANYTHING ABOUT BIFRON? WHAT KIND OF A PLACE IS ITTT?" onclick="showTextTooltip(event,this)" data-translation="ARR, VOCÊ SABE ALGO SOBRE BIFRON? QUE TIPO DE LUGAR É ESSE?"></div><div class="text-hotspot" style="left:44.375%;top:13.609375000000002%;width:8.375%;height:.18229166666666666%" data-text="GOG" onclick="showTextTooltip(event,this)" data-translation="GOG"></div><div class="text-hotspot" style="left:21.25%;top:14.953125%;width:36.75%;height:.9635416666666661%" data-text="UHM, IT'S A DISTURBING PLACE FOR SURE." onclick="showTextTooltip(event,this)" data-translation="HUM, É UM LUGAR PERTURBADOR, COM CERTEZA."></div><div class="text-hotspot" style="left:39.625%;top:16.354166666666668%;width:43.125%;height:1.46875%" data-text="I HEARD THAT EVEN THE MOST DIGNIFIED PEOPLE BECOME UNDIGNIFIED THERE." onclick="showTextTooltip(event,this)" data-translation="OUVI DIZER QUE ATÉ AS PESSOAS MAIS DIGNAS SE TORNAM INDIGNAS LÁ."></div><div class="text-hotspot" style="left:24.375%;top:21.677083333333332%;width:52.25%;height:1.1510416666666643%" data-text="THAT'S WHAT POVERTY AND HUNGER DO TO A PERSON." onclick="showTextTooltip(event,this)" data-translation="É ISSO QUE A POBREZA E A FOME FAZEM COM UMA PESSOA."></div><div class="text-hotspot" style="left:9.375%;top:27.692708333333332%;width:2%;height:.07291666666666667%" data-text="O" onclick="showTextTooltip(event,this)" data-translation="O"></div><div class="text-hotspot" style="left:38.125%;top:29.802083333333336%;width:50%;height:.9635416666666607%" data-text="HAVE YOU BEEN IN A SIMILAR SITUATION, MR. URIKFRIED?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ JÁ ESTEVE EM UMA SITUAÇÃO SEMELHANTE, SR. URIKFRIED?"></div><div class="text-hotspot" style="left:11.625%;top:35.661458333333336%;width:76.75%;height:1.1666666666666667%" data-text="...I HAD LOST ALL OF MY GEARS THREE YEARS INTO MY CAREER AS AN ADVENTURER." onclick="showTextTooltip(event,this)" data-translation="...EU PERDI TODOS OS MEUS EQUIPAMENTOS TRÊS ANOS APÓS COMEÇAR MINHA CARREIRA COMO AVENTUREIRO."></div><div class="text-hotspot" style="left:73.25%;top:40.260416666666664%;width:25%;height:.6197916666666666%" data-text="PANT" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13.750000000000002%;top:42.59895833333333%;width:23.375%;height:.5052083333333333%" data-text="PANT" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13%;top:48.28645833333333%;width:77.125%;height:1.1614583333333333%" data-text="I BARELY SURVIVED THAT BY ONLY EATING DRY BREAD AND SAVING UP FOR ONE YEAR." onclick="showTextTooltip(event,this)" data-translation="EU MAL SOBREVIVI COMENDO APENAS PÃO SECO E ECONOMIZANDO POR UM ANO."></div><div class="text-hotspot" style="left:12.125%;top:58.17187499999999%;width:52.125%;height:1.468750000000007%" data-text="I ALMOST DIED BECAUSE I THOUGHT I WASN'T GOING TO HAVE ENOUGH TO PAY TAXES." onclick="showTextTooltip(event,this)" data-translation="QUASE MORRI PORQUE ACHEI QUE NÃO TERIA O SUFICIENTE PARA PAGAR OS IMPOSTOS."></div><div class="text-hotspot" style="left:50.74999999999999%;top:61.234375%;width:34.875%;height:.9479166666666667%" data-text="WHAT A SURPRISE TO HEAR THAT FROM YOU--" onclick="showTextTooltip(event,this)" data-translation="QUE SURPRESA OUVIR ISSO DE VOCÊ--"></div><div class="text-hotspot" style="left:46%;top:67.31770833333334%;width:42.875%;height:.703125%" data-text="... I HOPE BJORN IS DOING OKAYYYY." onclick="showTextTooltip(event,this)" data-translation="... ESPERO QUE BJORN ESTEJA BEM."></div><div class="text-hotspot" style="left:12.125%;top:74.48958333333333%;width:40.375%;height:1.21875%" data-text="YOU REALLY SHOULDN'T WORRY ABOUT HIM TOO MUCH." onclick="showTextTooltip(event,this)" data-translation="VOCÊ REALMENTE NÃO DEVERIA SE PREOCUPAR TANTO COM ELE."></div><div class="text-hotspot" style="left:33.625%;top:77.41145833333334%;width:49.125%;height:1.21875%" data-text="I DON'T THINK ANYONE IN BIFRON WOULD HAVE THE AUDACITY TO EVEN TOUCH HIM." onclick="showTextTooltip(event,this)" data-translation="NÃO ACHO QUE NINGUÉM EM BIFRON TERIA A AUDÁCIA DE TOCÁ-LO."></div><div class="text-hotspot" style="left:66.5%;top:79.05729166666666%;width:24.125%;height:.2916666666666667%" data-text="HE'S BASICALLY ON VACATION." onclick="showTextTooltip(event,this)" data-translation="ELE ESTÁ BASICAMENTE DE FÉRIAS."></div><div class="text-hotspot" style="left:36.75%;top:83.85416666666666%;width:39.875%;height:.421875%" data-text="I HOPE YOU'RE RRRRIGHT." onclick="showTextTooltip(event,this)" data-translation="ESPERO QUE VOCÊ ESTEJA CERTO."></div><div class="text-hotspot" style="left:52.25%;top:86.703125%;width:17.75%;height:.6302083333333428%" data-text="CHUCKLE EJ" onclick="showTextTooltip(event,this)" data-translation="RISADA EJ"></div><div class="text-hotspot" style="left:83.25%;top:88.9375%;width:16.25%;height:.08854166666666666%" data-text="555555GSGS" onclick="showTextTooltip(event,this)" data-t %;top:9.953125%;width:35%;height:1.4322916666666665%" data-text="PAUSE THAT MOMENT." onclick="showTextTooltip(event,this)" data-translation="PAUSA NESSE MOMENTO."></div><div class="text-hotspot" style="left:25.25%;top:15.187500000000002%;width:49.375%;height:.9375%" data-text="THAT WAS WHEN WE JUST ALL BECAME SPEECHLESS AS IF WE HAD AGREED TO IT IN ADVANCE." onclick="showTextTooltip(event,this)" data-translation="FOI QUANDO TODOS FICAMOS SEM PALAVRAS, COMO SE TIVÉSSEMOS CONCORDADO COM ISSO ANTES."></div><div class="text-hotspot" style="left:75.5%;top:25.255208333333336%;width:9.25%;height:.09895833333333334%" data-text="HMM..." onclick="showTextTooltip(event,this)" data-translation="HMM..."></div><div class="text-hotspot" style="left:18.625%;top:25.807291666666664%;width:10.75%;height:.140625%" data-text="HAHA..." onclick="showTextTooltip(event,this)" data-translation="HAHA..."></div><div class="text-hotspot" style="left:61.75000000000001%;top:25.890625%;width:7.75%;height:.13020833333333331%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:34.5%;top:27.557291666666668%;width:31%;height:.484375%" data-text="FOR THE SAME REASON." onclick="showTextTooltip(event,this)" data-translation="PELO MESMO MOTIVO."></div><div class="text-hotspot" style="left:13.25%;top:31.140625%;width:8.625%;height:.5989583333333334%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:21.875%;top:31.619791666666668%;width:56.49999999999999%;height:.8489583333333334%" data-text="BECAUSE THAT MAN IS CERTAINLY CAPABLE OF DOING JUST THAT." onclick="showTextTooltip(event,this)" data-translation="PORQUE AQUELE HOMEM É CERTAMENTE CAPAZ DE FAZER EXATAMENTE ISSO."></div><div class="text-hotspot" style="left:83%;top:32.067708333333336%;width:5.875%;height:.234375%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:75.25%;top:32.677083333333336%;width:5.75%;height:.2760416666666667%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:0;top:42.041666666666664%;width:99.875%;height:4.677083333333333%" data-text="BEHEL" onclick="showTextTooltip(event,this)" data-translation="BEHEL"></div><div class="text-hotspot" style="left:17.875%;top:75.03645833333333%;width:27.25%;height:.9479166666666714%" data-text="IT'S BEEN THREE DAYS SINCE I CAME HERE." onclick="showTextTooltip(event,this)" data-translation="FAZ TRÊS DIAS DESDE QUE CHEGUEI AQUI."></div><div class="text-hotspot" style="left:32.125%;top:76.44270833333333%;width:52.125%;height:.953125%" data-text="I BECAME THE BOSS OF THE WESTERN ALLIANCE, OCCUPYING THE WESTERN PART OF BIFRON." onclick="showTextTooltip(event,this)" data-translation="ME TORNEI O CHEFE DA ALIANÇA OCIDENTAL, OCUPANDO A PARTE OESTE DE BIFRON."></div><div class="text-hotspot" style="left:65.25%;top:78.109375%;width:27.625%;height:.6302083333333333%" data-text="JUST BECAUSE I WANTED TO HAVE LACKEYS UNDER ME FOR ONCE." onclick="showTextTooltip(event,this)" data-translation="SÓ PORQUE EU QUERIA TER ALGUNS CAPANGAS SOB MEU COMANDO, PELO MENOS UMA VEZ."></div><div class="text-hotspot" style="left:26.5%;top:82.06770833333333%;width:44.5%;height:.6666666666666667%" data-text="I CAN'T HEAR YOU!!" onclick="showTextTooltip(event,this)" data-translation="NÃO CONSIGO OUVIR VOCÊS!!"></div><div class="text-hotspot" style="left:48.25%;top:92.47395833333333%;width:32.25%;height:.7395833333333428%" data-text="OH, IT WASN'T TOO DIFFICULT." onclick="showTextTooltip(event,this)" data-translation="AH, NÃO FOI MUITO DIFÍCIL."></div><div class="text-hotspot" style="left:20.75%;top:97.859375%;width:11.75%;height:.65625%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/127/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:31.25%;top:.984375%;width:18.5%;height:.65625%" data-text="M M" onclick="showTextTooltip(event,this)" data-translation="M M"></div><div class="text-hotspot" style="left:79.75%;top:1.3072916666666667%;width:19.875%;height:.8958333333333334%" data-text="MMA M" onclick="showTextTooltip(event,this)" data-translation="MMA M"></div><div class="text-hotspot" style="left:4.875%;top:4.244791666666667%;width:15.625%;height:.5833333333333334%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:26.625%;top:4.71875%;width:11.25%;height:.3177083333333333%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:24.625%;top:5.901041666666667%;width:50.375%;height:.4270833333333333%" data-text="THEY USED A YOUNG KID TO LURE ME INTO A TRAP." onclick="showTextTooltip(event,this)" data-translation="ELES USARAM UMA CRIANÇA PARA ME ATRAPALHAR."></div><div class="text-hotspot" style="left:15.125%;top:9.979166666666666%;width:39%;height:.7291666666666666%" data-text="SO I JUST BEAT THE CRAP OUT OF EVERYONE." onclick="showTextTooltip(event,this)" data-translation="ENTÃO EU SIMPLESMENTE DETONEI TODO MUNDO."></div><div class="text-hotspot" style="left:59.875%;top:11.760416666666666%;width:31.5%;height:.5%" data-text="Alliance" onclick="showTextTooltip(event,this)" data-translation="Aliança"></div><div class="text-hotspot" style="left:0;top:12.333333333333334%;width:29.125%;height:.8645833333333334%" data-text="Western" onclick="showTextTooltip(event,this)" data-translation="Ocidental"></div><div class="text-hotspot" style="left:48.625%;top:18.807291666666668%;width:33.125%;height:.18229166666666666%" data-text="AND IT WORKED." onclick="showTextTooltip(event,this)" data-translation="E FUNCIONOU."></div><div class="text-hotspot" style="left:33.125%;top:33.395833333333336%;width:33.125%;height:.8489583333333334%" data-text="OKAY, THAT SHOULD SUFFICE." onclick="showTextTooltip(event,this)" data-translation="OK, ISSO DEVE BASTAR."></div><div class="text-hotspot" style="left:13.875000000000002%;top:38.994791666666664%;width:54.625%;height:1.1510416666666714%" data-text="THAT WILL BE ALL FOR TODAY. GO AND HAVE FUN!" onclick="showTextTooltip(event,this)" data-translation="É ISSO POR HOJE. VÃO E DIVIRTAM-SE!"></div><div class="text-hotspot" style="left:38.75%;top:48.65625%;width:48.5%;height:.8593750000000001%" data-text="OH, DON'T DO ANYTHING BAD. UNDERSTOOD?" onclick="showTextTooltip(event,this)" data-translation="AH, NÃO FAÇAM NADA DE ERRADO. ENTENDERAM?"></div><div class="text-hotspot" style="left:28.749999999999996%;top:51.11979166666667%;width:20%;height:.6875%" data-text="YES, SIR!!" onclick="showTextTooltip(event,this)" data-translation="SIM, SENHOR!!"></div><div class="text-hotspot" style="left:19.5%;top:57.494791666666664%;width:41%;height:1.2291666666666665%" data-text="RUSH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.375%;top:63.38541666666667%;width:42.75%;height:1.4739583333333335%" data-text="RUSH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.75%;top:68.36979166666667%;width:20.625%;height:.46875%" data-text="HMM" onclick="showTextTooltip(event,this)" data-translation="HMM"></div><div class="text-hotspot" style="left:21.875%;top:69.140625%;width:40.5%;height:.9583333333333333%" data-text="WHAT WAS YOUR NAME AGAIN? I CAN'T REMEMBER." onclick="showTextTooltip(event,this)" data-translation="QUAL ERA MESMO O SEU NOME? NÃO CONSIGO LEMBRAR."></div><div class="text-hotspot" style="left:45.75%;top:76.96875%;width:37.875%;height:.703125%" data-text="YOU NEVER ASKED, SIR--" onclick="showTextTooltip(event,this)" data-translation="O SENHOR NUNCA PERGUNTOU, SENHOR--"></div><div class="text-hotspot" style="left:31.374999999999996%;top:78.21354166666666%;width:27.625%;height:.828125%" data-text="ARE YOU TALKING BACK?" onclick="showTextTooltip(event,this)" data-translation="ESTÁ RESPONDENDO DE VOLTA?"></div><div class="text-hotspot" style="left:8.875%;top:81.984375%;width:43.25%;height:.734375%" data-text="SWEAT" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:38.125%;top:83.47395833333333%;width:38%;height:1.1822916666666667%" data-text="NO, SIR! MY NAME IS JINGKASAR FELJAIN!" onclick="showTextTooltip(event,this)" data-translation="NÃO, SENHOR! MEU NOME É JINGKASAR FELJAIN!"></div><div class="text-hotspot" style="left:69%;top:85.140625%;width:20.625%;height:.2916666666666714%" data-text="THE FORMER BOSS!" onclick="showTextTooltip(event,this)" data-translation="O EX-CHEFE!"></div><div class="text-hotspot" style="left:19.25%;top:89.41145833333334%;width:17.375%;height:.47395833333333337%" data-text="OH." onclick="showTextTooltip(event,this)" data-translation="OH."></div><div class="text-hotspot" style="left:26.625%;top:90.421875%;width:28.499999999999996%;height:.4479166666666667%" data-text="OKAY, JING-JING." onclick="showTextTooltip(event,this)" data-translation="OK, JING-JING."></div><div class="text-hotspot" style="left:60.25%;top:92.59895833333334%;width:22.25%;height:.20833333333333334%" data-text="...YES?" onclick="showTextTooltip(event,this)" data-translation="...SIM?"></div><div class="text-hotspot" style="left:13.5%;top:96.10416666666667%;width:17.25%;height:.11458333333333333%" data-text="JUST YES?" onclick="showTextTooltip(event,this)" data-translation="SÓ SIM?"></div><div class="text-hotspot" style="left:25%;top:97%;width:52.37500000000001%;height:.8385416666666666%" data-text="WHAT ABOUT SIR AT THE END, JING-JING?" onclick="showTextTooltip(event,this)" data-translation="E O SENHOR NO FINAL, JING-JING?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/127/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:1.625%;top:3.432291666666667%;width:40.375%;height:.8906249999999999%" data-text="GRAB" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.875%;top:7.552083333333333%;width:21.5%;height:.5364583333333334%" data-text="Y-YES, SIR." onclick="showTextTooltip(event,this)" data-translation="S-SIM, SENHOR."></div><div class="text-hotspot" style="left:6.75%;top:12.041666666666668%;width:28.000000000000004%;height:.6145833333333333%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32%;top:13.296875%;width:41%;height:.7708333333333334%" data-text="GOOD. LET'S GO FOR A WALK." onclick="showTextTooltip(event,this)" data-translation="BOM. VAMOS DAR UMA VOLTA."></div><div class="text-hotspot" style="left:16.25%;top:22.026041666666664%;width:41.875%;height:.46875%" data-text="...AS YOU WISH, SIR." onclick="showTextTooltip(event,this)" data-translation="...COMO O SENHOR DESEJAR."></div><div class="text-hotspot" style="left:20.5%;top:30.098958333333332%;width:13.125%;height:.16666666666666669%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:32.125%;top:33.43229166666667%;width:36.125%;height:1.2135416666666665%" data-text="UHM, SIR, THIS AREA BELONGS TO THE EASTERN ALLIANCE..." onclick="showTextTooltip(event,this)" data-translation="HUM, SENHOR, ESSA ÁREA PERTENCE À ALIANÇA ORIENTAL..."></div><div class="text-hotspot" style="left:45%;top:35.66666666666667%;width:2.875%;height:.07291666666666667%" data-text="15" onclick="showTextTooltip(event,this)" data-translation="15"></div><div class="text-hotspot" style="left:39.375%;top:41.796875%;width:44.625%;height:.9583333333333333%" data-text="THINGS WILL GET TERRIBLE IF THEY FIND OUT THAT I'M HERE..." onclick="showTextTooltip(event,this)" data-translation="AS COISAS VÃO FICAR TERRÍVEIS SE DESCOBRIREM QUE ESTOU AQUI..."></div><div class="text-hotspot" style="left:22%;top:46.890625%;width:27.5%;height:.8281250000000071%" data-text="ARE YOU TALKING BACK?" onclick="showTextTooltip(event,this)" data-translation="ESTÁ RESPONDENDO DE VOLTA?"></div><div class="text-hotspot" style="left:43.75%;top:55.0625%;width:25.374999999999996%;height:.46875%" data-text="SIKES!" onclick="showTextTooltip(event,this)" data-translation="SIKES!"></div><div class="text-hotspot" style="left:55.375%;top:55.82812499999999%;width:30.75%;height:.9427083333333334%" data-text="N-NOT U AT ALL, SIR!!" onclick="showTextTooltip(event,this)" data-translation="N-NEM UM POUCO, SENHOR!!"></div><div class="text-hotspot" style="left:52.125%;top:56.78125000000001%;width:4.625%;height:.21354166666666666%" data-text="し" onclick="showTextTooltip(event,this)" data-translation="し"></div><div class="text-hotspot" style="left:24.625%;top:61.421875%;width:50.24999999999999%;height:1.2135416666666665%" data-text="JING-JING. WHY ARE THE SOLDIERS UP THERE FACING THIS WAY, NOT OUTSIDE?" onclick="showTextTooltip(event,this)" data-translation="JING-JING. POR QUE OS SOLDADOS LÁ EM CIMA ESTÃO VIRADOS PARA CÁ, NÃO PARA FORA?"></div><div class="text-hotspot" style="left:34.375%;top:70.11458333333334%;width:50.75%;height:1.2135416666666572%" data-text="I-I'M NOT SURE, SIR. MAYBE THEY DON'T WANT ANYONE TO ESCAPE...?" onclick="showTextTooltip(event,this)" data-translation="N-NÃO TENHO CERTEZA, SENHOR. TALVEZ ELES NÃO QUEIRAM QUE ALGUÉM ESCAPE...?"></div><div class="text-hotspot" style="left:48.75%;top:76.71354166666666%;width:44.25%;height:.75%" data-text="GLARE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31%;top:80.59895833333334%;width:34.625%;height:.703125%" data-text="W-WAS THAT THE WRONG ANSWER?" onclick="showTextTooltip(event,this)" data-translation="E-ESSA FOI A RESPOSTA ERRADA?"></div><div class="text-hotspot" style="left:68.875%;top:81.86979166666667%;width:25%;height:.6302083333333333%" data-text="FLINCH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.75%;top:89.765625%;width:47%;height:.9427083333333428%" data-text="ACTUALLY, THAT'S EXACTLY WHAT I HAD INITIALLY THOUGHT TOO." onclick="showTextTooltip(event,this)" data-translation="NA VERDADE, FOI EXATAMENTE O QUE EU PENSEI INICIALMENTE TAMBÉM."></div><div class="text-hotspot" style="left:38.125%;top:91.59375%;width:45.5%;height:.45312499999999994%" data-text="THAT'S WHAT EVERYONE ELSE BELIEVES AS WELL." onclick="showTextTooltip(event,this)" data-translation="É O QUE TODO MUNDO ACREDITA TAMBÉM."></div><div class="text-hotspot" style="left:34.875%;top:94.96354166666666%;width:30.25%;height:.22916666666666666%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO..."></div><div class="text-hotspot" style="left:27.500000000000004%;top:98.39583333333334%;width:45%;height:.7708333333333334%" data-text="..THE PROTECTION MAGIC DOES NOT WORK IN BIFRON." onclick="showTextTooltip(event,this)" data-translation="...A MAGIA DE PROTEÇÃO NÃO FUNCIONA EM BIFRON."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/127/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:25.124999999999996%;top:.3177083333333333%;width:68.375%;height:.9062499999999999%" data-text="+++++++ +++++++" onclick="showTextTooltip(event,this)" data-translation="+++++++ +++++++"></div><div class="text-hotspot" style="left:0;top:.9322916666666667%;width:16.125%;height:.6197916666666666%" data-text="++++" onclick="showTextTooltip(event,this)" data-translation="++++"></div><div class="text-hotspot" style="left:8.5%;top:3.2552083333333335%;width:9.5%;height:.3177083333333333%" data-text="14" onclick="showTextTooltip(event,this)" data-translation="14"></div><div class="text-hotspot" style="left:0;top:4.5625%;width:41.875%;height:1.7552083333333333%" data-text="Ma +++++++" onclick="showTextTooltip(event,this)" data-translation="Ma +++++++"></div><div class="text-hotspot" style="left:45.25%;top:4.854166666666666%;width:54.625%;height:1.661458333333334%" data-text="Go +++++++++++" onclick="showTextTooltip(event,this)" data-translation="Go +++++++++++"></div><div class="text-hotspot" style="left:19%;top:7.078125%;width:61.75000000000001%;height:.9791666666666667%" data-text="WITCH POISON, WHICH CAUSED DESTRUCTION OF THE REST OF THE WORLD, IS LEAKING IN EVEN AS WE SPEAK." onclick="showTextTooltip(event,this)" data-translation="O VENENO DA BRUXA, QUE CAUSOU A DESTRUIÇÃO DO RESTO DO MUNDO, ESTÁ VAZANDO ENQUANTO FALAMOS."></div><div class="text-hotspot" style="left:26.5%;top:13.135416666666666%;width:46.875%;height:.7604166666666667%" data-text="IN OTHER WORDS, THOSE WHO WERE SENT TO THIS PLACE..." onclick="showTextTooltip(event,this)" data-translation="EM OUTRAS PALAVRAS, AQUELES QUE FORAM ENVIADOS PARA ESTE LUGAR..."></div><div class="text-hotspot" style="left:20.375%;top:22.630208333333332%;width:59.12500000000001%;height:.7604166666666667%" data-text="...ARE BASICALLY SLOWLY BUT SURELY DYING AS PUNISHMENT." onclick="showTextTooltip(event,this)" data-translation="...ESTÃO BASICAMENTE MORRENDO LENTAMENTE COMO PUNIÇÃO."></div><div class="text-hotspot" style="left:47.5%;top:24.385416666666668%;width:44.25%;height:.45312499999999994%" data-text="IT'S LIKE BEING EXPOSED TO RADIATION FOR AN EXTENDED TIME." onclick="showTextTooltip(event,this)" data-translation="É COMO SER EXPOSTO À RADIAÇÃO POR UM TEMPO PROLONGADO."></div><div class="text-hotspot" style="left:33.375%;top:28.1875%;width:46.625%;height:.71875%" data-text="THE KEY DIFFERENCE BETWEEN HERE AND THE REAL WORLD..." onclick="showTextTooltip(event,this)" data-translation="A PRINCIPAL DIFERENÇA ENTRE AQUI E O MUNDO REAL..."></div><div class="text-hotspot" style="left:14.625%;top:29.796875%;width:42.625%;height:.6927083333333334%" data-text="IS THAT THIS POISON HAS NO EFFECT ON PEOPLE UNDER 15." onclick="showTextTooltip(event,this)" data-translation="É QUE ESSE VENENO NÃO TEM EFEITO EM PESSOAS COM MENOS DE 15 ANOS."></div><div class="text-hotspot" style="left:26.25%;top:33.171875%;width:10.625%;height:.3854166666666667%" data-text="m" onclick="showTextTooltip(event,this)" data-translation="m"></div><div class="text-hotspot" style="left:30.25%;top:38.75%;width:46.25%;height:1.2083333333333333%" data-text="ONCE THEY TURN 15, HOWEVER, THEY BECOME INCREASINGLY MORE VULNERABLE AS THEY AGE." onclick="showTextTooltip(event,this)" data-translation="UMA VEZ QUE ELES COMPLETAM 15 ANOS, NO ENTANTO, ELES SE TORNAM CADA VEZ MAIS VULNERÁVEIS À MEDIDA QUE ENVELHECEM."></div><div class="text-hotspot" style="left:56.625%;top:40.552083333333336%;width:34.625%;height:.4635416666666667%" data-text="OUTSIDE OF RAFDONIA, THEY'LL DIE IN A SINGLE DAY." onclick="showTextTooltip(event,this)" data-translation="FORA DE RAFDONIA, ELES MORRERÃO EM UM ÚNICO DIA."></div><div class="text-hotspot" style="left:7.124999999999999%;top:44.78125%;width:36.75%;height:.8854166666666666%" data-text="TOSS" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13.875000000000002%;top:49.286458333333336%;width:42.75%;height:.4427083333333333%" data-text="BECAUSE I WASN'T PERMANENTLY EXILED," onclick="showTextTooltip(event,this)" data-translation="PORQUE EU NÃO FUI EXILADO PERMANENTEMENTE,"></div><div class="text-hotspot" style="left:32.875%;top:50.88020833333333%;width:45.5%;height:.7083333333333333%" data-text="MOZLAN GAVE ME THE ANTIDOTE TO TAKE ON A DAILY BASIS." onclick="showTextTooltip(event,this)" data-translation="MOZLAN ME DEU O ANTÍDOTO PARA TOMAR DIARIAMENTE."></div><div class="text-hotspot" style="left:25.374999999999996%;top:56.765625%;width:49.375%;height:1.1354166666666643%" data-text="I SUPPOSE THE SOLDIERS THERE ARE TAKING IT AS WELL." onclick="showTextTooltip(event,this)" data-translation="EU SUPONHO QUE OS SOLDADOS LÁ TAMBÉM ESTEJAM TOMANDO."></div><div class="text-hotspot" style="left:8.125%;top:60.875%;width:28.749999999999996%;height:.71875%" data-text="CRUNCH" onclick="showTextTooltip(event,this)" data-translation="CROC"></div><div class="text-hotspot" style="left:73.625%;top:62.463541666666664%;width:23.875%;height:.6354166666666666%" data-text="CRUNCY" onclick="showTextTooltip(event,this)" data-translation="CROC"></div><div class="text-hotspot" style="left:20.75%;top:67.05208333333333%;width:30.25%;height:.19791666666666669%" data-text="BUT I DIGRESS." onclick="showTextTooltip(event,this)" data-translation="MAS EU DIGRESSO."></div><div class="text-hotspot" style="left:33%;top:68%;width:50.375%;height:1.2083333333333333%" data-text="THE PERMANENT RESIDENTS OF THIS PLACE HAVE ALL BEEN BANISHED FROM OTHER DISTRICTS AND HAD KIDS HERE." onclick="showTextTooltip(event,this)" data-translation="OS RESIDENTES PERMANENTES DESTE LUGAR FORAM TODOS BANIDOS DE OUTROS DISTRITOS E TIVERAM FILHOS AQUI."></div><div class="text-hotspot" style="left:16.75%;top:73.30208333333333%;width:67.5%;height:1.3229166666666667%" data-text="IS IT REALLY NECESSARY TO WASTE RESOURCES IN THE ANTIDOTE TO PREVENT THEM FROM LEAVING RAFDONIA?" onclick="showTextTooltip(event,this)" data-translation="É REALMENTE NECESSÁRIO GASTAR RECURSOS NO ANTÍDOTO PARA IMPEDIR QUE ELES SAIAM DE RAFDONIA?"></div><div class="text-hotspot" style="left:25.624999999999996%;top:82.25%;width:48.625%;height:.9427083333333334%" data-text="WOULDN'T IT BE MUCH MORE CONVENIENT FOR THE ROYAL COURT TO JUST LET THEM LEAVE?" onclick="showTextTooltip(event,this)" data-translation="NÃO SERIA MUITO MAIS CONVENIENTE PARA A CORTE REAL SIMPLESMENTE DEIXÁ-LOS SAIR?"></div><div class="text-hotspot" style="left:15%;top:87.765625%;width:69.625%;height:.2552083333333333%" data-text="SOMETHING IS OUTSIDE." onclick="showTextTooltip(event,this)" data-translation="ALGO ESTÁ LÁ FORA."></div><div class="text-hotspot" style="left:18%;top:92.52083333333333%;width:27.625%;height:.421875%" data-text="THAT'S THE HUNCH I GOT." onclick="showTextTooltip(event,this)" data-translation="ESSA É A INTUIÇÃO QUE TIVE."></div><div class="text-hotspot" style="left:34.875%;top:98.546875%;width:54.25%;height:.9427083333333334%" data-text="THE VERY HUNCH THAT HELPED ME DISCOVER SO MANY HIDDEN FEATURES OF THE GAME." onclick="showTextTooltip(event,this)" data-translation="A MESMA INTUIÇÃO QUE ME AJUDOU A DESCOBRIR TANTAS FUNCIONALIDADES ESCONDIDAS DO JOGO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/127/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:10%;top:3.3125%;width:45.125%;height:2.0572916666666665%" data-text="WHISPER B-BOSS! THE EASTERN ALLIANCE IS HERE!" onclick="showTextTooltip(event,this)" data-translation="SUSSURRO C-CHEFE! A ALIANÇA DO LESTE ESTÁ AQUI!"></div><div class="text-hotspot" style="left:36.75%;top:6.552083333333333%;width:22.375%;height:.45312499999999994%" data-text="GLANCE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.25%;top:11.135416666666668%;width:45.5%;height:.9479166666666667%" data-text="THEY MUST HAVE FOUND OUT THAT WE WERE TRESPASSING!" onclick="showTextTooltip(event,this)" data-translation="ELES DEVEM TER DESCOBERTO QUE ESTÁVAMOS INVADINDO!"></div><div class="text-hotspot" style="left:66.875%;top:13%;width:23.25%;height:.4479166666666667%" data-text="YAWN" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:59.5%;top:14.114583333333334%;width:22.5%;height:.16145833333333334%" data-text="REALLY?" onclick="showTextTooltip(event,this)" data-translation="SÉRIO?"></div><div class="text-hotspot" style="left:35.375%;top:17.859375%;width:37.5%;height:.984375%" data-text="YES, SIR. I DON'T THINK THEY SAW US YET, THOUGH." onclick="showTextTooltip(event,this)" data-translation="SIM, SENHOR. EU NÃO ACHO QUE ELES NOS VIRAM AINDA, NO ENTANTO."></div><div class="text-hotspot" style="left:52.75%;top:19.614583333333332%;width:31%;height:.6822916
