NAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:44.375%;top:41.796875%;width:11%;height:.6302083333333333%" data-text="724 ARR" onclick="showTextTooltip(event,this)" data-translation="724 ARR"></div><div class="text-hotspot" style="left:21.875%;top:53.385416666666664%;width:18.125%;height:.16145833333333334%" data-text="MMM..." onclick="showTextTooltip(event,this)" data-translation="MMM..."></div><div class="text-hotspot" style="left:22.625%;top:56.166666666666664%;width:14.374999999999998%;height:.4427083333333333%" data-text="??" onclick="showTextTooltip(event,this)" data-translation="??"></div><div class="text-hotspot" style="left:26.125%;top:56.921875%;width:48.5%;height:.9479166666666667%" data-text="...WHO GAGGED THEM, AND WHERE DID THESE EVEN COME FROM?" onclick="showTextTooltip(event,this)" data-translation="...QUEM OS AMORDAÇOU, E DE ONDE ISSO VEIO?"></div><div class="text-hotspot" style="left:21.25%;top:66.76041666666667%;width:28.749999999999996%;height:.4427083333333333%" data-text="OH, THOSE ARE MINE." onclick="showTextTooltip(event,this)" data-translation="OH, ESSES SÃO MEUS."></div><div class="text-hotspot" style="left:37.5%;top:70.05208333333334%;width:50.875%;height:.9531249999999858%" data-text="I'M QUITE INTERESTED IN STUFF LIKE THAT AS WELL." onclick="showTextTooltip(event,this)" data-translation="EU TAMBÉM ESTOU BEM INTERESSADO EM COISAS ASSIM."></div><div class="text-hotspot" style="left:35.25%;top:74.56770833333334%;width:33.625%;height:1.0260416666666665%" data-text="FLINCH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:44.5%;top:77.77083333333333%;width:34.625%;height:.47395833333333337%" data-text="S-STUFF LIKE THAT?!" onclick="showTextTooltip(event,this)" data-translation="C-COISAS ASSIM?!"></div><div class="text-hotspot" style="left:48.375%;top:79.734375%;width:24.375%;height:.8645833333333334%" data-text="ми" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:26%;top:81.21875%;width:28.75%;height:1.1510416666666714%" data-text="WHAT AM I DOING? I SHOULDN'T JUDGE. U" onclick="showTextTooltip(event,this)" data-translation="O QUE EU ESTOU FAZENDO? NÃO DEVERIA JULGAR."></div><div class="text-hotspot" style="left:43.125%;top:83.03125%;width:31.374999999999996%;height:1.0364583333333333%" data-text="RAVEN MIGHT GET OFFENDED BY MY REACTION." onclick="showTextTooltip(event,this)" data-translation="RAVEN PODE FICAR OFENDIDO COM MINHA REAÇÃO."></div><div class="text-hotspot" style="left:56.75%;top:84.73958333333333%;width:33%;height:.8020833333333333%" data-text="WHEW" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:30.125%;top:88.24479166666667%;width:50.5%;height:1.9010416666666714%" data-text="ALRIGHT, I SUPPOSE THAT IS A GREAT AREA TO BE INTERESTED IN... NOD" onclick="showTextTooltip(event,this)" data-translation="TÁ BOM, EU ACHO QUE É UMA ÁREA LEGAL PARA SE INTERESSAR... NOD"></div><div class="text-hotspot" style="left:37.75%;top:96.00520833333334%;width:38.375%;height:1.2083333333333333%" data-text="GREAT AREA? ARE YOU ALSO INTERESTED IN MONSTER STUDIES?" onclick="showTextTooltip(event,this)" data-translation="ÁREA LEGAL? VOCÊ TAMBÉM SE INTERESSA POR ESTUDOS DE MONSTROS?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/124/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:27%;top:.35416666666666663%;width:14.875%;height:.2760416666666667%" data-text="MONSTER STUDIES?" onclick="showTextTooltip(event,this)" data-translation="ESTUDOS DE MONSTROS?"></div><div class="text-hotspot" style="left:40%;top:.921875%;width:31.75%;height:1.0416666666666667%" data-text="...ARE THE GAGS FOR MONSTERS THEN?" onclick="showTextTooltip(event,this)" data-translation="...ENTÃO AS MORDACAS SÃO PARA MONSTROS?"></div><div class="text-hotspot" style="left:11.5%;top:5.526041666666667%;width:52.87500000000001%;height:1.4791666666666667%" data-text="YEAH, I WAS HOPING TO CAPTURE ONE ALIVE TO STUDY ITS BEHAVIOR IF GIVEN A CHANCE." onclick="showTextTooltip(event,this)" data-translation="SIM, EU ESTAVA ESPERANDO CAPTURAR UM VIVO PARA ESTUDAR SEU COMPORTAMENTO, SE TIVER A CHANCE."></div><div class="text-hotspot" style="left:28.499999999999996%;top:6.598958333333334%;width:67.875%;height:2.3124999999999982%" data-text="му WAIT A MINUTE. THEN YOU JUST THOUGHT THE GAGS WEREN'T INTENDED FOR MONSTERS...!" onclick="showTextTooltip(event,this)" data-translation="му ESPERA UM MINUTO. ENTÃO VOCÊ ACHOU QUE AS MORDACAS NÃO ERAM PARA MONSTROS...!"></div><div class="text-hotspot" style="left:68.375%;top:9.130208333333334%;width:5.25%;height:.30729166666666663%" data-text="し" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.125%;top:12.479166666666666%;width:29.25%;height:.7760416666666666%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:64.25%;top:15.317708333333332%;width:31.374999999999996%;height:.6822916666666666%" data-text="BACK" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.375%;top:19.208333333333332%;width:50.875%;height:.5364583333333334%" data-text="WHAT WERE YOU THINKING?!" onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ ESTAVA PENSANDO?!"></div><div class="text-hotspot" style="left:49.75%;top:21.708333333333332%;width:33.125%;height:.5%" data-text="UHM, I CAN EXPLAIN." onclick="showTextTooltip(event,this)" data-translation="UH, EU POSSO EXPLICAR."></div><div class="text-hotspot" style="left:16.75%;top:27.010416666666664%;width:38.875%;height:1.0416666666666679%" data-text="DON'T COME CLOSE TO ME AGAIN. OKAY?" onclick="showTextTooltip(event,this)" data-translation="NÃO CHEGUE PERTO DE MIM DE NOVO. TÁ?"></div><div class="text-hotspot" style="left:41.25%;top:29.182291666666664%;width:19.5%;height:.375%" data-text="SIGH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53.25%;top:29.671874999999996%;width:34.375%;height:.47395833333333337%" data-text="HOW CLOSE IS CLOSE?" onclick="showTextTooltip(event,this)" data-translation="QUÃO PERTO É PERTO?"></div><div class="text-hotspot" style="left:24.125%;top:32.177083333333336%;width:22.5%;height:.5833333333333334%" data-text="THREE FEET." onclick="showTextTooltip(event,this)" data-translation="UM METRO."></div><div class="text-hotspot" style="left:60.25%;top:34.66666666666667%;width:19.75%;height:.22395833333333334%" data-text="...FINE." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:42.5%;top:37.41145833333333%;width:38.375%;height:.953125%" data-text="WHILE I JOKINGLY PRACTICED SOCIAL DISTANCING WITH RAVEN," onclick="showTextTooltip(event,this)" data-translation="ENQUANTO EU BRINCAVA DE PRATICAR DISTANCIAMENTO SOCIAL COM RAVEN,"></div><div class="text-hotspot" style="left:19.25%;top:39.104166666666664%;width:48.25%;height:.96875%" data-text="OTHERS KINDLY &quot;ENCOURAGED&quot; KARUI'S PRIESTESS TO HEAL THE INJURED." onclick="showTextTooltip(event,this)" data-translation="OUTROS GENTILMENTE &quot;INCENTIVAVAM&quot; A SACERDOTISA DE KARUI A CURAR OS FERIDOS."></div><div class="text-hotspot" style="left:44.625%;top:43.23958333333333%;width:20.5%;height:.30729166666666663%" data-text="J-JUST LET ME LIVE." onclick="showTextTooltip(event,this)" data-translation="S-SÓ ME DEIXEM VIVER."></div><div class="text-hotspot" style="left:9.75%;top:44.80208333333333%;width:31.624999999999996%;height:.6666666666666667%" data-text="THINK BEFORE YOU SPEAK, YOU'RE SUPPOSED TO MAKE HIM LIVE" onclick="showTextTooltip(event,this)" data-translation="PENSE ANTES DE FALAR, VOCÊ DEVERIA FAZER ELE VIVER"></div><div class="text-hotspot" style="left:39.125%;top:49.3125%;width:35.375%;height:.421875%" data-text="THANK YOU... THANK YOU..." onclick="showTextTooltip(event,this)" data-translation="Obrigado... Obrigado..."></div><div class="text-hotspot" style="left:63%;top:50.348958333333336%;width:13.25%;height:.09895833333333334%" data-text="REALLY..." onclick="showTextTooltip(event,this)" data-translation="De verdade..."></div><div class="text-hotspot" style="left:20.25%;top:54.41145833333333%;width:48.375%;height:.6875000000000071%" data-text="WHAT HAPPENED TO THE MMMMAGE?" onclick="showTextTooltip(event,this)" data-translation="O QUE ACONTECEU COM O M-MAGO?"></div><div class="text-hotspot" style="left:33.375%;top:59.635416666666664%;width:.8750000000000001%;height:.036458333333333336%" data-text="о" onclick="showTextTooltip(event,this)" data-translation="о"></div><div class="text-hotspot" style="left:53.625%;top:62.72916666666667%;width:32.875%;height:.6927083333333286%" data-text="инм, LAST TIME I CHECKED..." onclick="showTextTooltip(event,this)" data-translation="инм, DA ÚLTIMA VEZ QUE VERIFIQUEI..."></div><div class="text-hotspot" style="left:16%;top:66.47916666666667%;width:36%;height:.6927083333333334%" data-text="...HIS HEART HAD ALREADY STOPPED..." onclick="showTextTooltip(event,this)" data-translation="...O CORAÇÃO DELE JÁ TINHA PARADO..."></div><div class="text-hotspot" style="left:19.625%;top:68.421875%;width:24.125%;height:.625%" data-text="NOD" onclick="showTextTooltip(event,this)" data-translation="NOD"></div><div class="text-hotspot" style="left:91.75%;top:70.61979166666667%;width:6.875000000000001%;height:.2552083333333333%" data-text="D" onclick="showTextTooltip(event,this)" data-translation="D"></div><div class="text-hotspot" style="left:13.750000000000002%;top:74.8125%;width:28.249999999999996%;height:.17708333333333331%" data-text="I SSSSEE." onclick="showTextTooltip(event,this)" data-translation="ENTENDOOO."></div><div class="text-hotspot" style="left:28.625%;top:79.15625%;width:44.25%;height:.9635416666666667%" data-text="HOW DID THE DWARF FIND OUT THAT YOU WERE AN EVIL SPIRIT?" onclick="showTextTooltip(event,this)" data-translation="COMO O ANÃO DESCOBRIU QUE VOCÊ ERA UM ESPÍRITO MALIGNO?"></div><div class="text-hotspot" style="left:61.5%;top:89.28645833333333%;width:14.374999999999998%;height:.171875%" data-text="MMM." onclick="showTextTooltip(event,this)" data-translation="MMM."></div><div class="text-hotspot" style="left:18.125%;top:90.65625%;width:41%;height:1.5885416666666714%" data-text="OH, RIGHT. SWISH" onclick="showTextTooltip(event,this)" data-translation="AH, CERTO. SWISH"></div><div class="text-hotspot" style="left:8.75%;top:95.69270833333333%;width:15.75%;height:.40625%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:23.375%;top:95.73958333333333%;width:18.5%;height:.546875%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:23.625%;top:96.70833333333333%;width:53.25%;height:1.171875%" data-text="H-HE WAS A PLAY... I-I MEAN AN EVIL SPIRIT AS WELL." onclick="showTextTooltip(event,this)" data-translation="E-ELE ERA UM JOGAD... Q-QUERO DIZER, UM ESPÍRITO MALIGNO TAMBÉM."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/124/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:60.375%;top:4.927083333333333%;width:19.875%;height:.18229166666666666%" data-text="WHAT?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ?"></div><div class="text-hotspot" style="left:25.5%;top:6.895833333333333%;width:51.74999999999999%;height:1.203125%" data-text="THAT MUST BE WHY THE DWARF COULD INSTANTLY TELL HANS G WAS AN EVIL SPIRIT, JUST BY LOOKING AT HIM." onclick="showTextTooltip(event,this)" data-translation="DEVE SER POR ISSO QUE O ANÃO CONSEGUIU IDENTIFICAR QUE HANS G ERA UM ESPÍRITO MALIGNO, SÓ DE OLHAR PARA ELE."></div><div class="text-hotspot" style="left:11.5%;top:14.546875%;width:62.5%;height:1.2083333333333333%" data-text="ACCORDING TO HANS G, THE DWARF INITIATED A PRIVATE CONVERSATION WITH HIM USING A MAGICAL DEVICE WHILE THEY WERE ON WATCH DUTY." onclick="showTextTooltip(event,this)" data-translation="SEGUNDO HANS G, O ANÃO INICIOU UMA CONVERSA PARTICULAR COM ELE USANDO UM DISPOSITIVO MÁGICO ENQUANTO ESTAVAM DE VIGIA."></div><div class="text-hotspot" style="left:33%;top:16.322916666666668%;width:56.375%;height:1.2083333333333333%" data-text="AFTER THE DWARF TOLD HANS G THAT HE WAS ALSO A PLAYER, HANS G GOT EXCITED AND REVEALED HIS SECRET TOO." onclick="showTextTooltip(event,this)" data-translation="DEPOIS QUE O ANÃO DISSE A HANS G QUE TAMBÉM ERA UM JOGADOR, HANS G FICOU ANIMADO E REVELOU SEU SEGREDO TAMBÉM."></div><div class="text-hotspot" style="left:67.5%;top:17.848958333333336%;width:21.625%;height:.13020833333333331%" data-text="WHAT A FOOL" onclick="showTextTooltip(event,this)" data-translation="QUE IDIOTA"></div><div class="text-hotspot" style="left:19.375%;top:27.505208333333332%;width:36%;height:.6875%" data-text="BUT THAT WAS ALL RECORDED IN THE MAGICAL DEVICE." onclick="showTextTooltip(event,this)" data-translation="MAS TUDO ISSO FOI GRAVADO NO DISPOSITIVO MÁGICO."></div><div class="text-hotspot" style="left:39.25%;top:28.812500000000004%;width:42.375%;height:.9583333333333333%" data-text="HANS G HAD NO CHOICE BUT TO ACCEPT THE DWARF'S PROPOSITION." onclick="showTextTooltip(event,this)" data-translation="HANS G NÃO TEVE OUTRA ESCOLHA A NÃO SER ACEITAR A PROPOSTA DO ANÃO."></div><div class="text-hotspot" style="left:78.25%;top:30.354166666666664%;width:18.5%;height:.3125%" data-text="I'VE HEARD ENOUGH." onclick="showTextTooltip(event,this)" data-translation="JÁ OUVI O BASTANTE."></div><div class="text-hotspot" style="left:17.375%;top:37.20833333333333%;width:50.75%;height:1.218750000000007%" data-text="TOGGLING VOICE CONTROL ON... EXCEPT IT'S REALLY A SPELL TO KEEP OUR CONVERSATION PRIVATE." onclick="showTextTooltip(event,this)" data-translation="ATIVANDO CONTROLE DE VOZ... MAS NA VERDADE É UM FEITIÇO PARA MANTER NOSSA CONVERSA PRIVADA."></div><div class="text-hotspot" style="left:61.25000000000001%;top:43.97916666666667%;width:13.750000000000002%;height:.19791666666666669%" data-text="So..." onclick="showTextTooltip(event,this)" data-translation="Então..."></div><div class="text-hotspot" style="left:26.125%;top:48.53645833333333%;width:47.75%;height:1.1510416666666714%" data-text="...I'D LIKE TO HEAR WHAT YOU ALL THINK." onclick="showTextTooltip(event,this)" data-translation="...GOSTARIA DE OUVIR O QUE VOCÊS TODOS PENSAM."></div><div class="text-hotspot" style="left:45.5%;top:56.385416666666664%;width:1.7500000000000002%;height:.06770833333333334%" data-text="Al" onclick="showTextTooltip(event,this)" data-translation="Al"></div><div class="text-hotspot" style="left:42.125%;top:62.07812499999999%;width:44.75%;height:.6822916666666666%" data-text="ON HOW TO DEAL WITH THEM NOW?" onclick="showTextTooltip(event,this)" data-translation="SOBRE COMO LIDAR COM ELES AGORA?"></div><div class="text-hotspot" style="left:13%;top:65.46875%;width:46.875%;height:.9635416666666667%" data-text="YEAH. WE WON'T VOTE FOR IT, BUT I WANT TO HEAR YOUR OPINIONS." onclick="showTextTooltip(event,this)" data-translation="SIM. NÃO VAMOS VOTAR NISSO, MAS QUERO OUVIR SUAS OPINIÕES."></div><div class="text-hotspot" style="left:31.25%;top:70.84895833333333%;width:44.875%;height:1.1510416666666714%" data-text="THEY ATTACKED US, SO WE MUST KILL THEM!" onclick="showTextTooltip(event,this)" data-translation="ELES NOS ATACARAM, ENTÃO DEVEMOS MATÁ-LOS!"></div><div class="text-hotspot" style="left:29.75%;top:84.53125%;width:40.375%;height:1.4739583333333335%" data-text="UHM, IT MAKES SENSE TO KILL THEM, BUT CAN WE CLEAR THE RIFT WITHOUT THEMMM?" onclick="showTextTooltip(event,this)" data-translation="UHM, FAZ SENTIDO MATÁ-LOS, MAS PODEMOS LIMPAR A FENDA SEM ELES?"></div><div class="text-hotspot" style="left:26.5%;top:89.6875%;width:41.625%;height:.9479166666666572%" data-text="DO YOU THINK THEY'LL LISTEN TO US? I THINK NOT." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ACHA QUE ELES VÃO NOS OUVIR? EU ACHO QUE NÃO."></div><div class="text-hotspot" style="left:10.125%;top:97.96875%;width:5.5%;height:.20833333333333334%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/124/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20%;top:3.0052083333333335%;width:48.875%;height:.953125%" data-text="AN ALLY YOU CANNOT TRUST IS MORE DANGEROUS THAN A MONSTER." onclick="showTextTooltip(event,this)" data-translation="UM ALIADO EM QUEM VOCÊ NÃO PODE CONFIAR É MAIS PERIGOSO QUE UM MONSTRO."></div><div class="text-hotspot" style="left:18.125%;top:9.260416666666666%;width:41.125%;height:1.229166666666666%" data-text="WE MIGHT BE ABLE TO GIVE THOSE FROM NOARK A CHANCE," onclick="showTextTooltip(event,this)" data-translation="PODEMOS DAR UMA CHANCE AOS DE NOARK,"></div><div class="text-hotspot" style="left:33.375%;top:11.145833333333334%;width:51%;height:1.2135416666666665%" data-text="SINCE WE'LL NEVER GET TO SEE THEM AGAIN ONCE WE LEAVE THIS PLACE." onclick="showTextTooltip(event,this)" data-translation="JÁ QUE NUNCA MAIS VAMOS VÊ-LOS DEPOIS QUE SAIRMOS DAQUI."></div><div class="text-hotspot" style="left:23.75%;top:19.833333333333332%;width:52.125%;height:1.140625%" data-text="BUT THE SAME CAN'T BE SAID ABOUT THE EVIL SPIRITS." onclick="showTextTooltip(event,this)" data-translation="MAS O MESMO NÃO PODE SER DITO SOBRE OS ESPÍRITOS MALIGNOS."></div><div class="text-hotspot" style="left:18.5%;top:26.34375%;width:64.75%;height:1.2916666666666667%" data-text="SHE'S RIGHT! WE MUST KILL EVERY EVIL SPIRIT WE ENCOUNTER!!" onclick="showTextTooltip(event,this)" data-translation="ELA ESTÁ CERTA! DEVEMOS MATAR TODO ESPÍRITO MALIGNO QUE ENCONTRARMOS!!"></div><div class="text-hotspot" style="left:66.25%;top:31.041666666666668%;width:23.125%;height:.4635416666666667%" data-text="THAT'S WHAT THE CHIEFTAIN SAID!" onclick="showTextTooltip(event,this)" data-translation="FOI O QUE O CHEFE DISSE!"></div><div class="text-hotspot" style="left:33.875%;top:36.75%;width:51%;height:.953125%" data-text="I HAD BEEN SKEPTICAL ABOUT WHAT AINAR SAID... UNTIL TODAYYYY." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA CÉTICO SOBRE O QUE AINAR DISSE... ATÉ HOJEEE."></div><div class="text-hotspot" style="left:19.25%;top:38.484375%;width:49.5%;height:1.21875%" data-text="I NOW KNOW WHY PEOPLE SAY EVIL SPIRITS AREN'T TO BE TRUSTED." onclick="showTextTooltip(event,this)" data-translation="Agora eu entendo por que as pessoas dizem que espíritos malignos não são confiáveis."></div><div class="text-hotspot" style="left:33.75%;top:46.291666666666664%;width:51.875%;height:1.46875%" data-text="RIGHT. THEY'RE WILLING TO DO ANYTHING IN ORDER TO CONCEAL THEIR TRUE IDENTITY." onclick="showTextTooltip(event,this)" data-translation="Certo. Eles estão dispostos a fazer qualquer coisa para esconder sua verdadeira identidade."></div><div class="text-hotspot" style="left:20.5%;top:48.119791666666664%;width:43%;height:.96875%" data-text="IT'S MUCH BETTER TO KILL THEM WHILE WE HAVE A CHANCE." onclick="showTextTooltip(event,this)" data-translation="É muito melhor matá-los enquanto temos a chance."></div><div class="text-hotspot" style="left:25.5%;top:53.973958333333336%;width:48.375%;height:.8489583333333334%" data-text="WE WITNESSED WITH OUR OWN TWO EYES..." onclick="showTextTooltip(event,this)" data-translation="Nós testemunhamos com nossos próprios olhos..."></div><div class="text-hotspot" style="left:18.75%;top:62.53125000000001%;width:61.125%;height:1.6145833333333215%" data-text="...WHAT HAPPENED TO THE PEOPLE WHO TRUSTED EVIL SPIRITS." onclick="showTextTooltip(event,this)" data-translation="...o que aconteceu com as pessoas que confiaram em espíritos malignos."></div><div class="text-hotspot" style="left:27%;top:68.203125%;width:45.875%;height:.9427083333333334%" data-text="EACH WORD THAT COMES OUT OF THEIR MOUTHS... FEELS LIKE A DAGGER TO MY HEART." onclick="showTextTooltip(event,this)" data-translation="Cada palavra que sai da boca deles... parece uma adaga no meu coração."></div><div class="text-hotspot" style="left:23.375%;top:78.80729166666667%;width:52.75%;height:1.1614583333333333%" data-text="WHAT WOULD HAPPEN IF THEY FOUND OUT THAT I WAS ALSO AN EVIL SPIRIT?" onclick="showTextTooltip(event,this)" data-translation="O que aconteceria se eles descobrissem que eu também sou um espírito maligno?"></div><div class="text-hotspot" style="left:14.124999999999998%;top:86.86979166666666%;width:70.875%;height:.828125%" data-text="WOULD THEY TREAT ME THE SAME WAY...?" onclick="showTextTooltip(event,this)" data-translation="Eles me tratariam da mesma forma...?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/124/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:27.125%;top:.515625%;width:46.5%;height:.8385416666666665%" data-text="WHAT DO YOU THINK, MR. YANDEL?" onclick="showTextTooltip(event,this)" data-translation="O que você acha, Sr. Yandel?"></div><div class="text-hotspot" style="left:44%;top:8.265625%;width:19.75%;height:.6822916666666666%" data-text="HERE'S WHAT I THINK." onclick="showTextTooltip(event,this)" data-translation="Aqui está o que eu penso."></div><div class="text-hotspot" style="left:9%;top:23.666666666666668%;width:33.75%;height:.921875%" data-text="MMM" onclick="showTextTooltip(event,this)" data-translation="Hmm"></div><div class="text-hotspot" style="left:53.625%;top:26.3125%;width:24.375%;height:.515625%" data-text="TWITC" onclick="showTextTooltip(event,this)" data-translation="TIC"></div><div class="text-hotspot" style="left:0;top:28.755208333333332%;width:28.625%;height:.8385416666666666%" data-text="TWITCH" onclick="showTextTooltip(event,this) THAT'S NOT EVEN IMPORTANT, IS IT?" onclick="showTextTooltip(event,this)" data-translation="Mas isso nem é importante, é?"></div><div class="text-hotspot" style="left:18.625%;top:14.822916666666666%;width:64.125%;height:1.6197916666666665%" data-text="BECAUSE YOU'RE THE ONLY PERSON THAT CAN BE THE DOPPELGÄNGER NOW." onclick="showTextTooltip(event,this)" data-translation="Porque você é a única pessoa que pode ser o doppelgänger agora."></div><div class="text-hotspot" style="left:56.75%;top:25.546875000000004%;width:17.75%;height:.16666666666666669%" data-text="WHAT?" onclick="showTextTooltip(event,this)" data-translation="O quê?"></div><div class="text-hotspot" style="left:19.375%;top:29.239583333333336%;width:36%;height:1.2187499999999964%" data-text="OUT OF NINE PEOPLE WHO WERE IMMUNE TO THE VERIFICATION SPELL," onclick="showTextTooltip(event,this)" data-translation="De nove pessoas que eram imunes ao feitiço de verificação,"></div><div class="text-hotspot" style="left:35.125%;top:31.046875%;width:49.875%;height:.7083333333333333%" data-text="ONLY RAVEN AND I ARE STANDING STILL WITHOUT ANY INJURIES." onclick="showTextTooltip(event,this)" data-translation="apenas Raven e eu estamos de pé sem nenhum ferimento."></div><div class="text-hotspot" style="left:55.875%;top:39.109375%;width:19.625%;height:.22916666666666666%" data-text="OH...!" onclick="showTextTooltip(event,this)" data-translation="Oh...!"></div><div class="text-hotspot" style="left:22.625%;top:42.744791666666664%;width:61.75000000000001%;height:2.84375%" data-text="BUT SINCE THE GEM OF STONE HAS ALREADY PROVEN MY INNOCENCE... LIFT" onclick="showTextTooltip(event,this)" data-translation="Mas já que a Pedra da Verdade já provou minha inocência... LEVANTAR"></div><div class="text-hotspot" style="left:13.750000000000002%;top:49.223958333333336%;width:51.74999999999999%;height:1.515625%" data-text="RISE" onclick="showTextTooltip(event,this)" data-translation="SUBIR"></div><div class="text-hotspot" style="left:40.125%;top:54.80729166666667%;width:47.625%;height:.48958333333333337%" data-text="I'M NOT THE DOPPELGÄNGER!" onclick="showTextTooltip(event,this)" data-translation="Eu não sou o doppelgänger!"></div><div class="text-hotspot" style="left:18.75%;top:56.234375%;width:51.625%;height:1.0572916666666665%" data-text="THIS CAN'T BE! SOMETHING MUST HAVE GONE WRONG--" onclick="showTextTooltip(event,this)" data-translation="Isso não pode ser! Algo deve ter dado errado--"></div><div class="text-hotspot" style="left:44.75%;top:61.255208333333336%;width:40%;height:.6875%" data-text="I REALLY DID NOT EXPECT IT TO BE YYYYOU!" onclick="showTextTooltip(event,this)" data-translation="Eu realmente não esperava que fosse v-você!"></div><div class="text-hotspot" style="left:16.75%;top:63.67708333333333%;width:65.125%;height:1.921875%" data-text="I SWEAR I'M SPEAKING THE TRUTH! WH-WHY DON'T WE WAIT UNTIL TOMORROW? THE GEM OF TRUTH WILL REGENERATE--" onclick="showTextTooltip(event,this)" data-translation="Eu juro que estou falando a verdade! P-por que não esperamos até amanhã? A Pedra da Verdade vai regenerar--"></div><div class="text-hotspot" style="left:74.875%;top:66.33333333333333%;width:23.125%;height:.5052083333333333%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:40.75%;top:70.54166666666667%;width:35%;height:.6614583333333334%" data-text="STEP-" onclick="showTextTooltip(event,this)" data-translation="PASSO-"></div><div class="text-hotspot" style="left:58.5%;top:72.65625%;width:29.375%;height:.75%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:45.5%;top:74.80729166666666%;width:41.125%;height:1.4791666666666667%" data-text="CLEVER, SUGGESTING US TO USE THE GEM EVEN IN A SITUATION LIKE THIS." onclick="showTextTooltip(event,this)" data-translation="Esperta, sugerindo que usássemos a gema mesmo numa situação dessas."></div><div class="text-hotspot" style="left:12.125%;top:77.40625%;width:51.87500000000001%;height:1.3385416666666667%" data-text="GIVE US BACK ARR! SHE MAY BE A HUMAN MAGE, BUT SHE IS OUR COMPANION!" onclick="showTextTooltip(event,this)" data-translation="Devolva a Arr! Ela pode ser uma maga humana, mas é nossa companheira!"></div><div class="text-hotspot" style="left:22.75%;top:83.02604166666666%;width:20.5%;height:.17708333333333331%" data-text="N-NO..." onclick="showTextTooltip(event,this)" data-translation="N-Não..."></div><div class="text-hotspot" style="left:23.5%;top:84.41145833333333%;width:60.875%;height:.9166666666666714%" data-text="I'M REALLY NOT THE DOPPELGÄNGER!!" onclick="showTextTooltip(event,this)" data-translation="Eu realmente não sou o doppelgänger!!"></div><div class="text-hotspot" style="left:68%;top:90.63541666666667%;width:21%;height:.3125%" data-text="YOU HAVE TO BELIEVE ME!" onclick="showTextTooltip(event,this)" data-translation="Você tem que acreditar em mim!"></div><div class="text-hotspot" style="left:23.25%;top:94.671875%;width:31.125000000000004%;height:.53125%" data-text="WHAT A RARE SIGHT..." onclick="showTextTooltip(event,this)" data-translation="Que visão rara..."></div><div class="text-hotspot" style="left:27.625%;top:99.265625%;width:44.5%;height:.7083333333333333%" data-text="BUT SHE MIGHT REALLY BURST INTO TEARS, SO I SHOULD DROP THE ACT NOW." onclick="showTextTooltip(event,this)" data-translation="Mas ela pode realmente começar a chorar, então devo parar com a encenação agora."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/124/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:39.625%;top:.0625%;width:20%;height:.16145833333333334%" data-text="BUT SHE MIGHT REALLY BURST INTO TEARS, SO I SHOULD DROP THE ACT NOW." onclick="showTextTooltip(event,this)" data-translation="Mas ela pode realmente começar a chorar, então devo parar com a encenação ag 333334%;width:1.5%;height:.07291666666666667%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:23.375%;top:92.4375%;width:52.875%;height:.84375%" data-text="IT MADE SENSE TO UTILIZE EVERYTHING AT OUR DISPOSAL." onclick="showTextTooltip(event,this)" data-translation="FAZIA SENTIDO UTILIZAR TUDO QUE TÍNHAMOS À NOSSA DISPOSIÇÃO."></div><div class="text-hotspot" style="left:24.125%;top:98.484375%;width:37.25%;height:.4427083333333333%" data-text="A MOMENT LATER, PARTEIAN WOKE UP." onclick="showTextTooltip(event,this)" data-translation="UM MOMENTO DEPOIS, PARTEIAN ACORDOU."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/124/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:28.000000000000004%;top:6.109375%;width:24.75%;height:.6875%" data-text="NOARK... AND EVIL SPIRIT...?" onclick="showTextTooltip(event,this)" data-translation="NOARK... E ESPÍRITO MALIGNO...?"></div><div class="text-hotspot" style="left:39.625%;top:10.6875%;width:20.625%;height:.6979166666666666%" data-text="YOU'RE FINALLY AWAKE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ FINALMENTE ACORDOU."></div><div class="text-hotspot" style="left:14.374999999999998%;top:16.708333333333332%;width:34.5%;height:.9635416666666667%" data-text="I MUST EXPRESS MY GRATITUDE FIRST." onclick="showTextTooltip(event,this)" data-translation="DEVO EXPRESSAR MINHA GRATIDÃO PRIMEIRO."></div><div class="text-hotspot" style="left:27.250000000000004%;top:18.192708333333332%;width:45.375%;height:1.2083333333333333%" data-text="THINGS WOULD HAVE GOTTEN TRAGIC HAD IT NOT BEEN FOR YOU." onclick="showTextTooltip(event,this)" data-translation="AS COISAS TERIAM FICADO TRÁGICAS SE NÃO FOSSE POR VOCÊ."></div><div class="text-hotspot" style="left:46.125%;top:21.177083333333332%;width:42.125%;height:.9635416666666667%" data-text="GO AND HELP MY TEAM'S MAGE IF YOU MEAN IT." onclick="showTextTooltip(event,this)" data-translation="VÁ E AJUDE O MAGO DO MEU TIME SE VOCÊ ESTÁ FALANDO SÉRIO."></div><div class="text-hotspot" style="left:72.625%;top:22.630208333333332%;width:18.5%;height:.4583333333333333%" data-text="WE HAVE NO TIME TO WASTE." onclick="showTextTooltip(event,this)" data-translation="NÃO TEMOS TEMPO A PERDER."></div><div class="text-hotspot" style="left:15.875%;top:24.057291666666668%;width:31.624999999999996%;height:.17708333333333331%" data-text="OF COURSE." onclick="showTextTooltip(event,this)" data-translation="CLARO."></div><div class="text-hotspot" style="left:32.75%;top:35.55729166666667%;width:34.375%;height:.828125%" data-text="...SPECIAL APPRAISAL SPELL?" onclick="showTextTooltip(event,this)" data-translation="...FEITIÇO DE AVALIAÇÃO ESPECIAL?"></div><div class="text-hotspot" style="left:50%;top:39.635416666666664%;width:41.875%;height:.6927083333333334%" data-text="YOU'RE FROM NARMANC SCHOOL?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ É DA ESCOLA NARMANC?"></div><div class="text-hotspot" style="left:14.124999999999998%;top:41.932291666666664%;width:42.625%;height:1.21875%" data-text="I GUESS WE HAVEN'T EVEN PROPERLY INTRODUCED OURSELVES." onclick="showTextTooltip(event,this)" data-translation="ACHO QUE NEM NOS APRESENTAMOS ADEQUADAMENTE."></div><div class="text-hotspot" style="left:37.75%;top:43.640625%;width:28.499999999999996%;height:.3020833333333333%" data-text="YOU'RE FROM ALTEMION, RIGHT?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ É DE ALTEMION, CERTO?"></div><div class="text-hotspot" style="left:51%;top:49.84895833333333%;width:25.75%;height:.3020833333333333%" data-text="HOW DO I LOOK, MISSHA?" onclick="showTextTooltip(event,this)" data-translation="COMO EU ESTOU, MISSHA?"></div><div class="text-hotspot" style="left:39%;top:50.828125%;width:17.125%;height:.4635416666666667%" data-text="THEY'RE DEFINITELY YOURRRS!" onclick="showTextTooltip(event,this)" data-translation="SÃO DEFINITIVAMENTE SUAS!"></div><div class="text-hotspot" style="left:20.875%;top:54.52083333333333%;width:36.375%;height:.6770833333333334%" data-text="THANKS TO HIM, WE IDENTIFIED THE NUMBERED ITEM," onclick="showTextTooltip(event,this)" data-translation="GRAÇAS A ELE, IDENTIFICAMOS O ITEM NUMERADO,"></div><div class="text-hotspot" style="left:32%;top:56.34895833333333%;width:55.375%;height:.6979166666666666%" data-text="AS WELL AS OTHERS THAT EVEN RAVEN WASN'T ABLE TO CLASSIFY." onclick="showTextTooltip(event,this)" data-translation="ASSIM COMO OUTROS QUE NEM MESMO RAVEN CONSEGUIU CLASSIFICAR."></div><div class="text-hotspot" style="left:20.125%;top:61.29687499999999%;width:59.625%;height:.7656250000000142%" data-text="AFTER TAKING A LOOK AT THE LIST OF LOOT WE GOT, I CONCLUDED THIS." onclick="showTextTooltip(event,this)" data-translation="DEPOIS DE DAR UMA OLHADA NA LISTA DE SAQUES QUE CONSEGUIMOS, CONCLUÍ ISSO."></div><div class="text-hotspot" style="left:57.49999999999999%;top:66.72395833333333%;width:27.750000000000004%;height:.625%" data-text="522451 STEPS" onclick="showTextTooltip(event,this)" data-translation="522451 PASSOS"></div><div class="text-hotspot" style="left:13%;top:68.53125%;width:2.375%;height:.24479166666666669%" data-text="OO" onclick="showTextTooltip(event,this)" data-translation="OO"></div><div class="text-hotspot" style="left:27.125%;top:71.99479166666667%;width:45.375%;height:.6354166666666666%" data-text="WE CAN DEFEAT THE GUARDIAN." onclick="showTextTooltip(event,this)" data-translation="PODEMOS DERROTAR O GUARDIÃO."></div><div class="text-hotspot" style="left:26.875%;top:77.25520833333334%;width:46.125%;height:1.3385416666666667%" data-text="I ONLY GAVE THE MAGES A SMALL HINT, BUT THEY WERE ABLE TO REACH THE SAME CONCLUSION." onclick="showTextTooltip(event,this)" data-translation="EU SÓ DEI UMA PEQUENA DICA AOS MAGOS, MAS ELES CONSEGUIRAM CHEGAR À MESMA CONCLUSÃO."></div><div class="text-hotspot" style="left:9.375%;top:79.53645833333334%;width:29.75%;height:.7395833333333334%" data-text="GRIN" onclick="showTextTooltip(event,this)" data-translation="SORRISO"></div><div class="text-hotspot" style="left:70%;top:82.58854166666667%;width:7.75%;height:.4635416666666667%" data-text="ININ" onclick="showTextTooltip(event,this)" data-translation="ININ"></div><div class="text-hotspot" style="left:29.5%;top:84.734375%;width:40.625%;height:.8333333333333286%" data-text="LET'S DO AS YOU SAY, THEN." onclick="showTextTooltip(event,this)" data-translation="VAMOS FAZER COMO VOCÊ DISSE, ENTÃO."></div><div class="text-hotspot" style="left:13%;top:89.99479166666666%;width:61.5%;height:1.2135416666666665%" data-text="I ABUSED THE LEADER'S AUTHORITY AND DISTRIBUTED LOOT. EVERYONE GOT AT LEAST ONE, WITH A FEW OTHERS TAKING UP TO FIVE." onclick="showTextTooltip(event,this)" data-translation="ABUSEI DA AUTORIDADE DE LÍDER E DISTRIBUÍ OS ITENS. TODOS RECEBERAM PELO MENOS UM, COM ALGUNS OUTROS PEGANDO ATÉ CINCO."></div><div class="text-hotspot" style="left:26.125%;top:92.60416666666667%;width:32.125%;height:.30729166666666663%" data-text="TAKE THAT OFF AND GIVE IT TO MISSHA." onclick="showTextTooltip(event,this)" data-translation="TIRE ISSO E DÊ PARA A MISSHA."></div><div class="text-hotspot" style="left:58.875%;top:92.984375%;width:11.875%;height:.5625%" data-text="!!!" onclick="showTextTooltip(event,this)" data-translation="!!!"></div><div class="text-hotspot" style="left:71.25%;top:93.02604166666667%;width:15.25%;height:.5572916666666667%" data-text="ми" onclick="showTextTooltip(event,this)" data-translation="ми"></div><div class="text-hotspot" style="left:43.375%;top:96.44270833333334%;width:47%;height:.6874999999999858%" data-text="OF COURSE, I DID IT BASED ON ITEM EFFICIENCY." onclick="showTextTooltip(event,this)" data-translation="CLARO, FIZ ISSO COM BASE NA EFICIÊNCIA DOS ITENS."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/124/11.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:26.375%;top:2.359600117612467%;width:38.75%;height:1.345192590414584%" data-text="AND WE KEPT THE REST IN MY AND RAVEN'S MAGICAL INVENTORIES." onclick="showTextTooltip(event,this)" data-translation="E GUARDAMOS O RESTO NOS INVENTÁRIOS MÁGICOS MEU E DA RAVEN."></div><div class="text-hotspot" style="left:42.5%;top:18.67097912378712%;width:27.875%;height:.9703028521023229%" data-text="WE COULDN'T PUT ALL OF THEM ON." onclick="showTextTooltip(event,this)" data-translation="NÃO PODÍAMOS COLOCAR TODOS ELES."></div><div class="text-hotspot" style="left:2.875%;top:24.98529844163481%;width:55.125%;height:.9850044104675095%" data-text="HAHAHAHAM" onclick="showTextTooltip(event,this)" data-translation="HAHAHAHAM"></div><div class="text-hotspot" style="left:23.125%;top:26.51426051161423%;width:54.25%;height:2.2934431049691266%" data-text="IS THIS A REWARD FOR THOSE WHO OVERCOME AN APOCALYPTIC CATASTROPHE CALLED HANS?" onclick="showTextTooltip(event,this)" data-translation="ISSO É UMA RECOMPENSA PARA AQUELES QUE SUPERAM UMA CATÁSTROFE APOCALÍPTICA CHAMADA HANS?"></div><div class="text-hotspot" style="left:25.25%;top:34.188473978241696%;width:56.75%;height:.911496618641576%" data-text="YOU HAVE EQUIPPED NO. 2988 TOKEN OF THE SENTINEL." onclick="showTextTooltip(event,this)" data-translation="VOCÊ EQUIPOU O N.º 2988 TOKEN DO SENTINELA."></div><div class="text-hotspot" style="left:19.25%;top:36.812702146427526%;width:50.375%;height:.5733607762422817%" data-text="YOUR ITEM LEVEL INCREASED BY 1,485." onclick="showTextTooltip(event,this)" data-translation="SEU NÍVEL DE ITEM AUMENTOU EM 1.485."></div><div class="text-hotspot" style="left:7.75%;top:62.98882681564246%;width:72.625%;height:.5954131137900618%" data-text="YOU HAVE EQUIPPED NO. 8677 BADLAND CUTTHROAT." onclick="showTextTooltip(event,this)" data-translation="VOCÊ EQUIPOU O N.º 8677 CUTTHROAT DAS TERRAS ÁRIDAS."></div><div class="text-hotspot" style=
