dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/131/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:16.875%;top:3.4479166666666665%;width:67.125%;height:1.2760416666666665%" data-text="I HOPE THE NEXT MEETING IS EVEN MORE ENTERTAINING." onclick="showTextTooltip(event,this)" data-translation="ESPERO QUE A PRÓXIMA REUNIÃO SEJA AINDA MAIS DIVERTIDA."></div><div class="text-hotspot" style="left:44.375%;top:18.526041666666668%;width:38.875%;height:.4427083333333333%" data-text="DESPITE MY ENCOURAGEMENT..." onclick="showTextTooltip(event,this)" data-translation="APESAR DO MEU INCENTIVO..."></div><div class="text-hotspot" style="left:23.625%;top:22.901041666666664%;width:52.75%;height:.578125%" data-text="...THERE WASN'T ANYTHING SPECIAL..." onclick="showTextTooltip(event,this)" data-translation="...NÃO HOUVE NADA DE ESPECIAL..."></div><div class="text-hotspot" style="left:15.875%;top:47.35416666666667%;width:67.75%;height:.734375%" data-text="...UNTIL ALL THREE ROUNDS WERE OVER." onclick="showTextTooltip(event,this)" data-translation="...ATÉ QUE AS TRÊS RODADAS TERMINARAM."></div><div class="text-hotspot" style="left:5.125%;top:50.932291666666664%;width:22.125%;height:.30729166666666663%" data-text="ON THE BRIGHT SIDE..." onclick="showTextTooltip(event,this)" data-translation="POR OUTRO LADO..."></div><div class="text-hotspot" style="left:18.875%;top:52.1875%;width:44.125%;height:1.21875%" data-text="I WAS ABLE TO INFER THAT THE ROYAL COURT IS IN A MUCH BETTER SITUATION THAN NOARK." onclick="showTextTooltip(event,this)" data-translation="CONSEGUI INFERIR QUE A CORTE REAL ESTÁ EM UMA SITUAÇÃO MUITO MELHOR QUE NOARK."></div><div class="text-hotspot" style="left:22.5%;top:61.869791666666664%;width:54.75%;height:.703125%" data-text="NOARK SEALING THEIR CITY WAS SOME SORT OF A LAST STRUGGLE, IT SEEMED." onclick="showTextTooltip(event,this)" data-translation="NOARK SELAR A CIDADE PARECIA SER ALGUM TIPO DE ÚLTIMO ESFORÇO."></div><div class="text-hotspot" style="left:14.124999999999998%;top:68.86979166666667%;width:23.75%;height:.6302083333333333%" data-text="TSK" onclick="showTextTooltip(event,this)" data-translation="TSK"></div><div class="text-hotspot" style="left:40.75%;top:71.06770833333333%;width:36.5%;height:.6875%" data-text="I SUPPOSE RUMORS ARE JUST RUMORS." onclick="showTextTooltip(event,this)" data-translation="SUPOSTAMENTE, RUMORES SÃO APENAS RUMORES."></div><div class="text-hotspot" style="left:33%;top:75.33333333333333%;width:48.25%;height:1.4270833333333333%" data-text="DRAG" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21%;top:80.390625%;width:58.375%;height:1.2760416666666667%" data-text="IT LOOKS LIKE I'VE HEARD EVERYTHING TODAY." onclick="showTextTooltip(event,this)" data-translation="PARECE QUE OUVI TUDO HOJE."></div><div class="text-hotspot" style="left:15.75%;top:95.734375%;width:34%;height:1.1302083333333335%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:48%;top:99.234375%;width:24.75%;height:.7604166666666667%" data-text="STE ever" onclick="showTextTooltip(event,this)" data-translation="STE ever"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/131/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:47.25%;top:0;width:25.25%;height:.390625%" data-text="STE ever" onclick="showTextTooltip(event,this)" data-translation="STE ever"></div><div class="text-hotspot" style="left:4.125%;top:3.989583333333333%;width:92%;height:5.260416666666667%" data-text="SLAM SURVIVING THE GAME AS A BARBARIAN ART | MIDNIGHT STUDIO ADAPTATION | TEAM THE JICK ORIGINAL STORY | Jung Yoon-kang" onclick="showTextTooltip(event,this)" data-translation="SLAM SOBREVIVENDO AO JOGO COMO UM BÁRBARO ARTE | ADAPTAÇÃO MIDNIGHT STUDIO | EQUIPE THE JICK HISTÓRIA ORIGINAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:45.5%;top:9.848958333333334%;width:8.5%;height:.1875%" data-text="131" onclick="showTextTooltip(event,this)" data-translation="131"></div><div class="text-hotspot" style="left:41.625%;top:10.3125%;width:16.875%;height:.17708333333333331%" data-text="AGAIN" onclick="showTextTooltip(event,this)" data-translation="DE NOVO"></div><div class="text-hotspot" style="left:10.375%;top:17.713541666666664%;width:46.75%;height:1.3125%" data-text="DROOP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:65%;top:29.463541666666664%;width:29.375%;height:.7708333333333334%" data-text="SIGH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.375%;top:35.213541666666664%;width:31.875%;height:.9479166666666643%" data-text="...DO YOU THINK HE'S UPSET WITH US?" onclick="showTextTooltip(event,this)" data-translation="...VOCÊ ACHA QUE ELE ESTÁ CHATEADO CONOSCO?"></div><div class="text-hotspot" style="left:21.625%;top:38.40625%;width:20.125%;height:.5260416666666666%" data-text="GLANCE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.374999999999998%;top:41.28125%;width:50.125%;height:1.9895833333333335%" data-text="CHICKNE YOU OVERESTIMATE US, MS. FOX." onclick="showTextTooltip(event,this)" data-translation="CHICKNE VOCÊ NOS SUPERESTIMA, SRTA. FOX."></div><div class="text-hotspot" style="left:35.375%;top:44.296875%;width:52.625%;height:.9583333333333333%" data-text="DO YOU HONESTLY BELIEVE WE'RE EVEN WORTH HIS ANGER?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ REALMENTE ACREDITA QUE SOMOS DIGNOS DA RAIVA DELE?"></div><div class="text-hotspot" style="left:1.125%;top:46.302083333333336%;width:27.375%;height:.6666666666666667%" data-text="SWEAT" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17%;top:47.39583333333333%;width:26.625%;height:.15625%" data-text="W-WELL..." onclick="showTextTooltip(event,this)" data-translation="B-BEM..."></div><div class="text-hotspot" style="left:21.75%;top:52.536458333333336%;width:58.125%;height:1.46875%" data-text="I KNOW I WAS THE ONE WHO INVITED YOU HERE, BUT YOU WOULD GET NOTHING OUT OF THIS MEETING." onclick="showTextTooltip(event,this)" data-translation="EU SEI QUE FUI EU QUEM TE CONVIDOU AQUI, MAS VOCÊ NÃO TIRARIA NADA DESSA REUNIÃO."></div><div class="text-hotspot" style="left:39.625%;top:62.427083333333336%;width:33.125%;height:.9531250000000071%" data-text="TO BE FAIR, IF MASTER SAID SOMETHING LIKE THAT..." onclick="showTextTooltip(event,this)" data-translation="PARA SER JUSTO, SE O MESTRE DISSE ALGO ASSIM..."></div><div class="text-hotspot" style="left:13.875000000000002%;top:68.55208333333334%;width:51.74999999999999%;height:1.21875%" data-text="MR. LION IS PROBABLY SOMEONE WHOSE NAME WE'VE HEARD AT LEAST ONCE." onclick="showTextTooltip(event,this)" data-translation="O SR. LEÃO PROVAVELMENTE É ALGUÉM CUJO NOME JÁ OUVIMOS PELO MENOS UMA VEZ."></div><div class="text-hotspot" style="left:27.375%;top:70.77604166666667%;width:59.875%;height:.9479166666666667%" data-text="IF MASTER THINKS THAT HIGHLY OF HIM, HE MUST BE A REALLY IMPORTANT PERSON." onclick="showTextTooltip(event,this)" data-translation="SE O MESTRE PENSA TÃO BEM DELE, ELE DEVE SER UMA PESSOA REALMENTE IMPORTANTE."></div><div class="text-hotspot" style="left:35.25%;top:81.58854166666667%;width:15.375%;height:.421875%" data-text="NOD" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24.375%;top:82.265625%;width:52.125%;height:1.4947916666666714%" data-text="I AGREE. I MEAN, MASTER EVEN TREATED THE INFAMOUS CORPSE COLLECTOR AS A KID." onclick="showTextTooltip(event,this)" data-translation="EU CONCORDO. QUERO DIZER, O MESTRE ATÉ TRATOU O INFAME COLETOR DE CADÁVERES COMO UMA CRIANÇA."></div><div class="text-hotspot" style="left:24.625%;top:88.77083333333333%;width:46.25%;height:1.2031250000000142%" data-text="A KID... RIGHT. HE DID SAY SOMETHING LIKE THAT ABOUT HIM." onclick="showTextTooltip(event,this)" data-translation="UMA CRIANÇA... CERTO. ELE DISSE ALGO ASSIM SOBRE ELE."></div><div class="text-hotspot" style="left:30.75%;top:92.75520833333334%;width:23.875%;height:.5260416666666666%" data-text="GIGGLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.75%;top:96.84375%;width:45.625%;height:1.2135416666666665%" data-text="BUT CAN YOU BELIEVE THAT THIS COMMUNITY WASN'T CREATED BY A GM?" onclick="showTextTooltip(event,this)" data-translation="MAS VOCÊ PODE ACREDITAR QUE ESTA COMUNIDADE NÃO FOI CRIADA POR UM GM?"></div><div class="text-hotspot" style="left:47.25%;top:98.83854166666667%;width:35.625%;height:.6927083333333334%" data-text="HOW DOES ANYONE EVEN KNOW THAT?" onclick="showTextTooltip(event,this)" data-translation="COMO ALGUÉM SABE DISSO?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/131/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:13.750000000000002%;top:3.661458333333333%;width:46.5%;height:.9739583333333333%" data-text="NOT SURE, BUT MAYBE HE IS ACQUAINTANCES WITH THE GM." onclick="showTextTooltip(event,this)" data-translation="NÃO TENHO CERTEZA, MAS TALVEZ ELE SEJA CONHECIDO DO GM."></div><div class="text-hotspot" style="left:91.75%;top:5.119791666666667%;width:6.5%;height:.2916666666666667%" data-text="18" onclick="showTextTooltip(event,this)" data-translation="18"></div><div class="text-hotspot" style="left:48.375%;top:13.020833333333334%;width:34%;height:1.2135416666666665%" data-text="...BUT I THOUGHT NOBODY HAD ACTUALLY MET HIM." onclick="showTextTooltip(event,this)" data-translation="...MAS EU PENSEI QUE NINGUÉM TINHA REALMENTE O CONHECIDO."></div><div class="text-hotspot" style="left:26%;top:18.203125%;width:39.75%;height:.9739583333333357%" data-text="IF HE CAN ADDRESS MASTER AS AN OLD MAN," onclick="showTextTooltip(event,this)" data-translation="SE ELE PODE CHAMAR O MESTRE DE VELHO,"></div><div class="text-hotspot" style="left:42.25%;top:19.901041666666668%;width:45.75%;height:1.1979166666666667%" data-text="IT'S SAFE TO ASSUME THAT HE KNOWS A LOT MORE THAN WE DO." onclick="showTextTooltip(event,this)" data-translation="É SEGURO ASSUMIR QUE ELE SABE MUITO MAIS DO QUE NÓS."></div><div class="text-hotspot" style="left:16.5%;top:26.713541666666668%;width:20.625%;height:.171875%" data-text="I SEE..." onclick="showTextTooltip(event,this)" data-translation="ENTENDO..."></div><div class="text-hotspot" style="left:20.625%;top:30.562499999999996%;width:65.375%;height:2.3333333333333393%" data-text="OH? IT'S FUNNY HOW YOU ARE JUST ACCEPTING IT AS AN ESTABLISHED FACT, WHEN YOU WERE SO SKEPTICAL JUST LAST TIME." onclick="showTextTooltip(event,this)" data-translation="OH? É ENGRAÇADO COMO VOCÊ ESTÁ ACEITANDO ISSO COMO UM FATO ESTABELECIDO, QUANDO VOCÊ ERA TÃO CÉTICO DA ÚLTIMA VEZ."></div><div class="text-hotspot" style="left:67.75%;top:36.5625%;width:32.125%;height:.8125%" data-text="GLANCE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:94.125%;top:41.38541666666667%;width:4.875%;height:.17708333333333331%" data-text="8A" onclick="showTextTooltip(event,this)" data-translation="8A"></div><div class="text-hotspot" style="left:34.375%;top:42.09375%;width:46%;height:1.21875%" data-text="TH-THAT'S BECAUSE I DIDN'T KNOW MUCH ABOUT HIM BEFORE." onclick="showTextTooltip(event,this)" data-translation="I-ISSO É PORQUE EU NÃO SABIA MUITO SOBRE ELE ANTES."></div><div class="text-hotspot" style="left:8.375%;top:44.354166666666664%;width:57.125%;height:1.7604166666666714%" data-text="GIGGLE I GUESS YOUR EYES ARE NOT AS DULL AS THEY LOOKED." onclick="showTextTooltip(event,this)" data-translation="RISADA EU ACHO QUE SEUS OLHOS NÃO SÃO TÃO APAGADOS COMO PARECIAM."></div><div class="text-hotspot" style="left:27.500000000000004%;top:53.37499999999999%;width:46.375%;height:.78125%" data-text="AM I THE ONLY ONE WHO FELT THAT, THOUGH?" onclick="showTextTooltip(event,this)" data-translation="SOU O ÚNICO QUE SENTIU ISSO, ENTÃO?"></div><div class="text-hotspot" style="left:28.125%;top:59.88020833333333%;width:18.25%;height:.421875%" data-text="FELT WHAT?" onclick="showTextTooltip(event,this)" data-translation="SENTIU O QUÊ?"></div><div class="text-hotspot" style="left:53.625%;top:61.79687499999999%;width:22.125%;height:.4427083333333333%" data-text="PLEASE EXPLAIN." onclick="showTextTooltip(event,this)" data-translation="POR FAVOR, EXPLIQUE."></div><div class="text-hotspot" style="left:19.875%;top:66.51041666666667%;width:67.25%;height:1.2135416666666572%" data-text="I FELT SOME SORT OF TELEPATHIC ENERGY AT WORK WHEN MASTER APPROACHED HIM." onclick="showTextTooltip(event,this)" data-translation="EU SENTI ALGUM TIPO DE ENERGIA TELEPÁTICA EM AÇÃO QUANDO O MESTRE SE APROXIMOU DELE."></div><div class="text-hotspot" style="left:.25%;top:68.55729166666666%;width:99.625%;height:3.9635416666666665%" data-text="Ex" onclick="showTextTooltip(event,this)" data-translation="Ex"></div><div class="text-hotspot" style="left:17.125%;top:73.15625%;width:36.75%;height:.4479166666666667%" data-text="OH, I SENSED IT AS WELL." onclick="showTextTooltip(event,this)" data-translation="OH, EU TAMBÉM SENTI ISSO."></div><div class="text-hotspot" style="left:14.499999999999998%;top:78.69270833333334%;width:71.375%;height:1.140625%" data-text="I'M ASSUMING THAT MASTER AND MR. LION EXCHANGED DIRECT MESSAGES." onclick="showTextTooltip(event,this)" data-translation="ESTOU ASSUMINDO QUE O MESTRE E O SR. LEÃO TROCAM MENSAGENS DIRETAS."></div><div class="text-hotspot" style="left:23.875%;top:90.03125%;width:54%;height:1.140625%" data-text="SO YOU ALSO... BECAUSE THAT'S WHAT I WAS THINKING." onclick="showTextTooltip(event,this)" data-translation="ENTÃO VOCÊ TAMBÉM... PORQUE ERA ISSO QUE EU ESTAVA PENSANDO."></div><div class="text-hotspot" style="left:55.75%;top:94.80729166666667%;width:32.25%;height:.9635416666666667%" data-text="My" onclick="showTextTooltip(event,this)" data-translation="My"></div><div class="text-hotspot" style="left:30.75%;top:96.40104166666667%;width:38.5%;height:.6041666666666666%" data-text="H-HOLD ON A SECOND." onclick="showTextTooltip(event,this)" data-translation="E-ESPERA UM SEGUNDO."></div><div class="text-hotspot" style="left:13%;top:97.94270833333333%;width:46.375%;height:.578125%" data-text="DIRECT MESSAGE?!" onclick="showTextTooltip(event,this)" data-translation="MENSAGEM DIRETA?!"></div><div class="text-hotspot" style="left:14.625%;top:99.67708333333334%;width:20.375%;height:.3177083333333333%" data-text="ANAS" onclick="showTextTooltip(event,this)" data-translation="ANAS"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/131/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:19.125%;top:5.255208333333333%;width:39.25%;height:.9375%" data-text="EVEN MASTER SAID HE HAS A DIFFICULT TIME USING THAT!" onclick="showTextTooltip(event,this)" data-translation="ATÉ O MESTRE DISSE QUE TEM DIFICULDADE EM USAR ISSO!"></div><div class="text-hotspot" style="left:22.375%;top:12.171875%;width:55.625%;height:1.21875%" data-text="ANYHOW, MASTER AND MR. LION SPOKE IN SECRET ABOUT SOMETHING BEFORE MASTER LEFT." onclick="showTextTooltip(event,this)" data-translation="DE QUALQUER FORMA, O MESTRE E O SR. LEÃO FALARAM EM SEGREDO SOBRE ALGO ANTES DO MESTRE SAIR."></div><div class="text-hotspot" style="left:18.125%;top:24.546875%;width:38.875%;height:.9479166666666667%" data-text="AND YOU HAVE NO IDEA WHAT THAT WAS ABOUT?" onclick="showTextTooltip(event,this)" data-translation="E VOCÊ NÃO FAZ IDEIA DO QUE ERA?"></div><div class="text-hotspot" style="left:46.25%;top:27.895833333333332%;width:41.875%;height:.6875%" data-text="OF COURSE I DON'T. ISN'T THAT OBVIOUS?" onclick="showTextTooltip(event,this)" data-translation="CLARO QUE NÃO. NÃO É ÓBVIO?"></div><div class="text-hotspo E BY THAT USERNAME IN." onclick="showTextTooltip(event,this)" data-translation="MINHAS SUSPEITAS COMEÇARAM QUANDO TODOS OS GUIAS ME DISSERAM QUE NUNCA DEIXARAM ALGUÉM COM ESSE NOME DE USUÁRIO ENTRAR."></div><div class="text-hotspot" style="left:9%;top:17.505208333333332%;width:57.62500000000001%;height:1.2083333333333333%" data-text="I VISITED HIS MENTAL REALM SOME TIME LATER, BUT COULDN'T GET A GOOD LOOK DUE TO HIS STRONG WILLPOWER..." onclick="showTextTooltip(event,this)" data-translation="VISITEI O REINO MENTAL DELE ALGUM TEMPO DEPOIS, MAS NÃO CONSEGUI TER UMA BOA VISÃO DEVIDO À SUA FORTE FORÇA DE VONTADE..."></div><div class="text-hotspot" style="left:24.5%;top:25.588541666666664%;width:50.74999999999999%;height:.9427083333333334%" data-text="I BANNED HIM BECAUSE I SAW THAT HE WAS WEARING THE OUTFIT OF THIS WORLD." onclick="showTextTooltip(event,this)" data-translation="EU O BANÍ PORQUE VI QUE ELE ESTAVA VESTINDO A ROUPA DESTE MUNDO."></div><div class="text-hotspot" style="left:60.25%;top:27.78125%;width:32.125%;height:.4583333333333333%" data-text="I SUSPECTED HIM AS A SPY FROM THE ROYAL COURT." onclick="showTextTooltip(event,this)" data-translation="SUSPEITEI QUE ELE FOSSE UM ESPIÃO DA CORTE REAL."></div><div class="text-hotspot" style="left:23.875%;top:32.645833333333336%;width:51.25%;height:1.203124999999993%" data-text="THE CHAT HE VISITED OPENED AT AROUND THREE, IF I REMEMBER CORRECTLY." onclick="showTextTooltip(event,this)" data-translation="O CHAT QUE ELE VISITOU ABRIU POR VOLTA DAS TRÊS, SE NÃO ME ENGANO."></div><div class="text-hotspot" style="left:21.875%;top:40.640625%;width:55.625%;height:1.2083333333333333%" data-text="MAYBE HE TRIED TO ACCESS THAT CHAT AGAIN. THERE COULD BE SOMETHING WITH THAT CHAT..." onclick="showTextTooltip(event,this)" data-translation="TALVEZ ELE TENHA TENTADO ACESSAR ESSE CHAT NOVAMENTE. PODE HAVER ALGO NESSE CHAT..."></div><div class="text-hotspot" style="left:25.874999999999996%;top:45.80208333333333%;width:63%;height:1.4739583333333357%" data-text="BUT HAVEN'T YOU ALREADY CONCLUDED THAT THERE'S NOTHING UNUSUAL WITH THAT CHAT?" onclick="showTextTooltip(event,this)" data-translation="MAS VOCÊ JÁ NÃO CONCLUIU QUE NÃO HÁ NADA DE INCOMUM NESSE CHAT?"></div><div class="text-hotspot" style="left:33.625%;top:53.494791666666664%;width:55.50000000000001%;height:1.2395833333333333%" data-text="I HAVE, BUT I ONLY INSPECTED IT FROM THE OUTSIDE BECAUSE IT IS PRIVATE." onclick="showTextTooltip(event,this)" data-translation="SIM, MAS SÓ O INSPECIONEI POR FORA PORQUE É PRIVADO."></div><div class="text-hotspot" style="left:17.875%;top:55.838541666666664%;width:20.5%;height:.16666666666666669%" data-text="I SEE..." onclick="showTextTooltip(event,this)" data-translation="ENTENDO..."></div><div class="text-hotspot" style="left:18.625%;top:60.9375%;width:62.5%;height:1.4635416666666714%" data-text="THERE'S A CHANCE THAT CHAT IS THEIR SECRET MEETING PLACE THEY CREATED AWAY FROM OUR EYES." onclick="showTextTooltip(event,this)" data-translation="HÁ UMA CHANCE DE QUE ESSE CHAT SEJA O LUGAR SECRETO DE ENCONTRO DELES, CRIADO LONGE DOS NOSSOS OLHOS."></div><div class="text-hotspot" style="left:50.875%;top:66.86979166666667%;width:31.25%;height:1.2083333333333333%" data-text="WOULD YOU BE ABLE TO ENTER THE CHAT IN MY STEAD..." onclick="showTextTooltip(event,this)" data-translation="VOCÊ PODERIA ENTRAR NO CHAT NO MEU LUGAR..."></div><div class="text-hotspot" style="left:23%;top:70.640625%;width:32.25%;height:.6875%" data-text="AND SEE WHAT'S GOING ON?" onclick="showTextTooltip(event,this)" data-translation="E VER O QUE ESTÁ ACONTECENDO?"></div><div class="text-hotspot" style="left:21.375%;top:76.51041666666667%;width:49.875%;height:1.4791666666666667%" data-text="I DON'T MIND DOING THAT... BUT I THOUGHT EVEN YOU COULDN'T DO ANYTHING ABOUT PRIVATE CHATS." onclick="showTextTooltip(event,this)" data-translation="NÃO ME IMPORTO DE FAZER ISSO... MAS PENSEI QUE NEM VOCÊ PODIA FAZER ALGO SOBRE CHATS PRIVADOS."></div><di
