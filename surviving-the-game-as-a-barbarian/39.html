M CLÃ." data-tips="💡 'Later on' é uma expressão que significa 'mais tarde'. É frequentemente usada para indicar que algo acontecerá após algum tempo."></div><div class="text-hotspot" style="left:16.625%;top:8.333333333333332%;width:67%;height:1.489583333333334%" data-text="OF COURSE, THIS ACT COSTS A LOT OF MONEY AS WELL AS MANPOWER, SO IT'S ABSOLUTELY POINTLESS TO SET ONE UP IN AREAS WITHOUT RARE OR ELITE BOSS MONSTERS." onclick="showTextTooltip(event,this)" data-translation="É CLARO, ESTE ATO CUSTA MUITO DINHEIRO, ASSIM COMO MÃO DE OBRA, ENTÃO É TOTALMENTE INÚTIL ESTABELECER UM EM ÁREAS SEM MONSTROS CHEFES RAROS OU ELITE." data-tips="💡 'As well as' é usado para adicionar informação, similar a 'e também'. É uma maneira de listar múltiplos elementos."></div><div class="text-hotspot" style="left:60.25%;top:14.15625%;width:22.875%;height:.4427083333333333%" data-text="CLAN... DZARWI?" onclick="showTextTooltip(event,this)" data-translation="CLÃ... DZARWI?"></div><div class="text-hotspot" style="left:16.25%;top:19.104166666666668%;width:83.625%;height:2.84375%" data-text="3 BUT THEY HAVE ESTABLISHED A ZONE OF RESTRICTED ACCESS ON THE THIRD FLOOR. THAT MAKES NO SENSE." onclick="showTextTooltip(event,this)" data-translation="3 MAS ELES ESTABELECERAM UMA ZONA DE ACESSO RESTRITO NO TERCEIRO ANDAR. ISSO NÃO FAZ SENTIDO." data-tips="💡 'That makes no sense' é uma expressão que significa 'isso não faz sentido'. É usada para indicar que algo é ilógico ou confuso."></div><div class="text-hotspot" style="left:16.25%;top:25.927083333333336%;width:71.75%;height:2.7604166666666643%" data-text="I THOUGHT DZARWI WAS A CLAN THAT WAS ACTIVE ON SIXTH FLOOR OR ABOVE. MAY I ASK WHY YOU WOULD RESTRICT ACCESS IN AN ORC COLONY?" onclick="showTextTooltip(event,this)" data-translation="EU PENSEI QUE DZARWI ERA UM CLÃ ATIVO NO SEXTO ANDAR OU ACIMA. POSSO PERGUNTAR POR QUE VOCÊ RESTRINGIRIA O ACESSO EM UMA COLÔNIA DE ORCS?" data-tips="💡 A estrutura 'May I ask why...' é uma forma educada de fazer uma pergunta, geralmente usada em contextos formais."></div><div class="text-hotspot" style="left:37.25%;top:39.28125%;width:51.625%;height:.6979166666666666%" data-text="I AM NOT OBLIGATED TO TELL YOU ANYTHING." onclick="showTextTooltip(event,this)" data-translation="NÃO SOU OBRIGADO A TE DIZER NADA." data-tips="💡 'Obligated' significa 'obrigado' no sentido de ter uma obrigação. É um falso cognato, pois não significa 'obrigado' como em 'thank you'."></div><div class="text-hotspot" style="left:10.25%;top:51.05208333333333%;width:76.375%;height:1.7343750000000002%" data-text="... I DID HEAR THAT A FEW CLANS HAVE BEEN OFFICIALLY RECOGNIZED BY THE COURT, AND THUS WERE GIVEN EXCLUSIVE RIGHTS TO EXPLORE CERTAIN AREAS WITHIN THE LABYRINTH." onclick="showTextTooltip(event,this)" data-translation="... EU OUVI QUE ALGUNS CLÃS FORAM OFICIALMENTE RECONHECIDOS PELO TRIBUNAL, E ASSIM FORAM DADOS DIREITOS EXCLUSIVOS PARA EXPLORAR CERTAS ÁREAS DENTRO DO LABIRINTO." data-tips="💡 'Thus' é um conector formal que significa 'assim' ou 'portanto'. É usado para indicar uma consequência lógica."></div><div class="text-hotspot" style="left:35.75%;top:53.442708333333336%;width:50.375%;height:1.4739583333333286%" data-text="HOWEVER, I HAVE NOT HEARD ANY NEWS ABOUT THE ORC COLONY BEING ONE SUCH AREA." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, NÃO OUVI NENHUMA NOTÍCIA SOBRE A COLÔNIA DE ORCS SER UMA DESSAS ÁREAS."></div><div class="text-hotspot" style="left:53.87499999999999%;top:55.8125%;width:41.375%;height:1.0572916666666665%" data-text="LOOM" onclick="showTextTooltip(event,this)" data-translation="LOOM"></div><div class="text-hotspot" style="left:15.875%;top:61.744791666666664%;width:68.625%;height:1.15625%" data-text="BESIDES, THERE IS NO PROOF YOU GUYS ARE ACTUALLY FROM CLAN DZARWI." onclick="showTextTooltip(event,this)" data-translation="ALÉM DISSO, NÃO HÁ PROVA DE QUE VOCÊS REALMENTE SÃO DO CLÃ DZARWI." data-tips="💡 'Besides' é um conector que significa 'além d le="left:38.875%;top:46.60416666666667%;width:51%;height:1.4791666666666643%" data-text="I ASK YOU THIS PURELY OUT OF CURIOSITY. DOES THAT LADY HAPPEN TO BE YOUR OWN SISTER?" onclick="showTextTooltip(event,this)" data-translation="EU TE PERGUNTO ISSO PURAMENTE POR CURIOSIDADE. ESSA MOÇA ACONTECE DE SER SUA PRÓPRIA IRMÃ?" data-tips="💡 'Happen to be' é uma expressão usada para indicar algo que ocorre por acaso. Exemplo: 'Do you happen to have a pen?'"></div><div class="text-hotspot" style="left:13.875000000000002%;top:48.75%;width:30.25%;height:.7083333333333333%" data-text="WELL, SOMETHING LIKE THAT." onclick="showTextTooltip(event,this)" data-translation="BEM, ALGO ASSIM."></div><div class="text-hotspot" style="left:31.25%;top:53.96875%;width:55.875%;height:1.234374999999993%" data-text="I SEE. I AM INDEBTED TO LORD KARLSTEIN, SO IF SHE IS RELATED TO YOU--" onclick="showTextTooltip(event,this)" data-translation="ENTENDO. ESTOU EM DÍVIDA COM O LORD KARLSTEIN, ENTÃO SE ELA É PARENTE SUA--"></div><div class="text-hotspot" style="left:16.25%;top:55.953125%;width:29.5%;height:.515625%" data-text="THERE IS NO NEED." onclick="showTextTooltip(event,this)" data-translation="NÃO HÁ NECESSIDADE."></div><div class="text-hotspot" style="left:33.625%;top:63.16666666666667%;width:53%;height:1.2239583333333333%" data-text="I CAN'T TELL YOU THE REASON BECAUSE THAT'S INTERNAL BUSINESS OF MY HOUSE..." onclick="showTextTooltip(event,this)" data-translation="NÃO POSSO TE DIZER A RAZÃO PORQUE ISSO É ASSUNTO INTERNO DA MINHA CASA..." data-tips="💡 'Internal business' refere-se a assuntos internos ou privados de uma organização ou família. É uma expressão comum em contextos formais."></div><div class="text-hotspot" style="left:12.5%;top:64.64583333333334%;width:45.5%;height:1.2135416666666665%" data-text="BUT I'M SURE FATHER WON'T CARE EVEN IF WE DIDN'T PROVIDE AN EXCEPTION." onclick="showTextTooltip(event,this)" data-translation="MAS TENHO CERTEZA DE QUE O PAI NÃO SE IMPORTARIA MESMO SE NÃ um resultado positivo depende de certas condições serem atendidas."></div><div class="text-hotspot" style="left:12.5%;top:93.4375%;width:46.625%;height:.9479166666666714%" data-text="IT'D BE GREAT IF YOU COULD GO ELSEWHERE THIS TIME AROUND." onclick="showTextTooltip(event,this)" data-translation="SERIA ÓTIMO SE VOCÊ PUDESSE IR PARA OUTRO LUGAR DESTA VEZ." data-tips="💡 A estrutura 'It'd be great if you could...' é uma forma educada de fazer um pedido ou sugestão, usando o condicional 'would' para suavizar o pedido."></div><div class="text-hotspot" style="left:17.75%;top:98.46354166666667%;width:40.375%;height:.9375%" data-text="REALLY? A SIXTH-FLOOR CLAN WILLING TO GO THIS FAR..." onclick="showTextTooltip(event,this)" data-translation="SÉRIO? UM CLÃ DO SEXTO ANDAR DISPOSTO A IR TÃO LONGE ASSIM..." data-tips="💡 'Willing to go this far' é uma expressão que significa estar disposto a fazer um grande esforço ou sacrifício."></div><div class="text-hotspot" style="left:53.75%;top:99.94791666666667%;width:31.75%;height:.046875%" data-text="WOTTO GET THE" onclick="showTextTooltip(event,this)" data-translation="WOTTO GET THE" data-warning="1"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/39/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:51.87500000000001%;top:0;width:34.75%;height:.6354166666666666%" data-text="JUST TO GET THE ESSENCE OF ELITE ORC WARRIOR?" onclick="showTextTooltip(event,this)" data-translation="SÓ PARA PEGAR A ESSÊNCIA DO GUERREIRO ORC ELITE?"></div><div class="text-hotspot" style="left:15.75%;top:7.317708333333334%;width:38.5%;height:.9427083333333334%" data-text="BUT THAT'S NOT EVEN THAT RARE OF AN ESSENCE. IT'S STRANGE..." onclick="showTextTooltip(event,this)" data-translation="MAS ESSA NEM É UMA ESSÊNCIA TÃO RARA. É ESTRANHO..."></div><div class="text-hotspot" style="left:49.875%;top:8.697916666666666%;width:30%;height:.6875%" data-text="UNLESS THEY'RE AIMING FOR THAT." onclick="showTextTooltip(event,this)" data-translation="A MENOS QUE ELES ESTEJAM MIRANDO NAQUILO."></div><div class="text-hotspot" style="left:10.125%;top:13.25%;width:67.125%;height:1.7343750000000002%" data-text="EVEN IF WE WEREN'T TO PUT ACCESS RESTRICTIONS IN THE AREA, THERE WON'T BE LEFTOVER MONSTERS FOR YOU TO HUNT DOWN ANYWAYS." onclick="showTextTooltip(event,this)" data-translation="MESMO QUE NÃO FÔSSEMOS COLOCAR RESTRIÇÕES DE ACESSO NA ÁREA, NÃO HAVERÁ MONSTROS SOBRANDO PARA VOCÊ CAÇAR DE QUALQUER FORMA." data-tips="💡 A expressão 'even if' é usada para introduzir uma condição hipotética que não muda o resultado. É semelhante a 'mesmo que' em português."></div><div class="text-hotspot" style="left:23.5%;top:15.588541666666666%;width:66.375%;height:1.7395833333333333%" data-text="THE BEST BET FOR YOUR PARTY IS TO FIND A WHOLE NEW AREA AS SOON AS YOU CAN IF YOU WISH TO SALVAGE SOMETHING ON THIS FLOOR." onclick="showTextTooltip(event,this)" data-translation="A MELHOR APOSTA PARA SEU GRUPO É ENCONTRAR UMA ÁREA TOTALMENTE NOVA O MAIS RÁPIDO POSSÍVEL SE VOCÊ DESEJA SALVAR ALGO NESTE ANDAR." data-tips="💡 'The best bet' é uma expressão idiomática que significa a melhor opção ou escolha disponível."></div><div class="text-hotspot" style="left:45.375%;top:19.244791666666668%;width:32.75%;height:.5625%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)" data-translation="RISADA"></div><div class="text-hotspot" style="left:22.5%;top:23.979166666666664%;width:55.375%;height:1.1927083333333321%" data-text="HE'S IMPLYING THEY'LL DO EVERYTHING IN THEIR MIGHT TO GET IN OUR WAY SHOULD WE DECLINE." onclick="showTextTooltip(event,this)" data-translation="ELE ESTÁ IMPLICANDO QUE FARÃO TUDO AO SEU ALCANCE PARA ATRAPALHAR SE RECUSARMOS." data-tips="💡 'In their might' significa 'com todo o seu poder ou força', uma maneira de enfatizar a determinação."></div><div class="text-hotspot" style="left:40.125%;top:30.640625%;width:45.5%;height:.953125%" data-text="THE MORE POWER YOU HAVE, THE BIGGER YOUR VOICE IS WITHIN THE LABYRINTH." onclick="showTextTooltip(event,this)" data-translation="QUANTO MAIS PODER VOCÊ TEM, MAIOR É SUA VOZ DENTRO DO LABIRINTO." data-tips="💡 'The bigger your voice' é uma metáfora que indica maior influência ou poder de decisão."></div><div class="text-hotspot" style="left:15.625%;top:32.55208333333333%;width:46.375%;height:.7083333333333333%" data-text="WE MUST KEEP THAT IN MIND AND KNOW WHEN TO TAKE A STEP BACK." onclick="showTextTooltip(event,this)" data-translation="DEVEMOS MANTER ISSO EM MENTE E SABER QUANDO DAR UM PASSO PARA TRÁS."></div><div class="text-hotspot" style="left:4.75%;top:36.03645833333333%;width:43.875%;height:1.2291666666666665%" data-text="MUMBLE DAMMIT..." onclick="showTextTooltip(event,this)" data-translation="MURMURAR MALDITO..."></div><div class="text-hotspot" style="left:37.75%;top:45.5%;width:48.875%;height:1.203125%" data-text="I UNDERSTAND THAT HE WAS TRYING TO STAND FOR THE ENTIRE TEAM, AS THE LEADER OF THIS PARTY." onclick="showTextTooltip(event,this)" data-translation="EU ENTENDO QUE ELE ESTAVA TENTANDO DEFENDER TODO O GRUPO, COMO O LÍDER DESTE GRUPO."></div><div class="text-hotspot" style="left:13.25%;top:47.59375%;width:44.875%;height:1.1979166666666714%" data-text="BUT SOMETIMES IT'S BETTER TO WALK AWAY FROM THE PROBLEM AND SEEK A DIFFERENT PATH." onclick="showTextTooltip(event,this)" data-translation="MAS ÀS VEZES É MELHOR SE AFASTAR DO PROBLEMA E PROCURAR UM CAMINHO DIFERENTE." data-tips="💡 'Walk away from the problem' é uma expressão que sugere evitar ou deixar de lidar com um problema diretamente."></div><div class="text-hotspot" style="left:10.125%;top:53.125%;width:40.75%;height:.16666666666666669%" data-text="UNDERSTOOD--" onclick="showTextTooltip(event,this)" data-translation="ENTENDIDO--"></div><div class="text-hotspot" style="left:38.875%;top:54.223958333333336%;width:40.375%;height:.8229166666666666%" data-text="LET ME TRY TALKING TO THEM!" onclick="sh  ANÃO ESTÚPIDO!"></div><div class="text-hotspot" style="left:14.374999999999998%;top:47.21189591078067%;width:40.25%;height:1.1593472370991116%" data-text="THIS ISN'T TIME TO COVER FOR YOUR PARTY MEMBER, BUT TO RETREAT!" onclick="showTextTooltip(event,this)" data-translation="NÃO É HORA DE DEFENDER SEU COMPANHEIRO DE EQUIPE, MAS DE RECUAR!" data-tips="💡 'Cover for your party member' significa proteger ou defender um membro do seu grupo, geralmente em uma situação difícil."></div><div class="text-hotspot" style="left:25.874999999999996%;top:54.04826412954446%;width:45%;height:1.1593472370991051%" data-text="I'VE ONLY SAID THE TRUTH, AND THE TRUTH HURTS." onclick="showTextTooltip(event,this)" data-translation="EU SÓ DISSE A VERDADE, E A VERDADE DÓI." data-tips="💡 'The truth hurts' é uma expressão comum que reconhece que a verdade pode ser dolorosa de ouvir."></div><div class="text-hotspot" style="left:28.000000000000004%;top:64.1232436519438%;width:27.500000000000004%;height:.6678848213723143%" data-text="WHAT? TRUTH?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ? VERDADE?"></div><div class="text-hotspot" style="left:34.375%;top:65.44011089408355%;width:48.75%;height:1.5310944489950225%" data-text="ARE YOU SERIOUSLY OUT OF YOUR MIND?!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ SÉRIO FORA DE SI?!"></div><div class="text-hotspot" style="left:66.75%;top:68.26286938441181%;width:21.375%;height:.5733728183479302%" data-text="C-CALM DOWN." onclick="showTextTooltip(event,this)" data-translation="C-CALMA."></div><div class="text-hotspot" style="left:14.625%;top:70.5941654590133%;width:68.125%;height:3.4906433117005857%" data-text="HIKUROD MURAD ACTIVATED LIGHTNING. BZZ" onclick="showTextTooltip(event,this)" data-translation="HIKUROD MURAD ATIVOU RELÂMPAGO. BZZ"></div><div class="text-hotspot" style="left:18.25%;top:89.75489887215676%;width:64.5%;height:1.392476844559269%" data-text="YOU CAN'T SERIOUSLY BE PLANNING TO BATTLE A SIXTH-FLO
