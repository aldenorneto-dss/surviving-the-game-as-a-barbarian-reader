dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/140/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20.75%;top:3.5937499999999996%;width:60.375%;height:1.1458333333333335%" data-text="... You ACTUALLY FOUGHT THROUGH ALL OF THEM...?!" onclick="showTextTooltip(event,this)" data-translation="... Você REALMENTE LUTOU CONTRA TODOS ELES...?!"></div><div class="text-hotspot" style="left:83.25%;top:9.885416666666668%;width:7.249999999999999%;height:.19270833333333334%" data-text="徵" onclick="showTextTooltip(event,this)" data-translation="徵"></div><div class="text-hotspot" style="left:2.625%;top:11.932291666666666%;width:36%;height:.8750000000000001%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:78.5%;top:12.562499999999998%;width:4%;height:.16145833333333334%" data-text="#11" onclick="showTextTooltip(event,this)" data-translation="#11"></div><div class="text-hotspot" style="left:16.75%;top:16.973958333333332%;width:66.375%;height:.9270833333333334%" data-text="GOOD TO SEE YOU AGAIN, VERSYL GOWLAND." onclick="showTextTooltip(event,this)" data-translation="BOM VER VOCÊ DE NOVO, VERSYL GOWLAND."></div><div class="text-hotspot" style="left:28.000000000000004%;top:22.458333333333332%;width:20.625%;height:.43750000000000006%" data-text="B-BUT HOW...?" onclick="showTextTooltip(event,this)" data-translation="M-MAS COMO...?"></div><div class="text-hotspot" style="left:12.125%;top:23.859375%;width:64.5%;height:.71875%" data-text="WAY SWEAT" onclick="showTextTooltip(event,this)" data-translation="WAY SWEAT"></div><div class="text-hotspot" style="left:18.375%;top:25.374999999999996%;width:17.5%;height:.3854166666666667%" data-text="SWEAT" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.5%;top:27.8125%;width:24%;height:.11979166666666666%" data-text="TAKE A GUESS." onclick="showTextTooltip(event,this)" data-translation="TENTE ADIVINHAR."></div><div class="text-hotspot" style="left:44.125%;top:28.328125%;width:43.625%;height:.6979166666666666%" data-text="I MADE THE SAME CHOICE AS YOU." onclick="showTextTooltip(event,this)" data-translation="EU FIZ A MESMA ESCOLHA QUE VOCÊ."></div><div class="text-hotspot" style="left:22.125%;top:33.10416666666667%;width:29.625%;height:.703125%" data-text="EXCHANGE GREETINGS LATER." onclick="showTextTooltip(event,this)" data-translation="TROCAMOS CUMPRIMENTOS DEPOIS."></div><div class="text-hotspot" style="left:37.25%;top:39.40625%;width:46.875%;height:1.21875%" data-text="WHAT BRINGS YOU HERE, AND WHO'S THAT BARBARIAN, SIR ERGOS?" onclick="showTextTooltip(event,this)" data-translation="O QUE O TRAZ AQUI, E QUEM É AQUELE BÁRBARO, SIR ERGOS?"></div><div class="text-hotspot" style="left:14.374999999999998%;top:45.19270833333333%;width:48.625%;height:.9583333333333333%" data-text="HE IS AN ADVENTURER KNOWN AS BJORN YANDEL..." onclick="showTextTooltip(event,this)" data-translation="ELE É UM AVENTUREIRO CONHECIDO COMO BJORN YANDEL..."></div><div class="text-hotspot" style="left:38%;top:46.739583333333336%;width:40.5%;height:1.1979166666666643%" data-text="WHO BROUGHT SIR GARFIZEL'S MESSENGER RING." onclick="showTextTooltip(event,this)" data-translation="QUE TROUXE O ANEL MENSAGEIRO DE SIR GARFIZEL."></div><div class="text-hotspot" style="left:40.875%;top:54.932291666666664%;width:40.375%;height:.4479166666666667%" data-text="SIR GARFIZEL'S RING...?" onclick="showTextTooltip(event,this)" data-translation="O ANEL DE SIR GARFIZEL...?"></div><div class="text-hotspot" style="left:59.875%;top:59.56249999999999%;width:23.75%;height:.20833333333333334%" data-text="YES, SIR." onclick="showTextTooltip(event,this)" data-translation="SIM, SENHOR."></div><div class="text-hotspot" style="left:0;top:60.25520833333333%;width:30.75%;height:.953125%" data-text="SWISH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.5%;top:64.421875%;width:17.25%;height:.16145833333333334%" data-text="HMM..." onclick="showTextTooltip(event,this)" data-translation="HMM..."></div><div class="text-hotspot" style="left:14.124999999999998%;top:71.67708333333334%;width:53.874999999999986%;height:1.2239583333333144%" data-text="I AM MARCO ELBERN, COMMANDER OF THE THIRD ORDER OF ROYAL KNIGHTS." onclick="showTextTooltip(event,this)" data-translation="EU SOU MARCO ELBERN, COMANDANTE DA TERCEIRA ORDEM DOS CAVALEIROS REAIS."></div><div class="text-hotspot" style="left:35.625%;top:73.77083333333333%;width:50.74999999999999%;height:1.21875%" data-text="I WILL ASK YOU A SERIES OF QUESTIONS. CAN YOU ANSWER THEM TRUTHFULLY?" onclick="showTextTooltip(event,this)" data-translation="VOU FAZER UMA SÉRIE DE PERGUNTAS. VOCÊ PODE RESPONDÊ-LAS HONESTAMENTE?"></div><div class="text-hotspot" style="left:63.87500000000001%;top:81.21354166666667%;width:15.75%;height:.15625%" data-text="SURE." onclick="showTextTooltip(event,this)" data-translation="CLARO."></div><div class="text-hotspot" style="left:10.75%;top:86.42708333333333%;width:63.375%;height:1.2083333333333428%" data-text="ACCORDING TO THE MESSAGE, YOU SAID CORPSE COLLECTOR IS NEAR THE NORTHERN PORTAL." onclick="showTextTooltip(event,this)" data-translation="SEGUNDO A MENSAGEM, VOCÊ DISSE QUE O COLETOR DE CADÁVERES ESTÁ PERTO DO PORTAL NORTE."></div><div class="text-hotspot" style="left:43.25%;top:88.51041666666667%;width:33.125%;height:.7239583333333333%" data-text="ARE YOU ABSOLUTELY POSITIVE?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ TEM ABSOLUTA CERTEZA?"></div><div class="text-hotspot" style="left:10.25%;top:94.21354166666667%;width:44.5%;height:.4635416666666667%" data-text="CORPSE COLLECTOR...?!" onclick="showTextTooltip(event,this)" data-translation="COLETOR DE CADÁVERES...?!"></div><div class="text-hotspot" style="left:61.75000000000001%;top:94.58854166666667%;width:33.25%;height:.6458333333333334%" data-text="CLAMOR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:8.125%;top:95.68229166666666%;width:33.375%;height:.6927083333333334%" data-text="CLAMOR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:52.25%;top:96.09895833333333%;width:34%;height:.47916666666666663%" data-text="THAT INFAMOUS..." onclick="showTextTooltip(event,this)" data-translation="AQUELE INFAME..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/140/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:18.25%;top:.5885416666666666%;width:49.625%;height:1.21875%" data-text="I AM. I ENGAGED HIM IN BATTLE BRIEFLY, BEFORE RUNNING AWAY." onclick="showTextTooltip(event,this)" data-translation="TENHO. EU O ENFRENTEI BREVEMENTE EM BATALHA, ANTES DE FUGIR."></div><div class="text-hotspot" style="left:50.74999999999999%;top:8.223958333333334%;width:38.75000000000001%;height:1.203125%" data-text="YOU ENGAGED HIM? WHAT'S YOUR PARTY'S TIER?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ O ENFRENTOU? QUAL É O NÍVEL DA SUA EQUIPE?"></div><div class="text-hotspot" style="left:22.5%;top:10.973958333333334%;width:24.25%;height:.203125%" data-text="...TIER-5." onclick="showTextTooltip(event,this)" data-translation="...NÍVEL-5."></div><div class="text-hotspot" style="left:43.5%;top:15.723958333333332%;width:13.375%;height:.171875%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:21.25%;top:22.197916666666668%;width:57.99999999999999%;height:.7083333333333333%" data-text="THEN IT'S SAFE TO SAY THAT HE LET YOU RUN AWAY." onclick="showTextTooltip(event,this)" data-translation="ENTÃO É SEGURO DIZER QUE ELE DEIXOU VOCÊ FUGIR."></div><div class="text-hotspot" style="left:19.5%;top:27.489583333333336%;width:27.375%;height:.16145833333333334%" data-text="PROBABLY." onclick="showTextTooltip(event,this)" data-translation="PROVAVELMENTE."></div><div class="text-hotspot" style="left:26.875%;top:28.895833333333332%;width:60.62499999999999%;height:.9583333333333333%" data-text="HE SEEMED TO BE GUARDING THE PORTAL LEADING TO THE SECOND FLOOR." onclick="showTextTooltip(event,this)" data-translation="ELE PARECIA ESTAR GUARDANDO O PORTAL QUE LEVA AO SEGUNDO ANDAR."></div><div class="text-hotspot" style="left:26.625%;top:39.578125%;width:46.5%;height:.6927083333333334%" data-text="I WOULD HAVE HAD TO PAY A STEEP PRICE HAD HE TRIED TO KILL ME." onclick="showTextTooltip(event,this)" data-translation="EU TERIA QUE PAGAR UM PREÇO ALTO SE ELE TENTASSE ME MATAR."></div><div class="text-hotspot" style="left:54.625%;top:45.07291666666667%;width:27.500000000000004%;height:.4322916666666667%" data-text="ONE MORE QUESTION." onclick="showTextTooltip(event,this)" data-translation="MAIS UMA PERGUNTA."></div><div class="text-hotspot" style="left:16.75%;top:47.78645833333333%;width:66.625%;height:1.734375000000007%" data-text="IT SEEMS THAT YOU'VE FOUGHT YOUR WAY THROUGH THE PATH GUARDED BY SIR ERGOS. WAS THERE A WAY TO SNEAK PAST THE ENEMIES?" onclick="showTextTooltip(event,this)" data-translation="PARECE QUE VOCÊ LUTOU PELO CAMINHO GUARDADO POR SIR ERGOS. HAVIA UMA MANEIRA DE PASSAR PELOS INIMIGOS SEM SER VISTO?"></div><div class="text-hotspot" style="left:12.5%;top:56.32812499999999%;width:44.875%;height:.6979166666666666%" data-text="I WOULD NOT BE IN THIS STATE IF THERE WAS." onclick="showTextTooltip(event,this)" data-translation="EU NÃO ESTARIA NESTE ESTADO SE HOUVESSE."></div><div class="text-hotspot" style="left:18.875%;top:61.43229166666667%;width:9.625%;height:.13541666666666669%" data-text="FAIR." onclick="showTextTooltip(event,this)" data-translation="JUSTO."></div><div class="text-hotspot" style="left:18.375%;top:61.94270833333333%;width:52.37500000000001%;height:.96875%" data-text="THEN CAN YOU TELL ME PRECISELY HOW YOU FOUGHT YOUR WAY THROUGH?" onclick="showTextTooltip(event,this)" data-translation="ENTÃO VOCÊ PODE ME DIZER PRECISAMENTE COMO VOCÊ LUTOU PELO CAMINHO?"></div><div class="text-hotspot" style="left:38.375%;top:63.546875%;width:47.875%;height:.9427083333333334%" data-text="WHO KNOWS? THAT MAY HELP US COME UP WITH A STRATEGY." onclick="showTextTooltip(event,this)" data-translation="QUEM SABE? ISSO PODE NOS AJUDAR A ELABORAR UMA ESTRATÉGIA."></div><div class="text-hotspot" style="left:12.5%;top:68.57291666666666%;width:24.75%;height:.5885416666666666%" data-text="TURN" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24.125%;top:72.14583333333333%;width:15.25%;height:.171875%" data-text="SURE." onclick="showTextTooltip(event,this)" data-translation="CLARO."></div><div class="text-hotspot" style="left:36.375%;top:73.265625%;width:39.5%;height:.9479166666666667%" data-text="I REALLY WANT TO GET SOME REST, BUT THAT'LL HAVE TO WAIT." onclick="showTextTooltip(event,this)" data-translation="EU REALMENTE QUERO DESCANSAR, MAS ISSO VAI TER QUE ESPERAR."></div><div class="text-hotspot" style="left:31%;top:83.79166666666666%;width:38.625%;height:.71875%" data-text="...IS HOW WE MADE IT HERE. THAT IS ALL." onclick="showTextTooltip(event,this)" data-translation="...É COMO CHEGAMOS AQUI. ISSO É TUDO."></div><div class="text-hotspot" style="left:48.75%;top:90.71875%;width:32.25%;height:.4479166666666667%" data-text="THAT WAS IMPRESSIVE." onclick="showTextTooltip(event,this)" data-translation="FOI IMPRESSIONANTE."></div><div class="text-hotspot" style="left:44.125%;top:96.60416666666667%;width:42.375%;height:.953125%" data-text="YOU HAVE THE TALENT TO LEAD A GROUP OF SOLDIERS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ TEM TALENTO PARA LIDERAR UM GRUPO DE SOLDADOS."></div><div class="text-hotspot" style="left:12.625%;top:99.06770833333334%;width:46.25%;height:.9270833333333144%" data-text="...THEN MORE THAN HALF OF US WOULD'VE SURVIVED." onclick="showTextTooltip(event,this)" data-translation="...ENTÃO MAIS DA METADE DE NÓS TERIA SOBREVIVIDO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/140/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:15.5%;top:3.7239583333333335%;width:37.375%;height:.9479166666666667%" data-text="THAT'S WHERE I WAS GOING WITH THIS." onclick="showTextTooltip(event,this)" data-translation="ERA ISSO QUE EU ESTAVA QUERENDO DIZER."></div><div class="text-hotspot" style="left:32.5%;top:5.411458333333333%;width:50.875%;height:.9322916666666667%" data-text="YOUR TEAM MEMBERS ARE ALIVE." onclick="showTextTooltip(event,this)" data-translation="SEUS COMPANHEIROS DE EQUIPE ESTÃO VIVOS."></div><div class="text-hotspot" style="left:7.249999999999999%;top:9.921875%;width:45.75%;height:.8750000000000001%" data-text="CLENCH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.75%;top:14.640624999999998%;width:67.75%;height:1.1614583333333333%" data-text="BJORN. A GOOD COMMANDER DOES NOT ALWAYS MAKE A PERFECT CHOICE." onclick="showTextTooltip(event,this)" data-translation="BJORN. UM BOM COMANDANTE NEM SEMPRE TOMA A DECISÃO PERFEITA."></div><div class="text-hotspot" style="left:89.625%;top:19.161458333333332%;width:5.75%;height:.21354166666666666%" data-text="300" onclick="showTextTooltip(event,this)" data-translation="300"></div><div class="text-hotspot" style="left:20.25%;top:23.052083333333336%;width:59%;height:1.03125%" data-text="BUT THEY MAKE DIFFICULT DECISIONS." onclick="showTextTooltip(event,this)" data-translation="MAS ELES TOMAM DECISÕES DIFÍCEIS."></div><div class="text-hotspot" style="left:15.625%;top:35.651041666666664%;width:45.125%;height:.7135416666666666%" data-text="...IF THAT'S ALL, I WOULD LIKE TO GET SOME REST." onclick="showTextTooltip(event,this)" data-translation="...SE É SÓ ISSO, EU GOSTARIA DE DESCANSAR UM POUCO."></div><div class="text-hotspot" style="left:56.99999999999999%;top:42.796875%;width:27.625%;height:.421875%" data-text="ONE LAST QUESTION." onclick="showTextTooltip(event,this)" data-translation="UMA ÚLTIMA PERGUNTA."></div><div class="text-hotspot" style="left:24%;top:43.963541666666664%;width:50.125%;height:1.2083333333333357%" data-text="DID THE AURA USER YOU FOUGHT HAVE A SCAR ON HIS CHIN BY ANY CHANCE?" onclick="showTextTooltip(event,this)" data-translation="O USUÁRIO DE AURA QUE VOCÊ ENFRENTOU TINHA UMA CICATRIZ NO QUEIXO, POR ACASO?"></div><div class="text-hotspot" style="left:56.99999999999999%;top:49.4375%;width:34.25%;height:.4479166666666667%" data-text="SCAR...? WAIT. HE DID." onclick="showTextTooltip(event,this)" data-translation="CICATRIZ...? ESPERE. ELE TINHA."></div><div class="text-hotspot" style="left:18%;top:56.614583333333336%;width:67.125%;height:1.4947916666666667%" data-text="I SEE. I ASKED BECAUSE YOU SAID HE USED AN ADAMANTIUM GREATSWORD... SO IT REALLY WAS THE SERPENT KNIGHT." onclick="showTextTooltip(event,this)" data-translation="ENTENDO. PERGUNTEI PORQUE VOCÊ DISSE QUE ELE USAVA UMA ESPADA GRANDE DE ADAMANTIUM... ENTÃO ERA MESMO O CAVALEIRO SERPENTE."></div><div class="text-hotspot" style="left:25.124999999999996%;top:63.84375%;width:51.625%;height:.984375%" data-text="HE STABBED THE CHILD OF A LORD HE WAS IN SERVICE OF AND RAN AWAY." onclick="showTextTooltip(event,this)" data-translation="ELE ESFAQUEOU O FILHO DE UM LORD PARA QUEM TRABALHAVA E FUGIU."></div><div class="text-hotspot" style="left:66.625%;top:65.41666666666667%;width:23.125%;height:.3020833333333286%" data-text="QUITE FAMOUS, ACTUALLY." onclick="showTextTooltip(event,this)" data-translation="BASTANTE FAMOSO, NA VERDADE."></div><div class="text-hotspot" style="left:34.5%;top:67.921875%;width:7.249999999999999%;height:.27083333333333337%" data-text="無" onclick="showTextTooltip(event,this)" data-translation="無"></div><div class="text-hotspot" style="left:46.375%;top:68.52604166666667%;width:4.875%;height:.20833333333333334%" data-text="4年" onclick="showTextTooltip(event,this)" data-translatio " data-text="I HOPE RAVEN TAKES CARE OF THE REST..." onclick="showTextTooltip(event,this)" data-translation="ESPERO QUE RAVEN CUIDE DO RESTO..."></div><div class="text-hotspot" style="left:52.37500000000001%;top:25.885416666666668%;width:21.5%;height:.4322916666666667%" data-text="BJORN YANDEL?" onclick="showTextTooltip(event,this)" data-translation="BJORN YANDEL?"></div><div class="text-hotspot" style="left:19.875%;top:28.291666666666664%;width:28.625%;height:.19270833333333334%" data-text="...TAKELAN." onclick="showTextTooltip(event,this)" data-translation="...TAKELAN."></div><div class="text-hotspot" style="left:29.25%;top:30.447916666666668%;width:8.25%;height:.5729166666666666%" data-text="100" onclick="showTextTooltip(event,this)" data-translation="100"></div><div class="text-hotspot" style="left:15.125%;top:33.130208333333336%;width:2.75%;height:.10937500000000001%" data-text="+11" onclick="showTextTooltip(event,this)" data-translation="+11"></div><div class="text-hotspot" style="left:23.25%;top:37.567708333333336%;width:54.125%;height:.8333333333333334%" data-text="...I HEARD WHAT HAPPENED WHILE I WAS GONE." onclick="showTextTooltip(event,this)" data-translation="...OUVI O QUE ACONTECEU ENQUANTO EU ESTAVA FORA."></div><div class="text-hotspot" style="left:20.375%;top:43.78125%;width:59.12500000000001%;height:.9635416666666667%" data-text="HE TEMPORARILY LOST HIS COMPOSURE AND CRITICIZED ME, AFTER REALIZING THAT ALL MY TEAM MEMBERS SURVIVED." onclick="showTextTooltip(event,this)" data-translation="ELE PERDEU A COMPOSTURA TEMPORARIAMENTE E ME CRITICOU, DEPOIS DE PERCEBER QUE TODOS OS MEUS COMPANHEIROS DE EQUIPE SOBREVIVERAM."></div><div class="text-hotspot" style="left:19.375%;top:47.27604166666667%;width:53.5%;height:1.4791666666666667%" data-text="ARUA GOT REALLY UPSET BECAUSE SHE HAD TO BURN YOU DOWN WITH HER OWN HANDSSS." onclick="showTextTooltip(event,this)" data-translation="ARUA FICOU MUITO CHATEADA PORQUE TEVE QUE TE DERRUBAR COM AS PRÓPRIAS MÃOS."></div><div class="text-hotspot" style="left:34.125%;top:49.09895833333333%;width:54.87499999999999%;height:1.484375%" data-text="SHE WAS YELLING AT HIM FOR SAYING STUFF LIKE THAT, WHEN YOU WENT THROUGH ALL THATTT." onclick="showTextTooltip(event,this)" data-translation="ELA ESTAVA GRITANDO COM ELE POR DIZER COISAS ASSIM, QUANDO VOCÊ PASSOU POR TUDO AQUILO."></div><div class="text-hotspot" style="left:12.25%;top:59.505208333333336%;width:43.375%;height:.7031249999999929%" data-text="LIGH, IT WAS MAKING ME NERVOUSSSS." onclick="showTextTooltip(event,this)" data-translation="LIGH, ISSO ESTAVA ME DEIXANDO NERVOSO."></div><div class="text-hotspot" style="left:24.375%;top:61.119791666666664%;width:50.125%;height:.9583333333333286%" data-text="AINAR DREW HER SWORD TOO BECAUSE SHE WAS ANGRY..." onclick="showTextTooltip(event,this)" data-translation="AINAR TAMBÉM SACOU A ESPADA PORQUE ESTAVA COM RAIVA..."></div><div class="text-hotspot" style="left:22.25%;top:67.72395833333333%;width:30.625000000000004%;height:.6979166666666666%" data-text="RAVEN IS SCARY WHEN SHE GETS MAD." onclick="showTextTooltip(event,this)" data-translation="RAVEN É ASSUSTADORA QUANDO FICA BRAVA."></div><div class="text-hotspot" style="left:35.5%;top:69.22395833333333%;width:45.25%;height:.6822916666666714%" data-text="I DON'T KNOW WHERE THAT ENERGY COMES FROM." onclick="showTextTooltip(event,this)" data-translation="NÃO SEI DE ONDE VEM ESSA ENERGIA."></div><div class="text-hotspot" style="left:15.875%;top:74.48958333333333%;width:68.25%;height:1.1614583333333333%" data-text="I WAS GRATEFUL THAT MY PARTY MEMBERS STOOD UP FOR ME, BUT I STILL COULDN'T SMILE." onclick="showTextTooltip(event,this)" data-translation="FIQUEI GRATO QUE MEUS COMPANHEIROS DE EQUIPE ME DEFENDERAM, MAS AINDA ASSIM NÃO CONSEGUI SORRIR."></div><div class="text-hotspot" style="left:56.00000000000001%;top:81.88541666666667%;width:32.875%;height:.7135416666666666%" data-text="HUH? YOU SEEM... UNHAPPPPY." onclick="showTextTooltip(event,thi
