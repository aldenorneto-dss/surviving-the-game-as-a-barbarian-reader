ot" style="left:22.375%;top:75.65625%;width:55.625%;height:1.7760416666666667%" data-text="CORPSE COLLECTOR? IT WAS A CHANCE TO TELL MORE PEOPLE ABOUT YOUR HEROICS!" onclick="showTextTooltip(event,this)" data-translation="COLETOR DE CADÁVERES? FOI UMA OPORTUNIDADE PARA CONTAR A MAIS PESSOAS SOBRE SUAS HEROICIDADES!"></div><div class="text-hotspot" style="left:43.125%;top:84.546875%;width:39.875%;height:.8177083333333286%" data-text="WHY DID WE HAVE TO RUN?!" onclick="showTextTooltip(event,this)" data-translation="POR QUE TIVEMOS QUE CORRER?!"></div><div class="text-hotspot" style="left:16.5%;top:90.39583333333333%;width:62.375%;height:.8541666666666666%" data-text="CHANCE FOR WHAT? IT'S A MIRACLE THAT NONE OF US GOT HURT!" onclick="showTextTooltip(event,this)" data-translation="OPORTUNIDADE PARA QUÊ? É UM MILAGRE QUE NENHUM DE NÓS TENHA SE MACHUCADO!"></div><div class="text-hotspot" style="left:20.125%;top:97.9375%;width:58.62500000000001%;height:.9479166666666667%" data-text="AINAR THINKS I'M SOME KIND OF A MYTHICAL, LEGENDARY HERO BARBARIAN OR SOMETHING." onclick="showTextTooltip(event,this)" data-translation="AINAR ACHA QUE SOU ALGUM TIPO DE HERÓI BÁRBARO MITOLÓGICO, LENDÁRIO OU ALGO ASSIM."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/137/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20.875%;top:4.036458333333334%;width:41.5%;height:.6874999999999991%" data-text="AINAR, STOP BEING SO STUBBORRRRN." onclick="showTextTooltip(event,this)" data-translation="AINAR, PARE DE SER TÃO TEIMOSOOOO."></div><div class="text-hotspot" style="left:47.625%;top:5.890625%;width:22.25%;height:.38020833333333337%" data-text="UGHood" onclick="showTextTooltip(event,this)" data-translation="Argh"></div><div class="text-hotspot" style="left:14.625%;top:10.0625%;width:34.25%;height:.45312499999999994%" data-text="CALM DOWN, MS. FENELIN." onclick="showTextTooltip(event,this)" data-tran lass="text-hotspot" style="left:33.625%;top:23.078125%;width:32.5%;height:.7447916666666667%" data-text="IT FEELS LIKE AN INFINITE PVP DUNGEON." onclick="showTextTooltip(event,this)" data-translation="PARECE UM DUNGEON INFINITO DE PVP."></div><div class="text-hotspot" style="left:1.625%;top:24.520833333333332%;width:33.25%;height:.953125%" data-text="PANT PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE OFEGANTE"></div><div class="text-hotspot" style="left:75.625%;top:24.598958333333336%;width:16.25%;height:.40625%" data-text="WHEW" onclick="showTextTooltip(event,this)" data-translation="UFA"></div><div class="text-hotspot" style="left:84.75%;top:25.656250000000004%;width:8.375%;height:.296875%" data-text="#" onclick="showTextTooltip(event,this)" data-translation="#"></div><div class="text-hotspot" style="left:2.875%;top:28.286458333333332%;width:16.625%;height:.48958333333333337%" data-text="HUFF" onclick="showTextTooltip(event,this)" data-translation="HUFF"></div><div class="text-hotspot" style="left:23.75%;top:31.3125%;width:52.5%;height:.84375%" data-text="WE'VE HAD NO PARTICULAR TROUBLE THUS FAR..." onclick="showTextTooltip(event,this)" data-translation="NÃO TIVEMOS GRANDES PROBLEMAS ATÉ AGORA..."></div><div class="text-hotspot" style="left:17.25%;top:35.875%;width:65.5%;height:1.0052083333333333%" data-text="...BUT HOW LONG CAN WE REALISTICALLY LAST...?" onclick="showTextTooltip(event,this)" data-translation="...MAS POR QUANTO TEMPO PODEMOS REALISTICAMENTE AGUENTAR...?"></div><div class="text-hotspot" style="left:26%;top:44.958333333333336%;width:49.25%;height:.5833333333333334%" data-text="STOP RIGHT THERE!" onclick="showTextTooltip(event,this)" data-translation="PAREM AÍ!"></div><div class="text-hotspot" style="left:50.375%;top:51.05208333333333%;width:33.875%;height:.9114583333333334%" data-text="DON'T DO ANYTHING STUPID!" onclick="showTextTooltip(event,this)" data-translation="NÃO FAÇAM NADA ESTÚPIDO!"></div><div class="text-hotspot" style="left:18%;top:62.98958333333333%;width:65.625%;height:1.2708333333333333%" data-text="TELL ME WHAT ORGANIZATION YOU'RE AFFILIATED WITH!" onclick="showTextTooltip(event,this)" data-translation="DIGAM-ME COM QUE ORGANIZAÇÃO VOCÊS ESTÃO AFILIADOS!"></div><div class="text-hotspot" style="left:33%;top:68.55208333333334%;width:12.625%;height:.10416666666666667%" data-text="DAMMIT!" onclick="showTextTooltip(event,this)" data-translation="DROGA!"></div><div class="text-hotspot" style="left:40.25%;top:69.34895833333333%;width:41.625%;height:.7083333333333428%" data-text="THERE'S ABOUT TWENTY... NO, THIRTY OF THEM." onclick="showTextTooltip(event,this)" data-translation="SÃO UNS VINTE... NÃO, TRINTA DELES."></div><div class="text-hotspot" style="left:33.375%;top:77.55729166666666%;width:39.5%;height:.6927083333333334%" data-text="IF THEY'RE FROM NOARK, THEN WE'RE SCREWED." onclick="showTextTooltip(event,this)" data-translation="SE ELES SÃO DE NOARK, ENTÃO ESTAMOS FERRADOS."></div><div class="text-hotspot" style="left:37.125%;top:83.20833333333333%;width:25.624999999999996%;height:.24479166666666669%" data-text="HUH...?" onclick="showTextTooltip(event,this)" data-translation="HÃ...?"></div><div class="text-hotspot" style="left:31.75%;top:88.30729166666667%;width:32.625%;height:.5260416666666666%" data-text="GOOD OLD SIR?!" onclick="showTextTooltip(event,this)" data-translation="VELHO AMIGO?!"></div><div class="text-hotspot" style="left:45%;top:95.33333333333334%;width:25.874999999999996%;height:.18229166666666666%" data-text="YOU'RE...!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ É...!"></div><div class="text-hotspot" style="left:39.75%;top:99.609375%;width:20.5%;height:.21354166666666666%" data-text="THANK" onclick="showTextTooltip(event,this)" data-translation="OBRIGADO"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/137/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:28.249999999999996%;top:.23958333333333331%;width:44%;height:.53125%" data-text="I'VE BEEN SO WORRIED!" onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA TÃO PREOCUPADO!"></div><div class="text-hotspot" style="left:5.375%;top:1.6979166666666667%;width:40.5%;height:1.0885416666666667%" data-text="RUSH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.625%;top:9.645833333333332%;width:48.375%;height:.9322916666666667%" data-text="I REALLY DID NOT EXPECT TO SEE HER HERE. THEN WHAT'S THIS GROUP...?" onclick="showTextTooltip(event,this)" data-translation="EU REALMENTE NÃO ESPERAVA VÊ-LA AQUI. ENTÃO, QUAL É ESSE GRUPO...?"></div><div class="text-hotspot" style="left:35.5%;top:14.770833333333332%;width:53.5%;height:2.067708333333333%" data-text="STEP WHO WOULD THAT GENTLEMAN BE, MS. ERWEN?" onclick="showTextTooltip(event,this)" data-translation="PASSO QUEM SERIA AQUELE CAVALHEIRO, SRTA. ERWEN?" data-warning="1"></div><div class="text-hotspot" style="left:22.125%;top:18.229166666666664%;width:19.5%;height:.39583333333333337%" data-text="CLASP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.625%;top:21.625%;width:46.5%;height:1.4739583333333357%" data-text="AH! HE'S SOMEONE MY SISTER AND I KNOW VERY WELL. RIGHT, SIS?" onclick="showTextTooltip(event,this)" data-translation="AH! ELE É ALGUÉM QUE MINHA IRMÃ E EU CONHECEMOS MUITO BEM. CERTO, MANA?"></div><div class="text-hotspot" style="left:17.625%;top:26.807291666666664%;width:45.125%;height:.9583333333333357%" data-text="YOU COULD SAY THAT. HE'S DEFINITELY IDENTIFIABLE." onclick="showTextTooltip(event,this)" data-translation="PODE-SE DIZER ISSO. ELE É DEFINITIVAMENTE IDENTIFICÁVEL."></div><div class="text-hotspot" style="left:30.5%;top:28.505208333333332%;width:26.75%;height:.609375%" data-text="CLUTCH" onclick="showTextTooltip(event,this)" data-translation="AGARRAR"></div><div class="text-hotspot" style="left:59.12500000000001%;top:30.166666666666668%;width:16.875%;height:.45312499999999994%" data-text="NOOOO" onclick="showTextTooltip(event,this)" data-translation="NÃÃÃO"></div><div class="text-hotspot" style="left:53.625%;top:33.234375%;width:23.75%;height:.703125%" data-text="OF COURSE SHE'S WITH HER SISTER." onclick="showTextTooltip(event,this)" data-translation="CLARO QUE ELA ESTÁ COM A IRMÃ."></div><div class="text-hotspot" style="left:29.375%;top:34.484375%;width:32.625%;height:.3177083333333333%" data-text="WHAT WAS HER NAME AGAIN? DARIA?" onclick="showTextTooltip(event,this)" data-translation="QUAL ERA O NOME DELA MESMO? DARIA?"></div><div class="text-hotspot" style="left:28.000000000000004%;top:38.947916666666664%;width:44.5%;height:.9427083333333334%" data-text="THAT'S REASSURING TO HEAR." onclick="showTextTooltip(event,this)" data-translation="É RECONFORTANTE OUVIR ISSO."></div><div class="text-hotspot" style="left:18.25%;top:43.58854166666667%;width:65.875%;height:1.9739583333333286%" data-text="IT'S A PLEASURE TO MEET YOU. I AM VERSYL GOWLAND, VICE MASTER OF CLAN LARER." onclick="showTextTooltip(event,this)" data-translation="É UM PRAZER CONHECÊ-LO. SOU VERSYL GOWLAND, VICE-MESTRE DO CLÃ LARER."></div><div class="text-hotspot" style="left:11.75%;top:54.822916666666664%;width:41.75%;height:.4479166666666667%" data-text="I AM BJORN, SON OF YANDEL." onclick="showTextTooltip(event,this)" data-translation="SOU BJORN, FILHO DE YANDEL."></div><div class="text-hotspot" style="left:28.125%;top:59.15104166666667%;width:27%;height:.10937500000000001%" data-text="LITTLE VALCAN...?" onclick="showTextTooltip(event,this)" data-translation="PEQUENO VALCAN...?"></div><div class="text-hotspot" style="left:40.125%;top:59.86458333333333%;width:53.125%;height:.953125%" data-text="GLAD TO HAVE SUCH A RENOWNED INDIVIDUAL LIKE YOU AMONG US." onclick="showTextTooltip(event,this)" data-translation="FICO FELIZ EM TER ALGUÉM TÃO RENOMADO COMO VOCÊ ENTRE NÓS."></div><div class="text-hotspot" style="left:9.125%;top:64.54166666666666%;width:45.875%;height:.6875%" data-text="I WAS JUST ABOUT TO SAY THE SAME THING." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA PRESTES A DIZER A MESMA COISA."></div><div class="text-hotspot" style="left:29.375%;top:66.11979166666667%;width:51.5%;height:.9635416666666667%" data-text="I'VE HEARD OF CLAN LARER BEFORE. IT'S QUITE BIG, ISN'T IT?" onclick="showTextTooltip(event,this)" data-translation="JÁ OUVI FALAR DO CLÃ LARER ANTES. É BEM GRANDE, NÃO É?"></div><div class="text-hotspot" style="left:14.875%;top:71.30208333333333%;width:56.375%;height:.7135416666666666%" data-text="IT'S NOT ONE OF THE TEN MAJOR CLANS IN RAFDONIA, BUT IT'S VERY CLOSE." onclick="showTextTooltip(event,this)" data-translation="NÃO É UM DOS DEZ PRINCIPAIS CLÃS DE RAFDONIA, MAS ESTÁ MUITO PRÓXIMO."></div><div class="text-hotspot" style="left:42.75%;top:73.03645833333333%;width:42.375%;height:.6927083333333428%" data-text="THIS CLAN MOSTLY CONSISTS OF FEMALE MEMBERS." onclick="showTextTooltip(event,this)" data-translation="ESTE CLÃ É FORMADO PRINCIPALMENTE POR MULHERES."></div><div class="text-hotspot" style="left:25.75%;top:81.21354166666667%;width:23.125%;height:.140625%" data-text="VICE MASTER?" onclick="showTextTooltip(event,this)" data-translation="VICE-MESTRE?"></div><div class="text-hotspot" style="left:37.625%;top:81.83854166666666%;width:46.625%;height:.9583333333333333%" data-text="I'M SURPRISED TO MEET SOMEONE SO DISTINGUISHED AT A PLACE LIKE THIS." onclick="showTextTooltip(event,this)" data-translation="ESTOU SURPRESO EM ENCONTRAR ALGUÉM TÃO DISTINTO EM UM LUGAR COMO ESTE."></div><div class="text-hotspot" style="left:38.625%;top:86.55729166666667%;width:45.125%;height:1.2083333333333286%" data-text="FIRST THINGS FIRST. ALL SIX TEAMS HERE HAVE BEEN IDENTIFIED." onclick="showTextTooltip(event,this)" data-translation="PRIMEIRO DE TUDO. TODAS AS SEIS EQUIPES AQUI FORAM IDENTIFICADAS."></div><div class="text-hotspot" style="left:21%;top:89.078125%;width:19.375%;height:.6979166666666666%" data-text="WHAT DO YOU MEAN?" onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ QUER DIZER?"></div><div class="text-hotspot" style="left:31.125000000000004%;top:97.03645833333333%;width:60.375%;height:.9479166666666667%" data-text="EVERYONE HERE IS ACQUAINTED WITH ANOTHER PERSON ONE WAY OR ANOTHER." onclick="showTextTooltip(event,this)" data-translation="TODO MUNDO AQUI CONHECE ALGUÉM DE ALGUMA FORMA."></div><div class="text-hotspot" style="left:12.5%;top:98.97916666666666%;width:60.75000000000001%;height:.9427083333333334%" data-text="WE TURNED DOWN ANYONE THAT WE COULDN'T BE SURE OF, SO THERE'S NOTHING TO WORRY ABOUT." onclick="showTextTooltip(event,this)" data-translation="RECUSAMOS QUALQUER UM DE QUEM NÃO PUDÉSSEMOS TER CERTEZA, ENTÃO NÃO HÁ COM O QUE SE PREOCUPAR."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/137/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:18.125%;top:.015625%;width:49.5%;height:.171875%" data-text="WE TURNED DOWN ANYONE THAT WE COULDN'T BE SURE OF, SO THERE'S NOTHING TO WORRY ABOUT." onclick="showTextTooltip(event,this)" data-translation="RECUSAMOS QUALQUER UM DE QUEM NÃO PUDÉSSEMOS TER CERTEZA, ENTÃO NÃO HÁ COM O QUE SE PREOCUPAR."></div><div class="text-hotspot" style="left:17%;top:5.057291666666667%;width:66.5%;height:1.15625%" data-text="OUR GOAL IS TO REACH THE SAFE ZONE IN THE CENTER TOGETHER." onclick="showTextTooltip(event,this)" data-translation="NOSSO OBJETIVO É CHEGAR À ZONA SEGURA NO CENTRO JUNTOS."></div><div class="text-hotspot" style="left:22.625%;top:13.604166666666668%;width:10.25%;height:.13541666666666669%" data-text="WELL?" onclick="showTextTooltip(event,this)" data-translation="ENTÃO?"></div><div class="text-hotspot" style="left:23%;top:14.369791666666668%;width:54.625%;height:.84375%" data-text="WOULD YOU LIKE TO JOIN US, MR. YANDEL?" onclick="showTextTooltip(event,this)" data-translation="GOSTARIA DE SE JUNTAR A NÓS, SR. YANDEL?"></div><div class="text-hotspot" style="left:37.25%;top:19.473958333333332%;width:42.25%;height:.703125%" data-text="A VICE MASTER OF A LARGE CLAN MUST BE PRETTY STRONG." onclick="showTextTooltip(event,this)" data-translation="UM VICE-MESTRE DE UM GRANDE CLÃ DEVE SER BEM FORTE."></div><div class="text-hotspot" style="left:21.25%;top:27.526041666666668%;width:58.25%;height:1.1458333333333321%" data-text="SURE. I LOOK FORWARD TO WORKING WITH YOU." onclick="showTextTooltip(event,this)" data-translation="CLARO. ESTOU ANSIOSO PARA TRABALHAR COM VOCÊ."></div><div class="text-hotspot" style="left:63.125%;top:30.984374999999996%;width:14.374999999999998%;height:.13020833333333331%" data-text="LIKEWISE" onclick="showTextTooltip(event,this)" data-translation="IGUALMENTE"></div><div class="text-hotspot" style="left:17.875%;top:36.604166666666664%;width:47.625%;height:.703125%" data-text="WE DON'T EVEN KNOW HOW THIS DAY IS GOING TO END." onclick="showTextTooltip(event,this)" data-translation="NEM SABEMOS COMO ESTE DIA VAI TERMINAR."></div><div class="text-hotspot" style="left:41.5%;top:38.15625%;width:43.25%;height:.7239583333333333%" data-text="BUT THIS GIVES US A PLACE TO REST, ALBEIT TEMPORARILY." onclick="showTextTooltip(event,this)" data-translation="MAS ISSO NOS DÁ UM LUGAR PARA DESCANSAR, AINDA QUE TEMPORARIAMENTE."></div><div class="text-hotspot" style="left:14.499999999999998%;top:43.51041666666667%;width:53.87499999999999%;height:.953125%" data-text="YOU DON'T HAVE TO BE ON WATCH DUTY, SO TAKE A QUICK BREAK." onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO PRECISA FICAR DE VIGIA, ENTÃO DÊ UMA RÁPIDA DESCANSADA."></div><div class="text-hotspot" style="left:38%;top:45.171875%;width:43.375%;height:.9479166666666643%" data-text="WE'RE GOING TO LEAVE SOON. WE'LL TELL YOU WHEN." onclick="showTextTooltip(event,this)" data-translation="VAMOS PARTIR EM BREVE. AVISAREMOS VOCÊ QUANDO."></div><div class="text-hotspot" style="left:55.875%;top:48.760416666666664%;width:30.625000000000004%;height:.703125%" data-text="WHEW" onclick="showTextTooltip(event,this)" data-translation="UFA"></div><div class="text-hotspot" style="left:8%;top:49.916666666666664%;width:39.625%;height:.96875%" data-text="PLOP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.375%;top:54.947916666666664%;width:43.375%;height:.953125%" data-text="THANK GOODNESS WE RAN INTO A NICE GRRRROUP..." onclick="showTextTooltip(event,this)" data-translation="AINDA BEM QUE ENCONTRAMOS UM GRUPO LEGAL..."></div><div class="text-hotspot" style="left:70.75%;top:56.296875%;width:21.625%;height:.46875%" data-text="I THOUGHT I WAS GONNA DIEEE..." onclick="showTextTooltip(event,this)" data-translation="ACHEI QUE IA MORRER..."></div><div class="text-hotspot" style="left:52.125%;top:62.848958333333336%;width:34%;height:1.2135416666666643%" data-text="I'M GLAD YOU DECIDED TO JOIN UP, GOOD OLD SIR." onclick="showTextTooltip(event,this)" data-translation="FICO FELIZ QUE VOCÊ TENHA DECIDIDO SE JUNTAR, BOM E VELHO SENHOR."></div><div class="text-hotspot" style="left:26.375%;top:64.49479166666666%;width:50.5%;height:1.2239583333333428%" data-text="THE VICE MASTER IS REALLY STRONG, NOT TO MENTION OTHER MEMBERS." onclick="showTextTooltip(event,this)" data-translation="A VICE-MESTRE É REALMENTE FORTE, SEM FALAR DOS OUTROS MEMBROS."></div><div class="text-hotspot" style="left:10.75%;top:69.84375%;width:60.5%;height:1.328125%" data-text="I CAN'T HELP BUT THINK FATE BINDS US TOGETHER STRONGLY, BY THE WAY." onclick="showTextTooltip(event,this)" data-translation="NÃO POSSO DEIXAR DE PENSAR QUE O DESTINO NOS UNE FORTEMENTE, A PROPÓSITO."></div><div class="text-hotspot" style="left:28.375%;top:72.26041666666667%;width:57.125%;height:.765625%" data-text="I WAS ACTUALLY THINKING ABOUT YOU..." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA REALMENTE PENSANDO EM VOCÊ..."></div><div class="text-hotspot" style="left:31.624999999999996%;top:81.63541666666667%;width:36.5%;height:.484375%" data-text="...WHEN YOU SHOWED UP." onclick="showTextTooltip(event,this)" data-translation="...QUANDO VOCÊ APARECEU."></div><div class="text-hotspot" style="left:45%;top:83.84375%;width:23.5%;height:.5729166666666666%" data-text="TSK" onclick="showTextTooltip(event,this)" data-translation="TSK"></div><div class="text-hotspot" style="left:25.5%;top:90.13020833333333%;width:36.5%;height:.6354166666666666%" data-text="GOOD OLD SIR TOLD ME A LOT ABOUT YOU! HE SAID HE RECRUITED AN AMAZING MAGE!" onclick="showTextTooltip(event,this)" data-translation="O BOM E VELHO SENHOR ME FALOU MUITO SOBRE VOCÊ! ELE DISSE QUE RECRUTOU UM MAGE INCRÍVEL!"></div><div class="text-hotspot" style="left:63%;top:92.44270833333333%;width:30.125%;height:.3229166666666667%" data-text="...DID MR. YANDEL REALLY SAY THAT?" onclick="showTextTooltip(event,this)" data-translation="...O SR. YANDEL REALMENTE DISSE ISSO?"></div><div class="text-hotspot" style="left:53.25%;top:97.546875%;width:29.625%;height:.9270833333333334%" data-text="IT'S SO DIFFERENT FROM MY BOW! WHOA" onclick="showTextTooltip(event,this)" data-translation="É TÃO DIFERENTE DO MEU ARCO! UAU"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/137/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:47.125%;top:.5520833333333334%;width:39.625%;height:1.09375%" data-text="CHUCKLE OF COURSE BECAUSE I USED TROLL TENDONS." onclick="showTextTooltip(event,this)" data-translation="RISADA CLARO, PORQUE USEI TENDÕES DE TROLL."></div><div class="text-hotspot" style="left:32.75%;top:8.96875%;width:46.125%;height:.953125%" data-text="WOW, SINCE WHEN WAS SHE SO GOOD AT SOCIALIZING LIKE THIS?" onclick="showTextTooltip(event,this)" data-translation="UOU, DESDE QUANDO ELA FICOU TÃO BOA EM SOCIALIZAR ASSIM?"></div><div class="text-hotspot" style="left:20.875%;top:11.979166666666668%;width:18.375%;height:.3125%" data-text="WANNA TRY PULLING IT?" onclick="showTextTooltip(event,this)" data-translation="QUER TENTAR PUXAR?"></div><div class="text-hotspot" style="left:63.74999999999999%;top:13.885416666666666%;width:24.625%;height:.13020833333333331%" data-text="CAN I REALLY?" onclick="showTextTooltip(event,this)" data-translation="POSSO MESMO?"></div><div class="text-hotspot" style="left:24.875%;top:18.984375%;width:52.625%;height:1.265625%" data-text="URIKFREAK, NOW ISN'T THE TIME TO SMILE LIKE THAT!" onclick="showTextTooltip(event,this)" data-translation="URIKFREAK, AGORA NÃO É HORA DE SORRIR ASSIM!"></div><div class="text-hotspot" style="left:.125%;top:21.291666666666668%;width:49%;height:1.4739583333333335%" data-text="SHOUT" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53.625%;top:26.192708333333332%;width:31%;height:.6354166666666666%" data-text="FLINCH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53.37499999999999%;top:29.479166666666668%;width:31%;height:.484375%" data-text="HUH? OH. UHM..." onclick="showTextTooltip(event,this)" data-translation="HÃ? AH. UHM..."></div><div class="text-hotspot" style="left:33.5%;top:30.901041666666668%;width:40.75%;height:.7708333333333334%" data-text="I-I LOVE CATS BETTER, OF COURSE!" onclick="showTextTooltip(event,this)" data-translation="E-EU GOSTO MAIS DE GATOS, CLARO!"></div><div class="text-hotspot" style="left:2.75%;top:34.833333333333336%;width:41.5%;height:1.15625%" data-text="I ALMOST MISUNDERSTOOD YOU! HERE, HAVE A LOOK AT MY GREATSWORD. DRAG" onclick="showTextTooltip(event,this)" data-translation="QUASE ENTENDI ERRADO VOCÊ! AQUI, DÊ UMA OLHADA NA MINHA ESPADA GRANDE. ARRASTAR"></div><div class="text-hotspot" style="left:42.25%;top:36.31770833333333%;width:14.875%;height:.13020833333333331%" data-text="WH-WHY?" onclick="showTextTooltip(event,this)" data-translation="P-POR QUÊ?"></div><div class="text-hotspot" style="left:50.74999999999999%;top:43.05729166666667%;width:38.5%;height:1.0989583333333335%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.625%;top:46.125%;width:46.25%;height:.7708333333333334%" data-text="I WOULD LIKE TO MAKE A PROPOSITION." onclick="showTextTooltip(event,this)" data-translation="GOSTARIA DE FAZER UMA PROPOSTA."></div><div class="text-hotspot" style="left:12.375%;top:51.385416666666664%;width:50.125%;height:.9739583333333333%" data-text="WHY DON'T YOU TRAVEL TOGETHER WITH MY PARTY FOR A BIT?" onclick="showTextTooltip(event,this)" data-translation="Por que você não viaja junto com meu grupo por um tempo?"></div><div class="text-hotspot" style="left:28.000000000000004%;top:53.37499999999999%;width:56.125%;height:1.203125000000007%" data-text="IF YOU AGREE, OUR TEAMS WILL STAY RIGHT NEXT TO EACH OTHER AS WE MOVE." onclick="showTextTooltip(event,this)" data-translation="Se você concordar, nossos times ficarão lado a lado enquanto nos movemos."></div><div class="text-hotspot" style="left:38%;top:62.067708333333336%;width:52.375%;height:.9635416666666643%" data-text="POWER STRUGGLES ARE COMMON, WHENEVER THERE'S A LARGE GROUP OF PEOPLE." onclick="showTextTooltip(event,this)" data-translation="Conflitos de poder são comuns sempre que há um grande grupo de pessoas."></div><div class="text-hotspot" style="left:32.625%;top:67.60416666666667%;width:31.5%;height:.4427083333333333%" data-text="THAT'S NOT A BAD IDEA." onclick="showTextTooltip(event,this)" data-translation="Isso não é uma má ideia."></div><div class="text-hotspot" style="left:37.75%;top:73.83333333333333%;width:49.375%;height:.6927083333333334%" data-text="HAVE YOU SPOKEN WITH YOUR PARTY LEADER, THOUGH?" onclick="showTextTooltip(event,this)" data-translation="Você já conversou com o líder do seu grupo?"></div><div class="text-hotspot" style="left:23%;top:79.375%;width:53.625%;height:.953125%" data-text="DARIA AND ERWEN ARE WORKING AS MERCENARIES FOR CLAN BLUE WALL AT THE MOMENT." onclick="showTextTooltip(event,this)" data-translation="Daria e Erwen estão trabalhando como mercenárias para o Clã Muralha Azul no momento."></div><div class="text-hotspot" style="left:23.625%;top:88.77083333333333%;width:52.625%;height:.9427083333333286%" data-text="THEY ARE SUPPOSED TO LISTEN TO THE LEADER, WHO'S AN EXECUTIVE OF THAT CLAN." onclick="showTextTooltip(event,this)" data-translation="Elas devem ouvir o líder, que é um executivo desse clã."></div><div class="text-hotspot" style="left:53.25%;top:94.078125%;width:32%;height:.43750000000000006%" data-text="AS FOR THAT MAN..." onclick="showTextTooltip(event,this)" data-translation="Quanto a esse homem..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/137/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:24.5%;top:1.3333333333333335%;width:50.875%;height:.8489583333333334%" data-text="DON'T WORRY. I CAN CONVINCE HIM." onclick="showTextTooltip(event,this)" data-translation="Não se preocupe. Eu posso convencê-lo."></div><div class="text-hotspot" style="left:15.125%;top:9.729166666666666%;width:70.625%;height:1.1458333333333333%" data-text="PLEASE WRAP UP CHECKING YOUR GEAR AND ITEMS. WE WILL GET GOING SOON." onclick="showTextTooltip(event,this)" data-translation="Por favor, terminem de verificar seu equipamento e itens. Partiremos em breve."></div><div class="text-hotspot" style="left:13.875000000000002%;top:22.515625%;width:51.625%;height:.703125%" data-text="VERSYL MADE AN ANNOUNCEMENT FOR THE DEPARTURE SHORTLY." onclick="showTextTooltip(event,this)" data-translation="Versyl fez um anúncio para a partida em breve."></div><div class="text-hotspot" style="left:36.5%;top:24.348958333333336%;width:47.625%;height:.9583333333333333%" data-text="MY PARTY WAS PLACED IN THE THIRD ROW, WITH ERWEN'S PARTY RIGHT BEHIND US." onclick="showTextTooltip(event,this)" data-translation="Meu grupo foi colocado na terceira fila, com o grupo de Erwen logo atrás de nós."></div><div class="text-hotspot" style="left:34%;top:29.161458333333336%;width:42.125%;height:.9583333333333333%" data-text="WHY DOES MY TEAM HAVE TO BE IN FRONT OF YOURS?" onclick="showTextTooltip(event,this)" data-translation="Por que meu time tem que ficar na frente do seu?"></div><div class="text-hotspot" style="left:13.25%;top:31%;width:47.125%;height:.6927083333333357%" data-text="I DON'T THINK I LIKE THIS FORMATION." onclick="showTextTooltip(event,this)" data-translation="Eu não acho que gosto dessa formação."></div><div class="text-hotspot" style="left:3.125%;top:32.005208333333336%;width:26.125%;height:.7552083333333334%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:43.625%;top:33.25%;width:23.875%;height:.6354166666666666%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:1.625%;top:35.854166666666664%;width:25.874999999999996%;height:.5885416666666666%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:74.5%;top:36.375%;width:22.75%;height:.53125%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.75%;top:37.114583333333336%;width:22%;height:.4635416666666667%" data-text="MAHA" onclick="showTextTooltip(event,this)" data-translation="Maha"></div><div class="text-hotspot" style="left:43.625%;top:37.65104166666667%;width:42.25%;height:.9583333333333215%" data-text="BECAUSE WE HAVE A LOT OF RANGED COMBATANTS," onclick="showTextTooltip(event,this)" data-translation="Porque temos muitos combatentes à distância,"></div><div class="text-hotspot" style="left:26.5%;top:39.447916666666664%;width:47.625%;height:.9583333333333428%" data-text="WHILE YOU HAVE A GOOD NUMBER OF MELEE FIGHTERS." onclick="showTextTooltip(event,this)" data-translation="enquanto vocês têm um bom número de lutadores corpo a corpo."></div><div class="text-hotspot" style="left:37.375%;top:44.567708333333336%;width:43.25%;height:1.4791666666666667%" data-text="BESIDES, WE ARE IN THE CENTER OF THE FORMATION. IT'S THE SAFEST HERE." onclick="showTextTooltip(event,this)" data-translation="Além disso, estamos no centro da formação. É o lugar mais seguro aqui."></div><div class="text-hotspot" style="left:16.25%;top:46.703125%;width:47.125%;height:.9375%" data-text="WHO DO YOU THINK MADE THAT POSSIBLE IN THE FIRST PLACE?" onclick="showTextTooltip(event,this)" data-translation="Quem você acha que tornou isso possível em primeiro lugar?"></div><div class="text-hotspot" style="left:20.5%;top:56.234375%;width:58.625%;height:1.46875%" data-text="A MERE TEAM LEADER OF A SMALL CLAN CAN'T HAVE INFLUENCED THE DECISION BY THE VICE MASTER OF A LARGE CLAN." onclick="showTextTooltip(event,this)" data-translation="Um mero líder de equipe de um pequeno clã não poderia ter influenciado a decisão do vice-mestre de um grande clã."></div><div class="text-hotspot" style="left:36%;top:62.697916666666664%;width:27.875%;height:.4479166666666667%" data-text="THAT SOUNDS LIKE BS..." onclick="showTextTooltip(event,this)" data-translation="Isso soa como besteira..."></div><div class="text-hotspot" style="left:12.625%;top:64.28125%;width:40.625%;height:.8906249999999999%" data-text="RUSH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23%;top:67.84895833333333%;width:54%;height:.9479166666666667%" data-text="THE JOURNEY TO THE CENTRAL AREA BEGAN, WITH CLAN LARER LEADING THE WAY FROM THE FRONT." onclick="showTextTooltip(event,this)" data-translation="A jornada para a área central começou, com o Clã Larer liderando o caminho pela frente."></div><div class="text-hotspot" style="left:29.625%;top:90.58333333333334%;width:40.625%;height:1.1458333333333333%" data-text="IS THIS HOW IT FEELS TO BE CARRIED BY OTHERS?" onclick="showTextTooltip(event,this)" data-translation="É assim que se sente ser carregado por outros?"></div><div class="text-hotspot" style="left:12.375%;top:97.515625%;width:65%;height:.9322916666666572%" data-text="CLAN LARER'S ACTIVE ON THE SEVENTH FLOOR, SO THE BATTLES WERE NOT DIFFICULT AT ALL." onclick="showTextTooltip(event,this)" data-translation="O Clã Larer é ativo no sétimo andar, então as batalhas não foram difíceis."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/137/11.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:49.875%;top:1.0104166666666665%;width:35.375%;height:.703125%" data-text="EXCEPT THIS HAPPENED ABOUT AN HOUR LATER." onclick="showTextTooltip(event,this)" data-translation="Exceto que isso aconteceu cerca de uma hora depois."></div><div class="text-hotspot" style="left:7.124999999999999%;top:4.520833333333334%;width:35.375%;height:.6666666666666667%" data-text="LISTEN UP" onclick="showTextTooltip(event,this)" data-translation="Ouçam"></div><div class="text-hotspot" style="left:23.25%;top:5.645833333333333%;width:54.125%;height:.8489583333333339%" data-text="I HAVE GOOD NEWS AND BAD NEWS." onclick="showTextTooltip(event,this)" data-translation="Tenho boas e más notícias."></div><div class="text-hotspot" style="left:15.125%;top:15.291666666666668%;width:37.25%;height:.16145833333333334%" data-text="GOOD NEWS..." onclick="showTextTooltip(event,this)" data-translation="Boas notícias..."></div><div class="text-hotspot" style="left:23.125%;top:19.838541666666668%;width:53.87499999999999%;height:.765625%" data-text="IT WAS THAT THE DARK AREA WAS NEARBY. HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="É que a área escura estava próxima. No entanto..."></div><div class="text-hotspot" style="left:20.375%;top:24.447916666666668%;width:60.25%;height:.921875%" data-text="UNFORTUNATELY, NOT EVERYONE WILL MAKE IT." onclick="showTextTooltip(event,this)" data-translation="Infelizmente, nem todos vão conseguir."></div><div class="text-hotspot" style="left:11.125%;top:41.604166666666664%;width:38.875%;height:.4635416666666667%" data-text="ACCORDING TO OUR SCOUT," onclick="showTextTooltip(event,this)" data-translation="De acordo com nosso batedor,"></div><div class="text-hotspot" style="left:17.125%;top:42.94791666666667%;width:74.25%;height:1.2239583333333286%" data-text="THERE ARE NOARK SOLDIERS WAITING FOR ADVENTURERS LIKE US, IN ALL ROUTES TO THE DARK AREA." onclick="showTextTooltip(event,this)" data-translation="há soldados de Noark esperando por aventureiros como nós, em todas as rotas para a área escura."></div><div class="text-hotspot" style="left:8.125%;top:54.015625%;width:70%;height:1.2083333333333357%" data-text="...WHICH MEANS WE'LL HAVE TO FIGHT OUR WAY IN AND SOME OF US WILL DIE IN THE PROCESS." onclick="showTextTooltip(event,this)" data-translation="...o que significa que teremos que lutar para entrar e alguns de nós morrerão no processo."></div><div class="text-hotspot" style="left:33.875%;top:58.291666666666664%;width:32.5%;height:.7864583333333357%" data-text="WE ARE READY FOR |T --" onclick="showTextTooltip(event,this)" data-translation="Estamos prontos para isso --"></div><div class="text-hotspot" style="left:61.375%;top:58.93229166666667%;width:35.5%;height:.984375%" data-text="SWISH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.624999999999996%;top:66.45833333333333%;width:49.875%;height:1.1510416666666714%" data-text="NO. WE'LL USE A MASS TELEPORTATION SPELL." onclick="showTextTooltip(event,this)" data-translation="Não. Usaremos um feitiço de teletransporte em massa."></div><div class="text-hotspot" style="left:26.75%;top:72.30729166666666%;width:46.25%;height:.4270833333333286%" data-text="MASS TELEPORTATION? THEN..." onclick="showTextTooltip(event,this)" data-translation="Teletransporte em massa? Então..."></div><div class="text-hotspot" style="left:29.125%;top:73.02
