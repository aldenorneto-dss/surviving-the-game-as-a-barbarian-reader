th:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/85/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:24.125%;top:5.682291666666667%;width:50.74999999999999%;height:.84375%" data-text="SAY THAT AGAIN." data-translation="DIGA ISSO DE NOVO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24%;top:7.510416666666667%;width:75.875%;height:2.8541666666666665%" data-text="LOOM" data-translation="AMEAÇADOR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.25%;top:21.838541666666668%;width:53.37499999999999%;height:.9583333333333333%" data-text="INTRIGUING. I'M GETTING A SKIN CRAWLING SENSATION AND CHILLS DOWN MY SPINE." data-translation="INTRIGANTE. ESTOU SENTINDO UM ARREPIO NA PELE E CALAFRIOS NA ESPINHA." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão &quot;**chills down my spine**&quot; é uma maneira figurativa de descrever um **arrepio** ou sensação de medo/ansiedade. Em português, usamos &quot;calafrios&quot; ou &quot;arrepio na espinha&quot; para expressar essa sensação. - **Exemplo:** Every time I watch that horror movie, I get chills down my spine."></div><div class="text-hotspot" style="left:58.375%;top:23.375%;width:27.625%;height:.296875%" data-text="AIR OF HOSTILITY, EH?" data-translation="AR DE HOSTILIDADE, HEIN?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.75%;top:27.34375%;width:68.125%;height:1.140625%" data-text="EVEN THOUGH I'M IN A SPIRITUAL REALM... WAIT. COULD IT BE BECAUSE I'M IN THE SPIRITUAL REALM?" data-translation="MESMO ESTANDO EM UM REINO ESPIRITUAL... ESPERE. PODERIA SER PORQUE ESTOU NO REINO ESPIRITUAL?" onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura &quot;**Even though**&quot; é usada para indicar contraste ou surpresa, similar a &quot;mesmo que&quot; ou &quot;embora&quot; em português. - **Exemplo:** Even though it's raining, we decided to go for a walk."></div><div class="text-hotspot" style="left:24.25%;top:32.4375%;width:51.625%;height:.9479166666666667%" data-text="I'VE HEARD ABOUT IT. IT'S NOT PARTICULARLY USEFUL, BUT PERFECT FOR INTIMIDATING NEWBIES." data-translation="EU JÁ OUVI FALAR DISSO. NÃO É PARTICULARMENTE ÚTIL, MAS PERFEITO PARA INTIMIDAR NOVATOS." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão &quot;**I've heard about it**&quot; é uma forma comum de dizer que você está ciente de algo, mas não necessariamente tem experiência direta. - **Exemplo:** I've heard about that restaurant, but I've never eaten there."></div><div class="text-hotspot" style="left:12.625%;top:34.03125%;width:49.125%;height:.9635416666666667%" data-text="инм, ACTUALLY, THAT'S NOT WHAT I WAS GETTING AT--" data-translation="инм, NA VERDADE, NÃO ERA ISSO QUE EU QUERIA DIZER--" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:56.75%;top:36.71875%;width:31.125000000000004%;height:.765625%" data-text="FLINCH" data-translation="RECUAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:3.75%;top:39.401041666666664%;width:47.25%;height:1.1041666666666667%" data-text="CLENCY" data-translation="CLENCY" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.375%;top:43.06770833333333%;width:42.875%;height:.9791666666666667%" data-text="HA, YOU'RE SCARED NOW? I THOUGHT YOU HAD BALLS!" data-translation="HA, ESTÁ COM MEDO AGORA? EU PENSEI QUE VOCÊ TINHA CORAGEM!" onclick="showTextTooltip(event,this)" data-tips="💡 A expressão &quot;**I thought you had balls!**&quot; é uma maneira coloquial e informal de dizer que alguém tinha coragem. &quot;Balls&quot; aqui é uma gíria para coragem. Uma alternativa mais formal seria &quot;I thought you were brave!&quot;."></div><div class="text-hotspot" style="left:28.499999999999996%;top:48.328125%;width:42.875%;height:.6822916666666666%" data-text="A TRICK BORED VETERANS USE PURELY FOR ENTERTAINME
