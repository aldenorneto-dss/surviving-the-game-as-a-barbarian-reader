9999999994%" data-text="GOOD SOAP, GOOD FOOD..." onclick="showTextTooltip(event,this)" data-translation="Bom sabonete, boa comida..."></div><div class="text-hotspot" style="left:13.25%;top:80.328125%;width:32.75%;height:.71875%" data-text="SOFT" onclick="showTextTooltip(event,this)" data-translation="Macio"></div><div class="text-hotspot" style="left:27.125%;top:83.109375%;width:28.749999999999996%;height:.4322916666666667%" data-text="...GOOD BED, AND STUFF." onclick="showTextTooltip(event,this)" data-translation="...boa cama, e tal."></div><div class="text-hotspot" style="left:25.5%;top:88.44791666666667%;width:49.25%;height:.6927083333333286%" data-text="I WOULD HAVE SEEN THIS AS A WASTEFUL MOVE IN THE PAST." onclick="showTextTooltip(event,this)" data-translation="Eu teria visto isso como um desperdício no passado."></div><div class="text-hotspot" style="left:22%;top:92.44270833333333%;width:58.75%;height:3.401041666666667%" data-text="X" onclick="showTextTooltip(event,this)" data-translation="X"></div><div class="text-hotspot" style="left:52.25%;top:97.890625%;width:22.875%;height:.171875%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="No entanto..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/134/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:17.75%;top:3.8593750000000004%;width:64.375%;height:.953125%" data-text="...SINCE THE GENESIS TREASURES ARE GONE, I'M NOT SURE IF IT'S EVEN POSSIBLE TO GO BACK TO MY HOME ANYMORE." onclick="showTextTooltip(event,this)" data-translation="...desde que os Tesouros da Gênese se foram, não tenho certeza se é possível voltar para minha casa."></div><div class="text-hotspot" style="left:30.375000000000004%;top:12.260416666666666%;width:26%;height:.6822916666666666%" data-text="BESIDES, DO I REALLY NEED TO?" onclick="showTextTooltip(event,this)" data-translation="Além disso, eu realmente preciso?"></div><div class="text-hotspot" style="left:24%;top:20.854166666666664%;width:38.125%;height:.9635416666666667%" data-text="THAT WAS A LOT QUICKER THAN I EXPECTED." onclick="showTextTooltip(event,this)" data-translation="Foi bem mais rápido do que eu esperava."></div><div class="text-hotspot" style="left:37.25%;top:22.640625%;width:41.625%;height:.953125%" data-text="I GUESS WE CAN HEAD TO THE PUB EARLY TODAY." onclick="showTextTooltip(event,this)" data-translation="Acho que podemos ir ao pub mais cedo hoje."></div><div class="text-hotspot" style="left:15.625%;top:34.99479166666667%;width:68.5%;height:.9427083333333334%" data-text="2 DAYS AFTER LABYRINTH CLOSURE. WE HEADED TO THE PUB AFTER SELLING THE LOOT FROM THE EXPLORATION." onclick="showTextTooltip(event,this)" data-translation="2 dias após o fechamento do labirinto. Fomos ao pub depois de vender o saque da exploração."></div><div class="text-hotspot" style="left:24.625%;top:43.34375%;width:28.749999999999996%;height:.6979166666666666%" data-text="OF COURSE, NOBODY WAS THERE YET." onclick="showTextTooltip(event,this)" data-translation="Claro, ninguém estava lá ainda."></div><div class="text-hotspot" style="left:19.25%;top:50.171875%;width:47.125%;height:.9583333333333333%" data-text="THIS WORKS. I HADN'T HAD A CHANCE TO WORK ON IT YET." onclick="showTextTooltip(event,this)" data-translation="Isso funciona. Eu não tinha tido a chance de trabalhar nisso ainda."></div><div class="text-hotspot" style="left:7.875%;top:65.26041666666667%;width:35.125%;height:.6197916666666666%" data-text="SCRIBBLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53.625%;top:66.90625%;width:36.125%;height:.625%" data-text="SCRIBBLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.5%;top:68.72916666666666%;width:36.25%;height:.609375%" data-text="SCRIBBLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.875%;top:70.97916666666667%;width:51.875%;height:.953125%" data-text="IT'S TAKING LONGER THAN I EXPECTED. YET SHE HAS NEVER COMPLAINED ABOUT IT..." onclick="showTextTooltip(event,this)" data-translation="Está demorando mais do que eu esperava. Ainda assim, ela nunca reclamou disso..."></div><div class="text-hotspot" style="left:40.75%;top:80.22395833333333%;width:42.5%;height:1.0052083333333333%" data-text="SWISH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.374999999999996%;top:85.85416666666667%;width:27%;height:.19791666666666669%" data-text="THANKS." onclick="showTextTooltip(event,this)" data-translation="Obrigado."></div><div class="text-hotspot" style="left:44.75%;top:91.4375%;width:33.125%;height:.4322916666666667%" data-text="...THAT WAS RANDOM." onclick="showTextTooltip(event,this)" data-translation="...Isso foi aleatório."></div><div class="text-hotspot" style="left:20.75%;top:99.234375%;width:54.125%;height:.6979166666666666%" data-text="YOU'VE BEEN TAKING CARE OF TEDIOUS STUFF LIKE THIS FOR THE TEAM." onclick="showTextTooltip(event,this)" data-translation="Você tem cuidado de coisas tediosas como essa para o time."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/134/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20.375%;top:.03125%;width:54.37499999999999%;height:.16666666666666669%" data-text="YOU'VE BEEN TAKING CARE OF TEDIOUS STUFF LIKE THIS FOR THE TEAM." onclick="showTextTooltip(event,this)" data-translation="Você tem cuidado de coisas tediosas como essa para o time."></div><div class="text-hotspot" style="left:21.25%;top:5.744791666666667%;width:57.375%;height:1.4791666666666667%" data-text="I WOULDN'T IF THERE WAS ANOTHER PERSON WHO COULD BE IN CHARGE OF THIS." onclick="showTextTooltip(event,this)" data-translation="Eu não faria isso se houvesse outra pessoa que pudesse assumir isso."></div><div class="text-hotspot" style="left:23.25%;top:17.234375%;width:53.87499999999999%;height:1.4739583333333335%" data-text="NO THANKS ARE NECESSARY, UNLESS YOU'RE GOING TO PAY ME." onclick="showTextTooltip(event,this)" data-translation="Não precisa agradecer, a menos que você vá me pagar."></div><div class="text-hotspot" style="left:28.749999999999996%;top:22.635416666666668%;width:23.250000000000004%;height:.9635416666666643%" data-text="OKAY, THAT'S A GREAT IDEA." onclick="showTextTooltip(event,this)" data-translation="Ok, essa é uma ótima ideia."></div><div class="text-hotspot" style="left:35.875%;top:24.307291666666668%;width:43.25%;height:.7135416666666666%" data-text="HOW MUCH? I'M SURE EVERYONE WILL AGREE." onclick="showTextTooltip(event,this)" data-translation="Quanto? Tenho certeza de que todos vão concordar."></div><div class="text-hotspot" style="left:13.25%;top:28.505208333333332%;width:22.75%;height:.5572916666666667%" data-text="TURN" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.875%;top:29.958333333333332%;width:46.25%;height:.9479166666666667%" data-text="...SHUSH. IT'S NOT LIKE I'LL MAKE A FORTUNE OUT OF IT." onclick="showTextTooltip(event,this)" data-translation="...Shhh. Não é como se eu fosse fazer uma fortuna com isso."></div><div class="text-hotspot" style="left:44%;top:35.401041666666664%;width:34.125%;height:.6979166666666666%" data-text="YOU BOTH SEEM HAPPY TODAY." onclick="showTextTooltip(event,this)" data-translation="Vocês dois parecem felizes hoje."></div><div class="text-hotspot" style="left:32.25%;top:40.958333333333336%;width:48.875%;height:1.640624999999993%" data-text="IS IT BECAUSE WE FOUND THE MIRROR THIS TIME? HAHA" onclick="showTextTooltip(event,this)" data-translation="É porque encontramos o espelho desta vez? Haha"></div><div class="text-hotspot" style="left:45.5%;top:47.28125%;width:39%;height:.6927083333333334%" data-text="...THEN THE MELEE DEALER SISTERS SHOWED UP SOON." onclick="showTextTooltip(event,this)" data-translation="...Então as irmãs comerciantes de combate apareceram logo."></div><div class="text-hotspot" style="left:43.5%;top:54.29166666666667%;width:43.625%;height:1.2239583333333286%" data-text="...THAT LEAVES US WITH 8.5 MILLION STONES PER PERSON." onclick="showTextTooltip(event,this)" data-translation="...Isso nos deixa com 8,5 milhões de pedras por pessoa."></div><div class="text-hotspot" style="left:22.75%;top:57.31770833333333%;width:54.50000000000001%;height:.7135416666666666%" data-text="THE SETTLEMENT WAS OVER QUICKLY, THANKS TO RAVEN'S EFFORTS." onclick="showTextTooltip(event,this)" data-translation="A liquidação foi rápida, graças aos esforços de Raven."></div><div class="text-hotspot" style="left:22.125%;top:65.09895833333333%;width:33.125%;height:.6927083333333428%" data-text="BY THE WAY, MR. YANDEL." onclick="showTextTooltip(event,this)" data-translation="A propósito, Sr. Yandel."></div><div class="text-hotspot" style="left:36.875%;top:66.38020833333333%;width:35.625%;height:1.4635416666666667%" data-text="DIDN'T YOU SAY YOU HAD SOMETHING TO SPEAK TO ALL OF US ABOUT?" onclick="showTextTooltip(event,this)" data-translation="Você não disse que tinha algo para falar com todos nós?"></div><div class="text-hotspot" style="left:9.875%;top:71.10416666666667%;width:23%;height:.6354166666666666%" data-text="SLICE" onclick="showTextTooltip(event,this)" data-translation="Corte"></div><div class="text-hotspot" style="left:32.375%;top:76.14583333333333%;width:8.625%;height:.17708333333333331%" data-text="OH." onclick="showTextTooltip(event,this)" data-translation="Oh."></div><div class="text-hotspot" style="left:76.25%;top:77.32291666666666%;width:3.875%;height:.1875%" data-text="? n." onclick="showTextTooltip(event,this)" data-translation="? n."></div><div class="text-hotspot" style="left:56.75%;top:78.91666666666667%;width:16.5%;height:.4322916666666667%" data-text="NOM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.25%;top:79.71354166666667%;width:16.25%;height:.4166666666666667%" data-text="NOM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.75%;top:85.40104166666667%;width:21.75%;height:.6822916666666666%" data-text="GIVE ME ONE SECOND." onclick="showTextTooltip(event,this)" data-translation="Me dê um segundo."></div><div class="text-hotspot" style="left:3.25%;top:89.4375%;width:47.5%;height:1.2604166666666665%" data-text="GULD" onclick="showTextTooltip(event,this)" data-translation="Guld"></div><div class="text-hotspot" style="left:37.375%;top:93.83854166666666%;width:46.875%;height:1.140625%" data-text="GULP" onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/134/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:18.75%;top:1.0416666666666665%;width:30.875000000000004%;height:.953125%" data-text="TAP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.625%;top:5.817708333333333%;width:55.50000000000001%;height:1.1614583333333333%" data-text="WE WILL NOT HEAD TO BLAZING VALE ANYMORE." onclick="showTextTooltip(event,this)" data-translation="Não iremos mais para o Vale Ardente."></div><div class="text-hotspot" style="left:27.750000000000004%;top:13.369791666666666%;width:24.375%;height:.4270833333333333%" data-text="HUH? WHYYYY?" onclick="showTextTooltip(event,this)" data-translation="Hã? Por quêêê?"></div><div class="text-hotspot" style="left:58.25%;top:16.010416666666664%;width:27.750000000000004%;height:.6927083333333334%" data-text="IS THERE A SPECIFIC REASON?" onclick="showTextTooltip(event,this)" data-translation="Há um motivo específico?"></div><div class="text-hotspot" style="left:28.625%;top:23.557291666666664%;width:42.625%;height:.953125%" data-text="WE WENT TO THE OTHERWORLD THREE TIMES IN THE PAST SIX MONTHS..." onclick="showTextTooltip(event,this)" data-translation="Fomos para o Outro Mundo três vezes nos últimos seis meses..."></div><div class="text-hotspot" style="left:15%;top:32.015625%;width:43.625%;height:1.2291666666666665%" data-text="...AND FULLY EXPLORED OTHER FIELDS THERE SUCH AS ASHEN MOUNTAINS AND LAVA LAKE." onclick="showTextTooltip(event,this)" data-translation="...e exploramos completamente outros campos lá, como as Montanhas Cinzentas e o Lago de Lava."></div><div class="text-hotspot" style="left:33.25%;top:43.9375%;width:49.5%;height:.8333333333333357%" data-text="MEANING, WE GOT EVERYTHING WE NEEDED." onclick="showTextTooltip(event,this)" data-translation="Ou seja, conseguimos tudo o que precisávamos."></div><div class="text-hotspot" style="left:28.999999999999996%;top:50.24999999999999%;width:35.375%;height:.9583333333333333%" data-text="WE CAN'T STAY ON THE FIFTH FLOOR FOREVER." onclick="showTextTooltip(event,this)" data-translation="Não podemos ficar no quinto andar para sempre."></div><div class="text-hotspot" style="left:47.75%;top:52.015625%;width:32.25%;height:.953125%" data-text="IT'S TIME TO EXPLORE OTHER PLACES." onclick="showTextTooltip(event,this)" data-translation="É hora de explorar outros lugares."></div><div class="text-hotspot" style="left:26.375%;top:59.265625%;width:28.625%;height:.9583333333333333%" data-text="ALRIGHT, WHERE DO YOU PLAN ON GOING?" onclick="showTextTooltip(event,this)" data-translation="Certo, para onde você planeja ir?"></div><div class="text-hotspot" style="left:53.25%;top:61.401041666666664%;width:21.25%;height:.43750000000000006%" data-text="FROST VALLEY." onclick="showTextTooltip(event,this)" data-translation="Vale do Gelo."></div><div class="text-hotspot" style="left:23.875%;top:66.109375%;width:36.125%;height:.4322916666666714%" data-text="FROST VALLEYYYY...!" onclick="showTextTooltip(event,this)" data-translation="Vale do Geloooo...!"></div><div class="text-hotspot" style="left:3.5000000000000004%;top:69.58854166666667%;width:4.625%;height:.4322916666666667%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:13.875000000000002%;top:74.18229166666667%;width:51.37500000000001%;height:.9583333333333333%" data-text="WE CAN FIND A FEW ESSENCES THAT WILL HELP WITH MISSHA'S BUILD THERE." onclick="showTextTooltip(event,this)" data-translation="Podemos encontrar algumas essências que ajudarão na construção da Missha lá."></div><div class="text-hotspot" style="left:38.125%;top:75.97916666666666%;width:40%;height:.6927083333333334%" data-text="I'M ACTUALLY THINKING OF ONE IN PARTICULAR." onclick="showTextTooltip(event,this)" data-translation="Na verdade, estou pensando em uma em particular."></div><div class="text-hotspot" style="left:9.75%;top:81.1875%;width:14.124999999999998%;height:.11458333333333333%" data-text="IN FACT..." onclick="showTextTooltip(event,this)" data-translation="Na verdade..."></div><div class="text-hotspot" style="left:23.75%;top:81.953125%;width:35%;height:1.2083333333333286%" data-text="WE'LL BE DONE WITH FROST VALLEY ONCE WE OBTAIN THAT ESSENCE." onclick="showTextTooltip(event,this)" data-translation="Terminaremos com o Vale do Gelo assim que obtivermos essa essência."></div><div class="text-hotspot" style="left:3.375%;top:85.265625%;width:19.875%;height:.6197916666666666%" data-text="TAP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:38.5%;top:86.09895833333333%;width:17.125%;height:.53125%" data-text="TAP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:10.375%;top:86.22916666666667%;width:13.625000000000002%;height:.5677083333333334%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:34.875%;top:87.765625%;width:49.75%;height:.9739583333333333%" data-text="THEN WE'LL FARM EXP POINTS ELSEWHERE BEFORE HEADING TO THE SIXTH FLOOR." onclick="showTextTooltip(event,this)" data-translation="Então vamos farmar pontos de experiência em outro lugar antes de irmos para o sexto andar."></div><div class="text-hotspot" style="left:28.249999999999996%;top:94.40625%;width:47.875%;height:.6927083333333334%" data-text="ALTHOUGH IT WILL TAKE MORE THAN 1 YEAR TO GET THERE." onclick="showTextTooltip(event,this)" data-translation="Embora vá levar mais de 1 ano para chegar lá."></div><div class="text-hotspot" style="left:58.25%;top:95.77604166666667%;width:22.875%;height:.6510416666666667%" data-text="HMM" onclick="showTextTooltip(event,this)" data-translation="Hmm."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/134/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:37.875%;top:1.0260416666666665%;width:48.5%;height:1.15625%" data-text="FLASH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.125%;top:2.2395833333333335%;width:28.75%;height:.692708333333333%" data-text="STILL, WE'VE GOTTEN PRETTY FAR--" onclick="showTextTooltip(event,this)" data-translation="Ainda assim, chegamos bem longe--"></div><div class="text-hotspot" style="left:15.375%;top:16.90625%;width:34.125%;height:.4322916666666667%" data-text="BJORN, ISN'T THAT..." onclick="showTextTooltip(event,this)" data-translation="Bjorn, não é aquilo..."></div><div class="text-hotspot" style="left:25.5%;top:20.78125%;width:25.75%;height:.8333333333333334%" data-text="RIP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:45.5%;top:22.296875%;width:21.875%;height:.26041666666666663%" data-text="YEAH." onclick="showTextTooltip(event,this)" data-translation="Sim."></div><div class="text-hotspot" style="left:62%;top:31.333333333333336%;width:26.625%;height:.9375%" data-text="WOOD" onclick="showTextTooltip(event,this)" data-translation="Madeira"></div><div class="text-hotspot" style="left:18.5%;top:35.802083333333336%;width:62.25000000000001%;height:.6354166666666666%" data-text="C
