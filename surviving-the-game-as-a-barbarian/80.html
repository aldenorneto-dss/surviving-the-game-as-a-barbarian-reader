th:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/80/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:26.625%;top:4.270833333333333%;width:47.125%;height:.4270833333333333%" data-text="THE LABYRINTH IS NOW CLOSED." onclick="showTextTooltip(event,this)" data-translation="O LABIRINTO ESTÁ FECHADO."></div><div class="text-hotspot" style="left:15%;top:8.515625%;width:70.5%;height:.421875%" data-text="YOU WILL BE TRANSPORTED TO RAFDONIA." onclick="showTextTooltip(event,this)" data-translation="VOCÊ SERÁ TRANSPORTADO PARA RAFDONIA."></div><div class="text-hotspot" style="left:14.374999999999998%;top:14.427083333333332%;width:71.75%;height:1.1354166666666667%" data-text="WE RAN STRAIGHT TO THE TEMPLE WITH DWALKIE ON MY BACK UPON RETURNING TO THE CITY" onclick="showTextTooltip(event,this)" data-translation="CORREMOS DIRETO PARA O TEMPLO COM DWALKIE NAS MINHAS COSTAS AO RETORNAR PARA A CIDADE"></div><div class="text-hotspot" style="left:63%;top:18.109375%;width:22.125%;height:.43750000000000006%" data-text="TEMPLE OF REATLAS" onclick="showTextTooltip(event,this)" data-translation="TEMPLO DE REATLAS"></div><div class="text-hotspot" style="left:15.125%;top:24.734375%;width:21.625%;height:.1875%" data-text="WHEW..." onclick="showTextTooltip(event,this)" data-translation="Ufa..."></div><div class="text-hotspot" style="left:32.75%;top:28.244791666666668%;width:34.125%;height:.43750000000000006%" data-text="I FEEL MUCH BETTER." onclick="showTextTooltip(event,this)" data-translation="Estou me sentindo muito melhor."></div><div class="text-hotspot" style="left:79.875%;top:32.197916666666664%;width:13.125%;height:.10416666666666667%" data-text="HAHAHA!" onclick="showTextTooltip(event,this)" data-translation="Hahaha!"></div><div class="text-hotspot" style="left:44.5%;top:36.286458333333336%;width:24%;height:.17708333333333331%" data-text="DWALKIE!" onclick="showTextTooltip(event,this)" data-translation="Dwalkie!"></div><div class="text-hotspot" style="left:34.625%;top:42.270833333333336%;width:45.125%;height:1.4739583333333335%" data-text="DIVINE POWER IS AMAZING. WOUNDS INCURABLE BY SUPERB HEALING POTION WERE HEALED, JUST LIKE THAT." onclick="showTextTooltip(event,this)" data-translation="O poder divino é incrível. Feridas incuráveis por poções de cura excelentes foram curadas, assim, num piscar de olhos."></div><div class="text-hotspot" style="left:14.875%;top:44.28125%;width:51.375%;height:1.2239583333333357%" data-text="EXCEPT IT DOESN'T HELP WITH POST-TRAUMATIC STRESS. I NEED TO CHECK UP ON HIM LATER." onclick="showTextTooltip(event,this)" data-translation="Exceto que não ajuda com estresse pós-traumático. Preciso dar uma olhada nele mais tarde."></div><div class="text-hotspot" style="left:34.875%;top:49.744791666666664%;width:45.25%;height:1.2083333333333286%" data-text="THAT TOOK LONGER THAN I EXPECTED. ARE YOU REALLY OKAY?" onclick="showTextTooltip(event,this)" data-translation="Isso demorou mais do que eu esperava. Você está mesmo bem?"></div><div class="text-hotspot" style="left:14.124999999999998%;top:55.65624999999999%;width:70%;height:1.9895833333333335%" data-text="CHUCKLE WORRY NOT. I CAN ENTER THE LABYRINTH AGAIN RIGHT NOW." onclick="showTextTooltip(event,this)" data-translation="Hehe, não se preocupe. Posso entrar no labirinto de novo agora mesmo."></div><div class="text-hotspot" style="left:21.625%;top:59.744791666666664%;width:24.5%;height:.4479166666666667%" data-text="THAT'S A RELIEF." onclick="showTextTooltip(event,this)" data-translation="Que alívio."></div><div class="text-hotspot" style="left:19%;top:60.38541666666667%;width:2.875%;height:.14583333333333334%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:51%;top:62.130208333333336%;width:27.625%;height:.4479166666666667%" data-text="YEAH, FOR SURRRE." onclick="showTextTooltip(event,this)" data-translation="Sim, com certeza."></div><div class="text-hotspot" style="left:35.125%;top:69.875%;width:31.5%;height:.6979166666666666%" data-text="WE'LL MEET UP AGAIN IN TWO DAYS." onclick="showTextTooltip(event,this)" data-translation="Vamos nos encontrar de novo em dois dias."></div><div class="text-hotspot" style="left:54.50000000000001%;top:71.27083333333334%;width:26.999999999999993%;height:.9427083333333286%" data-text="BUT FOR NOW, GET SOME REST." onclick="showTextTooltip(event,this)" data-translation="Mas por agora, descanse um pouco."></div><div class="text-hotspot" style="left:16.25%;top:74.046875%;width:16.875%;height:.4270833333333333%" data-text="SURE THING." onclick="showTextTooltip(event,this)" data-translation="Com certeza."></div><div class="text-hotspot" style="left:0;top:79.96354166666667%;width:8.5%;height:.2916666666666667%" data-text="IN" onclick="showTextTooltip(event,this)" data-translation="IN"></div><div class="text-hotspot" style="left:19.125%;top:86.10416666666667%;width:43.875%;height:.9583333333333428%" data-text="SINCE WE DIDN'T GET TOO MANY MANA STONES FROM THIS TRIP," onclick="showTextTooltip(event,this)" data-translation="Como não conseguimos muitas pedras de mana nesta viagem,"></div><div class="text-hotspot" style="left:41.125%;top:87.30208333333334%;width:44.875%;height:.9635416666666667%" data-text="WE DECIDED TO SPLIT THE SPOILS AFTER WE GOT PAID FOR DOING THE MISSIONS." onclick="showTextTooltip(event,this)" data-translation="decidimos dividir os espólios depois que recebêssemos pelo cumprimento das missões."></div><div class="text-hotspot" style="left:33.25%;top:93.10416666666667%;width:40.125%;height:.6875%" data-text="WE ONLY MADE LIKE 400K STONES PER PERSON AT MAX." onclick="showTextTooltip(event,this)" data-translation="Só conseguimos tipo 400 mil pedras por pessoa no máximo."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/80/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:11.125%;top:2.125%;width:24.5%;height:.47916666666666663%" data-text="THEY CALL IT A TROLL FOR A REASON..." data-translation="Eles chamam isso de troll por um motivo..." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **&quot;call it a [something] for a reason&quot;** é usada para justificar por que algo é chamado de uma certa maneira, geralmente porque a característica é muito evidente. - **They call it a masterpiece for a reason.**"></div><div class="text-hotspot" style="left:28.499999999999996%;top:3.109375%;width:45.5%;height:1.46875%" data-text="GOSH, I'M STILL SO UPSET ABOUT IT. NO ESSENCE OR ANY GOOD LOOT AFTER MAKING US GO THROUGH ALL THAT." data-translation="Nossa, ainda estou tão chateado com isso. Nenhuma essência ou qualquer bom saque depois de nos fazer passar por tudo aquilo." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;Gosh&quot;** é uma interjeição usada para expressar surpresa ou frustração de forma suave. É uma alternativa a &quot;God&quot; em contextos informais. - **Gosh, I didn't expect that to happen!**"></div><div class="text-hotspot" style="left:34.25%;top:11.317708333333334%;width:40%;height:.9583333333333333%" data-text="BJORN, WHAT ARE YOU GOING TO DO NOWWWW?" data-translation="Bjorn, o que você vai fazer agorrrra?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:48.875%;top:15.583333333333332%;width:42%;height:.9479166666666667%" data-text="WE'RE GOING TO GO BACK TO MY ROOM AND SHOWER--" data-translation="Vamos voltar para o meu quarto e tomar um banho--" onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura **&quot;We're going to&quot;** indica um plano ou intenção futura. É muito comum em inglês para falar sobre ações planejadas. - **We're going to visit the museum tomorrow.**"></div><div class="text-hotspot" style="left:13.375%;top:17.348958333333332%;width:59.62499999999999%;height:.19270833333333334%" data-text="T-TOGETHERRRRR?!" data-translation="J-JUNTOS?!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:30.75%;top:18.760416666666664%;width:33.75%;height:.8125%" data-text="FLINCH" data-translation="FLINCH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41%;top:23.880208333333332%;width:40.375%;height:.9479166666666667%" data-text="...SO WE CAN GO SELL OFF THE ITEMS AND STUFF." data-translation="...para que possamos vender os itens e tal." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;Sell off&quot;** é um phrasal verb que significa vender algo, geralmente em grande quantidade ou rapidamente. - **They need to sell off their old stock to make room for new products.**"></div><div class="text-hotspot" style="left:25.5%;top:26.807291666666664%;width:9.875%;height:.17708333333333331%" data-text="OH." data-translation="Oh." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22%;top:30.885416666666664%;width:49%;height:1.4791666666666643%" data-text="WE GOT PLENTY OF REST IN THE LABYRINTH. DON'T EVEN THINK ABOUT RUNNING AWAY." data-translation="Descansamos bastante no labirinto. Nem pense em fugir." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **&quot;Don't even think about&quot;** é usada para proibir ou desencorajar fortemente alguém de fazer algo. - **Don't even think about lying to me.**"></div><div class="text-hotspot" style="left:17.875%;top:38.625%;width:51.24999999999999%;height:.7552083333333334%" data-text="TH-THAT'S NOT WHAT I WAS THINKINGGGG!" data-translation="N-Não era isso que eu estava pensando!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.5%;top:43.33854166666667%;width:63.125%;height:1.21875%" data-text="THEN I'M GOING TO JUST SHOWER AT YOUR PLACE TOO SINCE I'M TOO LAZY TO GO BACK TO MINEEEE." data-translation="Então vou tomar banho na sua casa também, já que estou com preguiça de voltar para a minha." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;Since&quot;** é usado aqui para dar uma razão, significando &quot;porque&quot;. Pode ser usado no início ou no meio da frase. - **Since it's raining, we should stay inside.**"></div><div class="text-hotspot" style="left:46%;top:47.63541666666667%;width:35%;height:.4270833333333333%" data-text="IS THAT ALRIGHTTTT?" data-translation="Tudo bem?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:5.125%;top:51.515625%;width:26.125%;height:.6666666666666667%" data-text="STEP" data-translation="PASSO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:59.25%;top:53.036458333333336%;width:25.624999999999996%;height:.6041666666666666%" data-text="STEP" data-translation="PASSO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.124999999999996%;top:53.598958333333336%;width:12.375%;height:.4322916666666667%" data-text="WHY NOT." data-translation="Por que não." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:29.75%;top:56.223958333333336%;width:42.25%;height:1.2135416666666643%" data-text="THERE'S NO NEED TO WASTE TIME IF WE'RE GOING TO MOVE TOGETHER ANYWAY." data-translation="Não há necessidade de perder tempo se vamos nos mover juntos de qualquer maneira." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **&quot;There's no need to&quot;** é usada para dizer que algo não é necessário. É uma forma educada de sugerir que uma ação pode ser evitada. - **There's no need to rush, we have plenty of time.**"></div><div class="text-hotspot" style="left:60.25%;top:59.70833333333333%;width:24.75%;height:.6614583333333334%" data-text="STEP" data-translation="PASSO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:4.625%;top:67.99479166666667%;width:89.75%;height:2.7135416666666665%" data-text="SURVIVING THE GAME AS A BARBARIAN" data-translation="SOBREVIVENDO AO JOGO COMO UM BÁRBARO" onclick="showTex
