/div><div class="text-hotspot" style="left:26.75%;top:34.692708333333336%;width:45.75%;height:.6875%" data-text="WHAT THE... WHAT HAPPENED WHILE I WAS GONE?" onclick="showTextTooltip(event,this)" data-translation="O que... O que aconteceu enquanto eu estava fora?"></div><div class="text-hotspot" style="left:20.75%;top:37.46875%;width:26.5%;height:.43750000000000006%" data-text="IT'S TERRIBLE!" onclick="showTextTooltip(event,this)" data-translation="É terrível!"></div><div class="text-hotspot" style="left:24.375%;top:38.927083333333336%;width:59.12500000000001%;height:1.2239583333333333%" data-text="SOME BEASTFOLK SHOWED UP, CLAIMED THEY WERE FROM MISSHA'S HOUSE, AND KIDNAPPED HER!" onclick="showTextTooltip(event,this)" data-translation="Alguns homens-fera apareceram, disseram que eram da casa da Missha e a sequestraram!"></div><div class="text-hotspot" style="left:16.875%;top:47.380208333333336%;width:28.249999999999996%;height:.421875%" data-text="KIDNAPPED HER?" onclick="showTextTooltip(event,this)" data-translation="Sequestraram ela?"></div><div class="text-hotspot" style="left:33.75%;top:51.84375%;width:49.25%;height:1.4947916666666643%" data-text="YEAH! MISSHA SAID SHE'LL SPEND THE NIGHT THERE AND COME BACK THIS EVENING," onclick="showTextTooltip(event,this)" data-translation="Sim! Missha disse que passaria a noite lá e voltaria esta noite,"></div><div class="text-hotspot" style="left:11.875%;top:53.932291666666664%;width:59.75%;height:1.2083333333333333%" data-text="SO SHE ASKED ME TO MEET YOU BY THE ENTRANCE TO THE CITY IN THE MORNING IN HER STEAD!" onclick="showTextTooltip(event,this)" data-translation="então ela me pediu para te encontrar na entrada da cidade de manhã no lugar dela!"></div><div class="text-hotspot" style="left:9.75%;top:55.640625%;width:17.75%;height:.4635416666666667%" data-text="EXCEPT I COULDN'T WAKE UP." onclick="showTextTooltip(event,this)" data-translation="Só que eu não consegui acordar."></div><div class="text-hotspot" style="left:3
