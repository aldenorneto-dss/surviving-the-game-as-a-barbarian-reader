é um phrasal verb que significa explorar ou usar algo ou alguém para benefício próprio."></div><div class="text-hotspot" style="left:39.375%;top:29.046875%;width:44.125%;height:.9583333333333333%" data-text="PRETENDING TO BE A POOR PRIESTESS THAT LOST HER COMRADES TO EVIL PLUNDERERS." onclick="showTextTooltip(event,this)" data-translation="FINGINDO SER UMA POBRE SACERDOTISA QUE PERDEU SEUS COMPANHEIROS PARA MALVADOS SAQUEADORES." data-tips="💡 'Pretending to be' significa fingir ser algo ou alguém, uma expressão útil para descrever engano ou disfarce."></div><div class="text-hotspot" style="left:28.749999999999996%;top:39.390625%;width:41.375%;height:.8750000000000001%" data-text="SHE PROBABLY STIRRED THEM UP TO ATTACK US..." onclick="showTextTooltip(event,this)" data-translation="ELA PROVAVELMENTE OS INCITOU A NOS ATACAR..."></div><div class="text-hotspot" style="left:54.50000000000001%;top:43%;width:40.75%;height:1.5520833333333333%" data-text="GRIN" onclick="showTextTooltip(event,this)" data-translation="SORRISO"></div><div class="text-hotspot" style="left:16.5%;top:49.765625%;width:66.5%;height:1.3802083333333357%" data-text="...SO SHE CAN DEVOUR BOTH THEIR AND OUR PARTY ALL TOGETHER LATER!" onclick="showTextTooltip(event,this)" data-translation="...PARA QUE ELA POSSA DEVORAR TANTO O GRUPO DELES QUANTO O NOSSO MAIS TARDE!" data-tips="💡 'So she can devour' usa 'can' para indicar possibilidade ou capacidade, neste caso, o plano da personagem."></div><div class="text-hotspot" style="left:37.625%;top:58.3125%;width:44%;height:1.2604166666666665%" data-text="ENOUGH TALK, NOW'S THE TIME TO RUN!!" onclick="showTextTooltip(event,this)" data-translation="CHEGA DE FALAR, AGORA É HORA DE CORRER!!" data-tips="💡 'Now's the time' é uma expressão que indica que é o momento certo para fazer algo, similar a 'Agora é a hora'."></div><div class="text-hotspot" style="left:63.375%;top:63.44270833333333%;width:31%;height:.8802083333333334%" data-text="DASH" onclick="showTextTooltip(ev xpressão que significa testar ou desafiar habilidades ou capacidades."></div><div class="text-hotspot" style="left:20.5%;top:58.25520833333333%;width:35.375%;height:.9479166666666714%" data-text="ROTMILLER'S SMELLING ABILITY IS WHAT SETS HIM APART." onclick="showTextTooltip(event,this)" data-translation="A HABILIDADE DE CHEIRAR DE ROTMILLER É O QUE O DIFERENCIA." data-tips="💡 'Sets him apart' é uma expressão que significa diferenciar ou destacar alguém dos outros."></div><div class="text-hotspot" style="left:53%;top:59.546875%;width:28.749999999999996%;height:1.1979166666666667%" data-text="HE SAID HE CONSUMED APPROPRIATE ESSENCES TO ENHANCE IT." onclick="showTextTooltip(event,this)" data-translation="ELE DISSE QUE CONSUMIU ESSÊNCIAS APROPRIADAS PARA MELHORÁ-LA." data-tips="💡 'Enhance' significa melhorar ou aumentar, uma palavra útil em contextos de desenvolvimento ou aprimoramento."></div><div class="text-hotspot" style="left:10.375%;top:63.822916666666664%;width:29.875%;height:.8489583333333334%" data-text="SNIFF" onclick="showTextTooltip(event,this)" data-translation="CHEIRAR"></div><div class="text-hotspot" style="left:69%;top:65.04166666666666%;width:23.25%;height:.47395833333333337%" data-text="SNIFF" onclick="showTextTooltip(event,this)" data-translation="CHEIRAR"></div><div class="text-hotspot" style="left:15.625%;top:69.65104166666667%;width:35.375%;height:.21354166666666666%" data-text="THIS WAY!" onclick="showTextTooltip(event,this)" data-translation="POR AQUI!"></div><div class="text-hotspot" style="left:63.375%;top:73.703125%;width:32.25%;height:.8541666666666666%" data-text="TURM" onclick="showTextTooltip(event,this)" data-translation="TURM"></div><div class="text-hotspot" style="left:36.5%;top:75.25%;width:48.25%;height:.9583333333333333%" data-text="HE'S ABLE TO PINPOINT THE DIRECTION AND THE ROUTE TO THE FOURTH FLOOR PRECISELY..." onclick="showTextTooltip(event,this)" data-translation="ELE É CAPAZ DE PRECISAR A DIREÇÃO E A ROTA PARA O QUARTO ANDAR C
