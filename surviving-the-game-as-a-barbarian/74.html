th:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/74/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:17.75%;top:3.5416666666666665%;width:26.75%;height:.6979166666666666%" data-text="...COME CLOSER. IT'S COLD." data-translation="...CHEGA MAIS PERTO. ESTÁ FRIO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:57.75%;top:6.015625%;width:32.75%;height:.703125%" data-text="HUH? I-I SUPPOSE I SHOULDDDD." data-translation="HÃ? E-EU ACHO QUE DEVERIA." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;I suppose&quot; pode ser traduzido como &quot;acho que&quot; ou &quot;suponho que&quot;, e é usado para expressar incerteza ou hesitação. É comum em situações onde alguém está concordando com algo de forma não muito convicta.

- I don't know **whether or not** to go to the party.

- She's **heading to** the airport to catch her flight."></div><div class="text-hotspot" style="left:49.25%;top:22.916666666666664%;width:31.125000000000004%;height:.6822916666666666%" data-text="PIERCE" data-translation="PERFURAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:2.375%;top:23.796875%;width:27.500000000000004%;height:.515625%" data-text="YELP" data-translation="GANIDO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:57.875%;top:24.708333333333332%;width:2.875%;height:.23958333333333331%" data-text="UND" data-translation="UND" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:26%;top:31.156250000000004%;width:14.75%;height:.17708333333333331%" data-text="YEAH." data-translation="SIM." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.5%;top:31.156250000000004%;width:44.875%;height:1.2187499999999964%" data-text="TRY TO GET USED TO THE NEW SWORD AND ESSENCE IN THE MEANTIME." data-translation="TENTE SE ACOSTUMAR COM A NOVA ESPADA E ESSÊNCIA ENQUANTO ISSO." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;In the meantime&quot; é uma expressão que significa &quot;enquanto isso&quot; ou &quot;nesse meio tempo&quot;. É usada para indicar que algo deve ser feito enquanto se espera por outra coisa.

- I'm **pretty used to** the new software now.
- After a few weeks, he was **pretty used to** his new routine."></div><div class="text-hotspot" style="left:57.75%;top:53.776041666666664%;width:28.499999999999996%;height:.5625%" data-text="PSHW" data-translation="PSHW" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:56.99999999999999%;top:60.03125%;width:33.50000000000001%;height:.6927083333333357%" data-text="ARE YOU ABSOLUTELY POSITIVE?" data-translation="VOCÊ TEM CERTEZA ABSOLUTA?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:62.25000000000001%;top:61.651041666666664%;width:8.75%;height:.38020833333333337%" data-text="00" data-translation="00" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:10.375%;top:61.66145833333333%;width:14.875%;height:.10416666666666667%" data-text="W-WELL..." data-translation="B-BOM..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11%;top:62.27604166666667%;width:50.625%;height:.7083333333333333%" data-text="N-NEVER MIND. I'LL KEEP HUNTING THE MONSTERRRS." data-translation="D-DESENCANA. EU VOU CONTINUAR CAÇANDO OS MONSTROSSS." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Never mind&quot; é uma expressão usada para indicar que algo não é importante ou que a pessoa não deve se preocupar com o que foi dito anteriormente. É uma forma de encerrar um tópico ou mudar de assunto.
- **Never mind** about the mistake, let's focus on the solution.
- I was going to tell you something, but **never mind**."></div><div class="text-hotspot" style="left:16.25%;top:66.38020833333333%;width:60.5%;height:.953125%" data-text="DON'T GET THE WRONG IDEA, I'M ONLY ASKING THIS OUT OF CURIOSITTTTTY." data-translation="NÃO ENTENDA ERRADO, EU SÓ ESTOU PERGUNTANDO POR CURIOSIDADEEEE." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Out of curiosity&quot; é uma expressão usada para indicar que alguém está perguntando ou fazendo algo apenas por curiosidade, sem intenções sérias ou consequências.
- I asked him **out of curiosity** about his travels.
- She looked at the book **out of curiosity**."></div><div class="text-hotspot" style="left:21.5%;top:74.32291666666667%;width:57.625%;height:1.7864583333333286%" data-text="YOU'RE NOT MAKING ME KILL ALL OF THEM BECAUSE YOU'RE TOO LAZZZZZY, ARE YOU?" data-translation="VOCÊ NÃO ESTÁ ME FAZENDO MATAR TODOS ELES PORQUE ESTÁ COM PREGUIÇAAA, NÉ?" onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Lazy&quot; é uma gíria para preguiçoso, mas também é usado de forma coloquial para indicar falta de vontade ou motivação para fazer algo. Em contextos mais formais, pode-se usar &quot;unmotivated&quot;.

- She felt **lazy** after a long week of work."></div><div class="text-hotspot" style="left:25.874999999999996%;top:80.08854166666667%;width:45.25%;height:.75%" data-text="...DO YOU HAVE DOUBTS ABOUT ME?" data-translation="...VOCÊ TEM DÚVIDAS SOBRE MIM?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.75%;top:85.828125%;width:43%;height:1.0572916666666714%" data-text="N-NOT AT ALL! WHY WOULD I HAVE DOUBTSSS?" data-translation="N-NEM UM POUCO! POR QUE EU TERIA DÚVIDASSS?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:61.5%;top:87.10416666666667%;width:15.625%;height:.3020833333333333%" data-text="LET'S GET GOINGGG!" data-translation="VAMOS EMBORAAAA!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.625%;top:91.28125%;width:38.375%;height:.7552083333333334%" data-text="FORGET MISSHA'S REASONABLE DOUBT." data-translation="ESQUEÇA A DÚVIDA RAZOÁVEL DA MISSHA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.249999999999996%;top:93.27083333333334%;width:43.25%;height:.6875%" data-text="LOOKING AT HER PROGRESS IS JUST SO SATISFYING." data-translation="VER O PROGRESSO DELA É TÃO SATISFATÓRIO." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Satisfying&quot; é um adjetivo que significa algo que traz satisfação ou prazer. É usado para descrever experiências ou resultados que são agradáveis.
- Completing the project was very **satisfying**.
- Watching the sunset is always a **satisfying** experience."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/74/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:52%;top:1.4635416666666667%;width:1.625%;height:.0625%" data-text="*" data-translation="*" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:49.25%;top:2.0572916666666665%;width:3%;height:.11458333333333333%" data-text="*" data-translation="*" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.125%;top:4.171875%;width:53.37499999999999%;height:.6822916666666666%" data-text="I REALLY DID NOT EXPECT THE GUARDIAN ESSENCE TO DROP THIS QUICKLY." data-translation="EU REALMENTE NÃO ESPERAVA QUE A ESSÊNCIA DO GUARDIÃO CAÍSSE TÃO RÁPIDO." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Did not expect&quot; é uma estrutura usada para indicar surpresa ou algo inesperado. É frequentemente usada para expressar que algo aconteceu de forma diferente do que se pensava.
- I **did not expect** the movie to be so good.
