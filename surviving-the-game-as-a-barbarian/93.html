th:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/93/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:12.125%;top:4.1875%;width:67.125%;height:.619791666666667%" data-text="YOU HAVE DEFEATED ARGOTH. YOU HAVE GAINED 5 EXP POINTS." data-translation="VOCÊ DERROTOU ARGOTH. VOCÊ GANHOU 5 PONTOS DE EXP." onclick="showTextTooltip(event,this)" data-tips="💡 Em jogos, **EXP** é uma abreviação de **experience points**. Esses pontos são usados para medir o progresso de um personagem. É comum em jogos de RPG, onde derrotar inimigos ou completar missões concede EXP ao jogador."></div><div class="text-hotspot" style="left:18.125%;top:5.604166666666666%;width:72.75%;height:.6302083333333333%" data-text="YOU GET A BONUS FOR SLAYING A UNIQUE CREATURE. YOU HAVE GAINED 1 EXP POINTS." data-translation="VOCÊ RECEBE UM BÔNUS POR MATAR UMA CRIATURA ÚNICA. VOCÊ GANHOU 1 PONTO DE EXP." onclick="showTextTooltip(event,this)" data-tips="💡 A palavra **slaying** é um sinônimo de **killing**, mas é mais dramática e frequentemente usada em contextos de fantasia ou mitologia. **Slay** é mais formal que **kill**."></div><div class="text-hotspot" style="left:18.5%;top:11.270833333333332%;width:34.875%;height:.47395833333333337%" data-text="WE KILLED TWO MID-BOSSES." data-translation="NÓS MATAMOS DOIS SUB-CHEFES." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.874999999999996%;top:12.463541666666666%;width:56.625%;height:.96875%" data-text="THAT ROOM SHOULD HAVE APPEARED SOMEWHERE ON THE MAP SINCE WE SATISFIED THE REQUIREMENTS." data-translation="AQUELA SALA DEVERIA TER APARECIDO EM ALGUM LUGAR NO MAPA JÁ QUE CUMPRIMOS OS REQUISITOS." onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura **should have + past participle** é usada para expressar algo que se esperava que tivesse acontecido, mas não aconteceu. Por exemplo: &quot;She should have arrived by now.&quot; significa que esperávamos que ela já tives eira comum de indicar que é o momento de fazer algo. É uma forma casual e direta de dar instruções ou anunciar uma ação. Por exemplo: &quot;Time to go home.&quot;"></div><div class="text-hotspot" style="left:46.375%;top:28.5625%;width:50.125%;height:1.8645833333333335%" data-text="CREAK" data-translation="CREAK" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39%;top:32.43229166666667%;width:36.375%;height:.6875%" data-text="GOOD. LET'S TAKE A QUICK BREAK HERE." data-translation="BOM. VAMOS FAZER UMA PAUSA RÁPIDA AQUI." onclick="showTextTooltip(event,this)" data-tips="💡 A palavra **break** pode ter vários significados, mas aqui significa uma pausa ou descanso. É uma palavra muito comum em contextos de trabalho ou estudo, como em &quot;lunch break&quot; (intervalo para o almoço)."></div><div class="text-hotspot" style="left:65.375%;top:33.71354166666667%;width:16.125%;height:.45312499999999994%" data-text="I'LL BE ON WATCH DUTY." data-translation="EU VOU FICAR DE VIGIA." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **on watch duty** indica que alguém está responsável por vigiar ou monitorar algo. **Duty** é uma palavra que indica responsabilidade ou obrigação. Por exemplo: &quot;He is on night duty at the hospital.&quot;"></div><div class="text-hotspot" style="left:50.125%;top:37.11979166666667%;width:36.625%;height:1.4583333333333286%" data-text="A BREAK? JUST LIKE THAT? WHAT IS THIS ROOM THAT-- し" data-translation="UMA PAUSA? ASSIM DO NADA? O QUE É ESSA SALA QUE-- し" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.75%;top:38.859375%;width:48.125%;height:.96875%" data-text="I WILL EXPLAIN EVERYTHING ONCE WE GET OUT SAFELY." data-translation="Eu vou explicar tudo assim que sairmos em segurança." onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura **once we get out safely** usa **once** para indicar que uma ação acontecerá assim que outra for concluída. É uma forma de condicionar uma ação à conclusão de outra. Por exemplo: &quot;Once we finish dinner, we can watch a movie.&quot;"></div><div class="text-hotspot" style="left:47.5%;top:40.286458333333336%;width:52.375%;height:2.671875%" data-text="SO PLEASE JUST DO AS I SAY FOR NOW. BUMBLE" data-translation="Então, por favor, apenas faça o que eu digo por enquanto. BUMBLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:9.25%;top:47.515625%;width:25.374999999999996%;height:.65625%" data-text="UGH" data-translation="Ugh" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32.5%;top:48.45833333333333%;width:20.875%;height:.171875%" data-text="...OKAY." data-translation="...tá bom." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.875%;top:55.286458333333336%;width:21.875%;height:.4427083333333333%" data-text="A MOMENT LATER." data-translation="Um momento depois." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.25%;top:60.302083333333336%;width:21.625%;height:.18229166666666666%" data-text="WHEW..." data-translation="Ufa..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.875%;top:64.41145833333334%;width:49%;height:.7083333333333333%" data-text="THEY AREN'T ASKING ANY QUESTIONS RIGHT NOW BECAUSE THEY TRUST ME." data-translation="Eles não estão fazendo perguntas agora porque confiam em mim." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **right now** enfatiza que algo está acontecendo no momento presente. É uma maneira de destacar a urgência ou atualidade de uma situação. Por exemplo: &quot;I can't talk right now, I'm busy.&quot;"></div><div class="text-hotspot" style="left:38.125%;top:65.984375%;width:51.125%;height:.6927083333333334%" data-text="BUT WHAT AM I GOING TO TELL THEM LATER? IT'S GIVING ME A HEADACHE." data-translation="Mas o que vou dizer a eles depois? Isso está me dando dor de cabeça." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20%;top:69.14583333333333%;width:21.375%;height:.4166666666666667%" data-text="RUSTLE" data-translation="RUSTLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31%;top:74.17708333333334%;width:38.5%;height:1.2135416666666572%" data-text="HAVING READ ABOUT IT IN A BOOK ISN'T GOING TO SUFFICE THIS TIME." data-translation="Ter lido sobre isso em um livro não vai ser suficiente desta vez." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:64.125%;top:76.08854166666667%;width:25.374999999999996%;height:.3125%" data-text="ESPECIALLY FOR ROTMILLER." data-translation="Especialmente para Rotmiller." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:33.5%;top:81.515625%;width:32.5%;height:.6927083333333286%" data-text="I WILL COME UP WITH A SUITABLE EXCUSE." data-translation="Eu vou inventar uma desculpa adequada." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **come up with** é um phrasal verb que significa pensar ou criar uma ideia ou solução. Por exemplo: &quot;I need to come up with a plan for the project.&quot; É muito usada em contextos de resolução de problemas."></div><div class="text-hotspot" style="left:0;top:87.61458333333333%;width:36.875%;height:1.2604166666666665%" data-text="DADUN" data-translation="DADUN" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:63.125%;top:88.19791666666667%;width:29.75%;height:.5520833333333286%" data-text="BRIEFLY BECAME A GIANT AND PUKED IT OUT" data-translation="Brevemente se tornou um gigante e vomitou." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:44.875%;top:90.91666666666667%;width:11.375%;height:.27083333333333337%" data-text="IF..." data-translation="Se..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:36.875%;top:96.7291666
