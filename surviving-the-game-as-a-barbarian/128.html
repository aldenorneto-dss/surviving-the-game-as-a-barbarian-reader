dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/128/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:26.25%;top:3.239583333333333%;width:45%;height:1.197916666666666%" data-text="...THAT BARBARIAN. WHY ARE YOU HERE?" onclick="showTextTooltip(event,this)" data-translation="...AQUELE BÁRBARO. POR QUE VOCÊ ESTÁ AQUI?"></div><div class="text-hotspot" style="left:34.875%;top:17.020833333333332%;width:29.75%;height:.5625%" data-text="THAT'S MY LINE." onclick="showTextTooltip(event,this)" data-translation="ESSA É A MINHA PERGUNTA."></div><div class="text-hotspot" style="left:28.249999999999996%;top:22.338541666666668%;width:42.375%;height:.59375%" data-text="WHY ARE YOU HERE?!" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ ESTÁ AQUI?!"></div><div class="text-hotspot" style="left:28.625%;top:35.760416666666664%;width:18.625%;height:.6354166666666666%" data-text="??" onclick="showTextTooltip(event,this)" data-translation="??"></div><div class="text-hotspot" style="left:37.125%;top:36.72916666666667%;width:38.625%;height:.9635416666666667%" data-text="IS THAT BARBARIAN SOMEONE YOU KNOW, MA'AM?" onclick="showTextTooltip(event,this)" data-translation="ESSE BÁRBARO É ALGUÉM QUE VOCÊ CONHECE, SENHORA?"></div><div class="text-hotspot" style="left:55.125%;top:38.640625%;width:26.5%;height:.6614583333333334%" data-text="GLANCE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:48.5%;top:44.23958333333333%;width:23.625%;height:.19791666666666669%" data-text="SHUSH." onclick="showTextTooltip(event,this)" data-translation="CALA A BOCA."></div><div class="text-hotspot" style="left:21%;top:49.11979166666667%;width:34.375%;height:.6979166666666666%" data-text="SOMEBODY IS WITH YOU, RIGHT?" onclick="showTextTooltip(event,this)" data-translation="TEM ALGUÉM COM VOCÊ, CERTO?"></div><div class="text-hotspot" style="left:35.25%;top:50.583333333333336%;width:46.75%;height:1.2135416666666643%" data-text="THEY'RE SUPPOSED TO HELP WITH MY JOB FOR KILLING THAT PERSON." onclick="showTextTooltip(event,this)" data-translation="ELES DEVERIAM AJUDAR NO MEU TRABALHO DE MATAR AQUELA PESSOA."></div><div class="text-hotspot" style="left:47.5%;top:55.010416666666664%;width:22.75%;height:.11979166666666666%" data-text="WHERE IS HE?" onclick="showTextTooltip(event,this)" data-translation="ONDE ELE ESTÁ?"></div><div class="text-hotspot" style="left:61.625%;top:56.69791666666667%;width:17.125%;height:.10937500000000001%" data-text="JING-JING?" onclick="showTextTooltip(event,this)" data-translation="JING-JING?"></div><div class="text-hotspot" style="left:43.25%;top:61.72395833333333%;width:47.375%;height:.96875%" data-text="CAN YOU TELL ME WHAT YOUR JOB SPECIFICALLY INVOLVES?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ PODE ME DIZER O QUE SEU TRABALHO ENVOLVE ESPECIFICAMENTE?"></div><div class="text-hotspot" style="left:14.625%;top:63.72395833333333%;width:39.25%;height:1.2083333333333286%" data-text="NO, BECAUSE THAT HAS NOTHING TO DO WITH YOU." onclick="showTextTooltip(event,this)" data-translation="NÃO, PORQUE ISSO NÃO TEM NADA A VER COM VOCÊ."></div><div class="text-hotspot" style="left:1.875%;top:70.08854166666667%;width:78.25%;height:6.265625%" data-text="YOU'RE BEING WAY TOO CAUTIOUS. WHO KNOWS? I MAY HELP YOU OUT WITH IT. P" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ SENDO CAUTELOSO DEMAIS. QUEM SABE? POSSO TE AJUDAR COM ISSO."></div><div class="text-hotspot" style="left:39.5%;top:77.39583333333333%;width:44.25%;height:1.2291666666666714%" data-text="ARE YOU SERIOUS? I REALLY DIDN'T EXPECT TO HEAR THAT FROM YOU." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ SÉRIO? EU REALMENTE NÃO ESPERAVA OUVIR ISSO DE VOCÊ."></div><div class="text-hotspot" style="left:30.625000000000004%;top:81.94270833333334%;width:19%;height:.4270833333333333%" data-text="WAIT" onclick="showTextTooltip(event,this)" data-translation="ESPERA"></div><div class="text-hotspot" style="left:24.375%;top:82.81770833333333%;width:28.625%;height:.4322916666666667%" data-text="ARE YOU PLANNING" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ PLANEJANDO"></div><div class="text-hotspot" style="left:26.625%;top:83.078125%;width:32.625%;height:.6875%" data-text="TO STAB ME IN THE BACK?" onclick="showTextTooltip(event,this)" data-translation="ME APUNHALAR PELAS COSTAS?"></div><div class="text-hotspot" style="left:53.5%;top:84.36979166666667%;width:44.25%;height:.7760416666666666%" data-text="FROWN" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17%;top:87.88020833333333%;width:32%;height:.7447916666666667%" data-text="STAB YOU IN THE BACK?" onclick="showTextTooltip(event,this)" data-translation="TE APUNHALAR PELAS COSTAS?"></div><div class="text-hotspot" style="left:30.25%;top:89.24479166666667%;width:49.875%;height:1.0624999999999858%" data-text="WHAT AN INSULT. I DON'T DO CHEAP STUFF LIKE THAT." onclick="showTextTooltip(event,this)" data-translation="QUE INSULTO. EU NÃO FAÇO COISAS BARATAS ASSIM."></div><div class="text-hotspot" style="left:19.75%;top:95.16666666666667%;width:60.62499999999999%;height:.6927083333333334%" data-text="ALTHOUGH I DID THROW MY MACE AT HER WHILE WE WERE STILL TALKING IN THE SEWERS..." onclick="showTextTooltip(event,this)" data-translation="EMBORA EU TENHA JOGADO MEU MANGUAL NELA ENQUANTO AINDA ESTÁVAMOS CONVERSANDO NOS ESGOTOS..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/128/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:25.874999999999996%;top:10.151041666666668%;width:32.375%;height:.4427083333333333%" data-text="...BUT I DON'T REMEMBER THAT." onclick="showTextTooltip(event,this)" data-translation="...MAS EU NÃO ME LEMBRO DISSO."></div><div class="text-hotspot" style="left:43.375%;top:11.708333333333334%;width:38 %;top:45.296875%;width:53.37499999999999%;height:1.2135416666666665%" data-text="I THOUGHT HE WAS YOUR SUBORDINATE. ARE YOU SURE YOU WANT HIM TO SUFFER?" onclick="showTextTooltip(event,this)" data-translation="PENSEI QUE ELE FOSSE SEU SUBORDINADO. TEM CERTEZA DE QUE QUER QUE ELE SOFRA?"></div><div class="text-hotspot" style="left:35.875%;top:51.953125%;width:43.875%;height:1.484375%" data-text="IT'S UNFAIR FOR A FULLY-GROWN ADULT TO GET INVOLVED IN CHILDREN'S FIGHTS." onclick="showTextTooltip(event,this)" data-translation="NÃO É JUSTO UM ADULTO SE ENVOLVER EM BRIGAS DE CRIANÇAS."></div><div class="text-hotspot" style="left:33.5%;top:56.84375000000001%;width:40.125%;height:.6822916666666666%" data-text="EXCEPT YOU'RE ONLY TWENTY YOURSELF." onclick="showTextTooltip(event,this)" data-translation="EXCETO QUE VOCÊ SÓ TEM VINTE ANOS."></div><div class="text-hotspot" style="left:18.25%;top:63.453125%;width:39.75%;height:.4322916666666667%" data-text="ASKING &quot;SO WHAT?&quot; WITH HIS FACE." onclick="showTextTooltip(event,this)" data-translation="PERGUNTANDO &quot;E DAÍ?&quot; COM A CARA."></div><div class="text-hotspot" style="left:15.625%;top:66.91666666666667%;width:12.875%;height:.10937500000000001%" data-text="ANYWAY." onclick="showTextTooltip(event,this)" data-translation="ENFIM."></div><div class="text-hotspot" style="left:23.375%;top:67.34895833333333%;width:52.625%;height:1.140625%" data-text="AMELIA RAINWALES. WHY ARE YOU IN BIFRON?" onclick="showTextTooltip(event,this)" data-translation="AMELIA RAINWALES. POR QUE VOCÊ ESTÁ EM BIFRON?"></div><div class="text-hotspot" style="left:28.000000000000004%;top:72.47916666666666%;width:25.374999999999996%;height:.45312499999999994%" data-text="YOU TELL ME FIRST." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ME DIZ PRIMEIRO."></div><div class="text-hotspot" style="left:21.375%;top:78.53645833333334%;width:46.5%;height:1.9270833333333335%" data-text="SURE I USED MY SPECIAL ABILITY IN THE CITY AND GOT CAUGH 62%;top:12.765625%;width:30.125%;height:.47395833333333337%" data-text="NOT THAT I THINK SHE KNOWS ABOUT THE LATTER." onclick="showTextTooltip(event,this)" data-translation="NÃO QUE EU ACHE QUE ELA SAIBA SOBRE O ÚLTIMO."></div><div class="text-hotspot" style="left:19.875%;top:17.822916666666664%;width:60%;height:.9427083333333334%" data-text="THE QUESTION IS, CAN THE PERSON WHO WROTE THE BOOK 150 YEARS AGO STILL BE ALIVE?" onclick="showTextTooltip(event,this)" data-translation="A QUESTÃO É: A PESSOA QUE ESCREVEU O LIVRO HÁ 150 ANOS AINDA PODE ESTAR VIVA?"></div><div class="text-hotspot" style="left:65.625%;top:19.776041666666664%;width:28.875%;height:.47395833333333337%" data-text="I NATURALLY ASSUMED HE WAS DEAD." onclick="showTextTooltip(event,this)" data-translation="EU NATURALMENTE PRESUMI QUE ELE ESTAVA MORTO."></div><div class="text-hotspot" style="left:12.75%;top:24.567708333333332%;width:18.875%;height:.171875%" data-text="TO BE FAIR" onclick="showTextTooltip(event,this)" data-translation="PARA SER JUSTO"></div><div class="text-hotspot" style="left:29.75%;top:25.161458333333332%;width:40.25%;height:1.2135416666666665%" data-text="THIS IS A FANTASY WORLD. DRAGONIANS, FOR EXAMPLE, LIVE UP TO A FEW CENTURIES." onclick="showTextTooltip(event,this)" data-translation="ESTE É UM MUNDO FANTÁSTICO. DRAGONIANOS, POR EXEMPLO, VIVEM ATÉ ALGUNS SÉCULOS."></div><div class="text-hotspot" style="left:25.25%;top:29.531249999999996%;width:50.24999999999999%;height:.9270833333333334%" data-text="ANYWAY, IF THAT BASTARD IS REALLY ALIVE..." onclick="showTextTooltip(event,this)" data-translation="DE QUALQUER FORMA, SE AQUELE DESGRAÇADO ESTIVER REALMENTE VIVO..."></div><div class="text-hotspot" style="left:18.375%;top:45.447916666666664%;width:63.5%;height:.5625%" data-text="...AND I CAN SOMEHOW FIND AND MEET HIM..." onclick="showTextTooltip(event,this)" data-translation="...E EU CONSEGUIR ENCONTRÁ-LO E FALAR COM ELE..."></div><div class="text-hotspot" style="left:22.125%;top:49.6
