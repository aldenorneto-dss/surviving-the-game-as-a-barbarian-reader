ick="showTextTooltip(event,this)" data-translation="C"></div><div class="text-hotspot" style="left:30.25%;top:13.84375%;width:47.25%;height:1.2135416666666665%" data-text="I MUST HAVE NAPPED FOR FOUR TO FIVE HOURS, GIVEN I EXITED THE LABYRINTH AROUND NOON." onclick="showTextTooltip(event,this)" data-translation="DEVO TER TIRADO UM COCHILO DE QUATRO A CINCO HORAS, JÁ QUE SAÍ DO LABIRINTO POR VOLTA DO MEIO-DIA."></div><div class="text-hotspot" style="left:17.5%;top:22.75%;width:65.25%;height:1.5052083333333335%" data-text="I SHOULD HEAD TO BLACK WHALE TAVERN TO REUNITE WITH ERWEN, NOW." onclick="showTextTooltip(event,this)" data-translation="DEVO IR PARA A TAVERNA BALEIA NEGRA PARA ME REUNIR COM ERWEN, AGORA."></div><div class="text-hotspot" style="left:23%;top:33.526041666666664%;width:55.5%;height:1.203125%" data-text="BLACK WHALE TAVERN? BUT THAT PLACE CLOSED DOWN ABOUT TEN YEARS AGO." onclick="showTextTooltip(event,this)" data-translation="TAVERNA BALEIA NEGRA? MAS ESSE LUGAR FECHOU HÁ UNS DEZ ANOS."></div><div class="text-hotspot" style="left:51.74999999999999%;top:47.671875%;width:26.875%;height:.421875%" data-text="IT CLOSED DOWN?" onclick="showTextTooltip(event,this)" data-translation="FECHOU?"></div><div class="text-hotspot" style="left:14.499999999999998%;top:52.760416666666664%;width:62.25%;height:1.984375%" data-text="YEAH. THE OWNER'S SON GOT INTO A HABIT OF GAMBLING, SO HE HAD TO SELL THE BUSINESS TO SOMEONE ELSE. EVEN THE NAME CHANGED." onclick="showTextTooltip(event,this)" data-translation="SIM. O FILHO DO DONO PEGOU O HÁBITO DE JOGAR, ENTÃO ELE TEVE QUE VENDER O NEGÓCIO PARA OUTRA PESSOA. ATÉ O NOME MUDOU."></div><div class="text-hotspot" style="left:32.375%;top:55.536458333333336%;width:54.50000000000001%;height:.9479166666666667%" data-text="WHAT A SHAME IT WAS, THOUGH. THAT PLACE LASTED FOR GENERATIONS." onclick="showTextTooltip(event,this)" data-translation="QUE PENA, NO ENTANTO. ESSE LUGAR DURAVA GERAÇÕES."></div><div class="text-hotspot" style="left:21%;top:60.57812500000001%;width:58.5%;height:1.1927083333333286%" data-text="I SEE. IT CONFIRMS MY SUSPICIONS. THE TIMELINE OF WHEN I PLAYED THE GAME IS ACTUALLY YEARS IN THE PAST." onclick="showTextTooltip(event,this)" data-translation="EU VEJO. ISSO CONFIRMA MINHAS SUSPEITAS. A LINHA DO TEMPO DE QUANDO JOGUEI O JOGO É NA VERDADE ANOS NO PASSADO."></div><div class="text-hotspot" style="left:13.375%;top:67.671875%;width:36.375%;height:.96875%" data-text="WHAT'S THE NEW NAME OF THE BUSINESS?" onclick="showTextTooltip(event,this)" data-translation="QUAL É O NOVO NOME DO NEGÓCIO?"></div><div class="text-hotspot" style="left:55.00000000000001%;top:69.21875%;width:32.37499999999999%;height:.734375%" data-text="WAIT, WHAT WAS THE NAME..." onclick="showTextTooltip(event,this)" data-translation="ESPERA, QUAL ERA O NOME..."></div><div class="text-hotspot" style="left:21.875%;top:74.203125%;width:58.375%;height:.5260416666666666%" data-text="AH, I REMEMBER. IT WAS FIDENPUS." onclick="showTextTooltip(event,this)" data-translation="AH, EU LEMBRO. ERA FIDENPUS."></div><div class="text-hotspot" style="left:21.875%;top:82.44791666666667%;width:63%;height:2.1458333333333335%" data-text="FIDENPUS EH? Φανταγιερ" onclick="showTextTooltip(event,this)" data-translation="FIDENPUS, É? Φανταγιερ"></div><div class="text-hotspot" style="left:31.75%;top:93.65104166666667%;width:28.25%;height:.953125%" data-text="SO THIS IS WHERE BLACK WHALE TAVERN USED TO BE." onclick="showTextTooltip(event,this)" data-translation="ENTÃO É AQUI QUE A TAVERNA BALEIA NEGRA FICAVA."></div><div class="text-hotspot" style="left:50.125%;top:94.97395833333333%;width:37.25%;height:.9531250000000142%" data-text="IT IS CERTAINLY DIFFERENT FROM WHAT I SAW IN THE GAME." onclick="showTextTooltip(event,this)" data-translation="É CERTAMENTE DIFERENTE DO QUE EU VI NO JOGO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/14/10.jpg" style="width:100%
