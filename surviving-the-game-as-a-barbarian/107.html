dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/107/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:34.25%;top:3.822916666666667%;width:32.25%;height:.53125%" data-text="STONE OF REVIVAL..." data-translation="PEDRA DA RESSURREIÇÃO..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:0;top:8.015625%;width:99.875%;height:5.005208333333332%" data-text="SIGH ADT" data-translation="SUSPIRO ADT" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.875%;top:13.552083333333334%;width:43.75%;height:.953125%" data-text="...IS AN ITEM THAT CAN BRING A DEAD PERSON BACK TO LIFE." data-translation="...É UM ITEM QUE PODE TRAZER UMA PESSOA MORTA DE VOLTA À VIDA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:36.875%;top:17.791666666666668%;width:38.25%;height:.703125%" data-text="OR IS SUPPOSED TO, ANYWAYS." data-translation="OU PELO MENOS DEVERIA, DE QUALQUER FORMA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.999999999999996%;top:19.645833333333336%;width:11.25%;height:.47395833333333337%" data-text="M" data-translation="M" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13.375%;top:23.197916666666664%;width:44.125%;height:1.203125%" data-text="I-I THOUGHT THERE WAS NO SUCH THING IN A ROGUELIKE GAME..." data-translation="E-EU PENSEI QUE NÃO EXISTIA TAL COISA EM UM JOGO ROGUELIKE..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:49.75%;top:25.453125%;width:39.75%;height:.9635416666666667%" data-text="LIKE I SUGGESTED, IT WAS ONLY A RUMOR!" data-translation="COMO EU SUGERI, ERA APENAS UM RUMOR!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:74.625%;top:26.973958333333332%;width:17.5%;height:.10416666666666667%" data-text="UNTIL NOW." data-translation="ATÉ AGORA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:2.875%;top:30.093750000000004%;width:73.875%;height:3.4895833333333335%" data-text="SLAM IS IT REALLY POSSIBLE TO RESURRECT A DEAD PERSON WITH THAT?!" data-translation="SLAM É REALMENTE POSSÍVEL RESSUSCITAR UMA PESSOA MORTA COM ISSO?!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:26.75%;top:43.255208333333336%;width:12.625%;height:.19270833333333334%" data-text="IT IS." data-translation="É." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24%;top:47.35416666666667%;width:51.74999999999999%;height:.984375%" data-text="ALTHOUGH SPECIAL, RIDICULOUS CONDITIONS MUST BE SATISFIED FIRST, THE EFFECT IS REAL." data-translation="EMBORA CONDIÇÕES ESPECIAIS E RIDÍCULAS DEVAM SER SATISFEITAS PRIMEIRO, O EFEITO É REAL." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13%;top:52.65625000000001%;width:44.125%;height:.6979166666666666%" data-text="TH-THEN DO YOU ALSO KNOW WHERE--" data-translation="E-ENTÃO VOCÊ TAMBÉM SABE ONDE--" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.875%;top:54.37499999999999%;width:20.375%;height:.234375%" data-text="STOP." data-translation="PARE." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.875%;top:61.83333333333333%;width:36.625%;height:.953125%" data-text="I ALREADY PROVIDED A PIECE OF VALUABLE INFORMATION." data-translation="EU JÁ FORNECI UMA INFORMAÇÃO VALIOSA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.875%;top:66.10416666666666%;width:13.625000000000002%;height:.10937500000000001%" data-text="R-RIGHT." data-translation="C-CERTO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.625%;top:66.81770833333334%;width:51.75%;height:1.2031249999999858%" data-text="TH-THEN CAN YOU AT LEAST TELL ME WHAT YOU ARE INTERESTED IN?" data-tran lation="HMM. OH!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.875%;top:94.421875%;width:58.25%;height:.84375%" data-text="I'LL LOOK FORWARD TO OUR NEXT MEETING." data-translation="ESTOU ANSIOSO PARA NOSSA PRÓXIMA REUNIÃO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:7.875%;top:99.3125%;width:34.625%;height:.6822916666666666%" data-text="STEP" data-translation="PASSO" onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/107/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:57.75%;top:1%;width:36.375%;height:1.015625%" data-text="STEP" data-translation="PASSO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.375%;top:13.057291666666668%;width:57.25%;height:.8020833333333333%" data-text="THANKS FOR QUALITY INFORMATION, PEOPLE!" data-translation="OBRIGADO PELAS INFORMAÇÕES DE QUALIDADE, PESSOAL!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.75%;top:20.104166666666668%;width:56.25%;height:1.34375%" data-text="SLAM" data-translation="SLAM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:4.875%;top:28.677083333333332%;width:89.25%;height:2.6458333333333335%" data-text="SURVIVING THE GAME AS A BARBARIAN" data-translation="SOBREVIVENDO AO JOGO COMO UM BÁRBARO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:29.875%;top:31.609375%;width:40.5%;height:.4479166666666667%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | TEAM THE JICK ORIGINAL STORY | Jung Yoon-kang" data-translation="ARTE | MIDNIGHT STUDIO ADAPTAÇÃO | EQUIPE THE JICK HISTÓRIA ORIGINAL | Jung Yoon-kang" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.625%;top:32.666666666666664%;width:55.125%;height:.6458333333333334%" data-text="1
