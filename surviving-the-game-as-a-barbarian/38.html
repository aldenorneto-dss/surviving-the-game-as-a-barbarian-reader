<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>38</title></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/38/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:24%;top:3.598958333333333%;width:24%;height:.6770833333333334%" data-text="ROTMILLER IS A DECENT NAVIGATOR." data-translation="ROTMILLER É UM NAVEGADOR DECENTE." onclick="showTextTooltip(event,this)" data-tips="💡 'Decent' é uma palavra útil que pode significar 'razoável' ou 'aceitável', dependendo do contexto. É menos elogioso que 'good'."></div><div class="text-hotspot" style="left:30.75%;top:4.583333333333333%;width:39.125%;height:1.2083333333333333%" data-text="WE GOT TO THE PORTAL THAT LEADS TO THE SECOND FLOOR IN TEN HOURS." data-translation="CHEGAMOS AO PORTAL QUE LEVA AO SEGUNDO ANDAR EM DEZ HORAS." onclick="showTextTooltip(event,this)" data-tips="💡 'Leads to' é um phrasal verb que significa 'conduz a' ou 'leva a'. Pode ser usado em frases como 'This path leads to the village.'"></div><div class="text-hotspot" style="left:12.25%;top:6.583333333333333%;width:74.625%;height:2.0572916666666665%" data-text="WHIZZ" data-translation="WHIZZ" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.125%;top:12.109375%;width:52.625%;height:1.2291666666666679%" data-text="THE PORTAL'S ALREADY OPEN. SOMEBODY ARRIVED BEFORE US, YET AGAIN." data-translation="O PORTAL JÁ ESTÁ ABERTO. ALGUÉM CHEGOU ANTES DE NÓS, MAIS UMA VEZ." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:56.125%;top:24.932291666666668%;width:30.375000000000004%;height:1.2239583333333333%" data-text="AND I REALLY THOUGHT I TRAVELED FAST." data-translation="E EU REALMENTE ACHEI QUE VIAJEI RÁPIDO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.5%;top:32.26041666666667%;width:49.625%;height:.9427083333333334%" data-text="TEN HOURS ISN'T TOO BAD OF A RECORD EITHER, BUT I GUESS HE'S NOT SATISFIED." data-translation="DEZ HORAS TAMBÉM NÃO É UM RECORDE RUIM, MAS ACHO QUE ELE NÃO ESTÁ SATISFEITO." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão 'isn't too bad of a record' utiliza uma estrutura informal para indicar que algo não é tão ruim. Uma alternativa mais formal seria 'is not a bad record'."></div><div class="text-hotspot" style="left:10.125%;top:38.890625%;width:52.75%;height:1.2083333333333333%" data-text="THERE'S AN ABILITY CALLED WAYFINDER THAT ALLOWS ONE TO PINPOINT THE DIRECTION TO WHICH THE PORTAL SITS." data-translation="HÁ UMA HABILIDADE CHAMADA WAYFINDER QUE PERMITE LOCALIZAR A DIREÇÃO ONDE O PORTAL ESTÁ." onclick="showTextTooltip(event,this)" data-tips="💡 'Pinpoint' significa localizar com precisão. É uma palavra útil em contextos de navegação ou investigação."></div><div class="text-hotspot" style="left:34.5%;top:40.88541666666667%;width:54.125%;height:1.203125%" data-text="I ACTUALLY DID NOT EXPECT MUCH FROM ROTMILLER SINCE HE ISN'T A WAYFINDER, BUT HE LED US PRETTY QUICKLY." data-translation="NA VERDADE, EU NÃO ESPERAVA MUITO DE ROTMILLER JÁ QUE ELE NÃO É UM WAYFINDER, MAS ELE NOS GUIOU BEM RÁPIDO." onclick="showTextTooltip(event,this)" data-tips="💡 'Pretty quickly' é uma expressão coloquial para 'bem rápido'. 'Pretty' aqui intensifica o adjetivo, similar a 'bastante'."></div><div class="text-hotspot" style="left:39.75%;top:46.08333333333333%;width:19.375%;height:.5364583333333334%" data-text="LET'S GO IN." data-translation="VAMOS ENTRAR." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.625%;top:49.40625%;width:2.25%;height:.203125%" data-text="R" data-translation="R" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.75%;top:59%;width:58.625%;height:1.1979166666666643%" data-text="BEING UNABLE TO GET THAT PORTAL OPENING EXPERIENCE POINTS IS ALL I'M UNHAPPY ABOUT, THOUGH." data-translation="NÃO PODER GANHAR A EXPERIÊNCIA DE ABRIR O PORTAL É A ÚNICA COISA QUE ME DEIXA INFELIZ." onclick="showTextTooltip(event,this)" data-tips="💡 'Though' no final da frase é usado para contrastar com a informação anterior, similar a 'no entanto'."></div><div class="text-hotspot" style="left:10.5%;top:70.21875%;width:40.375%;height:.9635416666666667%" data-text="I COULD HAVE GOTTEN THAT IF I CAME HERE WITH AINAR OR ERWEN." data-translation="EU PODERIA TER CONSEGUIDO ISSO SE VIESSE AQUI COM AINAR OU ERWEN." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:44.375%;top:71.6875%;width:41.25%;height:.9583333333333286%" data-text="BUT I DON'T THINK I CAN EXPLOIT THIS GLITCH WITH OTHERS JUST YET." data-translation="MAS NÃO ACHO QUE POSSO EXPLORAR ESSE GLITCH COM OUTROS AINDA." onclick="showTextTooltip(event,this)" data-tips="💡 'Exploit' significa tirar vantagem de algo, geralmente de maneira inteligente ou estratégica."></div><div class="text-hotspot" style="left:15.625%;top:74.4375%;width:2.25%;height:.359375%" data-text="01 0" data-translation="01 0" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.75%;top:74.94270833333333%;width:2.875%;height:.13020833333333331%" data-text="0" data-translation="0" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.124999999999996%;top:78.81770833333334%;width:49.875%;height:1.4583333333333333%" data-text="I SHOULD KEEP THIS INFORMATION TO MYSELF UNTIL I FORM A PARTY I CAN REALLY TRUST." data-translation="DEVO MANTER ESSA INFORMAÇÃO PARA MIM ATÉ FORMAR UM GRUPO EM QUE POSSA REALMENTE CONFIAR." onclick="showTextTooltip(event,this)" data-tips="💡 'Keep this information to myself' é uma expressão que significa não compartilhar a informação com outros. É uma forma de dizer 'guardar segredo'."></div><div class="text-hotspot" style="left:20.875%;top:87.125%;width:57.99999999999999%;height:.75%" data-text="YOU HAVE ENTERED LAIRS OF BEASTS ON SECOND FLOOR." data-translation="VOCÊ ENTROU NAS TOCAS DAS BESTAS NO SEGUNDO ANDAR." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.5%;top:93.61458333333333%;width:21%;height:.5364583333333286%" data-text="LAIRS OF BEASTS." data-translation="TOCAS DAS BESTAS." onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/38/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:17%;top:.65625%;width:46%;height:.953125%" data-text="YUCK! I CAN NEVER GET USED TO THE ODOR OF THIS PLACE." onclick="showTextTooltip(event,this)" data-translation="ECA! NUNCA CONSIGO ME ACOSTUMAR COM O ODOR DESTE LUGAR." data-tips="💡 'Yuck' é uma interjeição usada para expressar nojo ou aversão, similar a 'eca' em português."></div><div class="text-hotspot" style="left:10.625%;top:11.557291666666666%;width:52.5%;height:1.2135416666666665%" data-text="IT IS ONE OF SECOND FLOOR AREAS ACCESSIBLE THROUGH THE EASTERN PORTAL ON THE FIRST FLOOR." onclick="showTextTooltip(event,this)" data-translation="É UMA DAS ÁREAS DO SEGUNDO ANDAR ACESSÍVEIS PELO PORTAL LESTE NO PRIMEIRO ANDAR."></div><div class="text-hotspot" style="left:46.25%;top:13.276041666666666%;width:45.25%;height:.9635416666666667%" data-text="AS THE NAME SUGGESTS, BEAST-TYPE MONSTERS SHOW UP HERE." onclick="showTextTooltip(event,this)" data-translation="COMO O NOME SUGERE, MONSTROS DO TIPO BESTA APARECEM AQUI." data-tips="💡 'As the name suggests' é uma expressão comum para indicar que o nome de algo já dá uma ideia do que se trata."></div><div class="text-hotspot" style="left:52.25%;top:19.166666666666668%;width:34.25%;height:.6927083333333334%" data-text="HOW ARE YOU FAIRING, DWALKIE?" onclick="showTextTooltip(event,this)" data-translation="COMO VOCÊ ESTÁ, DWALKIE?"></div><div class="text-hotspot" style="left:13.750000000000002%;top:30.843749999999996%;width:34.875%;height:.9895833333333333%" data-text="P-PLEASE DON'T TALK TO ME RIGHT NOW..." onclick="showTextTooltip(event,this)" data-translation="P-POR FAVOR, NÃO FALE COMIGO AGORA..."></div><div class="text-hotspot" style="left:47.125%;top:32.65104166666667%;width:36.875%;height:1.0677083333333333%" data-text="АНАНАНА, I KNEW YOU WERE GOING TO SUFFER!" onclick="showTextTooltip(event,this)" data-translation="АНАНАНА, EU SABIA QUE VOCÊ IA SOFRER!"></div><div class="text-hotspot" style="left:15.625%;top:33.890625%;width:26.25%;height:.5625%" data-text="BLERGH" onclick="showTextTooltip(event,this)" data-translation="BLERGH"></div><div class="text-hotspot" style="left:2.5%;top:35.63541666666667%;width:26.375%;height:.640625%" data-text="BLERGH" onclick="showTextTooltip(event,this)" data-translation="BLERGH"></div><div class="text-hotspot" style="left:46.5%;top:38.072916666666664%;width:35.875%;height:.5052083333333333%" data-text="EW, THAT'S NARSTYYYY!" onclick="showTextTooltip(event,this)" data-translation="EW, ISSO É NOJENTO!"></div><div class="text-hotspot" style="left:23.375%;top:40.541666666666664%;width:53.625%;height:.6875%" data-text="THE PROBLEM IS THAT IT REEKS OF WASTE EXCRETED BY THOSE BEASTS." onclick="showTextTooltip(event,this)" data-translation="O PROBLEMA É QUE CHEIRA A RESÍDUOS EXCRETADOS POR ESSAS BESTAS." data-tips="💡 'Reeks of' é uma expressão que significa 'cheira fortemente a', geralmente usada para odores desagradáveis."></div><div class="text-hotspot" style="left:48.125%;top:46.36458333333333%;width:40.75%;height:.4270833333333333%" data-text="ARE YOU OKAY, ROTMILLER?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ BEM, ROTMILLER?"></div><div class="text-hotspot" style="left:12.125%;top:47.5%;width:51.125%;height:1.2083333333333333%" data-text="SINCE YOU SAID YOU CONSUMED THE ESSENCE THAT ENHANCES YOUR ABILITY TO" onclick="showTextTooltip(event,this)" data-translation="JÁ QUE VOCÊ DISSE QUE CONSUMIU A ESSÊNCIA QUE AUMENTA SUA HABILIDADE DE"></div><div class="text-hotspot" style="left:70.375%;top:48.28125%;width:28.875%;height:.7604166666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:28.499999999999996%;top:48.802083333333336%;width:18.375%;height:.16666666666666669%" data-text="SMELL." onclick="showTextTooltip(event,this)" data-translation="CHEIRO."></div><div class="text-hotspot" style="left:43%;top:60.46875000000001%;width:44.5%;height:.9635416666666667%" data-text="I'M FINE. I CAME HERE PLENTY OF TIMES AND GOT USED TO IT." onclick="showTextTooltip(event,this)" data-translation="ESTOU BEM. JÁ VIM AQUI MUITAS VEZES E ME ACOSTUMEI."></div><div class="text-hotspot" style="left:17.25%;top:65.08854166666667%;width:55.625%;height:2.2552083333333286%" data-text="WE'LL BE PASSING THROUGH ROADS RIDDEN WITH PUDDLES OF FILTH, SO PLEASE EXERCISE CAUTION AS YOU FOLLOW ME IF YOU DON'T WISH TO GET DIRTY." onclick="showTextTooltip(event,this)" data-translation="VAMOS PASSAR POR CAMINHOS CHEIOS DE POÇAS DE IMUNDÍCIE, ENTÃO, POR FAVOR, TENHAM CUIDADO AO ME SEGUIR SE NÃO QUISEREM SE SUJAR." data-tips="💡 'Exercise caution' é uma forma mais formal de dizer 'tenha cuidado'."></div><div class="text-hotspot" style="left:22.625%;top:73.96354166666667%;width:56.125%;height:.9427083333333334%" data-text="AH, IT FEELS GOOD TO HAVE A RELIABLE NAVIGATOR WITHIN THE PARTY. I'M SO GLAD I RECRUITED HIM." onclick="showTextTooltip(event,this)" data-translation="AH, É BOM TER UM NAVEGADOR CONFIÁVEL NO GRUPO. ESTOU TÃO FELIZ POR TÊ-LO RECRUTADO." data-tips="💡 'I'm so glad I recruited him' usa 'glad' para expressar satisfação ou felicidade, similar a 'feliz'."></div><div class="text-hotspot" style="left:58.25%;top:75.66145833333333%;width:33.75%;height:.359375%" data-text="8-YEAR VETERAN, EH?" onclick="showTextTooltip(event,this)" data-translation="VETERANO DE 8 ANOS, HEIN?"></div><div class="text-hotspot" style="left:59.62499999999999%;top:80.13020833333333%;width:36.25%;height:.8645833333333334%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:4.875%;top:83.78645833333334%;width:36.75%;height:.7760416666666666%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:17%;top:89.11979166666667%;width:43.875%;height:.6979166666666666%" data-text="THE LAIRS OF BEASTS CONSISTS OF A SERIES OF RAVINES," onclick="showTextTooltip(event,this)" data-translation="AS TOCAS DAS BESTAS CONSISTEM EM UMA SÉRIE DE RAVINAS,"></div><div class="text-hotspot" style="left:37.125%;top:90.28125%;width:47.5%;height:.9635416666666714%" data-text="AND WE MUST JOURNEY THROUGH WHAT LOOKS LIKE A MAZE FROM ABOVE." onclick="showTextTooltip(event,this)" data-translation="E DEVEMOS PERCORRER O QUE PARECE UM LABIRINTO VISTO DE CIMA." data-tips="💡 'What looks like a maze from above' usa uma estrutura de comparação para descrever a aparência de algo."></div><div class="text-hotspot" style="left:11.25%;top:97.171875%;width:49.875%;height:.953125%" data-text="THERE ARE NO TRAPS, BUT THE ROLE OF THE SCOUT IS MORE CRUCIAL THAN EVER." onclick="showTextTooltip(event,this)" data-translation="NÃO HÁ ARMADILHAS, MAS O PAPEL DO BATEDOR É MAIS CRUCIAL DO QUE NUNCA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/38/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:38.875%;top:1.890625%;width:49.875%;height:1.2395833333333333%" data-text="MONSTERS ON THE SECOND FLOOR POSE PRETTY MUCH NO THREAT TO A PARTY OF THIS CALIBER." data-translation="OS MONSTROS NO SEGUNDO ANDAR NÃO REPRESENTAM MUITA AMEAÇA PARA UM GRUPO DESTE CALIBRE." onclick="showTextTooltip(event,this)" data-tips="💡 'Pose pretty much no threat' significa que algo não representa uma ameaça significativa. É uma forma de minimizar o perigo."></div><div class="text-hotspot" style="left:21.375%;top:9.369791666666668%;width:49.75%;height:.9427083333333334%" data-text="YOU HAVE DEFEATED GIANT BLADE WOLF. YOU HAVE GAINED 1 EXP POINTS." data-translation="VOCÊ DERROTOU O LOBO LÂMINA GIGANTE. VOCÊ GANHOU 1 PONTO DE EXP." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.375%;top:19.911458333333336%;width:52.25%;height:.9375%" data-text="YOU HAVE DEFEATED WEREWOLF. YOU HAVE GAINED 2 EXP POINTS." data-translation="VOCÊ DERROTOU O LOBISOMEM. VOCÊ GANHOU 2 PONTOS DE EXP." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15%;top:22.020833333333336%;width:61.625%;height:.6875%" data-text="YOU HAVE DEFEATED SABER TIGER. YOU HAVE GAINED 2 EXP POINTS." data-translation="VOCÊ DERROTOU O TIGRE SABRE. VOCÊ GANHOU 2 PONTOS DE EXP." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.75%;top:35.17708333333333%;width:67.25%;height:.671875%" data-text="YOU HAVE DEFEATED WALL-MOLE RAT. YOU HAVE GAINED 1 EXP POINTS." data-translation="VOCÊ DERROTOU O RATO-TOUPEIRA DE PAREDE. VOCÊ GANHOU 1 PONTO DE EXP." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.375%;top:46.666666666666664%;width:51.37500000000001%;height:1.2135416666666665%" data-text="NOT ONLY THAT. THANKS TO DWALKIE'S DANGER ALERT SPELL AND FOUR WARRIORS TO TAKE TURNS ON WATCH DUTY," data-translation="NÃO SÓ ISSO. GRAÇAS AO FEITIÇO DE ALERTA DE PERIGO DO DWALKIE E QUATRO GUERREIROS PARA REVEZAR NA VIGILÂNCIA," onclick="showTextTooltip(event,this)" data-tips="💡 'Take turns on watch duty' significa que as pessoas se revezam na tarefa de vigiar."></div><div class="text-hotspot" style="left:43.625%;top:48.260416666666664%;width:36.75%;height:.9375%" data-text="I'M ALSO ABLE TO GET ABOUT SIX HOURS OF SLEEP EACH NIGHT." data-translation="TAMBÉM CONSIGO DORMIR CERCA DE SEIS HORAS TODAS AS NOITES." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32.125%;top:55.59375%;width:46.375%;height:.953125%" data-text="WHY DO WE EVEN NEED SOMEONE TO BE ON WATCH DUTY THOUGH?" data-translation="POR QUE PRECISAMOS DE ALGUÉM DE VIGIA, ENTÃO?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:61%;top:57.119791666666664%;width:34.875%;height:.3489583333333333%" data-text="I GOT MY DANGER ALERT SPELL..." data-translation="EU TENHO MEU FEITIÇO DE ALERTA DE PERIGO..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.75%;top:61.244791666666664%;width:74.375%;height:2.874999999999993%" data-text="HAHA, IT'S NOT THAT WE DON'T TRUST YOUR ABILITY TO CAST SPELLS. BUT THE DANGER ALERT SPELL ONLY DETECTS AND WARNS AGAINST APPROACHING MONSTERS." data-translation="HAHA, NÃO É QUE NÃO CONFIAMOS NA SUA CAPACIDADE DE LANÇAR FEITIÇOS. MAS O FEITIÇO DE ALERTA DE PERIGO SÓ DETECTA E AVISA CONTRA MONSTROS QUE SE APROXIMAM." onclick="showTextTooltip(event,this)" data-tips="💡 'Warns against' é uma expressão que significa alertar sobre algo, geralmente um perigo ou ameaça."></div><div class="text-hotspot" style="left:16.25%;top:69.75520833333333%;width:39.875%;height:.4270833333333333%" data-text="I DON'T THINK I UNDERSTAND." data-translation="NÃO ACHO QUE ENTENDI." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.75%;top:74.48958333333333%;width:59%;height:1.78125%" data-text="OTHER ADVENTURERS ARE FAR MORE DANGEROUS THAN MONSTERS WITHIN THE LABYRINTH." data-translation="OUTROS AVENTUREIROS SÃO MUITO MAIS PERIGOSOS DO QUE MONSTROS DENTRO DO LABIRINTO." onclick="showTextTooltip(event,this)" data-tips="💡 'Far more dangerous' é uma maneira de intensificar o adjetivo 'dangerous', indicando que algo é muito mais perigoso."></div><div class="text-hotspot" style="left:38.625%;top:81.23958333333333%;width:6.625%;height:.2864583333333333%" data-text="!!" data-translation="!!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.25%;top:86.83333333333333%;width:22.875%;height:.45312499999999994%" data-text="O-OH, REALLY?" data-translation="O-OH, SÉRIO?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:73.875%;top:91.03645833333334%;width:2.25%;height:.078125%" data-text="H" data-translation="H" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19%;top:91.77083333333333%;width:37%;height:.43750000000000006%" data-text="YEAH. AND YOU SHOULD" data-translation="SIM. E VOCÊ DEVERIA" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.25%;top:92.03125%;width:44.625%;height:.9583333333333428%" data-text="GET SOME SLEEP AS WELL WHILE YOU CAN." data-translation="DORMIR TAMBÉM ENQUANTO PODE." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:43.125%;top:93.3125%;width:45.5%;height:1.2083333333333286%" data-text="LIKE I SAID BEFORE, A MAGE DOES NOT NEED TO BE ON WATCH DUTY." data-translation="COMO EU DISSE ANTES, UM MAGO NÃO PRECISA FICAR DE VIGIA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.75%;top:95.47395833333333%;width:35.75%;height:.4322916666666856%" data-text="I-I UNDERSTAND." data-translation="E-EU ENTENDO." onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/38/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:6%;top:.020833333333333336%;width:28.875%;height:.4479166666666667%" data-text="GLANCE" data-translation="OLHAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.125%;top:4.619791666666666%;width:39.5%;height:1.2135416666666679%" data-text="PERHAPS THIS ADVENTURE WILL BE THE LAST TIME THAT MAGE TRAVELS WITH US." data-translation="TALVEZ ESTA AVENTURA SEJA A ÚLTIMA VEZ QUE ESSE MAGO VIAJE CONOSCO." onclick="showTextTooltip(event,this)" data-tips="💡 'Perhaps' é uma palavra útil que significa 'talvez' e é usada para expressar incerteza ou possibilidade, assim como 'maybe'."></div><div class="text-hotspot" style="left:35.5%;top:15.833333333333332%;width:28.749999999999996%;height:.703125%" data-text="DAY 2, A LITTLE AFTER NOON." data-translation="DIA 2, UM POUCO DEPOIS DO MEIO-DIA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:7.375%;top:21.838541666666668%;width:57.99999999999999%;height:1.2239583333333333%" data-text="THERE IS A PORTAL THAT LEADS TO THE THIRD FLOOR, AFTER WE GO PAST THIS AREA." data-translation="HÁ UM PORTAL QUE LEVA AO TERCEIRO ANDAR, DEPOIS QUE PASSARMOS POR ESTA ÁREA." onclick="showTextTooltip(event,this)" data-tips="💡 'Go past' é um phrasal verb que significa 'passar por', como em 'We need to go past the store to reach the park'."></div><div class="text-hotspot" style="left:37.75%;top:23.536458333333332%;width:51.875%;height:1.4739583333333357%" data-text="THAT'S WHERE TIER 7 TO 8 MONSTERS, WHICH WE'RE AIMING TO HUNT DOWN, RESIDE." data-translation="É LÁ QUE OS MONSTROS DE NÍVEL 7 A 8, QUE ESTAMOS VISANDO CAÇAR, RESIDEM." onclick="showTextTooltip(event,this)" data-tips="💡 'Aim to' significa 'visar' ou 'ter a intenção de', e é usado para indicar um objetivo ou intenção."></div><div class="text-hotspot" style="left:26%;top:34.932291666666664%;width: 86%" data-text="I DON'T THINK IT'S PRECISELY US THEY WERE AFTER." onclick="showTextTooltip(event,this)" data-translation="NÃO ACHO QUE SEJA PRECISAMENTE NÓS QUE ELES ESTAVAM ATRÁS." data-tips="💡 'Precisely' é um adjetivo que significa 'precisamente' ou 'exatamente', usado para dar ênfase à exatidão."></div><div class="text-hotspot" style="left:9.5%;top:79.8125%;width:62.625%;height:1.7239583333333286%" data-text="LURING MONSTERS TO THE PORTAL IS ACTUALLY A METHOD FREQUENTLY USED BY PLUNDERERS TO ATTACK INNOCENT ADVENTURERS." onclick="showTextTooltip(event,this)" data-translation="ATRAVESSAR MONSTROS PARA O PORTAL É NA VERDADE UM MÉTODO FREQUENTEMENTE USADO POR SAQUEADORES PARA ATACAR AVENTUREIROS INOCENTES." data-tips="💡 'Luring' é um verbo que significa 'atrair' ou 'seduzir'. É frequentemente usado em contextos de armadilhas ou enganos."></div><div class="text-hotspot" style="left:37.875%;top:81.84895833333333%;width:53.125%;height:1.2135416666666714%" data-text="THEY TRY TO TAKE ADVANTAGE OF WHEN OTHERS ARE LEAST EXPECTING A FIGHT." onclick="showTextTooltip(event,this)" data-translation="ELES TENTAM APROVEITAR QUANDO OS OUTROS MENOS ESPERAM UMA LUTA." data-tips="💡 'Take advantage of' é um phrasal verb que significa 'aproveitar-se de'. Exemplo: 'He took advantage of the situation to make a profit.'"></div><div class="text-hotspot" style="left:23.625%;top:91.1875%;width:54.625%;height:1.1458333333333333%" data-text="DOESN'T IT MEAN WE HAVE TO FIND AND KILL THERRRRRM?" onclick="showTextTooltip(event,this)" data-translation="NÃO SIGNIFICA QUE TEMOS QUE ENCONTRAR E MATÁ-LOS?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/38/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:26.125%;top:.49479166666666663%;width:61.625%;height:1.4739583333333335%" data-text="WE CAN EVEN MAKE MONEY BY GETTING RID OF PLUNDERERRRS, RRRIGHT?" data-translation="PODEMOS ATÉ GANHAR DINHEIRO ELIMINANDO SAQUEADORES, CERTO?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.125%;top:5.588541666666667%;width:50.24999999999999%;height:1.7343750000000002%" data-text="YOU'RE NOT WRONG, BUT WE DON'T HAVE ANY EVIDENCE AGAINST THEM EVEN IF WE SOMEHOW MANAGE TO FIND THEM." data-translation="VOCÊ NÃO ESTÁ ERRADO, MAS NÃO TEMOS NENHUMA PROVA CONTRA ELES, MESMO QUE DE ALGUMA FORMA CONSIGAMOS ENCONTRÁ-LOS." onclick="showTextTooltip(event,this)" data-tips="💡 'Even if' é uma conjunção usada para introduzir uma condição hipotética. É similar a 'mesmo que' em português."></div><div class="text-hotspot" style="left:32.375%;top:7.963541666666667%;width:57.625%;height:1.239583333333333%" data-text="THERE'S A CHANCE WE MIGHT BE FRAMED FOR TRYING TO PLUNDER THEM INSTEAD, TOO." data-translation="HÁ UMA CHANCE DE QUE POSSAMOS SER ACUSADOS DE TENTAR SAQUEÁ-LOS EM VEZ DISSO." onclick="showTextTooltip(event,this)" data-tips="💡 'Framed' é um termo que significa 'acusado injustamente'. É usado quando alguém é falsamente acusado de um crime."></div><div class="text-hotspot" style="left:19.875%;top:16.244791666666668%;width:54.75%;height:.9583333333333333%" data-text="ARRRRGH, BUT THE DEAD CAN'T SPEAK AND DEFEND THEMSELVVVVES!" data-translation="ARRRRGH, MAS OS MORTOS NÃO PODEM FALAR E SE DEFENDER!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.625%;top:20.984375%;width:68.625%;height:2.0104166666666665%" data-text="... THE BEST WE CAN DO IS TO PUT UP SOME KIND OF A WARNING SIGN TO WATCH OUT FOR PLUNDERERS BY THE ENTRANCE OF THE PORTAL ON THE SECOND FLOOR." data-translation="... O MELHOR QUE PODEMOS FAZER É COLOCAR ALGUM TIPO DE AVISO PARA TOMAR CUIDADO COM SAQUEADORES NA ENTRADA DO PORTAL NO SEGUNDO ANDAR." onclick="showTextTooltip(event,this)" data-tips="💡 'Put up' é um phrasal verb que significa 'colocar' ou 'erguer'. Exemplo: 'They put up a new sign on the road.'"></div><div class="text-hotspot" style="left:51%;
