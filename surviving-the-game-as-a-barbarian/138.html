his)" data-translation="TEMOS QUE FAZER ISSO SOZINHOS AGORA. NÃO HÁ MAIS NINGUÉM EM QUEM CONFIAR."></div><div class="text-hotspot" style="left:9.125%;top:43.432291666666664%;width:89.625%;height:3.760416666666667%" data-text="HOOM" onclick="showTextTooltip(event,this)" data-translation="HOOM"></div><div class="text-hotspot" style="left:36.125%;top:49.776041666666664%;width:27.125%;height:.43750000000000006%" data-text="...THEY'RE GONE." onclick="showTextTooltip(event,this)" data-translation="...ELES SE FORAM."></div><div class="text-hotspot" style="left:44.625%;top:60.73437499999999%;width:38.375%;height:.9531250000000071%" data-text="WHAT ARE WE GOING TO DO NOW, MR. YANDEL?" onclick="showTextTooltip(event,this)" data-translation="O QUE VAMOS FAZER AGORA, SR. YANDEL?"></div><div class="text-hotspot" style="left:11.5%;top:64.04166666666666%;width:76.625%;height:.26041666666666663%" data-text="WE HAVE TWO CHOICES." onclick="showTextTooltip(event,this)" data-translation="TEMOS DUAS OPÇÕES."></div><div class="text-hotspot" style="left:9.5%;top:69.71875%;width:57.99999999999999%;height:.9427083333333334%" data-text="ONE IS BRUTE-FORCING OUR WAY TO THE CENTER THROUGH THE ROUTE VERSYL DECIDED NOT TO TAKE." onclick="showTextTooltip(event,this)" data-translation="UMA É FORÇAR NOSSO CAMINHO ATÉ O CENTRO PELO CAMINHO QUE VERSYL DECIDIU NÃO SEGUIR."></div><div class="text-hotspot" style="left:3.125%;top:71.46354166666666%;width:50.375%;height:.3541666666666714%" data-text="NOARK SOLDIERS &amp; Lu ?? HP:" onclick="showTextTooltip(event,this)" data-translation="SOLDADOS NOARK &amp; Lu ?? HP:"></div><div class="text-hotspot" style="left:54.50000000000001%;top:73.13541666666666%;width:41.87499999999999%;height:.3541666666666714%" data-text="BJORN YANDEL $: Lu 5 HP:" onclick="showTextTooltip(event,this)" data-translation="BJORN YANDEL $: Lu 5 HP:"></div><div class="text-hotspot" style="left:67.375%;top:74.44270833333333%;width:13.375%;height:.13020833333333331%" data-text="FIGHT" onclick="showTextTooltip(event,this)" data-translation="LUTAR"></div><div class="text-hotspot" style="left:9.125%;top:74.52083333333334%;width:45.75%;height:.390625%" data-text="Wild NOARK SOLDIERS appeared!" onclick="showTextTooltip(event,this)" data-translation="Soldados NOARK selvagens apareceram!"></div><div class="text-hotspot" style="left:67.25%;top:74.703125%;width:8.125%;height:.125%" data-text="RUN" onclick="showTextTooltip(event,this)" data-translation="CORRER"></div><div class="text-hotspot" style="left:37.5%;top:76.22916666666667%;width:47.5%;height:.6875%" data-text="OR WE CAN TURN BACK AND HEAD TO THE OUTSKIRTS INSTEAD." onclick="showTextTooltip(event,this)" data-translation="OU PODEMOS VOLTAR E IR PARA A PERIFERIA EM VEZ DISSO."></div><div class="text-hotspot" style="left:16.25%;top:80.83854166666666%;width:44.25%;height:.7083333333333333%" data-text="THE CENTRAL AREA IS PROBABLY WHERE THE BATTLE IS FIERCEST." onclick="showTextTooltip(event,this)" data-translation="A ÁREA CENTRAL PROVAVELMENTE É ONDE A BATALHA ESTÁ MAIS INTENSA."></div><div class="text-hotspot" style="left:33.5%;top:82.40104166666666%;width:52.75%;height:.6822916666666666%" data-text="HIDING IN THE OUTSKIRTS ISN'T ACTUALLY THE WORST IDEA." onclick="showTextTooltip(event,this)" data-translation="SE ESCONDER NA PERIFERIA NÃO É REALMENTE A PIOR IDEIA."></div><div class="text-hotspot" style="left:15.5%;top:90.10416666666666%;width:38.125%;height:.953125%" data-text="WHO KNOWS? WE MIGHT BE ABLE TO SURVIVE UNTIL THE LABYRINTH CLOSES." onclick="showTextTooltip(event,this)" data-translation="QUEM SABE? PODEMOS CONSEGUIR SOBREVIVER ATÉ O LABIRINTO FECHAR."></div><div class="text-hotspot" style="left:34.875%;top:95.30208333333333%;width:30.375000000000004%;height:.25%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/138/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:61.875%;top:.5260416666666666%;width:7.875%;height:.2552083333333333%" data-text="??" onclick="showTextTooltip(event,this)" data-translation="??"></div><div class="text-hotspot" style="left:17.25%;top:4.390625%;width:65.75%;height:.9114583333333334%" data-text="...IT'S IMPOSSIBLE TO GATHER INTELLIGENCE BY HIDING." onclick="showTextTooltip(event,this)" data-translation="...É IMPOSSÍVEL COLETAR INFORMAÇÕES SE ESCONDENDO."></div><div class="text-hotspot" style="left:23.625%;top:10.104166666666666%;width:52.75%;height:.9635416666666667%" data-text="TO MAKE MATTERS WORSE, THE LORD OF THE FLOOR SHOULD SHOW UP ON DAY THREE." onclick="showTextTooltip(event,this)" data-translation="PARA PIORAR, O SENHOR DO ANDAR DEVE APARECER NO TERCEIRO DIA."></div><div class="text-hotspot" style="left:61.625%;top:12.151041666666666%;width:29.875%;height:.3177083333333333%" data-text="IF WE RUN INTO IT, WE'LL ALL DIE." onclick="showTextTooltip(event,this)" data-translation="SE NOS DEPARARMOS COM ELE, TODOS NÓS VAMOS MORRER."></div><div class="text-hotspot" style="left:11.375%;top:21.46875%;width:61.125%;height:1.8229166666666643%" data-text="ALRIGHT I NEED EVERYONE'S ATTENTION FOR A MOMENT." onclick="showTextTooltip(event,this)" data-translation="CERTO, PRECISO DA ATENÇÃO DE TODOS POR UM MOMENTO."></div><div class="text-hotspot" style="left:77.125%;top:31.770833333333332%;width:3.75%;height:.15104166666666666%" data-text="?" onclick="showTextTooltip(event,this)" data-translation="?"></div><div class="text-hotspot" style="left:25.624999999999996%;top:32.265625%;width:6.75%;height:.15625%" data-text="??" onclick="showTextTooltip(event,this)" data-translation="??"></div><div class="text-hotspot" style="left:6.5%;top:35.109375%;width:31.5%;height:.78125%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.375%;top:36.94791666666667%;width:69.25%;height:1.624999999999993%" data-text="LET'S ALL TAKE TURNS AND SHARE OUR ADVENTURER TIER, ESSENCES CONSUMED, AND SPECIAL ABILITIES." onclick="showTextTooltip(event,this)" data-translation="VAMOS TODOS NOS TURNAR E COMPARTILHAR NOSSO NÍVEL DE AVENTUREIRO, ESSÊNCIAS CONSUMIDAS E HABILIDADES ESPECIAIS."></div><div class="text-hotspot" style="left:61%;top:39.18229166666667%;width:32.75%;height:.9114583333333334%" data-text="STEP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:5.375%;top:41.744791666666664%;width:65.5%;height:2.0729166666666643%" data-text="SHOUT YOU CAN'T SERIOUSLY BE EXPECTING US TO SHARE ALL OUR SECRETS!" onclick="showTextTooltip(event,this)" data-translation="GRITO VOCÊ NÃO PODE ESTAR SÉRIO EM ESPERAR QUE COMPARTILHEMOS TODOS OS NOSSOS SEGREDOS!"></div><div class="text-hotspot" style="left:94.625%;top:46.39583333333333%;width:3.25%;height:.057291666666666664%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:94.25%;top:46.703125%;width:1%;height:.046875%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:55.50000000000001%;top:51.317708333333336%;width:28.749999999999996%;height:.9427083333333334%" data-text="WHY NOT? WE'RE IN A DIFFICULT SITUATION." onclick="showTextTooltip(event,this)" data-translation="POR QUE NÃO? ESTAMOS EM UMA SITUAÇÃO DIFÍCIL."></div><div class="text-hotspot" style="left:30.125%;top:52.869791666666664%;width:43.625%;height:.9479166666666667%" data-text="IT MAKES SENSE TO WORK TOGETHER AS ONE BIG TEAM." onclick="showTextTooltip(event,this)" data-translation="FAZ SENTIDO TRABALHARMOS JUNTOS COMO UM GRANDE TIME."></div><div class="text-hotspot" style="left:49%;top:57.60937499999999%;width:38.75%;height:1.2083333333333333%" data-text="YOU SPEAK AS IF YOU'RE OUR LEADER OR SOMETHING...!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ FALA COMO SE FOSSE NOSSO LÍDER OU ALGO ASSIM...!"></div><div class="text-hotspot" style="left:5%;top:59.223958333333336%;width:14.75%;height:.47916666666666663%" data-text="STOP BEING SO PETTY." onclick="showTextTooltip(event,this)" data-translation="PARE DE SER TÃO MESQUINHO."></div><div class="text-hotspot" style="left:22.25%;top:59.911458333333336%;width:28.249999999999996%;height:.6822916666666666%" data-text="WHY DOES THAT EVEN MATTER?" onclick="showTextTooltip(event,this)" data-translation="POR QUE ISSO IMPORTA?"></div><div class="text-hotspot" style="left:10.625%;top:66.27604166666666%;width:50.5%;height:1.2083333333333333%" data-text="WHAT KIND OF IDIOT CARES SO MUCH ABOUT THAT, WHEN OUR LIFE IS ON THE LINE?" onclick="showTextTooltip(event,this)" data-translation="QUE TIPO DE IDIOTA SE IMPORTA TANTO COM ISSO, QUANDO NOSSA VIDA ESTÁ EM JOGO?"></div><div class="text-hotspot" style="left:54.625%;top:68.08333333333333%;width:44.25%;height:.9843750000000142%" data-text="2.4 25 WH-WHAT?!" onclick="showTextTooltip(event,this)" data-translation="2.4 25 O-O QUE?!"></div><div class="text-hotspot" style="left:27%;top:75%;width:58.875%;height:1.0625%" data-text="IF THAT MEANS THAT MUCH TO YOU, WE'LL DECIDE THE LEADER FIRST." onclick="showTextTooltip(event,this)" data-translation="SE ISSO SIGNIFICA TANTO PARA VOCÊ, VAMOS DECIDIR O LÍDER PRIMEIRO."></div><div class="text-hotspot" style="left:14.75%;top:76.796875%;width:34%;height:.46875%" data-text="SHOULD WE VOTE?" onclick="showTextTooltip(event,this)" data-translation="DEVEMOS VOTAR?"></div><div class="text-hotspot" style="left:34.25%;top:83.43229166666667%;width:26.75%;height:.22395833333333334%" data-text="ARGH...!" onclick="showTextTooltip(event,this)" data-translation="ARGH...!"></div><div class="text-hotspot" style="left:24.25%;top:87.81770833333333%;width:40.75%;height:.43750000000000006%" data-text="THAT WON'T BE NECESSARY," onclick="showTextTooltip(event,this)" data-translation="NÃO SERÁ NECESSÁRIO,"></div><div class="text-hotspot" style="left:38.5%;top:89.46875%;width:43.25%;height:.9583333333333333%" data-text="SINCE MY PARTY WILL VOTE FOR YOU IF THAT HAPPENS." onclick="showTextTooltip(event,this)" data-translation="JÁ QUE MEU GRUPO VOTARÁ EM VOCÊ SE ISSO ACONTECER."></div><div class="text-hotspot" style="left:41.625%;top:96.25%;width:35%;height:.4583333333333333%" data-text="WHAT DO YOU MEAN?!" onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ QUER DIZER?!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/138/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:19.375%;top:.6822916666666666%;width:4.125%;height:.234375%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:22.375%;top:.9791666666666667%;width:48.625%;height:1.5052083333333333%" data-text="ARE YOU OUT OF YOUR MIND? YOU CAN'T VOTE FOR A BARBARIAN LEADER! U" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ LOUCO? NÃO PODE VOTAR EM UM LÍDER BÁRBARO! U"></div><div class="text-hotspot" style="left:40.5%;top:7.729166666666666%;width:46.625%;height:1.2395833333333333%" data-text="WELL, I'M NOT VERY GOOD AT GIVING INSTRUCTIONS TO OTHERS, SO..." onclick="showTextTooltip(event,this)" data-translation="BEM, EU NÃO SOU MUITO BOM EM DAR INSTRUÇÕES AOS OUTROS, ENTÃO..."></div><div class="text-hotspot" style="left:20.75%;top:13.098958333333332%;width:44.5%;height:.9583333333333333%" data-text="THEN YOU SHOULD OBVIOUSLY VOTE FOR ME--" onclick="showTextTooltip(event,this)" data-translation="ENTÃO VOCÊ DEVERIA OBVIAMENTE VOTAR EM MIM--"></div><div class="text-hotspot" style="left:46.625%;top:14.609375%;width:38.75%;height:.7760416666666666%" data-text="I DON'T KNOW ABOUT THAT." onclick="showTextTooltip(event,this)" data-translation="NÃO SEI SOBRE ISSO."></div><div class="text-hotspot" style="left:19%;top:21.0625%;width:62.75%;height:1.609375%" data-text="HOW AM I SUPPOSED TO TRUST YOU, WHEN YOU ONLY TRIED TO SAVE YOUR OWN BUTT?" onclick="showTextTooltip(event,this)" data-translation="COMO POSSO CONFIAR EM VOCÊ, QUANDO VOCÊ SÓ TENTOU SALVAR SUA PRÓPRIA PELE?"></div><div class="text-hotspot" style="left:15.75%;top:27.098958333333336%;width:48.5%;height:.7916666666666667%" data-text="BESIDES, WHEN THE REST OF US WERE IN DENIAL," onclick="showTextTooltip(event,this)" data-translation="ALÉM DISSO, QUANDO O RESTO DE NÓS ESTAVA EM NEGAÇÃO,"></div><div class="text-hotspot" style="left:30%;top:28.875%;width:59.25%;height:1.046875%" data-text="HE WAS THE ONLY PERSON WHO ASKED THAT WOMAN FOR INFORMATION." onclick="showTextTooltip(event,this)" data-translation="ELE FOI A ÚNICA PESSOA QUE PEDIU INFORMAÇÕES ÀQUELA MULHER."></div><div class="text-hotspot" style="left:23.375%;top:32.239583333333336%;width:51.74999999999999%;height:.9479166666666667%" data-text="TELL ME THEIR EXACT FORMATIONS AND HOW MANY OF THEM ARE THERE." onclick="showTextTooltip(event,this)" data-translation="ME DIGA AS FORMAS EXATAS E QUANTOS DELES ESTÃO LÁ."></div><div class="text-hotspot" style="left:11.5%;top:41.70833333333333%;width:15.375%;height:.5208333333333333%" data-text="NOD" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:61.375%;top:41.984375%;width:16.5%;height:.546875%" data-text="NOD" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:71.125%;top:43.885416666666664%;width:20.875%;height:.4479166666666667%" data-text="MM-HMM" onclick="showTextTooltip(event,this)" data-translation="Uhum."></div><div class="text-hotspot" style="left:42.5%;top:46.61458333333333%;width:43.875%;height:.18229166666666666%" data-text="...I FEEL FLATTERED." onclick="showTextTooltip(event,this)" data-translation="...Me sinto lisonjeado."></div><div class="text-hotspot" style="left:12.625%;top:52.979166666666664%;width:47.75%;height:.6875%" data-text="I AM BJORN, SON OF YANDEL. WHAT IS YOUR NAME?" onclick="showTextTooltip(event,this)" data-translation="Sou Bjorn, filho de Yandel. Qual é o seu nome?"></div><div class="text-hotspot" style="left:44.875%;top:55.489583333333336%;width:39.125%;height:.9635416666666667%" data-text="TAKELAN ARBENON AT YOUR SERVICE, LEADER-MAN." onclick="showTextTooltip(event,this)" data-translation="Takelan Arbenon, ao seu dispor, líder."></div><div class="text-hotspot" style="left:8%;top:63.14062499999999%;width:42.25%;height:.6979166666666666%" data-text="YOU CAN'T DECIDE THAT ON YOUR OWN--" onclick="showTextTooltip(event,this)" data-translation="Você não pode decidir isso sozinho--"></div><div class="text-hotspot" style="left:33.125%;top:64.63020833333334%;width:33.125%;height:.9375%" data-text="LEAVE IF YOU'RE UNHAPPY." onclick="showTextTooltip(event,this)" data-translation="Saia se estiver insatisfeito."></div><div class="text-hotspot" style="left:14.875%;top:75.65104166666666%;width:70.125%;height:.921875%" data-text="WE DON'T HAVE A PROBLEM MOVING ON OUR OWN." onclick="showTextTooltip(event,this)" data-translation="Não temos problema em seguir sozinhos."></div><div class="text-hotspot" style="left:58.12500000000001%;top:80.48958333333334%;width:27.125%;height:.18229166666666666%" data-text="...DAMMIT!" onclick="showTextTooltip(event,this)" data-translation="...Droga!"></div><div class="text-hotspot" style="left:22.375%;top:82.72916666666667%;width:28.25%;height:.6822916666666572%" data-text="JEEZ, LOOK AT THIS PUNK." onclick="showTextTooltip(event,this)" data-translation="Caramba, olha esse moleque."></div><div class="text-hotspot" style="left:27.875%;top:86.5%;width:43.75%;height:1.1927083333333286%" data-text="IF YOU CUT ME OFF AGAIN OR DISOBEY MY ORDERS, YOU'RE OUT." onclick="showTextTooltip(event,this)" data-translation="Se me interromper de novo ou desobedecer minhas ordens, está fora."></div><div class="text-hotspot" style="left:56.75%;top:88.08854166666666%;width:25.25%;height:.3125%" data-text="HAVE I MADE MYSELF CLEAR?" onclick="showTextTooltip(event,this)" data-translation="Fui claro?"></div><div class="text-hotspot" style="left:65.625%;top:90.33333333333333%;width:2%;height:.046875%" data-text="°°" onclick="showTextTooltip(event,this)" data-translation="°°"></div><div class="text-hotspot" style="left:71.375%;top:90.41145833333334%;width:1.875%;height:.036458333333333336%" data-text="00" onclick="showTextTooltip(event,this)" data-translation="00"></div><div class="text-hotspot" style="left:20.75%;top:96.05208333333334%;width:33.25%;height:.18229166666666666%" data-text="ANSWER ME." onclick="showTextTooltip(event,this)" data-translation="Responda-me."></div><div class="text-hotspot" style="left:60.5%;top:98.13541666666666%;width:18%;height:.18229166666666666%" data-text="...FINE." onclick="showTextTooltip(event,this)" data-translation="...Certo."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/138/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20%;top:5.817708333333333%;width:59.75%;height:.9427083333333334%" data-text="THEN I CHECKED WHAT EACH OF US WAS CAPABLE OF. BUT THAT STILL DID NOT GIVE ME CONFIDENCE." onclick="showTextTooltip(event,this)" data-translation="Então eu verifiquei do que cada um de nós era capaz. Mas isso ainda não me deu confiança."></div><div class="text-hotspot" style="left:0;top:9.317708333333332%;width:52.87500000000001%;height:1.4427083333333333%" data-text="SLAM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32.25%;top:13.953125%;width:35.25%;height:1.1927083333333333%" data-text="THE ONLY CONSOLATION IS THAT THERE IS NO ONE NAMED HANS HERE." onclick="showTextTooltip(event,this)" data-translation="A única consolação é que não há ninguém chamado Hans aqui."></div><div class="text-hotspot" style="left:47.75%;top:20.692708333333336%;width:27.375%;height:.9322916666666667%" data-text="ALRIGHT, WHAT ARE WE GOING TO DO?" onclick="showTextTooltip(event,this)" d
