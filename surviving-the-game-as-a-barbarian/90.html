ation="RASPAR"></div><div class="text-hotspot" style="left:19.125%;top:24.260416666666668%;width:61.625%;height:.96875%" data-text="I INITIALLY QUESTIONED THE POINT OF HAVING A WAYFINDER IN THE PARTY AT A PLACE LIKE THIS." onclick="showTextTooltip(event,this)" data-translation="INICIALMENTE, QUESTIONEI A UTILIDADE DE TER UM GUIA NO GRUPO EM UM LUGAR COMO ESTE."></div><div class="text-hotspot" style="left:26.375%;top:29.708333333333332%;width:46.625%;height:.7447916666666667%" data-text="HOWEVER, THAT WAS ARROGANT OF ME." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, ISSO FOI ARROGANTE DA MINHA PARTE."></div><div class="text-hotspot" style="left:9.625%;top:35.890625%;width:12.5%;height:.2864583333333333%" data-text="لا" onclick="showTextTooltip(event,this)" data-translation="لا"></div><div class="text-hotspot" style="left:14.625%;top:38.473958333333336%;width:70.125%;height:.9375%" data-text="HAVING RISEN THROUGH THE RANKS ALL THE WAY FROM THE BOTTOM, ROTMILLER WAS A TRULY VERSATILE MAN." onclick="showTextTooltip(event,this)" data-translation="TENDO SUBIDO NAS FILEIRAS DESDE O INÍCIO, ROTMILLER ERA UM HOMEM REALMENTE VERSÁTIL."></div><div class="text-hotspot" style="left:26.75%;top:43.21875%;width:34.25%;height:.6927083333333334%" data-text="GIVE ME THE MAP. LET ME UPDATE IT." onclick="showTextTooltip(event,this)" data-translation="ME DÊ O MAPA. DEIXE-ME ATUALIZÁ-LO."></div><div class="text-hotspot" style="left:41.125%;top:44.91145833333333%;width:41.25%;height:.671875%" data-text="SWISH" onclick="showTextTooltip(event,this)" data-translation="SWISH"></div><div class="text-hotspot" style="left:63.74999999999999%;top:49.921875%;width:15.25%;height:.17708333333333331%" data-text="HERE." onclick="showTextTooltip(event,this)" data-translation="AQUI."></div><div class="text-hotspot" style="left:28.000000000000004%;top:51.171875%;width:40.875%;height:.9635416666666643%" data-text="I REALLY DID NOT EXPECT HIM TO HAVE SO MANY DIFFERENT SKILLS." onclick=
