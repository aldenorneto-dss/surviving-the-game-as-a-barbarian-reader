t; (Aquele prédio é enorme!)."></div><div class="text-hotspot" style="left:29.5%;top:9.005208333333334%;width:29.75%;height:.40104166666666663%" data-text="WHISPER" onclick="showTextTooltip(event,this)" data-translation="SUSSURRO"></div><div class="text-hotspot" style="left:39.5%;top:9.661458333333334%;width:50.125%;height:.6979166666666661%" data-text="AND THE BACKPACK LOOKED EXPANDABLE TOO." onclick="showTextTooltip(event,this)" data-translation="E A MOCHILA PARECIA EXPANSÍVEL TAMBÉM." data-tips="💡 &quot;Looked expandable&quot; pode ser traduzido como &quot;parecia ser expansível&quot;. A estrutura **looked** + adjetivo é usada para expressar a impressão ou aparência de algo. Exemplo: &quot;The box looked heavy.&quot; (A caixa parecia pesada.)"></div><div class="text-hotspot" style="left:50.24999999999999%;top:12.942708333333334%;width:28.875%;height:.45312499999999994%" data-text="WHISPER" onclick="showTextTooltip(event,this)" data-translation="SUSSURRO"></div><div class="text-hotspot" style="left:11.875%;top:13.479166666666668%;width:43.625%;height:.9635416666666643%" data-text="WHY WOULD ADVENTURERS LIKE THEM STILL BE HERE...?" onclick="showTextTooltip(event,this)" data-translation="POR QUE AVENTUREIROS COMO ELES AINDA ESTARIAM AQUI...?" data-tips="💡 A expressão &quot;Why would adventurers like them still be here...?&quot; usa o **would** para expressar surpresa ou dúvida sobre uma situação inesperada. Exemplo: &quot;Why would he do that?&quot; (Por que ele faria isso?)"></div><div class="text-hotspot" style="left:41.5%;top:18.520833333333332%;width:38.125%;height:1.4218750000000036%" data-text="HMM I NEVER THOUGHT OF THIS BEFORE..." onclick="showTextTooltip(event,this)" data-translation="HMM, NUNCA PENSEI NISSO ANTES..."></div><div class="text-hotspot" style="left:22.875%;top:23.864583333333332%;width:39%;height:.703125%" data-text="...BUT I GUESS I UNDERSTAND THEIR SENTIMENT." onclick="showTextTooltip(event,this)" data-translation="...MAS ACHO QUE ENTENDO O SENTIMENTO DELES." data-tips="💡 'I GUESS' é uma expressão informal para indicar que você acha ou supõe algo, mas não tem certeza absoluta."></div><div class="text-hotspot" style="left:37.75%;top:26.182291666666668%;width:23%;height:.4635416666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:78.625%;top:27.661458333333332%;width:19.125%;height:.40104166666666663%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:22.125%;top:35.92708333333333%;width:55.25%;height:1.2395833333333333%" data-text="IT'S DEFINITELY WEIRD TO SEE HIGHER FLOOR ADVENTURERS NEAR THE SPAWNING POINT ON THE FIRST FLOOR." onclick="showTextTooltip(event,this)" data-translation="É DEFINITIVAMENTE ESTRANHO VER AVENTUREIROS DE ANDARES SUPERIORES PERTO DO PONTO DE APARECIMENTO NO PRIMEIRO ANDAR." data-tips="💡 &quot;Spawning point&quot; refere-se ao ponto de aparecimento, geralmente usado em jogos para indicar onde personagens ou objetos surgem. É um termo técnico comum em jogos de vídeo. Exemplo: &quot;We need to guard the spawning point.&quot; (Precisamos proteger o ponto de aparecimento.)"></div><div class="text-hotspot" style="left:33.25%;top:44.447916666666664%;width:35.875%;height:.625%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)" data-translation="RISADA"></div><div class="text-hotspot" style="left:33.375%;top:46.828125%;width:29.375%;height:.4427083333333333%" data-text="WHAT'S SO FUNNNNY?" onclick="showTextTooltip(event,this)" data-translation="O QUE É TÃO ENGRAÇADO?"></div><div class="text-hotspot" style="left:29.625%;top:51.645833333333336%;width:42%;height:.8333333333333334%" data-text="I WAS JUST REMINDED OF THE PAST." onclick="showTextTooltip(event,this)" data-translation="EU SÓ ME LEMBREI DO PASSADO." data-tips="💡 A expressão &quot;I was just reminded of the past&quot; usa a voz passiva para indicar que algo fez a pessoa ca 'fazer uma visita a alguém'."></div><div class="text-hotspot" style="left:46.875%;top:80.05208333333333%;width:11.25%;height:.6875%" data-text="HUH? WHAT THE..." onclick="showTextTooltip(event,this)" data-translation="HÃ? O QUE DIABOS..."></div><div class="text-hotspot" style="left:48%;top:81.73958333333333%;width:21.625%;height:.43750000000000006%" data-text="GLARE" onclick="showTextTooltip(event,this)" data-translation="OLHAR"></div><div class="text-hotspot" style="left:52.125%;top:88.36458333333333%;width:25.125%;height:.6822916666666572%" data-text="WHAT'S THAT DIRTY STARE FOR?" onclick="showTextTooltip(event,this)" data-translation="POR QUE ESSE OLHAR SUJO?" data-tips="💡 &quot;Dirty stare&quot; é uma expressão que indica um olhar de desaprovação ou hostilidade. Exemplo: &quot;He gave me a dirty stare.&quot; (Ele me deu um olhar sujo.)"></div><div class="text-hotspot" style="left:22.75%;top:95.02083333333333%;width:44.625%;height:.6822916666666666%" data-text="I CAN SENSE ENVY AND GREED THROUGH THE BALEFUL GLARE." onclick="showTextTooltip(event,this)" data-translation="POSSO SENTIR INVEJA E GANÂNCIA ATRAVÉS DO OLHAR MALEVOLENTE." data-tips="💡 &quot;Baleful glare&quot; é uma expressão que significa um olhar ameaçador ou maligno. **Baleful** é um adjetivo menos comum que significa sinistro ou ameaçador. Exemplo: &quot;She shot him a baleful glare.&quot; (Ela lançou a ele um olhar ameaçador.)"></div><div class="text-hotspot" style="left:39.625%;top:96.57291666666666%;width:46.625%;height:.9635416666666667%" data-text="HE'S NO MORE DANGEROUS THAN A GOBLIN FOR ME AT THE MOMENT, BUT..." onclick="showTextTooltip(event,this)" data-translation="ELE NÃO É MAIS PERIGOSO QUE UM GOBLIN PARA MIM NO MOMENTO, MAS..." data-tips="💡 A estrutura &quot;He's no more dangerous than a goblin&quot; compara o perigo que alguém representa a algo considerado menos perigoso. Exemplo: &quot;This task is no more difficult than the last one.&quot; (Esta tarefa não é mais difícil do que a úl
