- **The more** you practice, **the more** you improve.
- **The more** I read, **the more** I learn."></div><div class="text-hotspot" style="left:34.5%;top:93.31770833333334%;width:55.25%;height:1.7395833333333333%" data-text="CAN EVIL SPIRITS, FORMER GAMERS THAT IS, REALLY BE THOSE THAT OPENED THE GATE OF THE ABYSS INTO THE BOSS'S ROOM IN DUNGEON AND STONE?" onclick="showTextTooltip(event,this)" data-translation="PODEM ESPÍRITOS MALIGNOS, ANTIGOS JOGADORES, SEREM REALMENTE AQUELES QUE ABRIRAM O PORTÃO DO ABISMO NA SALA DO CHEFE EM DUNGEON AND STONE?"></div><div class="text-hotspot" style="left:17.375%;top:98.77604166666667%;width:65.25%;height:1.2083333333333333%" data-text="ANYONE THAT COULD GET THAT FAR IN THE GAME WOULD DEFINITELY KNOW HOW BARBARIANS WOULD BE TREATED IN THE CITY. SO WHY DIDN'T HE" onclick="showTextTooltip(event,this)" data-translation="QUALQUER UM QUE PUDESSE CHEGAR TÃO LONGE NO JOGO DEFINITIVAMENTE SABERIA COMO OS BÁRBAROS SERIAM TRATADOS NA CIDADE. ENTÃO POR QUE ELE NÃO"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/37/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:28.000000000000004%;top:.06770833333333334%;width:43.875%;height:.17708333333333331%" data-text="ENTER THE LABYRINTH?" onclick="showTextTooltip(event,this)" data-translation="ENTROU NO LABIRINTO?"></div><div class="text-hotspot" style="left:55.375%;top:5.744791666666667%;width:18.125%;height:.4322916666666667%" data-text="KEEP GOING." onclick="showTextTooltip(event,this)" data-translation="CONTINUE."></div><div class="text-hotspot" style="left:12.75%;top:6.661458333333334%;width:48.75%;height:1.4583333333333321%" data-text="YOU USED THE MONEY TO GET BY THE FIRST MONTH. WHAT DID YOU DO AFTER THAT?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ USOU O DINHEIRO PARA PASSAR O PRIMEIRO MÊS. O QUE VOCÊ FEZ DEPOIS DISSO?" data-tips="💡 A expressão **&quot;get by&quot;** significa &quot;se virar&quot; ou &quot;sobreviver&quot; com o que se tem. É um **phrasal verb** usado para descrever quando alguém consegue lidar com uma situação difícil, geralmente com recursos limitados. 
- I can get by on a small salary.
- Can you get by without your phone for a day?"></div><div class="text-hotspot" style="left:44.875%;top:11.796875%;width:5%;height:.10937500000000001%" data-text="26666" onclick="showTextTooltip(event,this)" data-translation="26666"></div><div class="text-hotspot" style="left:15.125%;top:13.109375%;width:53%;height:.953125%" data-text="... I DIDN'T ENTER THE LABYRINTH THE FOLLOWING MONTH, EITHER." onclick="showTextTooltip(event,this)" data-translation="... EU NÃO ENTREI NO LABIRINTO NO MÊS SEGUINTE, TAMBÉM." data-tips="💡 A estrutura **&quot;the following month&quot;** é usada para indicar o mês que vem depois de um período mencionado anteriormente. Em português, seria &quot;no mês seguinte&quot;.
- I will start my new job the following week.
- She plans to travel the following year."></div><div class="text-hotspot" style="left:17.875%;top:18.119791666666664%;width:58.62500000000001%;height:1.7708333333333333%" data-text="WHAT? YOU DIDN'T ENTER THE LABYRINTH AGAIN? ARE YOU OUT OF YOUR MIND?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ? VOCÊ NÃO ENTROU NO LABIRINTO DE NOVO? VOCÊ ESTÁ FORA DE SI?"></div><div class="text-hotspot" style="left:17.375%;top:25.640625%;width:66.625%;height:1.1666666666666667%" data-text="B-BUT HOW AM I SUPPOSED TO FIGHT MONSTERS WITHOUT A WEAPON?!" onclick="showTextTooltip(event,this)" data-translation="M-MAS COMO EU SUPONHO LUTAR CONTRA MONSTROS SEM UMA ARMA?!" data-tips="💡 A expressão **&quot;how am I supposed to&quot;** é usada para expressar dúvida ou frustração sobre como realizar uma ação. Em português, poderia ser &quot;como eu deveria&quot; ou &quot;como se espera que eu&quot;.
- How am I supposed to finish this project by tomorrow?
- How are we supposed to know the answer?"></div><div class="text-hotspot" style="left:35%;top:31.874999999999996%;width:51.24999999999999%;height:.953125%" data-text="THAT'S PRECISELY WHY YOU SHOULD HAVE GONE IN FIRST TIME! ARE YOU THAT DENSE?" onclick="showTextTooltip(event,this)" data-translation="É EXATAMENTE POR ISSO QUE VOCÊ DEVERIA TER ENTRADO NA PRIMEIRA VEZ! VOCÊ É TÃO DENSO ASSIM?" data-tips="💡 'Dense' é uma gíria que significa 'lento para entender' ou 'burro'. Uma alternativa mais formal seria 'slow-witted'."></div><div class="text-hotspot" style="left:10.5%;top:33.9375%;width:44.25%;height:.6875%" data-text="HAS HE REALLY PLAYED DUNGEON AND STONE BEFORE...?" onclick="showTextTooltip(event,this)" data-translation="ELE REALMENTE JOGOU DUNGEON AND STONE ANTES...?"></div><div class="text-hotspot" style="left:96.25%;top:39.75%;width:3.6249999999999996%;height:.14583333333333334%" data-text="A" onclick="showTextTooltip(event,this)" data-translation="A"></div><div class="text-hotspot" style="left:32.5%;top:39.85416666666667%;width:4.375%;height:.18229166666666666%" data-text="Fil" onclick="showTextTooltip(event,this)" data-translation="Fil"></div><div class="text-hotspot" style="left:13.750000000000002%;top:40.875%;width:63.5%;height:.9583333333333333%" data-text="... I GOT KICKED OUT FROM THE INN BECAUSE I DIDN'T HAVE ANY MORE MONEY." onclick="showTextTooltip(event,this)" data-translation="... FUI EXPULSO DA ESTALAGEM PORQUE NÃO TINHA MAIS DINHEIRO." data-tips="💡 A expressão **&quot;got kicked out&quot;** significa ser expulso de algum lugar. É uma forma casual de descrever a ação de ser forçado a sair. 
- He got kicked out of the club for causing trouble.
- They got kicked out of the restaurant for not paying the bill."></div><div class="text-hotspot" style="left:41.375%;top:46.3125%;width:40.875%;height:.6979166666666666%" data-text="THE REST OF HIS STORY WAS AS I HAD EXPECTED." onclick="showTextTooltip(event,this)" data-translation="O RESTO DA HISTÓRIA DELE FOI COMO EU ESPERAVA."></div><div class="text-hotspot" style="left:26.375%;top:52.041666666666664%;width:39.25%;height:1.2083333333333333%" data-text="I ENDURED HUNGER, COLD WEATHER, AND FATIGUE SINCE THEN." onclick="showTextTooltip(event,this)" data-translation="SUPORTEI FOME, FRIO E FADIGA DESDE ENTÃO." data-tips="💡 O verbo **&quot;endure&quot;** significa suportar ou aguentar algo difícil ou desagradável. É frequentemente usado em contextos de dificuldades físicas ou emocionais.
- She had to endure a lot of pain during the recovery.
- They endured the long journey with patience."></div><div class="text-hotspot" style="left:31.624999999999996%;top:53.90104166666667%;width:52.625%;height:1.7447916666666667%" data-text="I EVEN WENT TO THE INN AT WHICH OTHER BARBARIANS WERE STAYING, BUT THEY REFUSED TO ACCEPT ME FOR SOME REASON!" onclick="showTextTooltip(event,this)" data-translation="EU ATÉ FUI À ESTALAGEM ONDE OUTROS BÁRBAROS ESTAVAM HOSPEDADOS, MAS ELES SE RECUSARAM A ME ACEITAR POR ALGUM MOTIVO!"></div><div class="text-hotspot" style="left:13.750000000000002%;top:60.083333333333336%;width:47.125%;height:.9531249999999929%" data-text="IF WHAT HE SAID IS TRUE HOW DID HE EVEN , SURVIVE THREE WHOLE MONTHS?" onclick="showTextTooltip(event,this)" data-translation="SE O QUE ELE DISSE É VERDADE, COMO ELE SOBREVIVEU TRÊS MESES INTEIROS?" data-tips="💡 'Even' é usado aqui para enfatizar surpresa ou dificuldade. Exemplo: 'He even managed to finish the project on time.'"></div><div class="text-hotspot" style="left:33.5%;top:69.40104166666666%;width:46.25%;height:.953125%" data-text="I CAN'T SHAKE OFF THE THOUGHT THAT MY FATE WOULDN'T HAVE BEEN MUCH DIFFERENT..." onclick="showTextTooltip(event,this)" data-translation="NÃO CONSIGO TIRAR DA CABEÇA QUE MEU DESTINO NÃO TERIA SIDO MUITO DIFERENTE..." data-tips="💡 A expressão **&quot;can't shake off the thought&quot;** significa não conseguir parar de pensar em algo. É uma forma de dizer que uma ideia ou preocupação persiste na mente.
- I can't shake off the feeling that something is wrong.
- He couldn't shake off the memory of the accident."></div><div class="text-hotspot" style="left:16.75%;top:78.875%;width:49.875%;height:.6770833333333334%" data-text="...HAD I GOT CONSUMED BY FEAR AND RUN AWAY THAT DAY." onclick="showTextTooltip(event,this)" data-translation="...SE EU TIVESSE SIDO CONSUMIDO PELO MEDO E FUGIDO NAQUELE DIA." data-tips="💡 A estrutura **&quot;had I got&quot;** é uma inversão comum em inglês para criar uma condição contrafactual no passado. Equivale a &quot;se eu tivesse&quot;.

t:.7083333333333333%" data-text="CAN I FIND YOU HERE LATER--" onclick="showTextTooltip(event,this)" data-translation="POSSO ENCONTRAR VOCÊ AQUI MAIS TARDE--"></div><div class="text-hotspot" style="left:38.625%;top:68.234375%;width:20.75%;height:.234375%" data-text="DON'T." onclick="showTextTooltip(event,this)" data-translation="NÃO."></div><div class="text-hotspot" style="left:51%;top:73.40104166666667%;width:38.375%;height:.4375%" data-text="TARIKAN, SON OF RIYEN." onclick="showTextTooltip(event,this)" data-translation="TARIKAN, FILHO DE RIYEN."></div><div class="text-hotspot" style="left:56.375%;top:75.61979166666667%;width:12.625%;height:.9270833333333334%" data-text="//////" onclick="showTextTooltip(event,this)" data-translation="//////"></div><div class="text-hotspot" style="left:43.875%;top:76.02604166666667%;width:2.375%;height:.10416666666666667%" data-text="=" onclick="showTextTooltip(event,this)" data-translation="="></div><div class="text-hotspot" style="left:23.375%;top:76.05208333333333%;width:11%;height:.45312499999999994%" data-text="\ \ \ \ \ } } } }" onclick="showTextTooltip(event,this)" data-translation="\ \ \ \ \ } } } }"></div><div class="text-hotspot" style="left:7.375%;top:77.74479166666667%;width:65.375%;height:1.7343749999999858%" data-text="IT DOESN'T MATTER IF YOU SPEND THE MONEY UNWISELY, LOSE IT, OR ACTUALLY PUT IT TO GOOD USE AND COME BACK SAFELY FROM THE LABYRINTH." onclick="showTextTooltip(event,this)" data-translation="NÃO IMPORTA SE VOCÊ GASTAR O DINHEIRO DE FORMA IMPRUDENTE, PERDÊ-LO, OU REALMENTE USÁ-LO BEM E VOLTAR EM SEGURANÇA DO LABIRINTO." data-tips="💡 A expressão **&quot;put it to good use&quot;** significa usar algo de forma eficaz ou benéfica. Em português, seria &quot;usar bem&quot; ou &quot;fazer bom uso de&quot;.
