iv><div class="text-hotspot" style="left:30%;top:57.770833333333336%;width:39.875%;height:.9479166666666643%" data-text="IS SHE HAVING A NIGHTMARE? MAYBE I SHOULD WAKE HER UP." data-translation="ELA ESTÁ TENDO UM PESADELO? TALVEZ EU DEVA ACORDÁ-LA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.375%;top:60.848958333333336%;width:55.00000000000001%;height:1.2291666666666665%" data-text="TWITCH" data-translation="ESPASMOS" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:50.125%;top:67.64583333333334%;width:40.5%;height:.16666666666666669%" data-text="...MR. YANDEL?" data-translation="...SR. YANDEL?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.25%;top:71.234375%;width:12.625%;height:.11458333333333333%" data-text="AWAKE?" data-translation="ACORDADO?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.375%;top:71.97916666666667%;width:46.375%;height:.953125%" data-text="DON'T WORRY AND GO BACK TO SLEEP. I'LL KEEP EVERYONE SAFE." data-translation="NÃO SE PREOCUPE E VOLTE A DORMIR. EU VOU MANTER TODOS SEGUROS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53.5%;top:79.50520833333333%;width:1.625%;height:.07291666666666667%" data-text="0" data-translation="0" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.375%;top:82.69791666666667%;width:40.75%;height:.9583333333333428%" data-text="I'M NOT WORRIED. I JUST HAVE A QUESTION." data-translation="NÃO ESTOU PREOCUPADA. SÓ TENHO UMA PERGUNTA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.5%;top:88.65625%;width:55.50000000000001%;height:.703125%" data-text="IF I HADN'T CAST THE DETECTION SPELL BACK THEN..." data-translation="SE EU NÃO TIVESSE LANÇADO O FEITIÇO DE DETECÇÃO NAQUELA HORA..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:48.
