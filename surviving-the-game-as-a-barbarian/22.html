fica 'caso contrário' ou 'senão', usado para apresentar uma consequência de não seguir a instrução anterior."></div><div class="text-hotspot" style="left:14.249999999999998%;top:82.828125%;width:50.749999999999986%;height:.953125%" data-text="BUT... I THINK I UNDERSTAND WHAT YOU'RE TRYING TO SAY." onclick="showTextTooltip(event,this)" data-translation="MAS... ACHO QUE ENTENDO O QUE VOCÊ ESTÁ TENTANDO DIZER."></div><div class="text-hotspot" style="left:10.125%;top:92.31770833333334%;width:51.625%;height:1.2135416666666665%" data-text="THE ABILITY TO OVERCOME THE URGE TO KILL MYSELF FROM THIS HUGE SHAME..." onclick="showTextTooltip(event,this)" data-translation="A CAPACIDADE DE SUPERAR A VONTADE DE ME MATAR POR ESSA VERGONHA ENORME..." data-tips="💡 'Overcome the urge' significa 'superar a vontade'. 'Overcome' é um verbo frequentemente usado para indicar superação de dificuldades."></div><div class="text-hotspot" style="left:33.375%;top:93.90625%;width:56.75%;height:1.21875%" data-text="MUST BE ONE OF THE QUALITIES THAT ONE APART AS A GREAT WARRIOR LIKE YOU, BJORN. SET" onclick="showTextTooltip(event,this)" data-translation="DEVE SER UMA DAS QUALIDADES QUE DESTACAM UM GRANDE GUERREIRO COMO VOCÊ, BJORN. PRONTO"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/22/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:16.75%;top:1.0729166666666667%;width:5.5%;height:.046875%" data-text="..." onclick="showTextTooltip(event,this)" data-translation="..."></div><div class="text-hotspot" style="left:21.875%;top:7.40625%;width:56.00000000000001%;height:1.1666666666666667%" data-text="...YOU'RE WRONG. I FEEL ABSOLUTELY FINE ABOUT HAVING NO PRIDE WHATSOEVER." onclick="showTextTooltip(event,this)" data-translation="...VOCÊ ESTÁ ERRADO. EU ME SINTO ABSOLUTAMENTE BEM EM NÃO TER ORGULHO ALGUM." data-tips="💡 'No pride whatsoever' enfatiza a ausência total de orgulho. 'Whatsoever' é usado para dar ênfase negativa, similar a 'nenhum' em português."></div><div class="text-hotspot" style="left:63.74999999999999%;top:9.223958333333334%;width:32.5%;height:.5885416666666666%" data-text="I'M NOT A REAL BARBARIAN ANYWAYS." onclick="showTextTooltip(event,this)" data-translation="NÃO SOU UM VERDADEIRO BÁRBARO DE QUALQUER FORMA."></div><div class="text-hotspot" style="left:0;top:12.776041666666666%;width:57.75%;height:1.484375%" data-text="SWEAT" onclick="showTextTooltip(event,this)" data-translation="SUOR"></div><div class="text-hotspot" style="left:18%;top:15.901041666666666%;width:64.125%;height:1.1614583333333333%" data-text="WE WILL HAVE A CHANCE TO PAY HER BACK FOR THIS HUMILIATION." onclick="showTextTooltip(event,this)" data-translation="TEREMOS UMA CHANCE DE DAR O TROCO POR ESSA HUMILHAÇÃO." data-tips="💡 'Pay her back' é um phrasal verb que significa 'dar o troco' ou 'retribuir', geralmente em um contexto de vingança ou justiça."></div><div class="text-hotspot" style="left:23%;top:25.166666666666664%;width:33.625%;height:.6979166666666666%" data-text="I'VE BEEN AWAKE FOR MORE THAN TWENTY HOURS," onclick="showTextTooltip(event,this)" data-translation="ESTOU ACORDADO HÁ MAIS DE VINTE HORAS," data-tips="💡 A expressão 'I've been awake' usa o present perfect para indicar uma ação que começou no passado e continua no presente."></div><div class="text-hotspot" style="left:41.75%;top:26.479166666666664%;width:42.75%;height:.9375%" data-text="NOT TO MENTION THE MENTAL FATIGUE FROM WHAT TRANSPIRED TODAY." onclick="showTextTooltip(event,this)" data-translation="SEM MENCIONAR O CANSAÇO MENTAL PELO QUE ACONTECEU HOJE." data-tips="💡 'Not to mention' é uma expressão usada para adicionar mais informações, similar a 'sem mencionar' em português."></div><div class="text-hotspot" style="left:29.125%;top:33.875%;width:44.5%;height:.9479166666666667%" data-text="HOWEVER, I AM HAVING TROUBLE FALLING ASLEEP." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, ESTOU TENDO DIFICULDADES PARA DORMIR." data-tips="💡 'Having trouble falling asleep' usa 'having trouble' para indicar dificuldade, uma estrutura comum para expressar problemas com algo."></div><div class="text-hotspot" style="left:14.374999999999998%;top:42.927083333333336%;width:46.25%;height:1.2083333333333333%" data-text="WHILE I'M NOT OVERWHELMED BY THE URGE TO TAKE MY OWN LIFE LIKE AINAR SAID SHE WAS," onclick="showTextTooltip(event,this)" data-translation="ENQUANTO NÃO ESTOU DOMINADO PELA VONTADE DE TIRAR MINHA PRÓPRIA VIDA COMO AINAR DISSE QUE ESTAVA," data-tips="💡 'Overwhelmed by the urge' usa 'overwhelmed' para indicar estar dominado por uma emoção ou desejo intenso."></div><div class="text-hotspot" style="left:36.125%;top:44.61979166666667%;width:31.374999999999996%;height:.9427083333333334%" data-text="I DO FEEL LIKE CRAP TO BE ON THE RECEIVING END OF PITY." onclick="showTextTooltip(event,this)" data-translation="EU ME SINTO MAL POR ESTAR RECEBENDO PENA." data-tips="💡 'Feel like crap' é uma expressão coloquial que significa 'se sentir muito mal'. Uma alternativa mais formal seria 'feel unwell'."></div><div class="text-hotspot" style="left:78.375%;top:50.015625%;width:11.375%;height:.19270833333333334%" data-text="HER ER" onclick="showTextTooltip(event,this)" data-translation="HER ER"></div><div class="text-hotspot" style="left:80.125%;top:50.78125%;width:1.5%;height:.0625%" data-text="L" onclick="showTextTooltip(event,this)" data-translation="L"></div><div class="text-hotspot" style="left:29.25%;top:61.99479166666667%;width:41.75%;height:1.203125%" data-text="IT'S THE SAME FEELING I GOT WHEN THAT I WAS SAVED BLOND KNIGHT'S PARTY." onclick="showTextTooltip(event,this)" data-translation="É O MESMO SENTIMENTO QUE TIVE QUANDO FUI SALVO PELO GRUPO DO CAVALEIRO LOIRO."></div><div class="text-hotspot" style="left:73.75%;top:65.38020833333333%;width:2.5%;height:.125%" data-text="D" onclick="showTextTooltip(event,this)" data-translation="D"></div><div class="text-hotspot" style="left:12.125%;top:74.69791666666666%;width:37.625%;height:.703125%" data-text="THE CLERIC DECLINED TO HEAL MY WOUNDS..." onclick="showTextTooltip(event,this)" data-translation="O CLÉRIGO RECUSOU-SE A CURAR MEUS FERIMENTOS..." data-tips="💡 'Declined to heal' usa 'declined' como uma forma educada de recusar, diferente de 'refused', que é mais direto."></div><div class="text-hotspot" style="left:42.875%;top:80.38541666666667%;width:45%;height:.921875%" data-text="...AND THE SWORDSMAN TOSSED THE POTION AWAY LIKE GARBAGE." onclick="showTextTooltip(event,this)" data-translation="...E O ESPADACHIM JOGOU A POÇÃO FORA COMO LIXO." data-tips="💡 'Tossed the potion away' usa 'tossed' como uma forma casual de 'jogar fora', diferente de 'throw away', que é mais neutro."></div><div class="text-hotspot" style="left:23.125%;top:85.89583333333334%;width:53.125%;height:.7604166666666572%" data-text="BUT I TOOK IT LIKE A STARVED DOG BEGGING FOR FOOD." onclick="showTextTooltip(event,this)" data-translation="MAS EU PEGUEI COMO UM CACHORRO FAMINTO IMPLORANDO POR COMIDA." data-tips="💡 'Like a starved dog begging for food' é uma comparação que usa 'like' para criar uma imagem vívida, similar ao uso de 'como' em português."></div><div class="text-hotspot" style="left:24.375%;top:97.52604166666666%;width:29.25%;height:.7135416666666714%" data-text="I WAS GLAD I MADE IT OUT ALIVE," onclick="showTextTooltip(event,this)" data-translation="FICO FELIZ POR TER SAÍDO VIVO," data-tips="💡 'Made it out alive' é uma expressão que significa 'sair vivo' ou 'sobreviver', frequentemente usada em contextos perigosos."></div><div class="text-hotspot" style="left:45.875%;top:98.38020833333333%;width:29.125%;height:.6822916666666666%" data-text="BUT I CAN NEVER FORGET THAT FEELING." onclick="showTextTooltip(event,this)" data-translation="MAS NUNCA POSSO ESQUECER ESSE SENTIMENTO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/22/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:35.875%;top:0;width:50.5%;height:.8958333333333334%" data-text="CLEWAY" onclick="showTextTooltip(event,this)" data-translation="CLEWAY"></div><div class="text-hotspot" style="left:16.25%;top:4.713541666666667%;width:50.125%;height:.9635416666666667%" data-text="I THOUGHT I WAS DETERMINED ENOUGH TO AVOID GOING THROUGH THAT EVER AGAIN." onclick="showTextTooltip(event,this)" data-translation="ACHEI QUE ESTAVA DETERMINADO O SUFICIENTE PARA EVITAR PASSAR POR ISSO NOVAMENTE." data-tips="💡 'Determined enough to avoid' usa 'enough' para indicar suficiência em determinação para evitar algo."></div><div class="text-hotspot" style="left:46.25%;top:6.458333333333334%;width:38.75%;height:.6875%" data-text="WHAT COULD HAVE GONE WRONG...?" onclick="showTextTooltip(event,this)" data-translation="O QUE PODERIA TER DADO ERRADO...?"></div><div class="text-hotspot" style="left:7.625%;top:15.09375%;width:85.375%;height:.8593750000000001%" data-text="I'VE ALWAYS LOOKED FOR THE BEST POSSIBLE OPTION UNDER THE CIRCUMSTANCE I WAS IN." onclick="showTextTooltip(event,this)" data-translation="SEMPRE PROCUREI A MELHOR OPÇÃO POSSÍVEL DENTRO DAS CIRCUNSTÂNCIAS EM QUE ESTAVA." data-tips="💡 'Under the circumstance' usa 'under' para indicar a situação em que algo ocorre, diferente do português que usa 'nas'."></div><div class="text-hotspot" style="left:15.375%;top:25.78125%;width:68.875%;height:.8750000000000001%" data-text="ORYOU COULD SAY I WAS ONLY FOCUSED ON GETTING OUT OF THE TIGHT SPOT." onclick="showTextTooltip(event,this)" data-translation="OU VOCÊ PODERIA DIZER QUE EU SÓ ESTAVA FOCADO EM SAIR DA SITUAÇÃO DIFÍCIL." data-tips="💡 'Tight spot' é uma gíria que significa 'situação difícil' ou 'aperto'. Uma alternativa mais formal seria 'difficult situation'."></div><div class="text-hotspot" style="left:32.375%;top:35.885416666666664%;width:35.25%;height:1.1302083333333335%" data-text="BUT IT'S NOT LIKE I REALLY HAD A CHOICE." onclick="showTextTooltip(event,this)" data-translation="MAS NÃO É COMO SE EU REALMENTE TIVESSE UMA ESCOLHA." data-tips="💡 'It's not like I really had a choice' é uma forma de dizer que não havia opção real, similar a 'não é como se eu tivesse escolha'."></div><div class="text-hotspot" style="left:48.625%;top:46.833333333333336%;width:43.25%;height:1.203125%" data-text="I SAW SOMEONE GET BEHEADED RIGHT NEXT TO ME AS SOON AS I OPENED MY EYES..." onclick="showTextTooltip(event,this)" data-translation="VI ALGUÉM SER DECAPITADO BEM AO MEU LADO ASSIM QUE ABRI OS OLHOS..."></div><div class="text-hotspot" style="left:18%;top:51.885416666666664%;width:48.625%;height:1.2135416666666665%" data-text="...AND EXPERIENCED ONE SURREAL EVENT AFTER ANOTHER BEFORE I COULD PROCESS EVERYTHING." onclick="showTextTooltip(event,this)" data-translation="...E EXPERIMENTEI UM EVENTO SURREAL APÓS O OUTRO ANTES DE PODER PROCESSAR TUDO."></div><div class="text-hotspot" style="left:23.125%;top:60.16666666666667%;width:53.87499999999999%;height:.6875%" data-text="I HAD NO CHOICE BUT TO ACT PASSIVELY AND TAKE AS LITTLE RISKS AS POSSIBLE." onclick="showTextTooltip(event,this)" data-translation="NÃO TIVE ESCOLHA A NÃO SER AGIR PASSIVAMENTE E CORRER O MENOR RISCO POSSÍVEL." data-tips="💡 'No choice but to act passively' usa 'no choice but to' para indicar que não há outra opção a não ser fazer algo."></div><div class="text-hotspot" style="left:20.5%;top:68.72395833333333%;width:60.625%;height:1.2708333333333428%" data-text="HOWEVER, I DON'T THINK I CAN CONTINUE TO SURVIVE HERE THIS WAY." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, NÃO ACHO QUE POSSO CONTINUAR A SOBREVIVER AQUI DESSA FORMA." data-tips="💡 'Continue to survive' usa 'continue to' para indicar a continuidade de uma ação, similar a 'continuar a' em português."></div><div class="text-hotspot" style="left:26%;top:74.203125%;width:48.125%;height:.9166666666666572%" data-text="I'VE DECIDED. CHANGE OF PLANS." onclick="showTextTooltip(event,this)" data-translation="EU DECIDI. MUDANÇA DE PLANOS."></div><div class="text-hotspot" style="left:64.375%;top:88.30729166666667%;width:16.75%;height:.17708333333333331%" data-text="AINAR." onclick="showTextTooltip(event,this)" data-translation="AINAR."></div><div class="text-hotspot" style="left:17.875%;top:92.25%;width:32.625%;height:.9635416666666667%" data-text="IF THERE IS A SUREFIRE WAY TO GET STRONGER," onclick="showTextTooltip(event,this)" data-translation="SE HOUVER UMA MANEIRA INFALÍVEL DE FICAR MAIS FORTE," data-tips="💡 'Surefire way' é uma expressão que significa 'maneira infalível', usada para descrever algo que certamente terá sucesso."></div><div class="text-hotspot" style="left:42.875%;top:93.56770833333333%;width:39.125%;height:1.2083333333333428%" data-text="BUT IT COMES WITH A GREAT RISK, WHAT WOULD YOU DO?" onclick="showTextTooltip(event,this)" data-translation="MAS VEM COM UM GRANDE RISCO, O QUE VOCÊ FARIA?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/22/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:40%;top:.026041666666666668%;width:26.625%;height:.4270833333333333%" data-text="GLANCE" onclick="showTextTooltip(event,this)" data-translation="OLHAR"></div><div class="text-hotspot" style="left:13.5%;top:6.468749999999999%;width:35.125%;height:.4322916666666667%" data-text="I WILL TAKE MY CHANCES." onclick="showTextTooltip(event,this)" data-translation="EU VOU ARRISCAR."></div><div class="text-hotspot" style="left:37.25%;top:7.572916666666667%;width:42.375%;height:.9635416666666667%" data-text="WE WILL DIE ANYWAYS IF WE FAIL TO BECOME STRONGER." onclick="showTextTooltip(event,this)" data-translation="VAMOS MORRER DE QUALQUER FORMA SE NÃO CONSEGUIRMOS FICAR MAIS FORTES." data-tips="💡 'We will die anyways' usa 'anyways' para indicar inevitabilidade, similar a 'de qualquer forma' em português."></div><div class="text-hotspot" style="left:12.875%;top:17.119791666666668%;width:46.75%;height:.7135416666666666%" data-text="COME TO THINK OF IT, MY LIFE'S BEEN FULL OF UNAVOIDABLE SH*T," onclick="showTextTooltip(event,this)" data-translation="PENSANDO BEM, MINHA VIDA FOI CHEIA DE MERDAS INEVITÁVEIS," data-tips="💡 'Come to think of it' é uma expressão usada para introduzir uma reflexão ou reconsideração, similar a 'pensando bem' em português."></div><div class="text-hotspot" style="left:44.125%;top:19.052083333333332%;width:45.625%;height:.6979166666666666%" data-text="WHETHER I TRIED TO TAKE THE EASY PATH OR NOT ANYWAYS." onclick="showTextTooltip(event,this)" data-translation="QUER EU TENTASSE PEGAR O CAMINHO FÁCIL OU NÃO."></div><div class="text-hotspot" style="left:35.125%;top:24.8125%;width:29.625%;height:1.125%" data-text="I WILL STRIKE FIRST FROM NOW ON." onclick="showTextTooltip(event,this)" data-translation="EU VOU ATACAR PRIMEIRO A PARTIR DE AGORA." data-tips="💡 'From now on' é uma expressão que significa 'a partir de agora'. É útil para indicar uma mudança de comportamento ou decisão."></div><div class="text-hotspot" style="left:19.625%;top:32.026041666666664%;width:31.5%;height:.45312499999999994%" data-text="VERY WELL, THEN." onclick="showTextTooltip(event,this)" data-translation="MUITO BEM, ENTÃO."></div><div class="text-hotspot" style="left:36.875%;top:33.140625%;width:35.625%;height:.6875%" data-text="THIS IS WHAT WE'RE GOING TO DO." onclick="showTextTooltip(event,this)" data-translation="É ISSO QUE VAMOS FAZER."></div><div class="text-hotspot" style="left:23.375%;top:38.04166666666667%;width:53.125%;height:1.156249999999993%" data-text="WE'RE GOING TO ENTER THROUGH THE RIFT." onclick="showTextTooltip(event,this)" data-translation="VAMOS ENTRAR PELA FENDA."></div><div class="text-hotspot" style="left:25.25%;top:45.057291666666664%;width:49.25%;height:1.4739583333333335%" data-text="I WILL FIND THOSE TERRIBLE, SH*TTY EVENTS FIRST BEFORE THEY FIND ME!" onclick="showTextTooltip(event,this)" data-translation="EU VOU ENCONTRAR ESSES EVENTOS TERRÍVEIS E DESGRAÇADOS ANTES QUE ELES ME ENCONTREM!" data-tips="💡 'Before they find me' usa uma estrutura de subordinação com 'before', indicando que a ação de encontrar os eventos deve ocorrer antes de ser encontrado por eles."></div><div class="text-hotspot" style="left:9.75%;top:50.27604166666667%;width:82.375%;height:1.0052083333333333%" data-text="AFTER ALL, WHAT DOESN'T KILL ME WILL ONLY MAKE ME STRONGER!" onclick="showTextTooltip(event,this)" data-translation="AFINAL, O QUE NÃO ME MATA SÓ ME TORNA MAIS FORTE!" data-tips="💡 A expressão 'What doesn't kill me makes me stronger' é um ditado que significa que as dificuldades nos fortalecem."></div><div class="text-hotspot" style="left:14.499999999999998%;top:61.5%;width:63.625%;height:.6458333333333334%" data-text="YOU HAVE DEFEATED GNOME. YOU HAVE GAINED 1 EXP POINTS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DERROTOU GNOMO. VOCÊ GANHOU 1 PONTO DE EXP."></div><div class="text-hotspot" style="left:21.5%;top:63.083333333333336%;width:61.12499999999999%;height:.625%" data-text="YOU HAVE DEFEATED BLADE WOLF. YOU HAVE GAINED 1 EXP POINTS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DERROTOU LOBO LÂMINA. VOCÊ GANHOU 1 PONTO DE EXP."></div><div class="text-hotspot" style="left:14.000000000000002%;top:73.984375%;width:64.375%;height:2.609375%" data-text="I DIDN'T KNOW A PLACE LIKE THIS EXISTED ON THE FIRST FLOOR OF THE LABYRINTH, WHERE FOUR DIFFERENT MONSTERS ALL SPAWN IN THE SAME AREA!" onclick="showTextTooltip(event,this)" data-translation="EU NÃO SABIA QUE EXISTIA UM LUGAR COMO ESTE NO PRIMEIRO ANDAR DO LABIRINTO, ONDE QUATRO MONSTROS DIFERENTES APARECEM NA MESMA ÁREA!" data-tips="💡 'Spawn' é um termo de jogos que significa 'aparecer' ou 'surgir', geralmente usado para descrever monstros ou personagens que aparecem em um jogo."></div><div class="text-hotspot" style="left:46.875%;top:77.703125%;width:29.5%;height:.421875%" data-text="THAT'S PRECISELY" onclick="showTextTooltip(event,this)" data-translation="É EXATAMENTE POR ISSO"></div><div class="text-hotspot" style="left:46%;top:77.953125%;width:42.625%;height:.6874999999999858%" data-text="WHY THIS AREA ISN'T SO POPULAR." onclick="showTextTooltip(event,this)" data-translation="QUE ESTA ÁREA NÃO É TÃO POPULAR."></div><div class="text-hotspot" style="left:11%;top:82.5%;width:46%;height:.9583333333333333%" data-text="APPEARANCE OF FOUR DIFFERENT KINDS OF MONSTERS MAKES THINGS COMPLICATED," onclick="showTextTooltip(event,this)" data-translation="A APARÊNCIA DE QUATRO TIPOS DIFERENTES DE MONSTROS COMPLICA AS COISAS,"></div><div class="text-hotspot" style="left:42.5%;top:83.91666666666666%;width:46.5%;height:.9739583333333333%" data-text="AND IT'S A DARK AREA THAT REQUIRES A TORCH, MAKING IT NOT COST EFFICIENT." onclick="showTextTooltip(event,this)" data-translation="E É UMA ÁREA ESCURA QUE REQUER UMA TOCHA, TORNANDO-A NÃO RENTÁVEL."></div><div class="text-hotspot" style="left:71%;top:88.13020833333334%;width:26.375%;height:.6614583333333334%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:2.875%;top:88.703125%;width:22.5%;height:.6875%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:18.75%;top:91.453125%;width:62.375%;height:1.234375%" data-text="THERE'S NO PARTICULAR REASON FOR ADVENTURERS TO COME HERE UNLESS THEY'RE PASSING THROUGH TO GET TO THEIR DESTINATION." onclick="showTextTooltip(event,this)" data-translation="NÃO HÁ NENHUMA RAZÃO PARTICULAR PARA AVENTUREIROS VIREM AQUI A MENOS QUE ESTEJAM PASSANDO PARA CHEGAR AO SEU DESTINO." data-tips="💡 'Unless' é usado para introduzir uma exceção. Aqui, significa 'a menos que', indicando uma condição que deve ser satisfeita para que algo ocorra."></div><div class="text-hotspot" style="left:24.875%;top:97.75520833333333%;width:50.625%;height:1.4427083333333428%" data-text="BUT THAT'S ALSO WHY IT'S A PERFECT PLACE TO KEEP SOMETHING HIDDEN!" onclick="showTextTooltip(event,this)" data-translation="MAS É TAMBÉM POR ISSO QUE É UM LUGAR PERFEITO PARA ESCONDER ALGO!" data-tips="💡 'That's also why' é uma estrutura usada para explicar uma razão adicional, similar a 'é também por isso que'."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/22/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:50.5%;top:9.515625%;width:37.25%;height:.4583333333333333%" data-text="WHAT IS THIS, BJORN?" onclick="showTextTooltip(event,this)" data-translation="O QUE É ISSO, BJORN?"></div><div class="text-hotspot" style="left:13.125%;top:14.75%;width:64.75%;height:1.2083333333333333%" data-text="IT'S A MEMORIAL STONE ERECTED TO HONOR THE PERSON THAT FIRST DISCOVERED THE LABYRINTH." onclick="showTextTooltip(event,this)" data-translation="É UMA PEDRA MEMORIAL ERIGIDA PARA HONRAR A PESSOA QUE DESCOBRIU O LABIRINTO." data-tips="💡 'Erected' é um verbo que significa 'erigido' ou 'construído', geralmente usado para estruturas ou monumentos."></div><div class="text-hotspot" style="left:61%;top:20.927083333333332%;width:2.25%;height:.08333333333333334%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:31%;top:29.296875%;width:38.5%;height:.9739583333333333%" data-text="IN MEMORY OF THE LAST GREAT SAGE, DIPLAN GROUNDEL GABRILIUS." onclick="showTextTooltip(event,this)" data-translation="EM MEMÓRIA DO ÚLTIMO GRANDE SÁBIO, DIPLAN GROUNDEL GABRILIUS."></div><div class="text-hotspot" style="left:30.875000000000004%;top:33.557291666666664%;width:40.5%;height:.6979166666666643%" data-text="WE PRAISE HIS PHENOMENAL ACCOMPLISHMENTS." onclick="showTextTooltip(event,this)" data-translation="ELOGIAMOS SUAS REALIZAÇÕES FENOMENAIS."></div><div class="text-hotspot" style="left:11.625%;top:38.94270833333333%;width:32.25%;height:.6770833333333334%" data-text="THE TEXT IS THE SAME FROM THE GAME..." onclick="showTextTooltip(event,this)" data-translation="O TEXTO É O MESMO DO JOGO..."></div><div class="text-hotspot" style="left:29.375%;top:45.22395833333333%;width:61.375%;height:.9479166666666667%" data-text="...WHICH MEANS IT'S HIGHLY LIKELY THE PREREQUISITES FOR THE HIDDEN SOMETHING IS ALSO THE SAME." onclick="showTextTooltip(event,this)" data-translation="...O QUE SIGNIFICA QUE É MUITO PROVÁVEL QUE OS PRÉ-REQUISITOS PARA O ALGO ESCONDIDO TAMBÉM SEJAM OS MESMOS."></div><div class="text-hotspot" style="left:13.25%;top:51.01041666666667%;width:40.875%;height:.6979166666666666%" data-text="AINAR. I AM GOING TO OPEN THE RIFT NOW." onclick="showTextTooltip(event,this)" data-translation="AINAR. VOU ABRIR A FENDA AGORA."></div><div class="text-hotspot" style="left:29.25%;top:52.28645833333333%;width:38%;height:.9739583333333333%" data-text="HOWEVER, THIS IS ALL BETWEEN YOU AND ME." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, ISSO É ENTRE VOCÊ E EU." data-tips="💡 'Between you and me' é uma expressão que indica confidencialidade, similar a 'entre nós'."></div><div class="text-hotspot" style="left:72.25%;top:56.46875%;width:24.25%;height:.7291666666666666%" data-text="NOD" onclick="showTextTooltip(event,this)" data-translation="ACENAR"></div><div class="text-hotspot" style="left:49.625%;top:59.067708333333336%;width:37.5%;height:.6979166666666666%" data-text="I SWEAR ON MY HONOR AS A WARRIOR." onclick="showTextTooltip(event,this)" data-translation="EU JURO POR MINHA HONRA COMO GUERREIRO." data-tips="💡 'I swear on my honor' é uma expressão que denota um juramento ou promessa solene, muitas vezes usada em contextos formais ou solenes."></div><div class="text-hotspot" style="left:41.375%;top:64.00520833333333%;width:33.625%;height:.8229166666666666%" data-text="BUT WHAT IS A RIFT?" onclick="showTextTooltip(event,this)" data-translation="MAS O QUE
