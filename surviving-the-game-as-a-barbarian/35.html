ss="text-hotspot" style="left:80.125%;top:26.364583333333336%;width:19.375%;height:.5520833333333334%" data-text="TAP" onclick="showTextTooltip(event,this)" data-translation="TAP"></div><div class="text-hotspot" style="left:25.624999999999996%;top:28.135416666666668%;width:52%;height:1.046875%" data-text="I'M SURE OF IT. THEY DON'T KNOW THE TRUE VALUE OF RING OF FROST SPIRIT." onclick="showTextTooltip(event,this)" data-translation="EU TENHO CERTEZA DISSO. ELES NÃO SABEM O VERDADEIRO VALOR DO ANEL DO ESPÍRITO DE GELO." data-tips="💡 'I'm sure of it' é uma forma enfática de expressar certeza, similar a 'Eu tenho certeza disso'."></div><div class="text-hotspot" style="left:40.375%;top:45.786458333333336%;width:23.25%;height:.17708333333333331%" data-text="Y-YOU!!" onclick="showTextTooltip(event,this)" data-translation="V-VOCÊ!!"></div><div class="text-hotspot" style="left:18.375%;top:46.708333333333336%;width:33.375%;height:.484375%" data-text="I THOUGHT YOU DIED!!" onclick="showTextTooltip(event,this)" data-translation="EU PENSEI QUE VOCÊ ESTAVA MORTO!!"></div><div class="text-hotspot" style="left:34.25%;top:57.62500000000001%;width:58.875%;height:1.2447916666666665%" data-text="u...I REMOVED EVERYTHING FROM YOUR ROOM BECAUSE I THOUGHT YOU WERE DEAD." onclick="showTextTooltip(event,this)" data-translation="u...EU REMOVI TUDO DO SEU QUARTO PORQUE ACHEI QUE VOCÊ ESTAVA MORTO." data-tips="💡 'Because' é uma conjunção que indica causa, semelhante a 'porque' em português."></div><div class="text-hotspot" style="left:8.75%;top:59.84374999999999%;width:46.75%;height:1.9114583333333357%" data-text="WHAT? WHAT DID YOU DO WITH MY BELONGINGS THEN?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ? O QUE VOCÊ FEZ COM MEUS PERTENCES ENTÃO?"></div><div class="text-hotspot" style="left:51.5%;top:65.82291666666666%;width:32.375%;height:.6875000000000142%" data-text="I-I THREW EVERYTHING OUT." onclick="showTextTooltip(event,this)" data-translation="E-EU JOGUEI TUDO FORA.">< %;top:1.3125%;width:38.125%;height:.96875%" data-text="PAUSE" onclick="showTextTooltip(event,this)" data-translation="PAUSA"></div><div class="text-hotspot" style="left:23%;top:5.208333333333334%;width:54.25%;height:1.40625%" data-text="SINCE WHEN DID I NATURALLY THINK OF RETALIATING VIOLENTLY TO SITUATIONS LIKE THIS?" onclick="showTextTooltip(event,this)" data-translation="DESDE QUANDO EU NATURALMENTE PENSEI EM RETALIAR VIOLENTAMENTE A SITUAÇÕES ASSIM?" data-tips="💡 'Since when' é usado para expressar surpresa sobre algo que mudou. Literalmente, significa 'desde quando'."></div><div class="text-hotspot" style="left:26.25%;top:11.526041666666668%;width:46.75%;height:1.2135416666666665%" data-text="THE MENTAL STATE OF THIS MAN WAS AS CALM AS A CUCUMBER EVEN WHEN THE MAN NEXT TO ME WAS BEHEADED." onclick="showTextTooltip(event,this)" data-translation="O ESTADO MENTAL DESTE HOMEM ERA TÃO CALMO COMO UM PEPINO MESMO QUANDO O HOMEM AO MEU LADO FOI DECAPITADO." data-tips="💡 'As calm as a cucumber' é uma expressão idiomática que significa 'muito calmo', equivalente a 'calmo como uma pedra'."></div><div class="text-hotspot" style="left:11.625%;top:25.729166666666664%;width:35.75%;height:.703125%" data-text="SAME THING WHEN I COMMITTED MY FIRST MURDER." onclick="showTextTooltip(event,this)" data-translation="MESMA COISA QUANDO COMETI MEU PRIMEIRO ASSASSINATO."></div><div class="text-hotspot" style="left:33.875%;top:26.947916666666664%;width:51.24999999999999%;height:.9583333333333333%" data-text="ALTHOUGH THE GUY DEFINITELY DESERVED IT, I FOUND IT REALLY EASY TO TAKE HIS LIFE." onclick="showTextTooltip(event,this)" data-translation="EMBORA O CARA DEFINITIVAMENTE MERECESSE, EU ACHEI REALMENTE FÁCIL TIRAR SUA VIDA." data-tips="💡 'Although' é uma conjunção que indica contraste, similar a 'embora' em português."></div><div class="text-hotspot" style="left:26.25%;top:36.47916666666667%;width:47.625%;height:.9583333333333286%" data-text="I ONLY CONTEMPLATED FOR A LITTLE BEFORE I BROKE FREE FROM PRISON." onclick="showTextTooltip(event,this)" data-translation="EU SÓ CONTEMPLEI POR UM POUCO ANTES DE ME LIBERTAR DA PRISÃO."></div><div class="text-hotspot" style="left:26.25%;top:48.125%;width:47.125%;height:.6875%" data-text="IT'S STRANGE NOW THAT I THINK ABOUT IT. I DID NOT HESITATE AT ALL." onclick="showTextTooltip(event,this)" data-translation="É ESTRANHO AGORA QUE PENSO NISSO. EU NÃO HESITEI NEM UM POUCO." data-tips="💡 'Now that I think about it' é uma expressão usada para introduzir uma reflexão ou reconsideração, semelhante a 'agora que penso nisso'."></div><div class="text-hotspot" style="left:10.5%;top:61.354166666666664%;width:50.125%;height:.9479166666666714%" data-text="EVEN THAT STUPID ARGUMENT I GOT INTO WITH THE OLD MAN AT THE TOWER..." onclick="showTextTooltip(event,this)" data-translation="ATÉ MESMO AQUELA DISCUSSÃO ESTÚPIDA QUE TIVE COM O VELHO NA TORRE..."></div><div class="text-hotspot" style="left:34.875%;top:71.21875%;width:54.25%;height:.9479166666666667%" data-text="...ISN'T SOMETHING 29-YEAR-OLD CORPORATE EMPLOYEE HANSU LEE WOULD HAVE DONE." onclick="showTextTooltip(event,this)" data-translation="...NÃO É ALGO QUE UM FUNCIONÁRIO CORPORATIVO DE 29 ANOS COMO HANSU LEE TERIA FEITO."></div><div class="text-hotspot" style="left:18.5%;top:77.19791666666667%;width:44.75%;height:1.21875%" data-text="I HAD INITIALLY THOUGHT THE CHANGE WAS DUE TO BEING PLACED IN EXTREME CIRCUMSTANCES..." onclick="showTextTooltip(event,this)" data-translation="EU INICIALMENTE PENSEI QUE A MUDANÇA ERA DEVIDO A ESTAR EM CIRCUNSTÂNCIAS EXTREMAS..." data-tips="💡 'Due to' é uma expressão que indica causa, similar a 'devido a' em português."></div><div class="text-hotspot" style="left:37.375%;top:79.01041666666667%;width:49.25%;height:1.1927083333333286%" data-text="BUT THE SUSPICION IN MY HEAD GREW OVER TIME. I AM PRETTY CONFIDENT ABOUT IT NOW." onclick="showTextTooltip(event,this)" data-translation="MAS A SUSPEITA NA MINHA CABEÇA CRESCEU COM O TEMPO. ESTOU BASTANTE CONFIANTE DISSO AGORA."></div><div class="text-hotspot" style="left:20.375%;top:85.09895833333333%;width:59.375%;height:1.4739583333333335%" data-text="JUST LIKE HOW IT'S NATURAL FOR MY BARBARIAN INSTINCTS TO TAKE OVER WHENEVER I ENGAGE IN BATTLES..." onclick="showTextTooltip(event,this)" data-translation="ASSIM COMO É NATURAL PARA MEUS INSTINTOS BÁRBAROS ASSUMIREM SEMPRE QUE ENTRO EM BATALHAS..." data-tips="💡 'Whenever' é uma conjunção que significa 'sempre que', usada para indicar repetição de eventos."></div><div class="text-hotspot" style="left:22.125%;top:96.38020833333333%;width:55.125%;height:1.1614583333333333%" data-text="...MY MENTAL STATE HAS BEEN TAKEN OVER BY THAT OF A BARBARIC SAVAGE BEAST." onclick="showTextTooltip(event,this)" data-translation="...MEU ESTADO MENTAL FOI ASSUMIDO POR UM DE UMA BESTA SELVAGEM BÁRBARA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/35/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:10.25%;top:4.760416666666667%;width:79.375%;height:.65625%" data-text="AM I SLOWLY BECOMING A BARBARIAN FROM WITHIN?" onclick="showTextTooltip(event,this)" data-translation="ESTOU LENTAMENTE ME TORNANDO UM BÁRBARO POR DENTRO?" data-tips="💡 'Am I slowly becoming' usa o present continuous para indicar uma transformação gradual."></div><div class="text-hotspot" style="left:4.5%;top:14.96875%;width:92.5%;height:1.0260416666666665%" data-text="...BUT I SUPPOSE IT'S BETTER THIS WAY TO ENSURE MY SURVIVAL IN THIS WORLD." onclick="showTextTooltip(event,this)" data-translation="...MAS SUPONHO QUE É MELHOR ASSIM PARA GARANTIR MINHA SOBREVIVÊNCIA NESTE MUNDO." data-tips="💡 'I suppose' é uma forma de expressar uma conclusão ou suposição, semelhante a 'suponho que' em português."></div><div class="text-hotspot" style="left:19.25%;top:19.072916666666668%;width:62%;height:1.1458333333333321%" data-text="THIRTY THOUSAND STONES AND I WILL LET IT SLI  class="text-hotspot" style="left:23.25%;top:76.02604166666667%;width:56.99999999999999%;height:.8385416666666666%" data-text="THE ENTIRE CITY IS TALKING ABOUT THAT MAN!!" onclick="showTextTooltip(event,this)" data-translation="A CIDADE INTEIRA ESTÁ FALANDO SOBRE ESSE HOMEM!!" data-tips="💡 'The entire city is talking about' usa a estrutura de voz ativa, focando na ação do sujeito (a cidade) em vez do objeto (o homem)."></div><div class="text-hotspot" style="left:12.875%;top:82.64583333333333%;width:32.875%;height:.671875%" data-text="W-WAIT. I THINK THEY'RE TALKING ABOUT ME." onclick="showTextTooltip(event,this)" data-translation="E-ESPERA. EU ACHO QUE ESTÃO FALANDO DE MIM."></div><div class="text-hotspot" style="left:11.75%;top:89.19791666666667%;width:21.75%;height:.43750000000000006%" data-text="I HAD NO IDEA." onclick="showTextTooltip(event,this)" data-translation="EU NÃO FAZIA IDEIA."></div><div class="text-hotspot" style="left:14.124999999999998%;top:90.328125%;width:50.74999999999999%;height:.6822916666666666%" data-text="DO YOU KNOW THE NAME OF THAT BARBARIAN?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ SABE O NOME DESSE BÁRBARO?"></div><div class="text-hotspot" style="left:60.25%;top:95.25%;width:20.5%;height:.6875%" data-text="HMM. I DON'T KNOW." onclick="showTextTooltip(event,this)" data-translation="HMM. EU NÃO SEI."></div><div class="text-hotspot" style="left:25.374999999999996%;top:96.50520833333334%;width:49.375%;height:1.2135416666666572%" data-text="NOBODY SEEMED TO KNOW ABOUT THE MAN'S NAME FOR SOME STRANGE REASON!" onclick="showTextTooltip(event,this)" data-translation="NINGUÉM PARECIA SABER O NOME DO HOMEM POR ALGUMA RAZÃO ESTRANHA!" data-tips="💡 'For some strange reason' é uma expressão que indica que algo é inexplicável ou inesperado, similar a 'por alguma razão estranha'."></div><div class="text-hotspot" style="left:48.875%;top:98.35416666666667%;width:28.125%;height:.828125%" data-text="SCRATCH" onclick="showTextTooltip(even
