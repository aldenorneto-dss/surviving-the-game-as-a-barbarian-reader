click="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.75%;top:91.984375%;width:55.625%;height:1.2760416666666667%" data-text="THERE IS SOMETHING... THAT COMES TO MY MIND." onclick="showTextTooltip(event,this)" data-translation="Há algo... que me vem à mente."></div><div class="text-hotspot" style="left:45.5%;top:99.26041666666666%;width:34.25%;height:.19791666666666669%" data-text="R-REALLY?!" onclick="showTextTooltip(event,this)" data-translation="S-Sério?!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/130/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:25.374999999999996%;top:.23958333333333331%;width:44.75%;height:1.0572916666666667%" data-text="PLEASE TELL US. WHAT HAPPENED TO THE MASTER--" onclick="showTextTooltip(event,this)" data-translation="Por favor, nos diga. O que aconteceu com o Mestre--"></div><div class="text-hotspot" style="left:13.5%;top:2.1875%;width:33.625%;height:.26041666666666663%" data-text="ENOUGH." onclick="showTextTooltip(event,this)" data-translation="Chega."></div><div class="text-hotspot" style="left:3.375%;top:5.651041666666667%;width:33%;height:.765625%" data-text="SWISH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.749999999999996%;top:9.307291666666668%;width:20.125%;height:.47395833333333337%" data-text="GIGGLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.375%;top:10.119791666666666%;width:28.625%;height:1.234375%" data-text="MS. FOX, YOU MUST RESPECT MR. LION'S RULES." onclick="showTextTooltip(event,this)" data-translation="Sra. Raposa, você deve respeitar as regras do Sr. Leão."></div><div class="text-hotspot" style="left:47.25%;top:13.130208333333334%;width:30.875000000000004%;height:.7083333333333333%" data-text="I FEEL LIKE I'M FINALLY NOT ALONE." onclick="showTextTooltip(event,this)" data-translation="Sinto que finalmente não estou sozinho."></div><div class="text-hotspot" style="left:69.625%;top:14.505208333333334%;width:27.125%;height:.296875%" data-text="IT WON'T BE FUN, I ASSURE YOU." onclick="showTextTooltip(event,this)" data-translation="Não vai ser divertido, eu te garanto."></div><div class="text-hotspot" style="left:25.124999999999996%;top:15.447916666666666%;width:12.875%;height:.17708333333333331%" data-text="OH..." onclick="showTextTooltip(event,this)" data-translation="Oh..."></div><div class="text-hotspot" style="left:18%;top:20.5625%;width:24.875%;height:.28645833333333215%" data-text="NICE, I GOT THE FOX." onclick="showTextTooltip(event,this)" data-translation="Legal, eu peguei a Raposa."></div><div class="text-hotspot" style="left:21.125%;top:22.046875%;width:32.625%;height:.703125%" data-text="ANTLER AND GOBLIN LEFT TO GO, I GUESS." onclick="showTextTooltip(event,this)" data-translation="Faltam o Antler e o Goblin, eu acho."></div><div class="text-hotspot" style="left:57.375%;top:31.046875%;width:26%;height:.8541666666666666%" data-text="IT'S GETTING BORING." onclick="showTextTooltip(event,this)" data-translation="Está ficando chato."></div><div class="text-hotspot" style="left:26.625%;top:32.703125%;width:48%;height:.8489583333333334%" data-text="WE'VE WASTED ENOUGH TIME, HAVEN'T WE?" onclick="showTextTooltip(event,this)" data-translation="Já perdemos tempo suficiente, não é?"></div><div class="text-hotspot" style="left:11%;top:38.09375%;width:37.75%;height:.8697916666666666%" data-text="CREAK" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.249999999999996%;top:43.166666666666664%;width:26.5%;height:.7760416666666666%" data-text="TAP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:51.625%;top:48.421875%;width:31.374999999999996%;height:.75%" data-text="CLICK" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.875%;top:53.80208333333333%;width:58.62500000000001%;height:.8333333333333334%" data-text="OF COURSE. WE SHOULD BEGIN OUR MEETING." onclick="showTextTooltip(event,this)" data-translation="Claro. Devemos começar nossa reunião."></div><div class="text-hotspot" style="left:14.000000000000002%;top:59.43229166666667%;width:36.375%;height:.6822916666666666%" data-text="WATCHERS OF THE ROUND TABLE MEETING." onclick="showTextTooltip(event,this)" data-translation="Reunião dos Observadores da Távola Redonda."></div><div class="text-hotspot" style="left:58.75%;top:62.10416666666667%;width:27.625%;height:.17708333333333331%" data-text="FIRST ROUND." onclick="showTextTooltip(event,this)" data-translation="Primeira rodada."></div><div class="text-hotspot" style="left:10.125%;top:68.90625%;width:66.875%;height:1.2135416666666714%" data-text="...THE MAGES' TOWER IS LOOKING FOR WAYS TO PENETRATE THE BARRIER PROTECTING NOARK." onclick="showTextTooltip(event,this)" data-translation="...A Torre dos Magos está procurando maneiras de penetrar a barreira que protege Noark."></div><div class="text-hotspot" style="left:32.5%;top:71.11979166666667%;width:59.12500000000001%;height:.6927083333333334%" data-text="THEY'VE DISCOVERED THAT DIVINE POWER IS HIGHLY EFFECTIVE." onclick="showTextTooltip(event,this)" data-translation="Eles descobriram que o poder divino é altamente eficaz."></div><div class="text-hotspot" style="left:26.375%;top:76.38541666666666%;width:35.5%;height:.953125%" data-text="RAVEN SAID IT WOULD TAKE ABOUT TWO YEARS..." onclick="showTextTooltip(event,this)" data-translation="Raven disse que levaria cerca de dois anos..."></div><div class="text-hotspot" style="left:36.875%;top:83.92708333333333%;width:46.125%;height:.6979166666666666%" data-text="THEY'RE AIMING TO HAVE IT IN SIX MONTHS." onclick="showTextTooltip(event,this)" data-translation="Eles estão visando fazer isso em seis meses."></div><div class="text-hotspot" style="left:16.375%;top:89.02083333333334%;width:53.75%;height:.953125%" data-text="...THE ROYAL COURT INVENTED A MARK THAT CANNOT BE COUNTERFEITED." onclick="showTextTooltip(event,this)" data-translation="...A Corte Real inventou uma marca que não pode ser falsificada."></div><div class="text-hotspot" style="left:41.5%;top:96.96875%;width:40.375%;height:.9479166666666667%" data-text="THEY'VE BEEN WORKING ON IT IN SECRET FOR SOME TIME." onclick="showTextTooltip(event,this)" data-translation="Eles têm trabalhado nisso em segredo há algum tempo."></div><div class="text-hotspot" style="left:20%;top:98.49479166666667%;width:42.375%;height:1.2239583333333333%" data-text="THEY WILL BE DISTRIBUTED TO ADVENTURERS STARTING NEXT WEEK." onclick="showTextTooltip(event,this)" data-translation="Elas serão distribuídas para aventureiros a partir da próxima semana."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/130/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:40.125%;top:4.755208333333334%;width:45.125%;height:.953125%" data-text="IF THAT'S NEXT WEEK, WE'LL ALL HEAR ABOUT IT VERY SHORTLY." onclick="showTextTooltip(event,this)" data-translation="SE ISSO É NA PRÓXIMA SEMANA, TODOS NÓS VAMOS SABER DISSO MUITO EM BREVE."></div><div class="text-hotspot" style="left:29.5%;top:12.848958333333332%;width:29.5%;height:.9427083333333334%" data-text="THEN I'LL THROW IN SOMETHING ELSE." onclick="showTextTooltip(event,this)" data-translation="ENTÃO VOU JOGAR MAIS UMA COISA."></div><div class="text-hotspot" style="left:10.5%;top:18.255208333333332%;width:76.75%;height:1.7291666666666667%" data-text="THE CLANS THAT STOPPED EXPLORING THE LABYRINTH TO SAVE THEIR OWN SKIN WILL BE AT A SIGNIFICANT DISADVANTAGE IMPOSED BY THE ROYAL COURT." onclick="showTextTooltip(event,this)" data-translation="OS CLÃS QUE PARARAM DE EXPLORAR O LABIRINTO PARA SALVAR A PRÓPRIA PELE ESTARÃO EM UMA DESVANTAGEM SIGNIFICATIVA IMPOSTA PELA CORTE REAL."></div><div class="text-hotspot" style="left:18.625%;top:23.296875%;width:27%;height:.27083333333333337%" data-text="...I SEE." onclick="showTextTooltip(event,this)" data-translation="...ENTENDO."></div><div class="text-hotspot" style="left:49.5%;top:28.125%;width:34.75%;height:.6927083333333334%" data-text="HUH? IS THAT A SIGH OF RELIEF?" onclick="showTextTooltip(event,this)" data-translation="HÃ? ISSO FOI UM SUSPIRO DE ALÍVIO?"></div><div class="text-hotspot" style="left:23.5%;top:32.69270833333333%;width:54.25%;height:1.2239583333333333%" data-text="THEN THE FOX IS LIKELY AFFILIATED WITH A HUGE CLAN. SHE CAN'T BE A REGULAR MEMBER... MAYBE SHE'S A CLAN LEADER." onclick="showTextTooltip(event,this)" data-translation="ENTÃO A RAPOSA PROVAVELMENTE ESTÁ AFILIADA A UM GRANDE CLÃ. ELA NÃO PODE SER UMA MEMBRO COMUM... TALVEZ SEJA UMA LÍDER DE CLÃ."></div><div class="text-hotspot" style="left:28.000000000000004%;top:38.036458333333336%;width:25.5%;height:.6979166666666666%" data-text="IT'S MY TURN, THEN." onclick="showTextTooltip(event,this)" data-translation="É A MINHA VEZ, ENTÃO."></div><div class="text-hotspot" style="left:38.75%;top:39.43229166666667%;width:45.5%;height:1.2135416666666665%" data-text="LARGE CLANS ARE PREPARING TO BOYCOTT THE LABYRINTH ALL TOGETHER." onclick="showTextTooltip(event,this)" data-translation="GRANDES CLÃS ESTÃO SE PREPARANDO PARA BOICOTAR O LABIRINTO COMPLETAMENTE."></div><div class="text-hotspot" style="left:31.75%;top:44.526041666666664%;width:23%;height:.6979166666666666%" data-text="THEY'D GO THAT FAR...?" onclick="showTextTooltip(event,this)" data-translation="ELES IRIAM TÃO LONGE ASSIM...?"></div><div class="text-hotspot" style="left:20.375%;top:48.885416666666664%;width:46%;height:1.2239583333333357%" data-text="THEY HAD ALREADY BEEN GENERALLY UNHAPPY ABOUT THE WAR," onclick="showTextTooltip(event,this)" data-translation="ELES JÁ ESTAVAM GERALMENTE INSATISFEITOS COM A GUERRA,"></div><div class="text-hotspot" style="left:33.875%;top:50.822916666666664%;width:52.125%;height:.9375%" data-text="BUT AN INCIDENT THAT TOOK PLACE RECENTLY WAS THE LAST STRAW." onclick="showTextTooltip(event,this)" data-translation="MAS UM INCIDENTE QUE ACONTECEU RECENTEMENTE FOI A GOTA D'ÁGUA."></div><div class="text-hotspot" style="left:2.625%;top:56.765625%;width:84%;height:8.411458333333343%" data-text="YOU MUST BE TALKING ABOUT BJORN YANDEL'S CASE. 员 WHAT? WHAT DO I HAVE TO DO WITH ANYTHING...?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ DEVE ESTAR FALANDO DO CASO DE BJORN YANDEL. 員 O QUÊ? O QUE EU TENHO A VER COM ISSO...?"></div><div class="text-hotspot" style="left:7.625%;top:69.52083333333333%;width:47.25%;height:.9791666666666667%" data-text="INDEED. IT SHOULD HAVE ENDED WITH JUST A FINE," onclick="showTextTooltip(event,this)" data-translation="DE FATO. DEVERIA TER TERMINADO APENAS COM UMA MULTA,"></div><div class="text-hotspot" style="left:25.874999999999996%;top:71.078125%;width:62.749999999999986%;height:1.203125%" data-text="BUT THEY TEMPORARILY EXILED AN ADVENTURER TO BIFRON FOR A MINOR OFFENSE." onclick="showTextTooltip(event,this)" data-translation="MAS ELES EXILARAM TEMPORARIAMENTE UM AVENTUREIRO PARA BIFRON POR UMA INFRAÇÃO MENOR."></div><div class="text-hotspot" style="left:42.5%;top:73.51041666666667%;width:8.375%;height:.35416666666666663%" data-text="0000" onclick="showTextTooltip(event,this)" data-translation="0000"></div><div class="text-hotspot" style="left:15.25%;top:76.33854166666667%;width:29.25%;height:.6614583333333334%" data-text="GLAMOR" onclick="showTextTooltip(event,this)" data-translation="GLAMOUR"></div><div class="text-hotspot" style="left:62.125%;top:77.953125%;width:28.999999999999996%;height:.5989583333333334%" data-text="CLAMOR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:43.625%;top:79.31770833333334%;width:48.625%;height:.9375%" data-text="MOST CLANS SEE THAT AS A WARNING AGAINST THEM." onclick="showTextTooltip(event,this)" data-translation="A MAIORIA DOS CLÃS VÊ ISSO COMO UM AVISO CONTRA ELES."></div><div class="text-hotspot" style="left:37%;top:85.11979166666667%;width:25.75%;height:.24479166666666669%" data-text="OH, THAT." onclick="showTextTooltip(event,this)" data-translation="AH, ISSO."></div><div class="text-hotspot" style="left:8.375%;top:91.99479166666666%;width:46.5%;height:.6875%" data-text="THERE MUST BE A SEVERE PUBLIC BACKLASH." onclick="showTextTooltip(event,this)" data-translation="DEVE HAVER UMA FORTE REAÇÃO PÚBLICA."></div><div class="text-hotspot" style="left:7.124999999999999%;top:94.42708333333333%;width:86.75%;height:1.4687500000000142%" data-text="WHICH IS UNDERSTANDABLE, SINCE THE CLANS BELIEVE THE ROYAL COURT MIGHT FORCE-CONSCRIPT ADVENTURERS NEXT IF THEY DO NOTHING ABOUT IT." onclick="showTextTooltip(event,this)" data-translation="O QUE É COMPREENSÍVEL, JÁ QUE OS CLÃS ACREDITAM QUE A CORTE REAL PODE CONSCRIPTAR AVENTUREIROS À FORÇA SE NÃO FIZEREM NADA A RESPEITO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/130/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:34.125%;top:0;width:52.37500000000001%;height:.65625%" data-text="I WAS ACTUALLY SWEATING LIKE CRAZY THE MOMENT MY NAME WAS MENTIONED," onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA SUANDO COMO LOUCO NO MOMENTO EM QUE MEU NOME FOI MENCIONADO,"></div><div class="text-hotspot" style="left:17.5%;top:1.6875%;width:40.75%;height:.6875%" data-text="BUT THANKFULLY NOBODY SEEMED TO HAVE NOTICED IT." onclick="showTextTooltip(event,this)" data-translation="MAS FELIZMENTE NINGUÉM PARECEU TER NOTADO."></div><div class="text-hotspot" style="left:39.375%;top:8.979166666666668%;width:40%;height:.546875%" data-text="THAT WAS NERVE-RACKING." onclick="showTextTooltip(event,this)" data-translation="FOI DE DAR NOS NERVOS."></div><div class="text-hotspot" style="left:38.625%;top:9.796875%;width:4.25%;height:.20833333333333334%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:17.875%;top:15.109375%;width:23.75%;height:.421875%" data-text="ALRIGHT, THEN." onclick="showTextTooltip(event,this)" data-translation="CERTO, ENTÃO."></div><div class="text-hotspot" style="left:36.625%;top:17.390625%;width:28.875%;height:.9375%" data-text="...CAN YOU START OFF THE NEXT ROUND?" onclick="showTextTooltip(event,this)" data-translation="...VOCÊ PODE COMEÇAR A PRÓXIMA RODADA?"></div><div class="text-hotspot" style="left:40%;top:21.239583333333336%;width:21.5%;height:.4270833333333333%" data-text="SHRUG" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:52.625%;top:25.348958333333332%;width:17.125%;height:.4635416666666667%" data-text="IF YOU INSIST." onclick="showTextTooltip(event,this)" data-translation="SE VOCÊ INSISTE."></div><div class="text-hotspot" style="left:24.375%;top:29.703125000000004%;width:51.5%;height:1.218749999999993%" data-text="TO BE HONEST, THOUGH, I DON'T THINK THIS WILL INTEREST MR. LION." onclick="showTextTooltip(event,this)" data-translation="PARA SER HONESTO, NO ENTANTO, NÃO ACHO QUE ISSO VAI INTERESSAR O SR. LEÃO."></div><div class="text-hotspot" style="left:9.375%;top:35.098958333333336%;width:61.875%;height:1.625%" data-text="I HEARD THAT NOARK SENT A FEW PEOPLE ABOVE GROUND IMMEDIATELY BEFORE THE CITY WAS SEALED OFF." onclick="showTextTooltip(event,this)" data-translation="OUVI DIZER QUE NOARK ENVIOU ALGUMAS PESSOAS PARA A SUPERFÍCIE IMEDIATAMENTE ANTES DA CIDADE SER SELADA."></div><div class="text-hotspot" style="left:44.625%;top:37.067708333333336%;width:40.125%;height:1.3385416666666667%" data-text="THEIR GOAL IS TO ASSASSINATE A CERTAIN ADVENTURER!" onclick="showTextTooltip(event,this)" data-translation="O OBJETIVO DELES É ASSASSINAR UM CERTO AVENTUREIRO!"></div><div class="text-hotspot" style="left:73.25%;top:38.76041666666667%;width:14.124999999999998%;height:.3020833333333333%" data-text="CRAZY ISN'T IT?" onclick="showTextTooltip(event,this)" data-translation="LOUCO, NÃO É?"></div><div class="text-hotspot" style="left:14.625%;top:50.416666666666664%;width:42.25%;height:1.2239583333333333%" data-text="A GROUP OF ASSASSINS...? DO YOU ALSO KNOW WHO THE TARGET IS?" onclick="showTextTooltip(event,this)" data-translation="UM GRUPO DE ASSASSINOS...? VOCÊ TAMBÉM SABE QUEM É O ALVO?"></div><div class="text-hotspot" style="left:59%;top:53.697916666666664%;width:20.625%;height:.421875%" data-text="THAT, I DON'T." onclick="showTextTooltip(event,this)" data-translation="ISSO, EU NÃO SEI."></div><div class="text-hotspot" style="left:69.5%;top:54.67708333333333%;width:20.75%;height:.38020833333333337%" data-text="GIGGLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32.125%;top:61.302083333333336%;width:34.625%;height:1%" data-text="THAT IS INTERESTING INDEED...!" onclick="showTextTooltip(event,this)" data-translation="ISSO É REALMENTE INTERESSANTE...!"></div><div class="text-hotspot" style="left:50.875%;top:63.927083333333336%;width:7.375%;height:.3020833333333333%" data-text="OD" onclick="showTextTooltip(event,this)" data-translation="OD"></div><div class="text-hotspot" style="left:15.875%;top:71.27083333333334%;width:51.37500000000001%;height:.9583333333333333%" data-text="THE FIRST THING THAT CAME TO MY MIND WAS THAT AMELIA IS PROBABLY ONE OF THE ASSASSINS." onclick="showTextTooltip(event,this)" data-translation="A PRIMEIRA COISA QUE ME VEIO À MENTE FOI QUE AMÉLIA PROVAVELMENTE É UMA DAS ASSASSINAS."></div><div class="text-hotspot" style="left:44.25%;top:73.125%;width:38.5%;height:.8541666666666666%" data-text="THEN IS THEIR TARGET AURIEL GABIS...?" onclick="showTextTooltip(event,this)" data-translation="ENTÃO O ALVO DELES É AURIEL GABIS...?"></div><div class="text-hotspot" style="left:40.625%;top:80.171875%;width:24.75%;height:.6458333333333334%" data-text="...FOR PERSONAL REASONS." onclick="showTextTooltip(event,this)" data-translation="...POR RAZÕES
