ê estava gritando tão alto como se tivesse uma resposta?"></div><div class="text-hotspot" style="left:77%;top:32.625%;width:22.875%;height:.6197916666666666%" data-text="GLANCE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:43.125%;top:38.109375%;width:46.25%;height:.953125%" data-text="A WISE WARRIOR TAKES OUT THEIR ANGER ON THE RIGHT THINGS." onclick="showTextTooltip(event,this)" data-translation="Um guerreiro sábio desconta sua raiva nas coisas certas."></div><div class="text-hotspot" style="left:28.625%;top:39.78125%;width:31.125000000000004%;height:1.1927083333333333%" data-text="THIS IS NOT WHERE WE SHOULD SHED OUR BLOOD!" onclick="showTextTooltip(event,this)" data-translation="Este não é o lugar onde devemos derramar nosso sangue!"></div><div class="text-hotspot" style="left:25.75%;top:44.390625%;width:23.5%;height:.43750000000000006%" data-text="I GET IT, BUT--" onclick="showTextTooltip(event,this)" data-translation="Entendi, mas--"></div><div class="text-hotspot" style="left:27.750000000000004%;top:45.890625%;width:26.25%;height:.5885416666666666%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:24.25%;top:48.97916666666667%;width:24.375%;height:.4114583333333333%" data-text="HE'S NOT WRONG." onclick="showTextTooltip(event,this)" data-translation="Ele não está errado."></div><div class="text-hotspot" style="left:25.624999999999996%;top:50.35937499999999%;width:61.375%;height:1.4895833333333335%" data-text="HE JUST FULFILLED A GREATER ROLE THAN ANYONE ELSE HERE BY STOPPING NEEDLESS BLOODSHED AND GATHERING US." onclick="showTextTooltip(event,this)" data-translation="Ele acabou de cumprir um papel maior do que qualquer outro aqui ao parar o derramamento de sangue desnecessário e nos reunir."></div><div class="text-hotspot" style="left:27.500000000000004%;top:58.203125%;width:18.75%;height:.16145833333333334%" data-text="ROLE..." onclick="showTextTooltip(event,this)" data-translation="Papel..."></div><div class="text-hotspot" style="left:24.875%;top:61.83854166666667%;width:38%;height:.9635416666666667%" data-text="THAT REMINDS ME OF A PART IN WARLORD PRINCIPLE." onclick="showTextTooltip(event,this)" data-translation="Isso me lembra de uma parte no Princípio do Senhor da Guerra."></div><div class="text-hotspot" style="left:33.375%;top:63.765625%;width:56.75%;height:.9479166666666714%" data-text="&quot;THE WARLORD'S ROLE ISN'T TO FIGHT, BUT TO INSPIRE OTHERS TO.&quot;" onclick="showTextTooltip(event,this)" data-translation="&quot;O papel do senhor da guerra não é lutar, mas inspirar os outros a fazê-lo.&quot;"></div><div class="text-hotspot" style="left:63.375%;top:66.53125%;width:3.375%;height:.3125%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:76.375%;top:67.14583333333334%;width:4.625%;height:.19270833333333334%" data-text="D" onclick="showTextTooltip(event,this)" data-translation="D"></div><div class="text-hotspot" style="left:41.5%;top:68.56770833333333%;width:17.75%;height:.43750000000000006%" data-text="OH?" onclick="showTextTooltip(event,this)" data-translation="Oh?"></div><div class="text-hotspot" style="left:42%;top:69.203125%;width:47.5%;height:.9427083333333428%" data-text="I CAN'T BELIEVE I FOUND ANOTHER PERSON WHO'S READ IT." onclick="showTextTooltip(event,this)" data-translation="Não acredito que encontrei outra pessoa que leu isso."></div><div class="text-hotspot" style="left:21.5%;top:70.70833333333333%;width:37%;height:.9583333333333428%" data-text="MELTER FEND OF CLAN NARTEL, WAS IT?" onclick="showTextTooltip(event,this)" data-translation="Melter Fend do Clã Nartel, não é?"></div><div class="text-hotspot" style="left:11.125%;top:73.671875%;width:30.375000000000004%;height:.4270833333333333%" data-text="YES, LORD KYLE." onclick="showTextTooltip(event,this)" data-translation="Sim, Lorde Kyle."></div><div class="text-hotspot" style="left:45.625%;top:75.359375%;width:28.499999999999996%;height:.640625%" data-text="OH....?" onclick="showTextTooltip(event,this)" data-translation="Oh....?"></div><div class="text-hotspot" style="left:51.5%;top:76.38541666666666%;width:35.5%;height:.4322916666666667%" data-text="YOU SEEM TO KNOW ME." onclick="showTextTooltip(event,this)" data-translation="Parece que você me conhece."></div><div class="text-hotspot" style="left:9.125%;top:77.59375%;width:18.375%;height:.35416666666666663%" data-text="HAHA" onclick="showTextTooltip(event,this)" data-translation="Haha"></div><div class="text-hotspot" style="left:20.125%;top:78.13541666666667%;width:30.625%;height:.9375%" data-text="YOUR REPUTATION PRECEDES You." onclick="showTextTooltip(event,this)" data-translation="Sua reputação o precede."></div><div class="text-hotspot" style="left:35.875%;top:79.9375%;width:27.875%;height:.7604166666666667%" data-text="THAT ISN'T NECESSARILY GOOD." onclick="showTextTooltip(event,this)" data-translation="Isso não é necessariamente bom."></div><div class="text-hotspot" style="left:12%;top:85.5%;width:38.375%;height:.7395833333333334%" data-text="UPON SEEING THAT BONDING ON DISPLAY..." onclick="showTextTooltip(event,this)" data-translation="Ao ver essa união em exibição..."></div><div class="text-hotspot" style="left:46%;top:93.52083333333333%;width:41.375%;height:.6875%" data-text="...ABANDONED ADVENTURERS MIGHT FEEL ANXIOUS." onclick="showTextTooltip(event,this)" data-translation="...Aventureiros abandonados podem se sentir ansiosos."></div><div class="text-hotspot" style="left:24.875%;top:98.44270833333333%;width:37.125%;height:.765625%" data-text="THAT'S ENOUGH! WE MUST TALK!" onclick="showTextTooltip(event,this)" data-translation="Já chega! Precisamos conversar!"></div><div class="text-hotspot" style="left:50.375%;top:99.88020833333333%;width:14.75%;height:.11458333333333333%" data-text="DOES ANYONE HERE HAVE MORE INFORMATION?! SHOUT" onclick="showTextTooltip(event,this)" data-translation="Alguém aqui tem mais informações?! GRITO"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/142/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:0;top:.15625%;width:79.75%;height:2.5104166666666665%" data-text="DOES ANYONE HERE HAVE MORE INFORMATION?! SHOUT" onclick="showTextTooltip(event,this)" data-translation="ALGUÉM AQUI TEM MAIS INFORMAÇÕES?! GRITEM"></div><div class="text-hotspot" style="left:19.625%;top:7.359375%;width:35.75%;height:.9635416666666667%" data-text="FOR MY PLAN TO WORK, THEY NEED TO DISCUSS STRATEGIES." onclick="showTextTooltip(event,this)" data-translation="PARA O MEU PLANO FUNCIONAR, ELES PRECISAM DISCUTIR ESTRATÉGIAS."></div><div class="text-hotspot" style="left:34.875%;top:9.28125%;width:50.24999999999999%;height:.6822916666666666%" data-text="AND THEY NEED TO QUICKLY REACH THE CONCLUSION I'VE MADE." onclick="showTextTooltip(event,this)" data-translation="E ELES PRECISAM CHEGAR RAPIDAMENTE À CONCLUSÃO QUE EU JÁ TIREI."></div><div class="text-hotspot" style="left:22.5%;top:14.270833333333332%;width:27.750000000000004%;height:.6770833333333334%" data-text="WE FIRST MUST FIND OUT..." onclick="showTextTooltip(event,this)" data-translation="PRIMEIRO DEVEMOS DESCOBRIR..."></div><div class="text-hotspot" style="left:38.875%;top:15.640625%;width:30.75%;height:1.2291666666666665%" data-text="WHY THE ROYAL COURT HAS FORSAKEN US." onclick="showTextTooltip(event,this)" data-translation="POR QUE A CORTE REAL NOS ABANDONOU."></div><div class="text-hotspot" style="left:12.75%;top:22.71875%;width:47.25%;height:.96875%" data-text="THAT'S RIGHT! WE STOOD OUR GROUND SO WELL THUS FAR!" onclick="showTextTooltip(event,this)" data-translation="EXATO! NÓS MANTIVEMOS NOSSA POSIÇÃO TÃO BEM ATÉ AGORA!"></div><div class="text-hotspot" style="left:34%;top:26.942708333333332%;width:35%;height:1.2395833333333333%" data-text="... THAT'S PROBABLY BECAUSE OF THE LORD OF THIS FLOOR." onclick="showTextTooltip(event,this)" data-translation="... ISSO PROVAVELMENTE É POR CAUSA DO SENHOR DESTE ANDAR."></div><div class="text-hotspot" style="left:30.375000000000004%;top:33.484375%;width:44.5%;height:.953125%" data-text="ONCE THE NINTH LORD IS SLAIN, A GREAT CALAMITY SHALL COME." onclick="showTextTooltip(event,this)" data-translation="UMA GRANDE CALAMIDADE VIRÁ QUANDO O NONO SENHOR FOR DERROTADO."></div><div class="text-hotspot" style="left:15.5%;top:38.557291666666664%;width:69.5%;height:1.0364583333333333%" data-text="BERZAK, THE LORD OF THE ABYSS." onclick="showTextTooltip(event,this)" data-translation="BERZAK, O SENHOR DO ABISMO."></div><div class="text-hotspot" style="left:4.25%;top:46.380208333333336%;width:46.5%;height:.2864583333333333%" data-text="IT PROBABLY SOUNDS UNFAMILIAR TO MOST OF YOU." onclick="showTextTooltip(event,this)" data-translation="PROVAVELMENTE SOA DESCONHECIDO PARA A MAIORIA DE VOCÊS."></div><div class="text-hotspot" style="left:19.25%;top:47.4375%;width:42.625%;height:1.0520833333333333%" data-text="BUT THAT'S ONE OF THE LORDS OF THE FIRST FLOOR." onclick="showTextTooltip(event,this)" data-translation="MAS ESSE É UM DOS SENHORES DO PRIMEIRO ANDAR."></div><div class="text-hotspot" style="left:23.5%;top:53.59374999999999%;width:65.25%;height:1.90625%" data-text="IT'S BECAUSE OF THIS BEAST THAT ADVENTURERS MUST FIRST REPORT TO THE GUILD IF THEY WANT TO SLAY THE LORD OF TERROR." onclick="showTextTooltip(event,this)" data-translation="É POR CAUSA DESSA BESTA QUE OS AVENTUREIROS DEVEM PRIMEIRO RELATAR À GUILDA SE QUISEREM DERROTAR O SENHOR DO TERROR."></div><div class="text-hotspot" style="left:22.875%;top:59.963541666666664%;width:45.875%;height:.9739583333333333%" data-text="ARE YOU SAYING THAT THIS LORD OF THE ABYSS IS TOO MUCH….." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ DIZENDO QUE ESSE SENHOR DO ABISMO É DEMAIS..."></div><div class="text-hotspot" style="left:43.75%;top:61.734375%;width:40.875%;height:1.1979166666666667%" data-text="EVEN IF THE ROYAL KNIGHTS AND LARGE CLANS WORK TOGETHER?" onclick="showTextTooltip(event,this)" data-translation="MESMO SE OS CAVALEIROS REAIS E GRANDES CLÃS TRABALHAREM JUNTOS?"></div><div class="text-hotspot" style="left:37.5%;top:67.9375%;width:36.375%;height:.6979166666666572%" data-text="NO, I WOULDN'T GO THAT FAR." onclick="showTextTooltip(event,this)" data-translation="NÃO, EU NÃO IRIA TÃO LONGE."></div><div class="text-hotspot" style="left:12.5%;top:69.61979166666666%;width:55.625%;height:1.234375%" data-text="HOWEVER, DO YOU THINK NOARK WOULD DO NOTHING IF WE STARTED FIGHTING BERZAK?" onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, VOCÊ ACHA QUE NOARK NÃO FARIA NADA SE COMEÇÁSSEMOS A LUTAR CONTRA BERZAK?"></div><div class="text-hotspot" style="left:5.375%;top:74.734375%;width:69.625%;height:2.6614583333333335%" data-text="REGARDLESS OF THE OUTCOME OF THE HUNT, BOTH NOARK AND WE WOULD SUSTAIN MASSIVE LOSSES. CLAMOR" onclick="showTextTooltip(event,this)" data-translation="INDEPENDENTEMENTE DO RESULTADO DA CAÇADA, TANTO NOARK QUANTO NÓS TERÍAMOS PERDAS MASSIVAS. CLAMOR"></div><div class="text-hotspot" style="left:50.375%;top:80.125%;width:19.125%;height:.171875%" data-text="HOLY...!" onclick="showTextTooltip(event,this)" data-translation="SANTO...!"></div><div class="text-hotspot" style="left:26.25%;top:84.31770833333333%;width:34.875%;height:.4322916666666667%" data-text="THE KNIGHT COMMANDER" onclick="showTextTooltip(event,this)" data-translation="O COMANDANTE DOS CAVALEIROS"></div><div class="text-hotspot" style="left:26.625%;top:84.56770833333334%;width:46.75%;height:1.2239583333333286%" data-text="BASTARD DECIDED TO RUN AWAY BECAUSE HE COULDN'T THINK FURTHER FROM THERE." onclick="showTextTooltip(event,this)" data-translation="DESGRAÇADO DECIDIU FUGIR PORQUE NÃO CONSEGUIA PENSAR ALÉM DISSO."></div><div class="text-hotspot" style="left:32.5%;top:89.93229166666666%;width:35.125%;height:.6875%" data-text="IT'S FOR THE SAKE OF THAT DAMN ROYAL COURT." onclick="showTextTooltip(event,this)" data-translation="É PELO BEM DAQUELA MALDITA CORTE REAL."></div><div class="text-hotspot" style="left:27%;top:99.66145833333333%;width:22.5%;height:.171875%" data-text="HIGH-TIER KNIGHTS" onclick="showTextTooltip(event,this)" data-translation="CAVALEIROS DE ALTO NÍVEL"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/142/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:49.875%;top:0;width:4.375%;height:.09375%" data-text="AN" onclick="showTextTooltip(event,this)" data-translation="UM"></div><div class="text-hotspot" style="left:28.000000000000004%;top:.18229166666666666%;width:19.25%;height:.19270833333333334%" data-text="HIGH-TIER KNIGHTS" onclick="showTextTooltip(event,this)" data-translation="CAVALEIROS DE ALTO NÍVEL"></div><div class="text-hotspot" style="left:31.874999999999996%;top:1.2239583333333333%;width:53.374999999999986%;height:1.2135416666666667%" data-text="HE CHOSE TO PROTECT THE SO-CALLED ELITE TROOPS, WHO ARE DIFFICULT TO REPLACE IN A SHORT SPAN OF TIME." onclick="showTextTooltip(event,this)" data-translation="ELE ESCOLHEU PROTEGER AS CHAMADAS TROPAS DE ELITE, QUE SÃO DIFÍCEIS DE SUBSTITUIR EM POUCO TEMPO."></div><div class="text-hotspot" style="left:13.125%;top:6.385416666666667%;width:60.62499999999999%;height:1.6458333333333333%" data-text="WAIT A MINUTE! THEN WHY DIDN'T WE TRY TO ADVANCE TO THE SECOND FLOOR BEFORE THAT HAPPENED?" onclick="showTextTooltip(event,this)" data-translation="ESPERA UM MINUTO! ENTÃO POR QUE NÃO TENTAMOS AVANÇAR PARA O SEGUNDO ANDAR ANTES DISSO ACONTECER?"></div><div class="text-hotspot" style="left:42.125%;top:13.932291666666666%;width:46.125%;height:.6770833333333334%" data-text="I SHOULD BE ABLE TO ANSWER THAT." onclick="showTextTooltip(event,this)" data-translation="EU DEVERIA SER CAPAZ DE RESPONDER A ISSO."></div><div class="text-hotspot" style="left:27%;top:21%;width:48.875%;height:1.484375%" data-text="I HEARD THIS WHILE HEALING A KNIGHT WHO HAD SCOUTED THE WESTERN PORTAL AREA." onclick="showTextTooltip(event,this)" data-translation="OUVI ISSO ENQUANTO CURAVA UM CAVALEIRO QUE HAVIA EXPLORADO A ÁREA DO PORTAL OESTE."></div><div class="text-hotspot" style="left:14.75%;top:26.416666666666664%;width:71.5%;height:1.2447916666666665%" data-text="THAT CURSED MAGE SCHOLAR OF RUIN DESTROYED THE PORTAL." onclick="showTextTooltip(event,this)" data-translation="AQUELE MALDITO MAGE ERUDITO DA RUÍNA DESTRUIU O PORTAL."></div><div class="text-hotspot" style="left:40.5%;top:36.791666666666664%;width:52.125%;height:.953125%" data-text="DESTROYED THE PORTAL...? I DIDN'T KNOW THAT WAS EVEN POSSIBLE!" onclick="showTextTooltip(event,this)" data-translation="DESTRUIU O PORTAL...? EU NÃO SABIA QUE ISSO ERA POSSÍVEL!"></div><div class="text-hotspot" style="left:25.374999999999996%;top:42.421875%;width:47.875%;height:.9635416666666714%" data-text="I'VE NEVER EVEN CONSIDERED THAT SCENARIO..." onclick="showTextTooltip(event,this)" data-translation="NUNCA NEM CONSIDEREI ESSE CENÁRIO..."></div><div class="text-hotspot" style="left:68.5%;top:47.703125%;width:28.249999999999996%;height:.9322916666666667%" data-text="GRIND" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:29.25%;top:48.302083333333336%;width:47.75%;height:1.203125%" data-text="...BUT SCHOLAR OF RUIN IS CERTAINLY CAPABLE OF DOING THAT." onclick="showTextTooltip(event,this)" data-translation="...MAS O ERUDITO DA RUÍNA CERTAMENTE É CAPAZ DE FAZER ISSO."></div><div class="text-hotspot" style="left:49.125%;top:52.46354166666667%;width:8.625%;height:.16145833333333334%" data-text="...?" onclick="showTextTooltip(event,this)" data-translation="...?"></div><div class="text-hotspot" style="left:30.125%;top:55.989583333333336%;width:56.625%;height:1.2135416666666665%" data-text="THE KNIGHT SAID SCHOLAR OF RUIN MUST HAVE ALREADY DONE THE SAME TO OTHER PORTALS." onclick="showTextTooltip(event,this)" data-translation="O CAVALEIRO DISSE QUE O ERUDITO DA RUÍNA JÁ DEVE TER FEITO O MESMO COM OUTROS PORTAIS."></div><div class="text-hotspot" style="left:13.5%;top:60.94791666666667%;width:45.5%;height:.9427083333333334%" data-text="THEN WE'RE COMPLETELY TRAPPED ON THE FIRST FLOOR..." onclick="showTextTooltip(event,this)" data-translation="ENTÃO ESTAMOS COMPLETAMENTE PRESOS NO PRIMEIRO ANDAR..."></div><div class="text-hotspot" style="left:30.75%;top:62.66145833333333%;width:50.25%;height:1.4739583333333286%" data-text="NOARK BASTARDS CAME READY THIS TIME. IS THAT HOW MUCH THEY WANT TO KILL ALL OF US?" onclick="showTextTooltip(event,this)" data-translation="OS DESGRAÇADOS DE NOARK VIERAM PREPARADOS DESSA VEZ. É TANTO ASSIM QUE ELES QUEREM MATAR TODOS NÓS?"></div><div class="text-hotspot" style="left:55.125%;top:75.71875%;width:26%;height:.4166666666666667%" data-text="THAT'S STRANGE." onclick="showTextTooltip(event,this)" data-translation="ISSO É ESTRANHO."></div><div class="text-hotspot" style="left:24.5%;top:76.97916666666667%;width:47.5%;height:1.2083333333333286%" data-text="A SEASONED WARRIOR ALWAYS ANTICIPATES THE ENEMY'S NEXT MOVE." onclick="showTextTooltip(event,this)" data-translation="UM GUERREIRO EXPERIENTE SEMPRE ANTECIPA O PRÓXIMO MOVIMENTO DO INIMIGO."></div><div class="text-hotspot" style="left:17.5%;top:81.38541666666667%;width:66.625%;height:1.453125%" data-text="DO YOU REALLY THINK THEY FAILED TO PREDICT THE USE OF DIMENSION DOOR?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ REALMENTE ACHA QUE ELES FALHARAM EM PREVER O USO DA PORTA DIMENSIONAL?"></div><div class="text-hotspot" style="left:67.125%;top:85.17708333333334%;width:9.25%;height:.19270833333333334%" data-text="...!" onclick="showTextTooltip(event,this)" data-translation="...!"></div><div class="text-hotspot" style="left:31.75%;top:88.47395833333334%;width:21.875%;height:.6822916666666572%" data-text="WAIT... I GET IT NOW...!" onclick="showTextTooltip(event,this)" data-translation="ESPERA... AGORA ENTENDI...!"></div><div class="text-hotspot" style="left:43%;top:89.63541666666667%;width:41.75%;height:1.484375%" data-text="THEY WERE AFTER THE PEOPLE TO GET LEFT BEHIND FROM THE GET-GO!" onclick="showTextTooltip(event,this)" data-translation="ELES ESTAVAM DE OLHO NAS PESSOAS QUE FICARAM PARA TRÁS DESDE O INÍCIO!"></div><div class="text-hotspot" style="left:28.249999999999996%;top:98.83854166666667%;width:43.625%;height:.9583333333333286%" data-text="WOW, HE ACTUALLY UNDERSTOOD WHERE I WAS GOING WITH THIS!" onclick="showTextTooltip(event,this)" data-translation="Uau, ele realmente entendeu onde eu queria chegar com isso!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/142/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22.25%;top:3.4895833333333335%;width:36.75%;height:.9583333333333333%" data-text="WH-WHAT DO YOU MEAN BY THAT, LORD KYLE?" onclick="showTextTooltip(event,this)" data-translation="O-O que você quer dizer com isso, Lorde Kyle?"></div><div class="text-hotspot" style="left:37.375%;top:10.489583333333332%;width:52.37500000000001%;height:1.2239583333333333%" data-text="WHY WOULD THEY TARGET US INSTEAD OF THE ROYAL KNIGHTS OR LARGER CLANS?" onclick="showTextTooltip(event,this)" data-translation="Por que eles nos atacariam em vez dos Cavaleiros Reais ou dos Clãs Maiores?"></div><div class="text-hotspot" style="left:25.5%;top:14.656250000000002%;width:50.125%;height:1.625%" data-text="THE MORE I THINK, THE MORE CONVINCED I AM THAT THIS BENEFITS NOARK THE MOST." onclick="showTextTooltip(event,this)" data-translation="Quanto mais eu penso, mais convencido fico de que isso beneficia Noark mais do que qualquer um."></div><div class="text-hotspot" style="left:55.125%;top:18.619791666666664%;width:28.999999999999996%;height:.4479166666666667%" data-text="[0/1]" onclick="showTextTooltip(event,this)" data-translation="[0/1]"></div><div class="text-hotspot" style="left:69.875%;top:20.989583333333332%;width:25.25%;height:.49479166666666663%" data-text="[29]" onclick="showTextTooltip(event,this)" data-translation="[29]"></div><div class="text-hotspot" style="left:8.375%;top:23.244791666666668%;width:66.75%;height:1.4739583333333335%" data-text="WITH THIS MOVE, THEY WASTED MORE THAN A HUNDRED DIMENSION DOOR SPELLS BY HIGH-CLASS MAGES." onclick="showTextTooltip(event,this)" data-translation="Com esse movimento, eles desperdiçaram mais de cem feitiços de Porta Dimensional de magos de alto nível."></div><div class="text-hotspot" style="left:39.875%;top:28.0625%;width:48.375%;height:1.46875%" data-text="THEY ALSO SOWED SEEDS OF DISSENSION BETWEEN THE ROYAL COURT AND ADVENTURERS." onclick="showTextTooltip(event,this)" data-translation="Eles também semearam a discórdia entre a Corte Real e os aventureiros."></div><div class="text-hotspot" style="left:12.375%;top:35.28125%;width:57.49999999999999%;height:.96875%" data-text="FURTHERMORE, EVEN THOUGH WE MAY NOT BE THE STRONGEST COMBATANTS," onclick="showTextTooltip(event,this)" data-translation="Além disso, mesmo que não sejamos os combatentes mais fortes,"></div><div class="text-hotspot" style="left:25.25%;top:37.484375%;width:63.5%;height:1.4739583333333335%" data-text="THAT'S STILL MORE THAN 10,000 ADVENTURERS THEY CAN WIPE OUT WITHOUT DIRTYING THEIR OWN HANDS." onclick="showTextTooltip(event,this)" data-translation="ainda são mais de 10.000 aventureiros que eles podem eliminar sem sujar as próprias mãos."></div><div class="text-hotspot" style="left:21.25%;top:42.95833333333333%;width:55.875%;height:1.7291666666666667%" data-text="WHAT ARE YOU TALKING ABOUT? NOARK BASTARDS CAN'T BE SAFE FROM HARM EITHER IF THAT ABYSS THING SHOWS UP." onclick="showTextTooltip(event,this)" data-translation="Do que você está falando? Os desgraçados de Noark também não estarão seguros se aquela coisa do Abismo aparecer."></div><div class="text-hotspot" style="left:12.375%;top:48.604166666666664%;width:47.25%;height:1.2083333333333357%" data-text="THEY JUST HAVE TO ADVANCE TO THE UPPER FLOOR, PROBLEM SOLVED." onclick="showTextTooltip(event,this)" data-translation="Eles só precisam avançar para o andar superior, problema resolvido."></div><div class="text-hotspot" style="left:45.125%;top:50.9375%;width:47.125%;height:1.203125%" data-text="THEY JUST SAID SCHOLAR OF RUIN DESTROYED ALL PORTALS--" onclick="showTextTooltip(event,this)" data-translation="Eles acabaram de dizer que o Erudito da Ruína destruiu todos os portais--"></div><div class="text-hotspot" style="left:41.5%;top:56.791666666666664%;width:18.375%;height:.24479166666666669%" data-text="SIR!!" onclick="showTextTooltip(event,this)" data-translation="Senhor!!"></div><div class="text-hotspot" style="left:17.125%;top:63.92187499999999%;width:65.125%;height:1.47395833333335%" data-text="NOARK BASTARDS THAT HAD BEEN BLOCKING THE PATHS ALL DISAPPEARED!" onclick="showTextTooltip(event,this)" data-translation="Os desgraçados de Noark que estavam bloqueando os caminhos desapareceram todos!"></div><div class="text-hotspot" style="left:58.25%;top:67.78125%;width:24%;height:.20833333333333334%" data-text="WHAT?!" onclick="showTextTooltip(event,this)" data-translation="O quê?!"></div><div class="text-hotspot" style="left:20.75%;top:72.08854166666666%;width:53.125%;height:1.4635416666666856%" data-text="THE PREMISE THAT THEY DESTROYED ALL PORTALS WAS WRONG TO BEGIN WITH." onclick="showTextTooltip(event,this)" data-translation="A premissa de que eles destruíram todos os portais estava errada desde o começo."></div><div class="text-hotspot" style="left:54%;top:74.02083333333334%;width:19.5%;height:.703125%" data-text="WHAT DO YOU SAY?" onclick="showTextTooltip(event,this)" data-translation="O que você diz?"></div><div class="text-hotspot" style="left:23.375%;top:77.65625%;width:3.125%;height:.16145833333333334%" data-text="*" onclick="showTextTooltip(event,this)" data-translation="*"></div><div class="text-hotspot" style="left:11.125%;top:78.47916666666667%;width:20.375%;height:.4270833333333333%" data-text="IS THAT TRUE?!" onclick="showTextTooltip(event,this)" data-translation="Isso é verdade?!"></div><div class="text-hotspot" style="left:51.37500000000001%;top:79.61458333333333%;width:35.25%;height:1.234375%" data-text="I'M AFRAID IT IS, SIR. WE COULDN'T FIND ANY OF THEM..." onclick="showTextTooltip(event,this)" data-translation="Receio que sim, senhor. Não conseguimos encontrar nenhum deles..."></div><div class="text-hotspot" style="left:34.75%;top:82.828125%;width:29.75%;height:.8333333333333334%" data-text="WHAT'S WRONG WITH THIS DUDE...?" onclick="showTextTooltip(event,this)" data-translation="Qual é o problema desse cara...?"></div><div class="text-hotspot" style="left:68.625%;top:84.36458333333333%;width:16.75%;height:.4531250000000142%" data-text="WHY IS HE ACTING SO FRIENDLY?" onclick="showTextTooltip(event,this)" data-translation="Por que ele está agindo de forma tão amigável?"></div><div class="text-hotspot" style="left:24.375%;top:92.90104166666666%;width:50.625%;height:1.15625%" data-text="THINGS ARE GETTING TENSE, AND IT'S CLEAR WHAT WE MUST DO." onclick="showTextTooltip(event,this)" data-translation="As coisas estão ficando tensas, e está claro o que devemos fazer."></div><div class="text-hotspot" style="left:21.375%;top:99.75520833333333%;width:42.125%;height:.1875%" data-text="THEORETICALLY, THE PORTAL ON THE FIRST FLOOR BELONGS TO THIS FLOOR." onclick="showTextTooltip(event,this)" data-translation="Teoricamente, o portal no primeiro andar pertence a este andar."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/142/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:19.125%;top:.026041666666666668%;width:46.875%;height:.9479166666666667%" data-text="THEORETICALLY, THE PORTAL ON THE FIRST FLOOR BELONGS TO THIS FLOOR." onclick="showTextTooltip(event,this)" data-translation="Teoricamente, o portal no primeiro andar pertence a este andar."></div><div class="text-hotspot" style="left:33.375%;top:1.5208333333333335%;width:49.625%;height:1.484375%" data-text="WHICH MEANS THAT EVEN SCHOLAR OF RUIN CAN'T DESTROY IT FROM THE SECOND FLOOR." onclick="showTextTooltip(event,this)" data-translation="O que significa que nem mesmo o Erudito da Ruína pode destruí-lo do segundo andar."></div><div class="text-hotspot" style="left:18.875%;top:9.765625%;width:38.375%;height:.703125%" data-text="THE FACT THAT NOARK BASTARDS ALL DISAPPEARED..." onclick="showTextTooltip(event,this)" data-translation="O fato de que todos os desgraçados de Noark desapareceram..."></div><div class="text-hotspot" style="left:31.874999999999996%;top:11.286458333333334%;width:54.75%;height:.6979166666666666%" data-text="SUGGESTS THAT THERE IS AT LEAST ONE PORTAL REMAINING." onclick="showTextTooltip(event,this)" data-translation="sugere que há pelo menos um portal restante."></div><div class="text-hotspot" style="left:20.5%;top:16.041666666666668%;width:52.87500000000001%;height:1.2083333333333333%" data-text="ADVANCING TO THE SECOND FLOOR IS A PROBLEM AS WELL. THEY HAVE TO BE WAITING FOR US..." onclick="showTextTooltip(event,this)" data-translation="Avançar para o segundo andar também é um problema. Eles devem estar nos esperando..."></div><div class="text-hotspot" style="left:15.5%;top:21.71875%;width:35.875%;height:.953125%" data-text="IT'S STILL BETTER THAN US ALL DYING HERE." onclick="showTextTooltip(event,this)" data-translation="Ainda é melhor do que todos nós morrermos aqui."></div><div class="text-hotspot" style="left:35.75%;top:23.255208333333332%;width:34%;height:.9479166666666667%" data-text="OF COURSE, IT'S UP TO EACH INDIVIDUAL." onclick="showTextTooltip(event,this)" data-translation="Claro, cabe a cada indivíduo."></div><div class="text-hotspot" style="left:48.625%;top:27.442708333333332%;width:39.125%;height:.9375%" data-text="WE SHOULD SEPARATE INTO GROUPS OF AROUND 300." onclick="showTextTooltip(event,this)" data-translation="Devemos nos separar em grupos de cerca de 300."></div><div class="text-hotspot" style="left:18.375%;top:34.27604166666667%;width:46.375%;height:1.2083333333333333%" data-text="I AGREE. MORE THAN THAT DOESN'T MEAN MUCH GIVEN THE TERRAIN." onclick="showTextTooltip(event,this)" data-translation="Concordo. Mais do que isso não significa muito, dado o terreno."></div><div class="text-hotspot" style="left:32.25%;top:37.807291666666664%;width:55.25%;height:1.687500000000007%" data-text="HA! MOST PEOPLE WILL DIE IF WE ENCOUNTER THAT BEAST ANYWAYS." onclick="showTextTooltip(event,this)" data-translation="Ha! A maioria das pessoas vai morrer se encontrarmos aquela besta de qualquer maneira."></div><div class="text-hotspot" style="left:12.125%;top:40.338541666666664%;width:54.50000000000001%;height:1.46875%" data-text="SO WE'RE SUPPOSED TO SERVE AS DECOY FOR OTHER GROUPS AND LOOK FOR OUR OWN WAY OUT." onclick="showTextTooltip(event,this)" data-translation="Então devemos servir de isca para outros grupos e procurar nossa própria saída."></div><div class="text-hotspot" style="left:50.24999999999999%;top:46.916666666666664%;width:35.5%;height:.703125%" data-text="MAY HE PROTECT ALL OF US..." onclick="showTextTooltip(event,this)" data-translation="Que Ele proteja todos nós..."></div><div class="text-hotspot" style="left:21.375%;top:51.151041666666664%;width:56.125%;height:1.234375%" data-text="THAT MARKED THE BEGINNING OF ABSOLUTE DISORDER AS ADVENTURERS TRIED TO RECRUIT STRONG MEMBERS TO THEIR GROUP." onclick="showTextTooltip(event,this)" data-translation="Isso marcou o início do caos absoluto enquanto os aventureiros tentavam recrutar membros fortes para seus grupos."></div><div class="text-hotspot" style="left:27.500000000000004%;top:56.47395833333333%;width:59.25%;height:1.2135416666666714%" data-text="WE ARE CLAN RED LIGHT! ANY TIER-6 OR HIGHER ADVENTURERS ARE WELCOME!" onclick="showTextTooltip(event,this)" data-translation="NÓS SOMOS O CLÃ LUZ VERMELHA! QUALQUER AVENTUREIRO DE NÍVEL 6 OU SUPERIOR É BEM-VINDO!"></div><div class="text-hotspot" style="left:35%;top:64.328125%;width:35.75%;height:1.4739583333333335%" data-text="O-ONE OF MY PARTY MEMBERS IS TIER-7. CAN YOU MAKE AN EXCEPTION?" onclick="showTextTooltip(event,this)" data-translation="U-UM DOS MEMBROS DO MEU GRUPO É NÍVEL 7. VOCÊ PODE ABRIR UMA EXCEÇÃO?"></div><div class="text-hotspot" style="left:25%;top:69.81770833333333%;width:41.375%;height:1.21875%" data-text="YOU WILL FOLLOW ME! FIGHT UNTIL YOU DIE AS YOU WISH!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ VAI ME SEGUIR! LUTE ATÉ MORRER, SE ASSIM DESEJAR!"></div><div class="text-hotspot" style="left:88.5%;top:72.328125%;width:3.75%;height:.296875%" data-text="KOM" onclick="showTextTooltip(event,this)" data-translation="KOM"></div><div class="text-hotspot" style="left:58.75%;top:76.80729166666667%;width:18.375%;height:.1875%" data-text="...FINE." onclick="showTextTooltip(event,this)" data-translation="...TÁ BOM."></div><div class="text-hotspot" style="left:84%;top:80.97916666666667%;width:14.625%;height:.8333333333333334%" data-text="+18" onclick="showTextTooltip(event,this)" data-translation="+18"></div><div class="text-hotspot" style="left:30.25%;top:82.16145833333334%;width:40.625%;height:.3854166666666667%" data-text="mine ちお" onclick="showTextTooltip(event,this)" data-translation="meu ちお"></div><div class="text-hotspot" style="left:0;top:83.79166666666666%;width:21.25%;height:.3020833333333333%" data-text="me" onclick="showTextTooltip(event,this)" data-translation="eu"></div><div class="text-hotspot" style="left:26.25%;top:88.19270833333334%;width:40.5%;height:.682291666666643%" data-text="WILL YOU COME WITH MY CLAN, LORD KYLE?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ VIRÁ COM MEU CLÃ, LORD KYLE?"></div><div class="text-hotspot" style="left:69.375%;top:89.859375%;width:5%;height:.38020833333333337%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:43.875%;top:94.42708333333333%;width:29.125%;height:1.1979166666666714%" data-text="...I SHOULD ALSO MAKE A MOVE BEFORE THEY'RE ALL GONE." onclick="showTextTooltip(event,this)" data-translation="...EU TAMBÉM DEVERIA ME MEXER ANTES QUE TODOS ELES SUMAM."></div><div class="text-hotspot" style="left:65.875%;top:96.50520833333334%;width:24.75%;height:.4739583333333144%" data-text="AFTER I JOIN UP WITH MY TEAM FIRST." onclick="showTextTooltip(event,this)" data-translation="DEPOIS QUE EU ME JUNTAR AO MEU TIME PRIMEIRO."></div><div class="text-hotspot" style="left:32.75%;top:99.66666666666667%;width:29.5%;height:.20833333333333334%" data-text="HOLD ON." onclick="showTextTooltip(event,this)" data-translation="ESPERA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/142/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:69%;top:1.9427083333333335%;width:30.875000000000004%;height:.765625%" data-text="PAUSE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25%;top:6.15625%;width:28.249999999999996%;height:.6927083333333334%" data-text="WHAT ARE YOU GOING TO DO?" onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ VAI FAZER?"></div><div class="text-hotspot" style="left:36.25%;top:7.677083333333333%;width:39.5%;height:.9479166666666667%" data-text="YOU'D RATHER BE THE HEAD THAN THE TAIL, RIGHT?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ PREFERE SER A CABEÇA DO QUE O RABO, CERTO?"></div><div class="text-hotspot" style="left:18.5%;top:12.427083333333332%;width:5.5%;height:.234375%" data-text="ऋ" onclick="showTextTooltip(event,this)" data-translation="ऋ"></div><div class="text-hotspot" style="left:23%;top:14.000000000000002%;width:31.75%;height:.17708333333333331%" data-text="OF COURSE." onclick="showTextTooltip(event,this)" data-translation="CLARO."></div><div class="text-hotspot" style="left:53%;top:15.729166666666666%;width:29.875%;height:.703125%" data-text="THEN I'M COMING WITH YOU." onclick="showTextTooltip(event,this)" data-translation="ENTÃO EU VOU COM VOCÊ."></div><div class="text-hotspot" style="left:46.125%;top:20.234375%;width:14.875%;height:.16145833333333334%" data-text="WHY?" onclick="showTextTooltip(event,this)" data-translation="POR QUÊ?"></div><div class="text-hotspot" style="left:79.125%;top:22.302083333333332%;width:19.375%;height:.4166666666666667%" data-text="SHRUG" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.875%;top:26.208333333333332%;width:36%;height:1.4739583333333335%" data-text="MY INTUITION. I'M GETTING THE FEELING THAT PEOPLE WILL GATHER AROUND YOU." onclick="showTextTooltip(event,this)" data-translation="MINHA INTUIÇÃO. ESTOU SENTINDO QUE AS PESSOAS VÃO SE REUNIR AO SEU REDOR."></div><div class="text-hotspot" style="left:46.375%;top:28.911458333333336%;width:41.125%;height:.953125%" data-text="...ARE YOU OUT OF YOUR MIND? IT'S YOUR LIFE ON THE LINE." onclick="showTextTooltip(event,this)" data-translation="...VOCÊ ESTÁ FORA DE SI? É SUA VIDA QUE ESTÁ EM JOGO."></div><div class="text-hotspot" style="left:24.875%;top:33.47395833333333%;width:50.74999999999999%;height:1.4583333333333333%" data-text="YOU CAN'T EXPECT A MAGE THAT CHOSE TO STAY BEHIND TO BE SANE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO PODE ESPERAR QUE UM MAGO QUE ESCOLHEU FICAR PARA TRÁS SEJA SÃO."></div><div class="text-hotspot" style="left:7.75%;top:37.51041666666667%;width:27.125%;height:.6770833333333334%" data-text="WINK" onclick="showTextTooltip(event,this)" data-translation="PISCAR"></div><div class="text-hotspot" style="left:25.124999999999996%;top:42.390625%;width:19.25%;height:.5208333333333333%" data-text="...POINT TAKEN." onclick= %;height:1.7447916666666572%" data-text="I SEE. I TAKE IT THAT YOU'RE PLANNING TO HEAD NORTH OR SOUTH IF EASTWARD DOESN'T SEEM VIABLE?" onclick="showTextTooltip(event,this)" data-translation="ENTENDO. IMAGINO QUE VOCÊ PLANEJE IR PARA O NORTE OU SUL SE O LESTE NÃO PARECER VIÁVEL?"></div><div class="text-hotspot" style="left:14.875%;top:82%;width:56.49999999999999%;height:1.2239583333333333%" data-text="COINCIDENTALLY, I HAPPEN TO TRAVEL THAT WAY AS WELL. WHY DON'T WE MOVE TOGETHER?" onclick="showTextTooltip(event,this)" data-translation="COINCIDENTEMENTE, EU TAMBÉM VIAJO NESSE CAMINHO. POR QUE NÃO NOS MOVEMOS JUNTOS?"></div><div class="text-hotspot" style="left:44.625%;top:86.92708333333333%;width:45.875%;height:.9427083333333334%" data-text="...I HAVE NO INTENTION OF FOLLOWING YOUR COMMAND." onclick="showTextTooltip(event,this)" data-translation="...NÃO TENHO INTENÇÃO DE SEGUIR SUAS ORDENS."></div><div class="text-hotspot" style="left:16.5%;top:94.06770833333333%;width:43.375%;height:1.2083333333333286%" data-text="DON'T WORRY. ALL OF MY CLAN MEMBERS AND I WILL FOLLOW YOU." onclick="showTextTooltip(event,this)" data-translation="NÃO SE PREOCUPE. TODOS OS MEMBROS DO MEU CLÃ E EU VAMOS SEGUIR VOCÊ."></div><div class="text-hotspot" style="left:59.62499999999999%;top:96.89583333333334%;width:24.75%;height:.19270833333333334%" data-text="WHAT...?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ...?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/142/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22.625%;top:.13541666666666669%;width:54.37499999999999%;height:.5729166666666666%" data-text="WHAT IN THE WORLD IS GOING ON...?" onclick="showTextTooltip(event,this)" data-translation="O QUE ESTÁ ACONTECENDO...?"></div><div class="text-hotspot" style="left:21%;top:.9427083333333334%;width:4.125%;height:.3489583333333333%" data-text="し" onclick="showTextTooltip(eve
