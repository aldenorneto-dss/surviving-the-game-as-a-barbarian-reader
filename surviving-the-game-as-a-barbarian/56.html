<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>56</title><link rel="icon" href="cover.jpg"><link rel="apple-touch-icon" href="cover.jpg"></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/56/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:19.75%;top:3.661458333333333%;width:29.875%;height:.6927083333333339%" data-text="THE MORE I THINK ABOUT IT..." onclick="showTextTooltip(event,this)" data-translation="QUANTO MAIS EU PENSO SOBRE ISSO..." data-tips="💡 Em português, poderíamos dizer &quot;Quanto mais penso nisso...&quot;. A estrutura **&quot;The more... the more...&quot;** é usada para indicar que uma coisa aumenta ou diminui em relação a outra. Por exemplo: &quot;The more you study, the smarter you get.&quot; (Quanto mais você estuda, mais inteligente você fica.)"></div><div class="text-hotspot" style="left:50.24999999999999%;top:7.161458333333333%;width:25.374999999999993%;height:.9427083333333348%" data-text="...I FEEL LIKE IT IS BETTER TO TAKE THE PILL." onclick="showTextTooltip(event,this)" data-translation="...SINTO QUE É MELHOR TOMAR A PÍLULA." data-tips="💡 &quot;Feel like&quot; é uma expressão comum em inglês que indica uma percepção ou opinião. Pode ser traduzida como &quot;acho que&quot; ou &quot;sinto que&quot;. Por exemplo: &quot;I feel like going for a walk.&quot; (Acho que vou dar uma caminhada.)"></div><div class="text-hotspot" style="left:23.625%;top:12.104166666666668%;width:54%;height:1.21875%" data-text="I CAME TO THIS CONCLUSION BY WEIGHING THE RISK AND THE GAIN TO BE HAD ON EACH SIDE OF THE SCALE." onclick="showTextTooltip(event,this)" data-translation="CHEGUEI A ESSA CONCLUSÃO PESANDO O RISCO E O GANHO QUE PODERIA TER DE CADA LADO DA BALANÇA." data-tips="💡 A expressão **&quot;weighing the risk and the gain&quot;** é uma metáfora comum que vem da ideia de balanças, usada para descrever o processo de considerar cuidadosamente os prós e contras antes de tomar uma decisão. Por exemplo: &quot;We need to weigh the risk and the gain before investing in the new project.&quot; (Precisamos pesar o risco e o ganho antes de investir no novo projeto.)"></div><div class="text-hotspot" style="left:34.5%;top:17.625%;width:32%;height:.6927083333333357%" data-text="IF THIS PILL IS THAT DANGEROUS..." onclick="showTextTooltip(event,this)" data-translation="SE ESSA PÍLULA É TÃO PERIGOSA ASSIM..." data-tips="💡 'If' é usado para introduzir uma condição. Aqui, cria uma hipótese sobre a periculosidade da pílula."></div><div class="text-hotspot" style="left:25.5%;top:24.364583333333336%;width:47.125%;height:.6875%" data-text="...THE COMMUNITY COULD NOT HAVE BEEN ESTABLISHED." onclick="showTextTooltip(event,this)" data-translation="...A COMUNIDADE NÃO PODERIA TER SIDO ESTABELECIDA." data-tips="💡 A estrutura **&quot;could not have been&quot;** é usada para falar sobre algo que não poderia ter acontecido no passado por causa de evidências ou lógica. Por exemplo: &quot;He could not have been at the party because he was out of town.&quot; (Ele não poderia ter estado na festa porque estava fora da cidade.)"></div><div class="text-hotspot" style="left:47.125%;top:30.208333333333332%;width:28.249999999999996%;height:.9375%" data-text="HOWEVER, I STILL CANNOT TAKE IT RIGHT AWAY." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, AINDA NÃO POSSO TOMÁ-LA IMEDIATAMENTE." data-tips="💡 'Right away' é uma expressão que significa imediatamente ou sem demora."></div><div class="text-hotspot" style="left:20.5%;top:36.73958333333333%;width:59.125%;height:1.46875%" data-text="EVEN THOUGH IT'S FROM AN ANONYMOUS PERSON, THE SENDER OF THE LETTER ALWAYS HAS A WAY TO KNOW WHO ACCEPTS THE INVITATION." onclick="showTextTooltip(event,this)" data-translation="MESMO QUE SEJA DE UMA PESSOA ANÔNIMA, O REMETENTE DA CARTA SEMPRE TEM UM JEITO DE SABER QUEM ACEITA O CONVITE." data-tips="💡 A expressão **&quot;even though&quot;** é usada para introduzir uma ideia que contrasta com a anterior, similar a &quot;apesar de&quot; em português. Por exemplo: &quot;Even though it was raining, we went for a walk.&quot; (Apesar de estar chovendo, fomos dar uma caminhada.)"></div><div class="text-hotspot" style="left:24.125%;top:43.223958333333336%;width:51.37500000000001%;height:.9635416666666667%" data-text="FOR INSTANCE, WHAT IF THE INVITATION WAS ONLY SENT TO ME DURING THIS PARTICULAR PERIOD?" onclick="showTextTooltip(event,this)" data-translation="POR EXEMPLO, E SE O CONVITE FOI ENVIADO APENAS PARA MIM DURANTE ESTE PERÍODO ESPECÍFICO?" data-tips="💡 &quot;For instance&quot; é um conector que significa &quot;por exemplo&quot;. É usado para introduzir um exemplo que ilustra uma ideia ou situação mencionada anteriormente. Por exemplo: &quot;Many people, for instance, prefer working from home.&quot; (Muitas pessoas, por exemplo, preferem trabalhar de casa.)"></div><div class="text-hotspot" style="left:42.625%;top:52.416666666666664%;width:7.5%;height:.3645833333333333%" data-text="11." onclick="showTextTooltip(event,this)" data-translation="11."></div><div class="text-hotspot" style="left:32%;top:55.97916666666667%;width:35.5%;height:.9479166666666572%" data-text="THEY WOULD KNOW IT'S ME AS SOON AS I ENTER THE COMMUNITY." onclick="showTextTooltip(event,this)" data-translation="ELES SABERIAM /div><div class="text-hotspot" style="left:65.375%;top:40.020833333333336%;width:26.875%;height:.703125%" data-text="RUB" onclick="showTextTooltip(event,this)" data-translation="RUB"></div><div class="text-hotspot" style="left:11.625%;top:44.864583333333336%;width:56.00000000000001%;height:.953125%" data-text="...I SUPPOSE I CAN'T HOLD OFF ON THAT JUST BECAUSE OF MY SUSPICIONS." onclick="showTextTooltip(event,this)" data-translation="...SUPOSTO QUE NÃO POSSO ADIAR ISSO APENAS POR CAUSA DAS MINHAS SUSPEITAS." data-tips="💡 &quot;Hold off on&quot; é um **phrasal verb** que significa adiar ou esperar antes de fazer algo. Por exemplo: &quot;Let's hold off on making a decision until we have more information.&quot; (Vamos adiar a decisão até termos mais informações.)"></div><div class="text-hotspot" style="left:35.375%;top:46.442708333333336%;width:49.75%;height:.703125%" data-text="PLEASE SEND THEM OUT IN THE RIGHT ORDER." onclick="showTextTooltip(event,this)" data-translation="POR FAVOR, ENVIE-OS NA ORDEM CORRETA." data-tips="💡 &quot;In the right order&quot; significa &quot;na ordem correta&quot;. A palavra **&quot;order&quot;** pode se referir à sequência ou arranjo de algo, além de também significar pedido ou comando em outros contextos. Por exemplo: &quot;Please arrange the books in alphabetical order.&quot; (Por favor, organize os livros em ordem alfabética.)"></div><div class="text-hotspot" style="left:66.25%;top:48.744791666666664%;width:15.875%;height:.16145833333333334%" data-text="OKAY." onclick="showTextTooltip(event,this)" data-translation="OKAY."></div><div class="text-hotspot" style="left:9.875%;top:52.708333333333336%;width:77.25%;height:6.286458333333329%" data-text="9 I HAD HIGH HOPES SINCE HE REPORTEDLY CHOSE A SHIELD DURING THE RITUAL. SIGH" onclick="showTextTooltip(event,this)" data-translation="9 EU TINHA GRANDES ESPERANÇAS JÁ QUE ELE SUPOSTAMENTE ESCOLHEU UM ESCUDO DURANTE O RITUAL. SUSPIRO"></div><div class="text-hotspot" style="left:32.25%;top:62.1 eft:22.625%;top:86.6875%;width:22.25%;height:.16145833333333334%" data-text="THANKS." onclick="showTextTooltip(event,this)" data-translation="OBRIGADO."></div><div class="text-hotspot" style="left:27.125%;top:93.76041666666667%;width:26.5%;height:.4270833333333286%" data-text="I SPENT EACH DAY..." onclick="showTextTooltip(event,this)" data-translation="EU PASSEI CADA DIA..."></div><div class="text-hotspot" style="left:39.5%;top:94.86979166666667%;width:42.375%;height:.703125%" data-text="DOING THINGS I WAS SUPPOSED TO DO LIKE HOMEWORK." onclick="showTextTooltip(event,this)" data-translation="FAZENDO COISAS QUE EU DEVERIA FAZER COMO LIÇÃO DE CASA." data-tips="💡 A estrutura **&quot;I was supposed to...&quot;** indica algo que era esperado ou planejado que alguém fizesse, mas que pode não ter sido feito. Por exemplo: &quot;I was supposed to finish the project by Friday.&quot; (Eu deveria ter terminado o projeto até sexta-feira.)"></div><div class="text-hotspot" style="left:11.375%;top:96.70833333333333%;width:33.875%;height:.7916666666666667%" data-text="CHIRP" onclick="showTextTooltip(event,this)" data-translation="CHIRP"></div><div class="text-hotspot" style="left:50.74999999999999%;top:99.14583333333333%;width:31.75%;height:.6197916666666666%" data-text="CHIRP" onclick="showTextTooltip(event,this)" data-translation="CHIRP"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/56/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:15.25%;top:1.1041666666666667%;width:17.5%;height:.4166666666666667%" data-text="TIME FLEW BY." onclick="showTextTooltip(event,this)" data-translation="O TEMPO VOOU."></div><div class="text-hotspot" style="left:0;top:5.635416666666666%;width:68.25%;height:2.473958333333333%" data-text="SPLASH" onclick="showTextTooltip(event,this)" data-translation="SPLASH"></div><div class="text-hotspot" style="left:16.875%;top:10.817708333333332%;width:24.375%;height
