ation="SENHOR, É AQUELE DESGRAÇADO!!"></div><div class="text-hotspot" style="left:31%;top:55.78125000000001%;width:49.625%;height:.9583333333333215%" data-text="HE'S THE ONE THAT RELEASED ALL THE PRISONERS!!" onclick="showTextTooltip(event,this)" data-translation="ELE É O QUE LIBERTOU TODOS OS PRISIONEIROS!!"></div><div class="text-hotspot" style="left:53.37499999999999%;top:58.04166666666667%;width:26.75%;height:.6979166666666666%" data-text="PLOP" onclick="showTextTooltip(event,this)" data-translation="PLOFT"></div><div class="text-hotspot" style="left:54.125%;top:60.458333333333336%;width:36%;height:.4322916666666667%" data-text="I KNOW THAT ALREADY." onclick="showTextTooltip(event,this)" data-translation="EU JÁ SABIA DISSO."></div><div class="text-hotspot" style="left:20.25%;top:61.911458333333336%;width:24.375%;height:.20833333333333334%" data-text="H-HUH?" onclick="showTextTooltip(event,this)" data-translation="H-HÃ?"></div><div class="text-hotspot" style="left:36%;top:62.70312500000001%;width:28.875%;height:.35416666666666663%" data-text="THEN WHY HAVEN'T YOU...?" onclick="showTextTooltip(event,this)" data-translation="ENTÃO POR QUE VOCÊ NÃO...?"></div><div class="text-hotspot" style="left:14.000000000000002%;top:66.99479166666666%;width:48%;height:1.2187500000000142%" data-text="THAT BARBARIAN IS CLAIMING THAT HE WAS FRAMED FOR MURDER." onclick="showTextTooltip(event,this)" data-translation="AQUELE BÁRBARO ESTÁ AFIRMANDO QUE FOI INJUSTAMENTE ACUSADO DE ASSASSINATO." data-tips="💡 'Claiming' é usado para indicar que alguém está afirmando algo como verdadeiro, geralmente sem provas. Pode ser substituído por 'stating' em um contexto mais formal."></div><div class="text-hotspot" style="left:44.5%;top:68.67708333333333%;width:38.5%;height:1.21875%" data-text="YOU WERE IN CHARGE OF INVESTIGATING HIS CASE, RIGHT?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ FOI RESPONSÁVEL POR INVESTIGAR O CASO DELE, CERTO?"></div><div class="text-hotspot" style="left:4.75%;top:69.94791666666667%;width:34.125%;height:.8125%" data-text="SIGH" onclick="showTextTooltip(event,this)" data-translation="SUSPIRO"></div><div class="text-hotspot" style="left:19.125%;top:80.65625%;width:56.25%;height:.953125%" data-text="WHAT WAS THE BASIS ON WHICH YOU DETERMINED HE WAS A PLUNDERER?" onclick="showTextTooltip(event,this)" data-translation="QUAL FOI A BASE PARA DETERMINAR QUE ELE ERA UM SAQUEADOR?"></div><div class="text-hotspot" style="left:91.625%;top:84.72916666666667%;width:4.75%;height:.09375%" data-text="١١١١" onclick="showTextTooltip(event,this)" data-translation="١١١١"></div><div class="text-hotspot" style="left:20.375%;top:91.88541666666666%;width:55.00000000000001%;height:.9322916666666667%" data-text="FRAMED? HE'S JUST SPEAKING NONSENSE!" onclick="showTextTooltip(event,this)" data-translation="INJUSTAMENTE ACUSADO? ELE ESTÁ APENAS FALANDO BOBAGEM!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/33/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22.875%;top:4.40625%;width:49.75%;height:2.0104166666666665%" data-text="FIRST OF ALL, HE REPORTED AN IMMENSELY LARGE AMOUNT OF MANA STONES AT THE INSPECTION OFFICE FOR A TIER-9 ADVENTURER." onclick="showTextTooltip(event,this)" data-translation="EM PRIMEIRO LUGAR, ELE RELATOU UMA QUANTIDADE IMENSAMENTE GRANDE DE PEDRAS DE MANA NO ESCRITÓRIO DE INSPEÇÃO PARA UM AVENTUREIRO DE NÍVEL 9." data-tips="💡 'Tier-9 adventurer' usa 'tier' para indicar nível ou categoria, comum em jogos e contextos de classificação. Em português, pode ser traduzido como 'nível'."></div><div class="text-hotspot" style="left:21.25%;top:18.635416666666664%;width:47.875%;height:.9427083333333334%" data-text="WE FOUND THAT SUSPICIOUS, so WE SEARCHED HIS BACKPACK." onclick="showTextTooltip(event,this)" data-translation="ACHAMOS ISSO SUSPEITO, então REVISTAMOS SUA MOCHILA."></div><div class="text-hotspot" style="left:39.75%;top:19.942708333333332%;width:47.875%;height:1.2083333333333333%" data-text="WE DISCOVERED SO MANY ITEMS THAT WERE OBVIOUSLY STOLEN." onclick="showTextTooltip(event,this)" data-translation="DESCOBRIMOS TANTOS ITENS QUE FORAM OBVIAMENTE ROUBADOS."></div><div class="text-hotspot" style="left:17.875%;top:33.859375%;width:59%;height:1.9895833333333335%" data-text="WE ALSO RECOVERED A MESSAGE STONE AND TRACED IT TO ITS OWNER, WHO ONCE BELONGED TO CRYSTAL UNION." onclick="showTextTooltip(event,this)" data-translation="TAMBÉM RECUPERAMOS UMA PEDRA DE MENSAGEM E RASTREAMOS ATÉ SEU DONO, QUE UMA VEZ PERTENCEU À UNIÃO CRISTAL."></div><div class="text-hotspot" style="left:17.75%;top:45.057291666666664%;width:56.00000000000001%;height:1.4791666666666667%" data-text="THE CRYSTAL UNION GAVE US THE TESTIMONY THAT BJORN YANDEL KILLED ONE OF THEIR MEMBERS..." onclick="showTextTooltip(event,this)" data-translation="A UNIÃO CRISTAL NOS DEU O TESTEMUNHO DE QUE BJORN YANDEL MATOU UM DOS SEUS MEMBROS..."></div><div class="text-hotspot" style="left:37.375%;top:47.03125%;width:52%;height:.9479166666666667%" data-text="AND STOLE THESE ITEMS OFF OF THE DECEASED WITHOUT PROVOCATION!" onclick="showTextTooltip(event,this)" data-translation="E ROUBOU ESSES ITENS DO FALECIDO SEM PROVOCAÇÃO!" data-tips="💡 'Off of' é uma expressão informal que pode ser substituída por 'from' em contextos mais formais, como em 'stole these items from the deceased'."></div><div class="text-hotspot" style="left:11.625%;top:52.166666666666664%;width:49.5%;height:1.2135416666666665%" data-text="THAT IS A BIASED TESTIMONY FROM SOMEONE FROM THE SAME AFFILIATION." onclick="showTextTooltip(event,this)" data-translation="ESSE É UM TESTEMUNHO PARCIAL DE ALGUÉM DA MESMA AFILIAÇÃO." data-tips="💡 'Biased' significa parcial ou tendencioso, indicando que a opinião ou testemunho pode não ser justo ou objetivo."></div><div class="text-hotspot" style="left:30.375000000000004%;top:54.1875%;width:50.125%;height:.9583333333333333%" data-text="IT WASN'T EVEN VERIFIED THROUGH MAGIC, SO IT HAS NO LEGAL EFFECT." onclick="showTextTooltip(event,this)" data-translation="NÃO FOI NEM VERIFICADO ATRAVÉS DE MAGIA, ENTÃO NÃO TEM EFEITO LEGAL."></div><div class="text-hotspot" style="left:6.5%;top:57.53645833333333%;width:51.625%;height:1.7031250000000002%" data-text="WHAT? WHY DIDN'T YOU CONDUCT MAGICAL VERIFICATION?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ? POR QUE VOCÊ NÃO REALIZOU VERIFICAÇÃO MÁGICA?" data-tips="💡 'Conduct' é um verbo formal que significa realizar ou executar, como em 'conduct an experiment'."></div><div class="text-hotspot" style="left:17.25%;top:65.78645833333333%;width:53.25%;height:1.078125%" data-text="BECAUSE HE KEPT LYING DURING THE INTERROGATION PROCESS, SIR!" onclick="showTextTooltip(event,this)" data-translation="PORQUE ELE CONTINUAVA MENTINDO DURANTE O PROCESSO DE INTERROGATÓRIO, SENHOR!"></div><div class="text-hotspot" style="left:14.249999999999998%;top:72.640625%;width:70.125%;height:1.640625%" data-text="HE CLAIMED HIS THROAT WAS SLIT IN A FIGHT AGAINST A PARTY OF PLUNDERERS BUT SOMEHOW MANAGED TO SURVIVE," onclick="showTextTooltip(event,this)" data-translation="ELE AFIRMOU QUE SUA GARGANTA FOI CORTADA EM UMA LUTA CONTRA UM GRUPO DE SAQUEADORES, MAS DE ALGUMA FORMA CONSEGUIU SOBREVIVER," data-tips="💡 'Slit' é um verbo que significa cortar ou fender, geralmente usado para descrever cortes longos e finos."></div><div class="text-hotspot" style="left:18.125%;top:74.875%;width:66.25%;height:2.1927083333333286%" data-text="AND THAT HE DOES NOT HAVE ANY INJURIES ON HIS BODY BECAUSE HE CONSUMED THE ESSENCE OF A VAMPIRE INSIDE THE RIFT!!" onclick="showTextTooltip(event,this)" data-translation="E QUE NÃO TEM NENHUMA LESÃO NO CORPO PORQUE CONSUMIU A ESSÊNCIA DE UM VAMPIRO DENTRO DA FENDA!!"></div><div class="text-hotspot" style="left:48.625%;top:80.578125%;width:39.625%;height:.4322916666666667%" data-text="ESSENCE OF THE VAMPIRE?!" onclick="showTextTooltip(event,this)" data-translation="ESSÊNCIA DO VAMPIRO?!"></div><div class="text-hotspot" style="left:21.75%;top:84.82291666666667%;width:13.125%;height:.4635416666666667%" data-text="YES, SIR!" onclick="showTextTooltip(event,this)" data-translation="SIM, SENHOR!"></div><div class="text-hotspot" style="left:16.75%;top:86.015625%;width:63.25%;height:1.6145833333333428%" data-text="DO YOU SEE HOW FARFETCHED HIS STORY IS? THAT WAS SUPPOSED TO BE ON THE FIRST FLOOR, TOO!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ VÊ COMO A HISTÓRIA DELE É INVEROSSÍMIL? ISSO DEVERIA ESTAR NO PRIMEIRO ANDAR TAMBÉM!" data-tips="💡 'Far-fetched' é uma expressão que significa inverossímil ou difícil de acreditar. Pode ser usada para descrever histórias ou explicações que parecem improváveis."></div><div class="text-hotspot" style="left:18.625%;top:92.32291666666667%;width:52.375%;height:1.7343749999999858%" data-text="IT'S PLAINLY OBVIOUS HE MADE UP SUCH STORIES BECAUSE HE WAS BORN WITH A MAGIC RESISTANT NATURE!" onclick="showTextTooltip(event,this)" data-translation="É CLARAMENTE ÓBVIO QUE ELE INVENTOU ESSAS HISTÓRIAS PORQUE NASCEU COM UMA NATUREZA RESISTENTE À MAGIA!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/33/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:28.249999999999996%;top:1.3333333333333335%;width:59.75%;height:1.989583333333333%" data-text="HOW CAN I SUMMON MAGES WHEN I KNOW HOW PRECIOUS THEIR TIME IS, JUST TO DISPROVE A CLAIM THAT'S SO BLATANTLY FALSE?" onclick="showTextTooltip(event,this)" data-translation="COMO POSSO CONVOCAR MAGOS QUANDO SEI O QUÃO PRECIOSO É O TEMPO DELES, APENAS PARA DESMENTIR UMA AFIRMAÇÃO TÃO CLARAMENTE FALSA?" data-tips="💡 'Summon' é um verbo formal que significa convocar ou chamar, especialmente em contextos legais ou mágicos."></div><div class="text-hotspot" style="left:27%;top:8.505208333333334%;width:46.25%;height:.6927083333333321%" data-text="YOU'RE REALLY DONE FOR THIS TIME, BARBARIAN!!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ REALMENTE FERRADO DESSA VEZ, BÁRBARO!!" data-tips="💡 'You're really done for' é uma expressão informal que significa que alguém está em sérios apuros ou sem esperança de escapar de uma situação. Em português, 'você está ferrado' é equivalente."></div><div class="text-hotspot" style="left:.25%;top:13.197916666666668%;width:39.875%;height:1.1197916666666667%" data-text="GRIN" onclick="showTextTooltip(event,this)" data-translation="SORRISO"></div><div class="text-hotspot" style="left:8.625%;top:15.630208333333334%;width:83.875%;height:1.4791666666666667%" data-text="BUT MR. BJORN HERE REALLY DID CONSUME THE ESSENCE OF THE VAMPIRE WITHIN THE RIFT ON THE FIRST FLOOR." onclick="showTextTooltip(event,this)" data-translation="MAS O SR. BJORN AQUI REALMENTE CONSUMIU A ESSÊNCIA DO VAMPIRO DENTRO DA FENDA NO PRIMEIRO ANDAR."></div><div class="text-hotspot" style="left:21.5%;top:29.645833333333332%;width:10.375%;height:.3489583333333333%" data-text="?!" onclick="showTextTooltip(event,this)" data-translation="?!"></div><div class="text-hotspot" style="left:55.00000000000001%;top:35.979166666666664%;width:25.75%;height:.4322916666666667%" data-text="WH-WHAT KIND OF--" onclick="showTextTooltip(event,this)" data-translation="Q-QUE TIPO DE--"></div><div class="text-hotspot" style="left:18.25%;top:40.984375%;width:38.75%;height:.71875%" data-text="I WAS THERE. I SAW IT WITH MY OWN EYES." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA LÁ. EU VI COM MEUS PRÓPRIOS OLHOS."></div><div class="text-hotspot" style="left:33.75%;top:42.265625%;width:52.125%;height:1.2083333333333333%" data-text="WHAT A SHAME YOU CAN'T ORDER SOMEONE TO CAST A MEMORY READING SPELL ON ME." onclick="showTextTooltip(event,this)" data-translation="QUE PENA QUE VOCÊ NÃO PODE ORDENAR ALGUÉM A LANÇAR UM FEITIÇO DE LEITURA DE MEMÓRIA EM MIM."></div><div class="text-hotspot" style="left:16.5%;top:56.17187500000001%;width:60.125%;height:1.2083333333333286%" data-text="WH-WHAT DO YOU MEAN THE BARBARIAN CONSUMED THE VAMPIRE ESSENCE?" onclick="showTextTooltip(event,this)" data-translation="O-O QUE VOCÊ QUER DIZER COM O BÁRBARO CONSUMIU A ESSÊNCIA DO VAMPIRO?" data-tips="💡 'What do you mean' é uma expressão comum usada para pedir esclarecimentos. Em português, é equivalente a 'O que você quer dizer'."></div><div class="text-hotspot" style="left:36.75%;top:58.020833333333336%;width:45.875%;height:.9427083333333357%" data-text="DO YOU KNOW HOW RIDICULOUS THAT SOUNDS?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ SABE O QUÃO RIDÍCULO ISSO SOA?" data-tips="💡 'How ridiculous that sounds' usa 'how' para intensificar o adjetivo 'ridiculous', semelhante a 'quão' em português."></div><div class="text-hotspot" style="left:16.625%;top:69.38020833333334%;width:57.125%;height:1.4791666666666572%" data-text="I GET THAT YOU PERSONALLY KNOW THIS BARBARIAN, BUT THAT DOESN'T MEAN YOU SHOULD COVER FOR HIM--" onclick="showTextTooltip(event,this)" data-translation="EU ENTENDO QUE VOCÊ CONHECE PESSOALMENTE ESSE BÁRBARO, MAS ISSO NÃO SIGNIFICA QUE VOCÊ DEVE ACOBERTÁ-LO--" data-tips="💡 'Cover for him' é um phrasal verb que significa proteger ou acobertar alguém. Exemplo: 'She covered for her friend during the investigation.'"></div><div class="text-hotspot" style="left:18%;top:75.703125%;width:31.874999999999996%;height:.46875%" data-text="ARE YOU IMPLYING..." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ IMPLICANDO..."></div><div class="text-hotspot" style="left:39.625%;top:78.76041666666667%;width:41.5%;height:.828125%" data-text="THAT I AM FABRICATING THIS STORY?" onclick="showTextTooltip(event,this)" data-translation="QUE EU ESTOU FABRICANDO ESSA HISTÓRIA?"></div><div class="text-hotspot" style="left:41.25%;top:88.0625%;width:38.25%;height:.6979166666666666%" data-text="N-NOT AT ALL! I'M JUST SAYING--" onclick="showTextTooltip(event,this)" data-translation="N-NÃO DE FORMA ALGUMA! EU SÓ ESTOU DIZENDO--"></div><div class="text-hotspot" style="left:22.75%;top:93.56770833333333%;width:18.75%;height:.5%" data-text="WHAT, THEN?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ, ENTÃO?"></div><div class="text-hotspot" style="left:9.125%;top:98.65625%;width:81.25%;height:1.3385416666666667%" data-text="HOW DARE YOU POINT FINGERS AT A MAGE! DO YOU FIND YOURSELF OUR EQUAL, JUST BECAUSE YOU HAVE THE AUTHORITY TO INVESTIGATE LOW-TIER ADVENTURERS NOW?" onclick="showTextTooltip(event,this)" data-translation="COMO VOCÊ OUSA APONTAR O DEDO PARA UM MAGO! VOCÊ SE ACHA NOSSO IGUAL, SÓ PORQUE TEM A AUTORIDADE PARA INVESTIGAR AVENTUREIROS DE BAIXO NÍVEL AGORA?" data-tips="💡 'How dare you' é uma expressão usada para mostrar indignação ou surpresa com a audácia de alguém. Em português, seria 'Como você ousa'."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/33/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:11.125%;top:.09375%;width:77.375%;height:.7604166666666667%" data-text="HOW DARE YOU POINT FINGERS AT A MAGE! DO YOU FIND YOURSELF OUR EQUAL, JUST BECAUSE YOU HAVE THE AUTHORITY TO INVESTIGATE LOW-TIER ADVENTURERS NOW?" onclick="showTextTooltip(event,this)" data-translation="COMO VOCÊ OUSA APONTAR O DEDO PARA UM MAGO! VOCÊ SE ACHA NOSSO IGUAL, SÓ PORQUE TEM A AUTORIDADE PARA INVESTIGAR AVENTUREIROS DE BAIXO NÍVEL AGORA?"></div><div class="text-hotspot" style="left:22.875%;top:5.682291666666667%;width:33.875%;height:.7604166666666667%" data-text="M-MY APOLOGIES, MA'AM!" onclick="showTextTooltip(event,this)" data-translation="M-MINHAS DESCULPAS, SENHORA!"></div><div class="text-hotspot" style="left:38.25%;top:6.822916666666666%;width:42.875%;height:1.046875%" data-text="THAT IS NOT WHAT I MEANT BY ANY MEANS!" onclick="showTextTooltip(event,this)" data-translation="NÃO FOI ISSO QUE EU QUIS DIZER DE FORMA ALGUMA!" data-tips="💡 'By any means' é uma expressão que enfatiza a negação, traduzida como 'de forma alguma' em português."></div><div class="text-hotspot" style="left:37.875%;top:12.21875%;width:27.625%;height:.5989583333333334%" data-text="BOW" onclick="showTextTooltip(event,this)" data-translation="REVERÊNCIA"></div><div class="text-hotspot" style="left:31.125000000000004%;top:18.661458333333332%;width:37.625%;height:.9427083333333334%" data-text="MAGES OF THE TOWER HOLD HIGH STATUS IN THIS WORLD." onclick="showTextTooltip(event,this)" data-translation="OS MAGOS DA TORRE TÊM ALTO STATUS NESTE MUNDO." data-tips="💡 'Hold high status' significa ter um status elevado. 'Hold' aqui é usado no sentido de possuir ou manter."></div><div class="text-hotspot" style="left:21%;top:28.6875%;width:41.625%;height:1.21875%" data-text="ALTHOUGH THERE ARE MANY DIFFERENT SUB-SCHOOLS, THEY LARGELY FORM A SINGLE UNION," onclick="showTextTooltip(event,this)" data-translation="EMBORA EXISTAM MUITAS SUBESCOLAS DIFERENTES, ELES FORMAM LARGAMENTE UMA ÚNICA UNIÃO," data-tips="💡 'Although' é um conector usado para introduzir uma ideia contrastante, semelhante a 'embora' em português."></div><div class="text-hotspot" style="left:37.375%;top:30.234375000000004%;width:46%;height:1.2135416666666665%" data-text="AND HAVE PROTECTED THEIR RIGHTS AS PRESTIGIOUS MAGIC USERS OVER TIME." onclick="showTextTooltip(event,this)" data-translation="E PROTEGERAM SEUS DIREITOS COMO USUÁRIOS DE MAGIA PRESTIGIOSOS AO LONGO DO TEMPO."></div><div class="text-hotspot" style="left:12.125%;top:34.671875%;width:42.25%;height:1.4583333333333357%" data-text="ON THE OTHER HAND, AN INVESTIGATOR OF ADVENTURERS' GUILD IS FAR LOWER IN RANK." onclick="showTextTooltip(event,this)" data-translation="POR OUTRO LADO, UM INVESTIGADOR DA GUILDA DOS AVENTUREIROS TEM RANK MUITO INFERIOR."></div><div class="text-hotspot" style="left:43.5%;top:36.61979166666667%;width:47.625%;height:.9427083333333334%" data-text="HE DUG HIS OWN GRAVE BY QUESTIONING THE WORDS OF A MAGE FROM THE TOWER." onclick="showTextTooltip(event,this)" data-translation="ELE CAVOU SUA PRÓPRIA COVA AO QUESTIONAR AS PALAVRAS DE UM MAGO DA TORRE." data-tips="💡 'Dug his own grave' é uma expressão idiomática que significa causar seus próprios problemas. Em português, seria 'cavou sua própria cova'."></div><div class="text-hotspot" style="left:74.75%;top:38.5%;width:22.375%;height:.39583333333333337%" data-text="SERVES HIM RIGHT." onclick="showTextTooltip(event,this)" data-translation="BEM FEITO PARA ELE."></div><div class="text-hotspot" style="left:30.625000000000004%;top:40.661458333333336%;width:39.75%;height:.6770833333333334%" data-text="DON'T BE TOO HARSH ON THE MAN." onclick="showTextTooltip(event,this)" data-translation="NÃO SEJA MUITO DURO COM O HOMEM." data-tips="💡 'Don't be too harsh' usa 'harsh' para descrever um tratamento severo ou rigoroso. É uma maneira de pedir para ser mais compreensivo."></div><div class="text-hotspot" style="left:13.875000000000002%;top:49.83854166666667%;width:77.625%;height:1.7239583333333357%" data-text="I'M SURE YOU SEE HIS LOGIC, MISS. WITHOUT HAVING BEEN THERE HIMSELF, THERE'S NO WAY HE COULD JUST BUY SUCH A PREPOSTEROUS STORY." onclick="showTextTooltip(event,this)" data-translation="TENHO CERTEZA QUE VOCÊ ENTENDE A LÓGICA DELE, SENHORITA. SEM TER ESTADO LÁ, NÃO HÁ COMO ELE SIMPLESMENTE ACREDITAR EM UMA HISTÓRIA TÃO ABSURDA." data-tips="💡 'Without having been there himself' usa o present perfect para indicar uma experiência não vivida, algo como 'sem ter estado lá'."></div><div class="text-hotspot" style="left:76.125%;top:64.19270833333334%;width:16.75%;height:.140625%" data-text="XXXXXX" onclick="showTextTooltip(event,this)" data-translation="XXXXXX"></div><div class="text-hotspot" style="left:32.75%;top:66.421875%;width:54.87499999999999%;height:1.2083333333333333%" data-text="VAMPIRE SHOWING UP IN THE RIFT ON THE FIRST FLOOR IS DEFINITELY UNPRECEDENTED." onclick="showTextTooltip(event,this)" data-translation="UM VAMPIRO APARECENDO NA FENDA NO PRIMEIRO ANDAR É DEFINITIVAMENTE SEM PRECEDENTES." data-tips="💡 'Unprecedented' significa algo que nunca aconteceu antes. É uma palavra útil para descrever eventos novos ou inesperados."></div><div class="text-hotspot" style="left:29.75%;top:71.9375%;width:47.75%;height:.43750000000000006%" data-text="THANK YOU FOR UNDERSTANDING--" onclick="showTextTooltip(event,this)" data-translation="OBRIGADO POR ENTENDER--"></div><div class="text-hotspot" style="left:23.875%;top:73.34375%;width:35.625%;height:.22395833333333334%" data-text="HOWEVER!!" onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO!!"></div><div class="text-hotspot" style="left:21.375%;top:77.984375%;width:33.5%;height:.7864583333333333%" data-text="POINT" onclick="showTextTooltip(event,this)" data-translation="APONTAR"></div><div class="text-hotspot" style="left:14.000000000000002%;top:81.80208333333333%;width:75.75%;height:1.7135416666666714%" data-text="THAT IS NOT THE PROPER ATTITUDE SOMEONE IN YOUR POSITION SHOULD HAVE, AS THE BRANCH MANAGER OF THE ADVENTURERS' GUILD!" onclick="showTextTooltip(event,this)" data-translation="ESSA NÃO É A ATITUDE ADEQUADA QUE ALGUÉM NA SUA POSIÇÃO DEVERIA TER, COMO GERENTE DA FILIAL DA GUILDA DOS AVENTUREIROS!"></div><div class="text-hotspot" style="left:17.25%;top:86.78645833333334%;width:10.25%;height:.16666666666666669%" data-text="...!!" onclick="showTextTooltip(event,this)" data-translation="...!!"></div><div class="text-hotspot" style="left:13.25%;top:96.64583333333333%;width:40.375%;height:.7291666666666666%" data-text="EVER SINCE THE LABYRINTH APPEARED," onclick="showTextTooltip(event,this)" data-translation="DESDE QUE O LABIRINTO APARECEU," data-tips="💡 'Ever since' é uma expressão que indica o início de um período de tempo contínuo. Em português, é 'desde que'."></div><div class="text-hotspot" style="left:39.875%;top:97.69270833333333%;width:27%;height:.43750000000000006%" data-text="IT
