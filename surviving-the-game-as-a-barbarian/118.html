:.4270833333333333%" data-text="THIS IS NOT GOOD." onclick="showTextTooltip(event,this)" data-translation="ISSO NÃO É BOM."></div><div class="text-hotspot" style="left:20.5%;top:44.984375%;width:61%;height:1.1302083333333357%" data-text="FACT NUMBER TWO. SHE IS JUST AS FLUSTERED BY THIS ENCOUNTER AS I AM." onclick="showTextTooltip(event,this)" data-translation="FATO NÚMERO DOIS. ELA ESTÁ TÃO DESCONCERTADA COM ESTE ENCONTRO QUANTO EU."></div><div class="text-hotspot" style="left:4.875%;top:51.5%;width:12.375%;height:1.1770833333333333%" data-text="Мариаминии Чилитании" onclick="showTextTooltip(event,this)" data-translation="Мариаминии Чилитании"></div><div class="text-hotspot" style="left:41.625%;top:51.885416666666664%;width:16.5%;height:.16145833333333334%" data-text="I HEARD" onclick="showTextTooltip(event,this)" data-translation="OUVI DIZER"></div><div class="text-hotspot" style="left:24.375%;top:52.145833333333336%;width:51.25%;height:.9427083333333357%" data-text="THAT NOARK HAS BEEN SHUT DOWN. MAYBE THAT SOMETHING TO DO HAS WITH HER VISIT." onclick="showTextTooltip(event,this)" data-translation="QUE NOARK FOI FECHADO. TALVEZ ISSO TENHA ALGO A VER COM A VISITA DELA." data-warning="1"></div><div class="text-hotspot" style="left:33.125%;top:56.833333333333336%;width:33.5%;height:.5416666666666667%" data-text="FACT NUMBER THREE." onclick="showTextTooltip(event,this)" data-translation="FATO NÚMERO TRÊS."></div><div class="text-hotspot" style="left:24%;top:59.17187499999999%;width:57.375%;height:1.4635416666666714%" data-text="WELL, I GUESS I'LL HAVE TO BEAT YOU UP AND ERASE YOUR MEMORY AGAIN LIKE LAST TIME." onclick="showTextTooltip(event,this)" data-translation="BEM, ACHO QUE VOU TER QUE TE ESPANCAR E APAGAR SUA MEMÓRIA DE NOVO, COMO DA ÚLTIMA VEZ."></div><div class="text-hotspot" style="left:23.5%;top:72.515625%;width:55.375%;height:.828125%" data-text="SHE HAS NO INTENTION OF KILLING ME DESPITE ALL THAT." onclick="showTextTooltip(event,this)" data-translation="ELA NÃO TEM INTENÇÃO DE ME MATAR, APESAR DE TUDO ISSO."></div><div class="text-hotspot" style="left:17.25%;top:79.5625%;width:47.625%;height:.6875%" data-text="CONCLUSION. I JUST HAVE TO MAKE SURE SHE DOESN'T FIND OUT..." onclick="showTextTooltip(event,this)" data-translation="CONCLUSÃO. SÓ PRECISO GARANTIR QUE ELA NÃO DESCUBRA..."></div><div class="text-hotspot" style="left:33.375%;top:81.03125%;width:53.75%;height:.9583333333333428%" data-text="THAT THE PILL TO WIPE OUT THE MEMORY DOESN'T WORK ON ME." onclick="showTextTooltip(event,this)" data-translation="QUE A PÍLULA PARA APAGAR A MEMÓRIA NÃO FUNCIONA EM MIM."></div><div class="text-hotspot" style="left:21.875%;top:86.671875%;width:58.12500000000001%;height:1.1510416666666667%" data-text="WHY DID YOU COME TO KILL ME, WHEN I KEPT THE PROMISE?!" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ VEIO ME MATAR, SE EU CUMPRI A PROMESSA?!"></div><div class="text-hotspot" style="left:21.125%;top:97.08333333333333%;width:57.49999999999999%;height:.640625%" data-text="THEN THINGS WON'T GO TOO TERRIBLY!" onclick="showTextTooltip(event,this)" data-translation="ENTÃO AS COISAS NÃO VÃO FICAR TÃO TERRÍVEIS!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/118/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:45%;top:1.7135416666666667%;width:5.125%;height:.06770833333333334%" data-text="..." data-translation="..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:45.375%;top:2.520833333333333%;width:36%;height:.9583333333333335%" data-text="YOU SAID SOMETHING SIMILAR LAST TIME." data-translation="VOCÊ DISSE ALGO PARECIDO DA ÚLTIMA VEZ." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:59.62499999999999%;top:9.489583333333334%;width:19.25%;height:.4322916666666667%" data-text="...LAST TIME?" data-translation="...DA ÚLTIMA VEZ?" onclick="showTextToo
