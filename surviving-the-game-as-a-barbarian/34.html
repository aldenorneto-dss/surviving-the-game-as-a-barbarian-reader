ht:1.2135416666666696%" data-text="THE ADVENTURERS' GUILD PROVIDES VARIOUS SERVICES TO INDIVIDUALS THAT EXPLORE THE LABYRINTH," onclick="showTextTooltip(event,this)" data-translation="A GUILDA DOS AVENTUREIROS OFERECE VÁRIOS SERVIÇOS AOS INDIVÍDUOS QUE EXPLORAM O LABIRINTO," data-tips="💡 'Provides' é um verbo que frequentemente é seguido pela preposição 'to' quando indica para quem algo é oferecido."></div><div class="text-hotspot" style="left:31.624999999999996%;top:15.666666666666668%;width:59.12500000000001%;height:.9583333333333333%" data-text="BY MANAGING CLANS, CASTING COMPANIONSHIP SPELLS, AND SELLING QUALITY INFORMATION." onclick="showTextTooltip(event,this)" data-translation="GERENCIANDO CLÃS, LANÇANDO FEITIÇOS DE COMPANHEIRISMO E VENDENDO INFORMAÇÕES DE QUALIDADE." data-tips="💡 'Casting' é um verbo que, no contexto de magia, significa 'lançar' um feitiço."></div><div class="text-hotspot" style="left:16.375%;top:20.96875%;width:32.875%;height:.6770833333333334%" data-text="THE GUILD'S STRUCTURE ISN'T TOO COMPLEX." onclick="showTextTooltip(event,this)" data-translation="A ESTRUTURA DA GUILDA NÃO É MUITO COMPLEXA." data-tips="💡 'Too' pode ser usado para enfatizar um ponto ou para indicar excesso, como em 'não é muito complexa'."></div><div class="text-hotspot" style="left:42.375%;top:22.484375%;width:43.125%;height:.6979166666666666%" data-text="THERE ARE HUNDREDS OF BRANCHES AND BRANCH MANAGERS..." onclick="showTextTooltip(event,this)" data-translation="HÁ CENTENAS DE FILIAIS E GERENTES DE FILIAL..."></div><div class="text-hotspot" style="left:29.625%;top:32.18229166666667%;width:39.75%;height:.9479166666666667%" data-text="...WHO REPORT ON A REGULAR BASIS TO THIRTEEN DISTRICT CHIEFS." onclick="showTextTooltip(event,this)" data-translation="...QUE RELATAM REGULARMENTE A TREZE CHEFES DE DISTRITO." data-tips="💡 'On a regular basis' é uma expressão que significa 'regularmente', indicando uma ação que acontece com frequência."></div><div class="text-hotspot" style="left:31%;top:37.317708333333336%;width:38.125%;height:.6822916666666666%" data-text="THE ONLY ONE ABOVE THEM IS THE GUILDMASTER..." onclick="showTextTooltip(event,this)" data-translation="O ÚNICO ACIMA DELES É O MESTRE DA GUILDA..."></div><div class="text-hotspot" style="left:27.250000000000004%;top:42.395833333333336%;width:45.5%;height:.9583333333333333%" data-text="...SO THE THIRTEEN DISTRICT CHIEFS ARE PRETTY MUCH SECOND IN COMMAND." onclick="showTextTooltip(event,this)" data-translation="...ENTÃO OS TREZE CHEFES DE DISTRITO SÃO PRATICAMENTE SEGUNDOS NO COMANDO." data-tips="💡 'Pretty much' é uma expressão informal que significa 'praticamente' ou 'quase'."></div><div class="text-hotspot" style="left:26.625%;top:51.036458333333336%;width:47.625%;height:.953125%" data-text="BUT THERE ARE THINGS THAT EVEN GUYS IN SUCH POSITIONS CAN'T DO ANYTHING ABOUT." onclick="showTextTooltip(event,this)" data-translation="MAS HÁ COISAS QUE ATÉ MESMO CARAS EM TAIS POSIÇÕES NÃO PODEM FAZER NADA A RESPEITO." data-tips="💡 'Can't do anything about' é uma construção que indica impotência ou incapacidade de mudar uma situação."></div><div class="text-hotspot" style="left:40.125%;top:53.796875%;width:55.25%;height:1.515625%" data-text="PUSH" onclick="showTextTooltip(event,this)" data-translation="EMPURRAR"></div><div class="text-hotspot" style="left:23.625%;top:55.578125%;width:17.5%;height:.23958333333333331%" data-text="LIGH!" onclick="showTextTooltip(event,this)" data-translation="LUZ!"></div><div class="text-hotspot" style="left:23.5%;top:65.875%;width:41.625%;height:1.1458333333333286%" data-text="WH-WHAT'S THE MEANING OF THIS, SIR?" onclick="showTextTooltip(event,this)" data-translation="QU-QUAL O SIGNIFICADO DISSO, SENHOR?"></div><div class="text-hotspot" style="left:49.75%;top:76.43229166666666%;width:40%;height:.7083333333333333%" data-text="I HEARD YOU WERE LOOKING FOR HIM." onclick="showTextTooltip(event,this)" data-translation="OUVI DIZER QUE VOCÊ ESTAVA PROCURANDO POR ELE." data-tips="💡 'I heard you were looking for him' usa o past continuous 'were looking', que sugere uma ação contínua no passado."></div><div class="text-hotspot" style="left:46.25%;top:87.09895833333333%;width:16.125%;height:.6718750000000142%" data-text="WAIT. I KNOW HIM!" onclick="showTextTooltip(event,this)" data-translation="ESPERE. EU O CONHEÇO!"></div><div class="text-hotspot" style="left:22%;top:92.27083333333333%;width:56.5%;height:1.1562500000000142%" data-text="YOU MUST BE HARTS YOUNG OF THE CRYSTAL UNION." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DEVE SER HARTS YOUNG DA UNIÃO CRISTAL." data-tips="💡 'You must be' é uma estrutura usada para fazer uma suposição ou dedução lógica sobre alguém."></div><div class="text-hotspot" style="left:76.875%;top:95.13020833333333%;width:4.5%;height:.20833333333333334%" data-text="!!" onclick="showTextTooltip(event,this)" data-translation="!!"></div><div class="text-hotspot" style="left:1.5%;top:97.46354166666666%;width:4.125%;height:.13541666666666669%" data-text="HORAL" onclick="showTextTooltip(event,this)" data-translation="HORAL"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/34/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:48.5%;top:.17708333333333331%;width:43.375%;height:1%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:20.5%;top:5.755208333333333%;width:59.875%;height:1.619791666666667%" data-text="I KNOW YOU FALSELY TESTIFIED ABOUT THE MESSAGE STONE." onclick="showTextTooltip(event,this)" data-translation="EU SEI QUE VOCÊ TESTEMUNHOU FALSAMENTE SOBRE A PEDRA DE MENSAGEM." data-tips="💡 'Falsely testified' significa 'testemunhou falsamente', onde 'falsely' é um advérbio que modifica o verbo 'testified'."></div><div class="text-hotspot" style="left:37.5%;top:21.390625%;width:35.25%;height:.7083333333333333%" data-text="I NEVER LIED ABOUT SUCH THINGS--" onclick="showTextTooltip(event,this)" data-translation="EU NUNCA MENTI SOBRE TAIS COISAS--"></div><div class="text-hotspot" style="left:62.25000000000001%;top:22.552083333333332%;width:36.5%;height:1.03125%" data-text="ZING" onclick="showTextTooltip(event,this)" data-translation="ZING"></div><div class="text-hotspot" style="left:55.125%;top:27.208333333333336%;width:7.000000000000001%;height:.23958333333333331%" data-text="?!" onclick="showTextTooltip(event,this)" data-translation="?!"></div><div class="text-hotspot" style="left:40.5%;top:32.177083333333336%;width:17.5%;height:.4114583333333333%" data-text="THIS MAN..." onclick="showTextTooltip(event,this)" data-translation="ESSE HOMEM..."></div><div class="text-hotspot" style="left:1.625%;top:33.0625%;width:39.875%;height:1.2604166666666665%" data-text="ZING" onclick="showTextTooltip(event,this)" data-translation="ZING"></div><div class="text-hotspot" style="left:72.5%;top:34.921875%;width:25.75%;height:.5677083333333334%" data-text="ZING" onclick="showTextTooltip(event,this)" data-translation="ZING"></div><div class="text-hotspot" style="left:30.25%;top:39.390625%;width:40.25%;height:1.1510416666666667%" data-text="...IS NOT SPEAKING TRUTHFULLY RIGHT NOW." onclick="showTextTooltip(event,this)" data-translation="...NÃO ESTÁ FALANDO A VERDADE AGORA." data-tips="💡 'Truthfully' é um advérbio que significa 'de forma verdadeira' ou 'honestamente'."></div><div class="text-hotspot" style="left:40.5%;top:45.1875%;width:15.5%;height:.47916666666666663%" data-text="!!!" onclick="showTextTooltip(event,this)" data-translation="!!!"></div><div class="text-hotspot" style="left:21%;top:52.83854166666667%;width:37.375%;height:.9635416666666643%" data-text="THERE. A MAGE AFFILIATED WITH THE TOWER VERIFIED IT." onclick="showTextTooltip(event,this)" data-translation="ALI. UM MAGO AFILIADO À TORRE VERIFICOU ISSO."></div><div class="text-hotspot" style="left:49.5%;top:54.625%;width:32.625%;height:.6927083333333334%" data-text="YOU CAN'T KEEP DENYING IT ANYMORE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO PODE CONTINUAR NEGANDO ISSO." data-tips="💡 'Can't keep denying' usa o verbo modal 'can't' seguido de um verbo no gerúndio para indicar uma ação que não pode continuar."></div><div class="text-hotspot" style="left:32.25%;top:60.088541666666664%;width:21.875%;height:.43750000000000006%" data-text="I-I WAS JUST--" onclick="showTextTooltip(event,this)" data-translation="E-EU ESTAVA APENAS--"></div><div class="text-hotspot" style="left:47.5%;top:65.515625%;width:40.875%;height:.4635416666666667%" data-text="BJORN YANDEL, WAS IT?" onclick="showTextTooltip(event,this)" data-translation="BJORN YANDEL, NÃO É?"></div><div class="text-hotspot" style="left:25.25%;top:69.67708333333333%;width:50%;height:.9270833333333334%" data-text="YOU ARE INNOCENT AND FREE TO GO." onclick="showTextTooltip(event,this)" data-translation="VOCÊ É INOCENTE E ESTÁ LIVRE PARA IR."></div><div class="text-hotspot" style="left:25.124999999999996%;top:75.13541666666667%;width:47%;height:.9479166666666572%" data-text="AND WHAT'S GOING TO HAPPEN TO HIM NOW?" onclick="showTextTooltip(event,this)" data-translation="E O QUE VAI ACONTECER COM ELE AGORA?" data-tips="💡 'What's going to happen' usa o futuro com 'going to', que é frequentemente usado para planos ou previsões."></div><div class="text-hotspot" style="left:54.75%;top:77.91666666666667%;width:28.749999999999996%;height:.703125%" data-text="LIFT" onclick="showTextTooltip(event,this)" data-translation="LEVANTAR"></div><div class="text-hotspot" style="left:89.375%;top:79.59895833333334%;width:6.625%;height:.078125%" data-text="XX" onclick="showTextTooltip(event,this)" data-translation="XX"></div><div class="text-hotspot" style="left:11%;top:86.140625%;width:66.375%;height:1.2083333333333333%" data-text="HE'S CAUSED THE INVESTIGATION TO GO SOUTH BY DELIBERATELY GIVING A FALSE TESTIMONY." onclick="showTextTooltip(event,this)" data-translation="ELE FEZ A INVESTIGAÇÃO IR POR ÁGUA ABAIXO AO DELIBERADAMENTE DAR UM FALSO TESTEMUNHO." data-tips="💡 'Go south' é uma expressão idiomática que significa 'dar errado' ou 'deteriorar'."></div><div class="text-hotspot" style="left:27.500000000000004%;top:87.86458333333333%;width:59.625%;height:1.4687500000000142%" data-text="WE WILL INTERROGATE HIM AS A SUSPECT AND HAVE HIM EXECUTED IF FOUND SUFFICIENTLY GUILTY." onclick="showTextTooltip(event,this)" data-translation="VAMOS INTERROGÁ-LO COMO SUSPEITO E EXECUTÁ-LO SE FOR CONSIDERADO SUFICIENTEMENTE CULPADO." data-tips="💡 'If found sufficiently guilty' usa uma cláusula condicional que indica uma condição para a execução."></div><div class="text-hotspot" style="left:16%;top:94.66145833333334%;width:62.375%;height:1.2083333333333286%" data-text="I WAS HOPING YOU'D DO THE SAME TO THE CLAN HE'S ASSOCIATED WITH." onclick="showTextTooltip(event,this)" data-translation="EU ESPERAVA QUE VOCÊ FIZESSE O MESMO COM O CLÃ AO QUAL ELE ESTÁ ASSOCIADO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/34/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:15.25%;top:.17708333333333331%;width:52.25%;height:1.2239583333333333%" data-text="CRYSTAL UNION HAS BEEN MAKING TROUBLE HERE AND THERE AS OF LATE." onclick="showTextTooltip(event,this)" data-translation="A UNIÃO CRISTAL TEM CAUSADO PROBLEMAS AQUI E ALI ULTIMAMENTE." data-tips="💡 'Here and there' é uma expressão que significa 'em vários lugares' ou 'em alguns lugares'."></div><div class="text-hotspot" style="left:43.75%;top:1.8541666666666667%;width:29.75%;height:.7083333333333333%" data-text="I WILL DO AS YOU WISH." onclick="showTextTooltip(event,this)" data-translation="FAREI COMO VOCÊ DESEJA."></div><div class="text-hotspot" style="left:20.875%;top:9.604166666666666%;width:61.12499999999999%;height:1.2135416666666665%" data-text="THE INVESTIGATOR THAT INTERROGATED YOU WILL BE REMOVED FROM HIS DUTY AS WELL." onclick="showTextTooltip(event,this)" data-translation="O INVESTIGADOR QUE O INTERROGOU TAMBÉM SERÁ REMOVIDO DE SUAS FUNÇÕES."></div><div class="text-hotspot" style="left:14.374999999999998%;top:17.322916666666664%;width:71.375%;height:1.0572916666666665%" data-text="B-BUT SIR, I WAS ONLY FOLLOWING THE PROTOCOLS DURING THE INTERROGATION--" onclick="showTextTooltip(event,this)" data-translation="M-MAS SENHOR, EU ESTAVA APENAS SEGUINDO OS PROTOCOLOS DURANTE A INTERROGAÇÃO--"></div><div class="text-hotspot" style="left:13.375%;top:23.28125%;width:59.62499999999999%;height:1.3385416666666667%" data-text="ARE YOU IMPLYING THAT THE GUILD IS SO INCOMPETENT AS TO ALLOW THIS TO HAPPEN?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ INSINUANDO QUE A GUILDA É TÃO INCOMPETENTE A PONTO DE PERMITIR QUE ISSO ACONTEÇA?"></div><div class="text-hotspot" style="left:20.875%;top:30.223958333333336%;width:63.625%;height:1.9114583333333286%" data-text="EVERY SINGLE CASE YOU'VE WORKED ON SO FAR WILL BE UNDER SCRUTINY AND THOROUGHLY REVIEWED." onclick="showTextTooltip(event,this)" data-translation="CADA CASO QUE VOCÊ TRABALHOU ATÉ AGORA SERÁ EXAMINADO E REVISTO MINUCIOSAMENTE." data-tips="💡 'Thoroughly reviewed' usa o advérbio 'thoroughly' para indicar que algo será revisado de forma minuciosa."></div><div class="text-hotspot" style="left:15.875%;top:37.19791666666667%;width:52.37500000000001%;height:1.21875%" data-text="SHOULD WE DISCOVER THE SLIGHTEST OF EVIDENCE THERE WAS CORRUPTION," onclick="showTextTooltip(event,this)" data-translation="SE DESCOBRIRMOS A MENOR EVIDÊNCIA DE CORRUPÇÃO," data-tips="💡 'Should we discover' é uma estrutura condicional que usa 'should' para indicar uma possibilidade futura."></div><div class="text-hotspot" style="left:44%;top:38.93229166666667%;width:40.625%;height:1.2291666666666665%" data-text="YOU WILL BE SUBJECT TO PENALTY TO RECTIFY THIS WRONG." onclick="showTextTooltip(event,this)" data-translation="VOCÊ SERÁ SUJEITO A PENALIDADES PARA CORRIGIR ESSE ERRO."></div><div class="text-hotspot" style="left:89.75%;top:43.046875%;width:2.75%;height:.140625%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:37.875%;top:50.307291666666664%;width:22%;height:.515625%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:17.625%;top:53.166666666666664%;width:22%;height:.5104166666666666%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:14.249999999999998%;top:59.729166666666664%;width:74%;height:.953125%" data-text="NOW, WE MUST DISCUSS HOW WE CAN COMPENSATE YOU FOR THIS MISUNDERSTANDING." onclick="showTextTooltip(event,this)" data-translation="AGORA, DEVEMOS DISCUTIR COMO PODEMOS COMPENSÁ-LO POR ESTE MAL-ENTENDIDO." data-tips="💡 'Misunderstanding' é um substantivo que significa 'mal-entendido', uma falha na comunicação."></div><div class="text-hotspot" style="left:18%;top:65.24479166666667%;width:40.25%;height:1.2343749999999858%" data-text="I WILL OFFICIALLY PUT YOU IN TIER-7 ADVENTURER CATEGORY," onclick="showTextTooltip(event,this)" data-translation="VOU COLOCÁ-LO OFICIALMENTE NA CATEGORIA DE AVENTUREIRO DE NÍVEL 7," data-tips="💡 'Tier-7 adventurer category' refere-se a uma classificação ou nível, onde 'tier' é frequentemente usado em contextos de jogos ou rankings."></div><div class="text-hotspot" style="left:23.625%;top:67.14583333333334%;width:61.625%;height:1.2135416666666572%" data-text="AND GIVE YOU BRAND NEW ITEMS AND EQUIPMENTS FOR THE ONES WE CONFISCATED FROM YOU." onclick="showTextTooltip(event,this)" data-translation="E DAR-LHE NOVOS ITENS E EQUIPAMENTOS PELOS QUE CONFISCAMOS DE VOCÊ."></div><div class="text-hotspot" style="left:30.5%;top:69.49479166666667%;width:2.375%;height:.23958333333333331%" data-text="!" onclick="showTextTooltip(event,this)" data-translation="!"></div><div class="text-hotspot" style="left:53%;top:70.52083333333333%;width:46.875%;height:1.1927083333333333%" data-text="TOSS" onclick="showTextTooltip(event,this)" data-translation="ARREMESSAR"></div><div class="text-hotspot" style="left:13.25%;top:81.67708333333333%;width:43.5%;height:.6979166666666666%" data-text="HOW IS TIER ADJUSTMENT A COMPENSATION?" onclick="showTextTooltip(event,this)" data-translation="COMO O AJUSTE DE NÍVEL É UMA COMPENSAÇÃO?" data-tips="💡 'How is tier adjustment a compensation?' usa uma estrutura interrogativa para questionar a lógica de uma ação."></div><div class="text-hotspot" style="left:25.5%;top:83.13541666666666%;width:56.25%;height:.9479166666666667%" data-text="CONSUMPTION OF ONE TIER-5 ESSENCE ALONE SATISFIES THE CRITERIA!" onclick="showTextTooltip(event,this)" data-translation="O CONSUMO DE UMA ESSÊNCIA DE NÍVEL 5 SOZINHO SATISFAZ OS CRITÉRIOS!"></div><div class="text-hotspot" style="left:54.75%;top:84.6875%;width:45.125%;height:1.3333333333333335%" data-text="GLARE" onclick="showTextTooltip(event,this)" data-translation="ENCARAR"></div><div class="text-hotspot" style="left:24.875%;top:89.97395833333334%;width:52.25%;height:1.140625%" data-text="I WOULD HAVE BEEN UPGRADED TO TIER-7 EVEN WITHOUT ALL THIS!" onclick="showTextTooltip(event,this)" data-translation="EU TERIA SIDO PROMOVIDO PARA NÍVEL 7 MESMO SEM TUDO ISSO!"></div><div class="text-hotspot" style="left:40.875%;top:96.04166666666667%;width:47.5%;height:.6979166666666666%" data-text="BUT YOU'VE ONLY BEEN ACTIVE FOR TWO MONTHS--" onclick="showTextTooltip(event,this)" data-translation="MAS VOCÊ SÓ ESTÁ ATIVO HÁ DOIS MESES--"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/34/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:17%;top:3.7083333333333335%;width:58.875%;height:.765625%" data-text="THEN SUMMON ANY TIER-7 ADVENTURER FROM THE GUILD!" oncli "></div><div class="text-hotspot" style="left:19.125%;top:29.1875%;width:46.625%;height:.9739583333333333%" data-text="SO, WHY HAVE YOU ASKED ME TO COME ALL THE WAY HERE?" onclick="showTextTooltip(event,this)" data-translation="ENTÃO, POR QUE VOCÊ ME CHAMOU ATÉ AQUI?"></div><div class="text-hotspot" style="left:77.5%;top:30.546875%;width:21.5%;height:.5104166666666666%" data-text="PLOP" onclick="showTextTooltip(event,this)" data-translation="PLOP"></div><div class="text-hotspot" style="left:31.25%;top:32.015625%;width:18.75%;height:.5833333333333334%" data-text="TAP" onclick="showTextTooltip(event,this)" data-translation="TAP"></div><div class="text-hotspot" style="left:52.37500000000001%;top:41.234375%;width:34.375%;height:.96875%" data-text="BECAUSE YOU AGREED TO DO ME A FAVOR." onclick="showTextTooltip(event,this)" data-translation="PORQUE VOCÊ CONCORDOU EM ME FAZER UM FAVOR."></div><div class="text-hotspot" style="left:43.625%;top:49.0625%;width:12.75%;height:.6770833333333334%" data-text="OH. THAT'S RIGHT." onclick="showTextTooltip(event,this)" data-translation="OH. ISSO MESMO."></div><div class="text-hotspot" style="left:31.624999999999996%;top:54.515625%;width:36.75%;height:.953125%" data-text="I ONLY SAID THAT BECAUSE I WAS RUNNING OUT OF TIME..." onclick="showTextTooltip(event,this)" data-translation="EU SÓ DISSE ISSO PORQUE ESTAVA FICANDO SEM TEMPO..." data-tips="💡 'Running out of time' é uma expressão comum que indica que o tempo está se esgotando para completar algo."></div><div class="text-hotspot" style="left:25.124999999999996%;top:61.48958333333333%;width:51.87500000000001%;height:.9635416666666667%" data-text="...BUT I GUESS IT DOESN'T HURT TO ESTABLISH A CONNECTION WITH A MAGE." onclick="showTextTooltip(event,this)" data-translation="...MAS ACHO QUE NÃO CUSTA ESTABELECER UMA CONEXÃO COM UM MAGO." data-tips="💡 'It doesn't hurt to' é uma expressão que sugere que não há desvantagem em tentar algo."></div><div class="text-hotspot" style="left:14.249999999999998%;top:67.8125%;width:46.75%;height:.953125%" data-text="BUT LIKE I SAID, ONLY IF IT IS REALISTICALLY POSSIBLE." onclick="showTextTooltip(event,this)" data-translation="MAS COMO EU DISSE, SÓ SE FOR REALISTICAMENTE POSSÍVEL." data-tips="💡 'Realistically possible' enfatiza a viabilidade prática de algo, não apenas teórica."></div><div class="text-hotspot" style="left:18%;top:74.09895833333333%;width:37.75%;height:.4166666666666667%" data-text="IT'S NOTHING OUTRAGEOUS." onclick="showTextTooltip(event,this)" data-translation="NÃO É NADA ABSURDO."></div><div class="text-hotspot" style="left:43.25%;top:75.265625%;width:35.375%;height:.4322916666666667%" data-text="I WANTED TO ASK YOU IF……." onclick="showTextTooltip(event,this)" data-translation="EU QUERIA PERGUNTAR SE……."></div><div class="text-hotspot" style="left:15.5%;top:80.58333333333333%;width:69.5%;height:1.640625%" data-text="...YOU WOULD EXCLUSIVELY ALLOW ME TO CONDUCT RESEARCH ON THE ESSENCE YOU CONSUMED IN THE RIFT!" onclick="showTextTooltip(event,this)" data-translation="...VOCÊ ME PERMITIRIA EXCLUSIVAMENTE CONDUZIR PESQUISAS SOBRE A ESSÊNCIA QUE VOCÊ CONSUMIU NA FENDA!" data-tips="💡 'Conduct research on' usa a preposição 'on' para indicar o objeto da pesquisa, diferente do português que usa 'sobre'."></div><div class="text-hotspot" style="left:.25%;top:83.265625%;width:60.375%;height:1.8489583333333333%" data-text="DA DUM" onclick="showTextTooltip(event,this)" data-translation="DA DUM"></div><div class="text-hotspot" style="left:10.25%;top:97.29166666666667%;width:46.5%;height:.9583333333333428%" data-text="AND YOU'RE CERTAINLY GOING TO BENEFIT FROM THIS AS WELL." onclick="showTextTooltip(event,this)" data-translation="E VOCÊ CERTAMENTE VAI SE BENEFICIAR DISSO TAMBÉM." data-tips="💡 'You're certainly going to benefit' usa o futuro simples para indicar uma certeza sobre um evento futuro."></div><div class="text-hotspot" style="left:19.5%;top:98.97916666666666%;width:70.375%;height:.9739583333333333%" da UARDIAN OF THE RIFT WAS SO RARE, THAT EVEN I, THE VETERAN OF THIS GAME, HADN'T EXPERIENCED IN MY PLAYTHROUGHS BEFORE." onclick="showTextTooltip(event,this)" data-translation="UM SENHOR VAMPIRO APARECENDO COMO O GUARDIÃO DA FENDA FOI TÃO RARO, QUE ATÉ EU, O VETERANO DESTE JOGO, NÃO TINHA EXPERIMENTADO EM MINHAS JOGADAS ANTERIORES." data-tips="💡 'Hadn't experienced' usa o past perfect para indicar que a experiência nunca tinha ocorrido até um ponto passado específico."></div><div class="text-hotspot" style="left:16.5%;top:31.656250000000004%;width:31.5%;height:.6770833333333321%" data-text="BUT SHE SEEMS A BIT TOO ECSTATIC." onclick="showTextTooltip(event,this)" data-translation="MAS ELA PARECE UM POUCO EXCITADA DEMAIS."></div><div class="text-hotspot" style="left:39.125%;top:33.21354166666667%;width:39.25%;height:.9427083333333334%" data-text="ARE ALL MAGES IN THIS WORLD THIS PASSIONATE ABOUT RESEARCH?" onclick="showTextTooltip(event,this)" data-translation="SERÁ QUE TODOS OS MAGOS NESTE MUNDO SÃO TÃO APAIXONADOS POR PESQUISAS?"></div><div class="text-hotspot" style="left:16.625%;top:40.286458333333336%;width:49.625%;height:.9635416666666667%" data-text="ANYHOW, THIS ISN'T GOING TO BE A BAD DEAL FOR YOU EITHER." onclick="showTextTooltip(event,this)" data-translation="DE QUALQUER FORMA, ISSO NÃO VAI SER UM MAU NEGÓCIO PARA VOCÊ TAMBÉM." data-tips="💡 'Anyhow' é um conector informal que indica que o falante está mudando de assunto ou voltando ao ponto principal."></div><div class="text-hotspot" style="left:69.375%;top:46.5625%;width:13.625000000000002%;height:.4166666666666667%" data-text="HOLD ON." onclick="showTextTooltip(event,this)" data-translation="ESPERA."></div><div class="text-hotspot" style="left:21.375%;top:51.109375%;width:42.25%;height:1.2083333333333333%" data-text="IS THIS WHY YOU SAID THAT WHEN WE WERE SIGNING THE PAPERS..." onclick="showTextTooltip(event,this)" data-translation="É POR ISSO QUE VOCÊ DISSE AQUILO QUANDO ESTÁVAMOS ASSINANDO OS PAPÉIS..."></div><div class="text-hotspot" style="left:43.375%;top:52.604166666666664%;width:40.625%;height:1.203125%" data-text="BACK IN THE BRANCH OFFICE AS WE PICKED UP OUR MONEY?" onclick="showTextTooltip(event,this)" data-translation="LÁ NA FILIAL QUANDO PEGAMOS NOSSO DINHEIRO?"></div><div class="text-hotspot" style="left:42.25%;top:60.229166666666664%;width:14.625%;height:.375%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:35.75%;top:63.22395833333333%;width:47.25%;height:.9583333333333333%" data-text="AGREEMENT NOT TO DISCLOSE THIS INCIDENT TO ANYONE ELSE?" onclick="showTextTooltip(event,this)" data-translation="ACORDO PARA NÃO DIVULGAR ESTE INCIDENTE A MAIS NINGUÉM?" data-tips="💡 'Not to disclose' é uma estrutura negativa que significa 'não divulgar'. É útil em contextos formais, como contratos."></div><div class="text-hotspot" style="left:33.375%;top:68.55208333333334%;width:52.125%;height:.9791666666666667%" data-text="FINE, BUT ONLY IF YOU AGREE NOT TO KEEP A RECORD OF THE FACT..." onclick="showTextTooltip(event,this)" data-translation="TUDO BEM, MAS SÓ SE VOCÊ CONCORDAR EM NÃO MANTER UM REGISTRO DO FATO..." data-tips="💡 'Fine' aqui é usado como uma expressão informal para concordar, semelhante a 'tudo bem' em português."></div><div class="text-hotspot" style="left:9.375%;top:70.36458333333333%;width:56.625%;height:.9583333333333333%" data-text="THAT MR. BJORN HERE HAD CONSUMED THE ESSENCE OF THE VAMPIRE." onclick="showTextTooltip(event,this)" data-translation="QUE O SR. BJORN AQUI CONSUMIU A ESSÊNCIA DO VAMPIRO."></div><div class="text-hotspot" style="left:11.875%;top:74.69270833333333%;width:5.75%;height:.25%" data-text="!!" onclick="showTextTooltip(event,this)" data-translation="!!"></div><div class="text-hotspot" style="left:20.375%;top:77.578125%;width:36.375%;height:.9531250000000142%" data-text="I HONESTLY THOUGHT SHE WAS DOING THIS FOR ME." onclick="showTextTooltip(event,this)" data-translation="EU HONESTAMENTE PENSEI QUE ELA ESTAVA FAZENDO ISSO POR MIM." data-tips="💡 'Honestly' é um advérbio que transmite sinceridade, frequentemente usado para enfatizar a verdade ou opinião pessoal."></div><div class="text-hotspot" style="left:48.625%;top:79.20833333333334%;width:32.125%;height:.6875%" data-text="I WAS ACTUALLY GRATEFUL FOR ONCE..." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA REALMENTE GRATO POR UMA VEZ..."></div><div class="text-hotspot" style="left:10.125%;top:84.08333333333333%;width:30.25%;height:.43750000000000006%" data-text="UHM, WELL, AHEM." onclick="showTextTooltip(event,this)" data-translation="UHM, BEM, AHEM."></div><div class="text-hotspot" style="left:25.5%;top:84.96354166666666%;width:35.875%;height:1.2083333333333333%" data-text="I DON'T KNOW HOW I'M GOING TO PHRASE IT, BUT--" onclick="showTextTooltip(event,this)" data-translation="NÃO SEI COMO VOU FORMULAR ISSO, MAS--" data-tips="💡 'Phrase it' é um phrasal verb que significa 'formular' ou 'expressar'. Pode ser usado em contextos de comunicação."></div><div class="text-hotspot" style="left:35%;top:90.109375%;width:30%;height:.47916666666666663%" data-text="SO THIS WAS WHY." onclick="showTextTooltip(event,this)" data-translation="ENTÃO ERA POR ISSO."></div><div class="text-hotspot" style="left:20.875%;top:94.73958333333333%;width:39.75%;height:.9635416666666667%" data-text="ANYHOW, JUST THREE HOURS OF YOUR TIME PER WEEK." onclick="showTextTooltip(event,this)" data-translation="DE QUALQUER FORMA, APENAS TRÊS HORAS DO SEU TEMPO POR SEMANA." data-tips="💡 'Anyhow' é uma expressão coloquial equivalente a 'de qualquer forma'. É usada para mudar de assunto ou encerrar uma discussão."></div><div class="text-hotspot" style="left:38.75%;top:96.14583333333333%;width:50.5%;height:1.1979166666666714%" data-text="THAT SHOULD BE ENOUGH FOR ME TO TEST A FEW HYPOTHESES OUT." onclick="showTextTooltip(event,this)" data-translation="ISSO DEVE SER SUFICIENTE PARA EU TESTAR ALGUMAS HIPÓTESES." data-tips="💡 'That should be enough' usa 'should' para expressar expectativa ou probabilidade, semelhante a 'deve ser suficiente'."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/34/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:36.125%;top:3.7760416666666665%;width:33.75%;height:.9791666666666667%" data-text="FOR ABOUT SIX MONTHS, I WOULD SAY?" onclick="showTextTooltip(event,this)" data-translation="POR CERCA DE SEIS MESES, EU DIRIA?" data-tips="💡 'Would' é usado aqui para expressar uma suposição ou estimativa sobre o futuro, indicando incerteza."></div><div class="text-hotspot" style="left:18%;top:8.463541666666668%;width:29.375%;height:.6979166666666666%" data-text="NO. SIX MONTHS IS TOO MUCH." onclick="showTextTooltip(event,this)" data-translation="NÃO. SEIS MESES É DEMAIS."></div><div class="text-hotspot" style="left:28.125%;top:9.8125%;width:60.12499999999999%;height:1.2135416666666665%" data-text="I CAN COMMIT FOR THREE MONTHS. AND I DEMAND TO SEE THE RESULTS OF THE RESEARCH." onclick="showTextTooltip(event,this)" data-translation="POSSO ME COMPROMETER POR TRÊS MESES. E EXIJO VER OS RESULTADOS DA PESQUISA." data-tips="💡 'Commit' é um verbo que significa 'comprometer-se', frequentemente usado em contextos de responsabilidade ou promessas."></div><div class="text-hotspot" style="left:14.374999999999998%;top:13.15625%;width:32.125%;height:.4583333333333333%" data-text="COME ON, MR. BJORN." onclick="showTextTooltip(event,this)" data-translation="VAMOS LÁ, SR. BJORN."></div><div class="text-hotspot" style="left:71.25%;top:17.604166666666668%;width:5.75%;height:.07291666666666667%" data-text="La DUL I" onclick="showTextTooltip(event,this)" data-translation="La DUL I"></div><div class="text-hotspot" style="left:42.625%;top:18.578125%;width:46.375%;height:.953125%" data-text="IT WAS I THAT GOT YOU OUT OF THE EXECUTION BLOCK." onclick="showTextTooltip(event,this)" data-translation="FOI EU QUE TIREI VOCÊ DO BLOCO DE EXECUÇÃO." data-tips="💡 'It was I that got you out' usa uma estrutura inversa para dar ênfase ao sujeito, comum em inglês formal."></div><div class="text-hotspot" style="left:12.25%;top:20.026041666666668%;width:57.49999999999999%;height:1.2135416666666665%" data-text="AND YOU WERE GIVEN 5 MILLION STONES IN ADDITION TO THAT! STOP BEING UNREASONABLE." onclick="showTextTooltip(event,this)" data-translation="E VOCÊ RECEBEU 5 MILHÕES DE PEDRAS ALÉM DISSO! PARE DE SER IRRACIONAL."></div><div class="text-hotspot" style="left:11.5%;top:25.546875000000004%;width:53.625%;height:.9583333333333321%" data-text="I THINK I DESERVE A LITTLE MORE APPRECIATION FOR WHAT I DID." onclick="showTextTooltip(event,this)" data-translation="EU ACHO QUE MEREÇO UM POUCO MAIS DE APRECIAÇÃO PELO QUE FIZ."></div><div class="text-hotspot" style="left:27%;top:33.588541666666664%;width:46.125%;height:.953125%" data-text="I DO APPRECIATE HER INTERVENTION, BUT THIS IS AN ENTIRELY DIFFERENT MATTER." onclick="showTextTooltip(event,this)" data-translation="EU APRECIO A INTERVENÇÃO DELA, MAS ISSO É UMA QUESTÃO TOTALMENTE DIFERENTE."></div><div class="text-hotspot" style="left:18.125%;top:40.13541666666667%;width:45.875%;height:.9479166666666667%" data-text="IN ORDER TO MAKE THIS A LONG-TERM, YET MUTUALLY BENEFICIAL PARTNERSHIP," onclick="showTextTooltip(event,this)" data-translation="PARA FAZER DISSO UMA PARCERIA DE LONGO PRAZO, MAS MUTUAMENTE BENÉFICA," data-tips="💡 'Yet' aqui é usado como um conector contrastante, semelhante a 'mas' em português, para adicionar uma ideia oposta."></div><div class="text-hotspot" style="left:41.5%;top:41.81770833333333%;width:40.875%;height:.9427083333333334%" data-text="I NEED TO FIRMLY ESTABLISH MY TERMS AND CONDITIONS HERE." onclick="showTextTooltip(event,this)" data-translation="PRECISO ESTABELECER FIRME MINHAS CONDIÇÕES AQUI."></div><div class="text-hotspot" style="left:66.5%;top:45.015625%;width:31.125000000000004%;height:.625%" data-text="RISE" onclick="showTextTooltip(event,this)" data-translation="LEVANTAR"></div><div class="text-hotspot" style="left:12.375%;top:45.911458333333336%;width:54.625%;height:.9583333333333333%" data-text="YOU SHOULD BE PAYING ME FOR WHAT YOU DID, AS A MATTER OF FACT." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DEVERIA ME PAGAR PELO QUE FEZ, NA VERDADE."></div><div class="text-hotspot" style="left:14.75%;top:51.55729166666667%;width:39.25%;height:.7604166666666667%" data-text="WHAT? WHAT MAKES YOU SAY THAT?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ? O QUE TE FAZ DIZER ISSO?"></div><div class="text-hotspot" style="left:42.25%;top:55.97916666666667%;width:56.375%;height:1.3958333333333333%" data-text="GLANCE" onclick="showTextTooltip(event,this)" data-translation="OLHAR"></div><div class="text-hotspot" style="left:23.5%;top:62.81250000000001%;width:53.75%;height:1.015625%" data-text="ACCEPTING A PROPOSITION WITHOUT TRYING TO HAGGLE FIRST IS A ROOKIE MOVE." onclick="showTextTooltip(event,this)" data-translation="ACEITAR UMA PROPOSTA SEM TENTAR NEGOCIAR PRIMEIRO É UM ERRO DE INICIANTE." data-tips="💡 'Haggle' é um verbo que significa 'pechinchar' ou 'negociar', usado em contextos de negociação ou compras."></div><div class="text-hotspot" style="left:8.375%;top:66.43229166666667%;width:57.875%;height:1.1822916666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:11.625%;top:72.671875%;width:33.875%;height:.7864583333333333%" data-text="FLINCH" onclick="showTextTooltip(event,this)" data-translation="RECUAR"></div><div class="text-hotspot" style="left:49.625%;top:73.89583333333334%;width:35.5%;height:.7604166666666572%" data-text="WHAT'S THE MEANING OF THIS?" onclick="showTextTooltip(event,this)" data-translation="QUAL O SIGNIFICADO DISSO?"></div><div class="text-hotspot" style="left:16.75%;top:79.796875%;width:66.5%;height:1.4583333333333333%" data-text="YOU MADE ME CONSUME THE ESSENCE OF UNDEAD GOLEM WITHOUT MY CONSENT." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ME FEZ CONSUMIR A ESSÊNCIA DO GOLEM MORTO-VIVO SEM O MEU CONSENTIMENTO."></div><div class="text-hotspot" style="left:51.625%;top:89.22916666666667%;width:23.5%;height:.171875%" data-text="TH-THAT." onclick="showTextTooltip(event,this)" data-translation="A-AQUILO."></div><div class="text-hotspot" style="left:6.375%;top:93.34375%;width:30.5%;height:.7760416666666666%" data-text="FUME" onclick="showTextTooltip(event,this)" data-translation="FÚRIA"></div><div class="text-hotspot" style="left:10.75%;top:94.18229166666666%;width:76.125%;height:2.098958333333343%" data-text="IS THAT SERIOUSLY WHAT YOU'RE UPSET ABOUT? ESSENCE IS SOMETHING OTHER ADVENTURERS ARE DESPERATE TO CONSUME!" onclick="showTextTooltip(event,this)" data-translation="É SÉRIO QUE VOCÊ ESTÁ CHATEADO COM ISSO? ESSÊNCIA É ALGO QUE OUTROS AVENTUREIROS ESTÃO DESESPERADOS PARA CONSUMIR!" data-tips="💡 'Seriously' é um advérbio usado para enfatizar a seriedade ou incredulidade em uma situação."></div><div class="text-hotspot" style="left:23.5%;top:98.89583333333334%;width:19.625%;height:.34375%" data-text="KEEP DISTANCE!" onclick="showTextTooltip(event,this)" data-translation="MANTENHA DISTÂNCIA!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/34/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:46%;top:0;width:23.375%;height:.5677083333333334%" data-text="PUSH" onclick="showTextTooltip(event,this)" data-translation="EMPURRAR"></div><div class="text-hotspot" style="left:12.875%;top:5.255208333333333%;width:51.25%;height:1.4687500000000009%" data-text="YOU FORCED THAT ESSENCE ON ME SO THAT YOU CAN SURVIVE FROM THE TOUGH BATTLE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ FORÇOU ESSA ESSÊNCIA EM MIM PARA QUE VOCÊ PUDESSE SOBREVIVER À BA
