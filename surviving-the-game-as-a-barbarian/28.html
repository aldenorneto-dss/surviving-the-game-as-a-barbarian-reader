<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>28</title></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/28/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:4.125%;top:2.817708333333333%;width:89.125%;height:2.6927083333333335%" data-text="SURVIVING THE GAME AS A BARBARIAN" onclick="showTextTooltip(event,this)" data-translation="SOBREVIVENDO NO JOGO COMO UM BÁRBARO" data-tips="💡 'Surviving the game' é uma expressão que pode ser traduzida como 'sobrevivendo no jogo', mas também pode significar 'lidar com dificuldades'."></div><div class="text-hotspot" style="left:29.875%;top:5.786458333333333%;width:40.5%;height:.4635416666666667%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | Han tae-su ORIGINAL STORY | Jung Yoon-kang" onclick="showTextTooltip(event,this)" data-translation="ARTE | MIDNIGHT STUDIO ADAPTAÇÃO | Han tae-su HISTÓRIA ORIGINAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:45.375%;top:6.822916666666666%;width:8.625%;height:.21354166666666666%" data-text="28" onclick="showTextTooltip(event,this)" data-translation="28"></div><div class="text-hotspot" style="left:18.375%;top:13.041666666666666%;width:63.5%;height:.6979166666666666%" data-text="UNCOMMON MONSTERS ARE LARGELY CLASSIFIED INTO FOUR DIFFERENT RANKS." onclick="showTextTooltip(event,this)" data-translation="MONSTROS INCOMUNS SÃO LARGAMENTE CLASSIFICADOS EM QUATRO RANKS DIFERENTES." data-tips="💡 'Largely classified' usa 'largely' no sentido de 'em grande parte', que pode confundir por parecer 'largamente'."></div><div class="text-hotspot" style="left:39.125%;top:17.515625%;width:21.625%;height:.20833333333333334%" data-text="VETERAN." onclick="showTextTooltip(event,this)" data-translation="VETERANO."></div><div class="text-hotspot" style="left:8.75%;top:20.713541666666664%;width:82.5%;height:4.911458333333334%" data-text="B THESE ARE MONSTERS THAT HAVE THE SAME OVERALL STATS AS COMMON ONES, BUT HAVE SPECIALIZATIONS LIKE GOBLIN ARCHERS AND SWORDSMEN." onclick="showTextTooltip(event,this)" data-translation="ESSES SÃO MONSTROS QUE TÊM AS MESMAS ESTATÍSTICAS GERAIS QUE OS COMUNS, MAS POSSUEM ESPECIALIZAÇÕES COMO ARQUEIROS E ESPADACHINS GOBLINS." data-tips="💡 'Overall stats' refere-se a 'estatísticas gerais', uma expressão comum em jogos para indicar atributos totais de um personagem ou monstro."></div><div class="text-hotspot" style="left:43.5%;top:30.125%;width:13.25%;height:.19791666666666669%" data-text="ELITE." onclick="showTextTooltip(event,this)" data-translation="ELITE."></div><div class="text-hotspot" style="left:9.75%;top:38.166666666666664%;width:65%;height:.953125%" data-text="THIS TERM REFERS TO MONSTERS THAT ARE RELATIVELY STRONGER THAN AN AVERAGE KIND FOUND ON A PARTICULAR FLOOR." onclick="showTextTooltip(event,this)" data-translation="ESSE TERMO REFERE-SE A MONSTROS QUE SÃO RELATIVAMENTE MAIS FORTES QUE UM TIPO MÉDIO ENCONTRADO EM UM ANDAR ESPECÍFICO." data-tips="💡 'Refers to' é uma estrutura comum para indicar a definição de algo, similar a 'refere-se a' em português."></div><div class="text-hotspot" style="left:24%;top:39.515625%;width:66.25%;height:.9583333333333333%" data-text="FOR INSTANCE, DEATH FIENDS AINAR AND I ENCOUNTERED IN THE LAND OF THE DEAD ARE ELITE MONSTERS ON THAT LEVEL." onclick="showTextTooltip(event,this)" data-translation="POR EXEMPLO, OS DEMÔNIOS DA MORTE QUE AINAR E EU ENCONTRAMOS NA TERRA DOS MORTOS SÃO MONSTROS DE ELITE NAQUELE NÍVEL."></div><div class="text-hotspot" style="left:42%;top:45.098958333333336%;width:13.125%;height:.203125%" data-text="RARE." onclick="showTextTooltip(event,this)" data-translation="RARO."></div><div class="text-hotspot" style="left:13.5%;top:51.041666666666664%;width:61.12499999999999%;height:.9375%" data-text="THESE KINDS OF MONSTERS ONLY APPEAR UNDER CERTAIN CONDITIONS LIKE THE UNDEAD GOLEM..." onclick="showTextTooltip(event,this)" data-translation="ESSES TIPOS DE MONSTROS SÓ APARECEM SOB CERTAS CONDIÇÕES COMO O GOLEM UNDEAD..." data-tips="💡 'Under certain conditions' é uma expressão que significa 'sob certas condições', útil para descrever situações específicas."></div><div class="text-hotspot" style="left:40%;top:57.26041666666667%;width:50.125%;height:.6979166666666666%" data-text="...OR EXTREMELY RARELY ON REGULAR FIELDS, LIKE A MIMIC TREASURE CHEST." onclick="showTextTooltip(event,this)" data-translation="...OU EXTREMAMENTE RARAMENTE EM CAMPOS REGULARES, COMO UM BAÚ DE TESOURO MIMIC." data-tips="💡 'Extremely rarely' usa 'extremely' para intensificar 'raramente', uma construção comum para enfatizar a frequência."></div><div class="text-hotspot" style="left:35.375%;top:62%;width:29.125%;height:.5364583333333334%" data-text="LAST BUT NOT LEAST..." onclick="showTextTooltip(event,this)" data-translation="POR ÚLTIMO, MAS NÃO MENOS IMPORTANTE..."></div><div class="text-hotspot" style="left:19.75%;top:67%;width:60.75%;height:1.1458333333333286%" data-text="...THERE ARE CREATURES THAT HAVE SPECIAL LORES AND NAMES WITHIN THE GAME." onclick="showTextTooltip(event,this)" data-translation="...HÁ CRIATURAS QUE TÊM LENDAS E NOMES ESPECIAIS DENTRO DO JOGO."></div><div class="text-hotspot" style="left:17%;top:71.796875%;width:65.75%;height:1.015625%" data-text="UNIQUE MONSTERS, ALSO KNOWN AS ELITE BOSSES." onclick="showTextTooltip(event,this)" data-translation="MONSTROS ÚNICOS, TAMBÉM CONHECIDOS COMO CHEFES DE ELITE."></div><div class="text-hotspot" style="left:7.375%;top:83.921875%;width:68.875%;height:2.2552083333333335%" data-text="DASH" onclick="showTextTooltip(event,this)" data-translation="CORRER"></div><div class="text-hotspot" style="left:15%;top:88.54166666666666%;width:45.5%;height:.8333333333333334%" data-text="JUST WHAT IN THE WORLD IS THAT THING?!" onclick="showTextTooltip(event,this)" data-translation="MAS O QUE DIABOS É AQUILO?!" data-tips="💡 'What in the world' é uma expressão usada para expressar surpresa ou espanto, similar a 'que diabos' em português."></div><div class="text-hotspot" style="left:34.75%;top:89.77604166666666%;width:52%;height:.8333333333333334%" data-text="A VAMPIRE? THIS IS TOTALLY UNEXPECTED!" onclick="showTextTooltip(event,this)" data-translation="UM VAMPIRO? ISSO É TOTALMENTE INESPERADO!"></div><div class="text-hotspot" style="left:36%;top:97.70833333333333%;width:48.875%;height:1.1614583333333286%" data-text="STOP WHINING AND KEEP RUNNING, DWARF!" onclick="showTextTooltip(event,this)" data-translation="PARE DE RECLAMAR E CONTINUE CORRENDO, ANÃO!" data-tips="💡 'Stop whining' é uma forma coloquial de dizer 'pare de reclamar', onde 'whining' é uma gíria para reclamações constantes."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/28/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:25.124999999999996%;top:4.958333333333333%;width:50.5%;height:.5833333333333334%" data-text="CAMBORMERE, THE VAMPIRE DUKE." onclick="showTextTooltip(event,this)" data-translation="CAMBORMERE, O DUQUE VAMPIRO."></div><div class="text-hotspot" style="left:9.125%;top:5.760416666666666%;width:25.75%;height:.71875%" data-text="DAS" onclick="showTextTooltip(event,this)" data-translation="CORRER"></div><div class="text-hotspot" style="left:69.375%;top:9.796875%;width:27%;height:.7083333333333333%" data-text="BITE" onclick="showTextTooltip(event,this)" data-translation="MORDER"></div><div class="text-hotspot" style="left:15.25%;top:12.265625%;width:36.875%;height:.7083333333333333%" data-text="HE'S A TIER-5 ELITE BOSS THAT MOVES AROUND ALONE," onclick="showTextTooltip(event,this)" data-translation="ELE É UM CHEFE DE ELITE NÍVEL 5 QUE SE MOVE SOZINHO," data-tips="💡 'Tier-5' indica um nível ou classificação, comum em jogos para categorizar poder ou habilidade."></div><div class="text-hotspot" style="left:40.375%;top:13.838541666666668%;width:42.25%;height:.9583333333333333%" data-text="AND IS EQUALLY SKILLED IN DARK MAGIC AND PHYSICAL COMBAT." onclick="showTextTooltip(event,this)" data-translation="E É IGUALMENTE HABILIDOSO EM MAGIA NEGRA E COMBATE FÍSICO."></div><div class="text-hotspot" style="left:44.875%;top:20.75%;width:37.625%;height:.6927083333333334%" data-text="AN ELITE BOSS AS A GUARDIAN...?!" onclick="showTextTooltip(event,this)" data-translation="UM CHEFE DE ELITE COMO GUARDIÃO...?!"></div><div class="text-hotspot" style="left:10.75%;top:22.140625%;width:45.625%;height:.6822916666666679%" data-text="THIS IS ABSOLUTELY UNPRECEDENTED!" onclick="showTextTooltip(event,this)" data-translation="ISSO É TOTALMENTE SEM PRECEDENTES!"></div><div class="text-hotspot" style="left:94.25%;top:24.276041666666668%;width:5.625%;height:.2864583333333333%" data-text="S" onclick="showTextTooltip(event,this)" data-translation="S"></div><div class="text-hotspot" style="left:12.125%;top:30.333333333333336%;width:32.625%;height:.5208333333333333%" data-text="NOT SO SURE ABOUT THAT." onclick="showTextTooltip(event,this)" data-translation="NÃO TENHO TANTA CERTEZA DISSO."></div><div class="text-hotspot" style="left:37.25%;top:31.53125%;width:51%;height:1.1614583333333333%" data-text="I'VE MET ELITE BOSSES INSIDE THIRD FLOOR RIFTS IN THE GAME BEFORE." onclick="showTextTooltip(event,this)" data-translation="EU JÁ ENCONTREI CHEFES DE ELITE DENTRO DE FENDAS NO TERCEIRO ANDAR NO JOGO ANTES." data-tips="💡 'Inside third floor rifts' usa 'inside' para indicar localização dentro de um espaço, semelhante a 'dentro de' em português."></div><div class="text-hotspot" style="left:22.125%;top:37.385416666666664%;width:56.375%;height:1.2135416666666665%" data-text="...I SUPPOSE WHAT SHE SAYS ISN'T ENTIRELY WRONG, IF WE RESTRICT IT TO THE RIFTS APPEARING ON THE FIRST FLOOR, TO BE FAIR." onclick="showTextTooltip(event,this)" data-translation="...SUPONHO QUE O QUE ELA DIZ NÃO ESTÁ TOTALMENTE ERRADO, SE RESTRINGIRMOS ÀS FENDAS QUE APARECEM NO PRIMEIRO ANDAR, PARA SER JUSTO." data-tips="💡 'To be fair' é um conector usado para indicar que se está tentando ser justo ou imparcial."></div><div class="text-hotspot" style="left:15.875%;top:46.125%;width:39.25%;height:1.234375%" data-text="I CAN CONFIDENTLY SAY I PLAYED THE GAME MORE THAN TEN THOUSAND TIMES..." onclick="showTextTooltip(event,this)" data-translation="POSSO DIZER COM CONFIANÇA QUE JOGUEI O JOGO MAIS DE DEZ MIL VEZES..." data-tips="💡 'Confidently say' é uma expressão usada para afirmar algo com certeza, traduzida como 'dizer com confiança'."></div><div class="text-hotspot" style="left:39.375%;top:47.75%;width:46.875%;height:1.46875%" data-text="AND NEVER RAN ACROSS A VAMPIRE DUKE A SINGLE TIME ON ANY FIRST FLOOR INSTANCE DUNGEONS." onclick="showTextTooltip(event,this)" data-translation="E NUNCA ENCONTREI UM DUQUE VAMPIRO UMA ÚNICA VEZ EM QUALQUER INSTÂNCIA DE MASMORRA NO PRIMEIRO ANDAR."></div><div class="text-hotspot" style="left:27.250000000000004%;top:54.083333333333336%;width:45.625%;height:1.2291666666666665%" data-text="I ONLY LEARNED ABOUT THAT CREATURE FROM A PLAYTHROUGH VIDEO POSTED BY ANOTHER PLAYER." onclick="showTextTooltip(event,this)" data-translation="SÓ APRENDI SOBRE ESSA CRIATURA A PARTIR DE UM VÍDEO DE JOGATINA POSTADO POR OUTRO JOGADOR." data-tips="💡 'Playthrough video' refere-se a um vídeo mostrando alguém jogando um jogo, comum em comunidades de jogos."></div><div class="text-hotspot" style="left:10.5%;top:57.42708333333333%;width:16.5%;height:.3020833333333333%" data-text="WHAT THE HELL?" onclick="showTextTooltip(event,this)" data-translation="QUE DIABOS?"></div><div class="text-hotspot" style="left:14.374999999999998%;top:62.958333333333336%;width:44.875%;height:.9375%" data-text="BUT HOW DID YOU EVEN KNOW SOMETHING WAS UP?" onclick="showTextTooltip(event,this)" data-translation="MAS COMO VOCÊ SABIA QUE ALGO ESTAVA ERRADO?" data-tips="💡 'Something was up' é uma expressão informal que significa 'algo estava errado'."></div><div class="text-hotspot" style="left:37.875%;top:67.86979166666667%;width:46.5%;height:1.2135416666666665%" data-text="YOU SPOTTED IT AND SAID TO CLOSE THE DOOR EVEN BEFORE WE OPENED IT." onclick="showTextTooltip(event,this)" data-translation="VOCÊ VIU E DISSE PARA FECHAR A PORTA ANTES MESMO DE ABRIRMOS."></div><div class="text-hotspot" style="left:30%;top:73.63020833333334%;width:39.625%;height:1.1979166666666714%" data-text="THAT DAMNED CURIOSITY OF HERS. CAN SHE EVER STOP DELVING INTO THINGS?" onclick="showTextTooltip(event,this)" data-translation="AQUELA MALDITA CURIOSIDADE DELA. ELA NUNCA PODE PARAR DE INVESTIGAR AS COISAS?" data-tips="💡 'Can she ever stop' é uma estrutura de pergunta retórica, usada para enfatizar frustração ou exasperação."></div><div class="text-hotspot" style="left:19.125%;top:76.58333333333334%;width:65%;height:1.140625%" data-text="LIKE I SAID, WE SHOULD FOCUS ON FLEEING INSTEAD OF ASKING QUESTIONS!" onclick="showTextTooltip(event,this)" data-translation="COMO EU DISSE, DEVEMOS NOS CONCENTRAR EM FUGIR EM VEZ DE FAZER PERGUNTAS!" data-tips="💡 'Instead of asking questions' usa 'instead of' para indicar uma alternativa a algo, comum em comparações."></div><div class="text-hotspot" style="left:46.5%;top:82.77604166666667%;width:42.75%;height:.9427083333333334%" data-text="BUT IT'S NOT LIKE I'M RUNNING ON MY OWN FEET." onclick="showTextTooltip(event,this)" data-translation="MAS NÃO É COMO SE EU ESTIVESSE CORRENDO COM MEUS PRÓPRIOS PÉS." data-tips="💡 'It's not like' é uma expressão usada para suavizar ou negar uma afirmação, similar a 'não é como se'."></div><div class="text-hotspot" style="left:52.75%;top:89.796875%;width:36%;height:.4270833333333333%" data-text="...IT WAS MY GUT INSTINCT." onclick="showTextTooltip(event,this)" data-translation="...FOI MEU INSTINTO." data-tips="💡 'Gut instinct' refere-se a uma intuição ou pressentimento, algo que se sente sem evidência concreta."></div><div class="text-hotspot" style="left:22.875%;top:97.96875%;width:54.50000000000001%;height:.7135416666666666%" data-text="I ACTUALLY NOTICED THAT THE COLOR OF THE DOOR HANDLE WAS DIFFERENT." onclick="showTextTooltip(event,this)" data-translation="NA VERDADE, PERCEBI QUE A COR DA MAÇANETA DA PORTA ERA DIFERENTE."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/28/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:12.25%;top:7.968749999999999%;width:50.875%;height:.953125%" data-text="IT WAS THE SLIGHTEST BIT OF CHANGE I NOTICED IN THE PLAYTHROUGH VIDEO I WATCHED," onclick="showTextTooltip(event,this)" data-translation="FOI A MUDANÇA MAIS SUTIL QUE NOTEI NO VÍDEO DE JOGATINA QUE ASSISTI," data-tips="💡 'Slightest bit of change' usa 'slightest' para indicar uma mudança muito pequena, enfatizando a sutileza."></div><div class="text-hotspot" style="left:29.25%;top:9.53125%;width:60%;height:.9583333333333333%" data-text="AFTER FAILING TO ENCOUNTER THAT BEAST MYSELF IN-GAME AFTER SO MANY TRIES UNDER THE SAME CIRCUMSTANCES." onclick="showTextTooltip(event,this)" data-translation="DEPOIS DE NÃO CONSEGUIR ENCONTRAR AQUELA BESTA NO JOGO APÓS TANTAS TENTATIVAS SOB AS MESMAS CIRCUNSTÂNCIAS."></div><div class="text-hotspot" style="left:1.125%;top:11.21875%;width:42.625%;height:1.046875%" data-text="Cambormere appears in Dungeon and Stone" onclick="showTextTooltip(event,this)" data-translation="Cambormere aparece em Dungeon and Stone"></div><div class="text-hotspot" style="left:27%;top:14.104166666666668%;width:22.375%;height:.5%" data-text="00:12 / 20:35" onclick="showTextTooltip(event,this)" data-translation="00:12 / 20:35"></div><div class="text-hotspot" style="left:26%;top:18.197916666666668%;width:47.75%;height:.9583333333333333%" data-text="THE DOOR HANDLE COLOR WAS THE ONLY DIFFERENCE I MANAGED TO FIND." onclick="showTextTooltip(event,this)" data-translation="A COR DA MAÇANETA DA PORTA FOI A ÚNICA DIFERENÇA QUE CONSEGUI ENCONTRAR."></div><div class="text-hotspot" style="left:37%;top:23.390625%;width:49.125%;height:.9635416666666667%" data-text="WOULD I HAVE NOTICED IT BEFORE THE DWARF EVEN GOT CLOSE TO THE DOOR," onclick="showTextTooltip(event,this)" data-translation="EU TERIA NOTADO ANTES MESMO DO ANÃO CHEGAR PERTO DA PORTA,"></div><div class="text-hotspot" style="left:17.875%;top:24.807291666666668%;width:45.5%;height:.96875%" data-text="HAD I NOT BEEN SO ECSTATIC AND CARRIED AWAY BY CONSECUTIVE LUCKY INSTANCES?" onclick="showTextTooltip(event,this)" data-translation="SE NÃO ESTIVESSE TÃO EUFÓRICO E LEVADO POR INSTÂNCIAS DE SORTE CONSECUTIVAS?"></div><div class="text-hotspot" style="left:12.125%;top:35.640625%;width:47.25%;height:1.203125%" data-text="WE CAN'T LEAVE THIS PLACE ANYWAYS WITHOUT SLAYING THE GUARDIAN." onclick="showTextTooltip(event,this)" data-translation="NÃO PODEMOS SAIR DESTE LUGAR SEM MATAR O GUARDIÃO." data-tips="💡 'Slaying the guardian' usa 'slaying' como um termo comum em fantasia para 'matar' de forma dramática ou heroica."></div><div class="text-hotspot" style="left:29.25%;top:37.473958333333336%;width:42.875%;height:.984375%" data-text="WOULDN'T IT BE BETTER OFF TO JUST FIGHT HIM IN THAT CASE?" onclick="showTextTooltip(event,this)" data-translation="NÃO SERIA MELHOR LUTAR COM ELE NESSE CASO?" data-tips="💡 'Wouldn't it be better off' é uma estrutura condicional usada para sugerir uma alternativa, traduzi
