T WORRY." data-translation="Oh, estou bem. Não se preocupe." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.125%;top:21.416666666666668%;width:32.875%;height:.47395833333333337%" data-text="WHAT HAPPENED?" data-translation="O que aconteceu?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.625%;top:22.65625%;width:44.125%;height:1.0520833333333333%" data-text="I HEARD YOU TOLD HIM YOU WANTED TO BE THE CHIEFTAIN!" data-translation="Ouvi dizer que você disse a ele que queria ser o chefe!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.624999999999996%;top:24.713541666666668%;width:13.5%;height:.26041666666666663%" data-text="WHOA!" data-translation="Uau!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:51.37500000000001%;top:24.921875%;width:19.125%;height:.4322916666666667%" data-text="REALLY?" data-translation="Sério?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.125%;top:32.27083333333333%;width:65.25%;height:1.140625%" data-text="HE SAID I MUST PROVE MYSELF BY GETTING STRONGER." data-translation="Ele disse que devo provar meu valor ficando mais forte." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39%;top:36.375%;width:8.625%;height:.22395833333333334%" data-text="SEE!" data-translation="Viu!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:49%;top:40.869791666666664%;width:37.125%;height:.6875%" data-text="YOU HAVE TO DEFEAT HIM IN COMBAT?" data-translation="Você tem que derrotá-lo em combate?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:59%;top:43.421875%;width:4%;height:.22395833333333334%" data-text="U" data-translation="U" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15%;top:43.453125%;width:44.625%;height:.9479166666666643%" data-text="THAT'LL BE DIFFICULT, EVEN FOR LITTLE VALCAN." data-translation="Isso vai ser difícil, até mesmo para o pequeno Valcan." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:26.125%;top:48.56770833333333%;width:49.75%;height:.84375%" data-text="ALRIGHT, WHAT DID YOU TELL HIM, BJORN?" data-translation="Certo, o que você disse a ele, Bjorn?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.25%;top:57.17187500000001%;width:62.74999999999999%;height:.7135416666666666%" data-text="IT WON'T TAKE TOO LONG." data-translation="Não vai demorar muito." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:2.25%;top:62.77604166666667%;width:42.375%;height:.7916666666666667%" data-text="STEP" data-translation="PASSO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:55.375%;top:63.81250000000001%;width:44.5%;height:.8750000000000071%" data-text="STEP ALLA" data-translation="PASSO ALLA" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.25%;top:70.546875%;width:49.625%;height:.5833333333333334%" data-text="THAT WAS MY ANSWER." data-translation="Essa foi minha resposta." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.874999999999996%;top:79.75520833333334%;width:47.875%;height:.6979166666666572%" data-text="I MET WITH KHARON ON MY WAY OUT AND MADE SURE..." data-translation="Encontrei Kharon no caminho de saída e garanti..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.75%;top:89.02604166666667%;width:58.375%;height:.6927083333333334%" data-text="...NOT TO TEACH BABY BARBARIANS TO DEEPLY HATE HUMANS." data-translation="...que não ensinassem os pequenos bárbaros a odiar profundamente os humanos." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.75%;top:90.68229166666667%;width:39.25%;height:.6874999999999858%" data-text="WHAT THE CHIEFTAIN SAID MAKES SENSE, TOO." data-translation="O que o chefe disse faz sentido também." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.625%;top:95.5%;width:42.625%;height:1.0364583333333286%" data-text="B-BUT YOU TOLD ME HUMANS WERE OUR ENEMIES!" data-translation="M-MAS você me disse que os humanos eram nossos inimigos!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:61.625%;top:97.79166666666667%;width:38.25%;height:1.6354166666666572%" data-text="инм, WELL-- POW" data-translation="инм, BEM-- POW" onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/104/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:48.875%;top:4.171875%;width:38%;height:.7760416666666666%" data-text="NOT ALL HUMANS ARE ENEMIES!" data-translation="Nem todos os humanos são inimigos!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:0;top:4.505208333333333%;width:3.125%;height:.15104166666666666%" data-text="HAR" data-translation="HAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.625%;top:5.53125%;width:51.875%;height:1.072916666666666%" data-text="THERE ACTUALLY ARE GREAT WARRIORS AMONG THEM!" data-translation="Na verdade, há grandes guerreiros entre eles!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.25%;top:10.84375%;width:39.75%;height:.7604166666666667%" data-text="ONE OF THEM IS KNOWN AS DWALKIE!" data-translation="Um deles é conhecido como Dwalkie!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:65.125%;top:12.338541666666666%;width:14.124999999999998%;height:.16666666666666669%" data-text="...OH." data-translation="...Oh." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:30.625000000000004%;top:17.734375%;width:57.375%;height:1.34375%" data-text="HE USED TO BE BJORN'S COMPANION! LET ME TELL YOU WHAT HAPPENED!" data-translation="Ele costumava ser companheiro do Bjorn! Deixe-me contar o que aconteceu!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32.375%;top:25.802083333333332%;width:35.25%;height:.16145833333333334%" data-text="A MOMENT LATER" data-translation="Um momento depois" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22%;top:28.494791666666668%;width:57.25%;height:.7083333333333333%" data-text="I SEE. HE WAS A HUMAN, BUT A TRULY FINE INDIVIDUAL..." data-translation="Entendo. Ele era um humano, mas um indivíduo realmente admirável..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:73.375%;top:32.16145833333333%;width:23%;height:.5833333333333334%" data-text="NOD" data-translation="NOD" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:10%;top:33.74479166666667%;width:24%;height:.296875%" data-text="I'M SWEATING FROM MY EYE..." data-translation="Estou suando pelo olho..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.75%;top:38.140625%;width:65.375%;height:1.046875000000007%" data-text="IS IT OKAY FOR ME TO SHARE HIS STORY WITH OTHER WARRIORS?" data-translation="Posso compartilhar a história dele com outros guerreiros?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.625%;top:44.036458333333336%;width:25.374999999999996%;height:.43750000000000006%" data-text="ABOUT DWALKIE?" data-translation="Sobre Dwalkie?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:42.75%;top:51.95833333333333%;width:40%;height:1.046875%" data-text="OH! THAT IS SUCH A BRILLIANT IDEA!" data-translation="Oh! Isso é uma ideia brilhante!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:66.75%;to
