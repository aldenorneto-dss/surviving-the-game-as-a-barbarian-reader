dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/109/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:26.625%;top:4.041666666666666%;width:46.875%;height:.796875%" data-text="AFTER A SMOOTH (?) NEGOTIATION WITH THE CHIEF..." data-translation="DEPOIS DE UMA NEGOCIAÇÃO TRANQUILA (?) COM O CHEFE..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.25%;top:13.078124999999998%;width:53.625%;height:.7135416666666666%" data-text="...I BEGAN PREPARING FOR THE FIRST ADVENTURE WITH NEW COMPANIONS." data-translation="...COMECEI A ME PREPARAR PARA A PRIMEIRA AVENTURA COM NOVOS COMPANHEIROS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.750000000000004%;top:18.348958333333336%;width:24.625%;height:.4427083333333333%" data-text="BUT BEFORE ANYTHING..." data-translation="MAS ANTES DE QUALQUER COISA..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:60.62499999999999%;top:21.34375%;width:37.75%;height:.8906249999999999%" data-text="CLOSE" data-translation="FECHAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.625%;top:30.369791666666668%;width:53.125%;height:.6979166666666643%" data-text="...RAVEN AND I FINALLY WRAPPED UP THE DISCUSSION OF 31 ISSUES." data-translation="...RAVEN E EU FINALMENTE ENCERRAMOS A DISCUSSÃO DE 31 QUESTÕES." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:29.75%;top:35.1875%;width:20.625%;height:.21354166666666666%" data-text="GOOD!" data-translation="ÓTIMO!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:33.375%;top:36.140625%;width:54.625%;height:1.4739583333333335%" data-text="I'LL BRING IT UP AGAIN IF SOMETHING ELSE COMES TO MY MIND." data-translation="EU VOU MENCIONAR DE NOVO SE ALGO MAIS ME VIER À MENTE." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="l xtTooltip(event,this)"></div><div class="text-hotspot" style="left:53%;top:36.03125%;width:35.125%;height:.1875%" data-text="ALRRRIGHT!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:8.25%;top:38.229166666666664%;width:83.875%;height:2.140625%" data-text="SLASH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:30.375000000000004%;top:46.317708333333336%;width:56.375%;height:.9479166666666667%" data-text="I SIGNED MY TEAM UP FOR A MONTH AND WORKED ON OUR TEAM CHEMISTRY EVERY NOW AND AGAIN." data-translation="INSCRI MINHA EQUIPE POR UM MÊS E TRABALHEI NA NOSSA QUÍMICA DE EQUIPE DE VEZ EM QUANDO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.625%;top:51.520833333333336%;width:40%;height:.6979166666666666%" data-text="I ALSO VISITED THE LIBRARY FROM TIME TO TIME TO READ." data-translation="TAMBÉM VISITEI A BIBLIOTECA DE TEMPOS EM TEMPOS PARA LER." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:42.75%;top:52.817708333333336%;width:25.25%;height:.33333333333333337%" data-text="INFORMATION IS IMPORTANT!" data-translation="INFORMAÇÃO É IMPORTANTE!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.75%;top:53.41145833333333%;width:13.125%;height:.609375%" data-text="822" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.5%;top:59.09375%;width:31.5%;height:.49479166666666663%" data-text="HAHAHA" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:29.5%;top:60.0625%;width:47%;height:.953125%" data-text="I HEARD AINAR AND RAVEN ARE YOUR NEW TEAMMATES!" data-translation="Ouvi dizer que Ainar e Raven são seus novos companheiros de equipe!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:30.375000000000004%;top:63.78125%;width:5.25%;height:.125%" data-text="AH," data-translation="Ah," onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:77.25%;top:63.92187499999999%;width:7.000000000000001%;height:.2916666666666667%" data-text="#" data-translation="#" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.250000000000004%;top:63.94270833333333%;width:11.875%;height:.30729166666666663%" data-text="YOU'RE HERRE!" data-translation="você está aqui!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.75%;top:68.64583333333333%;width:44.75%;height:.4479166666666667%" data-text="HIKUROD PAID ME A VISIT THE OTHER DAY..." data-translation="Hikurod me visitou outro dia..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:46.5%;top:73.27604166666667%;width:29.375%;height:.8229166666666666%" data-text="...BUT THAT'S NOT IMPORTANT." data-translation="...mas isso não é importante." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.5%;top:75.46354166666667%;width:16.5%;height:1.1197916666666667%" data-text="?" data-translation="?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.500000000000004%;top:87.61458333333333%;width:44.75%;height:.47916666666666663%" data-text="TIME FLEW BY. THE DAY HAD COME." data-translation="O tempo voou. O dia chegou." onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/109/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:21%;top:7.8125%;width:57.99999999999999%;height:.5625%" data-text="IT WAS TIME TO ENTER THE LABYRINTH AGAIN." data-translation="Era hora de entrar no labirinto novamente." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:4.75%;top:15.380208333333334%;width:89.375%;height:2.703125%" data-text="SURVIVING THE GAME AS A BARBARIAN" data-translation="Sobrevivendo ao jogo como um bárbaro" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:29.875%;top:18.317708333333332%;width:40.5%;height:.45312499999999994%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | TEAM THE JICK ORIGINAL STORY | Jung Yoon-kang" data-translation="ARTE | ADAPTAÇÃO MIDNIGHT STUDIO | EQUIPE THE JICK HISTÓRIA ORIGINAL | Jung Yoon-kang" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.625%;top:19.369791666666668%;width:24.625%;height:.6458333333333334%" data-text="709 EXPOSED" data-translation="709 EXPOSO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.625%;top:25.510416666666668%;width:32.625%;height:.9635416666666667%" data-text="DEEPEST PART OF THE CRYSTAL CAVE ON THE FIRST FLOOR." data-translation="PARTE MAIS PROFUNDA DA CAVERNA DE CRISTAL NO PRIMEIRO ANDAR." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37%;top:26.828125000000004%;width:28.625%;height:.703125%" data-text="MEMORIAL STONE OF THE GREAT SAGE." data-translation="PEDRA MEMORIAL DO GRANDE SÁBIO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.75%;top:33.1875%;width:44.375%;height:1.046875%" data-text="PLEASE EXPLAIN WHAT IS GOING ON, MR. URIKFRIED." data-translation="Por favor, explique o que está acontecendo, Sr. Urikfried." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.875%;top:39.30208333333333%;width:33.375%;height:.7708333333333334%" data-text="CRAP. HE GOT EXPOSED WAY TOO QUICKLY." data-translation="Droga. Ele foi exposto rápido demais." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:45%;top:41.03645833333333%;width:21.125%;height:.47395833333333337%" data-text="инм, WELL..." data-translation="инм, bem..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.25%;top:42.90625%;width:20.125%;height:.5%" data-text="GLARE" data-translation="OLHAR FIXO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:62%;top:45.47395833333333%;width:26.5%;height:.6718750000000071%" data-text="IT'S STRANGE I WAS SURE WE WERE ON THE RIGHT TRACK." data-translation="É estranho, eu tinha certeza de que estávamos no caminho certo." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.000000000000002%;top:48.713541666666664%;width:42.125%;height:.796875%" data-text="DID YOU KNOW ABOUT THIS, MR. YANDEL?" data-translation="Você sabia disso, Sr. Yandel?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.25%;top:53.13541666666667%;width:42.125%;height:1.0625%" data-text="HONESTLY, I HAD NO IDEA HE WOULD BE THIS BAD." data-translation="Honestamente, eu não fazia ideia de que ele seria tão ruim." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:64.75%;top:60.03645833333333%;width:19.125%;height:.19791666666666669%" data-text="DAMMIT." data-translation="Droga." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.874999999999996%;top:61.01562499999999%;width:52.5%;height:1.3489583333333333%" data-text="WE STARTED FROM THE MEMORIAL STONE AND WERE BACK IN FRONT OF IT 15 MINUTES LATER!" data-translation="Começamos da Pedra Memorial e voltamos para frente dela 15 minutos depois!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.624999999999996%;top:63.598958333333336%;width:40.75%;height:.9427083333333334%" data-text="THERE WAS NO CURE FOR THE BEARMAN'S TERRIBLE SENSE OF DIRECTION." data-translation="Não havia cura para o terrível senso de direção do Bearman." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.125%;top:68.60416666666667%;width:52.75%;height:1.7291666666666572%" data-text="NOW I UNDERSTAND WHY YOU WERE 45 MINUTES LATE EVEN THOUGH YOU LIVE CLOSE TO THE DIMENSION SQUARE." data-translati
