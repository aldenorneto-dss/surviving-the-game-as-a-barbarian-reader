<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>51</title><link rel="icon" href="cover.jpg"><link rel="apple-touch-icon" href="cover.jpg"><link rel="manifest" href="manifest.json"></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/51/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:29.75%;top:4.052083333333333%;width:29.125%;height:.484375%" data-text="I AM IRAJ MCGRAIN," onclick="showTextTooltip(event,this)" data-translation="EU SOU IRAJ MCGRAIN,"></div><div class="text-hotspot" style="left:41.125%;top:5.354166666666667%;width:43.75%;height:.6979166666666661%" data-text="THE VICE MASTER OF CLAN DZARWI." onclick="showTextTooltip(event,this)" data-translation="O VICE-MESTRE DO CLÃ DZARWI."></div><div class="text-hotspot" style="left:81.5%;top:9.953125%;width:2.125%;height:.08333333333333334%" data-text="4" onclick="showTextTooltip(event,this)" data-translation="4"></div><div class="text-hotspot" style="left:74.125%;top:10.541666666666668%;width:1.5%;height:.0625%" data-text="T" onclick="showTextTooltip(event,this)" data-translation="T"></div><div class="text-hotspot" style="left:61%;top:12.046875%;width:2.5%;height:.10416666666666667%" data-text="#&quot;" onclick="showTextTooltip(event,this)" data-translation="#&quot;"></div><div class="text-hotspot" style="left:28.125%;top:13.640625%;width:43.5%;height:1.3333333333333335%" data-text="FROM WHOM DID YOU HEAR THAT WE HAVE DEFEATED AN ORC HERO?" onclick="showTextTooltip(event,this)" data-translation="DE QUEM VOCÊ OUVIU QUE DERROTAMOS UM HERÓI ORC?" data-tips="💡 A expressão **&quot;FROM WHOM&quot;** é usada para indicar a origem de uma informação ou ação. Em inglês formal, é comum usar &quot;whom&quot; após preposições. - **From whom** did you borrow the book? - **To whom** should I address the letter?"></div><div class="text-hotspot" style="left:62.74999999999999%;top:19.359375%;width:23%;height:.6927083333333334%" data-text="... I DEDUCED IT." onclick="showTextTooltip(event,this)" data-translation="... EU DEDUZI."></div><div class="text-hotspot" style="left:54.87499999999999%;top:26.140625%;width:26.125%;height:.4322916666666667%" data-text="DEDUCED? EXPLAIN." onclick="showTextTooltip(event,this)" data-translation="DEDUZIU? EXPLIQUE."></div><div class="text-hotspot" style="left:17.75%;top:30.859375%;width:64.125%;height:1.984375000000007%" data-text="I WAS CURIOUS WHY A HUGE CLAN LIKE YOURS WOULD DESCEND TO THE THIRD FLOOR TO PLACE THE ORC COLONY UNDER YOUR CONTROL." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA CURIOSO POR QUE UM CLÃ ENORME COMO O SEU DESCERIA AO TERCEIRO ANDAR PARA COLOCAR A COLÔNIA ORC SOB SEU CONTROLE." data-tips="💡 A estrutura **&quot;WHY... WOULD DESCEND&quot;** indica uma ação hipotética ou especulativa. O uso de &quot;would&quot; sugere dúvida ou curiosidade sobre a razão de uma ação. - Why **would** he leave so early? - Why **would** they choose that option?"></div><div class="text-hotspot" style="left:19.125%;top:43.854166666666664%;width:61.875%;height:1.7291666666666667%" data-text="YOU WOULDN'T HAVE BROUGHT AS MANY SUPPLIES AND CONSUMABLES IF YOUR OBJECTIVE HERE WAS TO SLAY SOME ELITE ORC WARRIORS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO TERIA TRAZIDO TANTOS SUPRIMENTOS E CONSUMÍVEIS SE SEU OBJETIVO AQUI FOSSE APENAS MATAR ALGUNS GUERREIROS ORCS DE ELITE." data-tips="💡 O uso de &quot;IF&quot; aqui introduz uma **condicional**. A frase sugere que a ação de trazer muitos suprimentos só faz sentido se a condição (objetivo de matar guerreiros de elite) não for verdadeira. - You wouldn't go there **if** it was dangerous. - She wouldn't buy that **if** it wasn't necessary."></div><div class="text-hotspot" style="left:23.75%;top:53.822916666666664%;width:52.37500000000001%;height:.8333333333333334%" data-text="THERE HAD TO BE AN ULTERIOR MOTIVE." onclick="showTextTooltip(event,this)" data-translation="TINHA QUE HAVER UM MOTIVO ULTERIOR." data-tips="💡 **&quot;THERE HAD TO BE&quot;** sugere uma conclusão lógica ou inevitável. É uma forma de afirmar que algo era necessário ou esperado. - **There had to be** a reason for his actions. - **There had to be** another way to solve the problem."></div><div class="text-hotspot" style="left:29.25%;top:60.14583333333333%;width:40.625%;height:.5416666666666667%" data-text="TIER-5 MONSTER ORC HERO." onclick="showTextTooltip(event,this)" data-translation="HERÓI ORC MONSTRO DE NÍVEL 5."></div><div class="text-hotspot" style="left:14.875%;top:71.13020833333333%;width:54.25%;height:1.484375%" data-text="IT CAN BE SUMMONED BY OFFERING 777 MANA STONES DROPPED BY ELITE ORC WARRIORS ON THE ALTAR IN THE CENTER OF THE COLONY." onclick="showTextTooltip(event,this)" data-translation="ELE PODE SER INVOCADO OFERECENDO 777 PEDRAS DE MANA DEIXADAS POR GUERREIROS ORCS DE ELITE NO ALTAR NO CENTRO DA COLÔNIA." data-tips="💡 A frase **&quot;IT CAN BE SUMMONED BY&quot;** usa a voz passiva para destacar a ação de invocar, sem focar em quem está invocando. Isso é comum quando o sujeito não é importante ou é desconhecido. - The cake **can be made by** following this recipe. - The book **can be borrowed by** anyone with a library card."></div><div class="text-hotspot" style="left:47.875%;top:72.89583333333334%;width:40%;height:.7864583333333333%" data-text="THIS MONSTER IS A HIDDEN BOSS IN THAT SENSE." onclick="showTextTooltip(event,this)" data-translation="ESSE MONSTRO É UM CHEFE OCULTO NESSE SENTIDO." data-tips="💡 'In that sense' é um conector que ajuda a explicar ou clarificar uma declaração anterior, semelhante a 'nesse sentido' em português."></div><div class="text-hotspot" style="left:1.625%;top:78.83333333333333%;width:77.125%;height:4.390625%" data-text="8 THEY PROBABLY HAD BROUGHT THAT MUCH SUPPLY WITH THEM... JUST IN CASE THEY ENCOUNTER THE ORC LORD, WHICH APPEARS EXTREMELY RARELY." onclick="showTextTooltip(event,this)" data-translation="8 ELES PROVAVELMENTE TROUXERAM TANTOS SUPRIMENTOS COM ELES... APENAS NO CASO DE ENCONTRAREM O SENHOR ORC, QUE APARECE EXTREMAMENTE RARAMENTE."></div><div class="text-hotspot" style="left:9.75%;top:90.05208333333333%;width:28.000000000000004%;height:.7239583333333333%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:26%;top:92.78125%;width:4.25%;height:.17708333333333331%" data-text="#11" onclick="showTextTooltip(event,this)" data-translation="#11"></div><div class="text-hotspot" style="left:23.125%;top:93.47916666666667%;width:45.125%;height:1.7239583333333333%" data-text="I TAKE IT THAT YOU DIDN'T ENCOUNTER THE ORC LORD, SINCE YOU STILL HAVE SOME LEFTOVER SUPPLIES?" onclick="showTextTooltip(event,this)" data-translation="IMAGINO QUE VOCÊ NÃO ENCONTROU O SENHOR ORC, JÁ QUE AINDA TEM ALGUNS SUPRIMENTOS SOBRANDO?" data-tips="💡 **&quot;I TAKE IT THAT&quot;** é uma expressão que significa &quot;Eu imagino que&quot; ou &quot;Eu suponho que&quot;. É usada para indicar uma suposição baseada em evidências ou contexto. - **I take it that** you're the new manager? - **I take it that** you've already met our team."></div><div class="text-hotspot" style="left:55.50000000000001%;top:99.46875%;width:27.624999999999993%;height:.4270833333333286%" data-text="HA. TO THINK YOU" onclick="showTextTooltip(event,this)" data-translation="HA. PENSAR QUE VOCÊ"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/51/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:50.375%;top:.005208333333333334%;width:38.125%;height:.6770833333333334%" data-text="HA. TO THINK YOU COULD FIGURE THAT OUT AS WELL." data-translation="HA. PENSAR QUE VOCÊ PODERIA DESCOBRIR ISSO TAMBÉM." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **&quot;TO THINK&quot;** é usada aqui para expressar surpresa ou admiração sobre algo que foi descoberto ou realizado. - **To think** he finished the marathon in record time! - **To think** they solved the puzzle so quickly!"></div><div class="text-hotspot" style="left:25%;top:5.828125%;width:49.875%;height:.953125%" data-text="ALRIGHT, THEN PLEASE CONVINCE ME AS TO WHY WE NEED YOU." data-translation="CERTO, ENTÃO POR FAVOR ME CONVENÇA POR QUE PRECISAMOS DE VOCÊ." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;AS TO WHY&quot;** é uma forma de introduzir uma explicação ou razão. É uma construção mais formal para &quot;por que&quot;. - Can you explain **as to why** this happened? - I'm curious **as to why** they left early."></div><div class="text-hotspot" style="left:23.375%;top:16.046875%;width:53.25%;height:1.1510416666666667%" data-text="I AM A BARBARIAN WITH IMMORTALITY IMPRINT." data-translation="EU SOU UM BÁRBARO COM IMPRESSÃO DE IMORTALIDADE." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;WITH IMMORTALITY IMPRINT&quot;** usa &quot;with&quot; para indicar posse ou característica associada. Isso é comum para descrever atributos. - A house **with a beautiful garden**. - A car **with tinted windows**."></div><div class="text-hotspot" style="left:13.625000000000002%;top:24.932291666666668%;width:49.125%;height:1.2031249999999964%" data-text="I'VE CONSUMED ESSENCES OF THE VAMPIRE, AND THE GUARDIAN OF THE RIFT AT THAT..." data-translation="CONSUMI ESSÊNCIAS DO VAMPIRO, E DO GUARDIÃO DA FENDA AINDA POR CIMA..." onclick="showTextTooltip(event,this)" data-tips="💡 'At that' é uma expressão que enfatiza algo mencionado anteriormente, como 'ainda por cima' em português."></div><div class="text-hotspot" style="left:35.5%;top:35.13541666666667%;width:50.125%;height:1.21875%" data-text="...AND OF UNDEAD GOLEM, WITH PAIN TOLERANCE PROPERTY." data-translation="...E DO GOLEM ZUMBI, COM PROPRIEDADE DE TOLERÂNCIA À DOR." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.25%;top:44.25%;width:34.625%;height:.6822916666666666%" data-text="THAT EXPLANATION SUFFICES." data-translation="ESSA EXPLICAÇÃO É SUFICIENTE." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:10.375%;top:45.588541666666664%;width:61.375%;height:1.203125%" data-text="SO YOU CAN KEEP BATTLING WHILE TAKING POTIONS TO TEND TO YOUR WOUNDS." data-translation="ENTÃO VOCÊ PODE CONTINUAR LUTANDO ENQUANTO TOMA POÇÕES PARA CUIDAR DOS SEUS FERIMENTOS." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **&quot;TO TEND TO YOUR WOUNDS&quot;** significa cuidar dos seus ferimentos. &quot;Tend to&quot; é um phrasal verb que significa cuidar ou tratar de algo. - **Tend to** the garden regularly. - She needs to **tend to** her responsibilities."></div><div class="text-hotspot" style="left:82.875%;top:52.45833333333333%;width:9.375%;height:.3489583333333333%" data-text="W" data-translation="W" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.375%;top:53.71875000000001%;width:25.25%;height:.4270833333333333%" data-text="ANYTHING ELSE?" data-translation="ALGO MAIS?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:62.5%;top:55.85416666666667%;width:14.124999999999998%;height:.17708333333333331%" data-text="...NO." data-translation="...NÃO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:26.875%;top:60.421875%;width:47.25%;height:1.2135416666666665%" data-text="HMM. YOU'RE CERTAINLY NOT TOO SHABBY FOR A THIRD FLOOR ADVENTURER." data-translation="HMM. VOCÊ CERTAMENTE NÃO É NADA MAL PARA UM AVENTUREIRO DO TERCEIRO ANDAR." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;NOT TOO SHABBY&quot;** é uma expressão coloquial que significa &quot;não é ruim&quot; ou &quot;é até bom&quot;. É usada para elogiar de forma moderada. - Her performance was **not too shabby**. - The food here is **not too shabby**."></div><div class="text-hotspot" style="left:27.500000000000004%;top:66.03125%;width:30.249999999999996%;height:.7135416666666572%" data-text="AS A MATTER OF FACT," data-translation="NA VERDADE," onclick="showTextTooltip(event,this)" data-tips="💡 'As a matter of fact' é um conector usado para introduzir uma informação que reforça ou contradiz algo dito anteriormente, equivalente a 'na verdade'."></div><div class="text-hotspot" style="left:42.75%;top:67.0625%;width:37.875%;height:1.21875%" data-text="COMPARED TO THE TWO WARRIORS WE HAVE LEFT AMONG US..." data-translation="COMPARADO AOS DOIS GUERREIROS QUE NOS RESTAM..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.125%;top:72.68229166666667%;width:53.5%;height:1.0364583333333333%" data-text="... YOU'D MAKE A FANTASTIC DEFENDER!" data-translation="... VOCÊ SERIA UM DEFENSOR FANTÁSTICO!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:30.125%;top:85.984375%;width:41.25%;height:.6822916666666714%" data-text="BJORN YANDEL. I ACCEPT YOUR OFFER." data-translation="BJORN YANDEL. ACEITO SUA OFERTA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.5%;top:95.30729166666667%;width:51.74999999999999%;height:1.2291666666666665%" data-text="V-VICE MASTER? BUT THAT ESSENCE WAS SPECIFICALLY REQUESTED BY HOUSE--" data-translation="V-VICE-MESTRE? MAS ESSA ESSÊNCIA FOI ESPECIFICAMENTE SOLICITADA PELA CASA--" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:49%;top:96.94270833333334%;width:31.25%;height:.21875000000000003%" data-text="ENOUGH!" data-translation="CHEGA!" onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/51/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:17.75%;top:2.1875%;width:4.25%;height:.17708333333333331%" data-text="A" data-translation="A" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32%;top:2.833333333333333%;width:46.875%;height:1.208333333333334%" data-text="WE CAN TELL THEM WE WERE UNABLE TO ACQUIRE THE ESSENCE." data-translation="PODEMOS DIZER A ELES QUE NÃO CONSEGUIMOS ADQUIRIR A ESSÊNCIA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:13.375%;top:8.260416666666668%;width:61.75000000000001%;height:1.2135416666666665%" data-text="IF WE CAN SAVE ONE MORE MEMBER OF OUR CLAN AT THE EXPENSE OF A SINGLE ESSENCE, THEN IT'S WORTH IT." data-translation="SE PUDERMOS SALVAR MAIS UM MEMBRO DO NOSSO CLÃ À CUSTA DE UMA ÚNICA ESSÊNCIA, ENTÃO VALE A PENA." onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura **&quot;IF... THEN IT'S WORTH IT&quot;** é uma condicional que expressa uma relação de causa e efeito. Se a condição for verdadeira, então a ação é justificada. - **If** it helps you learn, **then it's worth it**. - **If** we succeed, **then it's worth it**."></div><div class="text-hotspot" style="left:50.5%;top:13.838541666666668%;width:35.5%;height:.7916666666666667%" data-text="CLAMOR" data-translation="CLAMOR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:55.00000000000001%;top:16.526041666666664%;width:11.125%;height:.38020833333333337%" data-text="D" data-translation="D" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:5.375%;top:17.552083333333332%;width:36%;height:.7239583333333333%" data-text="CLAMOR" data-translation="CLAMOR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17.375%;top:22.390625%;width:65.5%;height:.8541666666666666%" data-text="KARLSTEIN! BRING THE ESSENCE HERE!" data-translation="KARLSTEIN! TRAGA A ESSÊNCIA AQUI!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.625%;top:32.546875%;width:41.375%;height:1.1510416666666667%" data-text="GOOD. THAT TAKES CARE OF THE FIRST OBSTACLE!" data-translation="BOM. ISSO CUIDA DO PRIMEIRO OBSTÁCULO!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:4.375%;top:42.041666666666664%;width:90.25%;height:3.427083333333343%" data-text="SURVIVING THE GAME AS A BARBARIAN ART | MIDNIGHT STUDIO ADAPTATION | Han tae-su ORIGINAL STORY | Jung Yoon-kang" data-translation="SOBREVIVENDO AO JOGO COMO UM BÁRBARO ARTE | ADAPTAÇÃO DO ESTÚDIO MIDNIGHT | História original de Han tae-su | Jung Yoon-kang" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:46.75%;top:46.052083333333336%;width:6.5%;height:.19791666666666669%" data-text="51" data-translation="51" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.5%;top:55.84895833333333%;width:48.625%;height:1.2291666666666665%" data-text="THERE ARE THREE ORC HEROES THAT CAN BE SUMMONED BY OFFERING MANA STONES ON THE ALTAR." data-translation="HÁ TRÊS HERÓIS ORCS QUE PODEM SER INVOCADOS OFERECENDO PEDRAS DE MANA NO ALTAR." onclick="showTextTooltip(event,this)" data-tips="💡 'Can be summoned by offering' usa a voz passiva para indicar que a ação de invocar é feita através da oferta de algo, comum em contextos de jogos."></div><div class="text-hotspot" style="left:12%;top:65.69270833333334%;width:44.25%;height:.6979166666666666%" data-text="AND EACH OF THEM IS AN ELITE BOSS, WITH A GIVEN NAME." data-translation="E CADA UM DELES É UM CHEFE DE ELITE, COM UM NOME PRÓPRIO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.75%;top:66.96875%;width:47.25%;height:.9583333333333333%" data-text="IN OTHER WORDS, THEY ARE UNIQUE MONSTERS, WITH QUITE ANNOYING SETS OF ABILITIES." data-translation="EM OUTRAS PALAVRAS, ELES SÃO MONSTROS ÚNICOS, COM CONJUNTOS DE HABILIDADES BEM IRRITANTES." onclick="showTextTooltip(event,this)" data-tips="💡 'In other words' é um conector usado para reformular ou clarificar algo, equivalente a 'em outras palavras' em português."></div><div class="text-hotspot" style="left:19.5%;top:72.08854166666666%;width:60.75000000000001%;height:.9739583333333333%" data-text="THAT IS WHY A BAND OF ADVENTURERS IS REQUIRED TO HUNT AN ORC HERO DOWN, DESPITE THEIR TIER." data-translation="É POR ISSO QUE UM GRUPO DE AVENTUREIROS É NECESSÁRIO PARA CAÇAR UM HERÓI ORC, INDEPENDENTEMENTE DO SEU NÍVEL." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;THAT IS WHY&quot;** é uma expressão usada para apresentar a razão ou justificativa para algo mencionado anteriormente. - **That is why** we need to prepare. - **That is why** he left early."></div><div class="text-hotspot" style="left:18.25%;top:85.390625%;width:63.375%;height:1.2239583333333286%" data-text="THESE ORC HEROES, ALSO KNOWN AS THE THREE ORC BROTHERS, DROP ESSENCES OF DIFFERENT COLORS DEPENDING ON WHICH ONE IT IS." data-translation="ESSES HERÓIS ORCS, TAMBÉM CONHECIDOS COMO OS TRÊS IRMÃOS ORCS, DEIXAM ESSÊNCIAS DE CORES DIFERENTES DEPENDENDO DE QUAL DELES É." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.875%;top:90.97395833333334%;width:59%;height:2.1041666666666665%" data-text="אשון" data-translation="אשון" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17%;top:94.56770833333333%;width:46.75%;height:.6927083333333286%" data-text="DENISH DROPS THE RED ESSENCE, CONTAINING CRY OF FRENZY." data-translation="DENISH DEIXA A ESSÊNCIA V
