<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>49</title><link rel="icon" href="cover.jpg"><link rel="apple-touch-icon" href="cover.jpg"><link rel="manifest" href="manifest.json"></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:21.375%;top:4.65625%;width:56.49999999999999%;height:.7760416666666666%" data-text="THE LORD OF THE FLOOR." onclick="showTextTooltip(event,this)" data-translation="O SENHOR DO ANDAR."></div><div class="text-hotspot" style="left:21.75%;top:9.1875%;width:56.125%;height:.953125%" data-text="IT IS A TYPE OF FIELD BOSS, SO TO SPEAK." onclick="showTextTooltip(event,this)" data-translation="É UM TIPO DE CHEFE DE CAMPO, POR ASSIM DIZER." data-tips="💡 &quot;Por assim dizer&quot; é uma expressão usada para indicar que algo não deve ser entendido de forma literal. Em inglês, **&quot;so to speak&quot;** tem o mesmo propósito, sugerindo que a frase anterior é uma maneira figurada de falar. - &quot;He's the king of the office, so to speak.&quot; - &quot;She's a walking dictionary, so to speak.&quot;"></div><div class="text-hotspot" style="left:14.374999999999998%;top:24.578125%;width:46.25%;height:.6927083333333334%" data-text="IT WAS SPECIFICALLY REFERRED TO IN-GAME AS THE FLOOR MASTER," onclick="showTextTooltip(event,this)" data-translation="FOI ESPECIFICAMENTE REFERIDO NO JOGO COMO O MESTRE DO ANDAR," data-tips="💡 **&quot;Referred to&quot;** é uma estrutura comum em inglês que significa &quot;chamado&quot; ou &quot;referido como&quot;. É usado para indicar como algo é conhecido ou chamado em um contexto específico. - &quot;The city is referred to as the Big Apple.&quot; - &quot;He's referred to as the best player on the team.&quot;"></div><div class="text-hotspot" style="left:36.375%;top:26.067708333333332%;width:45.625%;height:.703125%" data-text="AND EACH FLOOR HAD A DIFFERENT, UNIQUE LORD OF THE FLOOR." onclick="showTextTooltip(event,this)" data-translation="E CADA ANDAR TINHA UM SENHOR DO ANDAR DIFERENTE E ÚNICO."></div><div class="text-hotspot" style="left:14.000000000000002%;top:35.765625%;width:40.75%;height:.7864583333333333%" data-text="TH-THE LORD OF THE FLOORRRRR?" onclick="showTextTooltip(event,this)" data-translation="O-O SENHOR DO ANDARRRR?"></div><div class="text-hotspot" style="left:31.874999999999996%;top:36.859375%;width:57.62500000000001%;height:1.3958333333333333%" data-text="STOP SCARING MEEE! I HEARD THERE WAS NO LORD ON THE THIRD FLOORRRR!" onclick="showTextTooltip(event,this)" data-translation="PARE DE ME ASSUSTAR! EU OUVI QUE NÃO HAVIA SENHOR NO TERCEIRO ANDARRRR!"></div><div class="text-hotspot" style="left:21.125%;top:45.04166666666667%;width:63.375%;height:1.4739583333333215%" data-text="THERE ACTUALLY IS. IT'S JUST THAT CONDITIONS OF SUMMONING IT HAD BEEN UNKNOWN TO THE GENERAL PUBLIC." onclick="showTextTooltip(event,this)" data-translation="NA VERDADE, HÁ. É SÓ QUE AS CONDIÇÕES PARA INVOCÁ-LO ERAM DESCONHECIDAS DO PÚBLICO GERAL." data-tips="💡 **&quot;It's just that&quot;** é uma expressão usada para suavizar uma afirmação ou explicar uma situação. Pode ser traduzida como &quot;é só que&quot; em português. - &quot;I like the idea, it's just that it's too expensive.&quot; - &quot;We could go out, it's just that I'm really tired.&quot;"></div><div class="text-hotspot" style="left:17.5%;top:50.739583333333336%;width:67.875%;height:1.4739583333333286%" data-text="BECAUSE IT WON'T END WITH A FEW CASUALTIES IF SOME LUNATIC DELIBERATELY SUMMONS THIS BEAST." onclick="showTextTooltip(event,this)" data-translation="PORQUE NÃO VAI TERMINAR COM ALGUMAS BAIXAS SE ALGUM LOUCO INVOCAR DELIBERADAMENTE ESSA BESTA." data-tips="💡 **&quot;Casualties&quot;** refere-se a pessoas que são feridas ou mortas em um acidente ou conflito. Não é um cognato direto de &quot;casualidades&quot; em português, que tem um significado diferente. - &quot;The battle resulted in many casualties.&quot; - &quot;There were no casualties in the accident.&quot;"></div><div class="text-hotspot" style="left:25.124999999999996%;top:61.802083333333336%;width:49.25%;height:1.15625%" data-text="THE LORD OF THE THIRD FLOOR IS RIAKIS, THE LORD OF CHAOS" onclick="showTextTooltip(event,this)" data-translation="O SENHOR DO TERCEIRO ANDAR É RIAKIS, O SENHOR DO CAOS"></div><div class="text-hotspot" style="left:12.375%;top:70.18229166666666%;width:74.125%;height:.9479166666666667%" data-text="TAKEOVER PROCESS HAS BEGUN. ALL MONSTERS ON THIS FLOOR GO INTO HIDING IN THE STATE OF CHAOS." onclick="showTextTooltip(event,this)" data-translation="O PROCESSO DE TOMADA DE POSSE COMEÇOU. TODOS OS MONSTROS NESTE ANDAR SE ESCONDEM NO ESTADO DE CAOS." data-tips="💡 'Takeover process' refere-se ao processo de tomada de controle. 'Takeover' é frequentemente usado em contextos de negócios ou conflitos."></div><div class="text-hotspot" style="left:37.625%;top:74.4375%;width:4.625%;height:.22395833333333334%" data-text="18" onclick="showTextTooltip(event,this)" data-translation="18"></div><div class="text-hotspot" style="left:18.375%;top:77.51041666666667%;width:36.75%;height:.9375%" data-text="THIS MONSTER AFFECTS THE ENTIRE THIRD FLOOR..." onclick="showTextTooltip(event,this)" data-translation="ESSE MONSTRO AFETA TODO O TERCEIRO ANDAR..."></div><div class="text-hotspot" style="left:39.75%;top:78.859375%;width:45%;height:1.4583333333333286%" data-text="AND ROAMS AROUND WITHIN THE LABYRINTH, KILLING EVERYTHING IN SIGHT, UNTIL IT DIES." onclick="showTextTooltip(event,this)" data-translation="E VAGA PELO LABIRINTO, MATANDO TUDO QUE VÊ, ATÉ MORRER." data-tips="💡 **&quot;Roams around&quot;** é um phrasal verb que significa vagar ou perambular sem destino específico. É usado para descrever movimento livre e sem direção fixa. - &quot;The dog roams around the neighborhood every day.&quot; - &quot;He likes to roam around the city when he's bored.&quot;"></div><div class="text-hotspot" style="left:19%;top:84.77604166666667%;width:62%;height:.9479166666666667%" data-text="THE PORTAL IS TEMPORARILY DEACTIVATED DUE TO THE TAKEOVER PROCESS." onclick="showTextTooltip(event,this)" data-translation="O PORTAL ESTÁ TEMPORARIAMENTE DESATIVADO DEVIDO AO PROCESSO DE TOMADA DE POSSE."></div><div class="text-hotspot" style="left:15.125%;top:93.296875%;width:53.75%;height:1.2239583333333286%" data-text="MOVEMENT BETWEEN FLOORS IS ALSO DISABLED IN THE MEANTIME. WE CAN'T EVEN FLEE TO OTHER FLOORS." onclick="showTextTooltip(event,this)" data-translation="O MOVIMENTO ENTRE OS ANDARES TAMBÉM ESTÁ DESABILITADO POR ENQUANTO. NÃO PODEMOS NEM FUGIR PARA OUTROS ANDARES." data-tips="💡 **&quot;In the meantime&quot;** é uma expressão que significa &quot;enquanto isso&quot; ou &quot;nesse meio tempo&quot;, usada para indicar o que acontece durante um intervalo de tempo. - &quot;The repairs will take a week. In the meantime, you can use my car.&quot; - &quot;Dinner will be ready in an hour. In the meantime, let's watch some TV.&quot;"></div><div class="text-hotspot" style="left:42.875%;top:94.86979166666667%;width:41.625%;height:1.2239583333333286%" data-text="THERE'S A CHANCE THAT EVERY SINGLE ADVENTURER ON THE THIRD FLOOR WILL PERISH." onclick="showTextTooltip(event,this)" data-translation="HÁ UMA CHANCE DE QUE TODOS OS AVENTUREIROS NO TERCEIRO ANDAR PEREÇAM." data-tips="💡 **&quot;Perish&quot;** é um verbo que significa morrer, especialmente de forma violenta ou súbita. É mais formal que &quot;die&quot;. - &quot;Many fish perished in the polluted river.&quot; - &quot;Without water, the plants will perish.&quot;"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:9.875%;top:1.4479166666666665%;width:41.5%;height:.16666666666666669%" data-text="WH-WHATTTT?!" onclick="showTextTooltip(event,this)" data-translation="O-O QUÊÊÊ?!"></div><div class="text-hotspot" style="left:29.25%;top:2.4010416666666665%;width:54.75%;height:.96875%" data-text="WHY DID THE LORD OF THE FLOOR HAVE TO APPEAR NOW THENNNNNN?" onclick="showTextTooltip(event,this)" data-translation="POR QUE O SENHOR DO ANDAR TINHA QUE APARECER AGORA ENTÃOOOO?"></div><div class="text-hotspot" style="left:91.5%;top:8.848958333333332%;width:1.5%;height:.057291666666666664%" data-text="о" onclick="showTextTooltip(event,this)" data-translation="о"></div><div class="text-hotspot" style="left:83.75%;top:8.880208333333334%;width:1.5%;height:.052083333333333336%" data-text="о" onclick="showTextTooltip(event,this)" data-translation="о"></div><div class="text-hotspot" style="left:33%;top:11.0625%;width:34.375%;height:.9583333333333333%" data-text="TH-THAT'S MOST LIKELY BECAUSE OF US." onclick="showTextTooltip(event,this)" data-translation="I-ISSO É PROVAVELMENTE POR NOSSA CAUSA." data-tips="💡 **&quot;Most likely&quot;** é uma expressão usada para indicar que algo é muito provável. É equivalente a &quot;provavelmente&quot; em português. - &quot;She will most likely arrive late.&quot; - &quot;It's most likely going to rain today.&quot;"></div><div class="text-hotspot" style="left:16.125%;top:16.197916666666668%;width:51.37500000000001%;height:1.2239583333333333%" data-text="REMEMBER HOW WE BURNED A FEW CORPSES AT THE WITCH'S HUT BEFORE?" onclick="showTextTooltip(event,this)" data-translation="LEMBRA COMO QUEIMAMOS ALGUNS CORPOS NA CABANA DA BRUXA ANTES?"></div><div class="text-hotspot" style="left:42.375%;top:17.9375%;width:44.375%;height:.9479166666666667%" data-text="THAT'S ONE OF THE CONDITIONS TO SUMMON THE LORD." onclick="showTextTooltip(event,this)" data-translation="ESSA É UMA DAS CONDIÇÕES PARA INVOCAR O SENHOR."></div><div class="text-hotspot" style="left:28.999999999999996%;top:25.515624999999996%;width:49.75%;height:.22916666666666666%" data-text="WH-WHATTTT?!" onclick="showTextTooltip(event,this)" data-translation="O-O QUÊÊÊ?!"></div><div class="text-hotspot" style="left:17.5%;top:31.296875%;width:44.75%;height:.9479166666666667%" data-text="BUT THE LAST TIME IT WAS SUMMONED WAS MORE THAN TEN YEARS AGO, SUPPOSEDLY." onclick="showTextTooltip(event,this)" data-translation="MAS A ÚLTIMA VEZ QUE FOI INVOCADO FOI HÁ MAIS DE DEZ ANOS, SUPONHAMOS."></div><div class="text-hotspot" style="left:36.375%;top:33.09375%;width:45.75%;height:.9427083333333334%" data-text="SO I THOUGHT BURNING THREE MORE BODIES WASN'T GOING TO BE A PROBLEM." onclick="showTextTooltip(event,this)" data-translation="ENTÃO EU PENSEI QUE QUEIMAR MAIS TRÊS CORPOS NÃO SERIA UM PROBLEMA."></div><div class="text-hotspot" style="left:1.625%;top:34.35416666666667%;width:53.87499999999999%;height:1.4010416666666665%" data-text="SWEAT" onclick="showTextTooltip(event,this)" data-translation="SUOR"></div><div class="text-hotspot" style="left:30.125%;top:41.401041666666664%;width:41.75%;height:1.1927083333333286%" data-text="WHO COULD HAVE OFFERED FOUR SACRIFICES TO THE FIRE BEFORE ME...?" onclick="showTextTooltip(event,this)" data-translation="QUEM PODERIA TER OFERECIDO QUATRO SACRIFÍCIOS AO FOGO ANTES DE MIM...?"></div><div class="text-hotspot" style="left:15.5%;top:47.28645833333333%;width:50%;height:1.0885416666666714%" data-text="BJORN! DO YOU KNOW WHAT YOU HAVE DONNNNNNNE?!" onclick="showTextTooltip(event,this)" data-translation="BJORN! VOCÊ SABE O QUE VOCÊ FEZZZZZ?!"></div><div class="text-hotspot" style="left:38.875%;top:48.69791666666667%;width:48.75%;height:1.093749999999993%" data-text="WE'RE ALL GOING TO DIE BECAUSE OF YOUUUUUU!!" onclick="showTextTooltip(event,this)" data-translation="VAMOS TODOS MORRER POR SUA CAUSAAAA!!"></div><div class="text-hotspot" style="left:12.875%;top:60.895833333333336%;width:43.875%;height:.6875%" data-text="MAKE SURE YOU DON'T TELL THIS TO ANYBODY." onclick="showTextTooltip(event,this)" data-translation="CERTIFIQUE-SE DE NÃO CONTAR ISSO A NINGUÉM." data-tips="💡 **&quot;Make sure&quot;** é uma expressão usada para garantir que algo seja feito ou verificado. Pode ser traduzida como &quot;certifique-se de&quot;. - &quot;Make sure you lock the door before leaving.&quot; - &quot;Make sure to check your work for errors.&quot;"></div><div class="text-hotspot" style="left:34.875%;top:62.526041666666664%;width:52.875%;height:1.2135416666666714%" data-text="THEY'LL SHRED US APART IF OTHER ADVENTURERS FIND OUT IT'S OUR FAULT." onclick="showTextTooltip(event,this)" data-translation="ELES VÃO NOS DESPEDAÇAR SE OUTROS AVENTUREIROS DESCOBRIREM QUE É NOSSA CULPA." data-tips="💡 **&quot;Find out&quot;** é um phrasal verb que significa descobrir ou ficar sabendo de algo. - &quot;I need to find out who took my book.&quot; - &quot;Did you find out what time the meeting starts?&quot;"></div><div class="text-hotspot" style="left:13.875000000000002%;top:70.13020833333333%;width:68%;height:2.333333333333343%" data-text="WAAAA I'M RUINED BECAUSE OF THAT STUPID BARBARIANNNN!" onclick="showTextTooltip(event,this)" data-translation="WAAAA ESTOU ARRUINADO POR CAUSA DESSE BÁRBARO ESTÚPIDOOOO!"></div><div class="text-hotspot" style="left:21.5%;top:74.36979166666666%;width:57.125%;height:1.4739583333333335%" data-text="AND DIDN'T YOU SAY YOU WERE REALLY GRATEFUL TO ME FROM THE BOTTOM OF YOUR HEART BEFORE?" onclick="showTextTooltip(event,this)" data-translation="E VOCÊ NÃO DISSE QUE ESTAVA REALMENTE GRATO A MIM DO FUNDO DO SEU CORAÇÃO ANTES?" data-tips="💡 **&quot;From the bottom of your heart&quot;** é uma expressão que significa com sinceridade ou profundamente. Em português, é equivalente a &quot;do fundo do coração&quot;. - &quot;I thank you from the bottom of my heart for your help.&quot; - &quot;She apologized from the bottom of her heart.&quot;"></div><div class="text-hotspot" style="left:7.375%;top:80.43229166666667%;width:62.25000000000001%;height:1.484375%" data-text="IT'S POSSIBLE TO LEAVE THIS FOREST EVEN WITHOUT THE NAVIGATOR NOW, SINCE THE FIELD DEBUFF IS ALSO LIFTED." onclick="showTextTooltip(event,this)" data-translation="É POSSÍVEL SAIR DESTA FLORESTA MESMO SEM O NAVEGADOR AGORA, JÁ QUE O DEBUFF DE CAMPO TAMBÉM FOI REMOVIDO." data-tips="💡 'Debuff' é um termo de jogos que se refere a um efeito negativo temporário aplicado a um personagem. Não tem tradução direta, mas é entendido por jogadores."></div><div class="text-hotspot" style="left:45.25%;top:82.30729166666667%;width:45.25%;height:.953125%" data-text="LET'S GET OUT OF THESE WOODS AS SOON AS WE CAN." onclick="showTextTooltip(event,this)" data-translation="VAMOS SAIR DESTAS MATAS ASSIM QUE PUDERMOS."></div><div class="text-hotspot" style="left:48.375%;top:86.515625%;width:10.875%;height:.16666666666666669%" data-text="UGH..." onclick="showTextTooltip(event,this)" data-translation="UGH..."></div><div class="text-hotspot" style="left:92.875%;top:87.65104166666666%;width:4%;height:.08333333333333334%" data-text="88" onclick="showTextTooltip(event,this)" data-translation="88"></div><div class="text-hotspot" style="left:37.125%;top:92.86458333333333%;width:25.25%;height:.18229166666666666%" data-text="WE GO..." onclick="showTextTooltip(event,this)" data-translation="VAMOS..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:24.5%;top:1.3333333333333335%;width:50.74999999999999%;height:.6822916666666666%" data-text="...TO THE ORC COLONY." onclick="showTextTooltip(event,this)" data-translation="...PARA A COLÔNIA ORC."></div><div class="text-hotspot" style="left:3.6249999999999996%;top:16.729166666666668%;width:90%;height:2.7135416666666665%" data-text="SURVIVING THE GAME AS A BARBARIAN" onclick="showTextTooltip(event,this)" data-translation="SOBREVIVENDO AO JOGO COMO UM BÁRBARO"></div><div class="text-hotspot" style="left:29.875%;top:19.708333333333332%;width:40.625%;height:.4479166666666667%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | Han tae-su ORIGINAL STORY | Jung Yoon-kang" onclick="showTextTooltip(event,this)" data-translation="ARTE | MIDNIGHT STUDIO ADAPTAÇÃO | Han tae-su HISTÓRIA ORIGINAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:46.5%;top:20.729166666666668%;width:7.375%;height:.23958333333333331%" data-text="49" onclick="showTextTooltip(event,this)" data-translation="49"></div><div class="text-hotspot" style="left:31.25%;top:28.515625%;width:37.125%;height:.23958333333333331%" data-text="CLAN DZARWI." onclick="showTextTooltip(event,this)" data-translation="CLÃ DZARWI."></div><div class="text-hotspot" style="left:17.75%;top:35.239583333333336%;width:51.74999999999999%;height:.953125%" data-text="ACCORDING TO THE DWARF, IT IS A MASSIVE CLAN THAT IS ACTIVE ON FLOORS SIX AND ABOVE..." onclick="showTextTooltip(event,this)" data-translation="SEGUNDO O ANÃO, É UM CLÃ MASSIVO QUE ESTÁ ATIVO NO SEXTO ANDAR E ACIMA..." data-tips="💡 **&quot;According to&quot;** é uma expressão usada para indicar a fonte de uma informação. Equivale a &quot;de acordo com&quot; em português. - &quot;According to the weather forecast, it will rain tomorrow.&quot; - &quot;According to the teacher, the exam will be next week.&quot;"></div><div class="text-hotspot" style="left:47.75%;top:36.86979166666667%;width:40.625%;height:.6927083333333334%" data-text="CONSISTING OF MORE THAN A HUNDRED MEMBERS." onclick="showTextTooltip(event,this)" data-translation="COMPOSTO POR MAIS DE CEM MEMBROS."></div><div class="text-hotspot" style="left:19.75%;top:41.64583333333333%;width:35.75%;height:.9479166666666667%" data-text="ENCOUNTERING RIAKIS RIGHT NOW IS A GUARANTEED DEATH." onclick="showTextTooltip(event,this)" data-translation="ENCONTRAR RIAKIS AGORA É MORTE CERTA." data-tips="💡 **&quot;Guaranteed&quot;** significa assegurado ou certo. Em inglês, é usado para enfatizar que algo vai acontecer com certeza. - &quot;A good education is not guaranteed.&quot; - &quot;Success is never guaranteed.&quot;"></div><div class="text-hotspot" style="left:40%;top:43.010416666666664%;width:48%;height:.9791666666666667%" data-text="IN ORDER TO INCREASE OUR CHANCES OF SURVIVAL AS MUCH AS WE CAN..." onclick="showTextTooltip(event,this)" data-translation="PARA AUMENTAR NOSSAS CHANCES DE SOBREVIVÊNCIA O MÁXIMO QUE PUDERMOS..." data-tips="💡 'In order to' é uma estrutura usada para indicar propósito ou intenção, equivalente a 'para' ou 'a fim de' em português."></div><div class="text-hotspot" style="left:30.875000000000004%;top:52%;width:37.25%;height:.5572916666666667%" data-text="...WE NEED TO JOIN THEM!" onclick="showTextTooltip(event,this)" data-translation="...PRECISAMOS NOS JUNTAR A ELES!"></div><div class="text-hotspot" style="left:40.5%;top:60.96875000000001%;width:44.25%;height:.9427083333333334%" data-text="I DOUBT THE ENTIRETY OF THE CLAN WOULD BE ON THE THIRD FLOOR..." onclick="showTextTooltip(event,this)" data-translation="DUVIDO QUE TODO O CLÃ ESTEJA NO TERCEIRO ANDAR..."></div><div class="text-hotspot" style="left:20.125%;top:62.88541666666667%;width:48.625%;height:1.1979166666666572%" data-text="BUT THEY MUST HAVE DISPATCHED AT LEAST TEN TEAMS IN ORDER TO CONTROL THE HUNTING AREA." onclick="showTextTooltip(event,this)" data-translation="MAS ELES DEVEM TER DESPACHADO PELO MENOS DEZ EQUIPES PARA CONTROLAR A ÁREA DE CAÇA."></div><div class="text-hotspot" style="left:0;top:65.02604166666667%;width:59.375%;height:1.859375%" data-text="MURMUR MURMUR" onclick="showTextTooltip(event,this)" data-translation="MURMÚRIO MURMÚRIO"></div><div class="text-hotspot" style="left:15%;top:70.98958333333333%;width:38.625%;height:.6875%" data-text="THERE ARE SO MANY PEOPPPPPLE..." onclick="showTextTooltip(event,this)" data-translation="HÁ TANTAS PESSOASSSSS..."></div><div class="text-hotspot" style="left:0;top:76.57291666666667%;width:85.875%;height:2.9375%" data-text="SHOUT EVERYONE, PLEASE CALM DOWN AND FOLLOW OUR DIRECTIONS!!" onclick="showTextTooltip(event,this)" data-translation="GRITO TODOS, POR FAVOR, ACALMEM-SE E SIGAM NOSSAS INSTRUÇÕES!!" data-tips="💡 &quot;CALM DOWN&quot; é uma expressão comum usada para pedir que alguém se acalme. - **Calm down** é frequentemente usado em situações de tensão. Exemplo: &quot;Please **calm down** before we continue the discussion.&quot; - Outra forma de dizer isso seria &quot;please relax&quot;."></div><div class="text-hotspot" style="left:55.50000000000001%;top:80.84895833333333%;width:41.5%;height:1.2447916666666665%" data-text="SHOUT" onclick="showTextTooltip(event,this)" data-translation="GRITO"></div><div class="text-hotspot" style="left:18.5%;top:93.30729166666667%;width:45.625%;height:1.46875%" data-text="I-I HEARD THERE WAS A HIGH-RANKING MAGE AMONG YOU!" onclick="showTextTooltip(event,this)" data-translation="E-EU OUVI QUE HAVIA UM MAGO DE ALTA PATENTE ENTRE VOCÊS!" data-tips="💡 &quot;HEARD&quot; no passado simples indica que a pessoa ouviu algo anteriormente. - Usamos o passado simples para ações concluídas no passado. Exemplo: &quot;I **heard** a strange noise last night.&quot; - Outra forma de expressar poderia ser &quot;I was told&quot;."></div><div class="text-hotspot" style="left:36.375%;top:95.21875%;width:48.625%;height:1.7864583333333333%" data-text="PLEASE CAST THE DIMENSIONAL DOOR SPELL! WE'LL PAY YOU HANDSOMELY!" onclick="showTextTooltip(event,this)" data-translation="POR FAVOR, LANCE O FEITIÇO DA PORTA DIMENSIONAL! PAGAREMOS BEM!" data-tips="💡 &quot;PAY YOU HANDSOMELY&quot; é uma expressão que significa pagar bem ou generosamente. - Essa expressão é usada para indicar que alguém será bem recompensado. Exemplo: &quot;If you finish the project, we will **pay you handsomely**.&quot;"></div><div class="text-hotspot" style="left:4.75%;top:97.58854166666666%;width:39.5%;height:.8593750000000001%" data-text="CLAMOR" onclick="showTextTooltip(event,this)" data-translation="CLAMOR"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:17.25%;top:2.59375%;width:52.125%;height:1.3489583333333333%" data-text="IT HAS TO BE YOUR DOING! YOU SUMMONED THE LORD OF THE FLOOR, RIGHT?!" onclick="showTextTooltip(event,this)" data-translation="TEM QUE SER SUA CULPA! VOCÊ INVOCOU O SENHOR DO ANDAR, NÃO É?!" data-tips="💡 &quot;IT HAS TO BE&quot; é usado para expressar certeza sobre algo. - A estrutura &quot;has to be&quot; indica uma forte convicção. Exemplo: &quot;It **has to be** the right decision.&quot; - Outra forma de expressar poderia ser &quot;it must be&quot;."></div><div class="text-hotspot" style="left:97.75%;top:4.677083333333333%;width:2.125%;height:.078125%" data-text="O" onclick="showTextTooltip(event,this)" data-translation="O"></div><div class="text-hotspot" style="left:2.25%;top:5.473958333333333%;width:44%;height:.9479166666666667%" data-text="CLAMOR" onclick="showTextTooltip(event,this)" data-translation="CLAMOR"></div><div class="text-hotspot" style="left:17.25%;top:7.322916666666666%;width:42.75%;height:.7760416666666666%" data-text="WHAT'S GOING TO HAPPEN TO US?!" onclick="showTextTooltip(event,this)" data-translation="O QUE VAI ACONTECER CONOSCO?!" data-tips="💡 &quot;WHAT'S GOING TO HAPPEN&quot; é usado para perguntar sobre eventos futuros. - Usamos &quot;going to&quot; para falar sobre planos ou previsões. Exemplo: &quot;What's **going to happen** if it rains tomorrow?&quot;"></div><div class="text-hotspot" style="left:24.75%;top:12.630208333333334%;width:51.24999999999999%;height:1.328125%" data-text="YOU'RE A BIG CLAN! PLEASE SAY YOU'RE GOING TO HELP US OUT!!" onclick="showTextTooltip(event,this)" data-translation="VOCÊS SÃO UM GRANDE CLÃ! POR FAVOR, DIGAM QUE VÃO NOS AJUDAR!!" data-tips="💡 &quot;HELP US OUT&quot; é uma expressão que significa ajudar alguém em uma situação. - É uma forma mais informal de pedir ajuda. Exemplo: &quot;Can you **help us out** with the move this weekend?&quot; - Formalmente, poderia ser &quot;assist us&quot;."></div><div class="text-hotspot" style="left:34.5%;top:19.583333333333332%;width:31%;height:.8541666666666666%" data-text="IT'S A COMPLETE CHAOS." onclick="showTextTooltip(event,this)" data-translation="É UM COMPLETO CAOS."></div><div class="text-hotspot" style="left:38.125%;top:21.838541666666668%;width:23.375%;height:.671875%" data-text="SIGH" onclick="showTextTooltip(event,this)" data-translation="SUSPIRO"></div><div class="text-hotspot" style="left:22.25%;top:26.734375%;width:1.125%;height:.04166666666666667%" data-text="о" onclick="showTextTooltip(event,this)" data-translation="о"></div><div class="text-hotspot" style="left:11.75%;top:26.739583333333332%;width:1.125%;height:.04166666666666667%" data-text="о" onclick="showTextTooltip(event,this)" data-translation="о"></div><div class="text-hotspot" style="left:.75%;top:30.885416666666664%;width:55.25%;height:1.9270833333333335%" data-text="ZING" onclick="showTextTooltip(event,this)" data-translation="ZING"></div><div class="text-hotspot" style="left:30.625000000000004%;top:38.359375%;width:67.375%;height:2.1458333333333357%" data-text="FWOOSK 05" onclick="showTextTooltip(event,this)" data-translation="FWOOSK 05"></div><div class="text-hotspot" style="left:27.125%;top:46.546875%;width:47.125%;height:.921875%" data-text="PLEASE CALM DOWN. WE'RE SAFE HERE." onclick="showTextTooltip(event,this)" data-translation="POR FAVOR, ACALMEM-SE. ESTAMOS SEGUROS AQUI." data-tips="💡 &quot;WE'RE SAFE HERE&quot; usa o verbo &quot;to be&quot; para afirmar segurança no presente. - A estrutura &quot;we're safe&quot; é usada para indicar que não há perigo. Exemplo: &quot;Don't worry, **we're safe** now.&quot;"></div><div class="text-hotspot" style="left:13.625000000000002%;top:57.203125%;width:73.25%;height:1.8958333333333357%" data-text="OUR PRIESTESS JUST CHANTED DESTRUCTION OF EVIL, NOT TO MENTION NAVIGATORS ON WATCH DUTY." onclick="showTextTooltip(event,this)" data-translation="NOSSA SACERDOTISA ACABOU DE CANTAR DESTRUIÇÃO DO MAL, SEM MENCIONAR NAVEGADORES DE PLANTÃO." data-tips="💡 &quot;NOT TO MENTION&quot; é uma expressão usada para adicionar informação sem precisar de mais explicações. - É uma forma de enfatizar algo adicional. Exemplo: &quot;The meal was delicious, **not to mention** the dessert.&quot;"></div><div class="text-hotspot" style="left:15.125%;top:63.328125%;width:49.875%;height:.9583333333333286%" data-text="THE THIRD FLOOR OF THE LABYRINTH WILL BE CLOSED IN ONE DAY." onclick="showTextTooltip(event,this)" data-translation="O TERCEIRO ANDAR DO LABIRINTO SERÁ FECHADO EM UM DIA." data-tips="💡 'Will be closed' é uma estrutura de voz passiva no futuro, indicando que algo será fechado por alguém ou algo."></div><div class="text-hotspot" style="left:28.749999999999996%;top:64.61458333333333%;width:58.375%;height:1.734375%" data-text="WE, CLAN DZARWI, WILL DO OUR ABSOLUTE BEST TO ENSURE THE RETURN OF AS MANY ADVENTURERS AS POSSIBLE..." onclick="showTextTooltip(event,this)" data-translation="NÓS, CLÃ DZARWI, FAREMOS O NOSSO MÁXIMO PARA GARANTIR O RETORNO DO MÁXIMO DE AVENTUREIROS POSSÍVEL..." data-tips="💡 &quot;TO ENSURE THE RETURN&quot; usa o verbo &quot;ensure&quot; para indicar garantia de algo. - &quot;Ensure&quot; é usado para afirmar que algo acontecerá. Exemplo: &quot;We need to **ensure the safety** of our guests.&quot;"></div><div class="text-hotspot" style="left:10.875%;top:72.0625%;width:79.625%;height:1.7864583333333286%" data-text="...IN ACCORDANCE WITH THE AGREEMENT MADE BETWEEN OUR CLAN AND THE ROYAL COURT OF RAFDONIA." onclick="showTextTooltip(event,this)" data-translation="...DE ACORDO COM O ACORDO FEITO ENTRE NOSSO CLÃ E A CORTE REAL DE RAFDONIA." data-tips="💡 'In accordance with' é uma expressão formal que significa 'de acordo com'. É usada em contextos legais ou formais."></div><div class="text-hotspot" style="left:32.25%;top:79.05208333333333%;width:36%;height:1.4635416666666714%" data-text="GULP ارارار" onclick="showTextTooltip(event,this)" data-translation="ENGOLIR ارارار"></div><div class="text-hotspot" style="left:50.125%;top:80.76041666666667%;width:3.6249999999999996%;height:.11458333333333333%" data-text="11|22" onclick="showTextTooltip(event,this)" data-translation="11|22"></div><div class="text-hotspot" style="left:30.125%;top:85.94270833333333%;width:39.375%;height:.234375%" data-text="HOWEVER!!" onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO!!"></div><div class="text-hotspot" style="left:18.125%;top:94.265625%;width:67.5%;height:1.9791666666666665%" data-text="IF ANY ADVENTURER DOES NOT FOLLOW OUR INSTRUCTIONS OR CAUSES DISPUTES AMONG US!!" onclick="showTextTooltip(event,this)" data-translation="SE ALGUM AVENTUREIRO NÃO SEGUIR NOSSAS INSTRUÇÕES OU CAUSAR DISPUTAS ENTRE NÓS!!" data-tips="💡 'If any adventurer does not follow' usa o condicional 'if' para expressar uma condição que pode acontecer no futuro."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:16.625%;top:.26041666666666663%;width:66.875%;height:1.5989583333333335%" data-text="UNDERSTAND THAT WE WILL HAVE TO REMOVE THE SAID INDIVIDUAL FROM THIS PLACE!!" onclick="showTextTooltip(event,this)" data-translation="ENTENDA QUE TEREMOS QUE REMOVER O INDIVÍDUO DITO DESTE LUGAR!!" data-tips="💡 &quot;SAID INDIVIDUAL&quot; é uma maneira formal de se referir a alguém mencionado anteriormente. - Usamos &quot;said&quot; para evitar repetição. Exemplo: &quot;The **said individual** will be contacted soon.&quot;"></div><div class="text-hotspot" style="left:20.375%;top:13.807291666666666%;width:47.25%;height:1.4635416666666667%" data-text="I PREFER MORE IMPOLITE MANNER OF SPEECH TO ANNOUNCE SOMETHING LIKE THIS, BUT IT SURELY DID THE TRICK." onclick="showTextTooltip(event,this)" data-translation="EU PREFIRO UMA MANEIRA MAIS IMPOLIDA DE ANUNCIAR ALGO ASSIM, MAS CERTAMENTE FUNCIONOU." data-tips="💡 &quot;DID THE TRICK&quot; é uma expressão que significa que algo funcionou ou resolveu o problema. - Usamos essa expressão para dizer que algo teve o efeito desejado. Exemplo: &quot;Adding more salt **did the trick** for the soup.&quot;"></div><div class="text-hotspot" style="left:48.875%;top:15.713541666666666%;width:37.5%;height:.6979166666666661%" data-text="THEY ALL BECAME QUIET IN AN INSTANT." onclick="showTextTooltip(event,this)" data-translation="TODOS FICARAM QUIETOS EM UM INSTANTE." data-tips="💡 &quot;IN AN INSTANT&quot; significa muito rapidamente ou imediatamente. - É usado para enfatizar a rapidez de uma ação. Exemplo: &quot;He finished the task **in an instant**.&quot;"></div><div class="text-hotspot" style="left:27.625%;top:23.541666666666668%;width:50.5%;height:1.2083333333333333%" data-text="AND THANKS TO THE DESTRUCTION OF EVIL CHANT, WE SHOULD BE ABLE TO GET SOME REST." onclick="showTextTooltip(event,this)" data-translation="E GRAÇAS À CANTIGA DE DESTRUIÇÃO DO MAL, DEVEMOS CONSEGUIR DESCANSAR UM POUCO." data-tips="💡 &quot;SHOULD BE ABLE TO&quot; expressa uma expectativa de capacidade ou possibilidade. - Usamos &quot;should be able to&quot; para indicar que algo provavelmente será possível. Exemplo: &quot;With some practice, you **should be able to** solve this problem.&quot;"></div><div class="text-hotspot" style="left:28.375%;top:29.395833333333332%;width:42.75%;height:.578125%" data-text="DESTRUCTION OF EVIL." onclick="showTextTooltip(event,this)" data-translation="DESTRUIÇÃO DO MAL."></div><div class="text-hotspot" style="left:11.625%;top:37.526041666666664%;width:49.25%;height:1.21875%" data-text="IT IS ONE OF THE CORE SKILLS OF A PRIEST, CREATING A FIELD THAT BANISHES ALL MONSTERS." onclick="showTextTooltip(event,this)" data-translation="É UMA DAS HABILIDADES CENTRAIS DE UM SACERDOTE, CRIANDO UM CAMPO QUE BANDE TODOS OS MONSTROS." data-tips="💡 &quot;BANISHES&quot; é um verbo que significa expulsar ou afastar permanentemente. - É usado em contextos de fantasia ou figurativamente. Exemplo: &quot;The spell **banishes** all evil spirits.&quot;"></div><div class="text-hotspot" style="left:40.25%;top:39.22395833333333%;width:42.125%;height:.9479166666666714%" data-text="ONLY PEOPLE ARE ABLE TO TRAVEL TO AND FROM THIS AREA FREELY." onclick="showTextTooltip(event,this)" data-translation="APENAS PESSOAS PODEM VIAJAR PARA E DESTA ÁREA LIVREMENTE." data-tips="💡 &quot;TO AND FROM&quot; é uma expressão que indica movimento em ambas as direções. - Usamos &quot;to and from&quot; para descrever movimento entre dois lugares. Exemplo: &quot;The bus travels **to and from** the city center.&quot;"></div><div class="text-hotspot" style="left:43.5%;top:47.953125%;width:47%;height:1.2239583333333333%" data-text="WHIZZ" onclick="showTextTooltip(event,this)" data-translation="SIBILO"></div><div class="text-hotspot" style="left:13.625000000000002%;top:53.296875%;width:69.5%;height:3.2135416666666643%" data-text="8 GOOD. WE DON'T HAVE TO WORRY ABOUT GETTING KICKED OUT NOW. BUT I CAN'T REST ASSURED JUST YET, BECAUSE I KNOW..." onclick="showTextTooltip(event,this)" data-translation="8 BOM. NÃO PRECISAMOS NOS PREOCUPAR EM SER EXPULSOS AGORA. MAS NÃO POSSO FICAR TRANQUILO AINDA, PORQUE EU SEI..." data-tips="💡 'Rest assured' é uma expressão que significa 'ficar tranquilo' ou 'não se preocupar'."></div><div class="text-hotspot" style="left:28.499999999999996%;top:67.015625%;width:43.5%;height:1.2760416666666572%" data-text="THAT PROBLEM IS GOING TO ARISE SOON." onclick="showTextTooltip(event,this)" data-translation="QUE O PROBLEMA VAI SURGIR EM BREVE." data-tips="💡 &quot;IS GOING TO ARISE&quot; usa &quot;going to&quot; para indicar que algo está prestes a acontecer. - É uma forma de falar sobre eventos futuros. Exemplo: &quot;A new opportunity **is going to arise** soon.&quot;"></div><div class="text-hotspot" style="left:23%;top:73.61458333333334%;width:53.25%;height:1.2395833333333286%" data-text="MISSHA I'M ASKING THIS JUST IN CASE, BUT ARE YOU CONFIDENT WITH YOUR EARS?" onclick="showTextTooltip(event,this)" data-translation="MISSHA, ESTOU PERGUNTANDO SÓ POR VIA DAS DÚVIDAS, MAS VOCÊ ESTÁ CONFIANTE COM SUAS ORELHAS?"></div><div class="text-hotspot" style="left:40.5%;top:82.71875%;width:46.75%;height:1.484375%" data-text="NOT SURE, BUT THERE HAVE BEEN GUYS THAT LIKED ME FOR MY EARS IN THE PASTTTT." onclick="showTextTooltip(event,this)" data-translation="NÃO TENHO CERTEZA, MAS HOUVE CARAS QUE GOSTARAM DE MIM POR MINHAS ORELHAS NO PASSADOOOO."></div><div class="text-hotspot" style="left:26.75%;top:88.69791666666667%;width:39.75%;height:1.1302083333333335%" data-text="WHAT THE HELL ARE YOU TALKING ABOUT, WOMAN?" onclick="showTextTooltip(event,this)" data-translation="QUE DIABOS VOCÊ ESTÁ FALANDO, MULHER?"></div><div class="text-hotspot" style="left:28.625%;top:96.140625%;width:44%;height:.96875%" data-text="I MEANT IF YOU HAD THE ABILITY TO HEAR NOISES FROM AFAR." onclick="showTextTooltip(event,this)" data-translation="EU QUIS DIZER SE VOCÊ TINHA A CAPACIDADE DE OUVIR RUÍDOS DE LONGE." data-tips="💡 'Meant' é o passado de 'mean', usado aqui para esclarecer um mal-entendido."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:21%;top:.8229166666666666%;width:66%;height:2.3541666666666665%" data-text="AHAHA OH, THAT! I'M D-DEFINITELY CONFIDENT IN THAT CASSSSSE!" onclick="showTextTooltip(event,this)" data-translation="AHAHA OH, ISSO! EU ESTOU D-DEFINITIVAMENTE CONFIDENTE NESSE CASSSSSO!" data-tips="💡 &quot;DEFINITELY CONFIDENT&quot; expressa certeza absoluta sobre algo. - &quot;Definitely&quot; reforça a confiança na afirmação. Exemplo: &quot;I am **definitely confident** in my skills.&quot;"></div><div class="text-hotspot" style="left:74.5%;top:4.723958333333334%;width:23.25%;height:.5208333333333333%" data-text="SWEAT" onclick="showTextTooltip(event,this)" data-translation="SUOR"></div><div class="text-hotspot" style="left:14.499999999999998%;top:8.880208333333334%;width:50.24999999999999%;height:.9739583333333333%" data-text="THEN TRY TO EAVESDROP ON CONVERSATIONS IN THE VICINITY..." onclick="showTextTooltip(event,this)" data-translation="ENTÃO TENTE ESPIONAR CONVERSAS NAS PROXIMIDADES..." data-tips="💡 &quot;EAVESDROP&quot; significa escutar secretamente uma conversa. - É um verbo usado para descrever a ação de ouvir sem permissão. Exemplo: &quot;She tried to **eavesdrop** on their conversation.&quot;"></div><div class="text-hotspot" style="left:34.125%;top:10.546875%;width:47.125%;height:.96875%" data-text="AND LET ME KNOW IF THERE'S ANYTHING WORTH MENTIONING." onclick="showTextTooltip(event,this)" data-translation="E ME AVISE SE HOUVER ALGO QUE VALHA A PENA MENCIONAR." data-tips="💡 &quot;WORTH MENTIONING&quot; é usado para indicar que algo é importante o suficiente para ser dito. - Usamos essa expressão para destacar informações relevantes. Exemplo: &quot;It's **worth mentioning** that he won the award last year.&quot;"></div><div class="text-hotspot" style="left:15.875%;top:16.109375%;width:45%;height:1.4739583333333335%" data-text="I HEARD IT'S BEEN TEN YEARS SINCE THE LORD OF THE THIRD FLOOR LAST APPEARED." onclick="showTextTooltip(event,this)" data-translation="OUVI DIZER QUE FAZ DEZ ANOS DESDE QUE O SENHOR DO TERCEIRO ANDAR APARECEU PELA ÚLTIMA VEZ." data-tips="💡 'It's been' indica tempo decorrido e é uma estrutura comum com o present perfect. Exemplo: 'It's been a long time since we met.'"></div><div class="text-hotspot" style="left:71.5%;top:17.651041666666668%;width:24.875%;height:.7760416666666666%" data-text="GLANCE" onclick="showTextTooltip(event,this)" data-translation="OLHADA"></div><div class="text-hotspot" style="left:16%;top:26.322916666666668%;width:35.75%;height:.6979166666666666%" data-text="WHAT KIND OF IDIOT WOULD..." onclick="showTextTooltip(event,this)" data-translation="QUE TIPO DE IDIOTA FARIA..."></div><div class="text-hotspot" style="left:11.625%;top:32.65625%;width:65.375%;height:1.46875%" data-text="THANK GOODNESS A SIXTH FLOOR CLAN HAPPENED TO BE ACTIVE ON THIS FLOOR BY COINCIDENCE." onclick="showTextTooltip(event,this)" data-translation="AINDA BEM QUE UM CLÃ DO SEXTO ANDAR ESTAVA ATIVO NESTE ANDAR POR COINCIDÊNCIA." data-tips="💡 &quot;HAPPENED TO BE&quot; é uma expressão que indica que algo ocorreu por acaso. - Usamos &quot;happened to be&quot; para falar de coincidências. Exemplo: &quot;I **happened to be** there when the event started.&quot;"></div><div class="text-hotspot" style="left:15.25%;top:38.723958333333336%;width:69.25%;height:1.2395833333333333%" data-text="TELL ME ABOUT IT. I NEVER IMAGINED I'D GET TO SEE THE DESTRUCTION OF EVIL CHANT AFFECTING SUCH A WIDE AREA." onclick="showTextTooltip(event,this)" data-translation="NEM IMAGINAVA QUE VERIA A CANTIGA DE DESTRUIÇÃO DO MAL AFETANDO UMA ÁREA TÃO GRANDE." data-tips="💡 &quot;NEVER IMAGINED&quot; expressa surpresa sobre algo inesperado. - Usamos essa estrutura para falar de algo que não se esperava. Exemplo: &quot;I **never imagined** I would travel to Japan.&quot;"></div><div class="text-hotspot" style="left:41%;top:45.58333333333333%;width:35.75%;height:.6875%" data-text="AS EXPECTED OF A MAJOR CLAN." onclick="showTextTooltip(event,this)" data-translation="COMO ESPERADO DE UM GRANDE CLÃ."></div><div class="text-hotspot" style="left:21%;top:51.098958333333336%;width:57.625%;height:1.484375%" data-text="RIGHT. AND IF CLAN DZARWI'S PURPOSE OF REMAINING ON THE THIRD FLOOR IS THAT..." onclick="showTextTooltip(event,this)" data-translation="CERTO. E SE O PROPÓSITO DO CLÃ DZARWI DE PERMANECER NO TERCEIRO ANDAR FOR ESSE..." data-tips="💡 'Purpose of remaining' usa 'of' para indicar a razão ou objetivo de uma ação."></div><div class="text-hotspot" style="left:20.25%;top:59.416666666666664%;width:61%;height:1.4739583333333357%" data-text="...THE RISKS ASSOCIATED WITH THIS GAMBLE TO TURN THINGS AROUND ARE GREATLY REDUCED." onclick="showTextTooltip(event,this)" data-translation="...OS RISCOS ASSOCIADOS A ESTA APOSTA PARA VIRAR O JOGO SÃO MUITO REDUZIDOS."></div><div class="text-hotspot" style="left:5.875%;top:65.6875%;width:81.5%;height:6.328125%" data-text="вол A 4 A" onclick="showTextTooltip(event,this)" data-translation="вол A 4 A"></div><div class="text-hotspot" style="left:55.00000000000001%;top:89.94791666666667%;width:5%;height:.052083333333333336%" data-text="..." onclick="showTextTooltip(event,this)" data-translation="..."></div><div class="text-hotspot" style="left:27.375%;top:91.93229166666667%;width:29.75%;height:.9166666666666666%" data-text="222" onclick="showTextTooltip(event,this)" data-translation="222"></div><div class="text-hotspot" style="left:20%;top:99.53645833333333%;width:33.25%;height:.4479166666666667%" data-text="GWISH" onclick="showTextTooltip(event,this)" data-translation="GWISH"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:50.24999999999999%;top:1.3645833333333333%;width:46.25%;height:1.1614583333333333%" data-text="FALTER" onclick="showTextTooltip(event,this)" data-translation="VACILAR"></div><div class="text-hotspot" style="left:4.375%;top:6.817708333333333%;width:78%;height:3.015625%" data-text="THUD OUCH!!!" onclick="showTextTooltip(event,this)" data-translation="TUM OUCH!!!"></div><div class="text-hotspot" style="left:49.25%;top:14.260416666666668%;width:34.125%;height:.6875%" data-text="D-DID SOMETHING HAPPENNNN?" onclick="showTextTooltip(event,this)" data-translation="A-ACONTECEU ALGUMA COISA?"></div><div class="text-hotspot" style="left:56.49999999999999%;top:16.723958333333332%;width:18.25%;height:.4635416666666667%" data-text="PSHHH" onclick="showTextTooltip(event,this)" data-translation="PSHHH"></div><div class="text-hotspot" style="left:20.25%;top:20.854166666666664%;width:28.125%;height:.4322916666666714%" data-text="IT'S ABOUT TO." onclick="showTextTooltip(event,this)" data-translation="ESTÁ PARA ACONTECER."></div><div class="text-hotspot" style="left:54%;top:25.739583333333332%;width:29.375%;height:.953125%" data-text="WHAT DO YOU MEAN IT'S ABOUT TOOOOO?" onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ QUER DIZER COM ESTÁ PARA ACONTECERRR?"></div><div class="text-hotspot" style="left:25.75%;top:32.04166666666667%;width:21.375%;height:.6822916666666666%" data-text="LOOK AROUND YOU." onclick="showTextTooltip(event,this)" data-translation="OLHE AO SEU REDOR."></div><div class="text-hotspot" style="left:25%;top:38.588541666666664%;width:49.75%;height:1.140625000000007%" data-text="THERE ARE WAY TOO MANY ADVENTURERS HERE." onclick="showTextTooltip(event,this)" data-translation="HÁ AVENTUREIROS DEMAIS AQUI." data-tips="💡 'Way too many' é uma expressão informal que significa 'muitos demais', indicando excesso."></div><div class="text-hotspot" style="left:44.125%;top:40.703125%;width:51.24999999999999%;height:1.375%" data-text="MURMUR" onclick="showTextTooltip(event,this)" data-translation="MURMÚRIO"></div><div class="text-hotspot" style="left:.5%;top:45.75%;width:47.25%;height:1.28125%" data-text="MURMUR" onclick="showTextTooltip(event,this)" data-translation="MURMÚRIO"></div><div class="text-hotspot" style="left:33.5%;top:50.244791666666664%;width:22.5%;height:.19270833333333334%" data-text="THAT'S" onclick="showTextTooltip(event,this)" data-translation="ISSO É"></div><div class="text-hotspot" style="left:28.000000000000004%;top:50.244791666666664%;width:44%;height:.8333333333333428%" data-text="AT LEAST 500, I WOULD SAY." onclick="showTextTooltip(event,this)" data-translation="PELO MENOS 500, EU DIRIA." data-tips="💡 'At least' é usado para indicar uma estimativa mínima, comum em contagens e medidas."></div><div class="text-hotspot" style="left:46.125%;top:57.97395833333333%;width:39%;height:.6822916666666666%" data-text="WHAT'S GOING TO HAPPEN TO US NOWWWW?" onclick="showTextTooltip(event,this)" data-translation="O QUE VAI ACONTECER CONOSCO AGORAAAA?"></div><div class="text-hotspot" style="left:26.375%;top:65.09375%;width:49.75%;height:.9635416666666714%" data-text="THERE ARE ABOUT 50 MEMBERS OF CLAN DZARWI HERE." onclick="showTextTooltip(event,this)" data-translation="HÁ CERCA DE 50 MEMBROS DO CLÃ DZARWI AQUI."></div><div class="text-hotspot" style="left:13%;top:66.59895833333334%;width:43.5%;height:1.203125%" data-text="LET'S SEE HOW THEY KEEP THIS GREAT A CROWD UNDER CONTROL." onclick="showTextTooltip(event,this)" data-translation="VAMOS VER COMO ELES MANTÊM UMA MULTIDÃO TÃO GRANDE SOB CONTROLE." data-tips="💡 'Keep under control' é uma expressão que significa 'manter sob controle', usada para situações ou pessoas."></div><div class="text-hotspot" style="left:18.125%;top:72.1875%;width:47.5%;height:1.1510416666666572%" data-text="AHEM. EVERYONE, PLEASE LISTEN UP!" onclick="showTextTooltip(event,this)" data-translation="AHEM. TODOS, POR FAVOR, OUÇAM!" data-tips="💡 &quot;LISTEN UP!&quot; é uma expressão usada para chamar a atenção de um grupo de pessoas, geralmente em um tom imperativo. É mais informal do que apenas &quot;listen&quot;. 

- **Listen up, everyone!** We have an important announcement to make.
- **Listen up, kids!** It's time to start the class."></div><div class="text-hotspot" style="left:25%;top:81.32291666666667%;width:57.25%;height:1.7395833333333333%" data-text="THIS IS THE ONLY SAFE AREA ON THE ENTIRE THIRD FLOOR, THANKS TO THE EFFECTS OF DESTRUCTION OF EVIL." onclick="showTextTooltip(event,this)" data-translation="ESTA É A ÚNICA ÁREA SEGURA EM TODO O TERCEIRO ANDAR, GRAÇAS AOS EFEITOS DA DESTRUIÇÃO DO MAL." data-tips="💡 &quot;THANKS TO&quot; é uma expressão que indica a razão ou causa de algo, semelhante a &quot;graças a&quot; em português. 

- We finished the project on time **thanks to** your help.
- The garden looks beautiful **thanks to** the rain."></div><div class="text-hotspot" style="left:14.249999999999998%;top:83.78125%;width:30.625000000000004%;height:.18229166666666666%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO..."></div><div class="text-hotspot" style="left:16.375%;top:90.38020833333333%;width:55.875%;height:1.4895833333333335%" data-text="...OUR PRIESTESS REQUESTS THAT ALL OF YOU PAY PROPER RESPECT TO THE GODDESS." onclick="showTextTooltip(event,this)" data-translation="...NOSSA SACERDOTISA SOLICITA QUE TODOS VOCÊS PRESTEM O DEVIDO RESPEITO À DEUSA." data-tips="💡 &quot;PAY PROPER RESPECT&quot; significa mostrar o devido respeito, uma expressão formal que pode ser usada em contextos que requerem reverência ou reconhecimento.

- We should **pay proper respect** to our elders.
- It's important to **pay proper respect** to cultural traditions."></div><div class="text-hotspot" style="left:28.499999999999996%;top:96.31770833333333%;width:44.625%;height:.9062499999999999%" data-text="ONE MILLION STONES PER PERSON..." onclick="showTextTooltip(event,this)" data-translation="UM MILHÃO DE PEDRAS POR PESSOA..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:1.25%;top:.4635416666666667%;width:43.125%;height:1.2291666666666665%" data-text="DA DUN" onclick="showTextTooltip(event,this)" data-translation="DA DUN"></div><div class="text-hotspot" style="left:13.875000000000002%;top:6.484375000000001%;width:51.87500000000001%;height:1.0416666666666665%" data-text="...IS THE AMOUNT THAT MUST BE PAID IMMEDIATELY ON THE SPOT." onclick="showTextTooltip(event,this)" data-translation="...É O VALOR QUE DEVE SER PAGO IMEDIATAMENTE NO LOCAL." data-tips="💡 &quot;ON THE SPOT&quot; significa no local ou imediatamente, sem demora. É uma expressão usada para indicar que algo deve ser feito de imediato.

- He was hired **on the spot** after the interview.
- The manager made a decision **on the spot**."></div><div class="text-hotspot" style="left:32.625%;top:7.895833333333334%;width:54.87499999999999%;height:1.609375%" data-text="SHE SAID THE GODDESS WILL ACCEPT THAT IN EITHER MANA STONES OR ITEMS." onclick="showTextTooltip(event,this)" data-translation="ELA DISSE QUE A DEUSA ACEITARÁ ISSO EM PEDRAS DE MANA OU ITENS." data-tips="💡 &quot;EITHER... OR...&quot; é uma estrutura que apresenta duas opções. Em português, equivale a &quot;ou... ou...&quot;.

- You can **either** call me **or** send an email.
- She will **either** take the bus **or** walk."></div><div class="text-hotspot" style="left:19.625%;top:14.515624999999998%;width:51.75%;height:1.473958333333334%" data-text="CLEVER. NO ADVENTURER IN THEIR RIGHT MIND WOULD CARRY AROUND ONE MILLION MANA STONES." onclick="showTextTooltip(event,this)" data-translation="ESPERTO. NENHUM AVENTUREIRO EM SÃ CONSCIÊNCIA CARREGARIA UM MILHÃO DE PEDRAS DE MANA." data-tips="💡 &quot;IN THEIR RIGHT MIND&quot; é uma expressão que significa alguém que está pensando de forma racional e lógica. Em português, seria &quot;em sã consciência&quot;.

- No one **in their right mind** would do such a thing.
- Would you **in your right mind** spend so much money on a car?"></div><div class="text-hotspot" style="left:26.25%;top:23.942708333333336%;width:44.25%;height:1.203125%" data-text="THEY INTEND TO TAKE THE EQUIPMENTS OF ADVENTURERS IN ORDER TO KEEP THEM UNDER CONTROL." onclick="showTextTooltip(event,this)" data-translation="ELES PRETENDEM PEGAR OS EQUIPAMENTOS DOS AVENTUREIROS PARA MANTÊ-LOS SOB CONTROLE." data-tips="💡 &quot;IN ORDER TO&quot; é usado para expressar o propósito de uma ação. Em português, seria &quot;para&quot; ou &quot;a fim de&quot;.

- She's studying hard **in order to** pass the exam.
- We need to save money **in order to** buy a house."></div><div class="text-hotspot" style="left:22.875%;top:29.869791666666668%;width:54.125%;height:1.6145833333333335%" data-text="ONE MILLION STONES IS THE PRICE OF RESPECT TO THE GODDESS IN EXCHANGE FOR PROTECTION." onclick="showTextTooltip(event,this)" data-translation="UM MILHÃO DE PEDRAS É O PREÇO DO RESPEITO À DEUSA EM TROCA DE PROTEÇÃO."></div><div class="text-hotspot" style="left:23.375%;top:42.96875%;width:53%;height:1.0520833333333333%" data-text="YOU MAY LOSE A FEW EQUIPMENTS OR CONSUMABLES AS A RESULT." onclick="showTextTooltip(event,this)" data-translation="VOCÊ PODE PERDER ALGUNS EQUIPAMENTOS OU CONSUMÍVEIS COMO RESULTADO." data-tips="💡 'As a result' é uma expressão de transição que significa 'como resultado', usada para mostrar uma consequência."></div><div class="text-hotspot" style="left:18.375%;top:48.546875%;width:64.125%;height:1.6197916666666643%" data-text="HOWEVER, WHAT'S THERE TO WORRY ABOUT WHEN WE ARE HERE?" onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, O QUE HÁ PARA SE PREOCUPAR QUANDO ESTAMOS AQUI?" data-tips="💡 &quot;WHAT'S THERE TO WORRY ABOUT&quot; é uma expressão que questiona a necessidade de preocupação. É uma forma de minimizar ou desafiar preocupações.

- **What's there to worry about** if everything is under control?
- **What's there to worry about** when we have a backup plan?"></div><div class="text-hotspot" style="left:34.75%;top:65.86458333333334%;width:27.250000000000004%;height:.6979166666666666%" data-text="OF COURSE THERE IS, YOU NUTSACK." onclick="showTextTooltip(event,this)" data-translation="CLARO QUE HÁ, SEU IDIOTA." data-tips="💡 &quot;YOU NUTSACK&quot; é uma gíria ofensiva e informal para chamar alguém de idiota ou estúpido. Em um contexto mais formal, poderia ser substituído por &quot;you fool&quot;.

- **You fool**, why did you do that?
- Don't be such a **fool**."></div><div class="text-hotspot" style="left:26%;top:73.3125%;width:27.75%;height:.9531249999999858%" data-text="EVEN THOUGH DESTRUCTION OF EVIL IS AN OP SKILL..." onclick="showTextTooltip(event,this)" data-translation="MESMO QUE DESTRUIÇÃO DO MAL SEJA UMA HABILIDADE OP..." data-tips="💡 &quot;EVEN THOUGH&quot; é uma conjunção que introduz uma ideia contrastante, semelhante a &quot;embora&quot; ou &quot;mesmo que&quot; em português.

- **Even though** it was raining, we went for a walk.
- She decided to join us **even though** she was tired."></div><div class="text-hotspot" style="left:42.375%;top:74.82291666666666%;width:36%;height:.9375000000000142%" data-text="IT'S ACTUALLY USELESS AGAINST THE LORD OF THE FLOOR." onclick="showTextTooltip(event,this)" data-translation="É NA VERDADE INÚTIL CONTRA O SENHOR DO ANDAR."></div><div class="text-hotspot" style="left:36.125%;top:81.125%;width:41.125%;height:1.2083333333333333%" data-text="WE DEFINITELY CANNOT DEFEAT THE LORD OF THE THIRD FLOOR WITH THOSE GUYS ALONE..." onclick="showTextTooltip(event,this)" data-translation="NÓS DEFINITIVAMENTE NÃO PODEMOS DERROTAR O SENHOR DO TERCEIRO ANDAR SÓ COM AQUELES CARAS..."></div><div class="text-hotspot" style="left:18.375%;top:83.03125%;width:39%;height:.9322916666666572%" data-text="BUT WE MUST DO AS WE SAY TO A CERTAIN DEGREE." onclick="showTextTooltip(event,this)" data-translation="MAS DEVEMOS FAZER COMO DIZEMOS ATÉ CERTO PONTO." data-tips="💡 &quot;TO A CERTAIN DEGREE&quot; significa até certo ponto, indicando que algo é verdade ou aplicável apenas parcialmente.

- I agree with you **to a certain degree**.
- The plan is working **to a certain degree**, but it needs adjustments."></div><div class="text-hotspot" style="left:29.625%;top:90.25520833333334%;width:56.375%;height:1.4895833333333286%" data-text="MISSHA. LEAVE CONSUMABLES LIKE POTIONS ALONE AND TAKE OUT THE ITEMS WE DON'T REALLY NEED." onclick="showTextTooltip(event,this)" data-translation="MISSHA. DEIXE OS CONSUMÍVEIS COMO POÇÕES DE LADO E TIRE OS ITENS QUE NÃO PRECISAMOS REALMENTE." data-tips="💡 'Leave alone' significa 'deixar de lado' ou 'não mexer', usado para indicar que algo deve ser ignorado ou não alterado."></div><div class="text-hotspot" style="left:21.875%;top:96.11458333333334%;width:56.625%;height:1.484375%" data-text="THANK GOODNESS WE LOOTED ENOUGH EQUIPMENTS FROM OTHER ADVENTURERS SO WE DON'T HAVE TO TURN IN THE ONES WE'RE WEARING." onclick="showTextTooltip(event,this)" data-translation="AINDA BEM QUE SAQUEAMOS EQUIPAMENTOS SUFICIENTES DE OUTROS AVENTUREIROS PARA NÃO PRECISARMOS ENTREGAR OS QUE ESTAMOS USANDO." data-tips="💡 &quot;THANK GOODNESS&quot; é uma expressão usada para expressar alívio ou gratidão, semelhante a &quot;ainda bem&quot; em português.

- **Thank goodness** the storm passed quickly.
- **Thank goodness** you're safe."></div><div class="text-hotspot" style="left:78.625%;top:98.578125%;width:18%;height:.3489583333333333%" data-text="I'LL BE BACCCCK." onclick="showTextTooltip(event,this)" data-translation="EU VOLTOOOO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:29.625%;top:0;width:19.875%;height:.33333333333333337%" data-text="TAKE THIS TOO." onclick="showTextTooltip(event,this)" data-translation="PEGUE ISSO TAMBÉM."></div><div class="text-hotspot" style="left:0;top:4.75%;width:11.375%;height:.4583333333333333%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:28.000000000000004%;top:10.135416666666666%;width:19.375%;height:.171875%" data-text="BESIDES..." onclick="showTextTooltip(event,this)" data-translation="ALÉM DISSO..."></div><div class="text-hotspot" style="left:32%;top:16.755208333333332%;width:50.24999999999999%;height:1.1614583333333333%" data-text="TURN THESE IN, SO WE STARVE TO DEATH NEXT MONTH?!" onclick="showTextTooltip(event,this)" data-translation="ENTREGAR ISSO, PARA MORRERMOS DE FOME NO PRÓXIMO MÊS?!" data-tips="💡 &quot;TURN THESE IN&quot; significa entregar algo, geralmente em um contexto de cumprimento de uma obrigação ou requisito.

- Please **turn in** your assignments by Friday.
- She **turned in** the lost wallet to the police."></div><div class="text-hotspot" style="left:14.374999999999998%;top:22.942708333333332%;width:57.75%;height:.9427083333333334%" data-text="ONE MILLION STONES FOR A SINGLE DAY OF PROTECTION? THAT'S OUTRAGEOUS." onclick="showTextTooltip(event,this)" data-translation="UM MILHÃO DE PEDRAS POR UM ÚNICO DIA DE PROTEÇÃO? ISSO É UM ABSURDO." data-tips="💡 &quot;THAT'S OUTRAGEOUS&quot; é uma expressão usada para descrever algo que é chocante ou inaceitável, parecido com &quot;isso é um absurdo&quot;.

- **That's outrageous**! How can they charge so much?
- The way he spoke to her was **outrageous**."></div><div class="text-hotspot" style="left:27.750000000000004%;top:26.802083333333332%;width:26.375%;height:.6510416666666667%" data-text="FUME" onclick="showTextTooltip(event,this)" data-translation="FÚRIA"></div><div class="text-hotspot" style="left:.5%;top:27.500000000000004%;width:1.625%;height:.046875%" data-text="10" onclick="showTextTooltip(event,this)" data-translation="10"></div><div class="text-hotspot" style="left:48.5%;top:28.140625000000004%;width:26.25%;height:.5572916666666667%" data-text="FUME" onclick="showTextTooltip(event,this)" data-translation="FÚRIA"></div><div class="text-hotspot" style="left:43.5%;top:32%;width:38.75%;height:.6822916666666666%" data-text="SCREW THEM. I'M NOT DOING THAT." onclick="showTextTooltip(event,this)" data-translation="QUE SE DANE. NÃO VOU FAZER ISSO." data-tips="💡 &quot;SCREW THEM&quot; é uma expressão coloquial e informal que expressa desdém ou desprezo, equivalente a &quot;que se dane&quot;. Em um contexto mais formal, poderia ser substituído por &quot;forget them&quot;.

- **Forget them**, we can do it ourselves.
- If they don't want to help, **forget them**."></div><div class="text-hotspot" style="left:23.625%;top:37.328125%;width:36.125%;height:.9635416666666667%" data-text="SOME TURNED THE OFFER DOWN AND LEFT THE AREA..." onclick="showTextTooltip(event,this)" data-translation="ALGUNS RECUSARAM A OFERTA E SAÍRAM DA ÁREA..." data-tips="💡 &quot;TURNED THE OFFER DOWN&quot; é um phrasal verb que significa recusar uma oferta. 

- She **turned down** the job offer because it wasn't what she wanted.
- We **turned down** the invitation to the party."></div><div class="text-hotspot" style="left:52.5%;top:38.97395833333333%;width:21.125%;height:.421875%" data-text="JUST AS I EXPECTED." onclick="showTextTooltip(event,this)" data-translation="EXATAMENTE COMO EU ESPERAVA."></div><div class="text-hotspot" style="left:10.375%;top:40.302083333333336%;width:27.750000000000004%;height:.6979166666666666%" data-text="FWOOSH" onclick="showTextTooltip(event,this)" data-translation="FWOOSH"></div><div class="text-hotspot" style="left:32%;top:50.151041666666664%;width:25.5%;height:.43750000000000006%" data-text="I TURNED THEM IN." onclick="showTextTooltip(event,this)" data-translation="EU OS ENTREGUEI."></div><div class="text-hotspot" style="left:40.25%;top:51.744791666666664%;width:25.124999999999996%;height:.8177083333333333%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:45.375%;top:56.270833333333336%;width:15%;height:.4270833333333333%" data-text="GOOD JOB." onclick="showTextTooltip(event,this)" data-translation="BOM TRABALHO."></div><div class="text-hotspot" style="left:23.125%;top:61.53125000000001%;width:39%;height:1.2187499999999858%" data-text="THEY TOOK A MILLION STONES FROM ABOUT 300 ADVENTURERS, EASILY." onclick="showTextTooltip(event,this)" data-translation="ELES PEGARAM UM MILHÃO DE PEDRAS DE CERCA DE 300 AVENTUREIROS, FACILMENTE."></div><div class="text-hotspot" style="left:47.25%;top:63.57291666666667%;width:31.374999999999996%;height:.6875%" data-text="THAT'S AT LEAST 300 MILLION STONES." onclick="showTextTooltip(event,this)" data-translation="ISSO É PELO MENOS 300 MILHÕES DE PEDRAS."></div><div class="text-hotspot" style="left:60%;top:64.86979166666667%;width:35.75%;height:.33333333333333337%" data-text="THAT'S LIKE INFINITE MONEY HACK." onclick="showTextTooltip(event,this)" data-translation="ISSO É COMO UM HACK DE DINHEIRO INFINITO."></div><div class="text-hotspot" style="left:4%;top:67.421875%;width:18.625%;height:.5572916666666667%" data-text="TSK" onclick="showTextTooltip(event,this)" data-translation="TSK"></div><div class="text-hotspot" style="left:25.874999999999996%;top:72.70833333333333%;width:47.75%;height:1.2083333333333286%" data-text="TWO BIRDS WITH ONE STONE, SINCE THEY GOT RID OF GRUMBLING ADVENTURERS WHILE MAKING MONEY." onclick="showTextTooltip(event,this)" data-translation="DOIS COELHOS COM UMA CAJADADA SÓ, JÁ QUE ELES SE LIVRARAM DOS AVENTUREIROS RECLAMÕES ENQUANTO GANHAVAM DINHEIRO." data-tips="💡 &quot;TWO BIRDS WITH ONE STONE&quot; é uma expressão idiomática que significa resolver dois problemas de uma só vez, equivalente a &quot;matar dois coelhos com uma cajadada só&quot; em português.

- By cycling to work, I **kill two birds with one stone**: I save money and get exercise.
- Let's **kill two birds with one stone** by combining our errands."></div><div class="text-hotspot" style="left:23.75%;top:79.5%;width:52.375%;height:1.1979166666666572%" data-text="BUT EVEN THESE GUYS HAVE TO CONTINUE PRAYING TO THE GODDESS AND HOPE FOR THE BEST." onclick="showTextTooltip(event,this)" data-translation="MAS MESMO ESSES CARAS TÊM QUE CONTINUAR REZANDO PARA A DEUSA E ESPERAR PELO MELHOR." data-tips="💡 'Hope for the best' é uma expressão que significa 'esperar pelo melhor', usada para expressar otimismo em relação ao futuro."></div><div class="text-hotspot" style="left:80.125%;top:87.39583333333333%;width:17.875%;height:.5208333333333333%" data-text="NOM" onclick="showTextTooltip(event,this)" data-translation="NOM"></div><div class="text-hotspot" style="left:21%;top:91.31770833333334%;width:43.375%;height:1.140625%" data-text="BECAUSE ONCE THE LORD OF THE FLOOR REACHES THIS AREA..." onclick="showTextTooltip(event,this)" data-translation="PORQUE UMA VEZ QUE O SENHOR DO ANDAR CHEGAR A ESTA ÁREA..."></div><div class="text-hotspot" style="left:44.75%;top:93.13020833333333%;width:33.875%;height:.84375%" data-text="WE'LL ALL BE DONE FOR ANYWAYS." onclick="showTextTooltip(event,this)" data-translation="ESTAREMOS TODOS FERRADOS DE QUALQUER MANEIRA." data-tips="💡 'Done for' é uma expressão que significa 'ferrado' ou 'acabado', usada para indicar que alguém está em uma situação sem saída."></div><div class="text-hotspot" style="left:21%;top:98.53125%;width:38%;height:1.2239583333333333%" data-text="THEY PROBABLY THINK THE CHANCE OF ENCOUNTERING THE LORD OF THE FLOOR IS LESS..." onclick="showTextTooltip(event,this)" data-translation="PROVAVELMENTE PENSAM QUE A CHANCE DE ENCONTRAR O SENHOR DO ANDAR É MENOR..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:42.625%;top:.5833333333333334%;width:41.375%;height:1.4635416666666665%" data-text="THAN THAT OF AVOIDING THE BEAST FOR A WHOLE DAY, SINCE THE THIRD FLOOR IS SO VAST." onclick="showTextTooltip(event,this)" data-translation="DO QUE A DE EVITAR A BESTA POR UM DIA INTEIRO, JÁ QUE O TERCEIRO ANDAR É TÃO VASTO."></div><div class="text-hotspot" style="left:9%;top:4.307291666666667%;width:25%;height:.671875%" data-text="TAP" onclick="showTextTooltip(event,this)" data-translation="TAP"></div><div class="text-hotspot" style="left:31.5%;top:9.885416666666668%;width:40%;height:1.5%" data-text="ADVENTURERS THAT LEFT THE AREA WITHOUT PAYING UP MUST BE THINKING OPTIMISTICALLY AS WELL." onclick="showTextTooltip(event,this)" data-translation="OS AVENTUREIROS QUE SAÍRAM DA ÁREA SEM PAGAR DEVEM ESTAR PENSANDO DE FORMA OTIMISTA TAMBÉM." data-tips="💡 'Must be thinking' usa o modal 'must' para indicar uma dedução lógica, sugerindo certeza sobre o que outros estão pensando."></div><div class="text-hotspot" style="left:19.5%;top:16.307291666666668%;width:61.12499999999999%;height:1.46875%" data-text="I, ON THE OTHER HAND, ALWAYS TAKE THE WORST POSSIBLE SCENARIO INTO ACCOUNT." onclick="showTextTooltip(event,this)" data-translation="EU, POR OUTRO LADO, SEMPRE LEVO EM CONTA O PIOR CENÁRIO POSSÍVEL." data-tips="💡 &quot;ON THE OTHER HAND&quot; é uma expressão usada para introduzir uma ideia contrastante ou uma perspectiva diferente, semelhante a &quot;por outro lado&quot; em português.

- I love living in the city. **On the other hand**, it can be very noisy.
- She is very talented. **On the other hand**, she lacks experience."></div><div class="text-hotspot" style="left:17.25%;top:26.817708333333336%;width:47.5%;height:1.3333333333333335%" data-text="ALTHOUGH MY PESSIMISTIC IMAGINATIONS DON'T ALWAYS TURN OUT TO BE TRUE..." onclick="showTextTooltip(event,this)" data-translation="EMBORA MINHAS IMAGINAÇÕES PESSIMISTAS NEM SEMPRE SE TORNEM VERDADE..." data-tips="💡 &quot;TURN OUT TO BE&quot; é um phrasal verb que significa revelar-se ou acabar sendo algo, geralmente diferente do esperado.

- The weather **turned out to be** better than we expected.
- He **turned out to be** a great leader."></div><div class="text-hotspot" style="left:49.125%;top:28.760416666666664%;width:40.625%;height:.75%" data-text="I WONDER WHAT WILL HAPPEN THIS TIME." onclick="showTextTooltip(event,this)" data-translation="ME PERGUNTO O QUE VAI ACONTECER DESTA VEZ."></div><div class="text-hotspot" style="left:23%;top:40.296875%;width:12.25%;height:.16145833333333334%" data-text="19:07." onclick="showTextTooltip(event,this)" data-translation="19:07."></div><div class="text-hotspot" style="left:30.875000000000004%;top:42.395833333333336%;width:52.37500000000001%;height:.703125%" data-text="APPROXIMATELY FIVE MORE HOURS BEFORE THE LABYRINTH CLOSES." onclick="showTextTooltip(event,this)" data-translation="APROXIMADAMENTE MAIS CINCO HORAS ANTES DO LABIRINTO FECHAR." data-tips="💡 &quot;BEFORE&quot; é usado para indicar um ponto no tempo anterior a outro evento. Aqui, é usado para mostrar que algo ocorrerá em cinco horas.

- We need to finish the report **before** the meeting.
- She called me **before** leaving the house."></div><div class="text-hotspot" style="left:51.87500000000001%;top:45.244791666666664%;width:38%;height:1.0260416666666665%" data-text="DRIP" onclick="showTextTooltip(event,this)" data-translation="PINGO"></div><div class="text-hotspot" style="left:11.125%;top:48.46875%;width:33.75%;height:.8020833333333333%" data-text="DRIP" onclick="showTextTooltip(event,this)" data-translation="PINGO"></div><div class="text-hotspot" style="left:35.25%;top:51.9375%;width:27.875%;height:.9635416666666643%" data-text="...I WAS HOPING TO AVOID IT, BUT THERE IT IS." onclick="showTextTooltip(event,this)" data-translation="...EU ESPERAVA EVITAR ISSO, MAS AÍ ESTÁ." data-tips="💡 'There it is' é uma expressão usada para indicar que algo inevitável ou esperado finalmente ocorreu, semelhante a 'aí está'."></div><div class="text-hotspot" style="left:34%;top:58.682291666666664%;width:32.25%;height:.5677083333333334%" data-text="THE RAIN OF DESPAIR." onclick="showTextTooltip(event,this)" data-translation="A CHUVA DO DESESPERO."></div><div class="text-hotspot" style="left:31.874999999999996%;top:59.682291666666664%;width:61.12499999999999%;height:2.3333333333333335%" data-text="SPLA" onclick="showTextTooltip(event,this)" data-translation="SPLA"></div><div class="text-hotspot" style="left:22.125%;top:68.94270833333334%;width:55.375%;height:1.1406249999999858%" data-text="THIS IS THE PASSIVE AREA-OF-EFFECT SKILL OF RIAKIS, LORD OF CHAOS." onclick="showTextTooltip(event,this)" data-translation="ESTA É A HABILIDADE PASSIVA DE ÁREA DE EFEITO DE RIAKIS, SENHOR DO CAOS."></div><div class="text-hotspot" style="left:11.25%;top:75.71354166666666%;width:70.25%;height:.4270833333333333%" data-text="YOU ARE TAKING LINGERING CHAOS DAMAGE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ RECEBENDO DANO DE CAOS PERSISTENTE." data-tips="💡 &quot;LINGERING&quot; é um adjetivo que descreve algo que persiste ou continua por um tempo. Em português, seria &quot;persistente&quot;.

- The **lingering** smell of smoke filled the room.
- He had a **lingering** feeling of doubt."></div><div class="text-hotspot" style="left:27.250000000000004%;top:77.38541666666666%;width:62.125%;height:.4270833333333333%" data-text="YOUR MAGIC RESISTANCE IS GREATLY REDUCED." onclick="showTextTooltip(event,this)" data-translation="SUA RESISTÊNCIA MÁGICA ESTÁ MUITO REDUZIDA." data-tips="💡 &quot;GREATLY REDUCED&quot; significa significativamente reduzido, uma expressão que indica uma diminuição considerável em algo.

- The prices were **greatly reduced** during the sale.
- His workload was **greatly reduced** after the new hires."></div><div class="text-hotspot" style="left:44.75%;top:82.68229166666666%;width:34.875%;height:.9583333333333333%" data-text="NOT ONLY DOES THIS SKILL AFFECT A LARGE NUMBER OF TARGETS..." onclick="showTextTooltip(event,this)" data-translation="NÃO SÓ ESSA HABILIDADE AFETA UM GRANDE NÚMERO DE ALVOS..." data-tips="💡 A tradução &quot;NÃO SÓ ESSA HABILIDADE AFETA&quot; é uma tradução direta de &quot;NOT ONLY DOES THIS SKILL AFFECT&quot;. **Inversão**: Note que em inglês, após &quot;not only&quot;, há uma inversão do sujeito e verbo auxiliar (&quot;does this skill affect&quot;), algo que não ocorre em português. Este padrão é usado para dar ênfase. - **Exemplo**: Not only did he win, but he also set a new record."></div><div class="text-hotspot" style="left:18.25%;top:84.26041666666667%;width:51.5%;height:1.4739583333333335%" data-text="IT ALSO TURNS THE AFFECTED SPACE INTO A TAKEN OVER AREA, REMOVING ALL FORMS OF FIELD STATUS EFFECTS." onclick="showTextTooltip(event,this)" data-translation="TAMBÉM TRANSFORMA O ESPAÇO AFETADO EM UMA ÁREA TOMADA, REMOVENDO TODAS AS FORMAS DE EFEITOS DE STATUS DE CAMPO." data-tips="💡 A expressão &quot;TAKEN OVER AREA&quot; foi traduzida como &quot;ÁREA TOMADA&quot;. **Phrasal Verb**: &quot;Take over&quot; significa assumir controle ou domínio sobre algo. Neste contexto, refere-se a uma área que foi dominada ou controlada. - **Exemplo**: The company was taken over by a larger corporation."></div><div class="text-hotspot" style="left:11.875%;top:86.78645833333334%;width:31.874999999999996%;height:.96875%" data-text="DRIP" onclick="showTextTooltip(event,this)" data-translation="PINGO"></div><div class="text-hotspot" style="left:67%;top:88.97916666666667%;width:25.75%;height:.640625%" data-text="DRIP" onclick="showTextTooltip(event,this)" data-translation="PINGO"></div><div class="text-hotspot" style="left:10.5%;top:90.97395833333334%;width:78.625%;height:1.0572916666666665%" data-text="WARNING: CONTINUED EXPOSURE TO CHAOS DAMAGE MAY CAUSE [CONFUSED] STATUS EFFECT." onclick="showTextTooltip(event,this)" data-translation="AVISO: EXPOSIÇÃO CONTINUADA AO DANO DE CAOS PODE CAUSAR O EFEITO DE STATUS [CONFUSO]."></div><div class="text-hotspot" style="left:27.375%;top:96.95833333333333%;width:30%;height:.15625%" data-text="B-BJORN..." onclick="showTextTooltip(event,this)" data-translation="B-BJORN..."></div><div class="text-hotspot" style="left:19.625%;top:99.046875%;width:29.375%;height:.7708333333333334%" data-text="TREMBLE TAP" onclick="showTextTooltip(event,this)" data-translation="TREMOR TAP"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:16.75%;top:.49479166666666663%;width:21.25%;height:.546875%" data-text="TREMBLE TAP" onclick="showTextTooltip(event,this)" data-translation="TREMOR TAP"></div><div class="text-hotspot" style="left:6.625%;top:6.953125%;width:39.625%;height:.953125%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:46%;top:9.296875%;width:51.37500000000001%;height:1.5989583333333335%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:.5%;top:12.760416666666666%;width:63.5%;height:1.9010416666666665%" data-text="THUM" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:16.5%;top:17.588541666666664%;width:79.875%;height:1.9427083333333335%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:25%;top:50.484375%;width:27.375%;height:.21875000000000003%" data-text="Y-YIKES!" onclick="showTextTooltip(event,this)" data-translation="A-AI!"></div><div class="text-hotspot" style="left:49.25%;top:53.234375%;width:26.5%;height:.7864583333333333%" data-text="THE BEAST IS HERE!!" onclick="showTextTooltip(event,this)" data-translation="A BESTA ESTÁ AQUI!!"></div><div class="text-hotspot" style="left:22.5%;top:54.63020833333333%;width:38.375%;height:.47395833333333337%" data-text="P-PLEASE DO SOMETHING!!" onclick="showTextTooltip(event,this)" data-translation="P-POR FAVOR, FAÇA ALGUMA COISA!!"></div><div class="text-hotspot" style="left:41.125%;top:60.93229166666667%;width:49.25%;height:1.2083333333333286%" data-text="DON'T TELL ME YOU'RE GOING TO RUN AWAY AND ABANDON US HERE...!" onclick="showTextTooltip(event,this)" data-translation="NÃO ME DIGA QUE VOCÊ VAI FUGIR E NOS ABANDONAR AQUI...!" data-tips="💡 A frase &quot;DON'T TELL ME YOU'RE GOING TO RUN AWAY&quot; pode ser vista como uma expressão de incredulidade ou preocupação. **Expressão idiomática**: &quot;Don't tell me&quot; é usado para expressar surpresa ou desagrado com algo que se suspeita ser verdade. - **Exemplo**: Don't tell me you forgot the meeting again!"></div><div class="text-hotspot" style="left:18%;top:62.588541666666664%;width:33.625%;height:.6822916666666643%" data-text="I DON'T WANT TO DIE YET...!" onclick="showTextTooltip(event,this)" data-translation="EU NÃO QUERO MORRER AINDA...!"></div><div class="text-hotspot" style="left:18.875%;top:69.3125%;width:58.875%;height:1.7864583333333286%" data-text="YOU TOOK ALL OF OUR EQUIPMENTS AND ITEMS! NOW DO YOUR JOB AND PROTECT US!" onclick="showTextTooltip(event,this)" data-translation="VOCÊS PEGARAM TODOS OS NOSSOS EQUIPAMENTOS E ITENS! AGORA FAÇAM SEU TRABALHO E NOS PROTEJAM!"></div><div class="text-hotspot" style="left:10.375%;top:75.80729166666667%;width:33.625%;height:1.0729166666666667%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:65%;top:77.03125%;width:32.375%;height:.9270833333333334%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:14.000000000000002%;top:79.234375%;width:8.75%;height:.06770833333333334%" data-text="ги" onclick="showTextTooltip(event,this)" data-translation="ги"></div><div class="text-hotspot" style="left:78.125%;top:80.421875%;width:5.625%;height:.0625%" data-text="~" onclick="showTextTooltip(event,this)" data-translation="~"></div><div class="text-hotspot" style="left:25.124999999999996%;top:83.59895833333333%;width:20.875%;height:.48958333333333337%" data-text="SIGH" onclick="showTextTooltip(event,this)" data-translation="SUSPIRO"></div><div class="text-hotspot" style="left:46.75%;top:83.953125%;width:40.625%;height:.7760416666666666%" data-text="SO IT HAS FINALLY COME TO THIS." onclick="showTextTooltip(event,this)" data-translation="ENTÃO FINALMENTE CHEGAMOS A ISSO." data-tips="💡 A frase &quot;SO IT HAS FINALLY COME TO THIS&quot; pode ser traduzida de forma mais natural como &quot;Então, finalmente chegamos a esse ponto&quot;. **Expressão**: &quot;Come to this&quot; é usado para indicar que uma situação chegou a um ponto crítico ou decisivo. - **Exemplo**: After all the discussions, it has come to this."></div><div class="text-hotspot" style="left:15.625%;top:85.140625%;width:53.25%;height:1.0520833333333428%" data-text="WE'RE GOING TO BE IN DEFICIT THIS MONTH BECAUSE OF THIS." onclick="showTextTooltip(event,this)" data-translation="VAMOS FICAR NO VERMELHO ESTE MÊS POR CAUSA DISSO." data-tips="💡 A expressão &quot;BE IN DEFICIT&quot; foi traduzida como &quot;FICAR NO VERMELHO&quot;. **Expressão idiomática**: &quot;Be in deficit&quot; é uma forma mais formal de dizer que algo está &quot;no vermelho&quot;, ou seja, em dívida ou com falta de recursos. - **Exemplo**: The company has been in deficit for the last two quarters."></div><div class="text-hotspot" style="left:17.25%;top:91.703125%;width:66.375%;height:1.1197916666666667%" data-text="RIAKIS, THE LORD OF CHAOS, IS HERE!!" onclick="showTextTooltip(event,this)" data-translation="RIAKIS, O SENHOR DO CAOS, ES
