="showTextTooltip(event,this)" data-translation="BRILHO"></div><div class="text-hotspot" style="left:16.5%;top:70.296875%;width:71.375%;height:1.2291666666666665%" data-text="WE WILL SAVE AS MANY PEOPLE AS WE CAN, AND RETURN ALL TOGETHER!" onclick="showTextTooltip(event,this)" data-translation="VAMOS SALVAR O MÁXIMO DE PESSOAS QUE PUDERMOS, E VOLTAR TODOS JUNTOS!" data-tips="💡 A estrutura &quot;AS MANY AS WE CAN&quot; foi traduzida como &quot;O MÁXIMO QUE PUDERMOS&quot;. **Estrutura gramatical**: &quot;As many as we can&quot; é usado para indicar a maior quantidade possível dentro de uma capacidade. - **Exemplo**: We will invite as many people as we can to the party."></div><div class="text-hotspot" style="left:30.125%;top:77.02604166666667%;width:26.125%;height:.421875%" data-text="...HA. THIS IS UNEXPECTED." onclick="showTextTooltip(event,this)" data-translation="...HA. ISSO É INESPERADO."></div><div class="text-hotspot" style="left:11.75%;top:81.06770833333333%;width:29.5%;height:.7291666666666666%" data-text="CULP" onclick="showTextTooltip(event,this)" data-translation="CULP"></div><div class="text-hotspot" style="left:20.625%;top:87%;width:58.25%;height:.921875%" data-text="THEY WERE REALLY PLANNING TO ENGAGE RIAKIS IN BATTLE." onclick="showTextTooltip(event,this)" data-translation="ELES ESTAVAM REALMENTE PLANEJANDO ENFRENTAR RIAKIS EM BATALHA."></div><div class="text-hotspot" style="left:23.5%;top:93.25520833333333%;width:53.375%;height:1.6145833333333286%" data-text="I WASN'T THE ONLY ONE TAKING THE WORST POSSIBLE SCENARIO INTO ACCOUNT." onclick="showTextTooltip(event,this)" data-translation="EU NÃO ERA O ÚNICO A LEVAR EM CONTA O PIOR CENÁRIO POSSÍVEL." data-tips="💡 A frase &quot;TAKING THE WORST POSSIBLE SCENARIO INTO ACCOUNT&quot; pode ser traduzida como &quot;LEVAR EM CONTA O PIOR CENÁRIO POSSÍVEL&quot;. **Expressão**: &quot;Take into account&quot; significa considerar ou levar em consideração algo. - **Exemplo**: We need to take into account the possibility of rain when planning the event."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/49/12.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:3.125%;top:3.0596503256770653%;width:44.125%;height:1.971203291052451%" data-text="GRIN" onclick="showTextTooltip(event,this)" data-translation="SORRISO"></div><div class="text-hotspot" style="left:29.5%;top:6.744943435035995%;width:41%;height:2.074048680150841%" data-text="AND I COULDN'T BE HAPPIER ABOUT IT." onclick="showTextTooltip(event,this)" data-translation="E EU NÃO PODERIA ESTAR MAIS FELIZ COM ISSO."></div><div class="text-hotspot" style="left:24.625%;top:17.063764141241002%;width:51.375%;height:3.453890983887554%" data-text="AFTER ALL, THESE GUYS HAVE GOTTEN THIS FAR BY FIGHTING COUNTLESS NUMBERS OF DANGEROUS BATTLES." onclick="showTextTooltip(event,this)" data-translation="AFINAL, ESSES CARAS CHEGARAM ATÉ AQUI LUTANDO CONTRA INÚMERAS BATALHAS PERIGOSAS." data-tips="💡 A frase &quot;AFTER ALL&quot; foi traduzida como &quot;AFINAL&quot;. **Conector**: &quot;After all&quot; é usado para justificar algo que foi dito anteriormente, oferecendo uma explicação ou razão. - **Exemplo**: We should trust her judgment; after all, she is the expert."></div><div class="text-hotspot" style="left:5%;top:21.160438806993486%;width:31.874999999999996%;height:1.405553651011313%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:61.75000000000001%;top:23.071648954405212%;width:34%;height:1.6112444292080905%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:29.625%;top:40.169694892012345%;width:27.875%;height:1.688378471031882%" data-text="IMP" onclick="showTextTooltip(event,this)" data-translation="IMP"></div><div class="text-hotspot" style="left:21.5%;top:45.08913267055193%;width:57%;height:2.631127
