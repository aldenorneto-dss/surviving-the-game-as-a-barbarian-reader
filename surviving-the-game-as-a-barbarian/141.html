t,this)" data-translation="+ [x29]"></div><div class="text-hotspot" style="left:47.875%;top:32.135416666666664%;width:36%;height:.9427083333333334%" data-text="THERE ARE OTHER CONDITIONS THAT ALSO MUST BE MET..." onclick="showTextTooltip(event,this)" data-translation="HÁ OUTRAS CONDIÇÕES QUE TAMBÉM DEVEM SER CUMPRIDAS..."></div><div class="text-hotspot" style="left:74.875%;top:33.71875%;width:22.125%;height:.28125%" data-text="BUT I'LL GET THERE LATER." onclick="showTextTooltip(event,this)" data-translation="MAS CHEGAREI LÁ MAIS TARDE."></div><div class="text-hotspot" style="left:7.249999999999999%;top:37.296875%;width:59.25%;height:.9791666666666643%" data-text="IN THE GAME, IT WAS A SPELL A TIER-1 ARCHMAGE HAD TO SACRIFICE THEMSELVES TO CAST." onclick="showTextTooltip(event,this)" data-translation="NO JOGO, ERA UM FEITIÇO QUE UM ARQUI-MAGO DE NÍVEL 1 TINHA QUE SE SACRIFICAR PARA LANÇAR."></div><div class="text-hotspot" style="left:58.5%;top:41.5%;width:37.375%;height:.47916666666666663%" data-text="I AM 150 YEARS INTO THE FUTURE SINCE THE TIMELINE I PLAYED." onclick="showTextTooltip(event,this)" data-translation="ESTOU 150 ANOS NO FUTURO DESDE A LINHA DO TEMPO QUE JOGUEI."></div><div class="text-hotspot" style="left:37.375%;top:46.682291666666664%;width:51.125%;height:.9583333333333333%" data-text="...THEN I MUST WONDER HOW MANY MAGES IN THIS ERA ARE ABLE TO CAST THIS SPELL." onclick="showTextTooltip(event,this)" data-translation="...ENTÃO DEVO ME PERGUNTAR QUANTOS MAGOS NESTA ERA SÃO CAPAZES DE LANÇAR ESSE FEITIÇO."></div><div class="text-hotspot" style="left:15.375%;top:48.505208333333336%;width:36.625%;height:.6927083333333334%" data-text="I WOULD SAY ABOUT 150, IF I'M BEING GENEROUS." onclick="showTextTooltip(event,this)" data-translation="EU DIRIA CERCA DE 150, SE EU FOR GENEROSO."></div><div class="text-hotspot" style="left:16.625%;top:52.93750000000001%;width:66.625%;height:.71875%" data-text="THE MORE I THINK ABOUT IT, THE CLEARER IT BECOMES. IT'S GOING TO BE ABSURDLY BRUTAL." onclick="showTextTooltip(event,this)" data-translation="QUANTO MAIS PENSO NISSO, MAIS CLARO FICA. VAI SER ABSURDAMENTE BRUTAL."></div><div class="text-hotspot" style="left:55.875%;top:58.47395833333333%;width:23.625%;height:.16666666666666669%" data-text="WHERE..." onclick="showTextTooltip(event,this)" data-translation="ONDE..."></div><div class="text-hotspot" style="left:28.000000000000004%;top:61.78125%;width:3.375%;height:.140625%" data-text="Fil" onclick="showTextTooltip(event,this)" data-translation="Fil"></div><div class="text-hotspot" style="left:31.25%;top:66.015625%;width:39.375%;height:.5104166666666666%" data-text="...DID YOU HEAR THAT?" onclick="showTextTooltip(event,this)" data-translation="...VOCÊ OUVIU ISSO?"></div><div class="text-hotspot" style="left:16.625%;top:71.16145833333334%;width:46.5%;height:.9583333333333333%" data-text="I OVERHEARD IT WHEN A KNIGHT GAVE ORDERS TO A SOLDIER." onclick="showTextTooltip(event,this)" data-translation="EU OUVI QUANDO UM CAVALEIRO DEU ORDENS A UM SOLDADO."></div><div class="text-hotspot" style="left:62.375%;top:73.21354166666667%;width:16.875%;height:.17708333333333331%" data-text="I SEE." onclick="showTextTooltip(event,this)" data-translation="ENTENDO."></div><div class="text-hotspot" style="left:42.25%;top:79.26041666666667%;width:45.25%;height:1.2083333333333286%" data-text="THEY'LL OBVIOUSLY TAKE THE KNIGHTS AND THE BEST ADVENTURERS FROM LARGE CLANS." onclick="showTextTooltip(event,this)" data-translation="ELES OBVIAMENTE VÃO LEVAR OS CAVALEIROS E OS MELHORES AVENTUREIROS DE GRANDES CLÃS."></div><div class="text-hotspot" style="left:17.25%;top:81.22395833333333%;width:49%;height:1.1979166666666714%" data-text="BUT THAT WILL LEAD TO THE DEATHS OF AT LEAST TENS OF THOUSANDS OF ADVENTURERS." onclick="showTextTooltip(event,this)" data-translation="MAS ISSO VAI LEVAR À MORTE DE PELO MENOS DEZENAS DE MILHARES DE AVENTUREIROS."></div><div class="text-hotspot" style="left:19.25%;top:86.651041666 ata-translation="VOCÊ! EU DISSE PARA SAIR DA FRENTE!"></div><div class="text-hotspot" style="left:34.875%;top:92.30208333333333%;width:53.125%;height:1.4739583333333335%" data-text="WHEW, I'M GLAD IT WASN'T WHERE MS. KARLSTEIN AND OTHERS WENT TO SEARCH." onclick="showTextTooltip(event,this)" data-translation="UFA, AINDA BEM QUE NÃO FOI PARA ONDE A SRTA. KARLSTEIN E OS OUTROS FORAM PROCURAR."></div><div class="text-hotspot" style="left:17.5%;top:98.28125%;width:49.625%;height:1.2395833333333333%" data-text="I DON'T UNDERSTAND WHY THEY'RE KILLING ALL OF THEM, WHEN THEY'RE PLANNING TO ABANDON THE REST OF THE LOT. IT'S NOT LIKE THE LORD OF THE FIRST FLOOR YIELDS GOOD LOOT." onclick="showTextTooltip(event,this)" data-translation="NÃO ENTENDO POR QUE ELES ESTÃO MATANDO TODOS, SE PLANEJAM ABANDONAR O RESTO DO GRUPO. NÃO É COMO SE O SENHOR DO PRIMEIRO ANDAR DESSE UM BOM SAQUE."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/141/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:4.625%;top:.484375%;width:32.25%;height:.671875%" data-text="I DON'T UNDERSTAND WHY THEY'RE KILLING ALL OF THEM, WHEN THEY'RE PLANNING TO ABANDON THE REST OF THE LOT. IT'S NOT LIKE THE LORD OF THE FIRST FLOOR YIELDS GOOD LOOT." onclick="showTextTooltip(event,this)" data-translation="NÃO ENTENDO POR QUE ELES ESTÃO MATANDO TODOS, SE PLANEJAM ABANDONAR O RESTO DO GRUPO. NÃO É COMO SE O SENHOR DO PRIMEIRO ANDAR DESSE UM BOM SAQUE."></div><div class="text-hotspot" style="left:14.75%;top:6.130208333333333%;width:41.25%;height:1.21875%" data-text="MAYBE THEY'RE DOING THAT TO GIVE OFF AN IMPRESSION THAT THEY'RE TRYING," onclick="showTextTooltip(event,this)" data-translation="TALVEZ ELES ESTEJAM FAZENDO ISSO PARA DAR A IMPRESSÃO DE QUE ESTÃO TENTANDO,"></div><div class="text-hotspot" style="left:37.375%;top:7.916666666666666%;width:44%;height:1.2135416666666665%" data-text="SO THAT WE DON'T FIND OUT THAT WE'RE GOING TO BE ABANDONED LATER ON." onclick="showTextTooltip(event,this)" data-translation="PARA QUE NÃO DESCUBRAMOS QUE VAMOS SER ABANDONADOS MAIS TARDE."></div><div class="text-hotspot" style="left:26.25%;top:13.84375%;width:47.75%;height:.6927083333333334%" data-text="...THIS WORKS. NO ONE ELSE HAS TO NERVOUSLY SUSPECT THE LEADERS." onclick="showTextTooltip(event,this)" data-translation="...ISSO FUNCIONA. NINGUÉM MAIS PRECISA SUSPEITAR NERVOSAMENTE DOS LÍDERES."></div><div class="text-hotspot" style="left:50.74999999999999%;top:19.286458333333336%;width:32.12500000000001%;height:.6874999999999964%" data-text="MY ONLY CONCERN WAS THIS." onclick="showTextTooltip(event,this)" data-translation="MINHA ÚNICA PREOCUPAÇÃO ERA ESSA."></div><div class="text-hotspot" style="left:18.5%;top:25.244791666666664%;width:38%;height:.6927083333333334%" data-text="WHAT CAN WE DO FOR US TO SURVIVE ALL TOGETHER?" onclick="showTextTooltip(event,this)" data-translation="O que podemos fazer para sobrevivermos todos juntos?"></div><div class="text-hotspot" style="left:43.5%;top:37.026041666666664%;width:47%;height:.6770833333333334%" data-text="I IMAGINED THE WORST CASE SCENARIO EVERY MOMENT..." onclick="showTextTooltip(event,this)" data-translation="Imaginei o pior cenário possível a cada momento..."></div><div class="text-hotspot" style="left:11.75%;top:42.828125%;width:44.75%;height:.6927083333333334%" data-text="...AND REVIEWED THOUSANDS OF PLANS OVER AND OVER." onclick="showTextTooltip(event,this)" data-translation="...e revisei milhares de planos várias e várias vezes."></div><div class="text-hotspot" style="left:15.25%;top:47.760416666666664%;width:70%;height:1.1041666666666667%" data-text="THE STRATEGY HAS TO BE INCH PERFECT FOR US ALL TO MAKE IT." onclick="showTextTooltip(event,this)" data-translation="A estratégia tem que ser perfeita para que todos nós consigamos."></div><div class="text-hotspot" style="left:21.5%;top:57.09375%;width:31.125000000000004%;height:.7083333333333333%" d
