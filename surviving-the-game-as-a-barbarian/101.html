dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/101/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:29.875%;top:3.296875%;width:40.25%;height:.21875000000000003%" data-text="ROTMILLER." data-translation="ROTMILLER." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:1%;top:8.921875%;width:81%;height:1.65625%" data-text="SLAM" data-translation="SLAM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.375%;top:15.239583333333334%;width:61.375%;height:.765625%" data-text="I HOPE THERE IS A REASON WHY YOU'RE INSULTING ME." data-translation="Espero que haja uma razão para você estar me insultando." onclick="showTextTooltip(event,this)" data-tips="💡 &quot;Espero que haja uma razão para você estar me insultando.&quot; é uma estrutura comum para expressar expectativa ou desejo. **&quot;I hope&quot;** é frequentemente usado para expressar esperança ou desejo em relação ao futuro. - **I hope you have a good day.** - **I hope they arrive on time.**"></div><div class="text-hotspot" style="left:31.125000000000004%;top:18.427083333333332%;width:23%;height:.5104166666666666%" data-text="GRIND" data-translation="GRIND" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:38.25%;top:20.713541666666664%;width:17.875%;height:.33333333333333337%" data-text="CHUCKLE" data-translation="RISADA" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.250000000000004%;top:24.473958333333336%;width:40.125%;height:1.2239583333333333%" data-text="I WOULD HAVE THOUGHT YOU WERE TRULY UPSET BY THIS QUESTION..." data-translation="Eu teria pensado que você estava realmente chateado com essa pergunta..." onclick="showTextTooltip(event,this)" data-tips="💡 A expressão **&quot;I would have thought&quot;** é usada para indicar uma suposição que se mostrou errada. É uma forma de expressar surpresa ou correção de uma expectativa. - **I would have thought she was older.** - **I would have thought they knew each other.**"></div><div class="text-hotspot" style="left:23.125%;top:30.213541666666664%;width:53.875%;height:.8177083333333393%" data-text="...IF I HADN'T KNOWN YOU BETTER." data-translation="...se eu não te conhecesse melhor." onclick="showTextTooltip(event,this)" data-tips="💡 A estrutura **&quot;if I hadn't known you better&quot;** é um exemplo de condicional no passado, expressando uma hipótese não realizada. - **If I hadn't seen it, I wouldn't have believed it.** - **If I hadn't been there, I wouldn't have understood.**"></div><div class="text-hotspot" style="left:30.125%;top:41.739583333333336%;width:38.75%;height:.6770833333333334%" data-text="ROTMILLER KNEW ME WAY TOO WELL..." data-translation="Rotmiller me conhecia bem demais..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15%;top:44.84375%;width:48.5%;height:1.2083333333333333%" data-text="YOU'RE NOT THE TYPE OF PERSON TO LET HONOR OR FORMALITIES GET IN YOUR WAY..." data-translation="Você não é do tipo que deixa honra ou formalidades atrapalharem..." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;You're not the type of person to...&quot;** é uma forma de descrever características ou comportamentos esperados de alguém. - **You're not the type of person to give up easily.** - **He's not the type of person to lie.**"></div><div class="text-hotspot" style="left:39.375%;top:46.348958333333336%;width:45.25%;height:1.4791666666666572%" data-text="...NOR ARE YOU IMPATIENT ENOUGH TO LET YOUR EMOTIONS GET THE BETTER OF YOU." data-translation="...nem é impaciente o suficiente para deixar suas emoções tomarem conta de você." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;Nor are you...&quot;** é uma estrutura usada para adicionar informações negativas, similar a &quot;nem&quot; em português. - **Nor do I want to go there.** - **Nor does she agree with that.**"></div><div class="text-hotspot" style="left:30.875000000000004%;top:53.885416666666664%;width:38.125%;height:.4322916666666667%" data-text="TO BE FOOLED BY MY THEATRICS." data-translation="Para ser enganado pelo meu teatro." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:51.74999999999999%;top:56.56250000000001%;width:41.625%;height:.8072916666666667%" data-text="CLENCY" data-translation="CLENCY" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:14.499999999999998%;top:63.98437500000001%;width:45.625%;height:.9583333333333333%" data-text="THE CHEATCODE OF SWEARING ON MY HONOR AS A WARRIOR WOULDN'T WORK." data-translation="O truque de jurar pela minha honra como guerreiro não funcionaria." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:5.75%;top:65.97916666666667%;width:34.25%;height:.8750000000000001%" data-text="GRIN" data-translation="SORRISO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:58.62500000000001%;top:69.71875%;width:28.249999999999993%;height:.4322916666666714%" data-text="AM I WRONG...?" data-translation="Estou errado...?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:32.5%;top:73.95833333333334%;width:34.875%;height:.6875%" data-text="I HAD TO TAKE A DIFFERENT APPROACH." data-translation="Tive que adotar uma abordagem diferente." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;I had to take a different approach.&quot;** usa o passado simples para indicar uma ação necessária que foi realizada. **&quot;Take a different approach&quot;** é uma expressão comum para mudar a estratégia ou método. - **We have to take a different approach to solve this problem.** - **Let's take a different approach to handle the situation.**"></div><div class="text-hotspot" style="left:34.75%;top:79.18229166666667%;width:55.75%;height:.703125%" data-text="...EVEN I GET UPSET TO HEAR THAT FROM A COMPANION." data-translation="...até eu fico chateado ao ouvir isso de um companheiro." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:34.125%;top:87.21875%;width:18.5%;height:.4322916666666572%" data-text="THAT'S TRUE," data-translation="É verdade," onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:51.24999999999999%;top:88.47395833333334%;width:15.75%;height:.16666666666666669%" data-text="BUT..." data-translation="mas..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:11.375%;top:93.11979166666666%;width:44.875%;height:.984375%" data-text="GULP" data-translation="ENGOLIR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:56.375%;top:96.79166666666667%;width:42.375%;height:.9427083333333334%" data-text="GULP" data-translation="ENGOLIR" onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/101/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:2.5%;top:1.7031250000000002%;width:34.875%;height:1.1822916666666667%" data-text="AH" data-translation="AH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:26.5%;top:8.182291666666666%;width:46.875%;height:.5729166666666666%" data-text="... YOU'RE TOO SPECIAL." data-translation="...você é especial demais." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:3.75%;top:15.770833333333334%;width:25.624999999999996%;height:.7760416666666666%" data-text="TAP" data-translation="TAP" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:51%;top:20.5%;width:29.625%;height:.18229166666666666%" data-text="A BARBARIAN..." data-translation="Um bárbaro..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22%;top:22.072916666666668%;width:27.750000000000004%;height:.4479166666666667%" data-text="...WHO READS BOOKS..." data-translation="...que lê livros..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.375%;top:26.895833333333336%;width:13%;height:.640625%" data-text="M" data-translation="M" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.5%;top:31.171875%;width:37.25%;height:.703125%" data-text="...DOES NOT GET OVERWHELMED BY EMOTIONS," data-translation="...não se deixa dominar pelas emoções," onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.625%;top:32.630208333333336%;width:57.62500000000001%;height:.953125%" data-text="AND KNOWS THINGS THAT AN ADVENTURER WITH ONE YEAR OF EXPERIENCE CANNOT POSSIBLY KNOW." data-translation="e sabe coisas que um aventureiro com um ano de experiência não poderia saber." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;Cannot possibly know&quot;** enfatiza a impossibilidade de algo ser conhecido. Essa estrutura é usada para enfatizar a certeza de que algo não é possível. - **He cannot possibly finish all that work by tomorrow.** - **They cannot possibly be serious.**"></div><div class="text-hotspot" style="left:16%;top:38.015625%;width:56.625%;height:1.484375%" data-text="YOU SAID YOU HEARD A DIVINE MESSAGE FROM THE ANCESTOR GOD AFTER LEAVING THAT MAZE." data-translation="Você disse que ouviu uma mensagem divina do Deus Ancestral depois de sair daquele labirinto." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:7.875%;top:40.33333333333333%;width:26.25%;height:.5416666666666667%" data-text="UHM" data-translation="UHM" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:59.62499999999999%;top:41.55729166666667%;width:30.375000000000004%;height:.7083333333333333%" data-text="SCRATCH" data-translation="COÇAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.125%;top:44.895833333333336%;width:49.875%;height:.953125%" data-text="BUT LET'S BE HONEST HERE. WHO WOULD BELIEVE THAT?" data-translation="Mas sejamos honestos aqui. Quem acreditaria nisso?" onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;Let's be honest here.&quot;** é uma expressão usada para introduzir uma opinião franca ou direta, muitas vezes usada para preparar o ouvinte para uma verdade potencialmente desconfortável. - **Let's be honest here, we need to work harder.** - **Let's be honest here, it wasn't your best performance.**"></div><div class="text-hotspot" style="left:27.750000000000004%;top:49.453125%;width:31.5%;height:.4479166666666667%" data-text="I COULDN'T, EITHER." data-translation="Eu também não poderia." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.875%;top:50.817708333333336%;width:40%;height:.9583333333333333%" data-text="THAT'S WHY I HAD THOUGHT YOU COULD BE AN EVIL SPIRIT." data-translation="Por isso pensei que você poderia ser um espírito maligno." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;That's why I had thought&quot;** usa o passado perfeito para explicar a razão de uma conclusão anterior. - **That's why I had believed it was true.** - **That's why I had assumed she was coming.**"></div><div class="text-hotspot" style="left:15.875%;top:57.71354166666667%;width:45.75%;height:.953125%" data-text="YOU HAD THOUGHT? SO YOU DON'T THINK SO ANYMORE?" data-translation="Você pensou? Então não pensa mais assim?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.625%;top:62.88541666666667%;width:58.75%;height:1.4739583333333335%" data-text="ACCORDING TO THE BOOK I READ, AN EVIL SPIRIT TREATS EVERYONE ELSE AS PUPPETS THEY COULD MANIPULATE." data-translation="De acordo com o livro que li, um espírito maligno trata todos os outros como marionetes que pode manipular." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:48.25%;top:65.046875%;width:36%;height:.45312499999999994%" data-text="YOU ARE NOT LIKE THAT." data-translation="Você não é assim." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23%;top:67.26041666666667%;width:39.375%;height:.96875%" data-text="OH, R-RIGHT. I FORGOT TO APOLOGIZE... I AM SO SORRY." data-translation="Ah, c-certo. Esqueci de me desculpar... sinto muito." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;I forgot to apologize... I am so sorry.&quot;** é uma maneira educada de expressar arrependimento por um esquecimento. **&quot;I am so sorry&quot;** é uma forma enfática de pedir desculpas. - **I forgot to call you back. I am so sorry.** - **I forgot to bring the documents. I am so sorry.**"></div><div class="text-hotspot" style="left:40.125%;top:68.77604166666667%;width:47%;height:1.2083333333333333%" data-text="I THOUGHT YOU WERE AN NPC... I WOULDN'T HAVE DONE THIS HAD I KNOWN...!" data-translation="Achei que você fosse um NPC... eu não teria feito isso se soubesse...!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.375%;top:74.73958333333334%;width:36.875%;height:1.21875%" data-text="COME TO THINK OF IT, THAT WOMAN SAID SOMETHING LIKE THAT." data-translation="Pensando bem, aquela mulher disse algo assim." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.875%;top:80.28645833333333%;width:60.75%;height:.9635416666666572%" data-text="BESIDES, THE GODDESS OF THE STAR GAVE YOU A DIVINE PROPHECY." data-translation="Além disso, a Deusa da Estrela te deu uma profecia divina." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;Besides, the goddess of the star gave you a divine prophecy.&quot;** usa **&quot;besides&quot;** para adicionar uma informação extra ou justificativa. - **Besides, we don't have enough time.** - **Besides, it's too expensive.**"></div><div class="text-hotspot" style="left:21.25%;top:88.390625%;width:55.125%;height:1.2031249999999858%" data-text="HOW CAN I DOUBT SOMETHING I'VE CLEARLY SEEN WITH MY OWN TWO EYES?" data-translation="Como posso duvidar de algo que vi claramente com meus próprios olhos?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:51.87500000000001%;top:91.66145833333333%;width:4.375%;height:.14583333333333334%" data-text="U" data-translation="U" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.25%;top:91.81770833333334%;width:33.875%;height:.75%" data-text="WHEW, THAT SAVED MY LIFE." data-translation="Ufa, isso salvou minha vida." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;Whew, that saved my life.&quot;** usa **&quot;whew&quot;** como uma interjeição para expressar alívio. **&quot;Saved my life&quot;** é uma expressão que pode ser usada de forma literal ou figurativa para algo que teve um impacto positivo significativo. - **Whew, that was close!** - **Whew, I'm glad it's over.**"></div><div class="text-hotspot" style="left:18.625%;top:97.20833333333333%;width:49.375%;height:1.0572916666666665%" data-text="THAT HELPED ME REALIZE HOW NARROW-MINDED I HAD BEEN." data-translation="Isso me ajudou a perceber o quão mente fechada eu tinha sido." onclick="showTextTooltip(event,this)" data-tips="💡 **&quot;That helped me realize how narrow-minded I had been.&quot;** usa o passado perfeito para indicar uma mudança de perspectiva ou entendimento. **&quot;Narrow-minded&quot;** é um adjetivo para descrever alguém com uma visão limitada ou preconceituosa. - **That helped me realize how wrong I was.** - **That helped me realize how important it is.**"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/101/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:7.5%;top:5.177083333333334%;width:71.125%;height:1.614583333333333%" data-text="I HAD PROBABLY SUSPECTED YOU OF BEING AN EVIL SPIRIT, BECAUSE I LET COMMON SENSE CLOUD MY JUDGMENT." onclick="showTextTooltip(event,this)" data-translation="Provavelmente suspeitei que você fosse um espírito maligno porque deixei o senso comum nublar meu julgamento." data-tips="💡 **&quot;I let common sense cloud my judgment.&quot;** usa a metáfora de &quot;nublar&quot; o julgamento para descrever como algo pode obscurecer ou distorcer a percepção. - **Don't let emotions cloud your judgment.** - **Don't let fear cloud your decision.**"></div><div class="text-hotspot" style="left:40.5%;top:8.213541666666666%;width:41.375%;height:1.1875%" data-text="YOU JUDGED RIGHT, BUT I CAN'T SAY THAT... し" onclick="showTextTooltip(event,this)" data-translation="Você julgou certo, mas eu não posso dizer isso... し"></div><div class="text-hotspot" style="left:26.625%;top:12.432291666666668%;width:47.125%;height:1.2083333333333304%" data-text="THERE DEFINITELY ARE INDIVIDUALS CHERISHED AND FAVORED BY THE GODS." onclick="showTextTooltip(event,this)" data-translation="Definitivamente existem indivíduos queridos e favorecidos pelos deuses."></div><div class="text-hotspot" style="left:10.75%;top:17.578125%;width:45.375%;height:1.2135416666666643%" data-text="THE KIND KNOWN AS HEROES IN THE HISTORY OF THIS WORLD." onclick="showTextTooltip(event,this)" data-translation="Do tipo conhecido como heróis na história deste mundo."></div><div class="text-hotspot" style="left:62.74999999999999%;top:26.864583333333332%;width:25.5%;height:.7083333333333333%" data-text="...YOU'RE TAKING IT TOO FAR." onclick="showTextTooltip(event,this)" data-translation="...Você está exagerando."></div><div class="text-hotspot" style="left:5.125%;top:30.046875%;width:52.37500000000001%;height:2.078125%" data-text="CHUCK YOU HAVE THE TENDENCY TO UNDERESTIMATE YOURSELF." onclick="showTextTooltip(event,this)" data-translation="Chuck, você tem a tendência de se subestimar." data-warning="1"></div><div class="text-hotspot" style="left:37.375%;top:36.16666666666667%;width:37.25%;height:.953125%" data-text="I HONESTLY B
