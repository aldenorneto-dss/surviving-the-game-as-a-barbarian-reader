pot" style="left:23.875%;top:4.494791666666666%;width:52.625%;height:.8385416666666666%" data-text="PATHETIC ATTEMPT. YOU WON'T FOOL US." onclick="showTextTooltip(event,this)" data-translation="Tentativa patética. Você não vai nos enganar."></div><div class="text-hotspot" style="left:15.25%;top:20.703125%;width:70.625%;height:1.421875%" data-text="IF YOU THOUGHT WE'D LET YOU IN JUST BECAUSE YOU LOOK INJURED, THINK AGAIN." onclick="showTextTooltip(event,this)" data-translation="Se você achou que deixaríamos você entrar só porque parece ferido, pense de novo."></div><div class="text-hotspot" style="left:70.125%;top:25.34375%;width:23.25%;height:.18229166666666666%" data-text="...WHAT?" onclick="showTextTooltip(event,this)" data-translation="...O quê?"></div><div class="text-hotspot" style="left:37%;top:34.984375%;width:48.375%;height:.9479166666666643%" data-text="WE'RE NOT ENEMIES! HERE, I HAVE THE MARK--" onclick="showTextTooltip(event,this)" data-translation="Não somos inimigos! Aqui, eu tenho a marca--"></div><div class="text-hotspot" style="left:40.25%;top:42.53125%;width:38.25%;height:.7031250000000071%" data-text="WAIT A MINUTE. I DIDN'T BRING MY ARM." onclick="showTextTooltip(event,this)" data-translation="Espere um minuto. Eu não trouxe meu braço."></div><div class="text-hotspot" style="left:20.875%;top:47.39583333333333%;width:41.75%;height:.9427083333333334%" data-text="...I DON'T HAVE IT, BUT EVERYONE ELSE HERE DOES." onclick="showTextTooltip(event,this)" data-translation="...Eu não tenho, mas todos os outros aqui têm."></div><div class="text-hotspot" style="left:10.375%;top:54.364583333333336%;width:71%;height:1.4739583333333357%" data-text="HA, YOU SHOW UP THROUGH THE ROUTE FULL OF NOARK BASTARDS AND EXPECT US TO BELIEVE THAT?" onclick="showTextTooltip(event,this)" data-translation="Ha, você aparece pela rota cheia de desgraçados de Noark e espera que acreditemos nisso?"></div><div class="text-hotspot" style="left:61.5%;top:56.494791666666664%;width:18.125%;height:.11979166666666666%" data-text="RIDICULOUS." onclick="showTextTooltip(event,this)" data-translation="Ridículo."></div><div class="text-hotspot" style="left:21.125%;top:59.901041666666664%;width:50.375%;height:.6979166666666643%" data-text="HONESTLY, I WOULD HAVE THOUGHT THE SAME." onclick="showTextTooltip(event,this)" data-translation="Honestamente, eu teria pensado o mesmo."></div><div class="text-hotspot" style="left:43.75%;top:62.041666666666664%;width:43.25%;height:.4739583333333357%" data-text="HERE, THIS RRRRING!" onclick="showTextTooltip(event,this)" data-translation="Aqui, este anel!"></div><div class="text-hotspot" style="left:70%;top:67.29166666666667%;width:6.5%;height:.15104166666666666%" data-text="\1/" onclick="showTextTooltip(event,this)" data-translation="\1/"></div><div class="text-hotspot" style="left:26.5%;top:69.98958333333334%;width:51.625%;height:.75%" data-text="SOME KNIGHT WE RAN INTO GAVE IT TO USSSS!" onclick="showTextTooltip(event,this)" data-translation="Algum cavaleiro que encontramos nos deu!"></div><div class="text-hotspot" style="left:56.875%;top:71.48958333333333%;width:33.125%;height:.4531250000000142%" data-text="IT SHOULD PROVE OUR IDENTITY, HE SAID..." onclick="showTextTooltip(event,this)" data-translation="Ele disse que deveria provar nossa identidade..."></div><div class="text-hotspot" style="left:6.625%;top:74.30208333333333%;width:24.75%;height:.8958333333333334%" data-text="\\/" onclick="showTextTooltip(event,this)" data-translation="\\/"></div><div class="text-hotspot" style="left:21.75%;top:75.71354166666666%;width:53.5%;height:.7708333333333334%" data-text="HUH? THAT'S... SIR GARFIZEL'S MESSENGER RING." onclick="showTextTooltip(event,this)" data-translation="Hã? Esse é... o anel mensageiro do Sir Garfizel."></div><div class="text-hotspot" style="left:21.125%;top:82.27083333333334%;width:32.875%;height:.4270833333333144%" data-text="MESSENGER RING?" onclick="showTextTooltip(event,this)" data-translation="Anel mensageiro?"></div><div class="text-hotspot" style="left:21.625%;top:93.765625%;width:30.875000000000004%;height:1.0208333333333333%" data-text="GLOW" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.875%;top:97.89583333333334%;width:20.625%;height:.17708333333333331%" data-text="I SEE..." onclick="showTextTooltip(event,this)" data-translation="Entendi..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/139/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20.75%;top:2.34375%;width:58.375%;height:.7552083333333334%" data-text="HE SAYS &quot;CORPSE COLLECTOR IS NEAR THE PORTAL.&quot;" onclick="showTextTooltip(event,this)" data-translation="Ele diz &quot;O Coletor de Cadáveres está perto do portal.&quot;"></div><div class="text-hotspot" style="left:32.625%;top:9.317708333333332%;width:50%;height:.9583333333333333%" data-text="THAT'S WHY IT'S CALLED THE MESSENGER RING. I THOUGHT HE WAS BEING OVERLY KIND..." onclick="showTextTooltip(event,this)" data-translation="É por isso que é chamado de anel mensageiro. Achei que ele estava sendo exageradamente gentil..."></div><div class="text-hotspot" style="left:28.875%;top:14.177083333333334%;width:42.375%;height:.4427083333333333%" data-text="HE WANTED TO SHARE THIS BIT OF INTEL." onclick="showTextTooltip(event,this)" data-translation="Ele queria compartilhar essa informação."></div><div class="text-hotspot" style="left:20.5%;top:21.359375%;width:58.5%;height:.7083333333333333%" data-text="IF IT GETS DELIVERED, GREAT. IF NOT, IT'S JUST THE LOSS OF ONE RING." onclick="showTextTooltip(event,this)" data-translation="Se for entregue, ótimo. Se não, é apenas a perda de um anel."></div><div class="text-hotspot" style="left:21.125%;top:27.65625%;width:36.125%;height:.6875%" data-text="EXCEPT HE COULD HAVE JUST TOLD ME THAT." onclick="showTextTooltip(event,this)" data-translation="Exceto que ele poderia ter simplesmente me contado isso."></div><div class="text-hotspot" style="left:49.75%;top:29.125%;width:26.375%;height:.15625%" data-text="I FEEL TRICKED." onclick="showTextTooltip(event,this)" data-translation="Me sinto enganado."></div><div class="text-hotspot" style="left:46.25%;top:31.067708333333332%;width:43.375%;height:.7083333333333333%" data-text="LITTLE VALCAN... BJORN, SON OF YANDEL." onclick="showTextTooltip(event,this)" data-translation="Pequeno Valcan... Bjorn, filho de Yandel."></div><div class="text-hotspot" style="left:18.375%;top:35.16666666666667%;width:47.25%;height:.7760416666666666%" data-text="YOU'RE CLEARLY NOT AFFILIATED WITH NOARK." onclick="showTextTooltip(event,this)" data-translation="Você claramente não é afiliado a Noark."></div><div class="text-hotspot" style="left:32.625%;top:36.911458333333336%;width:54.87499999999999%;height:1.046875%" data-text="I DON'T UNDERSTAND HOW YOU FOUGHT YOUR WAY THROUGH..." onclick="showTextTooltip(event,this)" data-translation="Eu não entendo como você conseguiu passar por tudo isso..."></div><div class="text-hotspot" style="left:63.5%;top:38.96354166666667%;width:36.375%;height:1.6041666666666665%" data-text="EWOOMP" onclick="showTextTooltip(event,this)" data-translation="EWOOMP"></div><div class="text-hotspot" style="left:27%;top:47.401041666666664%;width:45.625%;height:.6458333333333334%" data-text="...BUT YOU MAY ENTER." onclick="showTextTooltip(event,this)" data-translation="...mas você pode entrar."></div><div class="text-hotspot" style="left:13%;top:53.21875%;width:67.125%;height:6.645833333333336%" data-text="THANK GOODNESS. IS THERE A PRIEST AMONG YOU? 園 LIFT" onclick="showTextTooltip(event,this)" data-translation="Graças a Deus. Há um sacerdote entre vocês?"></div><div class="text-hotspot" style="left:45.25%;top:60.130208333333336%;width:39.125%;height:.9635416666666572%" data-text="YEAH. GET YOURSELF SEEN RIGHT AWAY." onclick="showTextTooltip(event,this)" data-translation="Sim. Vá se cuidar imediatamente."></div><div class="text-hotspot" style="left:39%;top:64.98958333333333%;width:46.75%;height:1.21875%" data-text="WE'LL TAKE YOUR PARTY MEMBERS TO THE TEMPORARY INFIRMARY." onclick="showTextTooltip(event,this)" data-translation="Levaremos seus companheiros para a enfermaria temporária."></div><div class="text-hotspot" style="left:56.00000000000001%;top:66.86458333333334%;width:19%;height:.45312499999999994%" data-text="NOD" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:61.25000000000001%;top:69.13541666666667%;width:18.625%;height:.5208333333333333%" data-text="NOD" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.25%;top:69.21875%;width:36.875%;height:1.6666666666666667%" data-text="G" onclick="showTextTooltip(event,this)" data-translation="G"></div><div class="text-hotspot" style="left:55.25%;top:75.45833333333334%;width:30.5%;height:.4322916666666572%" data-text="...WHAT ABOUT ME?" onclick="showTextTooltip(event,this)" data-translation="...E quanto a mim?"></div><div class="text-hotspot" style="left:13.5%;top:78.60416666666666%;width:15%;height:.13541666666666669%" data-text="THIS WAY" onclick="showTextTooltip(event,this)" data-translation="Por aqui"></div><div class="text-hotspot" style="left:27%;top:82.796875%;width:39.375%;height:.4479166666666667%" data-text="WE MUST TALK TO YOU FIRST." onclick="showTextTooltip(event,this)" data-translation="Precisamos falar com você primeiro."></div><div class="text-hotspot" style="left:46.125%;top:87.453125%;width:35.25%;height:.6822916666666666%" data-text="SO BE IT. GO. I SHOULD BE ALRIGHT." onclick="showTextTooltip(event,this)" data-translation="Que assim seja. Vão. Eu devo ficar bem."></div><div class="text-hotspot" style="left:26.625%;top:95.15625%;width:23.25%;height:.421875%" data-text="BUT YOU'RE--" onclick="showTextTooltip(event,this)" data-translation="Mas você está--"></div><div class="text-hotspot" style="left:50.375%;top:96.625%
