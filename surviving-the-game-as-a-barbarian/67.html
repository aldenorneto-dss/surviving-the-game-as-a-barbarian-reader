es como &quot;He may be at home now.&quot;."></div><div class="text-hotspot" style="left:31.75%;top:17.302083333333336%;width:36.75%;height:.27083333333333337%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO..."></div><div class="text-hotspot" style="left:4.5%;top:27.661458333333332%;width:32.375%;height:.84375%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:16.25%;top:29.421874999999996%;width:28.249999999999996%;height:.703125%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:18.125%;top:31.25%;width:64.25%;height:1.484375%" data-text="...IT HAS SERVED AS A CLEAR MOTIVATION FOR HER TO MAKE IMMENSE PROGRESS AS AN ADVENTURER." onclick="showTextTooltip(event,this)" data-translation="...SERVIU COMO UMA MOTIVAÇÃO CLARA PARA ELA FAZER UM PROGRESSO IMENSO COMO AVENTUREIRA." data-tips="💡 A construção &quot;it has served as&quot; indica que algo funcionou ou foi usado como uma certa função ou propósito. - &quot;It has served as a motivation&quot; significa que algo foi uma motivação. - Você pode usar essa estrutura em frases como &quot;The book has served as a guide for many students.&quot;."></div><div class="text-hotspot" style="left:5%;top:36.046875%;width:57.49999999999999%;height:1.0625%" data-text="IN THE MEANTIME, ERWEN MADE A CONTRACT WITH ALL FOUR KINDS OF SPIRIT ELEMENTALS," onclick="showTextTooltip(event,this)" data-translation="ENQUANTO ISSO, ERWEN FEZ UM CONTRATO COM TODOS OS QUATRO TIPOS DE ELEMENTAIS ESPIRITUAIS," data-tips="💡 &quot;In the meantime&quot; é uma expressão que significa **enquanto isso** ou **nesse meio tempo**, usada para indicar que algo acontece simultaneamente a outra ação. - &quot;In the meantime, I'll prepare dinner.&quot; - É útil para conectar eventos que ocorrem ao mesmo tempo."></div><div class="text-hotspot" style="left:24.25%;top:37.828125%;width:67.875%;height:.765625%" data-text="AND SUCCESSFULLY AWAKENED THREE OF THEM, TURNING THEM INTO SPIRITS WITH FREE WILL." onclick="showTextTooltip(event,this)" data-translation="E DESPERTOU COM SUCESSO TRÊS DELES, TRANSFORMANDO-OS EM ESPÍRITOS COM VONTADE PRÓPRIA."></div><div class="text-hotspot" style="left:20.875%;top:49.182291666666664%;width:57.75%;height:1.359375%" data-text="I'LL BE HONEST. IT'S DIFFICULT TO FATHOM HOW HER POTENTIAL HAD REMAINED DORMANT FOR SO LONG." onclick="showTextTooltip(event,this)" data-translation="SEREI HONESTO. É DIFÍCIL ENTENDER COMO O POTENCIAL DELA FICOU DORMENTE POR TANTO TEMPO." data-tips="💡 &quot;Difficult to fathom&quot; é uma expressão que significa **difícil de entender**. &quot;Fathom&quot; é um verbo usado para descrever o ato de compreender algo profundamente. - &quot;It's difficult to fathom why he left.&quot; - Pode ser usado em contextos onde a compreensão total de uma situação é complexa."></div><div class="text-hotspot" style="left:20%;top:53.994791666666664%;width:25.624999999999996%;height:.13020833333333331%" data-text="THAT'S NOT ALL." onclick="showTextTooltip(event,this)" data-translation="ISSO NÃO É TUDO."></div><div class="text-hotspot" style="left:21.5%;top:54.494791666666664%;width:56.875%;height:.9479166666666643%" data-text="HER ARCHERY, MARTIAL ARTS, AND DAGGER SKILLS HAVE ALL IMPROVED DRASTICALLY." onclick="showTextTooltip(event,this)" data-translation="AS HABILIDADES DELA EM ARCO, ARTES MARCIAIS E ADAGA MELHORARAM DRASTICAMENTE." data-tips="💡 A construção &quot;have improved drastically&quot; usa o present perfect para indicar que as melhorias ocorreram em algum momento no passado e continuam a ser relevantes no presente. - &quot;Her skills have improved drastically over the years.&quot; - O uso do present perfect é comum para descrever mudanças ou progressos."></div><div class="text-hotspot" style="left:33.125%;top:64.27083333333333%;width:2.25%;height:.09895833333333334%" data-text="い" onclick="s - Exemplo: &quot;I CAN ASSURE YOU THAT EVERYTHING IS UNDER CONTROL.&quot; (Posso garantir que tudo está sob controle)."></div><div class="text-hotspot" style="left:15.125%;top:92.953125%;width:11.125%;height:.6822916666666666%" data-text="?!" onclick="showTextTooltip(event,this)" data-translation="?!"></div><div class="text-hotspot" style="left:26.125%;top:93.89583333333333%;width:13%;height:.16666666666666669%" data-text="ME?!" onclick="showTextTooltip(event,this)" data-translation="EU?!"></div><div class="text-hotspot" style="left:81.25%;top:98.91666666666666%;width:3.875%;height:.1875%" data-text="16" onclick="showTextTooltip(event,this)" data-translation="16"></div><div class="text-hotspot" style="left:52%;top:99.70833333333333%;width:34.5%;height:.17708333333333331%" data-text="THAT'S NOT DIFFICULT TO DO, IS IT?" onclick="showTextTooltip(event,this)" data-translation="NÃO É DIFÍCIL FAZER ISSO, É?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/67/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:50.125%;top:0;width:37.375%;height:.48958333333333337%" data-text="THAT'S NOT DIFFICULT TO DO, IS IT?" onclick="showTextTooltip(event,this)" data-translation="NÃO É DIFÍCIL FAZER ISSO, É?"></div><div class="text-hotspot" style="left:21.25%;top:1.8020833333333333%;width:37.5%;height:1.34375%" data-text="WELL, I GUESS I CAN VERIFY THE MAGICAL EQUATIONS." onclick="showTextTooltip(event,this)" data-translation="BEM, ACHO QUE POSSO VERIFICAR AS EQUAÇÕES MÁGICAS." data-tips="💡 &quot;Well, I guess&quot; é uma forma casual de introduzir uma opinião ou decisão. 
- **Uso de &quot;I guess&quot;**: Indica incerteza ou uma opinião pessoal, similar a &quot;acho que&quot; em português. 
- Exemplo: &quot;WELL, I GUESS WE SHOULD LEAVE NOW.&quot; (Bem, acho que devemos ir agora)."></div><div class="text-hotspot" style="left:20.375%;top:6.125%;width:43.25%;height:.9635416666666667%" data-text="OF COURSE SHE IS MORE LIKELY TO SIDE WITH HER MASTER THAN WITH ME." onclick="showTextTooltip(event,this)" data-translation="CLARO QUE ELA É MAIS PROPENSA A FICAR DO LADO DO MESTRE DELA DO QUE DO MEU." data-tips="💡 'MORE LIKELY TO' indica uma maior probabilidade de algo ocorrer, equivalente a 'MAIS PROPENSA A' em português."></div><div class="text-hotspot" style="left:50%;top:7.901041666666667%;width:35%;height:.4427083333333333%" data-text="I CAN TRUST NEITHER OF THEM." onclick="showTextTooltip(event,this)" data-translation="NÃO POSSO CONFIAR EM NENHUM DELES."></div><div class="text-hotspot" style="left:30.625000000000004%;top:14.578125%;width:49%;height:1.1979166666666667%" data-text="BUT THE FACT HE'S SAYING ALL THAT INDICATES HE HIMSELF ISN'T CONFIDENT ABOUT ITS EFFECT." onclick="showTextTooltip(event,this)" data-translation="MAS O FATO DE ELE ESTAR DIZENDO TUDO ISSO INDICA QUE ELE MESMO NÃO ESTÁ CONFIDENTE SOBRE O EFEITO." data-tips="💡 &quot;The fact that&quot; é uma estrutura usada para introduzir uma razão ou justificativa. 
- **Uso de &quot;the fact that&quot;**: Serve para explicar a causa ou a razão de algo. 
- Exemplo: &quot;THE FACT THAT HE'S LATE INDICATES A PROBLEM.&quot; (O fato de ele estar atrasado indica um problema)."></div><div class="text-hotspot" style="left:14.000000000000002%;top:19.484375%;width:70.875%;height:1.3697916666666667%" data-text="IN OTHER WORDS, THERE IS NO SUCH THING." onclick="showTextTooltip(event,this)" data-translation="EM OUTRAS PALAVRAS, NÃO EXISTE TAL COISA." data-tips="💡 &quot;In other words&quot; é um conector que introduz uma reexplicação ou simplificação. 
- **Uso de &quot;in other words&quot;**: Usado para reformular algo de forma mais clara ou simples. 
- Exemplo: &quot;HE'S NOT COMING. IN OTHER WORDS, WE'RE ON OUR OWN.&quot; (Ele não vem. Em outras palavras, estamos por nossa conta)."></div><div class="text-hotspot" style="left:16.75%;top:23.567708333333336%;width:47.875%;height:.6822916666666666%" data-text="THERE NEVER HAS BEEN, FOR THE PAST FEW MILLENNIA." onclick="showTextTooltip(event,this)" data-translation="NUNCA EXISTIU, NOS ÚLTIMOS MILÊNIOS."></div><div class="text-hotspot" style="left:41.5%;top:25.057291666666664%;width:47%;height:.7083333333333333%" data-text="WHILE IT IS POSSIBLE SOMEBODY HAS NEWLY INVENTED IT..." onclick="showTextTooltip(event,this)" data-translation="ENQUANTO É POSSÍVEL QUE ALGUÉM TENHA INVENTADO ISSO RECENTEMENTE..." data-tips="💡 &quot;While it is possible&quot; é usado para apresentar uma possibilidade que será discutida. 
- **Uso de &quot;while it is possible&quot;**: Introduz uma possibilidade ou condição hipotética. 
- Exemplo: &quot;WHILE IT IS POSSIBLE TO LEARN ALONE, A TEACHER CAN HELP.&quot; (Embora seja possível aprender sozinho, um professor pode ajudar)."></div><div class="text-hotspot" style="left:16%;top:36.645833333333336%;width:67.5%;height:1.2395833333333286%" data-text="HE WOULD HAVE WITHHELD SUCH INFORMATION AND TRICKED ME TO SIT IN FRONT OF THE APPARATUS IF THAT WAS THE CASE." onclick="showTextTooltip(event,this)" data-translation="ELE TERIA RETIDO TAL INFORMAÇÃO E ME ENGANADO PARA SENTAR NA FRENTE DO APARELHO SE FOSSE O CASO." data-tips="💡 &quot;If that was the case&quot; é uma expressão condicional para discutir uma hipótese. 
- **Uso de &quot;if that was the case&quot;**: Usado para introduzir uma situação hipotética. 
- Exemplo: &quot;IF THAT WAS THE CASE, WE WOULD HAVE HEARD ABOUT IT.&quot; (Se fosse o caso, teríamos ouvido falar sobre isso)."></div><div class="text-hotspot" style="left:19.625%;top:39.567708333333336%;width:45%;height:1.4791666666666714%" data-text="IT DOESN'T MATTER WHAT KIND OF EXCUSE I USE HERE. IF I DECLINE, HE WILL CONTINUE TO SUSPECT ME." onclick="showTextTooltip(event,this)" data-translation="NÃO IMPORTA QUAL TIPO DE DESCULPA EU USE AQUI. SE EU RECUSAR, ELE CONTINUARÁ A SUSPEITAR DE MIM." data-tips="💡 &quot;It doesn't matter&quot; significa que algo não é relevante ou importante. 
- **Uso de &quot;it doesn't matter&quot;**: Usado para indicar que uma escolha ou situação não é significativa. 
- Exemplo: &quot;IT DOESN'T MATTER WHAT YOU WEAR, JUST COME TO THE PARTY.&quot; (Não importa o que você vista, apenas venha para a festa)."></div><div class="text-hotspot" style="left:18.625%;top:43.192708333333336%;width:62.125%;height:.8697916666666666%" data-text="SO HERE GOES NOTHING." onclick="showTextTooltip(event,this)" data-translation="ENTÃO LÁ VAMOS NÓS."></div><div class="text-hotspot" style="left:33.5%;top:47.661458333333336%;width:49.125%;height:1.4791666666666714%" data-text="WHAT DO YOU SAY? IT'S COMPLETELY HARMLESS, AND IT WON'T TAKE LONG." onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ DIZ? É COMPLETAMENTE INOFENSIVO E NÃO VAI DEMORAR MUITO." data-tips="💡 'WHAT DO YOU SAY?' é uma pergunta informal para pedir a opinião de alguém, similar a 'O QUE VOCÊ DIZ?' em português."></div><div class="text-hotspot" style="left:6.125%;top:54.151041666666664%;width:23.25%;height:.5885416666666666%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:20.375%;top:55.036458333333336%;width:31.5%;height:.171875%" data-text="HOW LONG?" onclick="showTextTooltip(event,this)" data-translation="QUANTO TEMPO?"></div><div class="text-hotspot" style="left:55.875%;top:56.69791666666667%;width:30.875000000000004%;height:.43750000000000006%" data-text="ABOUT FIVE MINUTES?" onclick="showTextTooltip(event,this)" data-translation="CINCO MINUTOS?"></div><div class="text-hotspot" style="left:17.25%;top:59.942708333333336%;width:26.375%;height:.47916666666666663%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:35.5%;top:60.697916666666664%;width:25.75%;height:.53125%" data-text="IF YOU SAY SO." onclick="showTextTooltip(event,this)" data-translation="SE VOCÊ DIZ."></div><div class="text-hotspot" style="left:1.375%;top:62.932291666666664%;width:31.5%;height:.5208333333333333%" data-text="FLINCH" onclick="showTextTooltip(event,this)" data-translation="SOBRESSALTO"></div><div class="text-hotspot" style="left:53.5%;top:66.42708333333334%;width:33.75%;height:.6927083333333286%" data-text="ARE YOU SURE ABOUT THIS?" onclick="showTextTooltip(event,this)" data-translation="TEM CERTEZA DISSO?"></div><div class="text-hotspot" style="left:13.125%;top:71.15104166666667%;width:42.5%;height:.45312499999999994%" data-text="WHAT DO YOU MEAN BY THAT?" onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ QUER DIZER COM ISSO?" data-tips="💡 &quot;What do you mean by that?&quot; é uma forma de pedir esclarecimentos. 
- **Uso de &quot;what do you mean by that&quot;**: Usado quando se quer entender melhor o que alguém disse. 
- Exemplo: &quot;WHAT DO YOU MEAN BY THAT COMMENT?&quot; (O que você quer dizer com esse comentário?)."></div><div class="text-hotspot" style="left:43%;top:72.96875%;width:49.25%;height:.9635416666666667%" data-text="YOU WERE THE ONE THAT SEEMED WORRIED ABOUT BEING TESTED." onclick="showTextTooltip(event,this)" data-translation="VOCÊ FOI QUEM PARECIA PREOCUPADO EM SER TESTADO."></div><div class="text-hotspot" style="left:18.5%;top:81.60416666666667%;width:44.125%;height:.6979166666666666%" data-text="YOU SAID RAVEN CAN ASSURE ME THAT IT IS SAFE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DISSE QUE RAVEN PODE ME GARANTIR QUE É SEGURO."></div><div class="text-hotspot" style="left:51.125%;top:85.66666666666667%;width:30.625000000000004%;height:.7395833333333334%" data-text="I DID SAY THAT, HOWEVER--" onclick="showTextTooltip(event,this)" data-translation="EU DISSE ISSO, NO ENTANTO--"></div><div class="text-hotspot" style="left:11.875%;top:92.84895833333333%;width:51.24999999999999%;height:.9583333333333333%" data-text="THEN CAN WE GET THIS DONE WITH? I WANT TO GO BACK AND TAKE A NAP." onclick="showTextTooltip(event,this)" data-translation="ENTÃO PODEMOS TERMINAR COM ISSO? QUERO VOLTAR E TIRAR UM COCHILO." data-tips="💡 &quot;Then can we get this done with?&quot; é uma forma de perguntar se algo pode ser finalizado. 
- **Uso de &quot;get this done with&quot;**: Significa concluir ou terminar algo. 
- Exemplo: &quot;CAN WE GET THIS MEETING DONE WITH?&quot; (Podemos terminar essa reunião?)."></div><div class="text-hotspot" style="left:12.75%;top:96.21354166666667%;width:73.75%;height:.7760416666666714%" data-text="NICE TRY, YOU OLD-ASS PUNK." onclick="showTextTooltip(event,this)" data-translation="BOA TENTATIVA, SEU VELHO SAFADO." data-tips="💡 'NICE TRY' é uma expressão sarcástica usada para indicar que alguém tentou algo sem sucesso, traduzida como 'BOA TENTATIVA'."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/67/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:46.75%;top:4.15625%;width:29.375%;height:.8072916666666667%" data-text="TAP" onclick="showTextTooltip(event,this)" data-translation="TAP"></div><div class="text-hotspot" style="left:22.75%;top:8.546875%;width:16.375%;height:.4427083333333333%" data-text="SO HE GOES." onclick="showTextTooltip(event,this)" data-translation="ENTÃO ELE VAI."></div><div class="text-hotspot" style="left:29.875%;top:12.286458333333334%;width:36.375%;height:.4427083333333333%" data-text="...WHAT WAS THAT ABOUT?" onclick="showTextTooltip(event,this)" data-translation="...O QUE FOI ISSO?"></div><div class="text-hotspot" style="left:5.5%;top:13.692708333333334%;width:31.75%;height:.6145833333333333%" data-text="FLINCH" onclick="showTextTooltip(event,this)" data-translation="SOBRESSALTO"></div><div class="text-hotspot" style="left:53.5%;top:17.557291666666668%;width:22.625%;height:.17708333333333331%" data-text="AHAHA..." onclick="showTextTooltip(event,this)" data-translation="AHAHA..."></div><div class="text-hotspot" style="left:14.249999999999998%;top:22.625%;width:57.75%;height:.9427083333333334%" data-text="IT LOOKS WEIRD, BUT THERE IS NO MAGICAL EQUATION EMBEDDED WITHIN THAT CHAIR." onclick="showTextTooltip(event,this)" data-translation="PARECE ESTRANHO, MAS NÃO HÁ NENHUMA EQUAÇÃO MÁGICA EMBUTIDA NAQUELA CADEIRA." data-tips="💡 'EMBEDDED WITHIN' significa 'EMBUTIDA NA' e é usado para descrever algo incorporado em outra coisa."></div><div class="text-hotspot" style="left:35.625%;top:29.723958333333332%;width:55.75%;height:1.2083333333333393%" data-text="I PLAYED ALONG WITH YOUR PLAN. COULD YOU EXPLAIN WHAT IT WAS ABOUT NOW?" onclick="showTextTooltip(event,this)" data-translation="EU JOGUEI JUNTO COM SEU PLANO. PODERIA EXPLICAR DO QUE SE TRATAVA AGORA?"></div><div class="text-hotspot" style="left:2%;top:31.880208333333332%;width:38%;height:1.3437499999999964%" data-text="D ..." onclick="showTextTooltip(event,this)" data-translation="D ..."></div><div class="text-hotspot" style="left:29.5%;top:36.578125%;width:20.75%;height:.11458333333333333%" data-text="YOU WON'T...?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO VAI...?"></div><div class="text-hotspot" style="left:38.125%;top:37.213541666666664%;width:44.125%;height:1.2239583333333333%" data-text="I HAVE AN IDEA, THOUGH. YOU THOUGHT MR. BJORN WAS AN EVIL SPIRIT." onclick="showTextTooltip(event,this)" data-translation="TENHO UMA IDEIA, NO ENTANTO. VOCÊ ACHOU QUE O SR. BJORN ERA UM ESPÍRITO MALIGNO." data-tips="💡 'THOUGH' no final da frase é usado para indicar uma ressalva ou contraste, semelhante a 'NO ENTANTO' em português."></div><div class="text-hotspot" style="left:9%;top:38.838541666666664%;width:56%;height:1.2135416666666714%" data-text="IS THAT WHY YOU KEPT ASKING ABOUT WHAT HAPPENED INSIDE THE LABYRINTH?" onclick="showTextTooltip(event,this)" data-translation="É POR ISSO QUE VOCÊ CONTINUAVA PERGUNTANDO SOBRE O QUE ACONTECEU DENTRO DO LABIRINTO?"></div><div class="text-hotspot" style="left:20.25%;top:48.520833333333336%;width:38.5%;height:.16666666666666669%" data-text="C-CALM DOWN." onclick="showTextTooltip(event,this)" data-translation="C-CALMA."></div><div class="text-hotspot" style="left:44.125%;top:53.21875%;width:38.125%;height:.6979166666666714%" data-text="WELL? DO YOU STILL SUSPECT HIM?" onclick="showTextTooltip(event,this)" data-translation="BEM? VOCÊ AINDA SUSPEITA DELE?"></div><div class="text-hotspot" style="left:66.25%;top:56.41145833333333%;width:27.875%;height:.6041666666666666%" data-text="SIGH" onclick="showTextTooltip(event,this)" data-translation="SUSPIRO"></div><div class="text-hotspot" style="left:18.375%;top:58.770833333333336%;width:32.25%;height:.9479166666666643%" data-text="NO. IT SEEMS THAT I WAS MISTAKEN." onclick="showTextTooltip(event,this)" data-translation="NÃO. PARECE QUE EU ESTAVA ENGANADO."></div><div class="text-hotspot" style="left:34.25%;top:63.072916666666664%;width:54.25%;height:1.1979166666666667%" data-text="I UNDERSTAND YOUR SENTIMENT, THOUGH. HE REALLY IS AN UNUSUAL PERSON." onclick="showTextTooltip(event,this)" data-translation="ENTENDO SEU SENTIMENTO, NO ENTANTO. ELE REALMENTE É UMA PESSOA INCOMUM." data-tips="💡 &quot;Though&quot; é uma conjunção que significa &quot;no entanto&quot; ou &quot;embora&quot;. 
- **Uso de &quot;though&quot;**: Usado para contrastar ou qualificar uma declaração anterior. 
- Exemplo: &quot;HE'S NOT VERY TALL, THOUGH HE'S STRONG.&quot; (Ele não é muito alto, mas é forte)."></div><div class="text-hotspot" style="left:16.125%;top:64.80729166666667%;width:56.875%;height:.9375%" data-text="BUT CAN YOU PLEASE ANSWER THIS QUESTION FOR ME?" onclick="showTextTooltip(event,this)" data-translation="MAS PODE RESPONDER ESTA PERGUNTA PARA MIM?"></div><div class="text-hotspot" style="left:17.5%;top:71.53125%;width:32.125%;height:.171875%" data-text="WHAT IS IT?" onclick="showTextTooltip(event,this)" data-translation="O QUE É?"></div><div class="text-hotspot" style="left:27.750000000000004%;top:76.47395833333334%;width:43.375%;height:.9895833333333144%" data-text="WHY DID YOU DO THAT?" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ FEZ ISSO?"></div><div class="text-hotspot" style="left:39.625%;top:81.77083333333334%;width:47.75%;height:.6979166666666666%" data-text="IF YOU REALLY THOUGHT HE WAS AN EVIL SPIRIT..." onclick="showTextTooltip(event,this)" data-translation="SE VOCÊ REALMENTE ACHAVA QUE ELE ERA UM ESPÍRITO MALIGNO..."></div><div class="text-hotspot" style="left:10.75%;top:91.875%;width:54.625%;height:.9375%" data-text="...YOU COULD HAVE JUST NOTIFIED THE MINISTRY OF SECURITY." onclick="showTextTooltip(event,this)" data-translation="...VOCÊ PODERIA TER NOTIFICADO O MINISTÉRIO DA SEGURANÇA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/67/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:40.375%;top:3.7395833333333335%;width:19.5%;height:.4270833333333333%" data-text="IF I DID THAT..." onclick="showTextTooltip(event,this)" data-translation="SE EU FIZESSE ISSO..."></div><div class="text-hotspot" style="left:23%;top:14.656250000000002%;width:3.125%;height:.2916666666666667%" data-text="HE" onclick="showTextTooltip(event,this)" data-translation="ELE"></div><div class="text-hotspot" style="left:50.125%;top:15.953125000000002%;width:26.5%;height:.45312499999999994%" data-text="MUMBLE" onclick="showTextTooltip(event,this)" data-translation="MURMÚRIO"></div><div class="text-hotspot" style="left:53.625%;top:16.875%;width:26.75%;height:.3489583333333333%" data-text="...HE WOULD HAVE DIED." onclick="showTextTooltip(event,this)" data-translation="...ELE TERIA MORRIDO."></div><div class="text-hotspot" style="left:12.5%;top:22.484375%;width:32.125%;height:.6927083333333334%" data-text="HUH? WHAT DO YOU MEAN--" onclick="showTextTooltip(event,this)" data-translation="HÃ? O QUE VOCÊ QUER DIZER--"></div><div class="text-hotspot" style="left:27.625%;top:23.911458333333332%;width:63%;height:1.2135416666666665%" data-text="I AM EXHAUSTED. MY AGE MUST BE CATCHING UP TO ME. CAN YOU PLEASE CLEAN UP AFTER ME?" onclick="showTextTooltip(event,this)" data-translation="ESTOU EXAUSTO. MINHA IDADE DEVE ESTAR ME ALCANÇANDO. PODE LIMPAR PARA MIM?" data-tips="💡 &quot;My age must be catching up to me&quot; é uma expressão que indica que alguém está sentindo o peso da idade.
