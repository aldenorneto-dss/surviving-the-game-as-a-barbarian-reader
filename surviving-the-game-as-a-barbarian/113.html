dth:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/113/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22.25%;top:5.395833333333333%;width:55.50000000000001%;height:.9635416666666667%" data-text="DAY 21 IN THE LABYRINTH. IT HAS ALREADY BEEN FOUR DAYS SINCE WE GOT TO THE FIFTH FLOOR." data-translation="DIA 21 NO LABIRINTO. JÁ FAZ QUATRO DIAS DESDE QUE CHEGAMOS AO QUINTO ANDAR." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:57.49999999999999%;top:10.984375%;width:18.875%;height:.6041666666666666%" data-text="SCRIBBLE SCRIBBLE" data-translation="RABISCO RABISCO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:35.875%;top:16.09375%;width:50.375%;height:.9479166666666667%" data-text="ASIDE FROM AINAR HAVING REACHED LEVEL 4, THERE WAS NOTHING OUT OF THE ORDINARY..." data-translation="ALÉM DO AINAR TER ALCANÇADO O NÍVEL 4, NÃO HOUVE NADA FORA DO COMUM..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.374999999999996%;top:20.625%;width:33.5%;height:.8229166666666666%" data-text="...IS WHAT I HAD HOPED, BUT NOPE!!" data-translation="...ERA O QUE EU ESPERAVA, MAS NÃO!!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:56.125%;top:23.427083333333336%;width:38.25%;height:.9739583333333333%" data-text="GRIND" data-translation="RANGER" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.25%;top:27.489583333333336%;width:41.625%;height:.7291666666666666%" data-text="I REALLY DON'T BELIEVE IN JINXES OR SUPERSTITIONS." data-translation="EU REALMENTE NÃO ACREDITO EM AZARES OU SUPERSTIÇÕES." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18.125%;top:28.958333333333336%;width:45.375%;height:.703125%" data-text="LET ME REPHRASE THAT. I REALLY DIDN'T, UNTIL I MET THOSE SUCKERS." data-translation="DEIXE-ME REFORMULAR ISSO. EU REALMENTE NÃO ACREDITAVA, ATÉ CONHECER AQUELES TROUXAS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.125000000000004%;top:33.776041666666664%;width:39.625%;height:.4635416666666667%" data-text="HANS!" data-translation="HANS!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17%;top:38.083333333333336%;width:32%;height:.6822916666666666%" data-text="WHAT ARE YOU DOING? HURRY UP!" data-translation="O QUE VOCÊ ESTÁ FAZENDO? APRESSE-SE!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:74.625%;top:39.859375%;width:21.125%;height:.7083333333333333%" data-text="GASP" data-translation="OFEGAR" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.5%;top:40.77604166666667%;width:22.625%;height:.5104166666666666%" data-text="YIKES" data-translation="CARACA" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:12.125%;top:48.885416666666664%;width:12.75%;height:.49479166666666663%" data-text="wwwwwww" data-translation="wwwwwww" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:78.25%;top:48.994791666666664%;width:11.5%;height:.5520833333333334%" data-text="wwwwwwwww" data-translation="wwwwwwwww" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:25.75%;top:49.72916666666667%;width:48.125%;height:.9270833333333334%" data-text="I FEEL LIKE I'VE STEPPED ON A BIG PILE OF CRAP." data-translation="SINTO COMO SE TIVESSE PISADO NUMA GRANDE PILHA DE LIXO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:16.625%;top:54.317708333333336%;width:49.875%;height:.7083333333333286%" data-text="YOU'RE GONNA BREAK THE PEN, MR. YANDEL." data-translation="VOCÊ VAI QUEBRAR A CANETA, SR. YANDEL." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:42.5%;top:55.75520833333333%;width:43.875%;height:.703125%" data-text="I DON'T THINK YOU NEED TO DO THAT ANYMORE." data-translation="EU NÃO ACHO QUE VOCÊ PRECISA FAZER ISSO MAIS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:15.875%;top:63.64062499999999%;width:37.25%;height:.6927083333333334%" data-text="THAT? OH, YOU MEAN THE MAP." data-translation="ISSO? AH, VOCÊ QUER DIZER O MAPA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:23.125%;top:67.77604166666666%;width:56.49999999999999%;height:1.9375%" data-text="U YEAH. I KNOW YOU'RE DOING YOUR BEST, BUT HONESTLY, WE WON'T BE ABLE TO READ THAT ACCURATELY." data-translation="UH, SIM. EU SEI QUE VOCÊ ESTÁ FAZENDO O SEU MELHOR, MAS HONESTAMENTE, NÃO VAMOS CONSEGUIR LER ISSO COM PRECISÃO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:53.75%;top:72.38020833333333%;width:10.625%;height:.3177083333333333%" data-text="M" data-translation="M" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:63.375%;top:73.77604166666667%;width:20.375%;height:.6822916666666666%" data-text="☑" data-translation="☑" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:20.375%;top:76.41145833333334%;width:51.25%;height:.9479166666666572%" data-text="...I'LL GET BETTER AT IT. IT'LL BE A MUCH BETTER MAP NEXT TIME." data-translation="...EU VOU MELHORAR. SERÁ UM MAPA MUITO MELHOR DA PRÓXIMA VEZ." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.374999999999996%;top:81.83854166666666%;width:36%;height:.9739583333333333%" data-text="I GOT NOTHING TO SAY TO THAT, IF YOU INSIST." data-translation="NÃO TENHO NADA A DIZER SOBRE ISSO, SE VOCÊ INSISTE." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:50.24999999999999%;top:83.55208333333334%;width:31.374999999999996%;height:.421875%" data-text="BUT AREN'T YOU TIRED?" data-translation="MAS VOCÊ NÃO ESTÁ CANSADO?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:34%;top:86.234375%;width:19%;height:.4479166666666667%" data-text="SWISH" data-translation="SWISH" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:75.375%;top:87.80208333333334%;width:.8750000000000001%;height:.036458333333333336%" data-text="o" data-translation="o" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:34.75%;top:88.92708333333333%;width:13.5%;height:.16145833333333334%" data-text="HMM." data-translation="HMM." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.5%;top:92.98958333333334%;width:35.25%;height:.7083333333333144%" data-text="IT'S TEDIOUS, BUT KIND OF FUN." data-translation="É TEDIOSO, MAS MEIO DIVERTIDO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:10.625%;top:97.18229166666667%;width:12%;height:.10416666666666667%" data-text="A MAP..." data-translation="UM MAPA..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.375%;top:99.4375%;width:34.25%;height:.4322916666666667%" data-text="IT MAKES ME FEEL LIKE I'M MAKING PROGRESS." data-translation="ME FAZ SENTIR QUE ESTOU PROGREDINDO." onclick="showTextTooltip(event,this)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/113/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:47.125%;top:0;width:22.625%;height:.14583333333333334%" data-text="IT MAKES ME FEEL LIKE I'M MAKING PROGRESS." data-translation="ME FAZ SENTIR QUE ESTOU PROGREDINDO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.125%;top:4.041666666666666%;width:37.375%;height:.703125%" data-text="IF I BECOME THE NAVIGATOR OF THE TEAM," data-translation="SE EU ME TORNAR O NAVEGADOR DO TIME," onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:39.25%;top:5.604166666666666%;width:46.5%;height:.703125%" data-text="IT'LL BE EASIER TO SUBTLY LEAD THE PARTY TO PLACES I WANT." data-translation="SERÁ MAIS FÁCIL GUIAR O GRUPO SUTILMENTE PARA OS LUGARES QUE EU QUERO." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:64.5%;top:7.187499999999999%;width:23.5%;height:.2864583333333333%" data-text="FOR THOSE HIDDEN PIECES." data-translation="PARA AQUELES ITENS ESCONDIDOS." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.625%;top:11.03125%;width:39.75%;height:.9479166666666667%" data-text="SORRY TO KEEP YOU WAITING. LET'S GET MOVING." data-translation="DESCULPE POR FAZER VOCÊS ESPERAREM. VAMOS NOS MOVER." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:65.25%;top:13.234375000000002%;width:19.75%;height:.4427083333333333%" data-text="RUSTLE" data-translation="RUSTLE" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41.375%;top:18.59375%;width:38.75%;height:1.2291666666666665%" data-text="ARE WE GOING TO KEEP WALKING ON THE ROAD AS USUAL?" data-translation="VAMOS CONTINUAR ANDANDO NA ESTRADA COMO DE COSTUME?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:9.75%;top:23.25%;width:40.375%;height:.9583333333333333%" data-text="YEAH. IT'S NOT LIKE WE HAVE ANOTHER CHOICE." data-translation="SIM. NÃO É COMO SE TIVÉSSEMOS OUTRA ESCOLHA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:37.625%;top:25.46875%;width:39%;height:1.2239583333333333%" data-text="TRUE, BUT THERE REALLY AREN'T MANY MONSTERS ON THE ROAD." data-translation="VERDADE, MAS REALMENTE NÃO HÁ MUITOS MONSTROS NA ESTRADA." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:71%;top:26.786458333333336%;width:17.125%;height:.390625%" data-text="SIGH" data-translation="SUSPIRO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:18%;top:32.734375%;width:49%;height:1.34375%" data-text="THEY'RE BEING RIDICULOUS! MONSTER ZONES SHOULD BE FOR EVERYONE!" data-translation="ELES ESTÃO SENDO RIDÍCULOS! AS ZONAS DE MONSTROS DEVERIAM SER PARA TODOS!" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.875%;top:37.359375%;width:51.5%;height:1.2395833333333333%" data-text="I AGREE, BUT WE STILL CAN'T PICK A FIGHT WITH CLANS. THERE ARE TOO MANY OF THEM." data-translation="Concordo, mas ainda não podemos brigar com os clãs. São muitos deles." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:42.375%;top:41.13541666666667%;width:26.375%;height:.5833333333333334%" data-text="DROOP" data-translation="MURCHO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:42.625%;top:43.734375%;width:42.375%;height:1.2083333333333357%" data-text="AFTER FINALLY MAKING IT TO THE FIFTH FLOORRRR, TOO..." data-translation="Depois de finalmente chegarmos ao quinto andarr..." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.375%;top:45.520833333333336%;width:52.5%;height:1.2083333333333333%" data-text="I CAN'T BELIEVE WE'RE UNABLE TO HUNT BECAUSE OF OTHER ADVENTURERRRS." data-translation="Não acredito que não podemos caçar por causa de outros aventureirosss." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:22.375%;top:51.22395833333333%;width:57.375%;height:1.4739583333333428%" data-text="WHY AM I GETTING THE FEELING THAT THERE ARE WAY MORE CLANS TAKING CONTROL OF HUNTING ZONES THAN IN THE GAME?" data-translation="Por que estou com a sensação de que há muito mais clãs controlando as zonas de caça do que no jogo?" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:55.00000000000001%;top:53.322916666666664%;width:28.875%;height:.6510416666666667%" data-text="STEP" data-translation="PASSO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:1%;top:55.921875%;width:30.625000000000004%;height:.7239583333333333%" data-text="STEP" data-translation="PASSO" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:17%;top:57.119791666666664%;width:45.5%;height:.96875%" data-text="WE WERE STOPPED FROM ENTERING THREE FIELDS IN THE PAST FEW DAYS." data-translation="Fomos impedidos de entrar em três campos nos últimos dias." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:43.375%;top:58.744791666666664%;width:37.625%;height:.9583333333333333%" data-text="THEY DEMANDED A PAYMENT FOR THE RIGHT TO HUNT IN THOSE AREAS." data-translation="Eles exigiram um pagamento pelo direito de caçar nessas áreas." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:28.000000000000004%;top:63.83854166666667%;width:43.625%;height:1.2083333333333286%" data-text="AND EVEN IF WE PAID UP, WE WOULD ONLY GET A TEMPORARY PERMIT FOR EXPERIENCE." data-translation="E mesmo que pagássemos, só conseguiríamos uma permissão temporária para experiência." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27.375%;top:66.5625%;width:63.375%;height:1.8645833333333286%" data-text="POW YOU HAVE DEFEATED XXXX. YOU HAVE GAINED 3 EXP POINTS." data-translation="POW Você derrotou XXXX. Você ganhou 3 pontos de EXP." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:45.625%;top:70.08854166666667%;width:9%;height:.4583333333333333%" data-text="My" data-translation="Meu" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:73.875%;top:72.51041666666667%;width:8.125%;height:.13020833333333331%" data-text="OKAY" data-translation="OK" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:46.5%;top:72.59895833333333%;width:14.249999999999998%;height:.6354166666666666%" data-text="M" data-translation="M" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:65.5%;top:72.6875%;width:24.875%;height:.11979166666666666%" data-text="THAT'S ENOUGH." data-translation="Já chega." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:41%;top:74.67708333333334%;width:18.125%;height:.3124999999999858%" data-text="YOU CAN LEAVE NOW." data-translation="Você pode ir agora." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:40.375%;top:76%;width:47%;height:.9635416666666714%" data-text="NOT ONLY THAT. THEY WOULDN'T LET US COLLECT ESSENCES OR MANA STONES." data-translation="Não só isso. Eles não nos deixaram coletar essências ou pedras de mana." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:19.5%;top:77.66666666666666%;width:44.125%;height:.6875%" data-text="THE INJUSTICE HERE IS WAY WORSE THAN IN THE GAME." data-translation="A injustiça aqui é muito pior do que no jogo." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:27%;top:82.83333333333334%;width:11.75%;height:.15104166666666666%" data-text="HMPH." data-translation="HMPH." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:47.875%;top:85.39583333333334%;width:30.125%;height:.9739583333333333%" data-text="GRIND" data-translation="RANGER" onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:31.374999999999996%;top:89.16666666666667%;width:37.25%;height:.43750000000000006%" data-text="TRY YOUR BEST TO KEEP IT UNFAIR." data-translation="Faça o seu melhor para manter isso injusto." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:21.5%;top:93.1875%;width:56.99999999999999%;height:.5677083333333334%" data-text="I'LL STILL CLIMB ALL THE WAY TO THE TOP." data-translation="Ainda vou subir até o topo." onclick="showTextTooltip(event,this)"></div><div class="text-hotspot" style="left:0;top:96.64583333
