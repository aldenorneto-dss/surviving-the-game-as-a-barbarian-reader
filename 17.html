data-translation="SWOOSH"></div><div class="text-hotspot" style="left:35%;top:26.494791666666668%;width:63.125%;height:1.8020833333333333%" data-text="FWOOSH" onclick="showTextTooltip(event,this)" data-translation="FWOOSH"></div><div class="text-hotspot" style="left:19.375%;top:27.385416666666668%;width:4.5%;height:.3229166666666667%" data-text="!" onclick="showTextTooltip(event,this)" data-translation="!"></div><div class="text-hotspot" style="left:28.499999999999996%;top:36.09375%;width:45.25%;height:.828125%" data-text="WHAT THE... DID SHE JUST CAST A SPELL ON ME?" onclick="showTextTooltip(event,this)" data-translation="O QUE... ELA ACABOU DE LANÇAR UM FEITIÇO EM MIM?"></div><div class="text-hotspot" style="left:47.125%;top:42.33854166666667%;width:32.125%;height:.6822916666666666%" data-text="BUT I DON'T FEEL THE DIFFERENCE." onclick="showTextTooltip(event,this)" data-translation="MAS NÃO SINTO DIFERENÇA ALGUMA."></div><div class="text-hotspot" style="left:67.875%;top:43.65625%;width:29.125%;height:.7864583333333333%" data-text="YAWN" onclick="showTextTooltip(event,this)" data-translation="YAWN"></div><div class="text-hotspot" style="left:36%;top:44.125%;width:21.375%;height:.734375%" data-text="22" onclick="showTextTooltip(event,this)" data-translation="22"></div><div class="text-hotspot" style="left:29.875%;top:47.838541666666664%;width:10.875%;height:.16145833333333334%" data-text="YOU" onclick="showTextTooltip(event,this)" data-translation="VOCÊ"></div><div class="text-hotspot" style="left:12.375%;top:47.838541666666664%;width:60.125%;height:1.4583333333333357%" data-text="WILL NOW BE ABLE TO FIND THE BOOKS OF YOUR HEART'S DESIRE AS YOU WALK AROUND THE LIBRARY." onclick="showTextTooltip(event,this)" data-translation="AGORA SERÁ CAPAZ DE ENCONTRAR OS LIVROS QUE DESEJA ENQUANTO CAMINHA PELA BIBLIOTECA."></div><div class="text-hotspot" style="left:24.875%;top:49.994791666666664%;width:63.375%;height:1.4635416666666667%" data-text="YOU MAY NOT RENT THE BOOKS, SO PLEASE RETURN THEM TO THE ASSIGNED SHELVES WHEN YOU'RE DONE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO PODE ALUGAR OS LIVROS, ENTÃO POR FAVOR DEVOLVA-OS ÀS PRATELEIRAS DESIGNADAS QUANDO TERMINAR."></div><div class="text-hotspot" style="left:16.75%;top:55.052083333333336%;width:42%;height:.9375%" data-text="WHAT? IS THAT REALLY ALL I HAVE TO--" onclick="showTextTooltip(event,this)" data-translation="O QUÊ? É SÓ ISSO QUE EU TENHO QUE--"></div><div class="text-hotspot" style="left:3.6249999999999996%;top:59.057291666666664%;width:25.624999999999996%;height:.5416666666666667%" data-text="272" onclick="showTextTooltip(event,this)" data-translation="272"></div><div class="text-hotspot" style="left:59.375%;top:65.20833333333333%;width:24.875%;height:.6875%" data-text="... SHE'S SLEEPING AGAIN." onclick="showTextTooltip(event,this)" data-translation="... ELA ESTÁ DORMINDO DE NOVO."></div><div class="text-hotspot" style="left:76.375%;top:66.359375%;width:21.75%;height:.53125%" data-text="222" onclick="showTextTooltip(event,this)" data-translation="222"></div><div class="text-hotspot" style="left:40.375%;top:68.375%;width:22.125%;height:.53125%" data-text="222" onclick="showTextTooltip(event,this)" data-translation="222"></div><div class="text-hotspot" style="left:30.5%;top:70.07291666666666%;width:38.125%;height:.9010416666666714%" data-text="WHAT THE HELL'S UP WITH HER?" onclick="showTextTooltip(event,this)" data-translation="QUAL É O PROBLEMA DELA?"></div><div class="text-hotspot" style="left:5.5%;top:78.34375%;width:88.625%;height:2.635416666666667%" data-text="SURVIVING THE GAME AS A BARBARIAN" onclick="showTextTooltip(event,this)" data-translation="SOBREVIVENDO NO JOGO COMO UM BÁRBARO"></div><div class="text-hotspot" style="left:29.875%;top:81.28645833333333%;width:40.5%;height:.453125%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | Han tae-su ORIGINAL STORY | Jung Yoon-kang" onclick="showTextTooltip(event,this)" data-translation="ARTE | MIDNIGHT STUDIO ADAPTAÇÃO | Han tae-su HISTÓRIA ORIGINAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:47.25%;top:82.33854166666667%;width:5.375%;height:.19270833333333334%" data-text="17" onclick="showTextTooltip(event,this)" data-translation="17"></div><div class="text-hotspot" style="left:15%;top:88.97916666666667%;width:43.5%;height:.7083333333333333%" data-text="I WALKED AROUND THE LIBRARY AS SHE ADVISED," onclick="showTextTooltip(event,this)" data-translation="ANDEI PELA BIBLIOTECA COMO ELA ACONSELHOU,"></div><div class="text-hotspot" style="left:43.5%;top:90.18229166666667%;width:38%;height:.96875%" data-text="AND SOON REALIZED HOW THE SPELL SHE CAST ON ME WORKS." onclick="showTextTooltip(event,this)" data-translation="E LOGO PERCEBI COMO O FEITIÇO QUE ELA LANÇOU EM MIM FUNCIONA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/17/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:37.375%;top:.796875%;width:48.875%;height:1.4895833333333335%" data-text="I SUPPOSE THE KEYWORD I THINK OF ON MY HEAD TURNS MY EYES TO THE BOOKS RELATED TO THAT TERM." onclick="showTextTooltip(event,this)" data-translation="SUPONHO QUE A PALAVRA-CHAVE QUE PENSO NA MINHA CABEÇA FAZ MEUS OLHOS SE VOLTAREM PARA OS LIVROS RELACIONADOS A ESSE TERMO."></div><div class="text-hotspot" style="left:19.25%;top:10.953125%;width:26.5%;height:.6875%" data-text="WHAT A CONVENIENT MAGIC SPELL." onclick="showTextTooltip(event,this)" data-translation="QUE FEITIÇO CONVENIENTE."></div><div class="text-hotspot" style="left:33.25%;top:12.380208333333332%;width:51.5%;height:.6979166666666666%" data-text="NO WONDER THERE'S ONLY ONE LIBRARIAN IN A HUGE PLACE LIKE THIS." onclick="showTextTooltip(event,this)" data-translation="NÃO É À TOA QUE HÁ APENAS UMA BIBLIOTECÁRIA EM UM LUGAR ENORME COMO ESTE."></div><div class="text-hotspot" style="left:32.25%;top:14.515624999999998%;width:9.75%;height:.16145833333333334%" data-text="ZZZ" onclick="showTextTooltip(event,this)" data-translation="ZZZ"></div><div class="text-hotspot" style="left:20%;top:19.1875%;width:21.75%;height:.6927083333333357%" data-text="LET'S START WITH THIS ONE." onclick="showTextTooltip(event,this)" data-translation="VAMOS COMEÇAR COM ESTE AQUI."></div><div class="text-hotspot" style="left:21.25%;top:23.802083333333332%;width:57%;height:.9270833333333321%" data-text="THE FIRST BOOK IS TITLED WORLD DESTROYED." onclick="showTextTooltip(event,this)" data-translation="O PRIMEIRO LIVRO É INTITULADO MUNDO DESTRUÍDO."></div><div class="text-hotspot" style="left:11.75%;top:26.239583333333332%;width:76.25%;height:1.1666666666666667%" data-text="THOUSANDS OF YEARS AGO, AN EVIL WITCH PLACED A CURSE UPON THIS LAND, CAUSING ALL LIVES WITHIN TO WITHER." onclick="showTextTooltip(event,this)" data-translation="MILHARES DE ANOS ATRÁS, UMA BRUXA MALIGNA LANÇOU UMA MALDIÇÃO NESTA TERRA, FAZENDO COM QUE TODAS AS VIDAS DENTRO DELA MURCHASSEM."></div><div class="text-hotspot" style="left:10.875%;top:35.723958333333336%;width:78.5%;height:.8489583333333334%" data-text="RAFDONIA, THE LAST FORTIFIED HUMAN SETTLEMENT, BARELY SURVIVED THE CALAMITY." onclick="showTextTooltip(event,this)" data-translation="RAFDONIA, O ÚLTIMO ASSENTAMENTO HUMANO FORTIFICADO, MAL SOBREVIVEU À CALAMIDADE."></div><div class="text-hotspot" style="left:15.375%;top:39.848958333333336%;width:69%;height:.8645833333333334%" data-text="TO SAVE THE CITIZENS THAT WERE STARVING DUE TO THE LACK OF RESOURCES..." onclick="showTextTooltip(event,this)" data-translation="PARA SALVAR OS CIDADÃOS QUE ESTAVAM PASSANDO FOME DEVIDO À FALTA DE RECURSOS..."></div><div class="text-hotspot" style="left:10%;top:44.44270833333333%;width:79.375%;height:1.1510416666666667%" data-text="...THE ROYAL COURT DISPATCHED SKILLED INDIVIDUALS TO OPEN A PORTAL THAT CONNECTED THIS WORLD TO THE OTHERWORLD." onclick="showTextTooltip(event,this)" data-translation="...A CORTE REAL DESPACHOU INDIVÍDUOS HABILIDOSOS PARA ABRIR UM PORTAL QUE CONECTAVA ESTE MUNDO AO OUTRO MUNDO."></div><div class="text-hotspot" style="left:7.625%;top:52.48437500000001%;width:84.75%;height:.8541666666666666%" data-text="THE NEW REALM THEY DISCOVERED IS NOW WHAT PEOPLE REFER TO AS THE LABYRINTH." onclick="showTextTooltip(event,this)" data-translation="O NOVO REINO QUE ELES DESCOBRIRAM É AGORA O QUE AS PESSOAS SE REFEREM COMO O LABIRINTO."></div><div class="text-hotspot" style="left:11.375%;top:55.78125000000001%;width:59.75%;height:1.4635416666666572%" data-text="SO THE RECORD OF THE BEGINNING OF THIS WORLD ISN'T TOO DIFFERENT FROM WHAT I READ IN THE PROLOGUE OF THE GAME." onclick="showTextTooltip(event,this)" data-translation="ENTÃO O REGISTRO DO INÍCIO DESTE MUNDO NÃO É MUITO DIFERENTE DO QUE LI NO PRÓLOGO DO JOGO."></div><div class="text-hotspot" style="left:15.5%;top:58.244791666666664%;width:23.375%;height:.46875%" data-text="FLIP" onclick="showTextTooltip(event,this)" data-translation="FLIP"></div><div class="text-hotspot" style="left:1.125%;top:62.21354166666667%;width:3.75%;height:.11458333333333333%" data-text="SA" onclick="showTextTooltip(event,this)" data-translation="SA"></div><div class="text-hotspot" style="left:20.25%;top:62.817708333333336%;width:58.875%;height:1.15625%" data-text="SECOND BOOK, TITLED UNDERSTANDING BASICS OF ALCHEMY, EXPLAINED IV" onclick="showTextTooltip(event,this)" data-translation="SEGUNDO LIVRO, INTITULADO COMPREENDENDO OS FUNDAMENTOS DA ALQUIMIA, EXPLICADO IV"></div><div class="text-hotspot" style="left:15.5%;top:66.71354166666667%;width:68.875%;height:.8333333333333334%" data-text="IT EXPLAINS HOW THE MANA STONES DROPPED BY MONSTERS..." onclick="showTextTooltip(event,this)" data-translation="ELE EXPLICA COMO AS PEDRAS DE MANA QUE CAEM DOS MONSTROS..."></div><div class="text-hotspot" style="left:18.625%;top:71.23958333333333%;width:63.125%;height:.8750000000000001%" data-text="...TURN INTO OTHER OBJECTS SUCH AS BREAD, WATER, AND METAL." onclick="showTextTooltip(event,this)" data-translation="...SE TRANSFORMAM EM OUTROS OBJETOS COMO PÃO, ÁGUA E METAL."></div><div class="text-hotspot" style="left:22.125%;top:77.08854166666667%;width:34%;height:.9739583333333333%" data-text="I ACTUALLY STILL HAVE NO CLUE ABOUT THE MECHANISM," onclick="showTextTooltip(event,this)" data-translation="NA VERDADE, AINDA NÃO TENHO IDEIA DO MECANISMO,"></div><div class="text-hotspot" style="left:41.375%;top:78.64583333333334%;width:42.75%;height:.9739583333333333%" data-text="BUT I'LL JUST MEMORIZE WHATEVER I CAN. I MIGHT HAVE A USE FOR IT LATER." onclick="showTextTooltip(event,this)" data-translation="MAS VOU MEMORIZAR O QUE PUDER. PODE SER ÚTIL MAIS TARDE."></div><div class="text-hotspot" style="left:32.5%;top:84.31770833333333%;width:35.375%;height:.8385416666666666%" data-text="NEXT. WAR FOR THE HOLY ITEMS III." onclick="showTextTooltip(event,this)" data-translation="PRÓXIMO. GUERRA PELOS ITENS SAGRADOS III."></div><div class="text-hotspot" style="left:41.625%;top:87.421875%;width:43.5%;height:1.2083333333333428%" data-text="IT COVERS HOW THE BARBARIAN AND THE ELVEN RACE CAME TO ANTAGONIZE EACH OTHER." onclick="showTextTooltip(event,this)" data-translation="ELE ABORDA COMO OS BÁRBAROS E A RAÇA ÉLFICA PASSARAM A SE ANTAGONIZAR."></div><div class="text-hotspot" style="left:75%;top:90.28125%;width:20.5%;height:.3854166666666667%" data-text="FLIP" onclick="showTextTooltip(event,this)" data-translation="FLIP"></div><div class="text-hotspot" style="left:21.125%;top:91.80208333333333%;width:30%;height:.9375%" data-text="WHILE THIS ONE CONTAINS SOME USEFUL INFORMATION," onclick="showTextTooltip(event,this)" data-translation="ENQUANTO ESTE CONTÉM ALGUMAS INFORMAÇÕES ÚTEIS,"></div><div class="text-hotspot" style="left:37.625%;top:93.14583333333334%;width:44%;height:1.2343749999999858%" data-text="WHAT I REALLY NEED TO KNOW IS THE CONTENT OF THE FOURTH BOOK RIGHT HERE." onclick="showTextTooltip(event,this)" data-translation="O QUE REALMENTE PRECISO SABER É O CONTEÚDO DO QUARTO LIVRO AQUI."></div><div class="text-hotspot" style="left:31%;top:99.14583333333333%;width:38.375%;height:.8385416666666666%" data-text="BY THE TITLE OF EVIL SPIRITS OF THE ABYSS." onclick="showTextTooltip(event,this)" data-translation="COM O TÍTULO DE ESPÍRITOS MALIGNOS DO ABISMO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/17/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:31.624999999999996%;top:2.421875%;width:60%;height:.828125%" data-text="IN THIS WORLD EXISTS EVIL SPIRITS FROM OTHER DIMENSIONS..." onclick="showTextTooltip(event,this)" data-translation="NESTE MUNDO EXISTEM ESPÍRITOS MALIGNOS DE OUTRAS DIMENSÕES..."></div><div class="text-hotspot" style="left:5.375%;top:7.661458333333333%;width:54.625%;height:.8645833333333334%" data-text="...THAT TAKE OVER THE BODIES OF INNOCENT INDIVIDUALS HERE." onclick="showTextTooltip(event,this)" data-translation="...QUE TOMAM POSSE DOS CORPOS DE INDIVÍDUOS INOCENTES AQUI."></div><div class="text-hotspot" style="left:20.125%;top:14.036458333333332%;width:44.625%;height:.7135416666666666%" data-text="TO BE FAIR, THEY'RE NOT ENTIRELY WRONG." onclick="showTextTooltip(event,this)" data-translation="PARA SER JUSTO, ELES NÃO ESTÃO TOTALMENTE ERRADOS."></div><div class="text-hotspot" style="left:23.125%;top:19.567708333333332%;width:55.875%;height:.953125%" data-text="IT OFFERS NO THEORY ABOUT HOW THESE EVIL SPIRITS FIND THEIR WAYS INTO THIS WORLD..." onclick="showTextTooltip(event,this)" data-translation="NÃO OFERECE NENHUMA TEORIA SOBRE COMO ESSES ESPÍRITOS MALIGNOS ENCONTRAM SEUS CAMINHOS PARA ESTE MUNDO..."></div><div class="text-hotspot" style="left:25%;top:28.869791666666668%;width:50.125%;height:1.484375%" data-text="...BUT DOES EXPLAIN WHAT THE ROYAL COURT AND TEMPLARS DID IN ORDER TO HUNT DOWN THE APPARITIONS." onclick="showTextTooltip(event,this)" data-translation="...MAS EXPLICA O QUE A CORTE REAL E OS TEMPLÁRIOS FIZERAM PARA CAÇAR AS APARIÇÕES."></div><div class="text-hotspot" style="left:68.25%;top:34.260416666666664%;width:28.249999999999996%;height:.7760416666666666%" data-text="TAP" onclick="showTextTooltip(event,this)" data-translation="TAP"></div><div class="text-hotspot" style="left:12.75%;top:38.223958333333336%;width:65.625%;height:1.734375%" data-text="MEANING, AS LONG AS I AVOID MENTIONING TABOO WORDS ASSOCIATED WITH THE PRESENCE OF EVIL SPIRITS, I WILL NOT AROUSE ANYONE'S SUSPICIONS." onclick="showTextTooltip(event,this)" data-translation="SIGNIFICANDO QUE, ENQUANTO EU EVITAR MENCIONAR PALAVRAS TABU ASSOCIADAS À PRESENÇA DE ESPÍRITOS MALIGNOS, NÃO SUSCITAREI SUSPEITAS."></div><div class="text-hotspot" style="left:50%;top:40.21354166666667%;width:39.25%;height:.609375%" data-text="THAT'S A REALLY SOLID TIP FOR EVIL SPIRITS." onclick="showTextTooltip(event,this)" data-translation="ESSA É UMA DICA REALMENTE SÓLIDA PARA ESPÍRITOS MALIGNOS."></div><div class="text-hotspot" style="left:24.125%;top:45.260416666666664%;width:51.24999999999999%;height:.8177083333333333%" data-text="FIFTH BOOK IS TITLED ABOUT THE DEATH OF THE KING" onclick="showTextTooltip(event,this)" data-translation="QUINTO LIVRO É INTITULADO SOBRE A MORTE DO REI"></div><div class="text-hotspot" style="left:7.625%;top:47.03125%;width:84.625%;height:1.5%" data-text="THIS BOOK IS ABOUT THE DEATH OF THE FOUNDER OF THE KINGDOM RABIGHION III, ALSO KNOWN AS RABIGHION THE IMMORTAL." onclick="showTextTooltip(event,this)" data-translation="ESTE LIVRO É SOBRE A MORTE DO FUNDADOR DO REINO RABIGHION III, TAMBÉM CONHECIDO COMO RABIGHION O IMORTAL."></div><div class="text-hotspot" style="left:28.875%;top:52.197916666666664%;width:42.5%;height:1.1614583333333428%" data-text="RECORDS INDICATE THAT HE DIED 150 YEARS AGO." onclick="showTextTooltip(event,this)" data-translation="OS REGISTROS INDICAM QUE ELE MORREU HÁ 150 ANOS."></div><div class="text-hotspot" style="left:27.375%;top:56.43749999999999%;width:46.125%;height:.9479166666666714%" data-text="THE START OF THE GAME WAS ONE DAY AFTER HIS PASSING WHEN I PLAYED." onclick="showTextTooltip(event,this)" data-translation="O INÍCIO DO JOGO FOI UM DIA APÓS SUA MORTE QUANDO JOGUEI."></div><div class="text-hotspot" style="left:29.75%;top:60.01562499999999%;width:40.5%;height:.13541666666666669%" data-text="Rabighion III passed away." onclick="showTextTooltip(event,this)" data-translation="Rabighion III faleceu."></div><div class="text-hotspot" style="left:15.25%;top:61.463541666666664%;width:42.375%;height:.953125%" data-text="I AM 150 YEARS IN THE FUTURE FROM THE TIMELINE I REMEMBER." onclick="showTextTooltip(event,this)" data-translation="ESTOU 150 ANOS NO FUTURO EM RELAÇÃO À LINHA DO TEMPO QUE LEMBRO."></div><div class="text-hotspot" style="left:34.875%;top:63.260416666666664%;width:50.125%;height:1.203125000000007%" data-text="NO WONDER THERE WERE DISCREPANCIES BETWEEN MY KNOWLEDGE AND HERE." onclick="showTextTooltip(event,this)" data-translation="NÃO É À TOA QUE HAVIA DISCREPÂNCIAS ENTRE MEUS CONHECIMENTOS E AQUI."></div><div class="text-hotspot" style="left:18.875%;top:69.82291666666667%;width:62.5%;height:.8333333333333334%" data-text="NEXT BOOK IS TITLED RECORDS OF INSTABILITY BETWEEN DIMENSIONS" onclick="showTextTooltip(event,this)" data-translation="PRÓXIMO LIVRO É INTITULADO REGISTROS DE INSTABILIDADE ENTRE DIMENSÕES"></div><div class="text-hotspot" style="left:12.125%;top:77.72395833333333%;width:55%;height:.9531250000000142%" data-text="COULD THIS BE THE BOOK THE BLOND KNIGHT THAT SAVED ME WAS TALKING ABOUT?" onclick="showTextTooltip(event,this)" data-translation="SERÁ QUE ESTE É O LIVRO QUE O CAVALEIRO LOIRO QUE ME SALVOU ESTAVA FALANDO?"></div><div class="text-hotspot" style="left:31.5%;top:88.65104166666666%;width:36.5%;height:1.4739583333333335%" data-text="WHAT I EXPERIENCED WAS DEFINITELY AN EXTREMELY RARE ANOMALY AS THAT GUY PUT IT." onclick="showTextTooltip(event,this)" data-translation="O QUE VIVI FOI DEFINITIVAMENTE UMA ANOMALIA EXTREMAMENTE RARA, COMO AQUELE CARA DISSE."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/17/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22.375%;top:.3489583333333333%;width:41.25%;height:.6875%" data-text="BUT THE BOOK ADDRESSES A HYPOTHESIS..." onclick="showTextTooltip(event,this)" data-translation="MAS O LIVRO ABORDA UMA HIPÓTESE..."></div><div class="text-hotspot" style="left:41.375%;top:8.994791666666666%;width:44%;height:1.21875%" data-text="...THAT ENTERING THE PORTAL IMMEDIATELY BEFORE CLOSING MAY HAVE TO DO WITH IT." onclick="showTextTooltip(event,this)" data-translation="...QUE ENTRAR NO PORTAL IMEDIATAMENTE ANTES DE FECHAR PODE TER A VER COM ISSO."></div><div class="text-hotspot" style="left:17.625%;top:16.927083333333336%;width:51%;height:1.46875%" data-text="BASICALLY, IT WAS ENTIRELY MY FAULT THAT MY STARTING POSITION WAS WITHIN THE DARK AREA. IT WAS ME THAT HESITATED." onclick="showTextTooltip(event,this)" data-translation="BASICAMENTE, FOI TOTALMENTE MINHA CULPA QUE MINHA POSIÇÃO INICIAL FOSSE DENTRO DA ÁREA ESCURA. FUI EU QUE HESITEI."></div><div class="text-hotspot" style="left:51.24999999999999%;top:19.109375%;width:39.125%;height:1.2291666666666665%" data-text="F*CK, THIS IS DEPRESSING. I SHOULD STOP THINKING ABOUT THIS." onclick="showTextTooltip(event,this)" data-translation="MERDA, ISSO É DEPRIMENTE. DEVO PARAR DE PENSAR NISSO."></div><div class="text-hotspot" style="left:20.625%;top:20.854166666666664%;width:12.625%;height:1.3854166666666667%" data-text="[01-4 WE" onclick="showTextTooltip(event,this)" data-translation="[01-4 NÓS"></div><div class="text-hotspot" style="left:4.75%;top:20.875%;width:31.5%;height:1.6614583333333321%" data-text="101-49234 00" onclick="showTextTooltip(event,this)" data-translation="101-49234 00"></div><div class="text-hotspot" style="left:22.625%;to spot" style="left:37%;top:65.19791666666667%;width:53.125%;height:.703125%" data-text="... THAT'S AWESOME. CAN YOU RECALL IT NOW?" onclick="showTextTooltip(event,this)" data-translation="... ISSO É INCRÍVEL. VOCÊ PODE CHAMÁ-LO DE VOLTA AGORA?"></div><div class="text-hotspot" style="left:21.125%;top:68.78125%;width:26.125%;height:.8177083333333333%" data-text="AWW" onclick="showTextTooltip(event,this)" data-translation="AWW"></div><div class="text-hotspot" style="left:19%;top:71.484375%;width:43.875%;height:1.1979166666666714%" data-text="BUT I DIDN'T EVEN SHOW YOU HALF OF WHAT IT DOES!" onclick="showTextTooltip(event,this)" data-translation="MAS EU NEM MOSTREI METADE DO QUE ELE FAZ!"></div><div class="text-hotspot" style="left:35.875%;top:76.80208333333334%;width:38.625%;height:.9583333333333333%" data-text="YOU ALREADY MADE ENOUGH OF A MESS IN MY ROOM." onclick="showTextTooltip(event,this)" data-translation="VOCÊ JÁ FEZ BASTANTE BAGUNÇA NO MEU QUARTO."></div><div class="text-hotspot" style="left:0;top:79.22916666666666%;width:94.25%;height:3.1145833333333335%" data-text="WHOOSH" onclick="showTextTooltip(event,this)" data-translation="WHOOSH"></div><div class="text-hotspot" style="left:60.12499999999999%;top:94.14583333333333%;width:11%;height:.22395833333333334%" data-text="AH!" onclick="showTextTooltip(event,this)" data-translation="AH!"></div><div class="text-hotspot" style="left:64.625%;top:94.83333333333334%;width:35.125%;height:1.0104166666666665%" data-text="YIKES" onclick="showTextTooltip(event,this)" data-translation="YIKES"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/17/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:23.25%;top:1.2864583333333335%;width:30.25%;height:.5572916666666667%" data-text="I'M SO SORRY!!" onclick="showTextTooltip(event,this)" data-translation="ME DESCULPE!!"></div><div class="text-hotspot" style="left:41%;top:2.1770833333333335%
