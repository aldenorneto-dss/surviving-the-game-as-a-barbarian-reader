 out'** é usada para pedir que alguém escute o que você tem a dizer antes de julgar ou tomar uma decisão. - Please **hear me out** before you say no."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/48/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:31.624999999999996%;top:3.9739583333333335%;width:49.25%;height:1.1510416666666667%" data-text="WE WERE BEING USED BY THAT WITCH, I SWEAR!" onclick="showTextTooltip(event,this)" data-translation="FOMOS USADOS POR AQUELA BRUXA, EU JURO!" data-tips="💡 A estrutura **'We were being used'** é um exemplo de voz passiva, indicando que eles eram o objeto da ação de outra pessoa, no caso, a bruxa. - The employees **were being used** by the company for unpaid overtime."></div><div class="text-hotspot" style="left:20.25%;top:9.984375%;width:59.75%;height:.9479166666666679%" data-text="THERE WERE ONLY THREE LEFT, WHEN WE CAUGHT UP TO YOUR PARTY." onclick="showTextTooltip(event,this)" data-translation="SÓ RESTAVAM TRÊS QUANDO ALCANÇAMOS SEU GRUPO."></div><div class="text-hotspot" style="left:17.125%;top:25.526041666666664%;width:67.125%;height:1.484375%" data-text="WE ATTACKED THE MAN THAT SEEMED TO BE THE NAVIGATOR FIRST AND INFLICTED AN INJURY, TO PREVENT THEM FROM RUNNING AWAY." onclick="showTextTooltip(event,this)" data-translation="ATACAMOS O HOMEM QUE PARECIA SER O NAVEGADOR PRIMEIRO E CAUSAMOS UM FERIMENTO, PARA IMPEDIR QUE FUGISSEM." data-tips="💡 A palavra **'inflict'** é usada para descrever a ação de causar dor ou dano. É frequentemente usada em contextos de ferimentos ou danos. - The storm **inflicted** heavy damage on the coastal town."></div><div class="text-hotspot" style="left:73.75%;top:28.005208333333332%;width:14.875%;height:.22395833333333334%" data-text="ACK!" onclick="showTextTooltip(event,this)" data-translation="ACK!"></div><div class="text-hotspot" style="left:25%;top:29.151041666666664%;width:37.375%;height:1.4791666666666667%" data-text="JOSH" onclick="showTextTooltip(event,this)" data-translation="JOSH"></div><div class="text-hotspot" style="left:50.74999999999999%;top:35.052083333333336%;width:39.75%;height:.21354166666666666%" data-text="ROTMILLER!!" onclick="showTextTooltip(event,this)" data-translation="ROTMILLER!!"></div><div class="text-hotspot" style="left:25%;top:36.505208333333336%;width:49.75%;height:1.4791666666666667%" data-text="B-BUT IT WASN'T A GRAVE INJURY OR ANYTHING! IT ONLY SCRAPED OFF HIS SHOULDERS." onclick="showTextTooltip(event,this)" data-translation="M-MAS NÃO FOI UM FERIMENTO GRAVE OU ALGO ASSIM! SÓ ARRANHOU OS OMBROS DELE."></div><div class="text-hotspot" style="left:21.625%;top:42.67708333333333%;width:56.75%;height:.953125%" data-text="AND THAT WAS WHEN A MYSTERIOUS LIGHT PUSHED ME AND MY COMPANIONS BACK." onclick="showTextTooltip(event,this)" data-translation="E FOI QUANDO UMA LUZ MISTERIOSA NOS EMPURROU, A MIM E A MEUS COMPANHEIROS." data-tips="💡 'When we came back to our senses' é uma expressão que significa 'quando recuperamos a consciência'. É usada para descrever o momento em que alguém volta ao estado normal de consciência."></div><div class="text-hotspot" style="left:21%;top:45.520833333333336%;width:24.5%;height:.25%" data-text="OUCH!!" onclick="showTextTooltip(event,this)" data-translation="AI!!"></div><div class="text-hotspot" style="left:47.625%;top:50.09895833333333%;width:33.875%;height:.47916666666666663%" data-text="WH-WHAT'S THIS?!" onclick="showTextTooltip(event,this)" data-translation="O-O QUE É ISSO?!"></div><div class="text-hotspot" style="left:23.5%;top:57.385416666666664%;width:61.75000000000001%;height:1.2291666666666665%" data-text="WHEN WE CAME BACK TO OUR SENSES, OUR NAVIGATOR'S HEAD HAD BEEN PIERCED BY THE ICICLE SPEAR." onclick="showTextTooltip(event,this)" data-translation="QUANDO VOLTAMOS A NÓS, A CABEÇA DO NOSSO NAVEGADOR TINHA SIDO PERFURADA PELA LANÇA DE GELO."></div><div class="text-hotspot" style="left:55.00000000000001%;top:60.890625%;width:32.5%;height:.47916666666666663%" data-text="LIGH, WHEN DID YOU...?" onclick="showTextTooltip(event,this)" data-translation="LIGH, QUANDO VOCÊ...?"></div><div class="text-hotspot" style="left:36.125%;top:71.55729166666667%;width:45.5%;height:.96875%" data-text="SOUNDS LIKE HIKUROD AND OTHERS SUCCESSFULLY FLED. THAT'S A RELIEF." onclick="showTextTooltip(event,this)" data-translation="PARECE QUE HIKUROD E OUTROS FUGIRAM COM SUCESSO. QUE ALÍVIO." data-tips="💡 A expressão **'that's a relief'** é usada para expressar alívio ou satisfação pelo resultado de uma situação. - When she heard the good news, she said, '**That's a relief**.'"></div><div class="text-hotspot" style="left:20.125%;top:73.42708333333333%;width:46%;height:.953125%" data-text="THE SCREAM MUST HAVE BEEN FROM WHEN ROTMILLER SUSTAINED THE INJURY." onclick="showTextTooltip(event,this)" data-translation="O GRITO DEVE TER SIDO QUANDO ROTMILLER SOFREU O FERIMENTO."></div><div class="text-hotspot" style="left:6.5%;top:77.69270833333334%;width:20.625%;height:.7708333333333334%" data-text="GULP" onclick="showTextTooltip(event,this)" data-translation="ENGOLIR"></div><div class="text-hotspot" style="left:21.875%;top:86.59895833333333%;width:39.5%;height:.9583333333333333%" data-text="WITH OUR NAVIGATOR LYING DEAD ON THE GROUND..." onclick="showTextTooltip(event,this)" data-translation="COM NOSSO NAVEGADOR MORTO NO CHÃO..." data-tips="💡 A expressão &quot;lying dead on the ground&quot; é uma forma de descrever que alguém está morto e caído no chão. Em inglês, o verbo **lie** pode significar &quot;estar deitado&quot; ou &quot;estar localizado&quot;, dependendo do contexto."></div><div class="text-hotspot" style="left:40.25%;top:87.890625%;width:41.5%;height:1.4791666666666714%" data-text="WE HAD TO GIVE UP ON CHASING AFTER THEM BECAUSE WE GOT LOST AS WELL." onclick="showTextTooltip(event,this)" data-translation="TIVEMOS QUE DESISTIR DE PERSEGUI-LOS PORQUE TAMBÉM NOS PERDEMOS." data-tips="💡 O phrasal verb **give up on** significa desistir de algo ou alguém. É uma construção comum em inglês para indicar que você parou de tentar ou de ter esperança em algo. - *I had to give up on the project because it was too complicated.*"></div><div class="text-hotspot" style="left:24%;top:91.67708333333333%;width:20.5%;height:.5052083333333333%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:55.25%;top:94.14583333333333%;width:4.375%;height:.6666666666666667%" data-text="XXXXXXXXXXXX" onclick="showTextTooltip(event,this)" data-translation="XXXXXXXXXXXX"></div><div class="text-hotspot" style="left:69.25%;top:95.80729166666667%;width:21.25%;height:.546875%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/48/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:18.375%;top:2.442708333333333%;width:63.125%;height:1.4635416666666667%" data-text="AND THE TROUBLE BEGAN ABOUT TWO DAYS AFTER WE STARTED WANDERING." onclick="showTextTooltip(event,this)" data-translation="E O PROBLEMA COMEÇOU CERCA DE DOIS DIAS DEPOIS QUE COMEÇAMOS A VAGAR." data-tips="💡 A expressão **about two days after** indica um tempo aproximado. Em inglês, **about** é frequentemente usado para indicar algo que não é exato, especialmente em relação a tempo ou quantidade. - *We arrived about an hour later.*"></div><div class="text-hotspot" style="left:57.75%;top:7.645833333333334%;width:25%;height:.46875%" data-text="L-LADY ELISA...?" onclick="showTextTooltip(event,this)" data-translation="L-LADY ELISA...?"></div><div class="text-hotspot" style="left:10.5%;top:13.140625%;width:30.375000000000004%;height:.9062499999999999%" data-text="BLUSH" onclick="showTextTooltip(event,this)" data-translation="CORAR"></div><div class="text-hotspot" style="left:43.875%;top:19.395833333333336%;width:25%;height:.23958333333333331%" data-text="AAACK!!" onclick="showTextTooltip(event,this)" data-translation="AAACK!!"></div><div class="text-hotspot" style="left:5.125%;top:20.40625%;width:21.375%;height:.8697916666666666%" data-text="GRRR" onclick="showTextTooltip(event,this)" data-translation="GRRR"></div><div class="text-hotspot" style="left:67.75%;top:20.890625%;width:27.875%;height:.8593750000000001%" data-text="GRRR" onclick="showTextTooltip(event,this)" data-translation="GRRR"></div><div class="text-hotspot" style="left:16.25%;top:24.625%;width:34%;height:.7708333333333334%" data-text="WH-WHAT'S GOING ON?! HANS?!" onclick="showTextTooltip(event,this)" data-translation="O-O QUE ESTÁ ACONTECENDO?! HANS?!"></div><div class="text-hotspot" style="left:18%;top:31.166666666666664%;width:63.625%;height:1.328125%" data-text="WE REALIZED ONLY AFTER OUR COMPANION WITHERED TO DEATH IN FRONT OF OUR EYES." onclick="showTextTooltip(event,this)" data-translation="PERCEBEMOS SÓ DEPOIS QUE NOSSO COMPANHEIRO DEFINHOU ATÉ A MORTE NA NOSSA FRENTE." data-tips="💡 A expressão **withered to death** é uma forma figurativa de dizer que alguém definhou até morrer, geralmente por falta de cuidados ou condições adversas. **Wither** significa murchar ou definhar."></div><div class="text-hotspot" style="left:38.25%;top:37.078125%;width:30%;height:.20833333333333334%" data-text="PATHETIC." onclick="showTextTooltip(event,this)" data-translation="PATÉTICO."></div><div class="text-hotspot" style="left:27.875%;top:38.078125%;width:27.750000000000004%;height:.8177083333333333%" data-text="GRRRR" onclick="showTextTooltip(event,this)" data-translation="GRRRR"></div><div class="text-hotspot" style="left:66.5%;top:40.953125%;width:31%;height:.7291666666666666%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)" data-translation="RISADA"></div><div class="text-hotspot" style="left:16.5%;top:44.916666666666664%;width:65%;height:1.6197916666666665%" data-text="THAT THE WITCH WAS AN EVIL PRIESTESS IN SERVICE OF KARUI!" onclick="showTextTooltip(event,this)" data-translation="QUE A BRUXA ERA UMA SACERDOTISA MALIGNA A SERVIÇO DE KARUI!" data-tips="💡 'In service of' é uma expressão que indica que alguém está trabalhando para ou servindo a outra pessoa ou entidade."></div><div class="text-hotspot" style="left:18%;top:51.31250000000001%;width:63.375%;height:1.4791666666666667%" data-text="WE WERE FOOLED BY THAT HAG! I SWEAR TO THE GODDESS THAT WE WEREN'T TRYING TO COMMIT THE ACT OF PLUNDERING!" onclick="showTextTooltip(event,this)" data-translation="FOMOS ENGANADOS POR AQUELA BRUXA! EU JURO À DEUSA QUE NÃO ESTÁVAMOS TENTANDO COMETER O ATO DE SAQUE!" data-tips="💡 **I swear to the goddess** é uma expressão usada para enfatizar a sinceridade de uma afirmação. Em português, seria como dizer &quot;juro por Deus&quot;. É uma forma de mostrar convicção."></div><div class="text-hotspot" style="left:43.875%;top:55.52083333333333%;width:14.374999999999998%;height:.4270833333333333%" data-text="SHUT UP." onclick="showTextTooltip(event,this)" data-translation="CALE A BOCA."></div><div class="text-hotspot" style="left:43.25%;top:58.21875%;width:3.6249999999999996%;height:.16145833333333334%" data-text="节" onclick="showTextTooltip(event,this)" data-translation="节"></div><div class="text-hotspot" style="left:11.125%;top:62.94270833333333%;width:76.625%;height:3.0989583333333286%" data-text="C-COME TO THINK OF IT, WE HAVEN'T APOLOGIZED FOR OUR MISTAKES YET! WE'RE TRULY SORRY! WE WERE DECEIVED BY THE TRICKERY, BECAUSE OF OUR INCOMPETENCE!" onclick="showTextTooltip(event,this)" data-translation="P-PENSANDO BEM, AINDA NÃO PEDIMOS DESCULPAS POR NOSSOS ERROS! ESTAMOS REALMENTE ARREPENDIDOS! FOMOS ENGANADOS PELA TRAPAÇA, POR CAUSA DA NOSSA INCOMPETÊNCIA!" data-tips="- **Come to think of it** é uma expressão usada para indicar que você acabou de se lembrar ou reconsiderar algo. Em português, seria como dizer &quot;pensando bem&quot;. - *Come to think of it, I haven't seen him all day.*"></div><div class="text-hotspot" style="left:31.25%;top:74.71354166666667%;width:56.125%;height:1.6354166666666665%" data-text="WE WILL OBVIOUSLY COMPENSATE YOU GREATLY FOR THE DAMAGES WE HAVE CAUSED!" onclick="showTextTooltip(event,this)" data-translation="OBVIAMENTE VAMOS COMPENSÁ-LOS GENEROSAMENTE PELOS DANOS QUE CAUSAMOS!" data-tips="💡 A palavra **compensate** significa compensar ou indenizar alguém por danos ou perdas. É um termo formal que pode ser usado em contextos legais ou de negócios. - *We will compensate you for the inconvenience.*"></div><div class="text-hotspot" style="left:16.625%;top:76.66145833333333%;width:46.875%;height:.75%" data-text="SO PLEASE HAVE MERCY ON US THIS ONCE!!" onclick="showTextTooltip(event,this)" data-translation="ENTÃO, POR FAVOR, TENHA PIEDADE DE NÓS ESTA VEZ!!"></div><div class="text-hotspot" style="left:14.124999999999998%;top:82.36979166666667%;width:35.5%;height:.7083333333333333%" data-text="BJORN, I WILL DO AS YOU SAYYY." onclick="showTextTooltip(event,this)" data-translation="BJORN, EU FAREI COMO VOCÊ DISSERRRR."></div><div class="text-hotspot" style="left:49%;top:90.21354166666666%;width:23.75%;height:.6875000000000142%" data-text="HMM. WHAT SHOULD WE DO?" onclick="showTextTooltip(event,this)" data-translation="HMM. O QUE DEVEMOS FAZER?"></div><div class="text-hotspot" style="left:22.5%;top:97.10416666666667%;width:54.625%;height:.6927083333333334%" data-text="I KILLED A FEW ALREADY SINCE I GOT TRANSPORTED TO THIS UNIVERSE." onclick="showTextTooltip(event,this)" data-translation="JÁ MATEI ALGUNS DESDE QUE FUI TRANSPORTADO PARA ESTE UNIVERSO." data-tips="💡 'Since I got transported' usa o Present Perfect para indicar uma ação que começou no passado e continua até o presente."></div><div class="text-hotspot" style="left:14.374999999999998%;top:99.27604166666667%;width:30.25%;height:.359375%" data-text="LET'S BE NIGHT COMPANIONS." onclick="showTextTooltip(event,this)" data-translation="VAMOS SER COMPANHEIROS NOTURNOS."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/48/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:21.625%;top:1.609375%;width:30.5%;height:.3645833333333333%" data-text="COME THIS WAY I'LL HELP" onclick="showTextTooltip(event,this)" data-translation="VENHA POR AQUI, EU AJUDO"></div><div class="text-hotspot" style="left:16.5%;top:5.760416666666666%;width:45%;height:1.208333333333334%" data-text="BUT ALL OF THEM WERE COMPLETE TRASH THAT DID NOT DESERVE TO LIVE," onclick="showTextTooltip(event,this)" data-translation="MAS TODOS ELES ERAM COMPLETAMENTE LIXO QUE NÃO MERECIAM VIVER," data-tips="💡 A expressão **complete trash** é uma gíria para descrever algo ou alguém como totalmente inútil ou sem valor. É uma linguagem coloquial e pode ser substituída por &quot;worthless&quot; em um contexto mais formal."></div><div class="text-hotspot" style="left:37.375%;top:7.609375%;width:44.125%;height:1.1979166666666679%" data-text="AND THE CIRCUMSTANCES WERE TOO DIRE FOR ME TO COME UP WITH AN ALTERNATIVE." onclick="showTextTooltip(event,this)" data-translation="E AS CIRCUNSTÂNCIAS ERAM TÃO GRAVES QUE NÃO PUDE PENSAR EM UMA ALTERNATIVA." data-tips="💡 **Come up with** é um phrasal verb que significa inventar ou criar algo, especialmente uma ideia ou solução. - *She came up with a great plan to improve sales.*"></div><div class="text-hotspot" style="left:35.375%;top:14.838541666666666%;width:28.249999999999996%;height:.4322916666666667%" data-text="WHEREAS WITH THESE GUYS..." onclick="showTextTooltip(event,this)" data-translation="ENQUANTO QUE COM ESSES CARAS..."></div><div class="text-hotspot" style="left:67.625%;top:18.005208333333332%;width:29.375%;height:.5833333333333334%" data-text="TREMBLE" onclick="showTextTooltip(event,this)" data-translation="TREMOR"></div><div class="text-hotspot" style="left:57.75%;top:19.666666666666664%;width:33.5%;height:.16
