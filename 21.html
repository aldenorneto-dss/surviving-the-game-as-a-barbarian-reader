<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>21</title></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/21/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:24.75%;top:2.8125%;width:50.5%;height:.35416666666666663%" data-text="PLUNDERERS." onclick="showTextTooltip(event,this)" data-translation="SAQUEADORES."></div><div class="text-hotspot" style="left:20.125%;top:6.984375%;width:59.375%;height:1.1145833333333321%" data-text="A THEY SPECIFICALLY TARGET OTHER ADVENTURERS INSTEAD OF MONSTERS... 4" onclick="showTextTooltip(event,this)" data-translation="ELES ESPECIFICAMENTE MIRAM OUTROS AVENTUREIROS EM VEZ DE MONSTROS..." data-tips="💡 A expressão 'instead of' é usada para indicar substituição ou preferência por uma coisa em vez de outra. Exemplo: 'I will have tea instead of coffee.'"></div><div class="text-hotspot" style="left:53.75%;top:9.395833333333334%;width:2.75%;height:.057291666666666664%" data-text="Ge" onclick="showTextTooltip(event,this)" data-translation="Ge"></div><div class="text-hotspot" style="left:75.5%;top:14.994791666666666%;width:8.25%;height:.4322916666666667%" data-text="821" onclick="showTextTooltip(event,this)" data-translation="821"></div><div class="text-hotspot" style="left:24%;top:17.526041666666668%;width:52%;height:.9583333333333333%" data-text="...AND LOOT THE FALLEN VICTIMS' HIGH QUALITY EQUIPMENTS TO SELL FOR HIGH PRICES." onclick="showTextTooltip(event,this)" data-translation="...E SAQUEIAM OS EQUIPAMENTOS DE ALTA QUALIDADE DAS VÍTIMAS CAÍDAS PARA VENDER POR ALTOS PREÇOS." data-tips="💡 'Loot' é um verbo que significa saquear ou pilhar, geralmente em contexto de guerra ou roubo. Pode ser usado em frases como 'The pirates looted the village.'"></div><div class="text-hotspot" style="left:36.125%;top:22.46875%;width:53.625%;height:.953125%" data-text="OF COURSE, ACT OF PLUNDERING IS A GRAVE CRIME IN RAFDONIA, PUNISHABLE BY DEATH." onclick="showTextTooltip(event,this)" data-translation="CLARO, O ATO DE SAQUEAR É UM CRIME GRAVE EM RAFDONIA, PUNÍVEL COM A MORTE." data-tips="💡 'Punishable by death' é uma expressão padrão para indicar que a pena para um crime é a morte. Em português, usamos 'punível com a morte'."></div><div class="text-hotspot" style="left:10.625%;top:32.588541666666664%;width:48.625%;height:.7083333333333333%" data-text="HOWEVER, JUST LIKE HOW I WASN'T INVESTIGATED AT ALL," onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, ASSIM COMO EU NÃO FUI INVESTIGADO DE FORMA ALGUMA," data-tips="💡 'Just like' é uma expressão usada para fazer comparações, similar a 'assim como' em português."></div><div class="text-hotspot" style="left:37.5%;top:33.78125%;width:50.875%;height:.6927083333333334%" data-text="EVEN AFTER I KILLED SIX ADVENTURERS DURING MY LAST JOURNEY..." onclick="showTextTooltip(event,this)" data-translation="MESMO DEPOIS DE EU TER MATADO SEIS AVENTUREIROS DURANTE MINHA ÚLTIMA JORNADA..."></div><div class="text-hotspot" style="left:55.375%;top:35.432291666666664%;width:39.75%;height:.3645833333333333%" data-text="ALTHOUGH MINE WAS IN SELF-DEFENSE." onclick="showTextTooltip(event,this)" data-translation="EMBORA NO MEU CASO TENHA SIDO EM LEGÍTIMA DEFESA."></div><div class="text-hotspot" style="left:16.625%;top:40.28125%;width:66.875%;height:1.2395833333333333%" data-text="...THERE IS NO WAY THE AUTHORITIES WOULD KNOW OF EVENTS THAT TRANSPIRE WITHIN THE LABYRINTH, UNLESS SOMEBODY REPORTS THEM." onclick="showTextTooltip(event,this)" data-translation="...NÃO HÁ COMO AS AUTORIDADES SABEREM DOS EVENTOS QUE OCORREM DENTRO DO LABIRINTO, A MENOS QUE ALGUÉM OS DENUNCIE." data-tips="💡 A expressão 'there is no way' é usada para indicar impossibilidade ou improbabilidade, semelhante a 'não há como' em português."></div><div class="text-hotspot" style="left:27.250000000000004%;top:44.135416666666664%;width:46.5%;height:.8177083333333357%" data-text="FIRST TIME SEEING A PLUNDERER?" onclick="showTextTooltip(event,this)" data-translation="PRIMEIRA VEZ VENDO UM SAQUEADOR?"></div><div class="text-hotspot" style="left:71.5%;top:46.088541666666664%;width:25.5%;height:.7604166666666667%" data-text="FLIP" onclick="showTextTooltip(event,this)" data-translation="VIRAR"></div><div class="text-hotspot" style="left:14.000000000000002%;top:61.286458333333336%;width:30.375000000000004%;height:.171875%" data-text="BARBARIAN." onclick="showTextTooltip(event,this)" data-translation="BÁRBARO."></div><div class="text-hotspot" style="left:55.50000000000001%;top:65.63020833333333%;width:36.5%;height:.9583333333333333%" data-text="CATCH" onclick="showTextTooltip(event,this)" data-translation="PEGAR"></div><div class="text-hotspot" style="left:53.25%;top:69.5625%;width:31.874999999999996%;height:.4322916666666667%" data-text="... THIS ISN'T GOOD." onclick="showTextTooltip(event,this)" data-translation="...ISSO NÃO É BOM."></div><div class="text-hotspot" style="left:27.625%;top:75.38541666666667%;width:48%;height:.953125%" data-text="I HAVEN'T SEEN A PLUNDERER THAT LOOKS AS EXPERIENCED AS YOU." onclick="showTextTooltip(event,this)" data-translation="NUNCA VI UM SAQUEADOR QUE PARECESSE TÃO EXPERIENTE COMO VOCÊ." data-tips="💡 A estrutura 'I haven't seen' é um exemplo de present perfect, usado para falar sobre experiências passadas com relevância no presente."></div><div class="text-hotspot" style="left:11.875%;top:80.31770833333334%;width:49.125%;height:.6979166666666714%" data-text="SHE'S PRETTY TALL FOR A HUMAN FEMALE, AND HAS A SLENDER BUILD." onclick="showTextTooltip(event,this)" data-translation="ELA É BEM ALTA PARA UMA MULHER HUMANA, E TEM UM CORPO ESBELTO." data-tips="💡 'Slender build' refere-se a uma estrutura corporal esbelta ou delgada, útil para descrever tipos físicos."></div><div class="text-hotspot" style="left:50.5%;top:86.74479166666667%;width:7.5%;height:.2760416666666667%" data-text="k b b b b b b" onclick="showTextTooltip(event,this)" data-translation="k b b b b b b"></div><div class="text-hotspot" style="left:41.375%;top:88.41666666666667%;width:50.75%;height:.9739583333333286%" data-text="RED HAIR THAT COMES DOWN TO HER SHOULDERS AND THE CUT ON HER RIGHT EAR." onclick="showTextTooltip(event,this)" data-translation="CABELOS VERMELHOS QUE VÃO ATÉ OS OMBROS E UM CORTE NA ORELHA DIREITA."></div><div class="text-hotspot" style="left:57.125%;top:92.22395833333333%;width:35%;height:.6979166666666666%" data-text="NOT TO MENTION THE TATTOO ON HER FACE." onclick="showTextTooltip(event,this)" data-translation="SEM FALAR NA TATUAGEM NO ROSTO DELA."></div><div class="text-hotspot" style="left:15.25%;top:97.38541666666667%;width:48.875%;height:1.2291666666666572%" data-text="THE FEATURES ARE SO DISTINCTIVE THAT IT'S SO EASY TO FIND HER BASED ON DESCRIPTIONS ALONE," onclick="showTextTooltip(event,this)" data-translation="AS CARACTERÍSTICAS SÃO TÃO DISTINTIVAS QUE É MUITO FÁCIL ENCONTRÁ-LA APENAS COM BASE NAS DESCRIÇÕES," data-tips="💡 'Based on' é uma expressão usada para indicar a base ou fundamento de uma afirmação, como em 'Based on the evidence, he is guilty.'"></div><div class="text-hotspot" style="left:36.125%;top:98.91145833333333%;width:50.5%;height:.9635416666666667%" data-text="YET SHE'S NOT COVERING HER FACE DESPITE THE CRIMES SHE'S COMMITTING." onclick="showTextTooltip(event,this)" data-translation="AINDA ASSIM ELA NÃO COBRE O ROSTO, MESMO COM OS CRIMES QUE ESTÁ COMETENDO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/21/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:29.875%;top:2.229166666666667%;width:40.5%;height:.9531249999999996%" data-text="MEANING, SHE MOST LIKELY HASN'T LEFT A SINGLE EYE-WITNESS THUS FAR." onclick="showTextTooltip(event,this)" data-translation="O QUE SIGNIFICA QUE, MUITO PROVAVELMENTE, ELA NÃO DEIXOU NENHUMA TESTEMUNHA OCULAR ATÉ AGORA." data-tips="💡 'Most likely' é uma expressão usada para indicar alta probabilidade, equivalente a 'muito provavelmente' em português."></div><div class="text-hotspot" style="left:40%;top:4.828125%;width:43.75%;height:.6875%" data-text="SHE LOOKS STRONG, BJORN." onclick="showTextTooltip(event,this)" data-translation="ELA PARECE FORTE, BJORN."></div><div class="text-hotspot" style="left:64.625%;top:6.057291666666666%;width:35.125%;height:.8177083333333333%" data-text="SWEAT" onclick="showTextTooltip(event,this)" data-translation="SUOR"></div><div class="text-hotspot" style="left:33.875%;top:12.661458333333334%;width:45.625%;height:1.2083333333333333%" data-text="GULP" onclick="showTextTooltip(event,this)" data-translation="ENGOLIR SECO"></div><div class="text-hotspot" style="left:32.75%;top:14.249999999999998%;width:5.375%;height:.04166666666666667%" data-text="..." onclick="showTextTooltip(event,this)" data-translation="..."></div><div class="text-hotspot" style="left:41.625%;top:19.463541666666668%;width:16.625%;height:.4270833333333333%" data-text="FOUR VICTIMS." onclick="showTextTooltip(event,this)" data-translation="QUATRO VÍTIMAS."></div><div class="text-hotspot" style="left:12.375%;top:26.510416666666664%;width:53.37499999999999%;height:.9427083333333334%" data-text="BASED ON THE QUALITY OF THEIR EQUIPMENTS AND THE PRESENCE OF A MAGE WITHIN THE PARTY," onclick="showTextTooltip(event,this)" data-translation="COM BASE NA QUALIDADE DOS EQUIPAMENTOS DELES E NA PRESENÇA DE UM MAGO NO GRUPO," data-tips="💡 'Based on' novamente aparece aqui para indicar que a conclusão foi tirada com base em certos fatos ou observações."></div><div class="text-hotspot" style="left:39.5%;top:27.927083333333336%;width:49.125%;height:.953125%" data-text="THEY WERE PROBABLY ADVENTURERS ACTIVELY EXPLORING ON THE FIFTH FLOOR OR HIGHER." onclick="showTextTooltip(event,this)" data-translation="PROVAVELMENTE ERAM AVENTUREIROS ATIVAMENTE EXPLORANDO O QUINTO ANDAR OU SUPERIOR."></div><div class="text-hotspot" style="left:4.75%;top:34.046875%;width:58.12500000000001%;height:.96875%" data-text="SINCE THREE OF THEM HAVE NO VISIBLE INJURIES ON THEM EXCEPT EVIDENCE OF PUKING OUT BLOOD," onclick="showTextTooltip(event,this)" data-translation="JÁ QUE TRÊS DELES NÃO TÊM FERIMENTOS VISÍVEIS, EXCETO EVIDÊNCIAS DE VÔMITO DE SANGUE," data-tips="💡 'Except' é uma preposição usada para indicar exclusão, semelhante a 'exceto' em português."></div><div class="text-hotspot" style="left:40.375%;top:35.45833333333333%;width:53.37499999999999%;height:1.21875%" data-text="THEY MUST HAVE BEEN POISONED TO DEATH, WHILE THE OTHER ONE SLAIN AFTER SHOWING SOME RESILIENCE." onclick="showTextTooltip(event,this)" data-translation="DEVEM TER SIDO ENVENENADOS ATÉ A MORTE, ENQUANTO O OUTRO FOI MORTO APÓS MOSTRAR ALGUMA RESISTÊNCIA." data-tips="💡 'Must have been' é usado para fazer suposições sobre o passado, indicando alta certeza de que algo aconteceu."></div><div class="text-hotspot" style="left:14.000000000000002%;top:42.302083333333336%;width:71.5%;height:.5885416666666666%" data-text="WERE THEY... YOUR COMPANIONS?" onclick="showTextTooltip(event,this)" data-translation="ELES ERAM... SEUS COMPANHEIROS?"></div><div class="text-hotspot" style="left:71.125%;top:45.02083333333333%;width:10%;height:.5364583333333334%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:42.875%;top:53.833333333333336%;width:40.875%;height:.4270833333333333%" data-text="THAT'S A GOOD QUESTION." onclick="showTextTooltip(event,this)" data-translation="ESSA É UMA BOA PERGUNTA."></div><div class="text-hotspot" style="left:0;top:54.07291666666667%;width:39%;height:1.125%" data-text="GRAB" onclick="showTextTooltip(event,this)" data-translation="AGARRAR"></div><div class="text-hotspot" style="left:19.875%;top:56.098958333333336%;width:3.25%;height:.10937500000000001%" data-text="L" onclick="showTextTooltip(event,this)" data-translation="L"></div><div class="text-hotspot" style="left:49.875%;top:57.58333333333333%;width:3.125%;height:.39583333333333337%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:46.75%;top:62.16666666666667%;width:42.75%;height:.9479166666666667%" data-text="BECAUSE THESE FOOLS COULD HAVE HONESTLY BELIEVED SO." onclick="showTextTooltip(event,this)" data-translation="PORQUE ESSES IDIOTAS PODERIAM HONESTAMENTE TER ACREDITADO QUE SIM." data-tips="💡 'Could have' indica uma possibilidade no passado que não se concretizou, como em 'They could have won the game.'"></div><div class="text-hotspot" style="left:16.5%;top:66.11458333333333%;width:30.625000000000004%;height:.71875%" data-text="RUSTLE" onclick="showTextTooltip(event,this)" data-translation="FOLHEAR"></div><div class="text-hotspot" style="left:40%;top:67.05208333333333%;width:28.000000000000004%;height:.6458333333333334%" data-text="RUSTLE" onclick="showTextTooltip(event,this)" data-translation="FOLHEAR"></div><div class="text-hotspot" style="left:12.875%;top:70.63541666666666%;width:39.75%;height:.9531250000000142%" data-text="SHE'S LOOTING THE CORPSES WHILE SHOWING HER BACK." onclick="showTextTooltip(event,this)" data-translation="ELA ESTÁ SAQUEANDO OS CORPOS ENQUANTO MOSTRA AS COSTAS." data-tips="💡 'While' é uma conjunção usada para indicar que duas ações ocorrem simultaneamente, semelhante a 'enquanto' em português."></div><div class="text-hotspot" style="left:48.25%;top:72.02604166666666%;width:43.75%;height:.9427083333333334%" data-text="I SUPPOSE SHE'S THAT CONFIDENT AGAINST TWO NOVICE BARBARIANS." onclick="showTextTooltip(event,this)" data-translation="SUPONHO QUE ELA ESTEJA TÃO CONFIANTE CONTRA DOIS BÁRBAROS NOVATOS." data-tips="💡 'I suppose' é uma maneira de expressar suposição ou opinião, mais formal que 'I think'."></div><div class="text-hotspot" style="left:47.75%;top:80.33333333333333%;width:45.375%;height:1.234375%" data-text="SWISH" onclick="showTextTooltip(event,this)" data-translation="SUSSURRAR"></div><div class="text-hotspot" style="left:17%;top:83.76041666666667%;width:42.375%;height:.6770833333333334%" data-text="AND SHE'S PUTTING A HUGE SWORD IN THAT TINY BAG." onclick="showTextTooltip(event,this)" data-translation="E ELA ESTÁ COLOCANDO UMA ESPADA ENORME NAQUELA BOLSA PEQUENA." data-tips="💡 'Huge' é um adjetivo para descrever algo muito grande ou enorme, útil em várias situações."></div><div class="text-hotspot" style="left:46.875%;top:84.86458333333333%;width:38.5%;height:.9322916666666572%" data-text="THAT MUST BE THE SUPER EXPENSIVE MAGICAL BACKPACK." onclick="showTextTooltip(event,this)" data-translation="DEVE SER A MOCHILA MÁGICA SUPER CARA."></div><div class="text-hotspot" style="left:29.75%;top:91.36979166666667%;width:40.25%;height:.9479166666666714%" data-text="I CAN'T EVEN FATHOM HOW MUCH STRONGER SHE IS THAN US." onclick="showTextTooltip(event,this)" data-translation="NÃO CONSIGO NEM IMAGINAR O QUÃO MAIS FORTE ELA É DO QUE NÓS." data-tips="💡 'Fathom' é um verbo que significa compreender ou imaginar algo, geralmente usado em contextos de dificuldade para entender."></div><div class="text-hotspot" style="left:28.875%;top:94.953125%;width:41.625%;height:.22395833333333334%" data-text="BARBARIANS." onclick="showTextTooltip(event,this)" data-translation="BÁRBAROS."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/21/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:41.625%;top:1.6927083333333333%;width:6.5%;height:.203125%" data-text="?!" onclick="showTextTooltip(event,this)" data-translation="?!"></div><div class="text-hotspot" style="left:39.375%;top:5.786458333333333%;width:33.5%;height:.6510416666666667%" data-text="GULP" onclick="showTextTooltip(event,this)" data-translation="ENGOLIR SECO"></div><div class="text-hotspot" style="left:28.000000000000004%;top:11.697916666666666%;width:44.25%;height:1.2083333333333333%" data-text="THERE IS ONLY ONE LOGICAL CHOICE WE CAN MAKE HERE, IN ORDER TO SURVIVE." onclick="showTextTooltip(event,this)" data-translation="HÁ APENAS UMA ESCOLHA LÓGICA QUE PODEMOS FAZER AQUI, PARA SOBREVIVER." data-tips="💡 'There is only one logical choice' é uma estrutura usada para enfatizar que uma opção é claramente a melhor ou única viável."></div><div class="text-hotspot" style="left:16.5%;top:17.973958333333336%;width:22.75%;height:.421875%" data-text="...DO WE FIGHT?" onclick="showTextTooltip(event,this)" data-translation="...NÓS LUTAMOS?"></div><div class="text-hotspot" style="left:44%;top:26.651041666666668%;width:13.25%;height:.26041666666666663%" data-text="NO." onclick="showTextTooltip(event,this)" data-translation="NÃO."></div><div class="text-hotspot" style="left:26.625%;top:29.4375%;width:46.5%;height:1%" data-text="WE RUN AS FAST AS WE CAN!" onclick="showTextTooltip(event,this)" data-translation="CORREMOS O MAIS RÁPIDO QUE PUDERMOS!" data-tips="💡 'As fast as we can' é uma expressão que indica fazer algo na maior velocidade possível, semelhante a 'o mais rápido que pudermos'."></div><div class="text-hotspot" style="left:41.875%;top:33.411458333333336%;width:57.125%;height:1.7500000000000002%" data-text="DASH" onclick="showTextTooltip(event,this)" data-translation="DISPARAR"></div><div class="text-hotspot" style="left:23.375%;top:45.171875%;width:53%
