oltip(event,this)" data-translation="Ն"></div><div class="text-hotspot" style="left:47.375%;top:21.286458333333332%;width:19.625%;height:.421875%" data-text="I'LL RISK IT." onclick="showTextTooltip(event,this)" data-translation="EU VOU ARRISCAR."></div><div class="text-hotspot" style="left:44.875%;top:26.468750000000004%;width:23.875%;height:.4427083333333333%" data-text="HOW CAN I SAY..." onclick="showTextTooltip(event,this)" data-translation="COMO POSSO DIZER..."></div><div class="text-hotspot" style="left:61.75000000000001%;top:27.463541666666668%;width:19.75%;height:.515625%" data-text="NO TO THAT?" onclick="showTextTooltip(event,this)" data-translation="NÃO PARA ISSO?"></div><div class="text-hotspot" style="left:15.875%;top:34.625%;width:68.25%;height:1.6458333333333286%" data-text="I AM MORE FASCINATED BY THE ESSENCE OF THE UNDEAD GOLEM THAN THAT OF THE GUARDIAN ANYWAYS." onclick="showTextTooltip(event,this)" data-translation="EU ESTOU MAIS FASCINADO PELA ESSÊNCIA DO GOLEM MORTO-VIVO DO QUE PELA DO GUARDIÃO DE QUALQUER FORMA." data-tips="💡 'Anyways' é uma forma informal de dizer 'de qualquer forma' ou 'enfim'. Em contextos formais, use 'anyway'."></div><div class="text-hotspot" style="left:24.5%;top:40.74479166666667%;width:14.124999999999998%;height:.515625%" data-text="IT'S A DEAL!" onclick="showTextTooltip(event,this)" data-translation="FECHADO!"></div><div class="text-hotspot" style="left:17.125%;top:47.546875%;width:52.25%;height:1.2291666666666665%" data-text="MS. RAVEN. ARE YOU PLANNING TO FEED THE LUGGAGE CARRIER THE ESSENCE?" onclick="showTextTooltip(event,this)" data-translation="SRA. RAVEN. VOCÊ ESTÁ PLANEJANDO ALIMENTAR O CARREGADOR DE BAGAGEM COM A ESSÊNCIA?"></div><div class="text-hotspot" style="left:45.375%;top:49.20833333333333%;width:43.5%;height:.9739583333333333%" data-text="BECAUSE I HEARD MAGES ARE UNABLE TO CONSUME THEM." onclick="showTextTooltip(event,this)" data-translation="PORQUE OUVI DIZER QUE MAGOS NÃO CONSEGUEM CONSUMI-LAS." data-tips="💡 'Unable to' significa 'incapaz de' ou 'não consegue'. É uma forma de expressar impossibilidade ou falta de habilidade."></div><div class="text-hotspot" style="left:3.6249999999999996%;top:54.13020833333333%;width:16.875%;height:.125%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)" data-translation="RISADA"></div><div class="text-hotspot" style="left:8.625%;top:54.48437499999999%;width:47.125%;height:.9583333333333333%" data-text="NO. I'M GOING TO TAKE IT BACK TO THE LAB AS IS AND STUDY IT." onclick="showTextTooltip(event,this)" data-translation="NÃO. VOU LEVAR DE VOLTA PARA O LABORATÓRIO COMO ESTÁ E ESTUDÁ-LA." data-tips="💡 'As is' significa 'como está', indicando que algo será mantido em seu estado atual sem alterações."></div><div class="text-hotspot" style="left:35.625%;top:61.01562499999999%;width:28.875%;height:.515625%" data-text="TH-THAT'S A MAGIC VIAL!" onclick="showTextTooltip(event,this)" data-translation="IS-ISSO É UM FRASCO MÁGICO!"></div><div class="text-hotspot" style="left:17.5%;top:67.8125%;width:62.125%;height:.953125%" data-text="A MAGIC VIAL IS A REALLY EXPENSIVE ITEM THAT CAN FULLY CONTAIN THE ESSENCE OF TIER 7 OR WORSE MONSTER." onclick="showTextTooltip(event,this)" data-translation="UM FRASCO MÁGICO É UM ITEM REALMENTE CARO QUE PODE CONTER TOTALMENTE A ESSÊNCIA DE UM MONSTRO DE NÍVEL 7 OU PIOR." data-tips="💡 'Tier' refere-se a um nível ou categoria, especialmente em contextos de jogos ou classificações."></div><div class="text-hotspot" style="left:45.5%;top:79.86458333333334%;width:39.875%;height:.9635416666666667%" data-text="WHOA, IS THAT WHAT I THINK IT IS? THAT'S AMAZING!" onclick="showTextTooltip(event,this)" data-translation="UOU, É ISSO QUE EU ESTOU PENSANDO? ISSO É INCRÍVEL!" data-tips="💡 'Whoa' é uma interjeição usada para expressar surpresa ou admiração, semelhante a 'uou' ou 'nossa' em português."></div><div class="text-hotspot" style="left:10.75%;top:86.04166666666667%;width:52.25%;height:.7083333333333286%" data-text="I ONLY HAVE ONE IN MY POSSESSION, MYSELF." onclick="showTextTooltip(event,this)" data-translation="EU SÓ TENHO UM EM MINHA POSSE." data-tips="💡 'In my possession' significa 'em minha posse', indicando que algo está sob seu controle ou propriedade."></div><div class="text-hotspot" style="left:9.75%;top:91.671875%;width:47.25%;height:.9479166666666667%" data-text="AND SHE'S WILLING TO USE IT ON THE ESSENCE OF A TIER 7 MONSTER." onclick="showTextTooltip(event,this)" data-translation="E ELA ESTÁ DISPOSTA A USÁ-LO NA ESSÊNCIA DE UM MONSTRO DE NÍVEL 7." data-tips="💡 'Willing to' novamente aparece aqui, reforçando a ideia de disposição ou prontidão."></div><div class="text-hotspot" style="left:49.375%;top:93.41666666666667%;width:38.5%;height:.6770833333333428%" data-text="SHE MUST HAVE APPRAISED IT QUITE HIGHLY." onclick="showTextTooltip(event,this)" data-translation="ELA DEVE TER AVALIADO ISSO MUITO BEM." data-tips="💡 'Appraised' refere-se a avaliar ou estimar o valor de algo. É usado em contextos de avaliação de valor ou qualidade."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/27/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:58.75%;top:1.671875%;width:35.875%;height:1.1354166666666667%" data-text="DROP" onclick="showTextTooltip(event,this)" data-translation="SOLTAR"></div><div class="text-hotspot" style="left:12.75%;top:4.796875%;width:42.625%;height:.9375%" data-text="WHICH I UNDERSTAND, GIVEN HOW RARE UNDEAD GOLEMS ARE." onclick="showTextTooltip(event,this)" data-translation="O QUE EU ENTENDO, DADO O QUÃO RAROS SÃO OS GOLEMS MORTOS-VIVOS." data-tips="💡 'Given' é usado para introduzir uma condição ou fato, similar a 'dado que' em português. Exemplo: 'Given the circumstances, we should proceed with caution.'"></div><div class="text-hotspot" style="left:36.5%;top:6.625%;width:54.375%;height:1.208333333333333%" data-text="STILL, IT'S WORTH TAKING THIS RISK AS LONG AS I CAN GET MY HANDS ON THE ESSENCE OF THE GUARDIAN." onclick="showTextTooltip(event,this)" data-translation="AINDA ASSIM, VALE A PENA CORRER ESSE RISCO ENQUANTO EU PUDER COLOCAR AS MÃOS NA ESSÊNCIA DO GUARDIÃO." data-tips="💡 'As long as' é uma conjunção que significa 'enquanto' ou 'contanto que', indicando uma condição necessária."></div><div class="text-hotspot" style="left:58.75%;top:12.71875%;width:22.625%;height:.16145833333333334%" data-text="ALRIGHT." onclick="showTextTooltip(event,this)" data-translation="CERTO."></div><div class="text-hotspot" style="left:24.5%;top:23.260416666666668%;width:56.375%;height:1.1510416666666667%" data-text="SHALL WE GET OUT OF THIS WRETCHED PLACE ALREADY?!" onclick="showTextTooltip(event,this)" data-translation="VAMOS SAIR DESSE LUGAR MISERÁVEL JÁ?!" data-tips="💡 'Shall we' é uma forma educada de sugerir ou propor algo, semelhante a 'vamos' em português."></div><div class="text-hotspot" style="left:87.25%;top:31.343749999999996%;width:3%;height:.13020833333333331%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:75.5%;top:31.598958333333332%;width:1.875%;height:.08854166666666666%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:37.125%;top:40.729166666666664%;width:3.375%;height:.19270833333333334%" data-text="I" onclick="showTextTooltip(event,this)" data-translation="EU"></div><div class="text-hotspot" style="left:26%;top:40.729166666666664%;width:48.75%;height:1.1510416666666714%" data-text="COULD NOT HAVE SAID IT BETTER MYSELF!!" onclick="showTextTooltip(event,this)" data-translation="NÃO PODERIA TER DITO MELHOR!!" data-tips="💡 'Could not have said it better myself' é uma expressão usada para concordar plenamente com algo que foi dito."></div><div class="text-hotspot" style="left:22.5%;top:44.026041666666664%;width:53.625%;height:1.4635416666666714%" data-text="I CAN ONLY HOPE THE GUA style="left:21.875%;top:84.796875%;width:60.625%;height:1.21875%" data-text="THEY MUST SERVE NO OTHER PURPOSE THAN TO LOOK COOL, GIVEN THE LACK OF MAGICAL ENERGY." onclick="showTextTooltip(event,this)" data-translation="ELAS NÃO DEVEM TER OUTRO PROPÓSITO ALÉM DE PARECEREM LEGAIS, DADA A FALTA DE ENERGIA MÁGICA." data-tips="💡 'Given' é usado aqui para introduzir uma razão ou justificativa, similar a 'considerando' em português."></div><div class="text-hotspot" style="left:12.375%;top:90.25%;width:50.24999999999999%;height:.9583333333333333%" data-text="THE LORD'S PALACE PROBABLY USED TO BE RIGHT ABOVE US." onclick="showTextTooltip(event,this)" data-translation="O PALÁCIO DO SENHOR PROVAVELMENTE FICAVA LOGO ACIMA DE NÓS."></div><div class="text-hotspot" style="left:69.5%;top:92.15104166666667%;width:25.25%;height:.7447916666666667%" data-text="RUB" onclick="showTextTooltip(event,this)" data-translation="ESFREGAR"></div><div class="text-hotspot" style="left:68.25%;top:93.71875%;width:24.625%;height:.6770833333333334%" data-text="RUB" onclick="showTextTooltip(event,this)" data-translation="ESFREGAR"></div><div class="text-hotspot" style="left:19%;top:98.41666666666666%;width:69%;height:1.4739583333333428%" data-text="IF ONLY IT HADN'T COMPLETELY CRUMBLED DOWN... WHAT A SHAME WE CAN'T INSPECT IT ANYMORE." onclick="showTextTooltip(event,this)" data-translation="SE AO MENOS NÃO TIVESSE DESMORONADO COMPLETAMENTE... QUE PENA QUE NÃO PODEMOS MAIS INSPECIONÁ-LO." data-tips="💡 'If only' expressa um desejo ou arrependimento sobre algo que não aconteceu. Exemplo: 'If only I had known, I would have helped.'"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/27/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:79%;top:.578125%;width:2.5%;height:.26041666666666663%" data-text="!" onclick="showTextTooltip(event,this)" data-translation="!"></div><div class="text-hotspot" style="left:2.125%;top:4.375%;width:55.00000000000001%;height:1.3072916666666667%" data-text="CLICK" onclick="showTextTooltip(event,this)" data-translation="CLICK"></div><div class="text-hotspot" style="left:64.5%;top:13.15625%;width:31.374999999999996%;height:.6145833333333333%" data-text="FLASH" onclick="showTextTooltip(event,this)" data-translation="FLASH"></div><div class="text-hotspot" style="left:2.125%;top:16.916666666666664%;width:69.875%;height:2.4635416666666665%" data-text="DROP" onclick="showTextTooltip(event,this)" data-translation="SOLTAR"></div><div class="text-hotspot" style="left:62.25000000000001%;top:22.260416666666664%;width:25.75%;height:.71875%" data-text="GRAB" onclick="showTextTooltip(event,this)" data-translation="AGARRAR"></div><div class="text-hotspot" style="left:10.125%;top:25.53125%;width:13%;height:.15625%" data-text="OH?!" onclick="showTextTooltip(event,this)" data-translation="OH?!"></div><div class="text-hotspot" style="left:44%;top:34.35416666666667%;width:44.375%;height:.6979166666666572%" data-text="HOW DID YOU EVEN KNOW ABOUT THIS?" onclick="showTextTooltip(event,this)" data-translation="COMO VOCÊ SABIA DISSO?" data-tips="💡 'How did you even know about this?' usa 'even' para enfatizar a surpresa sobre o conhecimento de alguém."></div><div class="text-hotspot" style="left:20.625%;top:39.65625%;width:50.25%;height:1.4739583333333286%" data-text="A BOOK IS A MAGICAL ITEM THAT PASSES KNOWLEDGE DOWN FROM PERSON TO PERSON." onclick="showTextTooltip(event,this)" data-translation="UM LIVRO É UM ITEM MÁGICO QUE PASSA CONHECIMENTO DE PESSOA PARA PESSOA."></div><div class="text-hotspot" style="left:40.25%;top:42.630208333333336%;width:44.5%;height:1.0520833333333333%" data-text="YOU COULD HAVE JUST TOLD HIM YOU READ IT IN A BOOK SOMEWHERE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ PODERIA TER DITO A ELE QUE LEU EM ALGUM LIVRO." data-tips="💡 'You could have just told him' sugere que havia uma opção mais simples disponível no passado."></div><div class="text-hotspot" style="left:13.750000000000002%;top:48.385416666666664%;width:52.87500000000001%;height:.43750000000000006%" data-text="NECRONOMICON IS THE NAME OF THAT GRIMOIRE." onclick="showTextTooltip(event,this)" data-translation="NECRONOMICON É O NOME DESSE GRIMÓRIO."></div><div class="text-hotspot" style="left:36.625%;top:49.442708333333336%;width:51.5%;height:.9583333333333333%" data-text="IT CONTAINS KNOWLEDGE ABOUT DARK MAGIC, AND THUS CAN FETCH A HIGH PRICE AT STORES." onclick="showTextTooltip(event,this)" data-translation="ELE CONTÉM CONHECIMENTO SOBRE MAGIA NEGRA, E POR ISSO PODE TER UM ALTO VALOR NAS LOJAS." data-tips="💡 'Fetch a high price' significa que algo pode ser vendido por um valor alto."></div><div class="text-hotspot" style="left:10.625%;top:58.08333333333333%;width:51.37500000000001%;height:.9479166666666714%" data-text="DAMN IT. THERE GOES MY GOAL OF RETRIEVING IT DISCREETLY BY MYSELF LATER." onclick="showTextTooltip(event,this)" data-translation="DROGA. LÁ SE VAI MEU OBJETIVO DE RECUPERÁ-LO DISCRETAMENTE SOZINHO MAIS TARDE." data-tips="💡 'Damn it' é uma expressão de frustração ou desapontamento, informal e considerada um pouco rude."></div><div class="text-hotspot" style="left:29.375%;top:59.65104166666667%;width:43.875%;height:.43750000000000006%" data-text="SHE'S ACTUALLY QUITE KNOWLEDGEABLE." onclick="showTextTooltip(event,this)" data-translation="ELA É REALMENTE BEM INFORMADA."></div><div class="text-hotspot" style="left:19.375%;top:65.50520833333333%;width:61.25000000000001%;height:1.328125%" data-text="...IT SUCKS TO BE UNABLE TO DO ANYTHING ABOUT SOMEONE FROM THE PARTY HOGGING ALL SECRET LOOTS BY HERSELF." onclick="showTextTooltip(event,this)" data-translation="...É RUIM NÃO PODER FAZER NADA SOBRE ALGUÉM DO GRUPO PEGANDO TODOS OS SAQUES SECRETOS SOZINHA." data-tips="💡 'Sucks' é uma gíria informal que expressa insatisfação ou frustração."></div><div class="text-hotspot" style="left:25.874999999999996%;top:68.69791666666667%;width:56.999999999999986%;height:1.4947916666666572%" data-text="I WILL HOLD ONTO IT AS PER THE AGREEMENT, SINCE I DISCOVERED IT USING MY OWN KNOWLEDGE." onclick="showTextTooltip(event,this)" data-translation="EU VOU FICAR COM ELE CONFORME O ACORDO, JÁ QUE O DESCOBRI USANDO MEU PRÓPRIO CONHECIMENTO." data-tips="💡 'As per the agreement' significa 'conforme o acordo', indicando que algo está sendo feito de acordo com um combinado."></div><div class="text-hotspot" style="left:19.25%;top:75.08854166666666%;width:70.125%;height:1.4739583333333428%" data-text="BE MY GUEST. WE PROBABLY COULDN'T TAKE IT OUTSIDE ANYWAYS BECAUSE WE'RE UNABLE TO CAST *DISTORTION SPELLS." onclick="showTextTooltip(event,this)" data-translation="FAÇA ISSO. PROVAVELMENTE NÃO PODERÍAMOS LEVÁ-LO PARA FORA DE QUALQUER FORMA PORQUE NÃO PODEMOS LANÇAR *FEITIÇOS DE DISTORÇÃO." data-tips="💡 'Be my guest' é uma expressão usada para dar permissão ou encorajar alguém a fazer algo, similar a 'fique à vontade'."></div><div class="text-hotspot" style="left:8.625%;top:77.26041666666667%;width:86.75%;height:.625%" data-text="*DISTORTION MAGIC ALLOW THE ITEM TO RETAIN ITSELF ONCE CAST OVER THE LOOT THAT WOULD OTHERWISE BE DESTROYED BY LIGHT." onclick="showTextTooltip(event,this)" data-translation="*MAGIA DE DISTORÇÃO PERMITE QUE O ITEM SE MANTENHA UMA VEZ LANÇADO SOBRE O SAQUE QUE SERIA DESTRUÍDO PELA LUZ."></div><div class="text-hotspot" style="left:34%;top:81.66145833333334%;width:14.124999999999998%;height:.3854166666666667%" data-text="HA," onclick="showTextTooltip(event,this)" data-translation="HA,"></div><div class="text-hotspot" style="left:9%;top:82.30208333333333%;width:28.375%;height:.5260416666666666%" data-text="HAHA..." onclick="showTextTooltip(event,this)" data-translation="HAHA..."></div><div class="text-hotspot" style="left:26.875%;top:89.73958333333333%;width:46.125%;height:.9479166666666714%" data-text="LOOK AT THAT AWKWARD LAUGH. SHE DEFINITELY KNOWS IT TOO." onclick="showTextTooltip(event,this)" data-translation="OLHE PARA ESSA RISADA DESAJEITADA. ELA DEFINITIVAMENTE SABE DISSO TAMBÉM." data-tips="💡 'Awkward' significa desconfortável ou desajeitado, usado para descrever situações ou comportamentos embaraçosos."></div><div class="text-hotspot" style="left:11.625%;top:94.56770833333333%;width:39.375%;height:1.0416666666666714%" data-text="THAT NECRONOMICON IS REGARDED AS A NORMAL ITEM," onclick="showTextTooltip(event,this)" data-translation="ESSE NECRONOMICON É CONSIDERADO UM ITEM NORMAL,"></div><div class="text-hotspot" style="left:47.875%;top:96.04166666666667%;width:41.125%;height:1.203125%" data-text="AND WON'T BE DESTROYED BY LIGHT EVEN WITHOUT DISTORTION MAGIC." onclick="showTextTooltip(event,this)" data-translation="E NÃO SERÁ DESTRUÍDO PELA LUZ MESMO SEM MAGIA DE DISTORÇÃO." data-tips="💡 'Even without' indica que algo é verdade ou possível, mesmo na ausência de outra coisa."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/27/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22.25%;top:2.8541666666666665%;width:55.125%;height:.9479166666666667%" data-text="BUT HOW COME SHE DIDN'T KNOW ABOUT THAT ITEM HIDDEN UNDERNEATH THE FOUNTAIN?" onclick="showTextTooltip(event,this)" data-translation="MAS COMO ELA NÃO SABIA SOBRE AQUELE ITEM ESCONDIDO SOB A FONTE?" data-tips="💡 'How come' é uma forma informal de perguntar 'por que', usada para expressar surpresa ou curiosidade."></div><div class="text-hotspot" style="left:30.25%;top:10.677083333333332%;width:30.625000000000004%;height:.8177083333333333%" data-text="STARE" onclick="showTextTooltip(event,this)" data-translation="ENCARAR"></div><div class="text-hotspot" style="left:65.375%;top:10.864583333333332%;width:29.875%;height:.3489583333333333%" data-text="SH-SHALL WE GET MOVING?" onclick="showTextTooltip(event,this)" data-translation="D-DEVEMOS IR?"></div><div class="text-hotspot" style="left:50.125%;top:1 ifica 'portanto', usado para mostrar consequência ou conclusão."></div><div class="text-hotspot" style="left:20.75%;top:13.776041666666666%;width:56.75%;height:.7604166666666667%" data-text="AND THEN THERE'S THE LUST-TYPE LIKE THE ONE IN FRONT OF US." onclick="showTextTooltip(event,this)" data-translation="E ENTÃO TEMOS O TIPO LUXÚRIA COMO O QUE ESTÁ NA NOSSA FRENTE."></div><div class="text-hotspot" style="left:25.25%;top:19.046875%;width:49.125%;height:.9739583333333333%" data-text="ALTHOUGH IT POSSESSES THE ABILITY TO ABSORB VITALITY AND HEAL ITSELF WITH EACH HIT..." onclick="showTextTooltip(event,this)" data-translation="EMBORA POSSA ABSORVER VITALIDADE E SE CURAR A CADA GOLPE..." data-tips="💡 'Although' é uma conjunção usada para introduzir uma ideia contrastante, semelhante a 'embora'."></div><div class="text-hotspot" style="left:16.5%;top:21.270833333333332%;width:69%;height:1.6354166666666665%" data-text="I CAN NULLIFY THAT EASILY WITH MY WOUND EXACERBATION SPELL, SO DON'T WORRY ABOUT THAT AND ATTACK!!" onclick="showTextTooltip(event,this)" data-translation="EU POSSO ANULAR ISSO FACILMENTE COM MEU FEITIÇO DE EXACERBAÇÃO DE FERIDAS, ENTÃO NÃO SE PREOCUPE COM ISSO E ATAQUE!!" data-tips="💡 'Nullify' significa 'anular' ou 'tornar ineficaz', um verbo útil em contextos formais."></div><div class="text-hotspot" style="left:22.375%;top:32.427083333333336%;width:53.25%;height:1.3072916666666667%" data-text="BZZ" onclick="showTextTooltip(event,this)" data-translation="BZZ"></div><div class="text-hotspot" style="left:19.5%;top:36.70833333333333%;width:55.75%;height:1.6354166666666665%" data-text="GROWL" onclick="showTextTooltip(event,this)" data-translation="ROSNA"></div><div class="text-hotspot" style="left:7.75%;top:47.041666666666664%;width:56.00000000000001%;height:1.3645833333333333%" data-text="SLASH" onclick="showTextTooltip(event,this)" data-translation="CORTAR"></div><div class="text-hotspot" style="left:44.875%;top:54.255208333333336%;width:53.75%;height:.9322
