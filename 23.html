<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>23</title></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/23/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:39.375%;top:1.2291666666666665%;width:21.75%;height:.15625%" data-text="WARNING" onclick="showTextTooltip(event,this)" data-translation="AVISO"></div><div class="text-hotspot" style="left:10.875%;top:1.6979166666666667%;width:78.25%;height:.625%" data-text="THIS EPISODE CONTAINS STRONG LANGUAGE THAT MAY NOT BE SUITABLE FOR SOME READERS." onclick="showTextTooltip(event,this)" data-translation="ESTE EPISÓDIO CONTÉM LINGUAGEM FORTE QUE PODE NÃO SER ADEQUADA PARA ALGUNS LEITORES." data-tips="💡 A expressão &quot;may not be suitable&quot; é uma forma polida de dizer que algo pode não ser apropriado. É comum em avisos de conteúdo."></div><div class="text-hotspot" style="left:32.75%;top:9.927083333333334%;width:34.5%;height:.33333333333333337%" data-text="THE RIFT." onclick="showTextTooltip(event,this)" data-translation="A FENDA."></div><div class="text-hotspot" style="left:32.5%;top:14.739583333333334%;width:54.50000000000001%;height:1.2239583333333333%" data-text="IT IS AN OPENING TO THE LABYRINTH WITHIN A LABYRINTH, ALSO KNOWN AS AN INSTANCE DUNGEON IN GAME TERMS." onclick="showTextTooltip(event,this)" data-translation="É UMA ABERTURA PARA O LABIRINTO DENTRO DE UM LABIRINTO, TAMBÉM CONHECIDO COMO UM DUNGEON DE INSTÂNCIA EM TERMOS DE JOGO." data-tips="💡 &quot;Instance dungeon&quot; é um termo específico de jogos que se refere a uma área separada para um grupo de jogadores. Não tem tradução direta para o português."></div><div class="text-hotspot" style="left:5.25%;top:17.213541666666668%;width:3.375%;height:.16145833333333334%" data-text="6" onclick="showTextTooltip(event,this)" data-translation="6"></div><div class="text-hotspot" style="left:22.125%;top:18.473958333333336%;width:3.375%;height:.15625%" data-text="5" onclick="showTextTooltip(event,this)" data-translation="5"></div><div class="text-hotspot" style="left:39.5%;top:19.744791666666668%;width:3.375%;height:.140625%" data-text="4" onclick="showTextTooltip(event,this)" data-translation="4"></div><div class="text-hotspot" style="left:56.625%;top:20.994791666666668%;width:3.375%;height:.16145833333333334%" data-text="3" onclick="showTextTooltip(event,this)" data-translation="3"></div><div class="text-hotspot" style="left:13.750000000000002%;top:21.661458333333332%;width:50%;height:1.4739583333333335%" data-text="THE PORTAL TO IT OPENS RANDOMLY OR UNDER HIDDEN CONDITIONS ON DIFFERENT FLOORS, AND REVEALS AN ENTIRELY NEW AREA." onclick="showTextTooltip(event,this)" data-translation="O PORTAL PARA ELE SE ABRE ALEATORIAMENTE OU SOB CONDIÇÕES OCULTAS EM DIFERENTES ANDARES, E REVELA UMA ÁREA COMPLETAMENTE NOVA." data-tips="💡 &quot;Opens randomly&quot; usa &quot;randomly&quot; como advérbio, que significa &quot;de forma aleatória&quot;. É útil para descrever eventos que não seguem um padrão fixo."></div><div class="text-hotspot" style="left:73.75%;top:22.265625%;width:3%;height:.15104166666666666%" data-text="2" onclick="showTextTooltip(event,this)" data-translation="2"></div><div class="text-hotspot" style="left:90.875%;top:23.510416666666668%;width:3%;height:.17708333333333331%" data-text="1" onclick="showTextTooltip(event,this)" data-translation="1"></div><div class="text-hotspot" style="left:21%;top:27.453125%;width:60.375%;height:1.1458333333333333%" data-text="THERE IS A COOLDOWN FOR RIFTS AS WELL." onclick="showTextTooltip(event,this)" data-translation="HÁ UM TEMPO DE RECARGA PARA AS FENDAS TAMBÉM."></div><div class="text-hotspot" style="left:22.375%;top:32.96354166666667%;width:33.625%;height:.6979166666666666%" data-text="IT TAKES AT LEAST THREE MONTHS IN CITY-TIME..." onclick="showTextTooltip(event,this)" data-translation="LEVA PELO MENOS TRÊS MESES NO TEMPO DA CIDADE..." data-tips="💡 &quot;City-time&quot; sugere um tempo que é específico a um local ou contexto, como &quot;tempo da cidade&quot;, indicando que pode diferir do tempo real."></div><div class="text-hotspot" style="left:39.75%;top:33.942708333333336%;width:41.375%;height:.9635416666666667%" data-text="FOR THE RIFT ON THE FIRST FLOOR TO NATURALLY OPEN UP AGAIN." onclick="showTextTooltip(event,this)" data-translation="PARA A FENDA NO PRIMEIRO ANDAR SE ABRIR NOVAMENTE NATURALMENTE."></div><div class="text-hotspot" style="left:21.25%;top:37.916666666666664%;width:57%;height:.9479166666666714%" data-text="HOWEVER, IT IS ABSOLUTELY INEFFICIENT TO JUST SIT BACK AND WAIT FOR IT." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, É TOTALMENTE INEFICIENTE APENAS SENTAR E ESPERAR POR ISSO." data-tips="💡 &quot;Sit back and wait&quot; é uma expressão que significa relaxar e esperar sem fazer nada. É usada para indicar passividade."></div><div class="text-hotspot" style="left:24.75%;top:44.807291666666664%;width:50.375%;height:.4322916666666667%" data-text="THAT WAS WHY I SOUGHT WAYS TO FORCE-OPEN IT." onclick="showTextTooltip(event,this)" data-translation="FOI POR ISSO QUE PROCUREI MANEIRAS DE FORÇAR A ABERTURA." data-tips="💡 &quot;Force-open&quot; é um phrasal verb que significa abrir algo à força. Similar a &quot;force-feed&quot; (alimentar à força)."></div><div class="text-hotspot" style="left:22.25%;top:49.875%;width:37.25%;height:.703125%" data-text="THERE ARE A TOTAL OF FOUR RIFTS ON THE FIRST FLOOR." onclick="showTextTooltip(event,this)" data-translation="HÁ UM TOTAL DE QUATRO FENDAS NO PRIMEIRO ANDAR."></div><div class="text-hotspot" style="left:39.375%;top:51.015625%;width:37.375%;height:.9791666666666643%" data-text="THE ONE WE HAD JUST ENTERED THROUGH LEADS TO..." onclick="showTextTooltip(event,this)" data-translation="A QUE ACABAMOS DE ENTRAR LEVA PARA..."></div><div class="text-hotspot" style="left:10.25%;top:54.723958333333336%;width:32%;height:.7604166666666667%" data-text="CAW" onclick="showTextTooltip(event,this)" data-translation="CRÁ"></div><div class="text-hotspot" style="left:9.75%;top:56.708333333333336%;width:53%;height:.6822916666666714%" data-text="...THE APOCALYPTIC SKY FILLED WITH DISTURBINGLY RED VIBE..." onclick="showTextTooltip(event,this)" data-translation="...O CÉU APOCALÍPTICO CHEIO DE UMA VIBE ESTRANHAMENTE VERMELHA..." data-tips="💡 &quot;Apocalyptic sky&quot; usa &quot;apocalyptic&quot; para criar uma imagem de destruição ou fim do mundo, uma descrição vívida e dramática."></div><div class="text-hotspot" style="left:66.875%;top:57.947916666666664%;width:25.874999999999996%;height:.71875%" data-text="CAW" onclick="showTextTooltip(event,this)" data-translation="CRÁ"></div><div class="text-hotspot" style="left:48.125%;top:59.875%;width:42.625%;height:1.2083333333333286%" data-text="...AND A HORDE OF SCAVENGER CROWS OVER THE SHADOWY KEEP SOME DISTANCE AWAY." onclick="showTextTooltip(event,this)" data-translation="...E UMA HORDAS DE CORVOS CATADORES SOBRE A FORTALEZA SOMBRIA A ALGUMA DISTÂNCIA." data-tips="💡 &quot;Horde of scavenger crows&quot; usa &quot;horde&quot; para descrever um grande grupo, geralmente de forma negativa, como &quot;horda de zumbis&quot;."></div><div class="text-hotspot" style="left:9.375%;top:61.16666666666667%;width:23%;height:.5677083333333334%" data-text="CAW" onclick="showTextTooltip(event,this)" data-translation="CRÁ"></div><div class="text-hotspot" style="left:16%;top:65.13020833333333%;width:68.625%;height:.296875%" data-text="BLOODY CITADEL." onclick="showTextTooltip(event,this)" data-translation="CIDADELA SANGRENTA."></div><div class="text-hotspot" style="left:77%;top:75.59895833333333%;width:17.75%;height:.140625%" data-text="IT'S HUGE..." onclick="showTextTooltip(event,this)" data-translation="É ENORME..."></div><div class="text-hotspot" style="left:20%;top:81.86979166666667%;width:37%;height:.9791666666666667%" data-text="I WAS READY AND EXPECTING TO SEE BLOODY CITADEL," onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA PREPARADO E ESPERANDO VER A CIDADELA SANGRENTA,"></div><div class="text-hotspot" style="left:37.625%;top:83.41145833333333%;width:43.875%;height:1.2239583333333286%" data-text="SINCE THE TIER-8 MANA STONE I PLACED ON THE ALTAR WAS THAT OF DEATH FIEND." onclick="showTextTooltip(event,this)" data-translation="JÁ QUE A PEDRA DE MANA DE NÍVEL 8 QUE COLOQUEI NO ALTAR ERA DO DEMÔNIO DA MORTE."></div><div class="text-hotspot" style="left:46.625%;top:89.44791666666667%;width:43.125%;height:.9739583333333333%" data-text="BUT IT'S MORE BREATHTAKING THAN I HAD ANTICIPATED TO SEE IT FIRSTHAND." onclick="showTextTooltip(event,this)" data-translation="MAS É MAIS IMPRESSIONANTE DO QUE EU ESPERAVA VER PESSOALMENTE." data-tips="💡 &quot;Breathtaking&quot; é uma palavra que descreve algo tão impressionante que literalmente 'tira o fôlego'."></div><div class="text-hotspot" style="left:57.875%;top:94.10416666666667%;width:39.125%;height:1.0520833333333333%" data-text="GULP" onclick="showTextTooltip(event,this)" data-translation="GLUP"></div><div class="text-hotspot" style="left:8.875%;top:96.625%;width:53.37499999999999%;height:.9479166666666714%" data-text="TO OUR RELIEF, THE RIFTS ON THE FIRST FLOOR LEADS ADVENTURERS TO INSTANCES..." onclick="showTextTooltip(event,this)" data-translation="PARA NOSSO ALÍVIO, AS FENDAS NO PRIMEIRO ANDAR LEVAM AVENTUREIROS PARA INSTÂNCIAS..." data-tips="💡 &quot;To our relief&quot; é uma expressão que indica que algo traz alívio ou conforto. Pode ser substituído por &quot;felizmente&quot;."></div><div class="text-hotspot" style="left:36.5%;top:98.25%;width:30.375000000000004%;height:.6875%" data-text="THAT ARE NOT IMPOSSIBLE TO COMPLETE." onclick="showTextTooltip(event,this)" data-translation="QUE NÃO SÃO IMPOSSÍVEIS DE COMPLETAR."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/23/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:14.000000000000002%;top:3.7968750000000004%;width:36.875%;height:1.2083333333333326%" data-text="WHO ENTERS THROUGH THE RIFT AFTER US IS WHAT REALLY MATTERS NOW." onclick="showTextTooltip(event,this)" data-translation="QUEM ENTRA PELA FENDA DEPOIS DE NÓS É O QUE REALMENTE IMPORTA AGORA." data-tips="💡 &quot;Who enters through the rift after us&quot; usa a ordem de palavras típica do inglês, diferente do português que poderia ser &quot;quem entra depois de nós pela fenda&quot;."></div><div class="text-hotspot" style="left:40.5%;top:5.916666666666667%;width:41.625%;height:.9583333333333333%" data-text="WE DON'T HAVE A CHOICE AS TO WITH WHOM WE'RE GOING TO FORM A PARTY." onclick="showTextTooltip(event,this)" data-translation="NÃO TEMOS ESCOLHA SOBRE COM QUEM VAMOS FORMAR UM GRUPO." data-tips="💡 &quot;As to&quot; é uma expressão que significa &quot;quanto a&quot; ou &quot;em relação a&quot;, frequentemente usada para introduzir um tópico específico."></div><div class="text-hotspot" style="left:47.875%;top:10.213541666666668%;width:30%;height:.6822916666666666%" data-text="SOMEONE'S COMING, BJORN!" onclick="showTextTooltip(event,this)" data-translation="ALGUÉM ESTÁ VINDO, BJORN!"></div><div class="text-hotspot" style="left:53.75%;top:13.40625%;width:38.625%;height:1.03125%" data-text="FWOOSH" onclick="showTextTooltip(event,this)" data-translation="FWOOSH"></div><div class="text-hotspot" style="left:8.875%;top:17.5%;width:64.5%;height:1.484375%" data-text="FWOOSH" onclick="showTextTooltip(event,this)" data-translation="FWOOSH"></div><div class="text-hotspot" style="left:38.875%;top:20.760416666666668%;width:1.5%;height:.0625%" data-text="о" onclick="showTextTooltip(event,this)" data-translation="о"></div><div class="text-hotspot" style="left:32.375%;top:27.734375%;width:34.75%;height:.8229166666666666%" data-text="ALRIGHT, LET'S SEE WHO THIS IS!" onclick="showTextTooltip(event,this)" data-translation="CERTO, VAMOS VER QUEM É!"></div><div class="text-hotspot" style="left:23.5%;top:42.776041666666664%;width:52.5%;height:.7604166666666667%" data-text="YOU SUMMONED THE SPIRIT AGAIN, ERWEN." onclick="showTextTooltip(event,this)" data-translation="VOCÊ INVOCOU O ESPÍRITO DE NOVO, ERWEN."></div><div class="text-hotspot" style="left:15.5%;top:51.828125%;width:13.375%;height:.171875%" data-text="OH..." onclick="showTextTooltip(event,this)" data-translation="OH..."></div><div class="text-hotspot" style="left:52.37500000000001%;top:52.46354166666667%;width:36.625%;height:.4479166666666667%" data-text="FIRST FLOOR CRYSTAL CAVE" onclick="showTextTooltip(event,this)" data-translation="CAVERNA DE CRISTAL DO PRIMEIRO ANDAR"></div><div class="text-hotspot" style="left:18.375%;top:57.32291666666667%;width:39.625%;height:.9479166666666643%" data-text="USING DAGGER ALONE IS TOO DEMANDING AT TIMES." onclick="showTextTooltip(event,this)" data-translation="USAR APENAS A ADAGA É MUITO EXIGENTE ÀS VEZES." data-tips="💡 &quot;Too demanding&quot; significa algo que requer muito esforço ou habilidade, usado para descrever tarefas difíceis."></div><div class="text-hotspot" style="left:61.75000000000001%;top:59.947916666666664%;width:5%;height:.46875%" data-text="Kwany" onclick="showTextTooltip(event,this)" data-translation="Kwany"></div><div class="text-hotspot" style="left:81.375%;top:59.95312499999999%;width:7.75%;height:.5729166666666666%" data-text="Спас Спаспас" onclick="showTextTooltip(event,this)" data-translation="Спас Спаспас"></div><div class="text-hotspot" style="left:32.875%;top:65.02083333333334%;width:58.375%;height:1.4583333333333144%" data-text="BUT YOU NEED TO LEARN HOW TO DEFEND YOURSELF EVEN WITHOUT THE SPIRIT ELEMENTALS AND YOUR BOW." onclick="showTextTooltip(event,this)" data-translation="MAS VOCÊ PRECISA APRENDER A SE DEFENDER MESMO SEM OS ELEMENTAIS ESPIRITUAIS E SEU ARCO."></div><div class="text-hotspot" style="left:9.75%;top:70.78125%;width:46.75%;height:1.234375%" data-text="BUT THE GOOD OLD SIR SAID WORKING TO IMPROVE WHAT I AM BEST AT..." onclick="showTextTooltip(event,this)" data-translation="MAS O BOM VELHO DISSE QUE TRABALHAR PARA MELHORAR NO QUE SOU MELHOR..." data-tips="💡 &quot;Good old&quot; é uma expressão coloquial que transmite carinho ou familiaridade, geralmente usada para se referir a alguém ou algo conhecido e confiável."></div><div class="text-hotspot" style="left:2.625%;top:75.56770833333334%;width:30.25%;height:.6354166666666666%" data-text="SULKY" onclick="showTextTooltip(event,this)" data-translation="EMBURRECIDO"></div><div class="text-hotspot" style="left:33.875%;top:77.296875%;width:17.5%;height:.16145833333333334%" data-text=". WHILE" onclick="showTextTooltip(event,this)" data-translation=". ENQUANTO"></div><div class="text-hotspot" style="left:17.5%;top:77.421875%;width:46.125%;height:1.0833333333333286%" data-text="... TRUSTING OTHER PARTY MEMBERS TO TAKE CARE OF THE REST..." onclick="showTextTooltip(event,this)" data-translation="... CONFIANDO NOS OUTROS MEMBROS DO GRUPO PARA CUIDAR DO RESTO..."></div><div class="text-hotspot" style="left:40.875%;top:78.796875%;width:40.375%;height:1.2083333333333286%" data-text="WAS WHAT A GOOD ADVENTURER SHOULD FOCUS ON." onclick="showTextTooltip(event,this)" data-translation="ERA NO QUE UM BOM AVENTUREIRO DEVERIA SE CONCENTRAR." data-tips="💡 &quot;Should focus on&quot; usa &quot;should&quot; para dar um conselho ou recomendação, algo que é esperado ou sugerido."></div><div class="text-hotspot" style="left:11.5%;top:83.234375%;width:53.25%;height:1.7291666666666667%" data-text="HE'S RIGHT THEORETICALLY. HOWEVER, NOT EVERYTHING IN THIS WORLD GOES ACCORDING TO PLAN." onclick="showTextTooltip(event,this)" data-translation="ELE ESTÁ CERTO TEORICAMENTE. NO ENTANTO, NEM TUDO NESTE MUNDO ACONTECE COMO PLANEJADO."></div><div class="text-hotspot" style="left:6.875000000000001%;top:85.47916666666666%;width:24.25%;height:.6458333333333334%" data-text="TAP" onclick="showTextTooltip(event,this)" data-translation="TAP"></div><div class="text-hotspot" style="left:17.375%;top:92%;width:66.75%;height:1.3333333333333335%" data-text="A COMPANION IS SOMEONE YOU FORM A PARTY WITH TEMPORARILY TO MAKE NAVIGATING EASIER." onclick="showTextTooltip(event,this)" data-translation="UM COMPANHEIRO É ALGUÉM COM QUEM VOCÊ FORMA UM GRUPO TEMPORARIAMENTE PARA FACILITAR A NAVEGAÇÃO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/23/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:12.625%;top:2.229166666666667%;width:60.62499999999999%;height:1.3229166666666667%" data-text="YOU MUST NOT PUT TOO MUCH WEIGHT INTO THINGS HE SAID IN EVERY SITUATION." onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO DEVE DAR MUITA IMPORTÂNCIA A TUDO O QUE ELE DISSE EM TODAS AS SITUAÇÕES." data-tips="💡 &quot;Put too much weight into&quot; é uma expressão que significa dar muita importância a algo."></div><div class="text-hotspot" style="left:52.25%;top:8.776041666666666%;width:36.625%;height:.16145833333333334%" data-text="UNDERSTOOD." onclick="showTextTooltip(event,this)" data-translation="ENTENDIDO."></div><div class="text-hotspot" style="left:12.625%;top:12.828125000000002%;width:38.875%;height:.671875%" data-text="BUT HE'S NOT JUST A TEMPORARY COMPANION..." onclick="showTextTooltip(event,this)" data-translation="MAS ELE NÃO É APENAS UM COMPANHEIRO TEMPORÁRIO..."></div><div class="text-hotspot" style="left:15.875%;top:18.072916666666668%;width:42.875%;height:.9479166666666667%" data-text="CAN WE HEAD TO THE SECOND FLOOR ALREADY, SIS?" onclick="showTextTooltip(event,this)" data-translation="PODEMOS IR PARA O SEGUNDO ANDAR JÁ, MANA?"></div><div class="text-hotspot" style="left:35.5%;top:19.53125%;width:36.875%;height:.9895833333333333%" data-text="I'M SURE THE GOOD OLD SIR IS MAKING TONS OF MONEY THERE ALREADY." onclick="showTextTooltip(event,this)" data-translation="TENHO CERTEZA DE QUE O BOM VELHO JÁ ESTÁ GANHANDO MUITO DINHEIRO LÁ."></div><div class="text-hotspot" style="left:68.375%;top:22.005208333333336%;width:5%;height:.48958333333333337%" data-text="аспаст" onclick="showTextTooltip(event,this)" data-translation="аспаст"></div><div class="text-hotspot" style="left:14.625%;top:30.062499999999996%;width:66%;height:1.4739583333333357%" data-text="IT'LL TAKE TOO LONG TO GO FAR INTO THE LABYRINTH BY TAKING DOWN A FEW MONSTERS ON THE SECOND FLOOR." onclick="showTextTooltip(event,this)" data-translation="VAI DEMORAR MUITO PARA IR LONGE NO LABIRINTO DERRUBANDO ALGUNS MONSTROS NO SEGUNDO ANDAR."></div><div class="text-hotspot" style="left:21.5%;top:37.635416666666664%;width:56.875%;height:1.3489583333333333%" data-text="AND THAT IS PRECISELY WHY WE'LL BE ENTERING THROUGH THE RIFT." onclick="showTextTooltip(event,this)" data-translation="E É EXATAMENTE POR ISSO QUE VAMOS ENTRAR PELA FENDA." data-tips="💡 &quot;Precisely why&quot; é uma expressão que enfatiza a razão exata ou específica para uma ação."></div><div class="text-hotspot" style="left:24.25%;top:42.885416666666664%;width:54.5%;height:1.4635416666666714%" data-text="WHAT? I THOUGHT WE COULD ONLY ENTER THROUGH ONE IF WE GET EXTREMELY LUCKY!" onclick="showTextTooltip(event,this)" data-translation="O QUÊ? EU PENSEI QUE SÓ PODÍAMOS ENTRAR POR UMA SE TIVERMOS MUITA SORTE!" data-tips="💡 &quot;Extremely lucky&quot; usa &quot;extremely&quot; para intensificar &quot;lucky&quot;, significando muita sorte, algo improvável de acontecer."></div><div class="text-hotspot" style="left:75.25%;top:44.59375%;width:23.75%;height:.6145833333333333%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:45.25%;top:47.35416666666667%;width:22.625%;height:.4635416666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:17.875%;top:50.192708333333336%;width:51.24999999999999%;height:.9635416666666667%" data-text="YOU'RE RIGHT. THERE ARE PLENTY OF EXPERIENCED ADVENTURERS..." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ CERTO. HÁ MUITOS AVENTUREIROS EXPERIENTES..."></div><div class="text-hotspot" style="left:49.375%;top:51.489583333333336%;width:39.25%;height:1.1979166666666643%" data-text="WHO HADN'T HAD A CHANCE TO GO THROUGH ONE." onclick="showTextTooltip(event,this)" data-translation="QUE NÃO TIVERAM A CHANCE DE PASSAR POR UMA."></div><div class="text-hotspot" style="left:17.875%;top:56.854166666666664%;width:40.5%;height:1.2135416666666643%" data-text="BUT THE PREVIOUS RIFT OPENED ABOUT EIGHT MONTHS AGO..." onclick="showTextTooltip(event,this)" data-translation="MAS A FENDA ANTERIOR SE ABRIU HÁ CERCA DE OITO MESES..."></div><div class="text-hotspot" style="left:26.75%;top:58.296875%;width:67.375%;height:1.7291666666666643%" data-text="AND THE MAXIMUM KNOWN CYCLE OF ITS OPENING IS EVERY EIGHT MONTHS. ONE SHOULD OPEN VERY SOON ON THE FIRST FLOOR." onclick="showTextTooltip(event,this)" data-translation="E O CICLO MÁXIMO CONHECIDO DE SUA ABERTURA É A CADA OITO MESES. UMA DEVE SE ABRIR MUITO EM BREVE NO PRIMEIRO ANDAR." data-tips="💡 &quot;Maximum known cycle&quot; refere-se ao maior intervalo de tempo registrado entre eventos repetidos, como aberturas de fendas."></div><div class="text-hotspot" style="left:42.75%;top:64.807291666666
