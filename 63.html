spot" style="left:20.25%;top:47.609375%;width:64.875%;height:1.2083333333333333%" data-text="AND EVEN THE FIRST PASSWORD IS FAKE AND YOU ARE TO VISIT EACH PERSON AND CHECK UP ON THEM." onclick="showTextTooltip(event,this)" data-translation="E ATÉ MESMO A PRIMEIRA SENHA É FALSA E VOCÊ DEVE VISITAR CADA PESSOA E VERIFICÁ-LAS." data-tips="💡 A expressão **&quot;check up on&quot;** é um phrasal verb que significa verificar ou assegurar-se de que algo ou alguém está bem. É usado para indicar a ação de monitorar ou inspecionar. Exemplos: &quot;I need to check up on my grandmother this weekend.&quot; ou &quot;Can you check up on the project status?&quot;"></div><div class="text-hotspot" style="left:15.5%;top:57.984375%;width:71.125%;height:1.9166666666666643%" data-text="THAT'S RIGHT, BECAUSE A LOCAL OF THE GAME CANNOT POSSIBLY IMAGINE THE OUTFIT AND STRUCTURE OF THE REAL WORLD." onclick="showTextTooltip(event,this)" data-translation="EXATO, PORQUE UM LOCAL DO JOGO NÃO CONSEGUE IMAGINAR O TRAJE E A ESTRUTURA DO MUNDO REAL." data-tips="💡 A estrutura **&quot;cannot possibly&quot;** é usada para enfatizar a impossibilidade de algo. É uma forma enfática de dizer que algo não pode acontecer. Exemplos: &quot;He cannot possibly finish the work by tomorrow.&quot; ou &quot;They cannot possibly know the answer without more information.&quot;"></div><div class="text-hotspot" style="left:21.375%;top:69.57291666666666%;width:30.75%;height:.48958333333333337%" data-text="HER NAME IS SOULQUEENS." onclick="showTextTooltip(event,this)" data-translation="O NOME DELA É SOULQUEENS."></div><div class="text-hotspot" style="left:40.5%;top:70.52604166666666%;width:42.75%;height:1.3333333333333428%" data-text="SHE IS SUPPOSEDLY IN CHARGE OF NEW RECRUITS IN GHOST BUSTERS." onclick="showTextTooltip(event,this)" data-translation="ELA SUPOSTAMENTE ESTÁ NO COMANDO DOS NOVOS RECRUTAS EM CAÇA-FANTASMAS." data-tips="💡 A expressão **&quot;in charge of&quot;** significa ser responsável por algo ou alguém. É 6664%;width:9.25%;height:.16666666666666669%" data-text="OH." onclick="showTextTooltip(event,this)" data-translation="OH."></div><div class="text-hotspot" style="left:40%;top:30.989583333333332%;width:28.875%;height:.47916666666666663%" data-text="THAT WAS DANGEROUS." onclick="showTextTooltip(event,this)" data-translation="ISSO FOI PERIGOSO."></div><div class="text-hotspot" style="left:19%;top:36.213541666666664%;width:37.5%;height:1.2135416666666643%" data-text="YOU MUST HAVE DONE A PRETTY GOOD JOB HIDING IT." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DEVE TER FEITO UM BOM TRABALHO ESCONDENDO ISSO."></div><div class="text-hotspot" style="left:27.875%;top:37.48958333333333%;width:63.125%;height:1.9791666666666714%" data-text="THEN YOU PROBABLY KNOW A LOT ABOUT CURRENT EVENTS IN THE REAL WORLD AS WELL, SINCE IT PROBABLY HAS ONLY BEEN 70 DAYS OR SO." onclick="showTextTooltip(event,this)" data-translation="ENTÃO VOCÊ PROVAVELMENTE SABE MUITO SOBRE OS EVENTOS ATUAIS NO MUNDO REAL TAMBÉM, JÁ QUE PROVAVELMENTE SÓ PASSARAM 70 DIAS OU ALGO ASSIM." data-tips="💡 'Current events' refere-se a eventos atuais ou recentes, sendo uma expressão útil para falar sobre o que está acontecendo no mundo no momento."></div><div class="text-hotspot" style="left:49.125%;top:45.21875%;width:10.625%;height:.5104166666666666%" data-text="8." onclick="showTextTooltip(event,this)" data-translation="8."></div><div class="text-hotspot" style="left:63.625%;top:46.239583333333336%;width:25.624999999999996%;height:.17708333333333331%" data-text="70 DAYS?" onclick="showTextTooltip(event,this)" data-translation="70 DIAS?"></div><div class="text-hotspot" style="left:36.625%;top:50.088541666666664%;width:38.625%;height:1.2291666666666643%" data-text="OH, TIME FLOWS DIFFERENTLY HERE THAN ON EARTH." onclick="showTextTooltip(event,this)" data-translation="AH, O TEMPO FLUI DE FORMA DIFERENTE AQUI DO QUE NA TERRA." data-tips="💡 'Time flows differently' usa 'flows' para descrever o movimento do tempo, uma metáfora comum para indicar que o tempo passa de maneira distinta em diferentes contextos."></div><div class="text-hotspot" style="left:13.750000000000002%;top:51.71875%;width:56.625%;height:1.7552083333333286%" data-text="ONE MONTH THERE IS ABOUT FIVE MONTHS IN THE GAME. ONE TO FIVE, ROUGHLY." onclick="showTextTooltip(event,this)" data-translation="UM MÊS LÁ É CERCA DE CINCO MESES NO JOGO. UM PARA CINCO, APROXIMADAMENTE." data-tips="💡 A expressão **'roughly'** significa 'aproximadamente' ou 'mais ou menos'. É usada para indicar uma estimativa ou algo que não é exato. - The meeting will last roughly two hours. - The cost is roughly $50."></div><div class="text-hotspot" style="left:34.5%;top:56.53125%;width:40.5%;height:1.4427083333333286%" data-text="WAIT. SINCE I'M FIVE MONTHS INTO THE GAME, IT HAS BEEN A MONTH IN EARTH'S TIME." onclick="showTextTooltip(event,this)" data-translation="ESPERA. JÁ QUE ESTOU HÁ CINCO MESES NO JOGO, PASSOU UM MÊS NO TEMPO DA TERRA." data-tips="💡 A estrutura **'since I'm five months into the game'** usa 'since' para indicar uma razão ou causa. Aqui, 'since' tem o sentido de 'já que'. - Since it's raining, we'll stay indoors. - Since he's busy, I'll handle it."></div><div class="text-hotspot" style="left:19.875%;top:58.578125%;width:37.75%;height:.9427083333333334%" data-text="IT FEELS SO STRANGE TO THINK IT'S ONLY BEEN ONE MONTH." onclick="showTextTooltip(event,this)" data-translation="PARECE TÃO ESTRANHO PENSAR QUE SÓ PASSOU UM MÊS." data-tips="💡 A expressão **'it feels so strange'** é uma maneira de expressar que algo parece incomum ou estranho. - It feels so strange to be back home after so long. - It feels so strange not seeing her every day."></div><div class="text-hotspot" style="left:49.375%;top:59.942708333333336%;width:33.75%;height:.4687499999999929%" data-text="I WONDER IF ANYONE HAS REPORTED ME MISSING." onclick="showTextTooltip(event,this)" data-translation="ME PERGUNTO SE ALGUÉM ME DEU COMO DESAPARECIDO." data-tips="💡 A frase **'I wonder if anyone has reported me missing'** usa a estrutura 'I wonder if' para expressar curiosidade ou dúvida. - I wonder if she knows the answer. - I wonder if they'll arrive on time."></div><div class="text-hotspot" style="left:25.624999999999996%;top:62.390625%;width:48.5%;height:.9739583333333333%" data-text="I SPOKE WITH PINKGUY AND GOT A LOT OF INFORMATION AFTERWARDS." onclick="showTextTooltip(event,this)" data-translation="CONVERSEI COM PINKGUY E OBTIVE MUITAS INFORMAÇÕES DEPOIS." data-tips="💡 O phrasal verb **'spoke with'** é uma maneira de dizer 'conversei com'. 'Speak with' é usado em contextos formais e informais. - I spoke with the manager about the issue. - She spoke with her friend yesterday."></div><div class="text-hotspot" style="left:8.5%;top:67.140625%;width:82.75%;height:.3125%" data-text="Q. HOW DO I RETURN?" onclick="showTextTooltip(event,this)" data-translation="P. COMO EU VOLTO?"></div><div class="text-hotspot" style="left:28.625%;top:69.25520833333333%;width:30.5%;height:.9635416666666667%" data-text="NOT SURE. THERE ARE VARIOUS THEORIES..." onclick="showTextTooltip(event,this)" data-translation="NÃO SEI. HÁ VÁRIAS TEORIAS..."></div><div class="text-hotspot" style="left:40.25%;top:70.50520833333334%;width:40.375%;height:.9427083333333286%" data-text="BUT NOTHING IS DEFINITE AS OF YET." onclick="showTextTooltip(event,this)" data-translation="MAS NADA É DEFINITIVO AINDA." data-tips="💡 'As of yet' é uma expressão formal que significa 'até agora'."></div><div class="text-hotspot" style="left:19.25%;top:71.71875%;width:23%;height:.20833333333333334%" data-text="[pinkguy]" onclick="showTextTooltip(event,this)" data-translation="[pinkguy]"></div><div class="text-hotspot" style="left:55.25%;top:75.0625%;width:8.375%;height:.3229166666666667%" data-text="B" onclick="showTextTooltip(event,this)" data-translation="B"></div><div class="text-hotspot" style="left:49%;top:76.95833333333333%;width:23.125%;height:.4166666666666667%" dat são **'Don't you think that's amazing?'** é uma forma de buscar concordância ou opinião. É comum em conversas para engajar a outra pessoa. - Don't you think it's a great idea? - Don't you think he's talented?"></div><div class="text-hotspot" style="left:34.125%;top:96.71875%;width:35.5%;height:.3177083333333333%" data-text="[elfnunna]" onclick="showTextTooltip(event,this)" data-translation="[elfnunna]"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/63/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:48.75%;top:2.3645833333333335%;width:38.375%;height:.421875%" data-text="I ABSOLUTELY AGREE." onclick="showTextTooltip(event,this)" data-translation="EU ABSOLUTAMENTE CONCORDO."></div><div class="text-hotspot" style="left:3.125%;top:5.744791666666667%;width:78.75%;height:3.755208333333333%" data-text="8 TO BE HONEST, I FEEL KINDA DEFEATED. THIS HURTS MY PRIDE AS A VETERAN PLAYER OF THE GAME." onclick="showTextTooltip(event,this)" data-translation="8 PARA SER HONESTO, EU ME SINTO MEIO DERROTADO. ISSO FERE MEU ORGULHO COMO UM JOGADOR VETERANO DO JOGO." data-tips="💡 A expressão **'to be honest'** é usada para introduzir uma opinião sincera. É frequentemente usada para suavizar uma crítica ou comentário honesto. - To be honest, I didn't like the movie. - To be honest, I think you should try again."></div><div class="text-hotspot" style="left:20.25%;top:12.838541666666666%;width:59.5%;height:.9583333333333333%" data-text="THEY MIGHT NOT LOOK THAT WAY, BUT EVERYONE HERE HAS REACHED THE GATE OF THE ABYSS BEFORE ME." onclick="showTextTooltip(event,this)" data-translation="ELES PODEM NÃO PARECER, MAS TODOS AQUI JÁ CHEGARAM AO PORTAL DO ABISMO ANTES DE MIM." data-tips="💡 A estrutura **'They might not look that way'** usa 'might' para indicar possibilidade e 'that way' para se referir a uma aparência ou impressão específica. - He might not look strong, but he is. - It might not look  YEARS AGO?" onclick="showTextTooltip(event,this)" data-translation="LEMBRA DO MOD QUE PERMITIA AOS JOGADORES AJUSTAR OS PONTOS DE EXPERIÊNCIA E A TAXA DE DROP DE ITENS, QUE FOI CARREGADO NO STONE IVEN HÁ CINCO ANOS?"></div><div class="text-hotspot" style="left:16.5%;top:61.182291666666664%;width:67.25%;height:1.1614583333333357%" data-text="I DON'T MEAN TO BRAG ABOUT IT, BUT I BEAT THE GAME AT 50X." onclick="showTextTooltip(event,this)" data-translation="NÃO QUERO ME GABAR, MAS TERMINEI O JOGO EM 50X." data-tips="💡 A expressão **'I don't mean to brag'** é usada para suavizar uma declaração que pode parecer arrogante. 'Brag' significa 'gabar'. - I don't mean to brag, but I won first place. - I don't mean to brag, but I cooked it myself."></div><div class="text-hotspot" style="left:.8750000000000001%;top:67.83333333333333%;width:51.125%;height:.9947916666666667%" data-text="CRACK" onclick="showTextTooltip(event,this)" data-translation="RACHADURA"></div><div class="text-hotspot" style="left:14.374999999999998%;top:70.42708333333333%;width:57.375%;height:1.46875%" data-text="I WAS WONDERING HOW SO MANY PLAYERS COULD HAVE REACHED THE LAST STAGE OF THIS GAME." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA ME PERGUNTANDO COMO TANTOS JOGADORES CONSEGUIRAM CHEGAR AO ÚLTIMO ESTÁGIO DESTE JOGO." data-tips="💡 A estrutura **'I was wondering how'** é usada para expressar curiosidade ou dúvida de forma educada. - I was wondering how you solved the problem. - I was wondering how they managed to finish so quickly."></div><div class="text-hotspot" style="left:40.875%;top:72.171875%;width:46.5%;height:1.1510416666666667%" data-text="NOW I HAVE MY ANSWER. THEY BEAT IT AT DECREASED DIFFICULTY." onclick="showTextTooltip(event,this)" data-translation="AGORA TENHO MINHA RESPOSTA. ELES TERMINARAM COM DIFICULDADE REDUZIDA." data-tips="💡 A frase **'Now I have my answer'** é uma maneira de dizer que você encontrou a solução ou explicação para algo. - Now I have my answer, - **There is no doubt that this is a challenging task.** (Não há dúvida de que esta é uma tarefa desafiadora.)"></div><div class="text-hotspot" style="left:11.25%;top:90.65104166666667%;width:53.625%;height:1.4791666666666667%" data-text="HOWEVER, THE SUPPORT ENDED FIVE YEARS AGO BECAUSE IT SEEMED IMPOSSIBLE TO CLEAR IT." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, O SUPORTE TERMINOU HÁ CINCO ANOS PORQUE PARECIA IMPOSSÍVEL TERMINÁ-LO." data-tips="💡 &quot;HOWEVER&quot; é um conector que introduz uma ideia contrastante ou oposta à anterior.

- **She was tired; however, she finished her work.** (Ela estava cansada; no entanto, terminou seu trabalho.)"></div><div class="text-hotspot" style="left:42.625%;top:94.86458333333333%;width:40.75%;height:1.4791666666666714%" data-text="...TO THINK THERE ACTUALLY WAS SOMEONE THAT BEAT THIS GAME..." onclick="showTextTooltip(event,this)" data-translation="...PENSAR QUE REALMENTE HAVIA ALGUÉM QUE TERMINOU ESTE JOGO..."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/63/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:36.125%;top:4.055816379760042%;width:44.375%;height:2.3865414710485133%" data-text="COULD WE HAVE BEEN WRONG TO REGARD IT AS A FAILURE?" onclick="showTextTooltip(event,this)" data-translation="PODERÍAMOS ESTAR ERRADOS AO CONSIDERÁ-LO UM FRACASSO?" data-tips="💡 O uso de &quot;COULD&quot; em &quot;COULD WE HAVE BEEN WRONG&quot; indica uma possibilidade no passado, sugerindo dúvida ou reflexão sobre uma ação passada.  
É uma forma de expressar incerteza sobre algo que pode ter acontecido de maneira diferente do que se pensava.  
- **Could I have missed something important?** (Será que perdi algo importante?)
- **Could they have misunderstood the instructions?** (Será que eles entenderam as instruções errado?)"></div><div class="text-hotspot" style="left:34.25%;top:16.471048513302033%;width:31.624999999999996%;height:1.8779342723004695%" data-text="THIS PIQUES MY CURIOSITY." onclick="showTextTooltip(event,this)" data-translation="ISSO DESPERTA MINHA CURIOSIDADE."></div><div class="text-hotspot" style="left:27.750000000000004%;top:39.69744392279603%;width:44.5%;height:1.4736567553468962%" data-text="WHO IS THIS HANSU LEE?" onclick="showTextTooltip(event,this)" data-translation="QUEM É ESTE HANSU LEE?"></div><div class="text-hotspot" style="left:9%;top:49.38706311945749%;width:81.625%;height:4.42097026604069%" data-text="HE IS THE ONLY PLAYER THAT CLEARED THE GAME LEFT BY HIM, WHICH EVERYONE THOUGHT WAS IMPOSSIBLE." onclick="showTextTooltip(event,this)" data-translation="ELE É O ÚNICO JOGADOR QUE TERMINOU O JOGO DEIXADO POR ELE, QUE TODOS ACHAVAM IMPOSSÍVEL." data-tips="💡 A estrutura &quot;WHICH EVERYONE THOUGHT WAS IMPOSSIBLE&quot; é uma **relative clause** que fornece mais informações sobre o substantivo anterior, neste caso, &quot;o jogo&quot;.

- **The book, which everyone loved, won an award.** (O livro, que todos amaram, ganhou um prêmio.)
- **The task, which seemed easy, was actually difficult.** (A tarefa, que parecia fácil, era na verdade difícil.)"></div><div class="text-hotspot" style="left:5.5%;top:58.85498174230569%;width:26.875%;height:1.2649973917579551%" data-text="TADA" onclick="showTextTooltip(event,this)" data-translation="TADA"></div><div class="text-hotspot" style="left:58.12500000000001%;top:65.6885758998435%;width:38%;height:2.2300469483568075%" data-text="TADADA" onclick="showTextTooltip(event,this)" data-translation="TADADA"></div><div class="text-hotspot" style="left:24.125%;top:80.0339071465832%;width:53.37499999999999%;height:2.8169014084507045%" data-text="I WONDER HOW FAR HE WILL GO." onclick="showTextTooltip(event,this)" data-translation="ME PERGUNTO ATÉ ONDE ELE VAI CHEGAR." data-tips="💡 A expressão &quot;I WONDER&quot; é usada para expressar curiosidade ou dúvida sobre algo.
