this)" data-translation="A DIGNIDADE DA SUA ALMA AUMENTOU MESMO SEM TERMOS DERROTADO NENHUM MONSTRO."></div><div class="text-hotspot" style="left:27.875%;top:73.46354166666667%;width:56.49999999999999%;height:1.2135416666666665%" data-text="I SUSPECT IT COULD BE A REWARD FOR OPENING THE PORTAL FOR THE FIRST TIME THIS MONTH." onclick="showTextTooltip(event,this)" data-translation="SUSPEITO QUE PODE SER UMA RECOMPENSA POR ABRIR O PORTAL PELA PRIMEIRA VEZ ESTE MÊS."></div><div class="text-hotspot" style="left:13.875000000000002%;top:75.34375%;width:37.75%;height:1.0572916666666714%" data-text="SUSPECT MY ASS. I KNEW ABOUT IT BEFORE I CAME HERE." onclick="showTextTooltip(event,this)" data-translation="SUSPEITO UMA OVA. EU JÁ SABIA DISSO ANTES DE VIR PARA CÁ."></div><div class="text-hotspot" style="left:30.125%;top:80.75520833333333%;width:39.375%;height:.71875%" data-text="EXPERIENCE POINTS, EXP POINTS FOR SHORT..." onclick="showTextTooltip(event,this)" data-translation="PONTOS DE EXPERIÊNCIA, OU EXP PARA RESUMIR..."></div><div class="text-hotspot" style="left:41.125%;top:82.57291666666666%;width:18.125%;height:.1875%" data-text="[EXP+1]" onclick="showTextTooltip(event,this)" data-translation="[EXP+1]"></div><div class="text-hotspot" style="left:12.625%;top:87.671875%;width:45%;height:.7031250000000142%" data-text="...ARE ALSO KNOWN AS ACCOMPLISHMENTS IN THIS WORLD." onclick="showTextTooltip(event,this)" data-translation="...TAMBÉM SÃO CONHECIDOS COMO REALIZAÇÕES NESTE MUNDO."></div><div class="text-hotspot" style="left:31.374999999999996%;top:88.97395833333334%;width:60%;height:1.2083333333333144%" data-text="I CAN ONLY GAIN THEM ONCE FOR EACH TYPE OF MONSTER, SO IT BECOMES EXTREMELY DIFFICULT TO LEVEL UP LATER IN THE GAME." onclick="showTextTooltip(event,this)" data-translation="SÓ POSSO GANHÁ-LOS UMA VEZ PARA CADA TIPO DE MONSTRO, ENTÃO FICA EXTREMAMENTE DIFÍCIL SUBIR DE NÍVEL MAIS TARDE NO JOGO."></div><div class="text-hotspot" style="left:20%;top:94.63020833333333%;width:59.625%;height:1.21875%" data-text="ONE OF THE WORKAROUNDS I DISCOVERED WHILE PLAYING THIS GAME IS TO SPEEDRUN, SO AS TO OPEN THE PORTAL FOR THE FIRST TIME." onclick="showTextTooltip(event,this)" data-translation="UMA DAS SOLUÇÕES QUE DESCOBRI JOGANDO ESTE JOGO É FAZER SPEEDRUN, PARA ABRIR O PORTAL PELA PRIMEIRA VEZ."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/19/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:18.5%;top:8.739583333333334%;width:63.375%;height:1.1979166666666667%" data-text="BECAUSE I CAN GET EXP POINTS ASSOCIATED WITH OPENING THE PORTAL FIRST AS MANY TIMES AS I WANT, THIS IS A GREAT WAY TO CONTINUE LEVELING UP!" onclick="showTextTooltip(event,this)" data-translation="PORQUE POSSO GANHAR PONTOS DE EXP ASSOCIADOS À ABERTURA DO PORTAL PRIMEIRO QUANTAS VEZES EU QUISER, ESTA É UMA ÓTIMA MANEIRA DE CONTINUAR SUBINDO DE NÍVEL!"></div><div class="text-hotspot" style="left:16.5%;top:14.385416666666668%;width:44%;height:1.2083333333333321%" data-text="THIS INFORMATION IS SO VALUABLE, THAT I'M NOT GOING TO SHARE IT WITH ANYONE." onclick="showTextTooltip(event,this)" data-translation="ESTA INFORMAÇÃO É TÃO VALIOSA QUE NÃO VOU COMPARTILHÁ-LA COM NINGUÉM."></div><div class="text-hotspot" style="left:17.875%;top:17.505208333333332%;width:34.75%;height:.8697916666666666%" data-text="HMPH" onclick="showTextTooltip(event,this)" data-translation="HMPH"></div><div class="text-hotspot" style="left:21%;top:20.385416666666668%;width:57.75%;height:1.3333333333333321%" data-text="I NEED TO TAKE ADVANTAGE OF THIS AS LONG AS POSSIBLE BEFORE OTHERS COULD BENEFIT FROM IT!" onclick="showTextTooltip(event,this)" data-translation="PRECISO APROVEITAR ISSO O MÁXIMO POSSÍVEL ANTES QUE OUTROS POSSAM SE BENEFICIAR DISSO!"></div><div class="text-hotspot" style="left:28.875%;top:26.104166666666668%;width:54.125%;height:1.203125%" data-text="AINAR. LET'S KEEP WHAT JUST HAPPENED
