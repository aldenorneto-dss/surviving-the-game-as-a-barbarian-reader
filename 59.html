US FÍSICO É 300 OU MAIS."></div><div class="text-hotspot" style="left:34.125%;top:18.213541666666664%;width:50.125%;height:.6770833333333334%" data-text="POISONING EFFECT IS REDUCED BY HALF." onclick="showTextTooltip(event,this)" data-translation="O EFEITO DO ENVENENAMENTO É REDUZIDO PELA METADE." data-tips="💡 'Reduced by half' é uma expressão que significa que algo foi diminuído em 50%. É uma forma comum de indicar redução significativa."></div><div class="text-hotspot" style="left:9%;top:21.744791666666664%;width:26.75%;height:.3854166666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:28.249999999999996%;top:23.083333333333332%;width:26.875%;height:.3854166666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:23%;top:24.890625%;width:55.00000000000001%;height:.8385416666666666%" data-text="YOU'VE IMPROVED A LOT, BARBARIAN." onclick="showTextTooltip(event,this)" data-translation="VOCÊ MELHOROU MUITO, BÁRBARO." data-tips="💡 'Você melhorou muito' é uma tradução direta, mas em inglês, **a lot** é uma expressão comum para indicar quantidade ou intensidade. Pode ser usada em várias situações: 'I like it a lot' (Eu gosto muito disso)."></div><div class="text-hotspot" style="left:71.625%;top:29.692708333333336%;width:26.75%;height:.671875%" data-text="SHAKE" onclick="showTextTooltip(event,this)" data-translation="BALANÇO"></div><div class="text-hotspot" style="left:61.375%;top:32.71354166666667%;width:30.625000000000004%;height:.16145833333333334%" data-text="YOU ARE...!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ É...!"></div><div class="text-hotspot" style="left:25.75%;top:34.109375%;width:47.25%;height:1.46875%" data-text="SHE'S THE PSYCHOPATHIC MURDERER I MET IN THE LAND OF THE DEAD!" onclick="showTextTooltip(event,this)" data-translation="ELA É A ASSASSINA PSICOPATA QUE ENCONTREI NA TERRA DOS MORTOS!" data-tips="💡 A palavra **psychopathic** pode ser confundida com 'psicopático', mas o termo correto em português é 'psicopata'. **Psychopathic** é um adjetivo que descreve alguém com características de psicopata."></div><div class="text-hotspot" style="left:66.5%;top:39.645833333333336%;width:17.25%;height:.16145833333333334%" data-text="HMM..." onclick="showTextTooltip(event,this)" data-translation="HMM..."></div><div class="text-hotspot" style="left:39.875%;top:47.729166666666664%;width:48.25%;height:.7708333333333334%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)" data-translation="RISADA"></div><div class="text-hotspot" style="left:24.5%;top:49.817708333333336%;width:51.74999999999999%;height:1.2083333333333333%" data-text="YOU'RE NOT FLEEING. IS THAT BECAUSE YOU WISH TO PROTECT YOUR COMPANIONS?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO ESTÁ FUGINDO. É PORQUE DESEJA PROTEGER SEUS COMPANHEIROS?" data-tips="💡 'Fleeing' é um verbo menos comum para brasileiros, significa 'fugir'. É mais formal que 'run away'. Pode ser usado em: 'They are fleeing the country' (Eles estão fugindo do país)."></div><div class="text-hotspot" style="left:11%;top:55.19270833333333%;width:45.375%;height:.6927083333333334%" data-text="...WHAT'S IT TO YOU? MIND YOUR OWN BUSINESS." onclick="showTextTooltip(event,this)" data-translation="...O QUE VOCÊ TEM A VER COM ISSO? CUIDE DA SUA VIDA." data-tips="💡 A expressão **mind your own business** é uma forma coloquial de dizer 'cuide da sua vida'. É uma maneira direta de pedir para alguém não se intrometer."></div><div class="text-hotspot" style="left:57.49999999999999%;top:56.494791666666664%;width:21.25%;height:.4479166666666667%" data-text="UGH, SHE'S SO SCARY." onclick="showTextTooltip(event,this)" data-translation="UGH, ELA É TÃO ASSUSTADORA."></div><div class="text-hotspot" style="left:13.125%;top:61.145833333333336%;width:24.125%;height:.5520833333333334%" data-text="DROP" onclick="showTextTooltip(event,this)" data-translation="SOLTAR"></div><div class="text-hotspot" style="left:51%;top:63.265625%;width:29.125%;height:.8854166666666666%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:69.125%;top:65.5625%;width:2.625%;height:.16145833333333334%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:27.750000000000004%;top:65.65625%;width:47.625%;height:.9583333333333286%" data-text="I CAN THINK OF ONLY ONE REASON WHY THIS B**** WOULD BE HERE." onclick="showTextTooltip(event,this)" data-translation="SÓ CONSIGO PENSAR EM UMA RAZÃO PARA ESSA DESGRAÇADA ESTAR AQUI."></div><div class="text-hotspot" style="left:40.125%;top:71.25520833333333%;width:22.5%;height:.9843750000000142%" data-text="TO SILENCE ME." onclick="showTextTooltip(event,this)" data-translation="PARA ME SILENCIAR."></div><div class="text-hotspot" style="left:17.625%;top:81.26041666666667%;width:55.00000000000001%;height:1.46875%" data-text="SHE PROBABLY JUST LET ME GO SINCE I WAS A NOVICE BARBARIAN BACK THEN. HOWEVER, I'VE NOW GOTTEN PRETTY FAMOUS." onclick="showTextTooltip(event,this)" data-translation="ELA PROVAVELMENTE ME DEIXOU IR EMBORA PORQUE EU ERA UM BÁRBARO NOVATO NAQUELA ÉPOCA. NO ENTANTO, AGORA FIQUEI BEM FAMOSO." data-tips="💡 'Back then' é uma expressão que se refere a um tempo específico no passado. Em português, podemos dizer 'naquela época'. Exemplo: 'I was a student back then' (Eu era estudante naquela época)."></div><div class="text-hotspot" style="left:36.5%;top:83.265625%;width:47.75%;height:1.2083333333333333%" data-text="AND I HAPPENED TO ENTER THE SEWERS AWAY FROM THE EYES OF PEOPLE, PRESENTING HER AN OPPORTUNITY." onclick="showTextTooltip(event,this)" data-translation="E ACONTECEU DE EU ENTRAR NOS ESGOTOS LONGE DOS OLHOS DAS PESSOAS, DANDO A ELA UMA OPORTUNIDADE." data-tips="💡 O phrasal verb **happened to** é usado para indicar algo que ocorreu por acaso. Pode ser empregado em frases como 'Do you happen to have a pen?' (Você, por acaso, tem uma caneta?)."></div><div class="text-hotspot" style="left:38.625%;top:89.03125%;width:36%;height:.6927083333333334%" data-text="I HONORED MY PART OF THE BARGAIN." onclick="showTextTooltip(event,this)" data-translation="CUMPRI MINHA PARTE DO ACORDO." data-tips="💡 'Honored my part of the bargain' significa cumprir uma promessa ou acordo, semelhante a 'cumprir minha parte do acordo'."></div><div class="text-hotspot" style="left:17.75%;top:90.390625%;width:46.5%;height:1.21875%" data-text="WHY HAVE YOU CHASED ME TO THE SEWERS? ARE YOU TRYING TO SILENCE ME?" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ ME PERSEGUIU ATÉ OS ESGOTOS? ESTÁ TENTANDO ME SILENCIAR?" data-tips="💡 'Chase' significa 'perseguir', mas é mais intenso do que 'follow'. Pode ser usado em: 'The dog chased the cat' (O cachorro perseguiu o gato)."></div><div class="text-hotspot" style="left:28.499999999999996%;top:97.5625%;width:36%;height:.171875%" data-text="CHASED YOU?" onclick="showTextTooltip(event,this)" data-translation="PERSEGUI VOCÊ?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/59/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:10.125%;top:2.0572916666666665%;width:57.49999999999999%;height:.765625%" data-text="YOU OPENED THE DOOR AND INVADED, BARBARIAN." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ABRIU A PORTA E INVADIU, BÁRBARO." data-tips="💡 'Invaded' é um falso cognato. Em português, 'invadir' geralmente tem um sentido mais físico e agressivo, enquanto em inglês pode ser usado para descrever qualquer entrada não autorizada."></div><div class="text-hotspot" style="left:41.625%;top:3.671875%;width:40.875%;height:1.0468750000000009%" data-text="TELL ME NOW. HOW DID YOU KNOW ABOUT THIS PLACE?" onclick="showTextTooltip(event,this)" data-translation="ME DIGA AGORA. COMO VOCÊ SOUBE DESTE LUGAR?" data-tips="💡 A estrutura **how did you know** é comum para perguntar sobre o método ou meio pelo qual alguém soube de algo. Exemplo: 'How did you know about the party?' (Como você soube da festa?)."></div><div class="text-hotspot" style="left:56.125%;top:11.609375%;width:29.875%;height:.4166666666666667%" data-text="DOOR? INVADED...?" onclick="showTextTooltip(event,this)" data-translation="PORTA? INVADEU...?"></div><div class="text-hotspot" style="left:31.374999999999996%;top:16.619791666666668%;width:44.625%;height:.9583333333333333%" data-text="I DON'T UNDERSTAND. SPEAK IN SIMPLE TERMS." onclick="showTextTooltip(event,this)" data-translation="NÃO ENTENDO. FALE EM TERMOS SIMPLES." data-tips="💡 'Speak in simple terms' pode ser traduzido como 'fale de forma simples'. Em inglês, 'terms' pode significar 'palavras' ou 'condições', dependendo do contexto."></div><div class="text-hotspot" style="left:13.25%;top:18.145833333333332%;width:46%;height:.9635416666666667%" data-text="WHAT IS THIS PLACE, THAT YOU ARE SAYING I INVADED?" onclick="showTextTooltip(event,this)" data-translation="QUE LUGAR É ESTE, QUE VOCÊ ESTÁ DIZENDO QUE INVADE?"></div><div class="text-hotspot" style="left:70.75%;top:18.536458333333332%;width:27.750000000000004%;height:.8750000000000001%" data-text="LIFT" onclick="showTextTooltip(event,this)" data-translation="LEVANTAR"></div><div class="text-hotspot" style="left:65.125%;top:20.75%;width:6.875000000000001%;height:.3177083333333333%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:31.374999999999996%;top:20.901041666666668%;width:17.375%;height:.45312499999999994%" data-text="SWISH" onclick="showTextTooltip(event,this)" data-translation="SWISH"></div><div class="text-hotspot" style="left:9.375%;top:24.411458333333332%;width:51.125%;height:.9479166666666679%" data-text="...DID YOU REALLY ENTER WITHOUT KNOWING ANYTHING?" onclick="showTextTooltip(event,this)" data-translation="...VOCÊ REALMENTE ENTROU SEM SABER DE NADA?" data-tips="💡 'Did you really enter without knowing anything?' usa a estrutura de pergunta com 'did' para enfatizar a surpresa ou incredulidade."></div><div class="text-hotspot" style="left:31.624999999999996%;top:26.098958333333332%;width:36.625%;height:.6875%" data-text="HOW DID YOU OPEN THE DOOR?" onclick="showTextTooltip(event,this)" data-translation="COMO VOCÊ ABRIU A PORTA?"></div><div class="text-hotspot" style="left:23.75%;top:30.166666666666668%;width:62.25%;height:1.484375%" data-text="IF YOU'RE TALKING ABOUT THE ENCHANTED SOMETHING IN THE SEWERS, I DESTROYED IT WITH MY MACE." onclick="showTextTooltip(event,this)" data-translation="SE VOCÊ ESTÁ FALANDO SOBRE O ALGO ENCANTADO NOS ESGOTOS, EU DESTRUÍ COM MINHA MAÇA." data-tips="💡 'Mace' é uma palavra que pode confundir brasileiros, pois não é comum. Refere-se a uma arma medieval, uma espécie de clava."></div><div class="text-hotspot" style="left:18%;top:35.03125%;width:25.874999999999996%;height:.5885416666666666%" data-text="WHAT?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ?"></div><div class="text-hotspot" style="left:25%;top:36.791666666666664%;width:30.5%;height:.6979166666666666%" data-text="YOU DESTROYED IT?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ DESTRUIU?"></div><div class="text-hotspot" style="left:56.875%;top:38.390625%;width:29.625%;height:.4427083333333333%" data-text="IS THERE A PROBLEM?" onclick="showTextTooltip(event,this)" data-translation="HÁ ALGUM PROBLEMA?"></div><div class="text-hotspot" style="left:35.125%;top:42.17708333333333%;width:9%;height:.15104166666666666%" data-text="NO." onclick="showTextTooltip(event,this)" data-translation="NÃO."></div><div class="text-hotspot" style="left:38.625%;top:43.27083333333333%;width:29.875%;height:.4427083333333333%" data-text="WHY DID YOU DO IT?" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ FEZ I div class="text-hotspot" style="left:21.25%;top:71.17708333333333%;width:14.249999999999998%;height:.515625%" data-text="OH!" onclick="showTextTooltip(event,this)" data-translation="OH!"></div><div class="text-hotspot" style="left:19.25%;top:71.48958333333333%;width:79.125%;height:2.953125%" data-text="YOU DON'T HAVE TO WORRY ABOUT POTIONS. I'LL TAKE CARE OF THE REST FROM HERE-- STOP RIGHT THERE. STEP BACK" onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO PRECISA SE PREOCUPAR COM POÇÕES. EU CUIDAREI DO RESTO A PARTIR DAQUI-- PARE AÍ MESMO. DÊ UM PASSO PARA TRÁS"></div><div class="text-hotspot" style="left:81.375%;top:74.68229166666667%;width:3.5000000000000004%;height:.17708333333333331%" data-text="00" onclick="showTextTooltip(event,this)" data-translation="00"></div><div class="text-hotspot" style="left:53%;top:76.29166666666667%;width:35%;height:.8802083333333334%" data-text="SWISH" onclick="showTextTooltip(event,this)" data-translation="SWISH"></div><div class="text-hotspot" style="left:32.875%;top:78.57291666666667%;width:54.875%;height:1.203125%" data-text="I CAN'T LET YOU GO LIKE THIS SINCE YOU'VE FOUND OUT ABOUT THIS PLACE." onclick="showTextTooltip(event,this)" data-translation="NÃO POSSO DEIXAR VOCÊ IR ASSIM, JÁ QUE DESCOBRIU ESTE LUGAR." data-tips="💡 A expressão **I can't let you go** é uma maneira de dizer que alguém não pode permitir que outra pessoa saia ou faça algo. Pode ser usada em contextos emocionais ou de controle: 'I can't let you go without a hug' (Não posso deixar você ir sem um abraço)."></div><div class="text-hotspot" style="left:28.249999999999996%;top:84.18229166666666%;width:36.625%;height:.703125%" data-text="EVEN IF I SWEAR LIKE I DID BEFORE?" onclick="showTextTooltip(event,this)" data-translation="MESMO SE EU JURAR COMO FIZ ANTES?" data-tips="💡 'Even if' é uma conjunção que introduz uma condição que não muda o resultado. Em português, é 'mesmo se'. Exemplo: 'Even if it rains, we'll go' (Mesmo se chover, vamos)."></div>
