4%" data-text="YOU WILL BE HANDSOMELY COMPENSATED!" onclick="showTextTooltip(event,this)" data-translation="Vocês serão generosamente recompensados!" data-tips="💡 'Handsomely compensated' significa ser generosamente recompensado. 'Handsomely' é um advérbio que intensifica o quão boa a compensação será."></div><div class="text-hotspot" style="left:15.5%;top:20.635416666666668%;width:21.5%;height:.4322916666666667%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGAR"></div><div class="text-hotspot" style="left:65%;top:21.75%;width:21%;height:.4166666666666667%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGAR"></div><div class="text-hotspot" style="left:29.375%;top:27.90625%;width:42.375%;height:.6875%" data-text="PUT YOUR WEAPONS DOWN." onclick="showTextTooltip(event,this)" data-translation="Larguem suas armas."></div><div class="text-hotspot" style="left:31.75%;top:31.432291666666668%;width:55%;height:1.0364583333333321%" data-text="WH-WHAT? BUT THERE ARE MONSTERS BEHIND US!" onclick="showTextTooltip(event,this)" data-translation="O-O quê? Mas há monstros atrás de nós!"></div><div class="text-hotspot" style="left:14.625%;top:33.859375%;width:38.5%;height:1.0416666666666643%" data-text="DO YOU REALLY HAVE TO GO THAT FAR?!" onclick="showTextTooltip(event,this)" data-translation="Você realmente precisa ir tão longe?!"></div><div class="text-hotspot" style="left:54.25%;top:40.046875%;width:41.75%;height:.8958333333333334%" data-text="GLANCE" onclick="showTextTooltip(event,this)" data-translation="OLHAR"></div><div class="text-hotspot" style="left:29.625%;top:47.92708333333333%;width:50.375%;height:.703125%" data-text="THE ORCS ARE KEEPING DISTANCE AND ASSESSING THE SITUATION." onclick="showTextTooltip(event,this)" data-translation="Os orcs estão mantendo distância e avaliando a situação." data-tips="💡 'Assessing the situation' significa avaliar a situação. 'Assess' é um verbo que implica em analisar algo cuidad a estrutura de futuro simples que expressa intenção ou decisão de seguir instruções."></div><div class="text-hotspot" style="left:48.625%;top:93.11458333333333%;width:36.625%;height:.7916666666666667%" data-text="CLINK" onclick="showTextTooltip(event,this)" data-translation="TINIDO"></div><div class="text-hotspot" style="left:12.875%;top:96.96875%;width:49.625%;height:1.421875%" data-text="DROP" onclick="showTextTooltip(event,this)" data-translation="SOLTAR"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/41/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:43.875%;top:2.1614583333333335%;width:38.25%;height:1.21875%" data-text="ROTMILLER, COLLECT THE WEAPONS AND PUT THEM ASIDE." onclick="showTextTooltip(event,this)" data-translation="Rotmiller, colete as armas e coloque-as de lado."></div><div class="text-hotspot" style="left:2.375%;top:3.2552083333333335%;width:28.749999999999996%;height:.7447916666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:43.875%;top:5.390625%;width:3%;height:.09895833333333334%" data-text="E" onclick="showTextTooltip(event,this)" data-translation="E"></div><div class="text-hotspot" style="left:9.625%;top:7.098958333333333%;width:36.625%;height:.17708333333333331%" data-text="UNDERSTOOD." onclick="showTextTooltip(event,this)" data-translation="Entendido."></div><div class="text-hotspot" style="left:29.625%;top:11.536458333333334%;width:28.625%;height:.71875%" data-text="SNORT" onclick="showTextTooltip(event,this)" data-translation="RONCAR"></div><div class="text-hotspot" style="left:61.75000000000001%;top:19.901041666666668%;width:30.5%;height:.8177083333333333%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:11.375%;top:21.104166666666664%;width:29.75%;height:.6614583333333334%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:52.25%;top:22.21875%;width:21.25%;height:.43750000000000006%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:59.375%;top:24.692708333333332%;width:36.75%;height:.984375%" data-text="THUMP" onclick="showTextTooltip(event,this)" data-translation="TUM"></div><div class="text-hotspot" style="left:13.375%;top:26.833333333333332%;width:49.875%;height:.9427083333333334%" data-text="THEY'RE RUNNING AWAY. THEY PROBABLY FIGURED OUT THE ADVENTURERS WERE JOINING US." onclick="showTextTooltip(event,this)" data-translation="Eles estão fugindo. Provavelmente perceberam que os aventureiros estavam se juntando a nós." data-tips="💡 'Figured out' é um phrasal verb que significa descobrir ou compreender algo. Exemplo: 'She figured out the solution to the puzzle.'"></div><div class="text-hotspot" style="left:41.75%;top:28.697916666666668%;width:40.125%;height:.953125%" data-text="I CAN'T BELIEVE HOW CLEVER THOSE MONSTERS ARE, BIG OR SMALL." onclick="showTextTooltip(event,this)" data-translation="Não posso acreditar em como esses monstros são espertos, grandes ou pequenos." data-tips="💡 'Clever' significa inteligente ou esperto. É uma palavra útil para descrever alguém que é bom em resolver problemas."></div><div class="text-hotspot" style="left:46.5%;top:34.6875%;width:36.875%;height:.6927083333333334%" data-text="THANK YOU SO MUCH FOR YOUR HELP." onclick="showTextTooltip(event,this)" data-translation="Muito obrigado por sua ajuda."></div><div class="text-hotspot" style="left:18%;top:40.828125%;width:64.25%;height:1.3229166666666667%" data-text="I AM ELISA. WE WOULD HAVE SURELY PERISHED HAD IT NOT BEEN FOR YOUR INTERVENTION." onclick="showTextTooltip(event,this)" data-translation="Eu sou Elisa. Certamente teríamos perecido se não fosse por sua intervenção."></div><div class="text-hotspot" style="left:3.6249999999999996%;top:54.0625%;width:32.25%;height:.35416666666666663%" data-text="SPARKLE" onclick="showTextTooltip(event,this)" data-translation="BRILHAR"></div><div class="text-hotspot" style="left:66.25%;top:55.723958333333336%;width:30.125%;height:.45312499999999994%" data-text="SPARKLE" onclick="showTextTooltip(event,this)" data-translation="BRILHAR"></div><div class="text-hotspot" style="left:34.25%;top:56.80729166666667%;width:35.75%;height:.27083333333333337%" data-text="A-AHEM!!" onclick="showTextTooltip(event,this)" data-translation="A-Hem!!"></div><div class="text-hotspot" style="left:47.625%;top:61.55208333333333%;width:24.625%;height:.7604166666666667%" data-text="I AM HIKUROD MURAD." onclick="showTextTooltip(event,this)" data-translation="Eu sou Hikurod Murad."></div><div class="text-hotspot" style="left:11.125%;top:62.692708333333336%;width:55.875%;height:1.2135416666666643%" data-text="I DON'T KNOW WHAT HAPPENED TO YOU, BUT YOU DON'T HAVE TO BE AFRAID ANYMORE." onclick="showTextTooltip(event,this)" data-translation="Não sei o que aconteceu com vocês, mas não precisam ter mais medo." data-tips="💡 'You don't have to be afraid anymore' usa 'have to' para indicar necessidade ou obrigação, mas aqui é usado na negativa para aliviar preocupações."></div><div class="text-hotspot" style="left:71.25%;top:63.911458333333336%;width:27.500000000000004%;height:.49479166666666663%" data-text="GLANCE" onclick="showTextTooltip(event,this)" data-translation="OLHAR"></div><div class="text-hotspot" style="left:45.125%;top:69.03645833333333%;width:38.875%;height:1.3125%" data-text="YOU STUPID DWARF. YOU FELL FOR THE OLD TRICK RIGHT AWAY." onclick="showTextTooltip(event,this)" data-translation="Seu anão estúpido. Você caiu no truque antigo imediatamente." data-tips="💡 'Fell for' é um phrasal verb que significa ser enganado por algo. Exemplo: 'He fell for the scam and lost his money.'"></div><div class="text-hotspot" style="left:47.375%;top:74.83333333333333%;width:34.5%;height:.953125%" data-text="THANK YOU FOR SAVING US. I'M IRITA TAISON." onclick="showTextTooltip(event,this)" data-translation="Obrigado por nos salvar. Sou Irita Taison."></div><div class="text-hotspot" style="left:58.62500000000001%;top:81.20833333333334%;width:16.375%;height:.4270833333333333%" data-text="HANS ARGO." onclick="showTextTooltip(event,this)" data-translation="Hans Argo."></div><div class="text-hotspot" style="left:23.25%;top:86.27083333333333%;width:25.75%;height:.171875%" data-text="HANS...?" onclick="showTextTooltip(event,this)" data-translation="Hans...?"></div><div class="text-hotspot" style="left:63.74999999999999%;top:89.875%;width:4.625%;height:.057291666666666664%" data-text="00" onclick="showTextTooltip(event,this)" data-translation="00"></div><div class="text-hotspot" style="left:51.5%;top:90.51041666666667%;width:33.25%;height:.6510416666666667%" data-text="FLINCY" onclick="showTextTooltip(event,this)" data-translation="FLINCY"></div><div class="text-hotspot" style="left:20.125%;top:94.27083333333334%;width:46.875%;height:.953125%" data-text="NAME OF THE FIRST PLUNDERER I MET WITHIN THE LABYRINTH WAS ALSO HANS." onclick="showTextTooltip(event,this)" data-translation="O nome do primeiro saqueador que encontrei no labirinto também era Hans."></div><div class="text-hotspot" style="left:53.5%;top:95.95833333333333%;width:28.875%;height:.6822916666666714%" data-text="...WHAT A STRANGE COINCIDENCE." onclick="showTextTooltip(event,this)" data-translation="...Que coincidência estranha."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/41/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:13.750000000000002%;top:1.359375%;width:27.875%;height:.7083333333333333%" data-text="IT'S A COMMON NAME." onclick="showTextTooltip(event,this)" data-translation="É um nome comum."></div><div class="text-hotspot" style="left:16.5%;top:2.609375%;width:44%;height:.9791666666666667%" data-text="YOU KNOW SOMEONE WITH THE SAME NAME, I TAKE IT?" onclick="showTextTooltip(event,this)" data-translation="Você conhece alguém com o mesmo nome, imagino?" data-tips="💡 'I take it' é uma expressão usada para confirmar uma suposição. Exemplo: 'You like coffee, I take it?'"></div><div class="text-hotspot" style="left:41.875%;top:7.734375%;width:15.25%;height:.4583333333333333%" data-text="WELL, YEAH." onclick="showTextTooltip(event,this)" data-translation="Bem, sim."></div><div class="text-hotspot" style="left:44.75%;top:9.416666666666666%;width:38.25%;height:1.0260416666666665%" data-text="ALTHOUGH HIS HEAD WAS CRUSHED A LONG TIME AGO." onclick="showTextTooltip(event,this)" data-translation="Embora sua cabeça tenha sido esmagada há muito tempo." data-tips="💡 'Although' é uma conjunção usada para introduzir uma ideia que contrasta com a anterior. Exemplo: 'Although it was raining, we went for a walk.'"></div><div class="text-hotspot" style="left:12.875%;top:15.078125%;width:51.37500000000001%;height:1.4739583333333335%" data-text="PHEW... I CAN'T IMAGINE WHAT WOULD HAVE HAPPENED IF IT WASN'T FOR YOU GUYS." onclick="showTextTooltip(event,this)" data-translation="Ufa... Não consigo imaginar o que teria acontecido se não fosse por vocês." data-tips="💡 'If it wasn't for' é uma estrutura condicional que expressa dependência de uma condição. Exemplo: 'If it wasn't for the rain, we would have gone out.'"></div><div class="text-hotspot" style="left:39.125%;top:23.416666666666668%;width:44.125%;height:1.2083333333333321%" data-text="PRAISE REATLAS. THE GODDESS MUST HAVE SHOWN US MERCY." onclick="showTextTooltip(event,this)" data-translation="Louvado seja Reatlas. A deusa deve ter nos mostrado misericórdia."></div><div class="text-hotspot" style="left:20.25%;top:29.354166666666664%;width:26.375%;height:.171875%" data-text="REATLAS?" onclick="showTextTooltip(event,this)" data-translation="Reatlas?"></div><div class="text-hotspot" style="left:29.5%;top:34.359375%;width:56.25%;height:.6770833333333334%" data-text="COULD IT BE... YOU'RE A PRIESTESS OF THE TEMPLE?" onclick="showTextTooltip(event,this)" data-translation="Poderia ser... você é uma sacerdotisa do templo?"></div><div class="text-hotspot" style="left:21.5%;top:39.729166666666664%;width:14.625%;height:.18229166666666666%" data-text="I AM!" onclick="showTextTooltip(event,this)" data-translation="Eu sou!"></div><div class="text-hotspot" style="left:15.75%;top:40.3125%;width:76.5%;height:1.7343750000000002%" data-text="ALTHOUGH I STILL LACK SO MUCH, I WAS GIVEN THE HONOR TO SERVE REATLAS, THE GODDESS OF STARS THAT WATCHES OVER ADVENTURES AND DESTINED RELATIONSHIPS." onclick="showTextTooltip(event,this)" data-translation="Embora ainda me falte muito, tive a honra de servir a Reatlas, a deusa das estrelas que vigia as aventuras e os relacionamentos destinados." data-tips="💡 'Lack' significa faltar ou não ter algo necessário. É usado para indicar uma deficiência ou ausência."></div><div class="text-hotspot" style="left:18.375%;top:49.078125%;width:38.625%;height:1.203125%" data-text="THE STARS DURING THE TWILIGHT SHALL GUIDE us..." onclick="showTextTooltip(event,this)" data-translation="As estrelas durante o crepúsculo nos guiarão..."></div><div class="text-hotspot" style="left:13.375%;top:54.97916666666667%;width:39.125%;height:.9583333333333286%" data-text="SCREW THAT. DO YOU HONESTLY THINK WE'D BUY THAT?" onclick="showTextTooltip(event,this)" data-translation="Que se dane. Você realmente acha que vamos acreditar nisso?"></div><div class="text-hotspot" style="left:38.5%;top:56.713541666666664%;width:43.625%;height:.9583333333333333%" data-text="I KNOW YOU'RE PLUNDERERS, SO PLEASE DROP THE ACT ALREADY--" onclick="showTextTooltip(event,this)" data-translation="Eu sei que vocês são saqueadores, então parem com a encenação já--"></div><div class="text-hotspot" style="left:46.125%;top:59.182291666666664%;width:45.125%;height:.9427083333333334%" data-text="LADY ELISA. COULD YOU TAKE A LOOK AT MY WOUNDS?" onclick="showTextTooltip(event,this)" data-translation="Senhora Elisa. Poderia dar uma olhada nos meus ferimentos?" data-tips="💡 'Take a look' é um phrasal verb que significa 'dar uma olhada'. É uma expressão comum para pedir que alguém examine algo."></div><div class="text-hotspot" style="left:62.125%;top:64.4375%;width:23.5%;height:.4322916666666572%" data-text="OF COURSE!" onclick="showTextTooltip(event,this)" data-translation="Claro!"></div><div class="text-hotspot" style="left:57.49999999999999%;top:72.83333333333334%;width:17.875%;height:.16145833333333334%" data-text="...WHAT?!" onclick="showTextTooltip(event,this)" data-translation="...O quê?!"></div><div class="text-hotspot" style="left:8.75%;top:77.453125%;width:79.375%;height:2.3229166666666665%" data-text="PWOOSH" onclick="showTextTooltip(event,this)" data-translation="PWOOSH"></div><div class="text-hotspot" style="left:32.5%;top:84.30208333333333%;width:35.75%;height:.6822916666666714%" data-text="SHE CAN REALLY USE DIVINE MAGIC?!" onclick="showTextTooltip(event,this)" data-translation="Ela realmente pode usar magia divina?!" data-tips="💡 'Can' é usado para expressar habilidade ou possibilidade. Aqui, questiona-se a habilidade de usar magia divina."></div><div class="text-hotspot" style="left:25%;top:90.54166666666667%;width:32%;height:.6875%" data-text="SH-SHE REALLY IS A PRIESTESS!" onclick="showTextTooltip(event,this)" data-translation="E-Ela realmente é uma sacerdotisa!"></div><div class="text-hotspot" style="left:25%;top:97.515625%;width:50.125%;height:1.4895833333333335%" data-text="ROTMILLER, ARE YOU SURE THEY'RE THE SAME PEOPLE THAT LAID THE TRAP FOR US BEFORRRRE?" onclick="showTextTooltip(event,this)" data-translation="Rotmiller, você tem certeza de que eles são as mesmas pessoas que armaram a armadilha para nós antes?" data-tips="💡 'Laid the trap' é uma expressão que significa 'armar uma armadilha'. 'Lay' é o verbo no passado, significando que a ação já ocorreu."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/41/7.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:43.125%;top:2.6822916666666665%;width:16.125%;height:.4427083333333333%" data-text="N-NO WAY..." onclick="showTextTooltip(event,this)" data-translation="N-Não pode ser..."></div><div class="text-hotspot" style="left:52.5%;top:3.75%;width:29.625%;height:.4322916666666667%" data-text="BUT I WAS SO SURE..." onclick="showTextTooltip(event,this)" data-translation="Mas eu tinha tanta certeza..."></div><div class="text-hotspot" style="left:10%;top:9.786458333333334%;width:36.25%;height:.6979166666666666%" data-text="HE'S FLUSTERED, AND REASONABLY So." onclick="showTextTooltip(event,this)" data-translation="Ele está confuso, e com razão." data-tips="💡 'Flustered' significa 'confuso' ou 'perturbado'. É uma palavra útil para descrever um estado emocional."></div><div class="text-hotspot" style="left:22.25%;top:11.1875%;width:67.5%;height:1.5052083333333335%" data-text="PRIESTS AND PRIESTESSES ARE DIVINE FIGURES IN DUNGEON AND STONE UNIVERSE, AND MOST HUMANS ARE DEVOUT FOLLOWERS OF DEITIES THEY SERVE." onclick="showTextTooltip(event,this)" data-translation="Sacerdotes e sacerdotisas são figuras divinas no universo de Dungeon and Stone, e a maioria dos humanos são devotos seguidores das divindades que servem."></div><div class="text-hotspot" style="left:23.125%;top:18.848958333333332%;width:22.75%;height:.16666666666666669%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="No entanto..."></div><div class="text-hotspot" style="left:39.375%;top:20.119791666666668%;width:21.625%;height:.47916666666666663%" data-text="BEAM" onclick="showTextTooltip(event,this)" data-translation="RAIO"></div><div class="text-hotspot" style="left:29.125%;top:25.572916666666668%;width:61.5%;height:.9635416666666667%" data-text="HAVE WE PROVEN OURSELVES AS SIMPLE ADVENTURERS?" onclick="showTextTooltip(event,this)" data-translation="Provamos que somos simples aventureiros?" data-tips="💡 'Have we proven ourselves' usa o present perfect para indicar uma ação que tem relevância no presente."></div><div class="text-hotspot" style="left:18%;top:27.145833333333336%;width:48%;height:.953125%" data-text="PERHAPS YOU CAN RETURN OUR WEAPONS TO US NOW." onclick="showTextTooltip(event,this)" data-translation="Talvez você possa nos devolver nossas armas agora." data-tips="💡 'Return' é um verbo que significa 'devolver'. É formal e pode ser usado em contextos de troca ou reembolso."></div><div class="text-hotspot" style="left:30.375000000000004%;top:32.6875%;width:41.75%;height:.6510416666666667%" data-text="I'M AFRAID I CAN'T." onclick="showTextTooltip(event,this)" data-translation="Receio que não posso."></div><div class="text-hotspot" style="left:12.375%;top:37.885416666666664%;width:20.5%;height:.17708333333333331%" data-text="...HUH?" onclick="showTextTooltip(event,this)" data-translation="...Huh?"></div><div class="text-hotspot" style="left:15.875%;top:42.328125%;width:48.75%;height:1.0520833333333286%" data-text="I GET THAT YOU'RE A PRIESTESS OF THE TEMPLE." onclick="showTextTooltip(event,this)" data-translation="Entendo que você é uma sacerdotisa do templo."></div><div class="text-hotspot" style="left:37.5%;top:44.03125%;width:51.37500000000001%;height:.7604166666666667%" data-text="BUT WHAT DOES THAT HAVE TO DO WITH ANYTHING?" onclick="showTextTooltip(event,this)" data-translation="Mas o que isso tem a ver com qualquer coisa?" data-tips="💡 'What does that have to do with anything?' é uma expressão usada para questionar a relevância de algo."></div><div class="text-hotspot" style="left:20%;top:53.494791666666664%;width:34.125%;height:.6822916666666666%" data-text="BUT THAT ONLY APPLIES TO HUMANS." onclick="showTextTooltip(event,this)" data-translation="Mas isso só se aplica a humanos."></div><div class="text-hotspot" style="left:39.75%;top:55.296875%;width:48%;height:.953125%" data-text="BARBARIANS ARE A COMPLETELY DIFFERENT PEOPLE THAT BELIEVE IN ANCESTOR GODS." onclick="showTextTooltip(event,this)" data-translation="Bárbaros são um povo completamente diferente que acredita em deuses ancestrais." data-tips="💡 'Completely different people' destaca que 'people' pode ser usado no singular para referir-se a um grupo étnico ou cultural."></div><div class="text-hotspot" style="left:18.25%;top:61.4375%;width:65.125%;height:1.2916666666666667%" data-text="I DEMAND PROPER REWARD FOR SAVING YOUR LIVES FIRST." onclick="showTextTooltip(event,this)" data-translation="Exijo uma recompensa adequada por salvar suas vidas primeiro." data-tips="💡 'Demand' é um verbo forte que significa 'exigir'. É mais formal que 'ask'."></div><div class="text-hotspot" style="left:24.875%;top:73.63541666666666%;width:52.87500000000001%;height:1.1614583333333333%" data-text="I DON'T CARE ABOUT DIVINE POWER. I HAVE NO REASON TO LET DOWN MY GUARD." onclick="showTextTooltip(event,this)" data-translation="Não me importo com poder divino. Não tenho razão para baixar a guarda." data-tips="💡 'Let down my guard' é uma expressão que significa 'baixar a guarda', usada para indicar estar menos vigilante."></div><div class="text-hotspot" style="left:15.25%;top:80.00520833333333%;width:31.374999999999996%;height:.16145833333333334%" data-text="REWARDS..." onclick="showTextTooltip(event,this)" data-translation="Recompensas..."></div><div class="text-hotspot" style="left:28.875%;top:80.75%;width:47.875%;height:1.2135416666666714%" data-text="RIGHT, I DID HEAR THERE WAS A PRACTICE LIKE THAT AMONG ADVENTURERS." onclick="showTextTooltip(event,this)" data-translation="Certo, ouvi dizer que havia uma prática assim entre aventureiros." data-tips="💡 'Hear' é usado para relatar algo que foi dito ou sabido por meio de outra pessoa. É um verbo frequentemente usado em relatos."></div><div class="text-hotspot" style="left:25.374999999999996%;top:88.83854166666667%;width:49.375%;height:.6822916666666572%" data-text="... I UNDERSTAND. HOW MUCH WOULD SUFFICE?" onclick="showTextTooltip(event,this)" data-translation="... Eu entendo. Quanto seria suficiente?" data-tips="💡 'Suffice' é um verbo formal que significa 'ser suficiente'. É menos comum em conversas casuais."></div><div class="text-hotspot" style="left:21.125%;top:93.53645833333334%;width:43.5%;height:.6666666666666572%" data-text="2 MILLION STONES SHOULD DO." onclick="showTextTooltip(event,this)" data-translation="2 milhões de pedras devem bastar."></div><div class="text-hotspot" style="left:37.625%;top:94.86458333333333%;width:49.625%;height:.7083333333333333%" data-text="THINK OF THAT AS HOW MUCH YOUR LIVES ARE WORTH." onclick="showTextTooltip(event,this)" data-translation="Pense nisso como o valor de suas vidas." data-tips="💡 'Think of that as' é uma construção útil para sugerir como algo deve ser interpretado ou considerado."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/41/8.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22.125%;top:3.3489583333333335%;width:49.5%;height:.9583333333333333%" data-text="WHAT? WE DON'T CARRY THAT MUCH MONEY ON OUR TRAVELS." onclick="showTextTooltip(event,this)" data-translation="O quê? Não carregamos tanto dinheiro em nossas viagens." data-tips="💡 'Carry' é um verbo que pode significar 'levar' ou 'transportar', e neste contexto, refere-se a dinheiro físico."></div><div class="text-hotspot" style="left:35.625%;top:4.921875%;width:54.87499999999999%;height:.6875%" data-text="W-WE'LL PAY YOU AFTER WE GET BACK TO THE CITY!" onclick="showTextTooltip(event,this)" data-translation="N-Nós pagaremos depois que voltarmos para a cidade!"></div><div class="text-hotspot" style="left:16.625%;top:10.098958333333332%;width:61.875%;height:1.1562500000000018%" data-text="NO. I ONLY TRUST THE WORDS OF FELLOW BARBARIANS." onclick="showTextTooltip(e
