ês, seria &quot;o que aconteceu com...?&quot;. - **What happened to** your car? - **What happened to** the project?"></div><div class="text-hotspot" style="left:44%;top:94.56770833333333%;width:16.25%;height:.45312499999999994%" data-text="NOM" onclick="showTextTooltip(event,this)" data-translation="NOM"></div><div class="text-hotspot" style="left:10.5%;top:98.46875%;width:48.75%;height:1.2083333333333286%" data-text="SINCE YOU ALREADY KNOW ROTMILLER GOT INJURED, I'LL CUT TO THE CHASE. WE BOUGHT EXTRA TIME BY ACTIVATING THE EFFECT OF GUARDIAN'S WRIST GUARD AGAIN." onclick="showTextTooltip(event,this)" data-translation="JÁ QUE VOCÊ JÁ SABE QUE ROTMILLER SE FERIU, VOU DIRETO AO PONTO. GANHAMOS TEMPO EXTRA ATIVANDO O EFEITO DO PROTETOR DE PULSO DO GUARDIÃO NOVAMENTE." data-tips="💡 A expressão **cut to the chase** é uma gíria que significa ir direto ao ponto, sem rodeios. Em português, seria &quot;ir direto ao ponto&quot;. - Let's **cut to the chase** and discuss the main issue. - Can we **cut to the chase**? I don't have much time."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/54/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:27.875%;top:.11458333333333333%;width:62.75%;height:1.4739583333333333%" data-text="WE BOUGHT EXTRA TIME BY ACTIVATING THE EFFECT OF GUARDIAN'S WRIST GUARD AGAIN." onclick="showTextTooltip(event,this)" data-translation="GANHAMOS TEMPO EXTRA ATIVANDO O EFEITO DO PROTETOR DE PULSO DO GUARDIÃO NOVAMENTE."></div><div class="text-hotspot" style="left:7.124999999999999%;top:5.453125%;width:22%;height:.5260416666666666%" data-text="HUH?" onclick="showTextTooltip(event,this)" data-translation="HÃ?"></div><div class="text-hotspot" style="left:10.75%;top:6.098958333333333%;width:46.625%;height:.953125%" data-text="I DIDN'T KNOW YOU COULD USE IT THAT OFFFFTEN." onclick="showTextTooltip(event,this)" data-translation="EU NÃO SABIA QUE VOCÊ PODIA USÁ-LO TÃO FREQUENTEMENTE." data-tips="💡 A palavra **often** significa &quot;frequentemente&quot; e é usada para indicar a frequência com que algo acontece. Em português, seria &quot;frequentemente&quot; ou &quot;muitas vezes&quot;. - She visits her grandparents **often**. - We **often** go for a walk in the park."></div><div class="text-hotspot" style="left:13.875000000000002%;top:8.348958333333334%;width:9%;height:.1875%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:44.375%;top:12.21875%;width:34%;height:.6979166666666666%" data-text="HE MUST I HAVE USED THAT COMBO." onclick="showTextTooltip(event,this)" data-translation="ELE DEVE TER USADO AQUELA COMBINAÇÃO." data-warning="1"></div><div class="text-hotspot" style="left:8.125%;top:17.322916666666664%;width:73.875%;height:2.7760416666666665%" data-text="CHUCKLE EMERGENCY RESTORATION ALSO RESTORES THE NUMBER OF TIMES THE EFFECT OF AN ITEM CAN BE ACTIVATED. IT IS THE WISDOM OF OUR ANCESTORS." onclick="showTextTooltip(event,this)" data-translation="RISADA A RESTAURAÇÃO DE EMERGÊNCIA TAMBÉM RESTAURA O NÚMERO DE VEZES QUE O EFEITO DE UM ITEM PODE SER ATIVADO. É A SABEDORIA DOS NOSSOS ANCESTRAIS."></div><div class="text-hotspot" style="left:27%;top:22.036458333333332%;width:6.75%;height:.13541666666666669%" data-text="UGH" onclick="showTextTooltip(event,this)" data-translation="UGH"></div><div class="text-hotspot" style="left:68%;top:23.3125%;width:15.625%;height:.296875%" data-text="EAT YOUR VEGGIES!" onclick="showTextTooltip(event,this)" data-translation="COMA SEUS VEGETAIS!"></div><div class="text-hotspot" style="left:24.625%;top:26.833333333333332%;width:65%;height:1.2083333333333333%" data-text="WHOA, I HAD NO IDEA YOU COULD USE YOUR SPECIAL ABILITY TO GET THE MOST OUT OF YOUR NUMBERED ITEMMMM." onclick="showTextTooltip(event,this)" data-translation="UOU, EU NÃO FAZIA IDEIA DE QUE VOCÊ PODIA USAR SUA HABILIDADE ESPECIAL PARA TIRAR O MÁXIMO DO SEU ITEM NUMERADO." data-tips="💡 A expressão **get the most out of** significa aproveitar ao máximo algo. Em português, seria &quot;tirar o máximo proveito de&quot;. - He tries to **get the most out of** every opportunity. - We need to **get the most out of** our resources."></div><div class="text-hotspot" style="left:20.125%;top:32.33333333333333%;width:58.875%;height:1.5%" data-text="ANYHOW, WE WERE ONLY ABLE TO TREAT ROTMILLER'S WOUNDS AFTER GETTING FAR AWAY FROM THE ATTACKERS." onclick="showTextTooltip(event,this)" data-translation="DE QUALQUER FORMA, SÓ CONSEGUIMOS TRATAR OS FERIMENTOS DE ROTMILLER DEPOIS DE NOS AFASTARMOS DOS ATACANTES." data-tips="💡 A expressão **anyhow** é uma forma informal de dizer &quot;de qualquer forma&quot; ou &quot;de qualquer maneira&quot;. É usada para mudar de assunto ou para continuar uma conversa após uma interrupção. - **Anyhow**, let's move on to the next topic. - **Anyhow**, I hope you have a great day."></div><div class="text-hotspot" style="left:42%;top:34.130208333333336%;width:41.5%;height:.9583333333333286%" data-text="WE ATTEMPTED TO FIND YOU RIGHT AWAY, BUT..." onclick="showTextTooltip(event,this)" data-translation="TENTAMOS ENCONTRAR VOCÊS IMEDIATAMENTE, MAS..."></div><div class="text-hotspot" style="left:24.25%;top:39.677083333333336%;width:47%;height:1.1979166666666667%" data-text="WE HAD GOTTEN A BIT TOO FAR. I COULDN'T DETECT YOUR PRESENCES WITH MY ABILITY." onclick="showTextTooltip(event,this)" data-translation="TINHAMOS NOS AFASTADO DEMAIS. NÃO CONSEGUI DETECTAR SUAS PRESENÇAS COM MINHA HABILIDADE." data-tips="💡 A estrutura **I couldn't detect** usa o passado simples para indicar que a ação de detectar não foi possível em um momento específico no passado. - I **couldn't find** my keys this morning. - She **couldn't remember** his name."></div><div class="text-hotspot" style="left:37.375%;top:41.229166666666664%;width:53.25%;height:1.21875%" data-text="WE STILL WANDERED AROUND THE FOREST IN THE HOPES OF LOCATING YOU..." onclick="showTextTooltip(event,this)" data-translation="AINDA VAGAMOS PELA FLORESTA NA ESPERANÇA DE LOCALIZAR VOCÊS..." data-tips="💡 A expressão **wandered around** significa vagar ou perambular sem destino específico. Em português, seria &quot;vagar&quot; ou &quot;perambular&quot;. - We **wandered around** the city all day. - He **wandered around** the park, enjoying the scenery."></div><div class="text-hotspot" style="left:27%;top:46.869791666666664%;width:45.875%;height:.9583333333333333%" data-text="...BUT RAN INTO THAT CRAZY WITCH AGAIN ON THE THIRD DAY." onclick="showTextTooltip(event,this)" data-translation="...MAS ENCONTRAMOS AQUELA BRUXA LOUCA NOVAMENTE NO TERCEIRO DIA." data-tips="💡 A expressão **ran into** é um phrasal verb que significa encontrar alguém ou algo por acaso. Em português, seria &quot;encontrar por acaso&quot;. - I **ran into** an old friend at the mall. - She **ran into** some problems with the project."></div><div class="text-hotspot" style="left:54.87499999999999%;top:51.48437500000001%;width:43%;height:.9010416666666666%" data-text="SLAM" onclick="showTextTooltip(event,this)" data-translation="SLAM"></div><div class="text-hotspot" style="left:30.875000000000004%;top:54.46354166666667%;width:37.25%;height:.71875%" data-text="WHAT?! OKAY, WHAT DID YOU DOOOO?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ?! OKAY, O QUE VOCÊS FIZERAM?"></div><div class="text-hotspot" style="left:24%;top:59.135416666666664%;width:17.875%;height:.28125%" data-text="WHAT ELSE COULD WE?" onclick="showTextTooltip(event,this)" data-translation="O QUE MAIS PODERÍAMOS?"></div><div class="text-hotspot" style="left:44.125%;top:59.833333333333336%;width:14.499999999999998%;height:.4270833333333333%" data-text="WE FLED!" onclick="showTextTooltip(event,this)" data-translation="FUGIMOS!"></div><div class="text-hotspot" style="left:41.75%;top:60.75000000000001%;width:44%;height:1.4635416666666667%" data-text="WE HAD NO CHOICE BUT TO ADVANCE TO THE FOURTH FLOOR THROUGH THE PORTAL." onclick="showTextTooltip(event,this)" data-translation="NÃO TIVEMOS OUTRA ESCOLHA A NÃO SER AVANÇAR PARA O QUARTO ANDAR ATRAVÉS DO PORTAL." data-tips="💡 A expressão **had no choice but to** indica que não havia outra opção senão fazer algo. Em português, seria &quot;não tivemos outra escolha a não ser&quot;. - We **had no choice but to** wait. - He **had no choice but to** apologize."></div><div class="text-hotspot" style="left:6.875000000000001%;top:63.244791666666664%;width:44.75%;height:.9583333333333357%" data-text="FORTUNATELY, WE WERE THE ONLY ONES THAT MADE IT." onclick="showTextTooltip(event,this)" data-translation="FELIZMENTE, FOMOS OS ÚNICOS QUE CONSEGUIMOS."></div><div class="text-hotspot" style="left:6.625%;top:65.30729166666667%;width:93.25%;height:4.901041666666671%" data-text="440 THEY USED THE ENTRY RESTRICTION TO THEIR ADVANTAGE." onclick="showTextTooltip(event,this)" data-translation="440 ELES USARAM A RESTRIÇÃO DE ENTRADA A SEU FAVOR." data-tips="💡 'To their advantage' significa usar algo a seu favor, uma expressão comum em estratégias."></div><div class="text-hotspot" style="left:12.125%;top:74.640625%;width:59.375%;height:.9635416666666667%" data-text="THE PORTAL TO THE TOWER OF HEAVENS ON THE FOURTH FLOOR CHANGES ITS COLOR ON A REGULAR BASIS." onclick="showTextTooltip(event,this)" data-translation="O PORTAL PARA A TORRE DOS CÉUS NO QUARTO ANDAR MUDA DE COR REGULARMENTE." data-tips="💡 'On a regular basis' significa 'regularmente', útil para indicar frequência."></div><div class="text-hotspot" style="left:31.125000000000004%;top:76.05729166666667%;width:56.000000000000014%;height:1.2031249999999858%" data-text="ONLY THOSE THAT ENTER THROUGH THE SAME COLOR PORTAL SPAWN IN THE SAME TOWER AND CLIMB TO THE TOP." onclick="showTextTooltip(event,this)" data-translation="APENAS AQUELES QUE ENTRAM PELO PORTAL DA MESMA COR APARECEM NA MESMA TORRE E SOBEM ATÉ O TOPO."></div><div class="text-hotspot" style="left:23%;top:84.46354166666666%;width:53.87499999999999%;height:.6927083333333334%" data-text="THE TRIAL ON EACH FLOOR OF THE TOWER DOES NOT RESET ONCE IT IS CLEARED." onclick="showTextTooltip(event,this)" data-translation="O DESAFIO EM CADA ANDAR DA TORRE NÃO REINICIA UMA VEZ QUE É CONCLUÍDO."></div><div class="text-hotspot" style="left:19%;top:87.53645833333333%;width:61.75000000000001%;height:.9322916666666667%" data-text="MEANING, THEY ARE SAFE AS LONG AS IT'S TAKEN CARE OF!" onclick="showTextTooltip(event,this)" data-translation="OU SEJA, ELES ESTÃO SEGUROS ENQUANTO ISSO ESTIVER CUIDADO!" data-tips="💡 &quot;OU SEJA&quot; é uma tradução de &quot;MEANING&quot;. **&quot;Meaning&quot;** é usado para introduzir uma explicação ou consequência do que foi dito antes. É uma forma de esclarecer ou resumir uma ideia. - **Meaning**, they are safe as long as you protect them. - **Meaning**, we need to finish this by tomorrow."></div><div class="text-hotspot" style="left:72.125%;top:89.52604166666667%;width:7.375%;height:.22395833333333334%" data-text="ZZ" onclick="showTextTooltip(event,this)" data-translation="ZZ"></div><div class="text-hotspot" style="left:35%;top:93.67708333333333%;width:53.5%;height:1.2135416666666665%" data-text="ALTHOUGH IT WAS QUITE A CHALLENGE TO DO NOTHING FOR MORE THAN TEN DAYS THERE." onclick="showTextTooltip(event,this)" data-translation="EMBORA TENHA SIDO UM DESAFIO NÃO FAZER NADA POR MAIS DE DEZ DIAS LÁ." data-tips="💡 &quot;ALTHOUGH&quot; é traduzido como &quot;EMBORA&quot;. **&quot;Although&quot;** é uma conjunção usada para introduzir uma ideia que contrasta ou se opõe à ideia principal da frase. - **Although** it was raining, we went for a walk. - **Although** she was tired, she finished the project."></div><div class="text-hotspot" style="left:20.625%;top:97.21875%;width:35%;height:.9583333333333333%" data-text="CHALLENGE?! DO YOU KNOW WHAT KIND OF SH** WE WENT THROUGH?" onclick="showTextTooltip(event,this)" data-translation="DESAFIO?! VOCÊ SABE QUE TIPO DE MERDA PASSAMOS?" data-tips="💡 &quot;DO YOU KNOW WHAT KIND OF SH** WE WENT THROUGH?&quot; usa linguagem coloquial e gíria. A palavra censurada &quot;SH**&quot; é uma forma informal de expressar frustração ou raiva. Em um contexto mais formal, poderia ser substituída por &quot;difficulties&quot; ou &quot;problems&quot;. - Do you know what kind of **difficulties** we went through? - Do you know what kind of **problems** we faced?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/54/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:25.5%;top:2.604166666666667%;width:51.24999999999999%;height:1.7760416666666667%" data-text="FUNNILY ENOUGH, WE ACQUIRED AN ESSENCE AFTER CLEARING THE FIRST TRIAL." onclick="showTextTooltip(event,this)" data-translation="ENGRAÇADO O SUFICIENTE, ADQUIRIMOS UMA ESSÊNCIA APÓS CONCLUIR O PRIMEIRO DESAFIO." data-tips="💡 &quot;FUNNILY ENOUGH&quot; traduzido como &quot;ENGRAÇADO O SUFICIENTE&quot; é uma expressão usada para indicar que algo é surpreendente ou irônico. **&quot;Funnily enough&quot;** é geralmente usado para introduzir uma informação inesperada. - **Funnily enough**, I met him at the airport. - **Funnily enough**, she didn't like chocolate."></div><div class="text-hotspot" style="left:28.875%;top:6.270833333333334%;width:41.625%;height:.19791666666666669%" data-text="O O O O O O" onclick="showTextTooltip(event,this)" data-translation="O O O O O O"></div><div class="text-hotspot" style="left:50.24999999999999%;top:8.947916666666666%;width:22%;height:.20833333333333334%" data-text="WHAT?" onclick="showTextTooltip(event,this)" data-translation="O QUÊ?"></div><div class="text-hotspot" style="left:46.375%;top:13.4375%;width:43.75%;height:.7083333333333333%" data-text="IT WAS THAT OF TIER-7 MONSTER MIMIC." onclick="showTextTooltip(event,this)" data-translation="ERA DE UM MONSTRO MIMIC DE NÍVEL 7."></div><div class="text-hotspot" style="left:42.5%;top:15.630208333333334%;width:17.125%;height:.13020833333333331%" data-text="I TOOK IT." onclick="showTextTooltip(event,this)" data-translation="EU PEGUEI."></div><div class="text-hotspot" style="left:53%;top:16.692708333333332%;width:14.249999999999998%;height:.28125%" data-text="AHEM" onclick="showTextTooltip(event,this)" data-translation="AHEM"></div><div class="text-hotspot" style="left:37.125%;top:17.84375%;width:32.5%;height:.7864583333333333%" data-text="FUME" onclick="showTextTooltip(event,this)" data-translation="FUME"></div><div class="text-hotspot" style="left:19.875%;top:20.484375%;width:49.625%;height:.9270833333333334%" data-text="WHAT THE HELL. ARE YOU FREAKING SERIOUS?!" onclick="showTextTooltip(event,this)" data-translation="QUE DIABOS. VOCÊ ESTÁ FALANDO SÉRIO?!" data-tips="💡 'What the hell' é uma expressão de surpresa ou incredulidade. É informal e pode ser substituída por 'What on earth' em contextos mais formais."></div><div class="text-hotspot" style="left:20.125%;top:26.677083333333336%;width:36.75%;height:.43750000000000006%" data-text="MIMIC IS A RARE TIER-7 MONSTER..." onclick="showTextTooltip(event,this)" data-translation="MIMIC É UM MONSTRO RARO DE NÍVEL 7..."></div><div class="text-hotspot" style="left:44.5%;top:27.8125%;width:40.625%;height:.96875%" data-text="THAT GUARANTEES A DECENT YIELD ONCE AN ESSENCE IS DROPPED." onclick="showTextTooltip(event,this)" data-translation="QUE GARANTE UM RENDIMENTO DECENTE QUANDO UMA ESSÊNCIA É SOLTA." data-tips="💡 &quot;ONCE&quot; é traduzido como &quot;QUANDO&quot; neste contexto. **&quot;Once&quot;** pode ser usado para indicar que algo acontecerá imediatamente após outra coisa. É similar a &quot;assim que&quot; em português. - **Once** you finish your homework, you can watch TV. - **Once** we arrive, we'll call you."></div><div class="text-hotspot" style="left:15.25%;top:35.260416666666664%;width:52.625%;height:1.2291666666666665%" data-text="WHILE IT ISN'T USEFUL FOR BATTLE, THE ACTIVE SKILL TREASURE VAULT GRANTS ACCESS TO PERSONAL SUB-SPACE STORAGE." onclick="showTextTooltip(event,this)" data-translation="ENQUANTO NÃO É ÚTIL PARA BATALHA, A HABILIDADE ATIVA COFRE DO TESOURO CONCEDE ACESSO A UM ARMAZENAMENTO SUB-ESPACIAL PESSOAL." data-tips="💡 &quot;WHILE&quot; é traduzido como &quot;ENQUANTO&quot;. **&quot;While&quot;** é usado para indicar que duas ações ocorrem simultaneamente ou para contrastar duas ideias. - **While** I was cooking, she was cleaning. - **While** it isn't easy, it's worth the effort."></div><div class="text-hotspot" style="left:49.25%;top:37.1875%;width:33.5%;height:.4479166666666667%" data-text="THE GREAT THING ABOUT THIS..." onclick="showTextTooltip(event,this)" data-translation="A GRANDE COISA SOBRE ISSO..."></div><div class="text-hotspot" style="left:24.5%;top:43.807291666666664%;width:53.25%;height:.953125%" data-text="...IS THAT IT HOLDS VARIOUS RANDOM ITEMS WHEN TREASURE VAULT IS FIRST ACCESSED." onclick="showTextTooltip(event,this)" data-translation="...É QUE ELE CONTÉM VÁRIOS ITENS ALEATÓRIOS QUANDO O COFRE DO TESOURO É ACESSADO PELA PRIMEIRA VEZ." data-tips="💡 &quot;WHEN&quot; é usado aqui para indicar o momento específico em que algo acontece. **&quot;When&quot;** pode ser usado para introduzir uma cláusula temporal. - **When** you arrive, please call me. - **When** the bell rings, class will start."></div><div class="text-hotspot" style="left:15.75%;top:48.890625%;width:25.75%;height:.9895833333333333%" data-text="ALRIGHT, WHAT DID YOU FIND INSIDE?" onclick="showTextTooltip(event,this)" data-translation="CERTO, O QUE VOCÊ ENCONTROU LÁ DENTRO?"></div><div class="text-hotspot" style="left:43.75%;top:50.953125%;width:41.25%;height:1.2239583333333333%" data-text="ABOUT TWO MILLION MANA STONES, THREE HIGHEST-TIER POTIONS..." onclick="showTextTooltip(event,this)" data-translation="CERCA DE DOIS MILHÕES DE PEDRAS DE MANA, TRÊS POÇÕES DE NÍVEL MAIS ALTO..."></div><div class="text-hotspot" style="left:20.125%;top:55.651041666666664%;width:59.62499999999999%;height:1.0625%" data-text="...AND TWO NUMBERED ITEMS, IN THE 80OOS AND 9000S." onclick="showTextTooltip(event,this)" data-translation="...E DOIS ITENS NUMERADOS, NOS 8000 E 9000."></div><div class="text-hotspot" style="left:53%;top:62.307291666666664%;width:35.25%;height:.5833333333333334%" data-text="WHAT THE F***?" onclick="showTextTooltip(event,this)" data-translation="QUE MERDA?"></div><div class="text-hotspot" style="left:42.625%;top:67.203125%;width:42.75%;height:.953125%" data-text="JEEZ, WHAT'S WITH YOU? THAT WAS UNCALLED FOR." onclick="showTextTooltip(event,this)" data-translation="JEEZ, O QUE HÁ COM VOCÊ? ISSO FOI DESNECESSÁRIO." data-tips="💡 &quot;UNCALLED FOR&quot; traduzido como &quot;DESNECESSÁRIO&quot; é uma expressão que significa que algo foi inadequado ou injustificado. É uma maneira de dizer que uma ação ou comentário não era necessário. - His comment was **uncalled for**. - That joke was **uncalled for**."></div><div class="text-hotspot" style="left:6%;top:68.19791666666667%;width:13.5%;height:.125%" data-text="000000" onclick="showTextTooltip(event,this)" data-translation="000000"></div><div class="text-hotspot" style="left:24.25%;top:68.31770833333334%;width:5.75%;height:.16666666666666669%" data-text="080" onclick="showTextTooltip(event,this)" data-translation="080"></div><div class="text-hotspot" style="left:33.125%;top:68.59375%;width:4.625%;height:.22395833333333334%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:35.75%;top:69.83854166666667%;width:2.375%;height:.53125%" data-text="000000" onclick="showTextTooltip(event,this)" data-translation="000000"></div><div class="text-hotspot" style="left:31.874999999999996%;top:70.46354166666666%;width:3.25%;height:.2760416666666667%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:28.875%;top:70.88541666666667%;width:2.375%;height:.229166
