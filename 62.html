a 'estes dias' em português."></div><div class="text-hotspot" style="left:45.75%;top:18.364583333333336%;width:35.75%;height:.515625%" data-text="...MOST OF THEM DIED." onclick="showTextTooltip(event,this)" data-translation="...A MAIORIA DELES MORREU."></div><div class="text-hotspot" style="left:68.625%;top:21.911458333333332%;width:20%;height:.5%" data-text="GLAD TO SEE YOU'RE DOING OKAY." onclick="showTextTooltip(event,this)" data-translation="FICO FELIZ EM VER QUE VOCÊ ESTÁ BEM." data-tips="💡 A expressão **&quot;glad to see&quot;** é usada para expressar satisfação ao encontrar ou perceber algo positivo.

- They moved away from the city last year.

URO. ACHEI MUITO MAIS CONVENIENTE GUARDÁ-LA LÁ." data-tips="💡 'Vault' pode ser traduzido como 'cofre', mas também pode significar uma sala segura ou depósito. **Vocabulário útil**: 'Convenient' é uma palavra útil que significa prático ou cômodo. Exemplo: 'It's more convenient to shop online.'"></div><div class="text-hotspot" style="left:60.12499999999999%;top:48.09375%;width:24.5%;height:.5364583333333334%" data-text="HAHA" onclick="showTextTooltip(event,this)" data-translation="HAHA"></div><div class="text-hotspot" style="left:5.25%;top:49.104166666666664%;width:29.75%;height:.47395833333333337%" data-text="WHOA, THAT DOES SOUND AMAZINGGG!" onclick="showTextTooltip(event,this)" data-translation="UOU, ISSO SOA INCRÍVEL!" data-tips="💡 'Whoa' é uma interjeição usada para expressar surpresa ou admiração, semelhante a 'uou' em português. **Gírias / linguagem coloquial**: Em um contexto mais formal, você poderia dizer 'That sounds amazing!' - 'Isso soa incrível!'"></div><div class="text-hotspot" style="left:49%;top:54.73958333333333%;width:39.625%;height:.9479166666666714%" data-text="OH, YOU'RE HERE. IS EVERYTHING ALRIGHT?" onclick="showTextTooltip(event,this)" data-translation="OH, VOCÊ ESTÁ AQUI. ESTÁ TUDO BEM?"></div><div class="text-hotspot" style="left:33.5%;top:59.64583333333333%;width:33.375%;height:.45312499999999994%" data-text="YEAH. LET'S HEAD INSIDE." onclick="showTextTooltip(event,this)" data-translation="SIM. VAMOS ENTRAR."></div><div class="text-hotspot" style="left:26.25%;top:62.255208333333336%;width:38.75%;height:1.2083333333333333%" data-text="TO BE FAIR, EACH OF THE THREE TRIPS WAS JUST AS TOUGH FOR ME TOO." onclick="showTextTooltip(event,this)" data-translation="PARA SER JUSTO, CADA UMA DAS TRÊS VIAGENS FOI TÃO DIFÍCIL PARA MIM TAMBÉM." data-tips="💡 'To be fair' é uma expressão usada para introduzir uma consideração ou justificativa. **Expressões idiomáticas**: Equivalente a 'para ser justo' ou 'para ser sincero'. Exemplo: 'To be fair, he did warn us.'"></div><div class="text-hotspot" style="left:53.5%;top:63.697916666666664%;width:27.500000000000004%;height:.703125%" data-text="AND THIS IS MY FOURTH ADVENTURE." onclick="showTextTooltip(event,this)" data-translation="E ESTA É MINHA QUARTA AVENTURA."></div><div class="text-hotspot" style="left:8.25%;top:67.265625%;width:61.375%;height:1.4791666666666667%" data-text="FLASH" onclick="showTextTooltip(event,this)" data-translation="FLASH"></div><div class="text-hotspot" style="left:70.625%;top:74.46354166666667%;width:23.25%;height:.46875%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:49.5%;top:75.80208333333334%;width:28.000000000000004%;height:.53125%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:28.749999999999996%;top:77.13541666666667%;width:43.75%;height:1.1614583333333333%" data-text="I WONDER WHAT KIND OF VILLAIN AWAITS ME THIS TIME." onclick="showTextTooltip(event,this)" data-translation="ME PERGUNTO QUE TIPO DE VILÃO ME AGUARDA DESTA VEZ." data-tips="💡 'I wonder' é uma construção comum para expressar curiosidade ou dúvida sobre algo. **Estruturas gramaticais**: Exemplo: 'I wonder if it will rain tomorrow.' - 'Me pergunto se vai chover amanhã.'"></div><div class="text-hotspot" style="left:17.5%;top:82.80208333333333%;width:47.25%;height:.6875000000000142%" data-text="...SOMETHING TRAGIC WILL DEFINITELY HAPPEN AGAIN." onclick="showTextTooltip(event,this)" data-translation="...ALGO TRÁGICO ACONTECERÁ NOVAMENTE, COM CERTEZA." data-tips="💡 'Will definitely happen' usa o futuro simples com 'definitely' para indicar certeza. **Tempos verbais**: O uso de 'will' aqui expressa uma previsão ou certeza sobre o futuro. Exemplo: 'It will definitely be a challenge.'"></div><div class="text-hotspot" style="left:37.125%;top:86.28645833333334%;width:32%;height:.6927083333333334%" data-text="SO I WILL NOT SHOW ANY COMPLACENCY." onclick="showTextTooltip(event,this)" data-translation="ENTÃO NÃO VOU MOSTRAR NENHUMA COMPLACÊNCIA." data-tips="💡 'SHOW ANY COMPLACENCY' usa 'show' no sentido de 'demonstrar'. Em português, pode ser 'mostrar complacência'."></div><div class="text-hotspot" style="left:8.625%;top:91.83333333333333%;width:71.875%;height:1.9375%" data-text="FLASH" onclick="showTextTooltip(event,this)" data-translation="FLASH"></div><div class="text-hotspot" style="left:18.75%;top:96.203125%;width:62.75%;height:1.3177083333333286%" data-text="I MUST STRENGTHEN MY RESOLVE!" onclick="showTextTooltip(event,this)" data-translation="DEVO FORTALECER MINHA DETERMINAÇÃO!" data-tips="💡 'STRENGTHEN MY RESOLVE' significa aumentar a determinação. 'Resolve' em inglês é frequentemente usado para indicar determinação ou firmeza de propósito."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/62/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:60%;top:2.703125%;width:39.25%;height:1.0208333333333333%" data-text="BLEEP" onclick="showTextTooltip(event,this)" data-translation="BLEEP"></div><div class="text-hotspot" style="left:23.125%;top:4.088541666666667%;width:75.25%;height:.17708333333333331%" data-text="TO HAVE ENTERED CRYSTAL CTIVE" onclick="showTextTooltip(event,this)" data-translation="PARA TER ENTRADO NA CAVERNA DE CRISTAL" data-warning="1"></div><div class="text-hotspot" style="left:26.375%;top:4.546875%;width:56.625%;height:.6458333333333334%" data-text="YOU HAVE ENTERED CRYSTAL CAVE ON FIRST FLOOR." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ENTROU NA CAVERNA DE CRISTAL NO PRIMEIRO ANDAR."></div><div class="text-hotspot" style="left:10.75%;top:8.958333333333334%;width:78.125%;height:1.3072916666666667%" data-text="TIP: YOU ARE CARRYING THE MAXIMUM NUMBER OF ESSENCES. HUNT NEW MONSTERS TO LEVEL UP!" onclick="showTextTooltip(event,this)" data-translation="DICA: VOCÊ ESTÁ CARREGANDO O NÚMERO MÁXIMO DE ESSÊNCIAS. CAÇE NOVOS MONSTROS PARA SUBIR DE NÍVEL!"></div><div class="text-hotspot" style="left:44.875%;top:12.651041666666666%;width:52%;height:1.40625%" data-text="BLEEP" onclick="showTextTooltip(event,this)" data-translation="BLEEP"></div><div class="text-hotspot" style="left:24.25%;top:14.604166666666666%;width:51.87500000000001%;height:1.0416666666666665%" data-text="YOU HAVE ENTERED ROCKY DESERT ON SECOND FLOOR." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ENTROU NO DESERTO ROCHOSO NO SEGUNDO ANDAR."></div><div class="text-hotspot" style="left:21.875%;top:20.119791666666668%;width:35.125%;height:.703125%" data-text="THANKS TO A DECENT STARTING POSITION," onclick="showTextTooltip(event,this)" data-translation="GRAÇAS A UMA BOA POSIÇÃO INICIAL," data-tips="💡 'Thanks to' é uma expressão que indica causa ou razão, similar a 'graças a' em português. **Conectores e transições**: Usado para atribuir um resultado positivo a uma causa. Exemplo: 'Thanks to your help, we finished early.'"></div><div class="text-hotspot" style="left:35.375%;top:21.390625%;width:49.875%;height:.71875%" data-text="WE REACHED THE ROCKY DESERT IN THE SPAN OF JUST NINE HOURS." onclick="showTextTooltip(event,this)" data-translation="CHEGAMOS AO DESERTO ROCHOSO EM APENAS NOVE HORAS." data-tips="💡 'In the span of' é uma expressão que indica um período de tempo específico. **Expressões idiomáticas**: Significa 'no espaço de' ou 'em um período de'. Exemplo: 'We completed the project in the span of two weeks.'"></div><div class="text-hotspot" style="left:10.25%;top:47.78645833333333%;width:52.125%;height:.96875%" data-text="EVEN THOUGH WE HUNTED EVERY SPECIES OF MONSTERS THERE FOR EXPERIENCE POINTS," onclick="showTextTooltip(event,this)" data-translation="MESMO QUE TENHAMOS CAÇADO TODAS AS ESPÉCIES DE MONSTROS LÁ PARA GANHAR PONTOS DE EXPERIÊNCIA," data-tips="💡 'Even though' é uma conjunção que significa 'apesar de'. **Conectores e transições**: Usada para introduzir uma ideia contrastante. Exemplo: 'Even though it was raining, we went for a walk.'"></div><div class="text-hotspot" style="left:41.125%;top:49.364583333333336%;width:35.75%;height:.9531250000000071%" data-text="WE WERE ABLE TO ADVANCE TO THE PORTAL IN FOUR DAYS." onclick="showTextTooltip(event,this)" data-translation="CONSEGUIMOS AVANÇAR ATÉ O PORTAL EM QUATRO DIAS."></div><div class="text-hotspot" style="left:9.25%;top:54.317708333333336%;width:35.625%;height:.8177083333333333%" data-text="BLEEP" onclick="showTextTooltip(event,this)" data-translation="BLEEP"></div><div class="text-hotspot" style="left:14.499999999999998%;top:55.833333333333336%;width:85.375%;height:2.4635416666666643%" data-text="YOU HAVE DEFEATED FALLEN GNOME. YOU HAVE GAINED 1 EXP POINTS. YOU HAVE DEFEATED KOBOLD DEFENDER. YOU HAVE GAINED 1 EXP POINTS. YOU HAVE DEFEATED STONE GOLEM. YOU HAVE GAINED 2 EXP POINTS. YOU HAVE DEFEATED GIANT STONE SOLDIE YOU HAVE GAINED 2 EXP POINTS. YOU HAVE DEFEATED SAN BLEEP" onclick="showTextTooltip(event,this)" data-translation="VOCÊ DERROTOU GNOMO CAÍDO. VOCÊ GANHOU 1 PONTO DE EXP. VOCÊ DERROTOU DEFENSOR KOBOLD. VOCÊ GANHOU 1 PONTO DE EXP. VOCÊ DERROTOU GOLEM DE PEDRA. VOCÊ GANHOU 2 PONTOS DE EXP. VOCÊ DERROTOU SOLDADO DE PEDRA GIGANTE. VOCÊ GANHOU 2 PONTOS DE EXP. VOCÊ DERROTOU SAN BLEEP"></div><div class="text-hotspot" style="left:21.75%;top:61.03125%;width:55.625%;height:.7395833333333334%" data-text="YOU HAVE ENTERED PILGRIM'S PATH ON THIRD FLOOR." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ENTROU NO CAMINHO DO PEREGRINO NO TERCEIRO ANDAR."></div><div class="text-hotspot" style="left:19.375%;top:64.09375%;width:24.25%;height:.4270833333333333%" data-text="ON THE EIGHTH DAY," onclick="showTextTooltip(event,this)" data-translation="NO OITAVO DIA,"></div><div class="text-hotspot" style="left:30.625000000000004%;top:65.04166666666666%;width:53.25%;height:.9375000000000142%" data-text="WE TRAVERSED THE WITCH'S FOREST WITHOUT A PROBLEM TO REACH THE PORTAL." onclick="showTextTooltip(event,this)" data-translation="TRAVESSAMOS A FLORESTA DA BRUXA SEM PROBLEMAS PARA CHEGAR AO PORTAL."></div><div class="text-hotspot" style="left:19%;top:70.91666666666666%;width:62.25%;height:.7447916666666714%" data-text="YOU HAVE ENTERED TOWER OF HEAVENS ON FOURTH FLOOR." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ENTROU NA TORRE DOS CÉUS NO QUARTO ANDAR."></div><div class="text-hotspot" style="left:11.875%;top:74.08333333333333%;width:4.75%;height:.11979166666666666%" data-text="화" onclick="showTextTooltip(event,this)" data-translation="화"></div><div class="text-hotspot" style="left:72.375%;top:75.02083333333334%;width:3.5000000000000004%;height:.10416666666666667%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:38.625%;top:75.73958333333334%;width:1.625%;height:.0625%" data-text="N" onclick="showTextTooltip(event,this)" data-translation="N"></div><div class="text-hotspot" style="left:35.375%;top:75.9375%;width:3.875%;height:.1927083333333286%" data-text="W W" onclick="showTextTooltip(event,this)" data-translation="W W"></div><div class="text-hotspot" style="left:71%;top:77.61458333333333%;width:1.875%;height:.078125%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:50.625%;top:82.54166666666667%;width:36.375%;height:.6927083333333286%" data-text="ALL THIRD FLOOR MONSTERS SHOW UP ON THIS LEVEL," onclick="showTextTooltip(event,this)" data-translation="TODOS OS MONSTROS DO TERCEIRO ANDAR APARECEM NESTE NÍVEL,"></div><div class="text-hotspot" style="left:20%;top:83.94791666666667%;width:48.5%;height:.9635416666666667%" data-text="INCLUDING TIER-6 AND EVEN UNIQUE MONSTERS THAT CAN'T BE FOUND ANYWHERE ELSE." onclick="showTextTooltip(event,this)" data-translation="INCLUINDO MONSTROS DE NÍVEL 6 E ATÉ MONSTROS ÚNICOS QUE NÃO PODEM SER ENCONTRADOS EM OUTRO LUGAR."></d ONAL COLLAPSE" onclick="showTextTooltip(event,this)" data-translation="COLAPSO DIMENSIONAL"></div><div class="text-hotspot" style="left:22.375%;top:42.02604166666667%;width:55.375%;height:1.2083333333333333%" data-text="THE REAL CATASTROPHE WITHIN THE LABYRINTH, THAT IS MORE DISASTROUS THAN THE LORD OF THE FLOOR BY FAR." onclick="showTextTooltip(event,this)" data-translation="A VERDADEIRA CATÁSTROFE DENTRO DO LABIRINTO, QUE É MUITO MAIS DESASTROSA DO QUE O SENHOR DO ANDAR."></div><div class="text-hotspot" style="left:17.125%;top:44.859375%;width:68%;height:.9375%" data-text="THE LIKELIHOOD OF TRIGGERING THIS PHENOMENON IN THE GAME WAS LIKE ONE IN EVERY HUNDRED PLAYTHROUGHS." onclick="showTextTooltip(event,this)" data-translation="A PROBABILIDADE DE DESENCADEAR ESSE FENÔMENO NO JOGO ERA DE UMA EM CADA CEM JOGADAS." data-tips="💡 &quot;ONE IN EVERY HUNDRED PLAYTHROUGHS&quot; é uma forma de expressar probabilidade ou frequência, similar a &quot;um em cada cem&quot;. - **Exemplo**: &quot;The chance of winning is one in every thousand tickets.&quot; (A chance de ganhar é uma em cada mil bilhetes.)"></div><div class="text-hotspot" style="left:23.125%;top:51.01041666666667%;width:44.5%;height:.6875%" data-text="NO WONDER THINGS SEEMED TO BE SMOOTH-SAILING." onclick="showTextTooltip(event,this)" data-translation="NÃO É DE ADMIRAR QUE AS COISAS PARECESSEM ESTAR INDO BEM." data-tips="💡 A expressão &quot;NO WONDER&quot; é usada para indicar que algo não é surpreendente, similar a &quot;não é de admirar&quot;. - **Exemplo**: &quot;No wonder he looks tired; he worked all night.&quot; (Não é de admirar que ele pareça cansado; ele trabalhou a noite toda.)"></div><div class="text-hotspot" style="left:26.125%;top:57.4375%;width:44.75%;height:.6979166666666643%" data-text="IT WAS WAITING TO SMACK ME IN THE FACE WITH THIS." onclick="showTextTooltip(event,this)" data-translation="ESTAVA ESPERANDO PARA ME DAR UMA SURRA COM ISSO."></div><div class="text-hotspot" style="left:10.125%;top:62.55729166666667%;width:50.125%;height:1.484375%" data-text="I KNOW HOW PREPOSTEROUS IT SOUNDS. MAYBE SHRUGGING IT OFF IS THE RIGHT THING TO DO." onclick="showTextTooltip(event,this)" data-translation="EU SEI COMO ISSO SOA ABSURDO. TALVEZ IGNORAR SEJA A COISA CERTA A FAZER." data-tips="💡 &quot;SHRUGGING IT OFF&quot; é um phrasal verb que significa ignorar ou não se preocupar com algo. - **Exemplo**: &quot;He shrugged off the criticism and continued with his work.&quot; (Ele ignorou a crítica e continuou com seu trabalho.)"></div><div class="text-hotspot" style="left:58.5%;top:64.27604166666666%;width:34%;height:1.1979166666666667%" data-text="DOES THAT INFORMATION COME FROM A CREDIBLE SOURCE?" onclick="showTextTooltip(event,this)" data-translation="ESSA INFORMAÇÃO VEM DE UMA FONTE CONFIÁVEL?" data-tips="💡 A palavra &quot;CREDIBLE&quot; significa confiável ou digno de confiança, e é um falso cognato, pois pode ser confundida com &quot;crível&quot; em português, mas seu uso é mais específico para a confiabilidade de uma fonte. - **Exemplo**: &quot;We need a credible source for this information.&quot; (Precisamos de uma fonte confiável para essa informação.)"></div><div class="text-hotspot" style="left:11%;top:69.078125%;width:48.375%;height:.9583333333333333%" data-text="...SHERNAL FERGANG, A MAGE OF TARUPAIN SCHOOL." onclick="showTextTooltip(event,this)" data-translation="...SHERNAL FERGANG, UM MAGO DA ESCOLA TARUPAIN."></div><div class="text-hotspot" style="left:27.375%;top:70.39583333333333%;width:46.875%;height:1.4791666666666714%" data-text="HE REPORTEDLY HAS RESEARCHED DIMENSIONAL COLLAPSE FOR A LONG TIME." onclick="showTextTooltip(event,this)" data-translation="ELE RELATADAMENTE PESQUISOU O COLAPSO DIMENSIONAL POR MUITO TEMPO." data-tips="💡 'Reportedly' significa 'supostamente' ou 'de acordo com relatos', indicando que algo foi dito ou registrado por outras pessoas."></div><div class="text-hotspot" style="left:23.375%;top:76.02604166666667%;width:45%;height:.958 ING LABYRINTH..." onclick="showTextTooltip(event,this)" data-translation="ESTE PRÓXIMO LABIRINTO..."></div><div class="text-hotspot" style="left:13.625000000000002%;top:41.588541666666664%;width:21.875%;height:.15625%" data-text="IT'S STRANGE" onclick="showTextTooltip(event,this)" data-translation="É ESTRANHO"></div><div class="text-hotspot" style="left:28.749999999999996%;top:41.973958333333336%;width:45.875%;height:1.4739583333333335%" data-text="FOR A RUMOR TO SPREAD THIS FAST AND WIDELY, THERE HAS TO BE A BASIS OR SOURCE REGARDLESS OF HOW FARFETCHED IT IS." onclick="showTextTooltip(event,this)" data-translation="PARA UM RUMOR SE ESPALHAR TÃO RÁPIDO E AMPLAMENTE, TEM QUE HAVER UMA BASE OU FONTE, INDEPENDENTEMENTE DE QUÃO IMPROVÁVEL SEJA." data-tips="💡 &quot;THERE HAS TO BE&quot; é uma estrutura que expressa necessidade ou obrigação, similar a &quot;tem que haver&quot;. - **Exemplo**: &quot;There has to be a reason for his behavior.&quot; (Tem que haver uma razão para o comportamento dele.)"></div><div class="text-hotspot" style="left:30.625000000000004%;top:49.21875%;width:55.00000000000001%;height:.6875%" data-text="UNLESS SOMEBODY IS SPREADING IT FOR THE HELL OF IT." onclick="showTextTooltip(event,this)" data-translation="A MENOS QUE ALGUÉM ESTEJA ESPALHANDO ISSO POR DIVERSÃO." data-tips="💡 'For the hell of it' é uma expressão informal que significa fazer algo apenas por diversão, sem um motivo sério."></div><div class="text-hotspot" style="left:20.25%;top:54.453125%;width:27.25%;height:.4270833333333428%" data-text="...IT'S FRUSTRATING." onclick="showTextTooltip(event,this)" data-translation="...É FRUSTRANTE."></div><div class="text-hotspot" style="left:39.5%;top:55.76041666666667%;width:11.375%;height:.4270833333333333%" data-text="#" onclick="showTextTooltip(event,this)" data-translation="#"></div><div class="text-hotspot" style="left:90%;top:55.765625%;width:8.5%;height:.23958333333333331%" data-text="#" onclick="showTextTooltip(event,this)" data-translatio
