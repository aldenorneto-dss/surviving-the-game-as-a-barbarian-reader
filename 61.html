- **Exemplo**: He phrased his question very politely.
- **Exemplo**: Can you phrase it differently?"></div><div class="text-hotspot" style="left:57.125%;top:52.828125%;width:25.25%;height:.6927083333333334%" data-text="SPEAK IN SIMPLE TERMS." onclick="showTextTooltip(event,this)" data-translation="FALE DE FORMA SIMPLES."></div><div class="text-hotspot" style="left:16.5%;top:58.026041666666664%;width:67.375%;height:1.2083333333333333%" data-text="SHAVIN WANTED TO PERSONALLY EXPRESS HER GRATITUDE BECAUSE HER REPUTATION GREW AT WORK." onclick="showTextTooltip(event,this)" data-translation="SHAVIN QUERIA EXPRESSAR PESSOALMENTE SUA GRATIDÃO PORQUE SUA REPUTAÇÃO CRESCEU NO TRABALHO."></div><div class="text-hotspot" style="left:16.625%;top:62.197916666666664%;width:67.375%;height:1.4895833333333335%" data-text="BUT INSTEAD OF DOING IT HERSELF, SHE MENTIONED THE FAVOR SHE HAD DONE ME IN THE PAST AND ASKED ME TO DO IT IN HER PLACE." onclick="showTextTooltip(event,this)" data-translation="MAS EM VEZ DE FAZER ISSO ELA MESMA, ELA MENCIONOU O FAVOR QUE ME FEZ NO PASSADO E PEDIU QUE EU FIZESSE ISSO EM SEU LUGAR." data-tips="💡 &quot;Instead of&quot; é uma expressão usada para indicar uma escolha alternativa ou substituição. É frequentemente usada para contrastar duas ações ou opções.
- **Exemplo**: Instead of going out, we stayed home.
- **Exemplo**: She chose tea instead of coffee."></div><div class="text-hotspot" style="left:21.75%;top:66.54166666666667%;width:58.25%;height:1.1822916666666667%" data-text="SO BASICALLY, I AM NOT GIVING THIS TO YOU, BUT SHAVIN IS." onclick="showTextTooltip(event,this)" data-translation="ENTÃO, BASICAMENTE, NÃO SOU EU QUE ESTOU TE DANDO ISSO, MAS A SHAVIN."></div><div class="text-hotspot" style="left:9%;top:73.63541666666666%;width:37.375%;height:.421875%" data-text="DO YOU UNDERSTAND?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ENTENDEU?"></div><div class="text-hotspot" style="left:65.375%;top:75.56770833333334%;width:19.75%;height:.17708333333333331%" data-text="... I DO." onclick="showTextTooltip(event,this)" data-translation="... ENTENDI."></div><div class="text-hotspot" style="left:36.125%;top:76.58854166666667%;width:31.874999999999996%;height:.9583333333333333%" data-text="LONG STORY SHORT, YOU'RE GONNA GIVE ME SOMETHING." onclick="showTextTooltip(event,this)" data-translation="RESUMINDO, VOCÊ VAI ME DAR ALGO." data-tips="💡 &quot;Long story short&quot; é uma expressão idiomática usada para resumir uma história ou explicação longa em poucas palavras. É equivalente a &quot;resumindo&quot; em português.

op:97.03645833333333%;width:27.625%;height:.4739583333333428%" data-text="WORLD OF EVIL SPIRITS." onclick="showTextTooltip(event,this)" data-translation="MUNDO DOS ESPÍRITOS MALIGNOS."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/61/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:19%;top:3.0833333333333335%;width:31.624999999999996%;height:.953125%" data-text="A MASTERPIECE THAT DUG DEEP ABOUT THEIR WORLD." onclick="showTextTooltip(event,this)" data-translation="UMA OBRA-PRIMA QUE EXPLOROU PROFUNDAMENTE O MUNDO DELES."></div><div class="text-hotspot" style="left:27.250000000000004%;top:4.447916666666667%;width:60.25%;height:1.2239583333333333%" data-text="IT CONTAINS THE WILL OF AN AGENT OF THE MINISTRY OF SECURITY THAT HAD RETURNED HALF-DEAD AFTER ENTERING THEIR SPIRITUAL REALM." onclick="showTextTooltip(event,this)" data-translation="CONTÉM A VONTADE DE UM AGENTE DO MINISTÉRIO DA SEGURANÇA QUE RETORNOU SEMI-MORTO APÓS ENTRAR NO REINO ESPIRITUAL DELES."></div><div class="text-hotspot" style="left:12%;top:6.536458333333334%;width:15.375%;height:.359375%" data-text="OH?" onclick="showTextTooltip(event,this)" data-translation="OH?"></div><div class="text-hotspot" style="left:22.875%;top:7.192708333333334%;width:48.5%;height:1.46875%" data-text="WITH THIS TIGHT SECURITY, I SHOULDN'T HAVE TO WORRY ABOUT BEING EXPOSED EVEN AFTER TAKING THE PILL." onclick="showTextTooltip(event,this)" data-translation="COM ESSA SEGURANÇA APERTADA, EU NÃO DEVERIA ME PREOCUPAR EM SER EXPOSTO MESMO APÓS TOMAR A PÍLULA." data-tips="💡 &quot;Shouldn't have to&quot; é usado para indicar que não há necessidade de fazer algo ou que não se espera que algo seja necessário. É uma forma de expressar expectativa ou obrigação.

ts nearby? - She knew of his reputation before they met."></div><div class="text-hotspot" style="left:10%;top:57.947916666666664%;width:50.375%;height:.703125%" data-text="NO. I JUST BROKE IT BECAUSE I WAS BORED." onclick="showTextTooltip(event,this)" data-translation="NÃO. EU SÓ QUEBREI PORQUE ESTAVA ENTEDIADO." data-tips="💡 &quot;I was bored&quot; é uma expressão comum para indicar que alguém estava entediado. A palavra **bored** é o adjetivo que descreve a sensação de tédio. - He often goes for a walk when he's bored. - They watched a movie because they were bored."></div><div class="text-hotspot" style="left:51.24999999999999%;top:60.526041666666664%;width:32.25%;height:1.2135416666666665%" data-text="...ARE YOU SURE YOU DIDN'T READ IT FROM A BOOK?" onclick="showTextTooltip(event,this)" data-translation="...TEM CERTEZA DE QUE NÃO LEU ISSO EM UM LIVRO?"></div><div class="text-hotspot" style="left:39.75%;top:64.86979166666667%;width:35.375%;height:.421875%" data-text="...A BOOK? WHAT BOOK?" onclick="showTextTooltip(event,this)" data-translation="...UM LIVRO? QUE LIVRO?"></div><div class="text-hotspot" style="left:59.5%;top:67.47916666666667%;width:31.624999999999996%;height:.6875%" data-text="SWEAT" onclick="showTextTooltip(event,this)" data-translation="SUOR"></div><div class="text-hotspot" style="left:46.375%;top:70.10416666666667%;width:30.875%;height:.9322916666666572%" data-text="THE COMPLETE BOOK OF RIFTS." onclick="showTextTooltip(event,this)" data-translation="O LIVRO COMPLETO DOS RIFTS."></div><div class="text-hotspot" style="left:36.375%;top:74.72395833333333%;width:2.5%;height:.10937500000000001%" data-text="U" onclick="showTextTooltip(event,this)" data-translation="U"></div><div class="text-hotspot" style="left:38.875%;top:74.97916666666666%;width:22.75%;height:.6041666666666714%" data-text="THE WHAT?!" onclick="showTextTooltip(event,this)" data-translation="O QUÊ?!"></div><div class="text-hotspot" style="left:40%;top:79.64583333333334%;width:50.625%;height:1.46875%" data-text="HOLD ON. YOU USED IT WITHOUT KNOWING WHAT IT DOES? THAT'S EVEN MORE UNNATURAL!" onclick="showTextTooltip(event,this)" data-translation="ESPERA. VOCÊ USOU SEM SABER O QUE FAZIA? ISSO É AINDA MAIS ESTRANHO!" data-tips="💡 &quot;Hold on&quot; é uma expressão usada para pedir que alguém espere ou para interromper alguém. É uma maneira casual de dizer &quot;espere um pouco&quot;. - Hold on, I need to check something. - Can you hold on for a second?"></div><div class="text-hotspot" style="left:11.375%;top:82.18229166666666%;width:54.75%;height:1.46875%" data-text="I TOOK A GUESS. I SAW THE MARK OF THE GODDESS AND ASSUMED IT HAD TO DO WITH THE TEMPLE." onclick="showTextTooltip(event,this)" data-translation="EU SUPUS. EU VI A MARCA DA DEUSA E PRESUMI QUE TINHA A VER COM O TEMPLO." data-tips="💡 &quot;Took a guess&quot; significa que a pessoa fez uma suposição ou tentou adivinhar algo. Essa expressão é usada quando alguém não tem certeza, mas tenta adivinhar baseado em poucas informações. - I took a guess and chose the blue door. - She took a guess about the answer to the question."></div><div class="text-hotspot" style="left:62.74999999999999%;top:87.86458333333333%;width:28.999999999999996%;height:.16666666666666669%" data-text="...REALLY?" onclick="showTextTooltip(event,this)" data-translation="...SÉRIO?"></div><div class="text-hotspot" style="left:13.25%;top:91.16666666666666%;width:37.75%;height:.9479166666666667%" data-text="REALLY. I SWEAR ON MY HONOR AS A WARRIOR." onclick="showTextTooltip(event,this)" data-translation="SÉRIO. EU JURO PELA MINHA HONRA COMO GUERREIRO." data-tips="💡 &quot;I swear on my honor&quot; é uma expressão que indica que a pessoa está falando a verdade e está colocando sua honra como garantia. É uma forma enfática de jurar que algo é verdade. - I swear on my life that I didn't do it. - He swore on his family's name that he was innocent."></div><div class="text-hotspot" style="left:8.875%;top:95.74479166666666%;width:57.25%;height:2.114583333333343%" data-text="SIGH AND HERE I THOUGHT I WAS FINALLY GOING TO GET AN UNDAMAGED COPY OF THAT BOOK." onclick="showTextTooltip(event,this)" data-translation="SUSPIRO E EU PENSEI QUE FINALMENTE IA CONSEGUIR UMA CÓPIA INTACTA DESSE LIVRO."></div><div class="text-hotspot" style="left:1.375%;top:98.20833333333333%;width:6.375%;height:.125%" data-text="FW-F" onclick="showTextTooltip(event,this)" data-translation="FW-F"></div><div class="text-hotspot" style="left:10.25%;top:99.10416666666667%;width:2.875%;height:.078125%" data-text="HI" onclick="showTextTooltip(event,this)" data-translation="OI"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/61/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:12.25%;top:4.286458333333333%;width:45.375%;height:.765625%" data-text="IT'S IN THE LIBRARY, BUT I GUESS I CAN'T TELL HER." onclick="showTextTooltip(event,this)" data-translation="ESTÁ NA BIBLIOTECA, MAS ACHO QUE NÃO POSSO DIZER A ELA." data-tips="💡 &quot;I guess&quot; é uma expressão usada para indicar que alguém está supondo ou estimando algo. É uma maneira de dizer que você não tem certeza absoluta, mas acha que algo é verdade. - I guess it's going to rain later. - She guessed he was around 30 years old."></div><div class="text-hotspot" style="left:69.75%;top:4.708333333333333%;width:9.875%;height:.3020833333333333%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:44.375%;top:5.192708333333333%;width:26.375%;height:.515625%" data-text="Secret" onclick="showTextTooltip(event,this)" data-translation="Segredo"></div><div class="text-hotspot" style="left:18.75%;top:10.234375%;width:27.500000000000004%;height:.4427083333333333%" data-text="ABOUT MY FAVOR--" onclick="showTextTooltip(event,this)" data-translation="SOBRE O MEU FAVOR--"></div><div class="text-hotspot" style="left:34%;top:11.822916666 -text="OH. I WAS IN THE LIBRARY." onclick="showTextTooltip(event,this)" data-translation="OH. EU ESTAVA NA BIBLIOTECA."></div><div class="text-hotspot" style="left:41.25%;top:57.15625%;width:51.125%;height:1.21875%" data-text="YOU WERE THERE FOR THE ENTIRE NIGHTTTT? THEN THE BUSINESS YOU HAD WASSSS..." onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTEVE LÁ A NOITE TODA? ENTÃO O ASSUNTO QUE VOCÊ TINHA ERA..." data-tips="💡 &quot;You were there for the entire night&quot; usa a palavra **entire** para enfatizar que algo aconteceu durante toda a noite. **Entire** é sinônimo de &quot;todo&quot; ou &quot;completo&quot;. - She stayed at the party for the entire evening. - He read the book in its entirety."></div><div class="text-hotspot" style="left:37%;top:58.93229166666667%;width:31.75%;height:.796875%" data-text="FLINCH" onclick="showTextTooltip(event,this)" data-translation="FLINCHAR"></div><div class="text-hotspot" style="left:53.5%;top:63.880208333333336%;width:14.125%;height:.3020833333333357%" data-text="ARE YOU NUTS?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ESTÁ LOUCO?"></div><div class="text-hotspot" style="left:16%;top:64.30729166666667%;width:43.75%;height:.953125%" data-text="I WAS ONLY READING BOOKS BECAUSE RAGNA LET ME." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA APENAS LENDO LIVROS PORQUE RAGNA ME DEIXOU." data-tips="💡 &quot;Because&quot; é uma conjunção que indica causa ou motivo. É usada para explicar por que algo aconteceu. - I went to bed early because I was tired. - She didn't go to the party because she was sick."></div><div class="text-hotspot" style="left:49.875%;top:68.75520833333333%;width:17.75%;height:.6875%" data-text="CAN I TRUST YOU?" onclick="showTextTooltip(event,this)" data-translation="POSSO CONFIAR EM VOCÊ?"></div><div class="text-hotspot" style="left:16.25%;top:73.41145833333333%;width:35.125%;height:.6979166666666666%" data-text="WHY WOULD I LIE TO YOU ABOUT THIS?" onclick="sho tips="💡 **&quot;I did not bring it to your attention&quot;** é uma forma educada de dizer que não se mencionou algo para alguém.

- **Exemplo:** She brought the mistake to the manager's attention."></div><div class="text-hotspot" style="left:25%;top:31.666666666666664%;width:51.74999999999999%;height:1.46875%" data-text="YOU DID WELL. I DON'T HAVE TIME TO WASTE ON SUCH SMALL MATTERS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ FEZ BEM. NÃO TENHO TEMPO A PERDER COM QUESTÕES TÃO PEQUENAS." data-tips="💡 &quot;I don't have time to waste&quot; é uma expressão comum para indicar que alguém está muito ocupado para lidar com questões triviais."></div><div class="text-hotspot" style="left:26.625%;top:39.166666666666664%;width:28.125%;height:.4427083333333333%" data-text="S-SMALL MATTERS?" onclick="showTextTooltip(event,this)" data-translation="Q-QUESTÕES PEQUENAS?"></div><div class="text-hotspot" style="left:18.625%;top:43.33854166666667%;width:41%;height:1.4791666666666643%" data-text="ANYWAYS, CAN YOU LIFT THE BAN SO HE COULD ENTER THE LABYRINTH AGAIN?" onclick="showTextTooltip(event,this)" data-translation="DE QUALQUER FORMA, VOCÊ PODE REVOGAR O BANIMENTO PARA QUE ELE POSSA ENTRAR NO LABIRINTO NOVAMENTE?" data-tips="💡 **&quot;Anyways&quot;** é uma forma informal de dizer &quot;de qualquer forma&quot;. É usada para mudar de assunto ou retornar ao ponto principal. 
- **Exemplo:** Anyways, let's get back to work. 
- **Exemplo:** Anyways, I was saying that we should leave early."></div><div class="text-hotspot" style="left:7.000000000000001%;top:45.885416666666664%;width:30.25%;height:.6822916666666666%" data-text="HOLD" onclick="showTextTooltip(event,this)" data-translation="SEGURAR"></div><div class="text-hotspot" style="left:81.875%;top:50.067708333333336%;width:13.5%;height:.625%" data-text="?!" onclick="showTextTooltip(event,this)" data-translation="?!"></div><div class="text-hotspot" style="left:17%;top:52.81249999999999%;width:29.25%;height:.6770833333333334%" data-text="AND WHY MUST I DO THAT?" onclick="showTextTooltip(event,this)" data-translation="E POR QUE EU DEVERIA FAZER ISSO?" data-tips="💡 **&quot;Must&quot;** é usado para expressar obrigação ou necessidade. Aqui, é usado para perguntar por que a obrigação existe.

 MILORD." onclick="showTextTooltip(event,this)" data-translation="ISSO ESTÁ CORRETO, MILORD."></div><div class="text-hotspot" style="left:67.625%;top:76.40625%;width:9.125%;height:.171875%" data-text="...?" onclick="showTextTooltip(event,this)" data-translation="...?"></div><div class="text-hotspot" style="left:5.75%;top:80.484375%;width:57.99999999999999%;height:2.0416666666666665%" data-text="HAHA I CAN'T BELIEVE I RAN INTO THE ADVENTURER THE COUNT HAS BEEN LOOKING FOR!" onclick="showTextTooltip(event,this)" data-translation="HAHA NÃO POSSO ACREDITAR QUE ENCONTREI O AVENTUREIRO QUE O CONDE ESTÁ PROCURANDO!"></div><div class="text-hotspot" style="left:54.25%;top:82.88020833333334%;width:42.625%;height:.49479166666666663%" data-text="I SHALL REWARD YOU WITH 200,000 STONES FOR YOUR EFFORTS!" onclick="showTextTooltip(event,this)" data-translation="EU VOU TE RECOMPENSAR COM 200.000 PEDRAS PELOS SEUS ESFORÇOS!" data-tips="💡 **&quot;Shall&quot;** é uma forma mais formal de expressar intenção futura, similar a &quot;will&quot;. 
- **Exemplo:** I shall return by noon.

this)" data-translation="LEGAL!"></div><div class="text-hotspot" style="left:69%;top:7.28125%;width:5.125%;height:.10416666666666667%" data-text="OH!" onclick="showTextTooltip(event,this)" data-translation="OH!"></div><div class="text-hotspot" style="left:33.625%;top:16.885416666666668%;width:30.75%;height:1.078125%" data-text="... WHAT DOES THIS REQUEST ENTAIL?" onclick="showTextTooltip(event,this)" data-translation="... O QUE ESSE PEDIDO ENVOLVE?" data-tips="💡 &quot;Entail&quot; significa envolver ou exigir, usado para perguntar sobre detalhes ou requisitos de uma situação."></div><div class="text-hotspot" style="left:32.875%;top:21.682291666666668%;width:54.25%;height:1.4895833333333335%" data-text="THE COUNT I AM ESPECIALLY ON GOOD TERMS WITH WILL BE HOLDING A HUGE FEAST IN TWO MONTHS." onclick="showTextTooltip(event,this)" data-translation="O CONDE COM QUEM TENHO UMA BOA RELAÇÃO ESTARÁ REALIZANDO UM GRANDE BANQUETE EM DOIS MESES." data-tips="💡 **&quot;On good terms with&quot;** significa ter um bom relacionamento com alguém. 
- **Exemplo:** She is on good terms with her neighbors. 
- **Exemplo:** They are on good terms with their boss."></div><div class="text-hotspot" style="left:15.5%;top:23.734375%;width:41.875%;height:.6927083333333334%" data-text="I WANT YOU TO COME WITH ME TO THE FEAST." onclick="showTextTooltip(event,this)" data-translation="QUERO QUE VOCÊ VENHA COMIGO AO BANQUETE."></div><div class="text-hotspot" style="left:50.125%;top:29.119791666666668%;width:27.375%;height:.43750000000000006%" data-text="...IS THAT IT?" onclick="showTextTooltip(event,this)" data-translation="...É SÓ ISSO?"></div><div class="text-hotspot" style="left:7.249999999999999%;top:30.161458333333336%;width:20%;height:.484375%" data-text="OH!" onclick="showTextTooltip(event,this)" data-translation="OH!"></div><div class="text-hotspot" style="left:10.75%;top:30.942708333333336%;width:59.25%;height:1.21875%" data-text="DO YOU HAVE ANY TRICKS YOU COULD DEMONSTRATE TO ENTERTAIN THE HOST AND GUESTS?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ TEM ALGUM TRUQUE QUE PODERIA DEMONSTRAR PARA ENTRETENIMENTO DO ANFITRIÃO E DOS CONVIDADOS?" data-tips="💡 &quot;Entertain&quot; significa entreter, e é usado para falar sobre atividades que mantêm as pessoas interessadas ou divertidas."></div><div class="text-hotspot" style="left:2.375%;top:35.161458333333336%;width:87.5%;height:2.937499999999993%" data-text="LIKE, BENDING STEEL BARS WITH BARE HANDS OR SOMETHING. THAT SHOULD SUFFICE. RAWR" onclick="showTextTooltip(event,this)" data-translation="COMO, DOBRAR BARRAS DE AÇO COM AS MÃOS NUAS OU ALGO ASSIM. ISSO DEVERIA SER SUFICIENTE. RAWR"></div><div class="text-hotspot" style="left:2.125%;top:41.234375%;width:37%;height:.6354166666666666%" data-text="WHOA" onclick="showTextTooltip(event,this)" data-translation="UOU"></div><div class="text-hotspot" style="left:62.625%;top:41.864583333333336%;width:23.125%;height:.4166666666666667%" data-text="WOW" onclick="showTextTooltip(event,this)" data-translation="UOU"></div><div class="text-hotspot" style="left:31.87499999 - **Exemplo:** That punk thinks he can do whatever he wants."></div><div class="text-hotspot" style="left:30.25%;top:50.05729166666667%;width:45.875%;height:1.218749999999993%" data-text="YOU WILL BE PAID 1 MILLION STONES FOR IT. WHAT DO YOU SAY?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ SERÁ PAGO 1 MILHÃO DE PEDRAS POR ISSO. O QUE ME DIZ?" data-tips="💡 **&quot;What do you say?&quot;** é uma maneira informal de pedir a opinião ou decisão de alguém.

- **Estrutura gramatical**: A construção &quot;too [adjetivo] for [alguém] to [verbo]&quot; é usada para indicar que algo é tão intenso que impede uma ação. 
- Exemplos: 
  - The offer was **too good for me to refuse**.
