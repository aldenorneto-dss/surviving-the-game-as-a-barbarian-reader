<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>32</title></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/32/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:32.625%;top:5.614583333333333%;width:37%;height:.692708333333333%" data-text="IT'S BEEN A WHOLE WEEK SINCE I WAS INCARCERATED." onclick="showTextTooltip(event,this)" data-translation="JÁ FAZ UMA SEMANA INTEIRA DESDE QUE FUI ENCARCERADO." data-tips="💡 'It's been' é uma estrutura usada para falar sobre quanto tempo passou desde um evento. Exemplo: 'It's been a long time since we last met.'"></div><div class="text-hotspot" style="left:29.625%;top:15.640625%;width:40.5%;height:.703125%" data-text="MY ALLEGED CRIME WAS ACT OF PLUNDERING." onclick="showTextTooltip(event,this)" data-translation="MEU CRIME ALEGADO FOI ATO DE SAQUE." data-tips="💡 'Alleged' é um falso cognato. Em inglês, significa 'suposto', não 'alegre'."></div><div class="text-hotspot" style="left:32.375%;top:21.21875%;width:34.75%;height:.4583333333333333%" data-text="DURING THE FIRST INTERROGATION." onclick="showTextTooltip(event,this)" data-translation="DURANTE O PRIMEIRO INTERROGATÓRIO."></div><div class="text-hotspot" style="left:12.125%;top:23.411458333333332%;width:37.5%;height:.6875%" data-text="WHERE DID YOU GET THIS CROSSBOW?" onclick="showTextTooltip(event,this)" data-translation="ONDE VOCÊ CONSEGUIU ESTA BESTA?"></div><div class="text-hotspot" style="left:21.125%;top:24.666666666666668%;width:51.5%;height:.6979166666666666%" data-text="BARBARIANS DON'T USE RANGED WEAPONS." onclick="showTextTooltip(event,this)" data-translation="BÁRBAROS NÃO USAM ARMAS DE LONGO ALCANCE."></div><div class="text-hotspot" style="left:86.5%;top:31.479166666666668%;width:3%;height:.057291666666666664%" data-text="HAD" onclick="showTextTooltip(event,this)" data-translation="TINHA"></div><div class="text-hotspot" style="left:9.75%;top:33.901041666666664%;width:46%;height:.9635416666666667%" data-text="I TOOK THIS FROM THE PARTY THAT TRIED TO KILL ME." onclick="showTextTooltip(event,this)" data-translation="EU PEGUEI ISSO DO GRUPO QUE TENTOU ME MATAR."></div><div class="text-hotspot" style="left:40.25%;top:34.90625%;width:50.5%;height:1.484375%" data-text="I KNOW IT'S OKAY TO KILL PLUNDERERS THAT ATTACK ME FIRST, IN THE FORM OF SELF-DEFENSE." onclick="showTextTooltip(event,this)" data-translation="EU SEI QUE É PERMITIDO MATAR SAQUEADORES QUE ME ATACAM PRIMEIRO, COMO FORMA DE LEGÍTIMA DEFESA." data-tips="💡 'In the form of' é uma expressão que significa 'como uma forma de'. Pode ser usada em várias situações, como 'in the form of payment'."></div><div class="text-hotspot" style="left:30.625000000000004%;top:41.171875%;width:54.375%;height:1.2135416666666714%" data-text="WE CAN'T BE SURE WHO STRUCK FIRST UNTIL THE INVESTIGATION IS OVER." onclick="showTextTooltip(event,this)" data-translation="NÃO PODEMOS TER CERTEZA DE QUEM ATACOU PRIMEIRO ATÉ QUE A INVESTIGAÇÃO TERMINE." data-tips="💡 'Until' é uma preposição que indica continuidade até um certo ponto no tempo. Exemplo: 'Wait here until I return.'"></div><div class="text-hotspot" style="left:45.125%;top:46.390625%;width:41.25%;height:1.0520833333333333%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)" data-translation="RISADA"></div><div class="text-hotspot" style="left:32.25%;top:49.03125%;width:37.25%;height:.8385416666666666%" data-text="GLARE" onclick="showTextTooltip(event,this)" data-translation="OLHAR FULMINANTE"></div><div class="text-hotspot" style="left:12.25%;top:53.8125%;width:51.625%;height:1.4635416666666714%" data-text="IS THAT REALLY WHY YOU'RE KEEPING ME LOCKED UP AND INTERROGATING ME?" onclick="showTextTooltip(event,this)" data-translation="É REALMENTE POR ISSO QUE VOCÊS ESTÃO ME MANTENDO PRESO E ME INTERROGANDO?" data-tips="💡 'Locked up' é uma expressão informal para 'preso'. A forma mais formal seria 'incarcerated'."></div><div class="text-hotspot" style="left:40.625%;top:56.052083333333336%;width:46.5%;height:.6927083333333286%" data-text="...THE ADVENTURERS' GUILD IS ACTING STRANGE." onclick="showTextTooltip(event,this)" data-translation="...A GUILDA DOS AVENTUREIROS ESTÁ AGINDO ESTRANHO."></div><div class="text-hotspot" style="left:14.625%;top:61.42708333333333%;width:42.5%;height:1.2083333333333333%" data-text="RULE OF THUMB IS NOT TO CARE ABOUT ITEMS ADVENTURERS ACQUIRE IN THE LABYRINTH," onclick="showTextTooltip(event,this)" data-translation="A REGRA GERAL É NÃO SE IMPORTAR COM OS ITENS QUE OS AVENTUREIROS ADQUIREM NO LABIRINTO," data-tips="💡 'Rule of thumb' é uma expressão idiomática que significa uma diretriz prática ou princípio geral. Em português, pode ser traduzido como 'regra geral'."></div><div class="text-hotspot" style="left:34.125%;top:63.145833333333336%;width:52.625%;height:1.2083333333333357%" data-text="AS LONG AS THERE ISN'T SOLID PROOF THAT THE ITEM WAS GAINED THROUGH UNLAWFUL MEANS." onclick="showTextTooltip(event,this)" data-translation="DESDE QUE NÃO HAJA PROVA CONCRETA DE QUE O ITEM FOI OBTIDO POR MEIOS ILEGAIS." data-tips="💡 'As long as' é uma expressão condicional que significa 'desde que'. Exemplo: 'You can go out as long as you finish your homework.'"></div><div class="text-hotspot" style="left:13.375%;top:70.13020833333333%;width:47%;height:.9791666666666667%" data-text="THERE HAVE BEEN CHANGES TO OUR INTERNAL POLICIES." onclick="showTextTooltip(event,this)" data-translation="HOUVE MUDANÇAS EM NOSSAS POLÍTICAS INTERNAS."></div><div class="text-hotspot" style="left:16.125%;top:71.69270833333333%;width:73.125%;height:1.7343750000000002%" data-text="WE DECIDED TO LAUNCH A THOROUGH INVESTIGATION STARTING WITH TIER-9 ADVENTURERS IN ORDER TO REDUCE THE AMOUNT OF PLUNDERING." onclick="showTextTooltip(event,this)" data-translation="DECIDIMOS INICIAR UMA INVESTIGAÇÃO MINUCIOSA COMEÇANDO COM AVENTUREIROS DE NÍVEL 9 PARA REDUZIR A QUANTIDADE DE SAQUES."></div><div class="text-hotspot" style="left:37.125%;top:78%;width:40.375%;height:.9427083333333286%" data-text="BEING LOW-TIERED SUCKS. IT'S LIKE A CASTE SYSTEM." onclick="showTextTooltip(event,this)" data-translation="SER DE BAIXO NÍVEL É UMA DROGA. É COMO UM SISTEMA DE CASTAS." data-tips="💡 'Sucks' é uma gíria informal que expressa desagrado. Uma alternativa mais formal seria 'is unpleasant'."></div><div class="text-hotspot" style="left:15.625%;top:84.88541666666667%;width:53%;height:.96875%" data-text="THERE'S NOT A SHRED OF A DOUBT YOU TARGETED THOSE THAT DO NOT HAVE CONNECTIONS LIKE ME," onclick="showTextTooltip(event,this)" data-translation="NÃO HÁ UM PINGO DE DÚVIDA DE QUE VOCÊS MIRARAM NAQUELES QUE NÃO TÊM CONEXÕES COMO EU," data-tips="💡 'Not a shred of doubt' é uma expressão que significa 'nenhuma dúvida'. É uma maneira enfática de negar incerteza."></div><div class="text-hotspot" style="left:37%;top:86.91666666666666%;width:50.25%;height:.9635416666666714%" data-text="AMONG ADVENTURERS THAT HAVE QUALITY ITEMS AND A LOT OF MANA STONES." onclick="showTextTooltip(event,this)" data-translation="ENTRE OS AVENTUREIROS QUE TÊM ITENS DE QUALIDADE E MUITAS PEDRAS DE MANA."></div><div class="text-hotspot" style="left:15.5%;top:92.08333333333333%;width:45.375%;height:1.2135416666666714%" data-text="TELL ME THE TRUTH NOW. WHERE AND HOW DID YOU OBTAIN THIS ITEM?" onclick="showTextTooltip(event,this)" data-translation="AGORA ME DIGA A VERDADE. ONDE E COMO VOCÊ CONSEGUIU ESTE ITEM?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/32/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:27%;top:5.166666666666667%;width:52.625%;height:1.213541666666666%" data-text="I TOLD YOU ALREADY. I TOOK IT FROM THE PARTY THAT ATTACKED ME." onclick="showTextTooltip(event,this)" data-translation="EU JÁ TE DISSE. EU PEGUEI DO GRUPO QUE ME ATACOU."></div><div class="text-hotspot" style="left:36.25%;top:16.166666666666664%;width:50.24999999999999%;height:.953125%" data-text="I BRIEFLY EXPLAINED TO HIM ABOUT THE PARTY OF FOUR PLUNDERERS THAT AMBUSHED ME." onclick="showTextTooltip(event,this)" data-translation="EXPLIQUEI BREVEMENTE PARA ELE SOBRE O GRUPO DE QUATRO SAQUEADORES QUE ME EMBOSCOU." data-tips="💡 'Ambushed' é um verbo que significa ser atacado de surpresa. É útil em contextos militares ou de estratégia."></div><div class="text-hotspot" style="left:11.125%;top:21.25%;width:53.75%;height:.9531250000000036%" data-text="WITH THE EXCEPTION OF THE FEMALE, RED-HEAD PLUNDERER, OF COURSE." onclick="showTextTooltip(event,this)" data-translation="COM EXCEÇÃO DA SAQUEADORA RUIVA, CLARO."></div><div class="text-hotspot" style="left:31.25%;top:28.239583333333336%;width:58.12500000000001%;height:.9791666666666667%" data-text="A BARBARIAN THAT GOES AGAINST ONE'S VOW CAN BE SUSPECTED OF BEING POSSESSED BY AN EVIL SPIRIT." onclick="showTextTooltip(event,this)" data-translation="UM BÁRBARO QUE VAI CONTRA SEU VOTO PODE SER SUSPEITO DE ESTAR POSSESSO POR UM ESPÍRITO MALIGNO." data-tips="💡 'Goes against' é um phrasal verb que significa 'contrariar' ou 'ir contra'. Exemplo: 'He went against his family's wishes.'"></div><div class="text-hotspot" style="left:26.875%;top:34.942708333333336%;width:45.75%;height:.953125%" data-text="YOU SURVIVED, AFTER YOUR THROAT WAS SLIT?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ SOBREVIVEU, DEPOIS DE TER SUA GARGANTA CORTADA?" data-tips="💡 'Slit' é o passado de 'to slit', que significa cortar ou fender algo afiado. É um verbo específico para cortes longos e finos."></div><div class="text-hotspot" style="left:12.25%;top:36.473958333333336%;width:42.625%;height:.6927083333333334%" data-text="THEN WHERE IS THE SCAR ON YOUR NECK?" onclick="showTextTooltip(event,this)" data-translation="ENTÃO ONDE ESTÁ A CICATRIZ NO SEU PESCOÇO?"></div><div class="text-hotspot" style="left:65.125%;top:40.25520833333333%;width:21.5%;height:.46875%" data-text="RUB" onclick="showTextTooltip(event,this)" data-translation="ESFREGAR"></div><div class="text-hotspot" style="left:30.5%;top:43.755208333333336%;width:31.624999999999996%;height:.43750000000000006%" data-text="WHERE DO YOU THINK?" onclick="showTextTooltip(event,this)" data-translation="ONDE VOCÊ ACHA?"></div><div class="text-hotspot" style="left:48.75%;top:44.83333333333333%;width:27.750000000000004%;height:.4479166666666667%" data-text="IT'S RIGHT HERE--" onclick="showTextTooltip(event,this)" data-translation="ESTÁ BEM AQUI--"></div><div class="text-hotspot" style="left:67.875%;top:49.5%;width:7.875%;height:.24479166666666669%" data-text="?!" onclick="showTextTooltip(event,this)" data-translation="?!"></div><div class="text-hotspot" style="left:17.875%;top:54.932291666666664%;width:46.75%;height:1.4739583333333335%" data-text="DID THE SCAR ON MY NECK HEAL ON ITS OWN DUE TO THE AMPLIFIED REGENERATIVE ABILITY I GAINED FROM THE VAMPIRE ESSENCE?" onclick="showTextTooltip(event,this)" data-translation="A CICATRIZ NO MEU PESCOÇO CICATRIZOU SOZINHA DEVIDO À HABILIDADE REGENERATIVA AMPLIADA QUE GANHEI DA ESSÊNCIA DE VAMPIRO?" data-tips="💡 'Due to' é uma expressão que indica causa, similar a 'because of'. Exemplo: 'The event was canceled due to rain.'"></div><div class="text-hotspot" style="left:56.125%;top:56.74479166666667%;width:31.75%;height:.375%" data-text="ARGH, THIS ISN'T GOOD." onclick="showTextTooltip(event,this)" data-translation="ARGH, ISSO NÃO É BOM."></div><div class="text-hotspot" style="left:23.625%;top:60.99479166666667%;width:52.75%;height:1.203125%" data-text="I HAD NO CHOICE BUT TO TELL HIM ABOUT WHAT HAPPENED IN THE RIFT, EVEN THOUGH I DIDN'T WANT TO." onclick="showTextTooltip(event,this)" data-translation="NÃO TIVE ESCOLHA A NÃO SER CONTAR A ELE SOBRE O QUE ACONTECEU NA FENDA, MESMO QUE EU NÃO QUISESSE."></div><div class="text-hotspot" style="left:32.125%;top:65.46354166666667%;width:32.75%;height:.8385416666666666%" data-text="AHAHAHA! FROM THE RIFT?!" onclick="showTextTooltip(event,this)" data-translation="AHAHAHA! DA FENDA?!"></div><div class="text-hotspot" style="left:49.875%;top:72.58854166666666%;width:37.125%;height:.9635416666666667%" data-text="A VAMPIRE DUKE, ON THE FIRST FLOOR RIFT?" onclick="showTextTooltip(event,this)" data-translation="UM DUQUE VAMPIRO, NA FENDA DO PRIMEIRO ANDAR?"></div><div class="text-hotspot" style="left:26.625%;top:74%;width:45.75%;height:1.46875%" data-text="YOU'RE GONNA HAVE TO COME UP WITH A BETTER LIE THAN THAT TO FOOL A NON-BARBARIAN!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ VAI TER QUE INVENTAR UMA MENTIRA MELHOR DO QUE ESSA PARA ENGANAR UM NÃO-BÁRBARO!" data-tips="💡 'Come up with' é um phrasal verb que significa 'inventar' ou 'criar'. Exemplo: 'She came up with a brilliant solution.'"></div><div class="text-hotspot" style="left:21.5%;top:79.13541666666667%;width:34.125%;height:.8124999999999858%" data-text="THEN SUMMON A MAGE!!" onclick="showTextTooltip(event,this)" data-translation="ENTÃO CONVOQUE UM MAGO!!"></div><div class="text-hotspot" style="left:23.75%;top:86.60416666666667%;width:54.125%;height:1.3124999999999858%" data-text="HAVE THE MAGE CAST A MEMORY SPELL ON ME IF YOU THINK I'M LYING! READING" onclick="showTextTooltip(event,this)" data-translation="FAÇA O MAGO LANÇAR UM FEITIÇO DE MEMÓRIA EM MIM SE VOCÊ ACHA QUE ESTOU MENTINDO! LENDO"></div><div class="text-hotspot" style="left:17.375%;top:92.33854166666666%;width:43.5%;height:1.4791666666666667%" data-text="WHY WOULD THAT BE NECESSARY TO INTERROGATE A STINKING TIER-9 ADVENTURER?" onclick="showTextTooltip(event,this)" data-translation="POR QUE ISSO SERIA NECESSÁRIO PARA INTERROGAR UM AVENTUREIRO FEDORENTO DE NÍVEL 9?" data-tips="💡 'Stinking' é uma gíria que pode ser usada para intensificar uma crítica. Uma alternativa mais formal seria 'undesirable'."></div><div class="text-hotspot" style="left:30.125%;top:94.19270833333333%;width:57%;height:1.4843750000000142%" data-text="YOU HAVE TO BE TIER-7 OR HIGHER TO HAVE THE RIGHT TO FORMALLY REQUEST THAT FROM THE GUILD." onclick="showTextTooltip(event,this)" data-translation="VOCÊ PRECISA SER TIER-7 OU SUPERIOR PARA TER O DIREITO DE SOLICITAR ISSO FORMALMENTE À GUILDA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/32/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:47.625%;top:.005208333333333334%;width:35.5%;height:.6354166666666666%" data-text="EVEN IF I WERE TO PAY FOR IT?" onclick="showTextTooltip(event,this)" data-translation="MESMO SE EU PAGAR POR ISSO?"></div><div class="text-hotspot" style="left:19.625%;top:5.036458333333333%;width:62.375%;height:2.187500000000001%" data-text="WHY WASTE THE MONEY NEEDLESSLY WHEN EVERYTHING IN YOUR POSSESSION WILL BE CONFISCATED ONCE YOU'RE PROVEN GUILTY?" onclick="showTextTooltip(event,this)" data-translation="POR QUE GASTAR DINHEIRO DESNECESSARIAMENTE QUANDO TUDO QUE VOCÊ POSSUI SERÁ CONFISCADO UMA VEZ QUE VOCÊ FOR CONSIDERADO CULPADO?" data-tips="💡 'Once' em 'once you're proven guilty' significa 'assim que'. É usado para indicar uma condição futura."></div><div class="text-hotspot" style="left:49.25%;top:15.671874999999998%;width:49%;height:1.0104166666666665%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)" data-translation="RISADA"></div><div class="text-hotspot" style="left:15.625%;top:17.411458333333332%;width:30.125%;height:.43750000000000006%" data-text="BUT WHATEVER." onclick="showTextTooltip(event,this)" data-translation="MAS TANTO FAZ."></div><div class="text-hotspot" style="left:38%;top:18.375%;width:41.75%;height:1.2135416666666665%" data-text="I'LL CONSIDER ASKING A MAGE FROM THE GUILD." onclick="showTextTooltip(event,this)" data-translation="VOU CONSIDERAR PEDIR UM MAGO DA GUILDA."></div><div class="text-hotspot" style="left:28.000000000000004%;top:21.28125%;width:46.5%;height:.4270833333333333%" data-text="MY FIRST DAY IN PRISON ENDED JUST LIKE THAT." onclick="showTextTooltip(event,this)" data-translation="MEU PRIMEIRO DIA NA PRISÃO TERMINOU ASSIM."></div><div class="text-hotspot" style="left:39.5%;top:28.880208333333336%;width:21.25%;height:.4427083333333333%" data-text="TWO DAYS LATER." onclick="showTextTooltip(event,this)" data-translation="DOIS DIAS DEPOIS."></div><div class="text-hotspot" style="left:9.5%;top:31.541666666666668%;width:66.625%;height:.45312499999999994%" data-text="YOUR SPIRIT STAT IS 90 OR HIGHER." onclick="showTextTooltip(event,this)" data-translation="SEU ATRIBUTO DE ESPÍRITO É 90 OU MAIS."></div><div class="text-hotspot" style="left:30.25%;top:32.90104166666667%;width:60.25%;height:.8645833333333334%" data-text="YOUR MAGIC RESISTANCE GRANTS YOU IMMUNITY TO ENEMY'S MENTAL MANIPULATION MAGIC." onclick="showTextTooltip(event,this)" data-translation="SUA RESISTÊNCIA MÁGICA LHE CONCEDE IMUNIDADE À MAGIA DE MANIPULAÇÃO MENTAL DO INIMIGO." data-tips="💡 'Grants' é um verbo que significa 'concede' ou 'dá'. É frequentemente usado em contextos formais ou legais."></div><div class="text-hotspot" style="left:21.875%;top:35.229166666666664%;width:38.125%;height:.6875%" data-text="HIS MAGIC RESISTANCE IS TOO HIGH." onclick="showTextTooltip(event,this)" data-translation="A RESISTÊNCIA MÁGICA DELE É MUITO ALTA."></div><div class="text-hotspot" style="left:38%;top:36.380208333333336%;width:45.875%;height:1.7291666666666643%" data-text="I DON'T THINK WE CAN PENETRATE HIS DEFENSE UNLESS WE SUMMON A MAGE FROM THE TOWER!" onclick="showTextTooltip(event,this)" data-translation="NÃO ACHO QUE CONSEGUIMOS PENETRAR SUA DEFESA A MENOS QUE CONVOQUEMOS UM MAGO DA TORRE!" data-tips="💡 'Unless' é uma conjunção que significa 'a menos que'. É usada para introduzir uma exceção."></div><div class="text-hotspot" style="left:74.625%;top:38.8125%;width:22.375%;height:.6197916666666666%" data-text="ZING" onclick="showTextTooltip(event,this)" data-translation="ZING"></div><div class="text-hotspot" style="left:54.125%;top:45.244791666666664%;width:19.125%;height:.16666666666666669%" data-text="DAMN IT!!" onclick="showTextTooltip(event,this)" data-translation="MALDIÇÃO!!"></div><div class="text-hotspot" style="left:20.25%;top:47.27604166666667%;width:59.375%;height:.9739583333333333%" data-text="SPELL CAST BY THE TIER-9 MAGE AFFILIATED WITH THE ADVENTURERS' GUILD DID NOT WORK ON ME." onclick="showTextTooltip(event,this)" data-translation="O FEITIÇO LANÇADO PELO MAGO TIER-9 AFILIADO À GUILDA DOS AVENTUREIROS NÃO FUNCIONOU EM MIM."></div><div class="text-hotspot" style="left:26.625%;top:52.6875%;width:50.375%;height:1.2135416666666665%" data-text="IT'S INEFFICIENT TO ASK FOR THEIR AID FOR A MENIAL INVESTIGATION LIKE THIS." onclick="showTextTooltip(event,this)" data-translation="É INEFICIENTE PEDIR AJUDA DELES PARA UMA INVESTIGAÇÃO INSIGNIFICANTE COMO ESTA."></div><div class="text-hotspot" style="left:18.625%;top:59.703125%;width:46.75%;height:.7135416666666666%" data-text="I MENTIONED ARUA AND THE DWARF'S NAMES TO HIM," onclick="showTextTooltip(event,this)" data-translation="MENCIONEI OS NOMES DE ARUA E DO ANÃO PARA ELE," data-tips="💡 'Mentioned' é o passado de 'mention', que significa 'mencionar' ou 'citar'. É um verbo regular, então basta adicionar '-ed' para formar o passado."></div><div class="text-hotspot" style="left:44.5%;top:61.109375%;width:39%;height:.45312499999999994%" data-text="BUT THIS BASTARD DIDN'T EVEN LISTEN." onclick="showTextTooltip(event,this)" data-translation="MAS ESSE DESGRAÇADO NEM OUVIU."></div><div class="text-hotspot" style="left:16.625%;top:67.08333333333333%;width:30.5%;height:.4583333333333333%" data-text="COME ON, BARBARIAN." onclick="showTextTooltip(event,this)" data-translation="VAMOS LÁ, BÁRBARO."></div><div class="text-hotspot" style="left:38.5%;top:68.09375%;width:41.375%;height:1.2083333333333333%" data-text="WHY DON'T YOU JUST GIVE IT UP ALREADY AND SPILL THE BEANS?" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ NÃO DESISTE LOGO E CONTA TUDO?" data-tips="💡 'Spill the beans' é uma expressão idiomática que significa 'revelar um segredo'. Não é literal, e uma tradução equivalente seria 'contar tudo'."></div><div class="text-hotspot" style="left:22.125%;top:78.94791666666666%;width:55.375%;height:.9583333333333333%" data-text="HE CONTINUED INTERROGATING FOR THE PURPOSE OF GETTING A COERCED CONFESSION." onclick="showTextTooltip(event,this)" data-translation="ELE CONTINUOU INTERROGANDO COM O PROPÓSITO DE OBTER UMA CONFISSÃO FORÇADA." data-tips="💡 'For the purpose of' é uma expressão usada para indicar a razão ou objetivo de uma ação. É similar a 'com o propósito de' em português."></div><div class="text-hotspot" style="left:28.999999999999996%;top:87.25520833333333%;width:41.875%;height:.9635416666666572%" data-text="THEN THIS HAPPENED DURING THE SEVENTH INTERROGATION THIS MORNING." onclick="showTextTooltip(event,this)" data-translation="ENTÃO ISSO ACONTECEU DURANTE O SÉTIMO INTERROGATÓRIO ESTA MANHÃ."></div><div class="text-hotspot" style="left:17.5%;top:89.55208333333333%;width:25.624999999999996%;height:.5104166666666666%" data-text="BJORN YANDEL!" onclick="showTextTooltip(event,this)" data-translation="BJORN YANDEL!"></div><div class="text-hotspot" style="left:23.5%;top:90.796875%;width:59.25%;height:1.1302083333333286%" data-text="WE FINALLY FOUND DAMNING EVIDENCE A
