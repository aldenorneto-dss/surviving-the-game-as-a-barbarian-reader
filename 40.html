 PUT THE ENTIRE PARTY IN PERIL WITH YOUR HOT-HEADEDNESS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ QUASE COLOCOU TODO O GRUPO EM PERIGO COM SUA IMPETUOSIDADE." data-tips="💡 **&quot;Hot-headedness&quot;** refere-se a uma tendência de agir impulsivamente ou com raiva. É uma característica de alguém que se irrita facilmente. - **His hot-headedness often gets him into trouble.** (Sua impetuosidade frequentemente o coloca em apuros.)"></div><div class="text-hotspot" style="left:53.5%;top:93.93229166666667%;width:30.875%;height:.4479166666666572%" data-text="...MY APOLOGIES." onclick="showTextTooltip(event,this)" data-translation="...MINHAS DESCULPAS."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/40/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20.375%;top:.203125%;width:23.375%;height:.15625%" data-text="ROTMILLER." onclick="showTextTooltip(event,this)" data-translation="ROTMILLER."></div><div class="text-hotspot" style="left:35.25%;top:1.140625%;width:43.75%;height:1.1979166666666667%" data-text="KEEP BEING HARSH ON HIM, SO HE LEARNS HIS LESSON AND DOESN'T DO IT AGAIN--" onclick="showTextTooltip(event,this)" data-translation="CONTINUE SENDO DURO COM ELE, PARA QUE ELE APRENDA A LIÇÃO E NÃO FAÇA ISSO DE NOVO--" data-tips="💡 **&quot;Keep being harsh on&quot;** significa continuar sendo severo ou rigoroso com alguém. Essa expressão sugere que ser duro pode ser necessário para ensinar uma lição. - **Keep being harsh on him until he improves his behavior.** (Continue sendo rigoroso com ele até que ele melhore seu comportamento.)"></div><div class="text-hotspot" style="left:32.5%;top:4.182291666666667%;width:23.625%;height:.5989583333333334%" data-text="NOD" onclick="showTextTooltip(event,this)" data-translation="ACENO"></div><div class="text-hotspot" style="left:78.125%;top:6.645833333333333%;width:18.875%;height:.4166666666666667%" data-text="NOD" onclick="showTextTooltip(event,this)" data-translation="ACENO"></div><div class="text-hotspot" style="left:15.875%;top:10.364583333333334%;width:68%;height:1.4895833333333321%" data-text="...BUT I WILL STOP HERE BECAUSE NOBODY GOT HURT AS A RESULT, IN THE END." onclick="showTextTooltip(event,this)" data-translation="...MAS VOU PARAR POR AQUI PORQUE NINGUÉM SE MACHUCOU NO FINAL." data-tips="💡 **&quot;Let it slide&quot;** é uma expressão idiomática que significa deixar passar ou não se importar com algo que poderia ser criticado. - **I'll let it slide this time, but don't do it again.** (Vou deixar passar desta vez, mas não faça de novo.)"></div><div class="text-hotspot" style="left:4.25%;top:12.526041666666668%;width:12.625%;height:.5260416666666666%" data-text="21" onclick="showTextTooltip(event,this)" data-translation="21"></div><div class="text-hotspot" style="left:20.125%;top:13.515625%;width:32.25%;height:.6770833333333334%" data-text="YOU'RE GOING TO LET IT SLIDE? SERIOUSLY?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ VAI DEIXAR PASSAR? SÉRIO?" data-tips="💡 'Let it slide' é uma expressão informal que significa deixar algo passar sem tomar ação. Uma alternativa formal seria 'overlook'."></div><div class="text-hotspot" style="left:22.75%;top:19%;width:56.49999999999999%;height:1.2135416666666665%" data-text="ALTHOUGH WHAT YOU DID WAS RASH, I PERSONALLY THINK YOU DID THE RIGHT THING..." onclick="showTextTooltip(event,this)" data-translation="EMBORA O QUE VOCÊ FEZ TENHA SIDO PRECIPITADO, EU PESSOALMENTE ACHO QUE VOCÊ FEZ A COISA CERTA..." data-tips="💡 **&quot;Although&quot;** é um conector usado para introduzir uma ideia contrastante, similar a &quot;embora&quot; em português. É usado para mostrar que há uma exceção ou contraste na afirmação. - **Although it was raining, we went for a walk.** (Embora estivesse chovendo, fomos dar uma caminhada.)"></div><div class="text-hotspot" style="left:41.875%;top:20.713541666666664%;width:41.375%;height:1.2239583333333333%" data-text="BY STEPPING IN TO COVER FOR YOUR OWN PARTY MEMBER LIKE THAT." onclick="showTextTooltip(event,this)" data-translation="AO INTERVIR PARA PROTEGER SEU PRÓPRIO COMPANHEIRO DE GRUPO ASSIM."></div><div class="text-hotspot" style="left:19.375%;top:24.520833333333332%;width:26.625%;height:.6822916666666666%" data-text="YOU'D EVEN COMPLIMENT HIM?!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ ATÉ ELOGIARIA ELE?!"></div><div class="text-hotspot" style="left:21.375%;top:30.104166666666664%;width:40.5%;height:1.2083333333333393%" data-text="I KNEW ROTMILLER WAS TOO SOFT-HEARTED FOR SITUATIONS LIKE THESE." onclick="showTextTooltip(event,this)" data-translation="EU SABIA QUE ROTMILLER ERA MUITO BONZINHO PARA SITUAÇÕES COMO ESSAS." data-tips="💡 **&quot;Soft-hearted&quot;** descreve alguém que é gentil e facilmente comovido ou influenciado emocionalmente. É uma característica que pode ser vista como positiva ou negativa dependendo do contexto. - **She's too soft-hearted to say no to anyone.** (Ela é muito boazinha para dizer não a alguém.)"></div><div class="text-hotspot" style="left:5.25%;top:31.760416666666668%;width:38.875%;height:.515625%" data-text="I'M READY TO BURST OUT IN ANGER TO SET THINGS STRAIGHT" onclick="showTextTooltip(event,this)" data-translation="ESTOU PRONTO PARA EXPLODIR DE RAIVA PARA COLOCAR AS COISAS NO LUGAR" data-tips="💡 **&quot;Burst out in anger&quot;** significa explodir de raiva, uma expressão que descreve uma reação emocional intensa. - **He burst out in anger when he heard the news.** (Ele explodiu de raiva quando ouviu a notícia.)"></div><div class="text-hotspot" style="left:24.625%;top:34.15625%;width:24.375%;height:.5%" data-text="SIGH" onclick="showTextTooltip(event,this)" data-translation="SUSPIRO"></div><div class="text-hotspot" style="left:47.75%;top:40.057291666666664%;width:38.25%;height:.984375%" data-text="... MAYBE I SHOULD APOLOGIZE AS WELLLLL." onclick="showTextTooltip(event,this)" data-translation=  class="text-hotspot" style="left:77.875%;top:57.59375%;width:11.75%;height:.5885416666666666%" data-text="?" onclick="showTextTooltip(event,this)" data-translation="?"></div><div class="text-hotspot" style="left:3%;top:58.505208333333336%;width:32.875%;height:.7083333333333333%" data-text="SNIFFLE" onclick="showTextTooltip(event,this)" data-translation="SOLUÇO"></div><div class="text-hotspot" style="left:39.625%;top:63.38541666666667%;width:46.75%;height:.9739583333333286%" data-text="THAT WAS A GREAT WORD OF ENCOURAGEMENT, НАНА." onclick="showTextTooltip(event,this)" data-translation="ESSA FOI UMA ÓTIMA PALAVRA DE INCENTIVO, НАНА."></div><div class="text-hotspot" style="left:15%;top:69.19791666666667%;width:40%;height:.6770833333333286%" data-text="UGH, I HATE THIS KIND OF ATMOSPHERE." onclick="showTextTooltip(event,this)" data-translation="UGH, EU ODEIO ESSE TIPO DE ATMOSFERA." data-tips="💡 **&quot;I hate this kind of atmosphere&quot;** usa **&quot;kind of&quot;** para especificar um tipo ou categoria. É uma construção comum para descrever algo de forma mais geral. - **I love this kind of music.** (Eu amo esse tipo de música.)"></div><div class="text-hotspot" style="left:38.125%;top:70.578125%;width:44.125%;height:1.2291666666666714%" data-text="I WAS ALLERGIC TO SUCH STRONG EXPRESSIONS OF EMOTION EVER SINCE I WAS LITTLE!" onclick="showTextTooltip(event,this)" data-translation="EU SEMPRE FUI ALÉRGICO A EXPRESSÕES TÃO FORTES DE EMOÇÃO DESDE PEQUENO!" data-tips="💡 **&quot;Allergic to such strong expressions of emotion&quot;** usa a palavra **&quot;allergic&quot;** de forma figurativa para indicar aversão ou desconforto. - **I'm allergic to drama.** (Eu tenho aversão a drama.)"></div><div class="text-hotspot" style="left:58.12500000000001%;top:72.80729166666666%;width:30.625000000000004%;height:.38020833333333337%" data-text="IS IT ME THAT'S WEIRD...?" onclick="showTextTooltip(event,this)" data-translation="SOU EU QUE SOU ESTRANHO...?"></div><div class="text-hotspot" style="left:60.25%;top:75.765625%;width:29.25%;height:.16145833333333334%" data-text="GOOSEBUMPS" onclick="showTextTooltip(event,this)" data-translation="ARREPIOS"></div><div class="text-hotspot" style="left:37.875%;top:81.85416666666666%;width:52.125%;height:.9635416666666667%" data-text="DO YOU KNOW WHY I DON'T LIKE TO TALK ABOUT MY FAMILYYY?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ SABE POR QUE EU NÃO GOSTO DE FALAR SOBRE MINHA FAMÍLIA?"></div><div class="text-hotspot" style="left:31.5%;top:87.34375%;width:59%;height:1.4895833333333428%" data-text="IT'S BECAUSE I'M THE ONLY ONE AMONG MY RELATIVES THAT HAS FAILED TO MAKE A CONTRACT WITH A SOUL BEASTTTTT." onclick="showTextTooltip(event,this)" data-translation="É PORQUE SOU O ÚNICO ENTRE MEUS PARENTES QUE NÃO CONSEGUIU FAZER UM CONTRATO COM UMA BESTA DA ALMA." data-tips="💡 **&quot;Failed to make a contract&quot;** usa **&quot;failed to&quot;** para indicar que algo não foi alcançado ou realizado. É uma forma de descrever um insucesso. - **He failed to submit the report on time.** (Ele não conseguiu entregar o relatório a tempo.)"></div><div class="text-hotspot" style="left:36.25%;top:94.18229166666666%;width:27.250000000000004%;height:.17708333333333331%" data-text="SOUL BEAST." onclick="showTextTooltip(event,this)" data-translation="BESTA DA ALMA."></div><div class="text-hotspot" style="left:77.625%;top:97.36458333333333%;width:1.875%;height:.078125%" data-text="1" onclick="showTextTooltip(event,this)" data-translation="1"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/40/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:23.25%;top:2.65625%;width:55.875%;height:.9583333333333333%" data-text="BEASTMEN AND WOMEN ARE ABLE TO MAKE A PACT WITH ANCIENT CREATURES CALLED SOUL BEASTS." onclick="showTextTooltip(event,this)" data-translation="HOMENS E MULHERES BESTIAIS SÃO CAPAZES DE FAZER UM PACTO COM CRIATURAS ANTIGAS CHAMADAS BESTAS DA ALMA." data-tips="💡 **&quot;Are able to make a pact&quot;** significa que têm a capacidade ou permissão para fazer um pacto. **&quot;Able to&quot;** é usado para indicar habilidade ou possibilidade. - **She is able to solve complex problems.** (Ela é capaz de resolver problemas complexos.)"></div><div class="text-hotspot" style="left:17.875%;top:5.984375%;width:64%;height:.8593750000000001%" data-text="FORM OF THE PACT VARIES DEPENDING ON THE CREATURE." onclick="showTextTooltip(event,this)" data-translation="A FORMA DO PACTO VARIA DEPENDENDO DA CRIATURA." data-tips="💡 **&quot;Varies depending on&quot;** é uma estrutura usada para indicar que algo muda de acordo com outra variável. - **The price varies depending on the size.** (O preço varia dependendo do tamanho.)"></div><div class="text-hotspot" style="left:57.375%;top:9.421875%;width:32%;height:.9791666666666667%" data-text="SOME SUMMON THE BEASTS TO FIGHT SIDE BY SIDE..." onclick="showTextTooltip(event,this)" data-translation="ALGUNS INVOCAM AS BESTAS PARA LUTAR LADO A LADO..." data-tips="💡 **&quot;Side by side&quot;** é uma expressão que significa juntos ou em cooperação próxima. - **They worked side by side on the project.** (Eles trabalharam lado a lado no projeto.)"></div><div class="text-hotspot" style="left:9.625%;top:12.885416666666666%;width:44.875%;height:.9583333333333333%" data-text="...SOME EMBRACE THEIR SOULS FOR ENHANCED PHYSICALITY..." onclick="showTextTooltip(event,this)" data-translation="...ALGUNS ABRAÇAM SUAS ALMAS PARA AUMENTAR A CAPACIDADE FÍSICA..."></div><div class="text-hotspot" style="left:49.5%;top:16.9375%;width:42.375%;height:.96875%" data-text="...AND SOME USE THE CREATURES' SPECIAL ABILITIES THROUGH A BLESSING." onclick="showTextTooltip(event,this)" data-translation="...E ALGUNS USAM AS HABILIDADES ESPECIAIS DAS CRIATURAS ATRAVÉS DE UMA BÊNÇÃO." data-tips="💡 **&quot;Through a blessing&quot;** usa **&quot;through&quot;** para indicar o meio ou método pelo qual algo é realizado. - **He learned through practice.** (Ele aprendeu através da prática.)"></div><div class="text-hotspot" style="left:17.375%;top:20.666666666666668%;width:50%;height:1.21875%" data-text="ONLY A HANDFUL OF BEASTMEN OR WOMEN HAVE THE KNACK AND ARE SELECTED BY THE SOUL BEASTS." onclick="showTextTooltip(event,this)" data-translation="APENAS UM PUNHADO DE HOMENS OU MULHERES BESTIAIS TEM O DOM E SÃO SELECIONADOS PELAS BESTAS DA ALMA." data-tips="💡 **&quot;Only a handful of&quot;** significa apenas um pequeno número de algo. É uma expressão usada para indicar escassez ou exclusividade. - **Only a handful of students passed the exam.** (Apenas um punhado de alunos passou no exame.)"></div><div class="text-hotspot" style="left:51.37500000000001%;top:22.3125%;width:28.125%;height:.45312499999999994%" data-text="THE PROBLEM HERE, IS THAT..." onclick="showTextTooltip(event,this)" data-translation="O PROBLEMA AQUI, É QUE..." data-tips="💡 **&quot;The problem here is that&quot;** introduz uma explicação ou detalhe sobre uma dificuldade específica. Essa estrutura é usada para destacar um ponto importante. - **The issue here is that we lack resources.** (O problema aqui é que nos faltam recursos.)"></div><div class="text-hotspot" style="left:47.25%;top:23.713541666666664%;width:6.125%;height:.13020833333333331%" data-text="506" onclick="showTextTooltip(event,this)" data-translation="506"></div><div class="text-hotspot" style="left:59.375%;top:27.500000000000004%;width:3.5000000000000004%;height:.765625%" data-text="XXXXX" onclick="showTextTooltip(event,this)" data-translation="XXXXX"></div><div class="text-hotspot" style="left:14.124999999999998%;top:30.921875%;width:71.5%;height:1.2916666666666667%" data-text="MISSHA HAPPENS TO BE IN A DIRECT LINE OF DESCENT IN HOUSE KARLSTEIN, THE RULING CLAN." onclick="showTextTooltip(event,this)" data-translation="MISSHA ACONTECE DE ESTAR EM UMA LINHAGEM DIRETA DA CASA KARLSTEIN, O CLÃ GOVERNANTE." data-tips="💡 **&quot;Happens to be&quot;** é uma expressão usada para indicar que algo é verdade por coincidência ou por acaso. - **She happens to know the answer.** (Ela por acaso sabe a resposta.)"></div><div class="text-hotspot" style="left:14.124999999999998%;top:36.31770833333333%;width:38.25%;height:.953125%" data-text="THE FACT THAT SHE'S UNABLE TO COMMAND A SOUL BEAST..." onclick="showTextTooltip(event,this)" data-translation="O FATO DE ELA NÃO CONSEGUIR COMANDAR UMA BESTA DA ALMA..." data-tips="💡 **&quot;The fact that she's unable to&quot;** introduz uma situação ou condição que é importante para o contexto. **&quot;Unable to&quot;** indica incapacidade. - **The fact that he's late worries me.** (O fato de ele estar atrasado me preocupa.)"></div><div class="text-hotspot" style="left:38.75%;top:37.59895833333333%;width:54.25%;height:1.2083333333333333%" data-text="CAN EVEN BE USED AS CIRCUMSTANTIAL EVIDENCE THAT SHE MAY BE A HALF-BLOOD, LET ALONE LACKING TALENT." onclick="showTextTooltip(event,this)" data-translation="PODE ATÉ SER USADO COMO EVIDÊNCIA CIRCUNSTANCIAL DE QUE ELA PODE SER UMA MEIO-SANGUE, ALÉM DE NÃO TER TALENTO." data-tips="💡 **&quot;Let alone&quot;** é uma expressão usada para enfatizar que algo é ainda menos provável ou verdadeiro do que outra coisa mencionada. - **He can't afford a car, let alone a house.** (Ele não pode pagar um carro, quanto mais uma casa.)"></div><div class="text-hotspot" style="left:24%;top:44.354166666666664%;width:50.74999999999999%;height:.953125%" data-text="...I WAS ON GOOD TERMS WITH MY SIBLINGS WHEN I WAS LITTLE." onclick="showTextTooltip(event,this)" data-translation="...EU ME DAVA BEM COM MEUS IRMÃOS QUANDO ERA PEQUENA." data-tips="💡 **&quot;On good terms with&quot;** significa ter um relacionamento amigável ou cordial com alguém. - **She is on good terms with her neighbors.** (Ela está em bons termos com seus vizinhos.)"></div><div class="text-hotspot" style="left:44.25%;top:46.020833333333336%;width:53.37499999999999%;height:1.359375%" data-text="GIGGLE" onclick="showTextTooltip(event,this)" data-translation="RISADINHA"></div><div class="text-hotspot" style="left:37.375%;top:53.78645833333333%;width:50.875%;height:1.484375%" data-text="BUT BECAUSE I COULDN'T MAKE A PACT WITH A SOUL BEAST EVEN AFTER I BECAME OF AGE..." onclick="showTextTooltip(event,this)" data-translation="MAS PORQUE EU NÃO CONSEGUI FAZER UM PACTO COM UMA BESTA DA ALMA MESMO DEPOIS DE CHEGAR À IDADE..." data-tips="💡 **&quot;Even after&quot;** é usado para indicar que algo continua a ser verdade ou relevante apesar de uma mudança ou evento. - **Even after the storm, the damage was minimal.** (Mesmo após a tempestade, o dano foi mínimo.)"></div><div class="text-hotspot" style="left:15.125%;top:55.421875%;width:30.375000000000004%;height:.953125%" data-text="THEY ALL BEGAN TO DESPISE MEEEE." onclick="showTextTooltip(event,this)" data-translation="ELES COMEÇARAM A ME DESPREZAR."></div><div class="text-hotspot" style="left:26.75%;top:59.520833333333336%;width:50%;height:.7604166666666643%" data-text="DON'T TOUCH ME, HALF-BLOODED LOSER!" onclick="showTextTooltip(event,this)" data-translation="NÃO ME TOQUE, PERDEDORA MEIO-SANGUE!" data-tips="💡 'Half-blooded loser' é uma expressão pejorativa que combina 'half-blood' (meio-sangue) com 'loser' (perdedor), usada para insultar alguém."></div><div class="text-hotspot" style="left:11.5%;top:71.90625%;width:49.5%;height:.6875%" data-text="THEY NOW CALL ME HALF-BLOODED LOSERRRRR……." onclick="showTextTooltip(event,this)" data-translation="AGORA ELES ME CHAMAM DE PERDEDORA MEIO-SANGUE..."></div><div class="text-hotspot" style="left:48.25%;top:73.27083333333333%;width:41.625%;height:.4479166666666667%" data-text="AND REFUSE TO ACCEPT MEEEE." onclick="showTextTooltip(event,this)" data-translation="E SE RECUSAM A ME ACEITAR."></div><div class="text-hotspot" style="left:17.625%;top:83.96354166666666%;width:64.875%;height:.828125%" data-text="I'M APPARENTLY AN AFFAIRRRR BABY TO THEMMM." onclick="showTextTooltip(event,this)" data-translation="APARENTEMENTE SOU UM BEBÊ DE CASO PARA ELES."></div><div class="text-hotspot" style="left:36.125%;top:94.625%;width:56.625%;height:1.2239583333333286%" data-text="OUR MOTHER DIED AT A YOUNG AGE, SO NOBODY COULD CONFIRM IF THIS WAS TRUE OR NOTTTTT." onclick="showTextTooltip(event,this)" data-translation="NOSSA MÃE MORREU JOVEM, ENTÃO NINGUÉM PODIA CONFIRMAR SE ISSO ERA VERDADE OU NÃO." data-tips="💡 A expressão **&quot;at a young age&quot;** é usada para indicar que algo aconteceu quando a pessoa era jovem. É uma forma de destacar a juventude como um fator relevante no contexto. Você pode usar essa expressão em outras frases como: &quot;He became famous at a young age&quot; (Ele se tornou famoso jovem) ou &quot;She learned to play the piano at a young age&quot; (Ela aprendeu a tocar piano jovem)."></div><div class="text-hotspot" style="left:7.625%;top:96.18229166666666%;width:64.375%;height:1.7395833333333333%" data-text="I COULDN'T BEAR THE DIRTY LOOKS WITHIN THE CLANNNN, SO I LEFT MY HOUSE AND FOCUSED ON MY COMBAT TRAININGGGG." onclick="showTextTooltip(event,this)" data-translation="EU NÃO CONSEGUIA SUPORTAR OS OLHARES SUJOS DENTRO DO CLÃ, ENTÃO SAÍ DE CASA E ME FOQUEI NO TREINAMENTO DE COMBATE." data-tips="💡 O phrasal verb **&quot;focus on&quot;** significa concentrar-se em algo. É usado para indicar que alguém está dedicando atenção e esforço a uma atividade específica. Exemplos: &quot;I need to focus on my studies&quot; (Preciso me concentrar nos meus estudos) ou &quot;She focuses on her career&quot; (Ela se concentra na carreira dela)."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/40/4.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:20.75%;top:8.296875%;width:58.75%;height:.8333333333333339%" data-text="THAT'S HOW I BECAME AN ADVENTURERRR." onclick="showTextTooltip(event,this)" data-translation="FOI ASSIM QUE ME TORNEI UMA AVENTUREIRA."></div><div class="text-hotspot" style="left:9.125%;top:19.25%;width:44.75%;height:1.7864583333333321%" data-text="SNIFFLE YOU'VE OBVIOUSLY BEEN THROUGH A LOT." onclick="showTextTooltip(event,this)" data-translation="SOLUÇO VOCÊ OBVIAMENTE PASSOU POR MUITO." data-tips="💡 'Sniffle' é uma onomatopeia para o som de alguém fungando, geralmente associada a choro ou resfriado."></div><div class="text-hotspot" style="left:30%;top:21.489583333333336%;width:48.25%;height:1.203125%" data-text="AND I KNOW HOW MUCH COURAGE IT TAKES TO SHARE SOMETHING LIKE THAT WITH US." onclick="showTextTooltip(event,this)" data-translation="E EU SEI O QUANTO DE CORAGEM É NECESSÁRIO PARA COMPARTILHAR ALGO ASSIM CONOSCO." data-tips="💡 A expressão **&quot;it takes courage&quot;** é usada para indicar que algo exige coragem. É uma forma de enfatizar a dificuldade ou o desafio de uma ação. Exemplos: &quot;It takes courage to speak in public&quot; (É preciso coragem para falar em público) ou &quot;It takes courage to make big changes&quot; (É preciso coragem para fazer grandes mudanças)."></div><div class="text-hotspot" style="left:59.375%;top:25.869791666666668%;width:32.375%;height:.8177083333333333%" data-text="GRAB" onclick="showTextTooltip(event,this)" data-translation="AGARRAR"></div><div class="text-hotspot" style="left:15.625%;top:28.526041666666668%;width:72%;height:1.4739583333333286%" data-text="DON'T SAY THATTT! YOU STEPPED IN AND GOT ANGRY ON OUR BEHALF BECAUSE YOU TRULY THOUGHT OF US AS YOUR COMPANIONSSS!!" onclick="showTextTooltip(event,this)" data-translation="NÃO DIGA ISSO! VOCÊ INTERVEIO E FICOU COM RAIVA POR NÓS PORQUE REALMENTE NOS CONSIDEROU COMO SEUS COMPANHEIROS!!" data-tips="💡 O phrasal verb **&quot;step in&quot;** significa intervir ou entrar em uma situação para ajudar ou resolver algo. É frequentemente usado em contextos onde alguém toma uma atitude para ajudar ou proteger outros. Exemplos: &quot;She stepped in to stop the argument&quot; (Ela interveio para parar a discussão) ou &quot;He stepped in when no one else would&quot; (Ele interveio quando ninguém mais quis)."></div><div class="text-hotspot" style="left:14.000000000000002%;top:31.364583333333336%;width:44.5%;height:.84375%" data-text="AHAHAHA, I'M RELIEVED TO HEAR THAT!!" onclick="showTextTooltip(event,this)" data-translation="AHAHAHA, ESTOU ALIVIADO EM OUVIR ISSO!!"></div><div class="text-hotspot" style="left:50.5%;top:35.651041666666664%;width:35.25%;height:1.0520833333333333%" data-text="I DON'T KNOW WHY THIS ALL BECAME SO AWKWARD..." onclick="showTextTooltip(event,this)" data-translation="EU NÃO SEI POR QUE TUDO ISSO FICOU TÃO ESTRANHO..." data-tips="💡 A palavra **&quot;awkward&quot;** pode ser traduzida como &quot;estranho&quot; ou &quot;desajeitado&quot;, dependendo do contexto. É usada para descrever situações que são desconfortáveis ou embaraçosas. Exemplos: &quot;The silence was awkward&quot; (O silêncio foi estranho) ou &quot;He felt awkward at the party&quot; (Ele se sentiu desajeitado na festa)."></div><div class="text-hotspot" style="left:23.375%;top:37.083333333333336%;width:26.375%;height:1.0364583333333333%" data-text="BUT CAN WE GET THIS OVER WITH ALREADY?" onclick="showTextTooltip(event,this)" data-translation="MAS PODEMOS TERMINAR COM ISSO JÁ?"></div><div class="text-hotspot" style="left:14.875%;top:43.47916666666667%;width:73%;height:1.0625%" data-text="PERHAPS I OWE YOU A PERSONAL STORY AS WELL, ALTHOUGH IT'S NOT AS DRAMATIC." onclick="showTextTooltip(event,this)" data-translation="TALVEZ EU TE DEVA UMA HISTÓRIA PESSOAL TAMBÉM, EMBORA NÃO SEJA TÃO DRAMÁTICA." data-tips="💡 A expressão **&quot;owe you a story&quot;** é uma forma casual de dizer que alguém sente que deve compartilhar algo com outra pessoa, geralmente porque a outra pessoa compartilhou algo primeiro. Exemplos: &quot;I owe you a drink&quot; (Eu te devo uma bebida) ou &quot;I owe you an explanation&quot; (Eu te devo uma explicação)."></div><div class="text-hotspot" style="left:71.25%;top:45.875%;width:5.375%;height:.21354166666666666%" data-text="?!" onclick="showTextTooltip(event,this)" data-translation="?!"></div><div class="text-hotspot" style="left:21.125%;top:52.578125%;width:58.25%;height:.8333333333333334%" data-text="IT WAS MY DREAM TO BECOME A FINE BLACKSMITH." onclick="showTextTooltip(event,this)" data-translation="ERA MEU SONHO ME TORNAR UM BOM FERREIRO."></div><div class="text-hotspot" style="left:10.5%;top:54.369791666666664%;width:32.875%;height:.9010416666666666%" data-text="CLINK" onclick="showTextTooltip(event,this)" data-translation="CLINK"></div><div class="text-hotspot" style="left:65.25%;top:55.43749999999999%;width:28.249999999999996%;height:.5625%" data-text="CLINK" onclick="showTextTooltip(event,this)" data-translation="CLINK"></div><div class="text-hotspot" style="left:9.125%;top:60.026041666666664%;width:56.99999999999999%;height:1.4895833333333335%" data-text="CLINK" onclick="showTextTooltip(event,this)" data-translation="CLINK"></div><div class="text-hotspot" style="left:10.5%;top:63.28645833333333%;width:31.5%;height:.1875%" data-text="HOWEVER..." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO..."></div><div class="text-hotspot" style="left:49.625%;top:68.296875%;width:37.5%;height:1.0416666666666665%" data-text="PSHH" onclick="showTextTooltip(event,this)" data-translation="PSHH"></div><div class="text-hotspot" style="left:19.75%;top:72.640625%;width:24.875%;height:.16145833333333334%" data-text="I'M DEAD." onclick="showTextTooltip(event,this)" data-translation="ESTOU MORTO."></div><div class="text-hotspot" style="left:19.5%;top:74.82291666666666%;width:49.25%;height:1.2239583333333333%" data-text="... I WAS ONLY AN APPRENTICE TO A SMITH FOR TEN YEARS DUE TO MY LACK OF TALENT." onclick="showTextTooltip(event,this)" data-translation="...EU FUI APENAS UM APRENDIZ DE FERREIRO POR DEZ ANOS DEVIDO À MINHA FALTA DE TALENTO." data-tips="💡 A expressão **&quot;due to&quot;** é usada para indicar a razão ou causa de algo, similar a &quot;por causa de&quot; em português. É uma forma formal de explicar o motivo de uma situação. Exemplos: &quot;The event was canceled due to bad weather&quot; (O evento foi cancelado devido ao mau tempo) ou &quot;She succeeded due to her hard work&quot; (Ela teve sucesso devido ao seu trabalho árduo)."></div><div class="text-hotspot" style="left:4.125%;top:77.20833333333333%;width:51.37500000000001%;height:1.7239583333333333%" data-text="CREAK" onclick="showTextTooltip(event,this)" data-translation="CREAK"></div><div class="text-hotspot" style="left:16.625%;top:83.21354166666667%;width:52.75%;height:1.4739583333333286%" data-text="THAT'S WHY I BECAME AN ADVENTURER AT THE AGE OF THIRTY, WHICH IS PRETTY LATE." onclick="showTextTooltip(event,this)" data-translation="POR ISSO ME TORNEI UM AVENTUREIRO AOS TRINTA ANOS, O QUE É BEM TARDE." data-tips="💡 A expressão **&quot;at the age of&quot;** é usada para indicar a idade em que algo aconteceu. É uma forma comum de mencionar a idade em relação a eventos importantes. Exemplos: &quot;He started playing piano at the age of five&quot; (Ele começou a tocar piano aos cinco anos) ou &quot;She graduated at the age of twenty-two&quot; (Ela se formou aos vinte e dois anos)."></div><div class="text-hotspot" style="left:25.874999999999996%;top:85.1875%;width:62.25%;height:1.2083333333333286%" data-text="I HAD TO MAKE MONEY ONE WAY OR ANOTHER, AND THIS OBVIOUSLY SUITED ME BETTER." onclick="showTextTooltip(event,this)" data-translation="EU TINHA QUE GANHAR DINHEIRO DE ALGUMA FORMA, E ISSO OBVIAMENTE ME CAIU MELHOR." data-tips="💡 A expressão **&quot;one way or another&quot;** significa &quot;de um jeito ou de outro&quot;. É usada para indicar que algo será feito, independentemente das circunstâncias. Exemplos: &quot;We'll find a solution one way or another&quot; (Vamos encontrar uma solução de um jeito ou de outro) ou &quot;He'll get there one way or another&quot; (Ele chegará lá de um jeito ou de outro)."></div><div class="text-hotspot" style="left:2.625%;top:89.296875%;width:59.5%;height:1.3229166666666667%" data-text="SHOUT" onclick="showTextTooltip(event,this)" data-translation="GRITO"></div><div class="text-hotspot" style="left:16.5%;top:91.10416666666666%;width:66.25%;height:1.7864583333333428%" data-text="I-I CAN CONFIDENTLY SAY I AM THE LEAST COMPETENT PERSON HERE, IN TERMS OF HAVING TALENT!" onclick="showTextTooltip(event,this)" data-translation="EU POSSO DIZER COM CONFIANÇA QUE SOU A PESSOA MENOS COMPETENTE AQUI, EM TERMOS DE TER TALENTO!" data-tips="💡 A expressão **&quot;in terms of&quot;** é usada para especificar o aspecto ou a perspectiva que está sendo considerada. É uma forma de delimitar o contexto ou o critério de uma afirmação. Exemplos: &quot;In terms of quality, this product is excellent&quot; (Em termos de qualidade, este produto é excelente) ou &quot;In terms of cost, it's quite affordable&quot; (Em termos de custo, é bastante acessível)."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/40/5.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:14.75%;top:2.078125%;width:50.24999999999999%;height:1.4895833333333335%" data-text="I WAS FORTUNATE ENOUGH TO STUDY MAGIC THANKS TO MY FAMILY'S WEALTH," onclick="showTextTooltip(event,this)" data-translation="FUI AFORTUNADO O SUFICIENTE PARA ESTUDAR MAGIA GRAÇAS À RIQUEZA DA MINHA FAMÍLIA," data-tips="💡 'Fortunate enough' é uma maneira de dizer que alguém teve sorte suficiente. É uma estrutura útil para expressar gratidão ou reconhecimento de sorte."></div><div class="text-hotspot" style="left:39.375%;top:3.875%;width:44.25%;height:1.2291666666666665%" data-text="BUT I COULDN'T MAKE IT TO THE TOWER BECAUSE OF MY LACK OF TALENT...!" onclick="showTextTooltip(event,this)" data-translation="MAS NÃO CONSEGUI CHEGAR À TORRE POR CAUSA DA MINHA FALTA DE TALENTO...!"></div><div class="text-hotspot" style="left:4 AS É A PRIMEIRA VEZ QUE VEJO ALGO ASSIM." data-tips="💡 A expressão **&quot;numerous&quot;** significa &quot;numerosos&quot; ou &quot;muitos&quot;. É uma forma de indicar uma quantidade grande, mas não especificada. Exemplos: &quot;There are numerous reasons to visit the city&quot; (Há inúmeras razões para visitar a cidade) ou &quot;She received numerous awards&quot; (Ela recebeu inúmeros prêmios)."></div><div class="text-hotspot" style="left:38.5%;top:59.421875%;width:42.25%;height:.703125%" data-text="THAT'S WHAT I'M SAYING. I'VE TOTALLY HAD ENOUGH--" onclick="showTextTooltip(event,this)" data-translation="É O QUE EU ESTOU DIZENDO. JÁ TIVE O BASTANTE--"></div><div class="text-hotspot" style="left:14.000000000000002%;top:63.31250000000001%;width:43.125%;height:.9583333333333333%" data-text="I HAVE A REASON TO APOLOGIZE TOO, IF I MAY." onclick="showTextTooltip(event,this)" data-translation="EU TAMBÉM TENHO UM MOTIVO PARA ME DESCULPAR, SE ME PERMITEM." data-tips="💡 A expressão **&quot;if I may&quot;** é uma forma educada de pedir permissão para fazer algo ou introduzir uma opinião. É frequentemente usada em contextos formais ou educados. Exemplos: &quot;If I may, I'd like to suggest an alternative&quot; (Se me permitem, gostaria de sugerir uma alternativa) ou &quot;If I may, I'd like to add something&quot; (Se me permitem, gostaria de acrescentar algo)."></div><div class="text-hotspot" style="left:52.37500000000001%;top:68.50520833333333%;width:30.875000000000004%;height:.53125%" data-text="DAMMIT, YOU, TOO?!" onclick="showTextTooltip(event,this)" data-translation="MALDITO, VOCÊ TAMBÉM?!"></div><div class="text-hotspot" style="left:13.375%;top:72.96354166666667%;width:60.375%;height:1.4947916666666714%" data-text="WHEN MURAD AND MS. KARLSTEIN MENTIONED THEIR YEARS OF EXPERIENCE AS ADVENTURERS..." onclick="showTextTooltip(event,this)" data-translation="QUANDO MURAD E SRTA. KARLSTEIN MENCIONARAM SEUS ANOS DE EXPERIÊNCIA COMO AVENTUREIROS..."></div><div class="text-hotspot" style="left:38.75%;top:75.25%;width:49.875%;height:.9635416666666667%" data-text="I INADVERTENTLY LOST MYSELF TO ANGER AND SPOKE HARSHLY." onclick="showTextTooltip(event,this)" data-translation="EU INADVERTIDAMENTE ME DEIXEI LEVAR PELA RAIVA E FALEI DURAMENTE." data-tips="💡 A palavra **&quot;inadvertently&quot;** significa &quot;inadvertidamente&quot; ou &quot;sem querer&quot;. É usada para descrever ações que foram feitas sem intenção ou por acidente. Exemplos: &quot;He inadvertently deleted the file&quot; (Ele apagou o arquivo sem querer) ou &quot;She inadvertently offended her friend&quot; (Ela ofendeu a amiga sem querer)."></div><div class="text-hotspot" style="left:3.375%;top:80.671875%;width:1.5%;height:.057291666666666664%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:9.625%;top:87.13541666666667%;width:43.75%;height:.6875%" data-text="I ADMIT I WAS REALLY ENVIOUS OF YOU TWO." onclick="showTextTooltip(event,this)" data-translation="EU ADMITO QUE ESTAVA REALMENTE COM INVEJA DE VOCÊS DOIS." data-tips="💡 A palavra **&quot;envious&quot;** significa &quot;invejoso&quot;. É usada para descrever alguém que deseja o que outra pessoa tem. Exemplos: &quot;He was envious of his friend's success&quot; (Ele estava com inveja do sucesso do amigo) ou &quot;She felt envious of their lifestyle&quot; (Ela se sentiu invejosa do estilo de vida deles)."></div><div class="text-hotspot" style="left:20.375%;top:94.421875%;width:51.74999999999999%;height:2.020833333333333%" data-text="I HONESTLY THOUGHT YOU TWO WERE JUST WHINY BABIES WHEN YOU WERE FORTUNATE ENOUGH TO HAVE BEEN BORN AS NON-HUMAN," onclick="showTextTooltip(event,this)" data-translation="EU HONESTAMENTE PENSEI QUE VOCÊS DOIS ERAM APENAS BEBÊS CHORÕES QUANDO VOCÊS TIVERAM A SORTE DE NASCER COMO NÃO-HUMANOS,"></div><div class="text-hotspot" style="left:43.875%;top:97.08854166666666%;width:42%;height:.9583333333333286%" data-text="WITHOUT HEARING ABOUT YOUR STORIES FIRST." onclick="showTextTooltip(event,this)" data-translation="SEM OUVIR SUAS HISTÓRIAS PRIMEIRO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/40/6.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:17.375%;top:2.421875%;width:28.875%;height:.16666666666666669%" data-text="R-REALLY?" onclick="showTextTooltip(event,this)" data-translation="R-SÉRIO?"></div><div class="text-hotspot" style="left:20%;top:3.1822916666666665%;width:49.75%;height:1.2135416666666665%" data-text="BUT I'M SURE HUMANS HAVE SOME ADVANTAGES OVER US, TOO." onclick="showTextTooltip(event,this)" data-translation="MAS TENHO CERTEZA DE QUE OS HUMANOS TÊM ALGUMAS VANTAGENS SOBRE NÓS TAMBÉM." data-tips="💡 'Over' é uma preposição que pode indicar superioridade ou vantagem. Aqui, 'over us' significa 'em relação a nós'."></div><div class="text-hotspot" style="left:56.99999999999999%;top:5.614583333333333%;width:3.25%;height:.296875%" data-text="www" onclick="showTextTooltip(event,this)" data-translation="www"></div><div class="text-hotspot" style="left:16.875%;top:11.484375%;width:28.999999999999996%;height:.4322916666666667%" data-text="TH-THAT'S RRRRIGHT!" onclick="showTextTooltip(event,this)" data-translation="I-ISSO MESMO!"></div><div class="text-hotspot" style="left:23.875%;top:12.458333333333334%;width:64.875%;height:1.4947916666666667%" data-text="YOU CAN USE AURA, AND YOU CAN CHOOSE FROM A WIDE VARIETY OF PROFESSIONS SUCH AS ELEMENTALIST, MAGE, AND PRRRRRIEST!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ PODE USAR AURA, E PODE ESCOLHER ENTRE UMA AMPLA VARIEDADE DE PROFISSÕES COMO ELEMENTALISTA, MAGO E SACERDOTE!" data-tips="💡 'Choose from' é uma estrutura que indica a seleção entre várias opções. Em português, seria 'escolher entre'."></div><div class="text-hotspot" style="left:24.25%;top:16.302083333333332%;width:53.25%;height:1.0572916666666665%" data-text="EXCEP  **&quot;do my best&quot;** significa &quot;fazer o meu melhor&quot;. É usada para indicar que alguém está se esforçando ao máximo. Exemplos: &quot;I'll do my best to help you&quot; (Vou fazer o meu melhor para te ajudar) ou &quot;She did her best in the competition&quot; (Ela fez o melhor dela na competição)."></div><div class="text-hotspot" style="left:55.625%;top:38.671875%;width:43.25%;height:.9895833333333357%" data-text="---- WARM" onclick="showTextTooltip(event,this)" data-translation="---- QUENTE"></div><div class="text-hotspot" style="left:37.125%;top:42.473958333333336%;width:37%;height:.71875%" data-text="LIKEWISEEEE! LET'S KEEP IT UPPPP" onclick="showTextTooltip(event,this)" data-translation="IGUALMENTE! VAMOS CONTINUAR ASSIM"></div><div class="text-hotspot" style="left:21.125%;top:45.270833333333336%;width:44.375%;height:.953125%" data-text="WHAT A GREAT TEAM WE MAKE! I HOPE IT LASTS LONG." onclick="showTextTooltip(event,this)" data-translation="QUE GRANDE EQUIPE NÓS SOMOS! ESPERO QUE DURE MUITO."></div><div class="text-hotspot" style="left:0;top:48.786458333333336%;width:3.875%;height:.16666666666666669%" data-text="20" onclick="showTextTooltip(event,this)" data-translation="20"></div><div class="text-hotspot" style="left:14.875%;top:51.822916666666664%;width:46.375%;height:1.4583333333333333%" data-text="EVERYONE IS TAKING TURNS TO SHARE HIS OR HER OWN SHORTCOMINGS TO ENCOURAGE ONE ANOTHER." onclick="showTextTooltip(event,this)" data-translation="TODOS ESTÃO SE REVEZANDO PARA COMPARTILHAR SUAS PRÓPRIAS DEFICIÊNCIAS PARA ENCORAJAR UNS AOS OUTROS." data-tips="💡 A expressão **&quot;take turns&quot;** significa &quot;revezar&quot; ou &quot;turnar&quot;. É usada para descrever uma situação em que várias pessoas fazem algo alternadamente. Exemplos: &quot;The children take turns on the swing&quot; (As crianças se revezam no balanço) ou &quot;We take turns cooking dinner&quot; (Nós nos revezamos para cozinhar o jantar)."></div><div class="text-hotspot" style= ext-hotspot" style="left:17.5%;top:19.989583333333332%;width:41%;height:.953125%" data-text="NOT THAT IT MATTERS. IT'S NOT LIKE I REALLY DON'T HAVE A MOTHER." onclick="showTextTooltip(event,this)" data-translation="NÃO QUE ISSO IMPORTE. NÃO É COMO SE EU REALMENTE NÃO TIVESSE UMA MÃE." data-tips="💡 'Not that it matters' é uma expressão que minimiza a importância de algo."></div><div class="text-hotspot" style="left:3.75%;top:25.255208333333336%;width:94.375%;height:2.5572916666666643%" data-text="BESIDES, I'M A SUPER-ELITE BARBARIAN THAT'S ON HIS WAY TO BECOME ONE OF THE BEST ADVENTURERS, BY ACHIEVING TIER-7 IN JUST THREE MONTHS, UNLIKE THESE GUYS!" onclick="showTextTooltip(event,this)" data-translation="ALÉM DISSO, SOU UM BÁRBARO SUPER-ELITE QUE ESTÁ A CAMINHO DE SE TORNAR UM DOS MELHORES AVENTUREIROS, ALCANÇANDO O NÍVEL 7 EM APENAS TRÊS MESES, AO CONTRÁRIO DESSES CARAS!" data-tips="💡 'Unlike' é usado para comparar diferenças entre duas coisas ou pessoas. - Exemplo: 'Unlike his brother, he is very outgoing.' (Ao contrário do irmão, ele é muito extrovertido.)"></div><div class="text-hotspot" style="left:2.75%;top:31.958333333333332%;width:95%;height:2.8697916666666665%" data-text="EVEN THOUGH I WAS SOMEHOW DRAGGED INTO THE GAME-UNIVERSE WITHOUT WARNING JUST THROUGH PURE BAD LUCK AND HAD TO ENDURE MANY LIFE-AND-DEATH SITUATIONS, THAT'S NOT WHAT REALLY MATTERS-- WAIT A MINUTE." onclick="showTextTooltip(event,this)" data-translation="MESMO QUE EU TENHA SIDO DE ALGUMA FORMA ARRASTADO PARA O UNIVERSO DO JOGO SEM AVISO APENAS POR PURA MÁ SORTE E TENHA QUE SUPORTAR MUITAS SITUAÇÕES DE VIDA OU MORTE, ISSO NÃO É O QUE REALMENTE IMPORTA-- ESPERE UM MINUTO." data-tips="💡 'Even though' é um **conector** que introduz uma ideia contrastante. - Exemplo: 'Even though it was raining, we went for a walk.' (Mesmo que estivesse chovendo, fomos dar uma caminhada.)"></div><div class="text-hotspot" style="left:42.5%;top:41.4375%;width:41.75%;height:.9583333333333333%" data-text="B-BJORN? YOU SEEM TERRIBLY SAD RRRIGHT NOWWWW!" onclick="showTextTooltip(event,this)" data-translation="B-BJORN? VOCÊ PARECE TERRIVELMENTE TRISTE AGORA!" data-tips="💡 'Terribly sad' usa 'terribly' como intensificador, comum em inglês para dar ênfase."></div><div class="text-hotspot" style="left:23.5%;top:52.276041666666664%;width:53.125%;height:1.140625000000007%" data-text="DID YOU BY ANY CHANCE THINK OF YOUR MOTHERRRRRR?" onclick="showTextTooltip(event,this)" data-translation="VOCÊ POR ACASO PENSOU NA SUA MÃE?"></div><div class="text-hotspot" style="left:32%;top:55.604166666666664%;width:7.124999999999999%;height:.25%" data-text="D" onclick="showTextTooltip(event,this)" data-translation="D"></div><div class="text-hotspot" style="left:24.125%;top:61.635416666666664%;width:52.625%;height:1.0208333333333333%" data-text="WHAT. THE. HELL. WHY IS MY LIFE SO FULL OF MISERY?!" onclick="showTextTooltip(event,this)" data-translation="QUE. DIABOS. POR QUE MINHA VIDA É TÃO CHEIA DE MISÉRIA?!" data-tips="💡 'What. The. Hell.' é uma expressão de surpresa ou frustração, frequentemente usada em contextos informais."></div><div class="text-hotspot" style="left:50.625%;top:68.22916666666666%;width:38.75%;height:.6875%" data-text="BUT WHAT ARE WE GOING TO DO NOW?" onclick="showTextTooltip(event,this)" data-translation="MAS O QUE VAMOS FAZER AGORA?"></div><div class="text-hotspot" style="left:38.125%;top:69.703125%;width:31.5%;height:.90625%" data-text="IF IT'S FAMILY YOU WANT, YOU MAY THINK OF ME AS YOUR OLDER SISTERRR!" onclick="showTextTooltip(event,this)" data-translation="SE É FAMÍLIA QUE VOCÊ QUER, PODE ME CONSIDERAR COMO SUA IRMÃ MAIS VELHA!" data-tips="💡 'Think of me as' é uma estrutura que sugere como alguém deve ser visto ou considerado. - Exemplo: 'Think of me as your mentor.' (Considere-me como seu mentor.)"></div><div class="text-hotspot" style="left:13%;top:70.734375%;width:18.625%;height:.140625%" data-text="IT'S OKAY..." onclick="showTextTooltip(event,this)" data-translation="TUDO BEM..."></div><div class="text-hotspot" style="left:35.625%;top:73.95833333333334%;width:6.625%;height:.4427083333333333%" data-text="000" onclick="showTextTooltip(event,this)" data-translation="000"></div><div class="text-hotspot" style="left:20%;top:78.33333333333333%;width:62.125%;height:1.2187500000000142%" data-text="I WAS THINKING OF HEADING TOWARDS THE WITCH'S FOREST ON THE THIRD FLOOR." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA PENSANDO EM IR PARA A FLORESTA DA BRUXA NO TERCEIRO ANDAR." data-tips="💡 'Heading towards' é um phrasal verb que significa 'ir em direção a'. Ex: 'I'm heading towards the city.'"></div><div class="text-hotspot" style="left:55.75%;top:80.68229166666666%;width:9.25%;height:.2552083333333333%" data-text="11/" onclick="showTextTooltip(event,this)" data-translation="11/"></div><div class="text-hotspot" style="left:36.375%;top:83.875%;width:49.875%;height:1.21875%" data-text="WITCH'S FORRRREST? WHY DON'T WE HEAD TO GREENTAIL MARSH INSTEADDDD?" onclick="showTextTooltip(event,this)" data-translation="FLORESTA DA BRUXA? POR QUE NÃO VAMOS PARA O PÂNTANO DE CAUDA VERDE EM VEZ DISSO?"></div><div class="text-hotspot" style="left:16%;top:87.40625%;width:42.125%;height:1.2291666666666714%" data-text="IT WILL TAKE AT LEAST SIX DAYS JUST TO GET THERE FROM HERE." onclick="showTextTooltip(event,this)" data-translation="VAI LEVAR PELO MENOS SEIS DIAS SÓ PARA CHEGAR LÁ DE AQUI." data-tips="💡 'At least' é uma expressão usada para indicar uma quantidade mínima ou o menor tempo esperado."></div><div class="text-hotspot" style="left:37.625%;top:90.59895833333333%;width:52.75%;height:1.2239583333333286%" data-text="HOW ABOUT ADVANCING TO THE FOURTH FLOOR WHILE WE'RE AT IT, THEN?" onclick="showTextTooltip(event,this)" data-translation="QUE TAL AVANÇARMOS PARA O QUARTO ANDAR ENQUANTO ESTAMOS NISSO, ENTÃO?" data-tips="💡 'While we're at it' é uma expressão que significa 'já que estamos nisso', usada para sugerir fazer algo adicional."></div><div class="text-hotspot" style="left:16.5%;top:92.08333333333333%;width:57.375%;height:1.2239583333333428%" data-text="I HEARD WITCH'S FOREST ISN'T REALLY A GOOD PLACE FOR PHYSICAL COMBATANTS." onclick="showTextTooltip(event,this)" data-translation="OUVI DIZER QUE A FLORESTA DA BRUXA NÃO É REALMENTE UM BOM LUGAR PARA COMBATENTES FÍSICOS." data-tips="💡 'Isn't really a good place' usa 'really' para enfatizar uma opinião ou fato."></div><div class="text-hotspot" style="left:17.75%;top:95.19270833333333%;width:65.125%;height:1.4583333333333428%" data-text="I THINK IT'S TOO EARLY FOR US TO ADVANCE TO THE FOURTH FLOOR YET." onclick="showTextTooltip(event,this)" data-translation="EU ACHO QUE É MUITO CEDO PARA NÓS AVANÇARMOS PARA O QUARTO ANDAR AINDA." data-tips="💡 'Yet' no final da frase indica que algo ainda não aconteceu, mas pode acontecer no futuro."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/40/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:65.5%;top:2.46875%;width:2.875%;height:.13020833333333331%" data-text="0" onclick="showTextTooltip(event,this)" data-translation="0"></div><div class="text-hotspot" style="left:35.125%;top:3.96875%;width:30.25%;height:.817708333333333%" data-text="THAT FIRM STANCE THOUGH." onclick="showTextTooltip(event,this)" data-translation="ESSA POSTURA FIRME, NO ENTANTO."></div><div class="text-hotspot" style="left:18.75%;top:9.208333333333334%;width:72.375%;height:1.46875%" data-text="I MET MANY TEAMS THAT UNDERESTIMATED THE PERILS AWAITING THEM THERE AND CONSEQUENTLY FAILED TO SURVIVE." onclick="showTextTooltip(event,this)" data-translation="CONHECI MUITAS EQUIPES QUE SUBESTIMARAM OS PERIGOS QUE OS AGUARDAVAM LÁ E CONSEQUENTEMENTE NÃO SOBREVIVERAM." data-tips="💡 'Consequently' é um **conector** que indica um resultado ou consequência de algo. - Exemplo: 'She forgot the meeting and, consequently, missed the opportunity.' (Ela esqueceu a reunião e, consequentemente, perdeu a oportunidade.)"></div><div class="text-hotspot" style="left:12.375%;top:11.385416666666668%;width:66.5%;height:1.7291666666666667%" data-text="WE MUST WORK ON OUR TEAMWORK FOR A FEW MORE DAYS ON THIS FLOOR AND THEN DECIDE IF ADVANCING IS A REALISTIC OPTION." onclick="showTextTooltip(event,this)" data-translation="DEVEMOS TRABALHAR EM NOSSO TRABALHO EM EQUIPE POR MAIS ALGUNS DIAS NESTE ANDAR E ENTÃO DECIDIR SE AVANÇAR É UMA OPÇÃO REALISTA." data-tips="💡 'Work on' é um **phrasal verb** que significa dedicar tempo e esforço para melhorar algo. - Exemplo: 'We need to work on our communication skills.' (Precisamos trabalhar nossas habilidades de comunicação.)"></div><div class="text-hotspot" style="left:3.125%;top:19.885416666666668%;width:80.75%;height:3.890625%" data-text="8 WITCH'S FOREST IS CONSIDERED BY MANY AS JUST A PLACE THROUGH WHICH ADVENTURERS PASS... DUE TO THE LACK OF CLEAR ADVANTAGE OF HUNTING THERE." onclick="showTextTooltip(event,this)" data-translation="8 A FLORESTA DA BRUXA É CONSIDERADA POR MUITOS APENAS COMO UM LUGAR PELO QUAL OS AVENTUREIROS PASSAM... DEVIDO À FALTA DE VANTAGEM CLARA DE CAÇAR LÁ." data-tips="💡 'Due to' é uma expressão que indica a causa de algo, similar a 'devido a'."></div><div class="text-hotspot" style="left:18.75%;top:31.364583333333336%;width:46%;height:.9635416666666667%" data-text="BUT THE DWARF IS STILL INSISTING ON GOING TO THE WITCH'S FOREST INSTEAD..." onclick="showTextTooltip(event,this)" data-translation="MAS O ANÃO AINDA ESTÁ INSISTINDO EM IR PARA A FLORESTA DA BRUXA EM VEZ DISSO..." data-tips="💡 'Instead' é usado para indicar uma alternativa, semelhante a 'em vez disso'."></div><div class="text-hotspot" style="left:47.375%;top:33.338541666666664%;width:36.5%;height:.6979166666666666%" data-text="BECAUSE THE FOURTH FLOOR IS THAT DANGEROUS." onclick="showTextTooltip(event,this)" data-translation="PORQUE O QUARTO ANDAR É TÃO PERIGOSO." data-tips="💡 'That dangerous' usa 'that' para enfatizar o grau de perigo."></div><div class="text-hotspot" style="left:13.875000000000002%;top:39.005208333333336%;width:54.50000000000001%;height:1.2239583333333333%" data-text="TIER-7 AND 8 MONSTERS APPEAR ON THE FOURTH FLOOR. THAT MUCH ISN'T DIFFERENT FROM THE THIRD." onclick="showTextTooltip(event,this)" data-translation="MONSTROS DE NÍVEL 7 E 8 APARECEM NO QUARTO ANDAR. ISSO NÃO É DIFERENTE DO TERCEIRO."></div><div class="text-hotspot" style="left:50%;top:40.71354166666667%;width:37.25%;height:.9375%" data-text="HOWEVER, A TIER-6 MONSTER WOULD SHOW UP RARELY." onclick="showTextTooltip(event,this)" data-translation="NO ENTANTO, UM MONSTRO DE NÍVEL 6 APARECERIA RARAMENTE."></div><div class="text-hotspot" style="left:8.75%;top:52.973958333333336%;width:62.875%;height:.96875%" data-text="CHANCES OF ENCOUNTERING ONE WOULD BE ONCE IN THREE DAYS, IF WE SPEND THE ENTIRE DAY LOOKING FOR IT." onclick="showTextTooltip(event,this)" data-translation="AS CHANCES DE ENCONTRAR UM SERIAM UMA VEZ A CADA TRÊS DIAS, SE PASSARMOS O DIA INTEIRO PROCURANDO POR ELE." data-tips="💡 A expressão &quot;**once in three days**&quot; usa uma construção que é comum em inglês para indicar frequência, similar a &quot;uma vez a cada três dias&quot; em português. Essa estrutura é útil para descrever a regularidade com que algo acontece.

- &quot;I visit my grandparents **once in two weeks**.&quot; (Eu visito meus avós uma vez a cada duas semanas.)
- &quot;She goes to the gym **once in a week**.&quot; (Ela vai à academia uma vez por semana.)"></div><div class="text-hotspot" style="left:18%;top:61.927083333333336%;width:64.125%;height:1.3958333333333286%" data-text="IF WE ACTIVELY HUNT ON THE FOURTH FLOOR FOR A FEW DAYS, WE WILL SURELY RUN INTO A TIER-6 MONSTER AT LEAST ONCE." onclick="showTextTooltip(event,this)" data-translation="SE CAÇARMOS ATIVAMENTE NO QUARTO ANDAR POR ALGUNS DIAS, CERTAMENTE ENCONTRAREMOS UM MONSTRO DE NÍVEL 6 PELO MENOS UMA VEZ." data-tips="💡 A expressão &quot;**run into**&quot; é um **phrasal verb** que significa encontrar alguém ou algo por acaso. Neste contexto, significa encontrar um monstro sem necessariamente procurá-lo ativamente.

- &quot;I **ran into** an old friend at the mall.&quot; (Encontrei um velho amigo no shopping.)
- &quot;We might **run into** traffic on the way.&quot; (Podemos encontrar trânsito no caminho.)"></div><div class="text-hotspot" style="left:24.125%;top:67.68229166666667%;width:50.74999999999999%;height:1.3489583333333333%" data-text="I LEARNED NOT TO MEDDLE WITH CHANCES LIKE THAT THE HARD WAY, ACROSS MANY PLAYTHROUGHS." onclick="showTextTooltip(event,this)" data-translation="APRENDI A NÃO ME ENVOLVER COM CHANCES ASSIM DA MANEIRA DIFÍCIL, EM MUITAS JOGADAS." data-tips="💡 A expressão &quot;**the hard way**&quot; é uma **expressão idiomática** que significa aprender através de experiência difícil ou dolorosa, em vez de uma maneira fácil ou direta.

- &quot;He learned **the hard way** not to ignore his health.&quot; (Ele aprendeu da maneira difícil a não ignorar sua saúde.)
- &quot;Sometimes, you have to learn lessons **the hard way**.&quot; (Às vezes, você tem que aprender lições da maneira difícil.)"></div><div class="text-hotspot" style="left:4%;top:70%;width:92%;height:.7447916666666667%" data-text="YOU DIED" onclick="showTextTooltip(event,this)" data-translation="VOCÊ MORREU"></div><div class="text-hotspot" style="left:.375%;top:71.05729166666667%;width:44%;height:1.21875%" data-text="DAMMIT!" onclick="showTextTooltip(event,this)" data-translation="MALDITO!"></div><div class="text-hotspot" style="left:52.25%;top:71.90625%;width:36.875%;height:.828125%" data-text="IT WAS SO CLOSE THIS TIME!!" onclick="showTextTooltip(event,this)" data-translation="FOI TÃO PERTO DESSA VEZ!!"></div><div class="text-hotspot" style="left:27.500000000000004%;top:77.88541666666666%;width:44.75%;height:.9583333333333333%" data-text="SO I KINDA UNDERSTAND WHERE THE DWARF IS COMING FROM, BUT..." onclick="showTextTooltip(event,this)" data-translation="ENTÃO EU MEIO QUE ENTENDO DE ONDE O ANÃO ESTÁ VINDO, MAS..." data-tips="💡 A expressão &quot;**kinda**&quot; é uma forma coloquial de dizer &quot;kind of&quot;, que significa &quot;meio que&quot; ou &quot;um pouco&quot;. É usada para suavizar ou indicar incerteza em uma afirmação.

- &quot;I'm **kinda** tired today.&quot; (Estou meio cansado hoje.)
- &quot;She's **kinda** interested in the job.&quot; (Ela está meio interessada no trabalho.)"></div><div class="text-hotspot" style="left:34.25%;top:84.265625%;width:32.125%;height:.19791666666666669%" data-text="HUKUROD." onclick="showTextTooltip(event,this)" data-translation="HUKUROD."></div><div class="text-hotspot" style="left:18.375%;top:89.41145833333334%;width:63.75%;height:1.2552083333333286%" data-text="I THINK WE NEED TO ADVANCE TO THE FOURTH FLOOR." onclick="showTextTooltip(event,this)" data-translation="EU ACHO QUE PRECISAMOS AVANÇAR PARA O QUARTO ANDAR." data-tips="💡 A estrutura &quot;**I think we need to...**&quot; é uma forma comum de expressar uma opinião ou sugestão de maneira educada. É frequentemente usada para introduzir uma ideia ou plano.

- &quot;**I think we need to** discuss this further.&quot; (Eu acho que precisamos discutir isso mais a fundo.)
- &quot;**I think we need to** save more money.&quot; (Eu acho que precisamos economizar mais dinheiro.)"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/40/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:64.875%;top:64.90593342981187%;width:33.625%;height:2.0260492040520983%" data-text="To Be Continued" onclick="showTextTooltip(event,this)" data-translation="Continua"></div><div class="text-hotspot" style="left:84%;top:73.51664254703329%;width:14.374999999999998%;height:1.2301013024602026%" data-text="revolution" onclick="showTextTooltip(event,this)" data-translation="revolução"></div><div class="text-hotspot" style="left:16.125%;top:77.71345875542693%;width:82.625%;height:21.418234442836464%" data-text="PRODUCED BY: MIDNIGHT STUDIO DIRECTED BY EMONG ART BY NEP ART ASSISTANCE BY JORIM BACKGROUND BY PASTRY COLORING BY TOAST COLORING ASSISTANCE BY HA NYANG, JI-EUN LEE BACKGROUND ASSISTANCE BY PHIL" onclick="showTextTooltip(event,this)" data-translation="PRODUZIDO POR: MIDNIGHT STUDIO DIRIGIDO POR EMONG ARTE POR NEP ASSISTÊNCIA DE ARTE POR JORIM FUNDO POR PASTRY COLORAÇÃO POR TOAST ASSISTÊNCIA DE COLORAÇÃO POR HA NYANG, JI-EUN LEE ASSISTÊNCIA DE FUNDO POR PHIL"></div></div><div id="pipeline-stage-header" style="position:fixed;top:0;left:0;width:100%;height:20px;background:rgba(0,0,0,.45);color:#fff;font:11px/20px sans-serif;text-align:center;z-index:9999;pointer-events:none">Ep. 40 — traduzido</div><div id="global-text-tooltip" class="text-tooltip" translate="no"></div><script>function markdownToHtml(t){function e(t){return function(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}(t.trim()).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(?:^|[^*])\*([^*]+)\*(?!\*)/g,function(t,e){return t.replace("*"+e+"*","<em>"+e+"</em>")}).replace(/_([^_]+)_/g,"<em>$1</em>")}const n=t.split(/\r?\n/);let
