ata-text="CHUCKLE" onclick="showTextTooltip(event,this)" data-translation="RISADINHA"></div><div class="text-hotspot" style="left:40.75%;top:94.53645833333333%;width:39%;height:.4427083333333333%" data-text="...HAVE GREAT CHEMISTRY." onclick="showTextTooltip(event,this)" data-translation="...TÊM UMA ÓTIMA QUÍMICA."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/70/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:4.625%;top:2.0572916666666665%;width:89.875%;height:2.6614583333333335%" data-text="SURVIVING THE GAME AS A BARBARIAN" onclick="showTextTooltip(event,this)" data-translation="SOBREVIVENDO AO JOGO COMO UM BÁRBARO" data-tips="💡 &quot;Sobrevivendo ao jogo como um bárbaro&quot; é uma frase que usa o gerúndio &quot;surviving&quot; para expressar uma ação contínua. **Estrutura gramatical:** O uso do gerúndio após preposições é comum em inglês. Por exemplo, &quot;She is interested in learning new languages.&quot;"></div><div class="text-hotspot" style="left:29.75%;top:4.989583333333333%;width:40.625%;height:.4635416666666667%" data-text="ART | MIDNIGHT STUDIO ADAPTATION | TEAM THE JICK ORIGINAL STORY | Jung Yoon-kang" onclick="showTextTooltip(event,this)" data-translation="ARTE | MIDNIGHT STUDIO ADAPTAÇÃO | EQUIPE THE JICK HISTÓRIA ORIGINAL | Jung Yoon-kang"></div><div class="text-hotspot" style="left:46.125%;top:6.052083333333334%;width:7.625%;height:.19270833333333334%" data-text="70" onclick="showTextTooltip(event,this)" data-translation="70"></div><div class="text-hotspot" style="left:29.25%;top:6.510416666666667%;width:41.875%;height:.18229166666666666%" data-text="SCUMBAG BOSS" onclick="showTextTooltip(event,this)" data-translation="CHEFE CANALHA"></div><div class="text-hotspot" style="left:7.5%;top:11.109375%;width:72.25%;height:1.9479166666666665%" data-text="POW" onclick="showTextTooltip(event,this)" data-translation="POW"></div><div class="text-hotspot" style="left:11.375%;top:18.052083333333332%;width:77.25%;height:.3854166666666667%" data-text="YOU HAVE DEFEATED FROST WOLF. YOU HAVE GAINED 1 EXP POINTS." onclick="showTextTooltip(event,this)" data-translation="VOCÊ DERROTOU O LOBO DE GELO. VOCÊ GANHOU 1 PONTO DE EXP."></div><div class="text-hotspot" style="left:23.75%;top:22.526041666666664%;width:52.25%;height:.953125%" data-text="WE ENTERED THE GLACIAL CAVE AND KILLED A COUNTLESS NUMBER OF FROST WOLVES." onclick="showTextTooltip(event,this)" data-translation="ENTRAMOS NA CAVERNA GLACIAL E MATAMOS UM NÚMERO INCONTÁVEL DE LOBOS DE GELO." data-tips="💡 &quot;Entramos na caverna glacial e matamos um número incontável de lobos de gelo.&quot; **Estrutura gramatical:** Note o uso do passado simples &quot;entered&quot; e &quot;killed&quot; para narrar ações concluídas. Em inglês, o passado simples é frequentemente usado para relatar eventos em sequência. Por exemplo, &quot;I woke up, brushed my teeth, and left the house.&quot;"></div><div class="text-hotspot" style="left:28.000000000000004%;top:39.276041666666664%;width:43.75%;height:.96875%" data-text="TO BE FAIR, THAT'S THE ONLY SPECIES THAT APPEARS IN THE FIRST CHAPTER." onclick="showTextTooltip(event,this)" data-translation="PARA SER JUSTO, ESSA É A ÚNICA ESPÉCIE QUE APARECE NO PRIMEIRO CAPÍTULO." data-tips="💡 &quot;Para ser justo&quot; é uma expressão usada para introduzir uma consideração ou justificativa. **Expressão idiomática:** &quot;To be fair&quot; é frequentemente usada para suavizar uma crítica ou apresentar um ponto de vista equilibrado. Por exemplo, &quot;To be fair, he did try his best.&quot;"></div><div class="text-hotspot" style="left:17%;top:43.385416666666664%;width:72.5%;height:2.114583333333333%" data-text="WOOSH" onclick="showTextTooltip(event,this)" data-translation="WOOSH"></div><div class="text-hotspot" style="left:2.75%;top:46.63541666666667%;width:4.625%;height:.18229166666666666%" data-text="*" onclick="showTextTooltip(event,this)" data-translation="*"></div><div class="text-hotspot" style="left:2.125%;top:50.79166666666667%;width:80.625%;height:2.2708333333333335%" data-text="SLASH" onclick="showTextTooltip(event,this)" data-translation="CORTAR"></div><div class="text-hotspot" style="left:27.375%;top:58.32291666666667%;width:45.375%;height:.7864583333333286%" data-text="MISSHA AND I DID MOST OF THE WORK HERE." onclick="showTextTooltip(event,this)" data-translation="MISSHA E EU FIZEMOS A MAIOR PARTE DO TRABALHO AQUI." data-tips="💡 Note que em inglês colocamos 'I' (eu) depois da outra pessoa ('Missha') em frases como 'Missha and I'."></div><div class="text-hotspot" style="left:35.125%;top:66.10416666666666%;width:32.625%;height:.8020833333333333%" data-text="BARK" onclick="showTextTooltip(event,this)" data-translation="LATIDO"></div><div class="text-hotspot" style="left:29.25%;top:76.828125%;width:41.375%;height:.6875%" data-text="THE BEAR MAN GOT A FEW KILLS AS WELL, BUT NOT AS MANY." onclick="showTextTooltip(event,this)" data-translation="O HOMEM URSO CONSEGUIU ALGUMAS MORTES TAMBÉM, MAS NÃO TANTAS." data-tips="💡 &quot;O homem urso conseguiu algumas mortes também, mas não tantas.&quot; **Estrutura gramatical:** O uso de &quot;not as many&quot; é uma forma de comparação. Em inglês, &quot;not as many&quot; é usado para comparar quantidades. Por exemplo, &quot;She has not as many books as her brother.&quot;"></div><div class="text-hotspot" style="left:27.750000000000004%;top:81.078125%;width:51.37500000000001%;height:1.3385416666666667%" data-text="POW" onclick="showTextTooltip(event,this)" data-translation="POW"></div><div class="text-hotspot" style="left:0;top:83.88020833333333%;width:61%;height:1.546875%" data-text="POW" onclick="showTextTooltip(event,this)" data-translation="POW"></div><div class="text-hotspot" style="left:74%;top:85.28645833333334%;width:20%;height:.53125%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:31.75%;top:86.171875%;width:49.625%;height:1.2083333333333286%" data-text="LOOKS LIKE HE CAN DEAL A LOT OF DAMAGE PER HIT, BUT LACKS AREA-OF-EFFECT SKILLS." onclick="showTextTooltip(event,this)" data-translation="PARECE QUE ELE PODE CAUSAR MUITO DANO POR GOLPE, MAS FALTA HABILIDADES DE ÁREA." data-tips="💡 &quot;Parece que ele pode causar muito dano por golpe, mas falta habilidades de área.&quot; **Vocabulário útil:** &quot;Deal a lot of damage&quot; é uma expressão comum em jogos para descrever causar dano significativo. **Estrutura gramatical:** &quot;But lacks&quot; mostra contraste e ausência de algo. Por exemplo, &quot;He is strong but lacks speed.&quot;"></div><div class="text-hotspot" style="left:20.5%;top:95.171875%;width:59.375%;height:1.03125%" data-text="I WAS LOW-KEY HOPING FOR SOMEONE TO STEP UP, BUT NOBODY DID." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA SECRETAMENTE ESPERANDO QUE ALGUÉM SE DESTACASSE, MAS NINGUÉM O FEZ." data-tips="💡 &quot;Eu estava secretamente esperando que alguém se destacasse, mas ninguém o fez.&quot; **Gíria / linguagem coloquial:** &quot;Low-key&quot; é uma gíria que significa discretamente ou sem chamar atenção. Uma alternativa mais formal seria &quot;secretly&quot;. Por exemplo, &quot;I was low-key hoping for a surprise party.&quot;"></div><div class="text-hotspot" style="left:33.5%;top:98.51041666666667%;width:50.625%;height:1.2291666666666665%" data-text="AFTER THE FIRST PILLAR APPEARS, IT'S LEFT, LEFT, RIGHT, RIGHT, LEFT, SEVEN STRAIGHTS, AND LEFT AGAIN." onclick="showTextTooltip(event,this)" data-translation="DEPOIS QUE O PRIMEIRO PILAR APARECE, É ESQUERDA, ESQUERDA, DIREITA, DIREITA, ESQUERDA, SETE RETOS, E ESQUERDA NOVAMENTE."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/70/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22%;top:6.963541666666667%;width:46.5%;height:.9375%" data-text="THIS CHAPTER CAN BE CLEARED WITHIN AN HOUR AS LONG AS YOU KNOW WHERE TO GO." onclick="showTextTooltip(event,this)" data-translation="ESSE CAPÍTULO PODE SER COMPLETADO EM UMA HORA, DESDE QUE VOCÊ SAIBA PARA ONDE IR." data-tips="💡 &quot;Esse capítulo pode ser completado em uma hora, desde que você saiba para onde ir.&quot; **Estrutura gramatical:** &quot;As long as&quot; é uma expressão usada para indicar uma condição necessária. Por exemplo, &quot;You can borrow my car as long as you return it by 6 PM.&quot;"></div><div class="text-hotspot" style="left:60.62499999999999%;top:8.421875%;width:20.75%;height:.671875%" data-text="NOT TOO DIFFICULT TO MEMORIZE EITHER." onclick="showTextTooltip(event,this)" data-translation="NÃO É MUITO DIFÍCIL DE MEMORIZAR TAMBÉM."></div><div class="text-hotspot" style="left:34.625%;top:11.723958333333332%;width:30.375000000000004%;height:.75%" data-text="TWO POSSIBILITIES HERE, I THINK." onclick="showTextTooltip(event,this)" data-translation="DUAS POSSIBILIDADES AQUI, EU ACHO."></div><div class="text-hotspot" style="left:15.125%;top:15.442708333333332%;width:69.5%;height:.9427083333333334%" data-text="THE MAFIA IS EITHER A PLAYER, OR PRETENDING NOT TO KNOW ANYTHING." onclick="showTextTooltip(event,this)" data-translation="A MÁFIA É OU UM JOGADOR, OU FINGE NÃO SABER DE NADA." data-tips="💡 &quot;A máfia é ou um jogador, ou finge não saber de nada.&quot; **Estrutura gramatical:** &quot;Either... or&quot; é uma estrutura usada para apresentar duas possibilidades. Por exemplo, &quot;You can either call me or send a message.&quot;"></div><div class="text-hotspot" style="left:23.375%;top:21.057291666666668%;width:31%;height:.703125%" data-text="THE STAIRS SEEM A BIT CREEPY." onclick="showTextTooltip(event,this)" data-translation="AS ESCADAS PARECEM UM POUCO ASSUSTADORAS." data-tips="💡 'A bit' é uma expressão informal que significa 'um pouco'."></div><div class="text-hotspot" style="left:50.375%;top:26.854166666666668%;width:33.375%;height:.4270833333333333%" data-text="MOVE ASIDE. I'M GOING." onclick="showTextTooltip(event,this)" data-translation="SAIA DO CAMINHO. EU VOU."></div><div class="text-hotspot" style="left:56.99999999999999%;top:33.796875%;width:35.125%;height:.9062499999999999%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:12.75%;top:36.359375%;width:29.5%;height:.75%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:66.875%;top:39.098958333333336%;width:28.125%;height:.6354166666666666%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:33.375%;top:39.880208333333336%;width:10.625%;height:.15625%" data-text="HMM." onclick="showTextTooltip(event,this)" data-translation="HMM."></div><div class="text-hotspot" style="left:45.375%;top:44.479166666666664%;width:32.5%;height:.9427083333333334%" data-text="THEY'RE EVEN BYPASSING THE HIDDEN FEATURE IN THE PILLAR." onclick="showTextTooltip(event,this)" data-translation="ELES ESTÃO ATÉ IGNORANDO O RECURSO OCULTO NO PILAR." data-tips="💡 &quot;Eles estão até ignorando o recurso oculto no pilar.&quot; **Phrasal verb:** &quot;Bypassing&quot; significa ignorar ou evitar algo de forma intencional. Por exemplo, &quot;He bypassed the security check.&quot;"></div><div class="text-hotspot" style="left:4.875%;top:45.958333333333336%;width:28.999999999999996%;height:.7604166666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:69.375%;top:48.296875%;width:28.125%;height:.7447916666666667%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:19.375%;top:53.13020833333333%;width:40.625%;height:.9635416666666667%" data-text="I GUESS IT'S TOO OBVIOUS TO BREAK THE PILLAR ALL OF A SUDDEN." onclick="showTextTooltip(e
