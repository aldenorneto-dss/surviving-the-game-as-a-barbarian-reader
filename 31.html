<!DOCTYPE html><html lang="en" data-stage="translated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>img{width:100%;margin-bottom:0;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}body{margin:0}.text-hotspot{position:absolute;cursor:pointer;background:rgba(255,255,0,0);border:1px solid transparent}.text-hotspot:hover{background:rgba(255,255,0,.15);border:1px solid rgba(255,200,0,.6)}.text-tooltip{position:absolute;z-index:1000;max-width:260px;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:text;display:none}</style><title>31</title></head><body><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/31/0.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:32.75%;top:7.385416666666666%;width:36%;height:.35416666666666663%" data-text="AAACK!" onclick="showTextTooltip(event,this)" data-translation="AAACK!"></div><div class="text-hotspot" style="left:10.875%;top:15.255208333333334%;width:19.75%;height:.49479166666666663%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:28.249999999999996%;top:15.796875%;width:15.25%;height:.39583333333333337%" data-text="PANT" onclick="showTextTooltip(event,this)" data-translation="OFEGANTE"></div><div class="text-hotspot" style="left:24.75%;top:23.15625%;width:50.75%;height:.84375%" data-text="BJORN! YOU'RE FINALLY AWAKE." onclick="showTextTooltip(event,this)" data-translation="BJORN! VOCÊ FINALMENTE ACORDOU."></div><div class="text-hotspot" style="left:30.125%;top:30.140625%;width:11%;height:.39583333333333337%" data-text="M" onclick="showTextTooltip(event,this)" data-translation="M"></div><div class="text-hotspot" style="left:38%;top:34%;width:24.25%;height:.6770833333333286%" data-text="I-IT LOOKS LIKE I MADE IT..." onclick="showTextTooltip(event,this)" data-translation="E-EU CONSEGUI..." data-tips="💡 &quot;Looks like&quot; é uma expressão usada para indicar que algo parece ser de uma certa maneira. Exemplo: &quot;It looks like it's going to rain.&quot;"></div><div class="text-hotspot" style="left:41.75%;top:39.369791666666664%;width:23.375%;height:.1875%" data-text="...AINAR." onclick="showTextTooltip(event,this)" data-translation="...AINAR."></div><div class="text-hotspot" style="left:12.25%;top:40.307291666666664%;width:36.875%;height:.4322916666666667%" data-text="WHAT ABOUT THE OTHERS?" onclick="showTextTooltip(event,this)" data-translation="E OS OUTROS?"></div><div class="text-hotspot" style="left:31.624999999999996%;top:46.140625%;width:32%;height:.7135416666666666%" data-text="THEY ALL LEFT THREE DAYS AGO!" onclick="showTextTooltip(event,this)" data-translation="TODOS ELES FORAM EMBORA HÁ TRÊS DIAS!" data-tips="💡 &quot;Left&quot; aqui é o passado do verbo &quot;leave&quot;, que significa &quot;partir&quot; ou &quot;ir embora&quot;. Em português, usamos &quot;foram embora&quot;."></div><div class="text-hotspot" style="left:47%;top:47.28645833333333%;width:37.625%;height:.9583333333333333%" data-text="BUT FORGET THAT. HOW ARE YOU FEELING?" onclick="showTextTooltip(event,this)" data-translation="MAS ESQUECE ISSO. COMO VOCÊ ESTÁ SE SENTINDO?" data-tips="💡 &quot;Forget that&quot; é uma forma casual de dizer &quot;não se preocupe com isso&quot; ou &quot;deixa pra lá&quot;."></div><div class="text-hotspot" style="left:19%;top:52.1875%;width:62.125%;height:1.703125%" data-text="I WAS REALLY WORRIED BECAUSE YOU WERE UNCONSCIOUS FOR THREE STRAIGHT DAYS!" onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA REALMENTE PREOCUPADO PORQUE VOCÊ FICOU INCONSCIENTE POR TRÊS DIAS SEGUIDOS!" data-tips="💡 &quot;Straight&quot; em &quot;three straight days&quot; significa &quot;consecutivos&quot; ou &quot;seguidos&quot;. É uma forma de enfatizar a continuidade."></div><div class="text-hotspot" style="left:71.25%;top:57.52604166666667%;width:6.875000000000001%;height:.3229166666666667%" data-text="6" onclick="showTextTooltip(event,this)" data-translation="6"></div><div class="text-hotspot" style="left:76.25%;top:59.921875%;width:6.5%;height:.2864583333333333%" data-text="!!" onclick="showTextTooltip(event,this)" data-translation="!!"></div><div class="text-hotspot" style="left:19.625%;top:64.79166666666667%;width:26.875%;height:.4322916666666667%" data-text="IT'S BEEN THREE DAYS?!" onclick="showTextTooltip(event,this)" data-translation="JÁ FAZ TRÊS DIAS?!"></div><div class="text-hotspot" style="left:62%;top:65.890625%;width:5.25%;height:.18229166666666666%" data-text="??" onclick="showTextTooltip(event,this)" data-translation="??"></div><div class="text-hotspot" style="left:2%;top:66.23958333333333%;width:54.37499999999999%;height:1.28125%" data-text="RISE" onclick="showTextTooltip(event,this)" data-translation="LEVANTAR"></div><div class="text-hotspot" style="left:47%;top:73.61458333333334%;width:40%;height:.7083333333333333%" data-text="DOES THAT MEAN IT'S DAY SEVEN ALREADY TODAY?!" onclick="showTextTooltip(event,this)" data-translation="ISSO SIGNIFICA QUE HOJE JÁ É O SÉTIMO DIA?!" data-tips="💡 &quot;Already&quot; é usado para enfatizar que algo aconteceu antes ou mais cedo do que esperado. Exemplo: &quot;He's already finished his homework.&quot;"></div><div class="text-hotspot" style="left:10.375%;top:78.46875%;width:15.5%;height:.30729166666666663%" data-text="FOLD" onclick="showTextTooltip(event,this)" data-translation="DOBRAR"></div><div class="text-hotspot" style="left:70.625%;top:79.47916666666667%;width:23.125%;height:.34375%" data-text="UNFOLD" onclick="showTextTooltip(event,this)" data-translation="DESDOBRAR"></div><div class="text-hotspot" style="left:22.125%;top:86.78645833333334%;width:35.75%;height:.6822916666666666%" data-text="I DON'T FEEL ANY PHYSICAL PAIN OR DISCOMFORT." onclick="showTextTooltip(event,this)" data-translation="NÃO SINTO NENHUMA DOR OU DESCONFORTO FÍSICO." data-tips="💡 &quot;Discomfort&quot; é uma palavra útil que significa &quot;desconforto&quot;. É frequentemente usada em contextos médicos ou de saúde."></div><div class="text-hotspot" style="left:38.25%;top:94.24479166666667%;width:40.5%;height:.6875%" data-text="NOT TO MENTION THE LACK OF VISIBLE WOUNDS--" onclick="showTextTooltip(event,this)" data-translation="SEM CONTAR A FALTA DE FERIMENTOS VISÍVEIS--"></div><div class="text-hotspot" style="left:41.625%;top:99.22916666666667%;width:10.625%;height:.3125%" data-text="?!" onclick="showTextTooltip(event,this)" data-translation="?!"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/31/1.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:22.125%;top:5.776041666666667%;width:16.75%;height:.171875%" data-text="AINAR." onclick="showTextTooltip(event,this)" data-translation="AINAR."></div><div class="text-hotspot" style="left:25.874999999999996%;top:8.854166666666668%;width:47.375%;height:.9166666666666666%" data-text="WHAT HAPPENED TO MY PANTS?" onclick="showTextTooltip(event,this)" data-translation="O QUE ACONTECEU COM MINHAS CALÇAS?"></div><div class="text-hotspot" style="left:7.000000000000001%;top:15.723958333333332%;width:86.625%;height:1.4010416666666665%" data-text="DA DUN" onclick="showTextTooltip(event,this)" data-translation="DA DUN"></div><div class="text-hotspot" style="left:10.625%;top:21.875%;width:49.625%;height:1.4687499999999964%" data-text="IT LITERALLY BECAME A PIECE OF RAG FROM THE BATTLE, SO I THREW IT OUT." onclick="showTextTooltip(event,this)" data-translation="ELAS LITERALMENTE VIRARAM UM TRAPO NA BATALHA, ENTÃO JOGUEI FORA." data-tips="💡 &quot;Rag&quot; é uma palavra que se refere a um pedaço de tecido velho ou desgastado, usado muitas vezes para limpeza."></div><div class="text-hotspot" style="left:78.875%;top:24.078125%;width:5.25%;height:.036458333333333336%" data-text="..." onclick="showTextTooltip(event,this)" data-translation="..."></div><div class="text-hotspot" style="left:19%;top:32.01041666666667%;width:45.25%;height:.7604166666666667%" data-text="THERE'S NO NEED TO BE EMBARRASSED!" onclick="showTextTooltip(event,this)" data-translation="NÃO PRECISA FICAR ENVERGONHADO!" data-tips="💡 &quot;There's no need to&quot; é uma estrutura usada para indicar que algo não é necessário. Exemplo: &quot;There's no need to hurry.&quot;"></div><div class="text-hotspot" style="left:34.625%;top:33.526041666666664%;width:51.125%;height:1.0364583333333357%" data-text="YOU WERE INDEED A GREAT WARRIOR, BJORN!!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ FOI REALMENTE UM GRANDE GUERREIRO, BJORN!!"></div><div class="text-hotspot" style="left:45.375%;top:35.75%;width:22.625%;height:.49479166666666663%" data-text="SWISH" onclick="showTextTooltip(event,this)" data-translation="SWISH"></div><div class="text-hotspot" style="left:30.875000000000004%;top:38.916666666666664%;width:38.5%;height:.8750000000000001%" data-text="UGH" onclick="showTextTooltip(event,this)" data-translation="UGH"></div><div class="text-hotspot" style="left:32.25%;top:42.16666666666667%;width:35.25%;height:.6041666666666666%" data-text="STOP IT, YOU FOOL!" onclick="showTextTooltip(event,this)" data-translation="PARE COM ISSO, SEU IDIOTA!"></div><div class="text-hotspot" style="left:33.375%;top:47.932291666666664%;width:48.5%;height:1.203125000000007%" data-text="... CAN YOU TELL ME EXACTLY WHAT HAPPENED WHILE I WAS KNOCKED OUT?" onclick="showTextTooltip(event,this)" data-translation="... PODE ME DIZER EXATAMENTE O QUE ACONTECEU ENQUANTO EU ESTAVA DESMAIADO?" data-tips="💡 &quot;Knocked out&quot; é uma expressão informal que significa &quot;desmaiado&quot; ou &quot;inconsciente&quot;. É frequentemente usada em contextos de luta ou esportes."></div><div class="text-hotspot" style="left:48.5%;top:53.364583333333336%;width:3.875%;height:.09895833333333334%" data-text="OMI" onclick="showTextTooltip(event,this)" data-translation="OMI"></div><div class="text-hotspot" style="left:17%;top:55.322916666666664%;width:51.875%;height:1.250000000000007%" data-text="THE DWARF TOOK SOMETHING CALLED A NUMBERED ITEM," onclick="showTextTooltip(event,this)" data-translation="O ANÃO PEGOU ALGO CHAMADO ITEM NUMERADO,"></div><div class="text-hotspot" style="left:37.125%;top:57.26041666666667%;width:42.125%;height:.6822916666666666%" data-text="AND THE MAGE TOOK THE RIFT STONE!" onclick="showTextTooltip(event,this)" data-translation="E O MAGO PEGOU A PEDRA DO RIFT!"></div><div class="text-hotspot" style="left:23.75%;top:63.020833333333336%;width:52.37500000000001%;height:.9583333333333333%" data-text="THE FACT THAT I'M ALIVE MEANS I CONSUMED THE ESSENCE OF THE GUARDIAN." onclick="showTextTooltip(event,this)" data-translation="O FATO DE EU ESTAR VIVO SIGNIFICA QUE CONSUMI A ESSÊNCIA DO GUARDIÃO." data-tips="💡 &quot;Means&quot; é um verbo que pode ser traduzido como &quot;significa&quot; ou &quot;quer dizer&quot;. É muito comum em explicações ou deduções."></div><div class="text-hotspot" style="left:14.000000000000002%;top:64.84375%;width:11.375%;height:.9635416666666667%" data-text="bei" onclick="showTextTooltip(event,this)" data-translation="bei"></div><div class="text-hotspot" style="left:29.125%;top:72.24479166666666%;width:27.75%;height:.427083333333357%" data-text="SO THE GUARDIAN" onclick="showTextTooltip(event,this)" data-translation="ENTÃO O GUARDIÃO"></div><div class="text-hotspot" style="left:27.500000000000004%;top:72.50520833333334%;width:44.625%;height:.9427083333333286%" data-text="DROPPED ALL THREE RARE LOOT AS IT PERISHED, THEN." onclick="showTextTooltip(event,this)" data-translation="DEIXOU TODOS OS TRÊS SAQUES RAROS QUANDO PERECEU, ENTÃO."></div><div class="text-hotspot" style="left:13.750000000000002%;top:84.84895833333333%;width:72.375%;height:1.2083333333333428%" data-text="BY THE WAY. WEREN'T WE SUPPOSED TO ROLL DICE TO DETERMINE WHO GETS TO TAKE THE RIFT STONE?" onclick="showTextTooltip(event,this)" data-translation="A PROPÓSITO. NÃO DEVERÍAMOS ROLAR DADOS PARA DETERMINAR QUEM FICARIA COM A PEDRA DO RIFT?" data-tips="💡 &quot;By the way&quot; é uma expressão usada para introduzir um novo tópico ou lembrar de algo. Equivalente a &quot;a propósito&quot; em português."></div><div class="text-hotspot" style="left:22.625%;top:90.109375%;width:50.625%;height:1.2135416666666714%" data-text="BUT WE DIDN'T BECAUSE THE MAGE WAS BEING ABSOLUTELY UNREASONABLE!!" onclick="showTextTooltip(event,this)" data-translation="MAS NÃO FIZEMOS ISSO PORQUE O MAGO ESTAVA SENDO TOTALMENTE IRRACIONAL!!" data-tips="💡 &quot;Unreasonable&quot; significa &quot;irracional&quot; ou &quot;sem razão&quot;. É usado para descrever comportamento que não faz sentido ou que é injusto."></div><div class="text-hotspot" style="left:45.75%;top:94.24479166666667%;width:40.625%;height:1.2239583333333333%" data-text="I NEED TO TAKE AT LEAST THIS TO MAKE UP FOR THE LOSSES." onclick="showTextTooltip(event,this)" data-translation="PRECISO PEGAR PELO MENOS ISSO PARA COMPENSAR AS PERDAS." data-tips="💡 &quot;Make up for&quot; é um phrasal verb que significa &quot;compensar&quot;. Exemplo: &quot;He worked extra hours to make up for the lost time.&quot;"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/31/2.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:11.25%;top:1.5%;width:43%;height:.6822916666666666%" data-text="DO AS YOU WISH. I GOT NO OBJECTIONS." onclick="showTextTooltip(event,this)" data-translation="FAÇA O QUE QUISER. NÃO TENHO OBJEÇÕES." data-tips="💡 &quot;Got no objections&quot; é uma forma informal de dizer &quot;não tenho objeções&quot;. A forma mais formal seria &quot;I have no objections.&quot;"></div><div class="text-hotspot" style="left:9.625%;top:2.734375%;width:17.125%;height:.5833333333333334%" data-text="I DON'T DESERVE TO..." onclick="showTextTooltip(event,this)" data-translation="EU NÃO MEREÇO..."></div><div class="text-hotspot" style="left:40%;top:7.338541666666666%;width:49.25%;height:1.223958333333334%" data-text="THE DWARF SAID HE DIDN'T REALLY CARE, BUT I INSISTED ON ROLLING DICE." onclick="showTextTooltip(event,this)" data-translation="O ANÃO DISSE QUE NÃO SE IMPORTAVA MUITO, MAS EU INSISTI EM ROLAR OS DADOS."></div><div class="text-hotspot" style="left:12.125%;top:8.885416666666666%;width:40.625%;height:1.2135416666666679%" data-text="THAT WAS WHEN THE MAGE SAID SOMETHING STRANGE." onclick="showTextTooltip(event,this)" data-translation="FOI QUANDO O MAGO DISSE ALGO ESTRANHO." data-tips="💡 &quot;Strange&quot; é uma palavra útil que significa &quot;estranho&quot; ou &quot;esquisito&quot;. É usada para descrever algo incomum ou inesperado."></div><div class="text-hotspot" style="left:10%;top:14.359375%;width:51%;height:.9895833333333333%" data-text="MR. BJORN ALREADY ACQUIRED THE BEST ITEM TO BE DROPPED," onclick="showTextTooltip(event,this)" data-translation="O SR. BJORN JÁ ADQUIRIU O MELHOR ITEM QUE PODERIA SER DEIXADO," data-tips="💡 &quot;Acquired&quot; é um verbo formal que significa &quot;adquiriu&quot; ou &quot;obteve&quot;. É frequentemente usado em contextos de negócios ou acadêmicos."></div><div class="text-hotspot" style="left:38.25%;top:15.828125000000002%;width:50.375%;height:.9427083333333334%" data-text="SO HE WON'T SAY ANYTHING AGAINST ME TAKING THE RIFT STONE!" onclick="showTextTooltip(event,this)" data-translation="ENTÃO ELE NÃO VAI DIZER NADA CONTRA EU PEGAR A PEDRA DO RIFT!"></div><div class="text-hotspot" style="left:34.125%;top:23.583333333333336%;width:5.5%;height:.2864583333333333%" data-text="OAAL" onclick="showTextTooltip(event,this)" data-translation="OAAL"></div><div class="text-hotspot" style="left:43.25%;top:25.067708333333332%;width:21.625%;height:.19270833333333334%" data-text="THAT'S" onclick="showTextTooltip(event,this)" data-translation="ISSO É"></div><div class="text-hotspot" style="left:33.25%;top:25.203125%;width:33.375%;height:.703125%" data-text="... WHAT SHE SAID." onclick="showTextTooltip(event,this)" data-translation="... O QUE ELA DISSE."></div><div class="text-hotspot" style="left:26.375%;top:33.036458333333336%;width:47.25%;height:1.4635416666666572%" data-text="HMM. IT LOOKS LIKE SHE'S THE ONLY PERSON THAT REALIZED I TOOK THE ESSENCE OF THE VAMPIRE DUKE." onclick="showTextTooltip(event,this)" data-translation="HMM. PARECE QUE ELA É A ÚNICA PESSOA QUE PERCEBEU QUE EU PEGUEI A ESSÊNCIA DO DUQUE VAMPIRO." data-tips="💡 &quot;Realized&quot; significa &quot;percebeu&quot; ou &quot;compreendeu&quot;. Não confundir com &quot;realizar&quot;, que em inglês é &quot;accomplish&quot;."></div><div class="text-hotspot" style="left:10.25%;top:50%;width:47.75%;height:1.2291666666666665%" data-text="THAT'S NOT ALL. SHE USED THE ESSENCE OF THE UNDEAD GOLEM AND SO MANY POTIONS ON ME." onclick="showTextTooltip(event,this)" data-translation="ISSO NÃO É TUDO. ELA USOU A ESSÊNCIA DO GOLEM MORTO-VIVO E TANTAS POÇÕES EM MIM."></div><div class="text-hotspot" style="left:49.875%;top:52.015625%;width:36%;height:.953125%" data-text="IT'S FAIR TO SAY SHE INCURRED HEAVY LOSSES TO KEEP ME ALIVE." onclick="showTextTooltip(event,this)" data-translation="É JUSTO DIZER QUE ELA TEVE GRANDES PERDAS PARA ME MANTER VIVO." data-tips="💡 &quot;Incurred&quot; é um verbo formal que significa &quot;sofreu&quot; ou &quot;teve&quot; (no sentido de perdas ou custos)."></div><div class="text-hotspot" style="left:22.125%;top:61.416666666666664%;width:56.00000000000001%;height:.9635416666666667%" data-text="I REALLY DON'T HAVE ANY COMPLAINTS AGAINST THE MAGE IN TERMS OF LOOT DISTRIBUTION." onclick="showTextTooltip(event,this)" data-translation="REALMENTE NÃO TENHO NENHUMA RECLAMAÇÃO CONTRA O MAGO EM TERMOS DE DISTRIBUIÇÃO DE SAQUES." data-tips="💡 &quot;Complaints&quot; é um substantivo que significa &quot;reclamações&quot;. É usado para expressar descontentamento ou insatisfação."></div><div class="text-hotspot" style="left:40.125%;top:67.671875%;width:44.125%;height:1.4843749999999858%" data-text="SHE WALKED AROUND ALONE AFTER YOU FELL AND PICKED UP ITEMS HERE AND THERE," onclick="showTextTooltip(event,this)" data-translation="ELA ANDOU SOZINHA DEPOIS QUE VOCÊ CAIU E PEGOU ITENS AQUI E ALI,"></div><div class="text-hotspot" style="left:13.25%;top:69.796875%;width:58.5%;height:1.4791666666666667%" data-text="AND LEFT THROUGH THE PORTAL BEFORE YOU EVEN WOKE UP! WHAT AN UNGRATEFUL LITTLE THING!" onclick="showTextTooltip(event,this)" data-translation="E SAIU PELO PORTAL ANTES MESMO DE VOCÊ ACORDAR! QUE COISINHA INGRATA!" data-tips="💡 &quot;Ungrateful&quot; significa &quot;ingrato&quot;. É usado para descrever alguém que não aprecia o que foi feito por ele."></div><div class="text-hotspot" style="left:94.125%;top:69.83333333333334%;width:5.75%;height:.28125%" data-text="All" onclick="showTextTooltip(event,this)" data-translation="Todos"></div><div class="text-hotspot" style="left:5.875%;top:73.38541666666667%;width:56.375%;height:.4270833333333333%" data-text="FUME FUME" onclick="showTextTooltip(event,this)" data-translation="FUME FUME"></div><div class="text-hotspot" style="left:15.625%;top:77.63541666666667%;width:34.125%;height:.9479166666666667%" data-text="ARE ALL MAGES THAT SELFISH AND GREEDY?!" onclick="showTextTooltip(event,this)" data-translation="TODOS OS MAGOS SÃO TÃO EGOÍSTAS E GANANCIOSOS?!" data-tips="💡 &quot;Selfish&quot; e &quot;greedy&quot; são adjetivos que significam &quot;egoísta&quot; e &quot;ganancioso&quot;, respectivamente. São usados para descrever características negativas de personalidade."></div><div class="text-hotspot" style="left:44.5%;top:79.765625%;width:36.125%;height:1.2083333333333333%" data-text="BUT I SUPPOSE I WOUND HAVE TO AGREE WITH AINAR SINCE ARUA ISN'T AROUND." onclick="showTextTooltip(event,this)" data-translation="MAS SUPONHO QUE TENHA QUE CONCORDAR COM AINAR JÁ QUE ARUA NÃO ESTÁ POR PERTO."></div><div class="text-hotspot" style="left:14.625%;top:85.40625%;width:42.25%;height:.9635416666666667%" data-text="THANKS! I'M SO BLESSED TO HAVE YOU BY MY SIDE." onclick="showTextTooltip(event,this)" data-translation="OBRIGADO! SOU TÃO ABENÇOADO POR TER VOCÊ AO MEU LADO." data-tips="💡 &quot;Blessed&quot; é uma palavra que significa &quot;abençoado&quot;. É frequentemente usada em contextos religiosos ou para expressar gratidão."></div><div class="text-hotspot" style="left:15.875%;top:87.69270833333334%;width:35%;height:1.0833333333333335%" data-text="TAP" onclick="showTextTooltip(event,this)" data-translation="TAP"></div><div class="text-hotspot" style="left:24.5%;top:92.68229166666667%;width:57.625%;height:.8385416666666572%" data-text="ANY TIME! WE ARE COMPANIONS, BJORN!!" onclick="showTextTooltip(event,this)" data-translation="A QUALQUER MOMENTO! SOMOS COMPANHEIROS, BJORN!!"></div><div class="text-hotspot" style="left:15%;top:98.20833333333333%;width:38.125%;height:.7083333333333333%" data-text="CAN WE LEAVE THE RIFT, TOO?" onclick="showTextTooltip(event,this)" data-translation="PODEMOS SAIR DO RIFT TAMBÉM?"></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/31/3.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:29.25%;top:6.223958333333333%;width:58.75%;height:.9635416666666661%" data-text="NOT YET. THERE'S SOMETHING WE GOTTA DO BEFORE LEAVING." onclick="showTextTooltip(event,this)" data-translation="AINDA NÃO. TEM ALGO QUE PRECISAMOS FAZER ANTES DE SAIR." data-tips="💡 &quot;Gotta&quot; é uma forma informal de &quot;got to&quot;, que significa &quot;precisar&quot; ou &quot;ter que&quot;. Exemplo: &quot;I gotta go now.&quot;"></div><div class="text-hotspot" style="left:25.75%;top:12.166666666666668%;width:37.875%;height:1.21875%" data-text="THERE PROBABLY AREN'T MANY ITEMS LEFT IN THE AREA BECAUSE OF THE MAGE," onclick="showTex
