RTE INFERIOR."></div><div class="text-hotspot" style="left:39.625%;top:28.354166666666668%;width:49%;height:.953125%" data-text="I SPOKE WITH THE MANAGEMENT AND GOT IT TAKEN CARE OF." onclick="showTextTooltip(event,this)" data-translation="EU FALEI COM A ADMINISTRAÇÃO E RESOLVI ISSO." data-tips="💡 &quot;Got it taken care of&quot; é uma expressão que indica que algo foi resolvido. É uma forma mais casual de dizer que você cuidou de uma situação ou problema. - I **got the problem taken care of** before the meeting. - She **got the issue taken care of** quickly."></div><div class="text-hotspot" style="left:11.125%;top:30.114583333333332%;width:66.625%;height:.9583333333333357%" data-text="CONSIDERING THAT YOUR TEAM EXPERIENCED SOMETHING UNUSUAL." onclick="showTextTooltip(event,this)" data-translation="CONSIDERANDO QUE SUA EQUIPE PASSOU POR ALGO INUSITADO." data-tips="💡 &quot;Considering that&quot; é uma expressão usada para introduzir uma razão ou justificativa. É semelhante a &quot;considerando que&quot; em português. - **Considering that** it's raining, we should stay indoors. - **Considering that** he is new, he did a great job."></div><div class="text-hotspot" style="left:14.249999999999998%;top:34.380208333333336%;width:25.624999999999996%;height:.4322916666666667%" data-text="UNUSUAL, EH?" onclick="showTextTooltip(event,this)" data-translation="INUSITADO, É?"></div><div class="text-hotspot" style="left:58.875%;top:36.9375%;width:20.125%;height:.6197916666666666%" data-text="HMM" onclick="showTextTooltip(event,this)" data-translation="HMM"></div><div class="text-hotspot" style="left:38.75%;top:40.375%;width:23.625%;height:.6822916666666643%" data-text="TO BE FAIR, WE ALMOST DIED." onclick="showTextTooltip(event,this)" data-translation="PARA SER JUSTO, QUASE MORREMOS." data-tips="💡 &quot;To be fair&quot; é uma expressão usada para introduzir uma consideração equilibrada ou justificativa. É semelhante a &quot;para ser justo&quot; em português. - **To be fair**, she - She chose tea instead of coffee."></div><div class="text-hotspot" style="left:37.5%;top:97.91666666666666%;width:50.24999999999999%;height:1.0520833333333333%" data-text="THEY TOOK AWAY MY PERMIT TO EXPLORE THE LABYRINTH." onclick="showTextTooltip(event,this)" data-translation="ELES TIRARAM MINHA LICENÇA PARA EXPLORAR O LABIRINTO."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/60/9.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:25.25%;top:5.78125%;width:39%;height:.9427083333333334%" data-text="THAT IS TERRIBLE. WE HAVE ONLY NINE OR SO DAYS FOR THE NEXT ONE." onclick="showTextTooltip(event,this)" data-translation="ISSO É TERRÍVEL. TEMOS APENAS NOVE OU DEZ DIAS PARA O PRÓXIMO."></div><div class="text-hotspot" style="left:14.875%;top:9.932291666666666%;width:70.375%;height:.6927083333333334%" data-text="NOTHING IS EVER EASY IN MY LIFE. FOR REAL." onclick="showTextTooltip(event,this)" data-translation="NADA É FÁCIL NA MINHA VIDA. DE VERDADE."></div><div class="text-hotspot" style="left:30.5%;top:19.489583333333332%;width:38.75%;height:.6770833333333334%" data-text="WE DECIDED TO DISCUSS THIS AGAIN THE NEXT DAY." onclick="showTextTooltip(event,this)" data-translation="DECIDIMOS DISCUTIR ISSO NOVAMENTE NO DIA SEGUINTE."></div><div class="text-hotspot" style="left:13.750000000000002%;top:21.822916666666668%;width:11.375%;height:.13541666666666669%" data-text="LATER." onclick="showTextTooltip(event,this)" data-translation="MAIS TARDE."></div><div class="text-hotspot" style="left:72.125%;top:22.036458333333332%;width:25.75%;height:.30729166666666663%" data-text="LET'S GET ANOTHER DRINK." onclick="showTextTooltip(event,this)" data-translation="VAMOS PEGAR OUTRA BEBIDA."></div><div class="text-hotspot" style="left:28.999999999999996%;top:25.395833333333336%;width:44.75%;height:.9427083333333334%" data-text="I NEED TO HEAD TO THE LIBRARY. YOU SHOULD GO BACK TOO." onclick="showTextTooltip(event,this)" data-translation="EU PRECISO IR À BIBLIOTECA. VOCÊ DEVERIA VOLTAR TAMBÉM." data-tips="💡 'Head to' é uma expressão informal que significa ir para um lugar. Pode ser substituída por 'go to' em contextos mais formais."></div><div class="text-hotspot" style="left:16.375%;top:30.390625%;width:43.75%;height:.6822916666666666%" data-text="LIBRARY AT THIS TIME OF THE DAYYYY?" onclick="showTextTooltip(event,this)" data-translation="BIBLIOTECA A ESSA HORA DO DIA?"></div><div class="text-hotspot" style="left:34.875%;top:36.71875%;width:53.875%;height:.9479166666666714%" data-text="YEAH. I HAVE BUSINESS WITH THE LIBRARIAN FROM YESTERDAY." onclick="showTextTooltip(event,this)" data-translation="SIM. EU TENHO NEGÓCIOS COM A BIBLIOTECÁRIA DE ONTEM." data-tips="💡 'Business with' refere-se a ter algo a tratar ou resolver com alguém, não necessariamente relacionado a negócios comerciais."></div><div class="text-hotspot" style="left:72.875%;top:38.036458333333336%;width:17.125%;height:.140625%" data-text="SEE-YOU." onclick="showTextTooltip(event,this)" data-translation="ATÉ MAIS."></div><div class="text-hotspot" style="left:15.875%;top:40.578125%;width:37.625%;height:.953125%" data-text="...D-DO YOU WANT ME TO KEEP YOU COMPANYYY?" onclick="showTextTooltip(event,this)" data-translation="...VOCÊ QUER QUE EU TE FAÇA COMPANHIA?"></div><div class="text-hotspot" style="left:12.875%;top:42.484375%;width:29.5%;height:.5260416666666666%" data-text="RUSH" onclick="showTextTooltip(event,this)" data-translation="CORRER"></div><div class="text-hotspot" style="left:58.12500000000001%;top:42.59895833333333%;width:27.125%;height:.6875%" data-text="IT'S OKAY. GET SOME REST." onclick="showTextTooltip(event,this)" data-translation="TUDO BEM. DESCANSE UM POUCO."></div><div class="text-hotspot" style="left:7.875%;top:48.95833333333333%;width:48.375%;height:.9635416666666667%" data-text="IT'S NOT LIKE I HAVE SOMETHING TO DO ANYWAYYYS..." onclick="showTextTooltip(event,this)" data-translation="NÃO É COMO SE EU TIVESSE ALGO PARA FAZER DE QUALQUER MANEIRA..." data-tips="💡 A expressão &quot;it's not like&quot; é usada para **minimizar** ou **contradizer** uma ideia, geralmente de forma casual. 
- It's not like I don't want to help, but I'm really busy.
- It's not like we have a choice in the matter."></div><div class="text-hotspot" style="left:24.75%;top:54.296875%;width:54.625%;height:1.15625%" data-text="OF COURSE YOU DO! TRAIN WITH YOUR WEAPON IN THE MEANTIME!" onclick="showTextTooltip(event,this)" data-translation="CLARO QUE TEM! TREINE COM SUA ARMA ENQUANTO ISSO!" data-tips="💡 'In the meantime' é uma expressão que indica o que fazer enquanto se espera algo. Em português, seria 'enquanto isso'."></div><div class="text-hotspot" style="left:64.875%;top:56.125%;width:27.750000000000004%;height:.328125%" data-text="YOU DIDN'T DO ANYTHING TODAY!" onclick="showTextTooltip(event,this)" data-translation="VOCÊ NÃO FEZ NADA HOJE!"></div><div class="text-hotspot" style="left:56.75%;top:57.072916666666664%;width:28.749999999999996%;height:.6458333333333334%" data-text="TURN" onclick="showTextTooltip(event,this)" data-translation="VIRAR"></div><div class="text-hotspot" style="left:32.75%;top:59.95312499999999%;width:29.375%;height:.7395833333333334%" data-text="DROOP" onclick="showTextTooltip(event,this)" data-translation="CAIR"></div><div class="text-hotspot" style="left:51%;top:62.088541666666664%;width:32.625%;height:.16145833333333334%" data-text="O-OKAYYY..." onclick="showTextTooltip(event,this)" data-translation="O-OKAY..."></div><div class="text-hotspot" style="left:22.625%;top:66.43229166666667%;width:46.875%;height:.953125%" data-text="I WAS INITIALLY PLANNING TO REST UP TODAY AND VISIT THE LIBRARY TOMORROW..." onclick="showTextTooltip(event,this)" data-translation="EU ESTAVA INICIALMENTE PLANEJANDO DESCANSAR HOJE E VISITAR A BIBLIOTECA AMANHÃ..." data-tips="💡 Em português, poderíamos dizer algo como &quot;Eu estava pensando em descansar hoje e ir à biblioteca amanhã...&quot;. 

- **Estrutura gramatical**: A frase usa o **past continuous** (I was planning) para indicar uma intenção ou plano que estava em andamento no passado.
- **Exemplo**: I was planning to call you, but I forgot. / She was planning to travel, but her plans changed."></div><div class="text-hotspot" style="left:42%;top:68.05208333333333%;width:29.25%;height:.6458333333333334%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:60.12499999999999%;top:70.65104166666667%;width:35.125%;height:.75%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:32.375%;top:74.109375%;width:34.625%;height:.8072916666666667%" data-text="...BUT THE SITUATION HAS CHANGED." onclick="showTextTooltip(event,this)" data-translation="...MAS A SITUAÇÃO MUDOU." data-tips="💡 Em português, seria comum dizer &quot;mas as coisas mudaram&quot;.

- **Exemplo**: The weather has changed since this morning. / Our plans have changed due to the new information."></div><div class="text-hotspot" style="left:12.125%;top:84.04166666666667%;width:27.125%;height:.5104166666666666%" data-text="CREAK" onclick="showTextTooltip(event,this)" data-translation="CREAK"></div><div class="text-hotspot" style="left:53.125%;top:86.9375%;width:23.875%;height:.6822916666666714%" data-text="STEP ))" onclick="showTextTooltip(event,this)" data-translation="PASSO ))"></div><div class="text-hotspot" style="left:22.375%;top:89.21354166666666%;width:28.999999999999996%;height:.578125%" data-text="STEP" onclick="showTextTooltip(event,this)" data-translation="PASSO"></div><div class="text-hotspot" style="left:6.875000000000001%;top:91.8125%;width:58.875%;height:2.2083333333333286%" data-text="GLANCE I DON'T THINK I EVER INTRODUCED MYSELF PROPERLY." onclick="showTextTooltip(event,this)" data-translation="OLHAR EU NÃO ACHO QUE JÁ ME APRESENTEI ADEQUADAMENTE." data-tips="💡 A tradução mais natural em português seria &quot;Eu acho que nunca me apresentei direito.&quot;

- **Vocabulário útil**: A palavra **properly** significa &quot;de forma adequada&quot; ou &quot;corretamente&quot;, e é útil em várias situações.
- **Exemplo**: Make sure you do the job properly. / Did you dress properly for the event?"></div><div class="text-hotspot" style="left:42.5%;top:94.64583333333333%;width:32.875%;height:.6979166666666714%" data-text="I AM BJORN, SON OF YANDEL." onclick="showTextTooltip(event,this)" data-translation="EU SOU BJORN, FILHO DE YANDEL."></div></div><div style="position:relative;width:100%;margin:0" oncontextmenu="event.preventDefault()"><img src="images/60/10.jpg" style="width:100%;display:block"><div class="text-hotspot" style="left:21.125%;top:.3994162378062831%;width:38%;height:1.0215838390045318%" data-text="THAT, I AM ALREADY AWARE OF." onclick="showTextTooltip(event,this)" data-translation="DISSO, EU JÁ ESTOU CIENTE."></div><div class="text-hotspot" style="left:30.75%;top:2.4502649973116215%;width:53.25%;height:1.3979568323219909%" data-text="THE LIBRARY IS ABOUT TO CLOSE. DO YOU STILL WANT TO GO IN?" onclick="showTextTooltip(event,this)" data-translation="A BIBLIOTECA ESTÁ PRESTES A FECHAR. VOCÊ AINDA QUER ENTRAR?" data-tips="💡 Em português, poderíamos dizer &quot;A biblioteca está quase fechando. Você ainda quer entrar?&quot;

- **Exemplo**: The show is about to start. / The train is about to leave."></div><div class="text-hotspot" style="left:52.37500000000001%;top:8.595130194331361%;width:26%;height:1.4133189953145402%" data-text="I'M NOT HERE FOR BOOKS TODAY." onclick="showTextTooltip(event,this)" data-translation="EU NÃO ESTOU AQUI POR LIVROS HOJE." data-tips="💡 A expressão 'I'm not here for books today' usa 'for' para indicar propósito ou razão da visita."></div><div class="text-hotspot" style="left:18.375%;top:17.505184730009983%;width:23%;height:.2381135263845149%" data-text="THEN...?" onclick="showTextTooltip(event,this)" data-translation="ENTÃO...?"></div><div class="text-hotspot" style="left:31.874999999999996%;top:21.929487671864198%;width:22.25%;height:1.036946001997081%" data-text="RAGNA LITANIAL PEPROK." onclick="showTextTooltip(event,this)" data-translation="RAGNA LITANIAL PEPROK."></div><div class="text-hotspot" style="left:17.875%;top:31.515477379214996%;width:41.125%;height:1.4286811583070897%" data-text="IT'S LITANIEL, BUT WHATEVER IS EASY FOR YOU." onclick="showTextTooltip(event,this)" data-translation="É LITANIEL, MAS COMO FOR MAIS FÁCIL PARA VOCÊ." data-tips="💡 'Whatever is easy for you' é uma forma casual de dizer que a escolha fica a critério da outra pessoa, similar a 'o que for mais fácil para você'."></div><div class="text-hotspot" style="left:53.625%;top:35.22543974191566%;width:32.375%;height:1.4594054842921884%" data-text="W-WELL THEN, I'LL JUST CALL YOU RAGNA." onclick="showTextTooltip(event,this)" data-translation="B-BEM, ENTÃO, EU VOU TE CHAMAR DE RAGNA."></div><div class="text-hotspot" style="left:11.5%;top:41.29349412397266%;width:64.875%;height:1.8050541516245486%" data-text="WHY DON'T YOU TEMPORARILY HOLD OFF ON THIS JOB AND COME TO THE LABYRINTH WITH ME--" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ NÃO SUSPENDE TEMPORARIAMENTE ESTE TRABALHO E VEM PARA O LABIRINTO COMIGO--" data-tips="💡 Em português, seria &quot;Por que você não adia temporariamente este trabalho e vem para o labirinto comigo?&quot;

- **Phrasal verb**: **Hold off** significa adiar ou suspender temporariamente algo.
- **Exemplo**: Let's hold off on making a decision until we have more information. / Can we hold off on the meeting until next week?"></div><div class="text-hotspot" style="left:31.374999999999996%;top:44.942007834703126%;width:39.375%;height:.3763729933174591%" data-text="I DECLINE." onclick="showTextTooltip(event,this)" data-translation="EU RECUSO."></div><div class="text-hotspot" style="left:18%;top:60.59605192411092%;width:64.375%;height:1.136800061448652%" data-text="I SEE. SO SHE DECLINED." onclick="showTextTooltip(event,this)" data-translation="EU VEJO. ENTÃO ELA RECUSOU." data-tips="💡 'So' é usado aqui como um conector para indicar conclusão ou resultado, similar a 'então' em português."></div><div class="text-hotspot" style="left:49.25%;top:66.71787387664183%;width:41.25%;height:.2381135263845149%" data-text="I UNDERSTAND." onclick="showTextTooltip(event,this)" data-translation="EU ENTENDO."></div><div class="text-hotspot" style="left:11.125%;top:76.96443659267224%;width:77.875%;height:1.912589292572394%" data-text="IF YOU ARE NOT QUALIFIED TO ENTER THE LABYRINTH, I CAN'T HELP IT." onclick="showTextTooltip(event,this)" data-translation="SE VOCÊ NÃO ESTÁ QUALIFICADA PARA ENTRAR NO LABIRINTO, NÃO POSSO AJUDAR." data-tips="💡 A tradução poderia ser &quot;Se você não está qualificado para entrar no labirinto, não há nada que eu possa fazer.&quot;
