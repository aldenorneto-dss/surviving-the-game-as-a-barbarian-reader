ÃO PELA QUAL OS AVENTUREIROS NÃO CONSIDERAM A FLORESTA DA BRUXA UM BOM LOCAL DE CAÇA." data-tips="💡 A expressão **&quot;the biggest reason why&quot;** é bastante usada para explicar a principal razão de algo. Em português, seria como dizer &quot;a maior razão pela qual&quot;. Essa estrutura é útil para enfatizar a causa mais importante de um evento ou situação.

- The biggest reason why I moved to the city is for work.
- The biggest reason why she left is because she was unhappy."></div><div class="text-hotspot" style="left:20.125%;top:19.036458333333332%;width:59.375%;height:.65625%" data-text="ITS EFFECT IS SIMPLE, YET DEVASTATING." onclick="showTextTooltip(event,this)" data-translation="SEU EFEITO É SIMPLES, MAS DEVASTADOR." data-tips="💡 A palavra **&quot;yet&quot;** neste contexto é usada para contrastar duas ideias. Em português, seria como &quot;mas&quot; ou &quot;no entanto&quot;. É uma forma de enfatizar que, apesar de algo ser simples, ainda pode ter um grande impacto.

- His plan is simple, yet effective.
- The solution is easy, yet powerful."></div><div class="text-hotspot" style="left:12.875%;top:25.567708333333332%;width:48.375%;height:1.0885416666666667%" data-text="IF ADVENTURERS STAY IN A SINGLE SPOT FOR A CERTAIN PERIOD OF TIME..." onclick="showTextTooltip(event,this)" data-translation="SE OS AVENTUREIROS FICAREM EM UM ÚNICO LUGAR POR UM CERTO PERÍODO DE TEMPO..." data-tips="💡 A estrutura **&quot;if... for a certain period of time&quot;** é usada para indicar uma condição que deve ser mantida por um tempo específico. Em português, seria &quot;se... por um certo período de tempo&quot;. Essa construção é comum para expressar condições temporais.

- If they wait for a certain period of time, the results will be clear."></div><div class="text-hotspot" style="left:33.125%;top:27.125%;width:53.37499999999999%;height:1.3229166666666667%" data-text="THEY ENCOUNTER A TIER-7 MONSTER CARNIVARO AT A HUNDRED PERCENT CHANCE." onclick="showTextTooltip(event,this)" data-translation="ELES ENCONTRAM UM MONSTRO DE NÍVEL 7, CARNIVARO, COM 100% DE CHANCE." data-tips="💡 O uso de **&quot;at a hundred percent chance&quot;** é uma forma de enfatizar certeza total. Em português, seria como dizer &quot;com 100% de chance&quot;. Essa expressão é útil para indicar que algo é absolutamente garantido.

- The sun will rise tomorrow at a hundred percent chance."></div><div class="text-hotspot" style="left:67.375%;top:41.24479166666667%;width:4.25%;height:.11979166666666666%" data-text="VILL" onclick="showTextTooltip(event,this)" data-translation="VILL"></div><div class="text-hotspot" style="left:25.25%;top:44.28125%;width:49.25%;height:1.1979166666666714%" data-text="AND THAT CERTAIN PERIOD OF TIME SHORTENS WITH EACH LEVEL OF THE FIELD DEBUFF." onclick="showTextTooltip(event,this)" data-translation="E ESSE CERTO PERÍODO DE TEMPO DIMINUI A CADA NÍVEL DO DEBUFF DE CAMPO." data-tips="💡 &quot;Shortens&quot; é o verbo que indica tornar algo mais curto. É útil em várias situações, por exemplo, &quot;The meeting was shortened due to time constraints.&quot;"></div><div class="text-hotspot" style="left:14.124999999999998%;top:51.27083333333333%;width:64.25%;height:.6822916666666666%" data-text="IT HAS BEEN 70 HOURS SINCE YOU HAVE ENTERED THE WITCH'S FOREST." onclick="showTextTooltip(event,this)" data-translation="FAZEM 70 HORAS DESDE QUE VOCÊ ENTROU NA FLORESTA DA BRUXA." data-tips="💡 &quot;It has been&quot; é usado para indicar a duração de uma ação que começou no passado e continua no presente, típico do present perfect."></div><div class="text-hotspot" style="left:18.25%;top:53.041666666666664%;width:70%;height:.421875%" data-text="FIELD EFFECT OF WITCH'S FOREST IS NOW AMPLIFIED." onclick="showTextTooltip(event,this)" data-translation="EFEITO DE CAMPO DA FLORESTA DA BRUXA AGORA ESTÁ AMPLIFICADO."></div><div class="text-hotspot" style="left:13.5%;top:55.041666666666664%;width:73.25%;height:.7447916666666667%" data-text="YOU ARE NOW AFFECTED BY STATUS EFFECT [WITCH'S EYE] LEVEL 5." onclick="showTextTooltip(event,this)" data-translation="VOCÊ AGORA ESTÁ AFETADO PELO EFEITO DE STATUS [OLHO DA BRUXA] NÍVEL 5."></div><div class="text-hotspot" style="left:29.25%;top:64.73958333333333%;width:41.5%;height:.4322916666666667%" data-text="DAY 3 IN THE WITCH'S FOREST, AFTERNOON" oncli t;. **We'd better** é uma forma contraída de **we had better**, que é uma expressão usada para dar conselhos ou sugerir que algo deve ser feito. Exemplo: *We'd better leave now if we want to catch the train.*"></div><div class="text-hotspot" style="left:26.625%;top:50.322916666666664%;width:48.25%;height:1.0572916666666785%" data-text="WHY AREN'T YOU DOING ANYTHING TO HER, BABE?" onclick="showTextTooltip(event,this)" data-translation="POR QUE VOCÊ NÃO FAZ NADA COM ELA, QUERIDO?" data-tips="💡 &quot;Why aren't you doing anything to her, babe?&quot; usa a estrutura negativa **aren't you** para questionar a ação de alguém. Em inglês, é comum usar a estrutura de pergunta negativa para expressar surpresa ou frustração. Exemplo: *Why aren't you helping him?*"></div><div class="text-hotspot" style="left:19.875%;top:59.390625%;width:9.375%;height:.3229166666666667%" data-text="?!" onclick="showTextTooltip(event,this)" data-translation="?!"></div><div class="text-hotspot" style="left:33%;top:65.92708333333334%;width:17.375%;height:.4218749999999858%" data-text="THIS VOICE...!" onclick="showTextTooltip(event,this)" data-translation="ESSA VOZ...!"></div><div class="text-hotspot" style="left:21.375%;top:76.27083333333333%;width:59.75%;height:1.4635416666666856%" data-text="YOU TOOK CARE OF THE BIGGEST PROBLEM SHE EVER HAD IN HER LIFE." onclick="showTextTooltip(event,this)" data-translation="VOCÊ RESOLVEU O MAIOR PROBLEMA QUE ELA JÁ TEVE NA VIDA." data-tips="💡 &quot;You took care of the biggest problem she ever had in her life.&quot; A expressão **took care of** significa resolver ou lidar com algo. É um phrasal verb comum que pode ser usado em várias situações. Exemplo: *I took care of the bills while you were away.*"></div><div class="text-hotspot" style="left:62.125%;top:79.71354166666667%;width:26.75%;height:.5%" data-text="245" onclick="showTextTooltip(event,this)" data-translation="245"></div><div class="text-hotspot" style="left:23.375%;top:85.765625%;width:48.375%;height: emplo: *She is afraid of spiders.*"></div><div class="text-hotspot" style="left:44.25%;top:25.072916666666668%;width:35.625%;height:.9583333333333333%" data-text="IT'S AS IF I CAN FEEL THE WARMTH OF HER BODY IF I GOT CLOSER--" onclick="showTextTooltip(event,this)" data-translation="É COMO SE EU PUDESSE SENTIR O CALOR DO CORPO DELA SE EU ME APROXIMASSE--" data-tips="💡 &quot;It's as if I can feel the warmth of her body if I got closer--&quot; usa a estrutura **as if** para criar uma comparação hipotética, semelhante a &quot;como se&quot; em português. Exemplo: *He acts as if he owns the place.*"></div><div class="text-hotspot" style="left:30.625000000000004%;top:26.458333333333332%;width:27.625%;height:.5364583333333334%" data-text="CHUCKLE" onclick="showTextTooltip(event,this)" data-translation="RISADA"></div><div class="text-hotspot" style="left:17.625%;top:27.375%;width:25.874999999999996%;height:.6822916666666666%" data-text="NAUGHTY, NAUGHTY BOY." onclick="showTextTooltip(event,this)" data-translation="MENINO MALVADO, MALVADO."></div><div class="text-hotspot" style="left:48.875%;top:35.03125%;width:40.375%;height:.4322916666666667%" data-text="WHAT ARE YOU IMAGINING?" onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ ESTÁ IMAGINANDO?"></div><div class="text-hotspot" style="left:33.25%;top:40.53645833333333%;width:45.375%;height:1.21875%" data-text="SHE'S ACTING THE WAY MY REAL EX WOULD HAVE, SINCE THIS ILLUSION IS BASED ON MY MEMORIES." onclick="showTextTooltip(event,this)" data-translation="ELA ESTÁ AGINDO COMO MINHA EX REAL AGIRIA, JÁ QUE ESSA ILUSÃO É BASEADA NAS MINHAS MEMÓRIAS." data-tips="💡 'Since' é usado aqui para indicar a razão, similar a 'já que' em português."></div><div class="text-hotspot" style="left:12%;top:49.203125%;width:39.75%;height:.9739583333333286%" data-text="THAT'S BEEN YOUR BIGGEST PROBLEM, BABE." onclick="showTextTooltip(event,this)" data-translation="ESSE TEM SIDO SEU MAIOR PROBLEMA, QUERIDO." data-tips="💡 &quot;That's been your biggest problem, babe.&quot; O uso do **present perfect** com **has been** indica uma ação ou estado que começou no passado e continua até o presente. Exemplo: *She has been very busy lately.*"></div><div class="text-hotspot" style="left:33.375%;top:50.48958333333333%;width:43.75%;height:.9479166666666714%" data-text="YOU ALWAYS TRY TO KNOW EVERY DAMN THING." onclick="showTextTooltip(event,this)" data-translation="VOCÊ SEMPRE TENTA SABER DE TUDO." data-tips="💡 'Every damn thing' é uma expressão coloquial que enfatiza a totalidade, mas é informal e pode ser substituída por 'everything'."></div><div class="text-hotspot" style="left:14.000000000000002%;top:55.91145833333333%;width:31.5%;height:.6927083333333428%" data-text="BUT THAT'S NOT FAIR." onclick="showTextTooltip(event,this)" data-translation="MAS ISSO NÃO É JUSTO."></div><div class="text-hotspot" style="left:19.75%;top:64.0625%;width:63.125%;height:1.1458333333333428%" data-text="BECAUSE YOU NEVER TELL ANYBODY ANYTHING ABOUT YOU." onclick="showTextTooltip(event,this)" data-translation="PORQUE VOCÊ NUNCA CONTA NADA SOBRE VOCÊ PARA NINGUÉM." data-tips="💡 'Never' é um advérbio de frequência que indica algo que não acontece em nenhum momento."></div><div class="text-hotspot" style="left:44%;top:70.29166666666666%;width:31.374999999999996%;height:.6979166666666666%" data-text="THE SAME COULD BE SAID ABOUT YOU." onclick="showTextTooltip(event,this)" data-translation="O MESMO PODERIA SER DITO SOBRE VOCÊ." data-tips="💡 &quot;The same could be said about you.&quot; A estrutura **could be said** é uma forma passiva que sugere que algo é possível ou provável. Exemplo: *The same could be said for many other cities.*"></div><div class="text-hotspot" style="left:35.125%;top:78.078125%;width:51.75%;height:1.2135416666666714%" data-text="WHAT DO YOU MEAN? THERE IS LITERALLY NOTHING YOU DO NOT KNOW ABOUT ME." onclick="showTextTooltip(event,this)" data-translation="O QUE VOCÊ QUER DIZER? NÃO HÁ NADA QUE VOCÊ NÃO SAIB
